<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dyktafon AI</title>
    <meta name="description" content="Dyktafon AI w przeglądarce — nagrywanie, dyktowanie mowy na tekst, tłumaczenie i czytanie na głos." />
    <meta name="theme-color" content="#6d28d9" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <script>
      // Motyw ustawiany PRZED pierwszym malowaniem. App.tsx robi to samo w useEffect,
      // ale useEffect biegnie po pierwszej klatce — użytkownik ciemnego motywu widział
      // wtedy białe mignięcie przy każdym starcie aplikacji.
      // Ten sam klucz i ta sama logika co readStoredTheme() w App.tsx.
      (function () {
        try {
          var dark = localStorage.getItem('theme') === 'dark';
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = dark ? '#0f172a' : '#f8fafc';
        } catch (e) {
          /* localStorage bywa zablokowany — wtedy zostaje jasny motyw, jak dotąd */
        }
      })();
    </script>
