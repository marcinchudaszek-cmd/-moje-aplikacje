 doskonałym nosem. Towarzyski wobec ludzi i psów, świetny dla rodzin.",tips:"Nos prowadzi go wszędzie — przywołanie trenuj długo, spaceruj na lince. Lubi wyć i szczekać.",health:"Padaczka, niedoczynność tarczycy, otyłość, zapalenia uszu."},{id:"husky",name:"Siberian husky",fci:5,origin:"Rosja (Syberia)",size:"duży",weight:"16–27",life:"12–15",energy:5,grooming:3,shedding:5,kids:4,training:2,barking:2,alone:2,apartment:2,desc:"Wytrzymały pies zaprzęgowy, przyjazny i niezależny. Raczej wyje niż szczeka.",tips:"Potrzebuje dużo biegania (bikejoring, canicross). Ma silny instynkt łowiecki i skłonność do ucieczek.",health:"Choroby oczu (zaćma, PRA), niedoczynność tarczycy."},{id:"pudel",name:"Pudel (miniaturowy / średni / duży)",fci:9,origin:"Francja",size:"średni",weight:"3–30",life:"12–16",energy:4,grooming:5,shedding:1,kids:4,training:5,barking:3,alone:2,apartment:4,desc:"Bardzo inteligentny, wesoły i wszechstronny. Nie linieje — często wybierany przez alergików.",tips:"Strzyżenie co 6–8 tygodni. Uwielbia naukę sztuczek i sporty kynologiczne.",health:"Choroby oczu, padaczka, choroba Addisona, skręt żołądka (duże)."},{id:"shih-tzu",name:"Shih tzu",fci:9,origin:"Tybet / Chiny",size:"mały",weight:"4,5–8",life:"12–16",energy:2,grooming:5,shedding:1,kids:4,training:2,barking:2,alone:3,apartment:5,desc:"Pogodny pies do towarzystwa, przyjazny dla wszystkich.",tips:"Codzienne czesanie lub krótka fryzura. Spinaj grzywkę nad oczami. Wrażliwy na upał.",health:"Problemy z oczami, BOAS, choroby zębów."},{id:"maltanczyk",name:"Maltańczyk",fci:9,origin:"Basen Morza Śródziemnego",size:"mini",weight:"3–4",life:"12–15",energy:3,grooming:5,shedding:1,kids:3,training:3,barking:3,alone:2,apartment:5,desc:"Delikatny, czuły i wesoły piesek o białej, jedwabistej sierści.",tips:"Czesanie codziennie, przemywanie okolic oczu (zacieki). Nie lubi długiej samotności.",health:"Choroby zębów, zwichnięcie rzepki, łzawienie oczu."},{id:"cavalier",name:"Cavalier king charles spaniel",fci:9,origin:"Wielka Brytania",size:"mały",weight:"5,5–8",life:"9–14",energy:3,grooming:3,shedding:3,kids:5,training:4,barking:2,alone:2,apartment:5,desc:"Łagodny, czuły i przyjazny każdemu. Idealny pies rodzinny do mieszkania.",tips:"Regularnie kontroluj serce u weterynarza. Czyść długie uszy.",health:"Choroba zastawki mitralnej, syringomielia."},{id:"bernenczyk",name:"Berneński pies pasterski",fci:2,origin:"Szwajcaria",size:"olbrzym",weight:"35–55",life:"7–10",energy:3,grooming:4,shedding:5,kids:5,training:4,barking:2,alone:2,apartment:1,desc:"Spokojny, łagodny olbrzym bardzo przywiązany do rodziny.",tips:"Źle znosi upał. U szczeniąt ogranicz forsowny ruch i schody — stawy rosną długo.",health:"Nowotwory, dysplazja, skręt żołądka; krótka długość życia."},{id:"rottweiler",name:"Rottweiler",fci:2,origin:"Niemcy",size:"duży",weight:"35–60",life:"9–10",energy:3,grooming:1,shedding:3,kids:3,training:4,barking:2,alone:3,apartment:2,desc:"Silny, pewny siebie i oddany obrońca. Spokojny w domu, czujny wobec obcych.",tips:"Wymaga doświadczonego opiekuna, wczesnej socjalizacji i szkolenia. W PL bywa na liście ras uznanych za agresywne — sprawdź wymogi zezwolenia.",health:"Dysplazja, nowotwory kości, choroby serca."},{id:"bokser",name:"Bokser",fci:2,origin:"Niemcy",size:"duży",weight:"25–32",life:"10–12",energy:5,grooming:1,shedding:2,kids:5,training:3,barking:2,alone:2,apartment:3,desc:"Energiczny, zabawny i oddany. Długo zachowuje szczenięcą radość.",tips:"Wrażliwy na upał i zimno. Potrzebuje dużo ruchu i zabawy.",health:"Kardiomiopatia, nowotwory, problemy z oddychaniem w upale."},{id:"doberman",name:"Doberman",fci:2,origin:"Niemcy",size:"duży",weight:"30–45",life:"10–12",energy:5,grooming:1,shedding:2,kids:4,training:5,barking:3,alone:2,apartment:2,desc:"Elegancki, szybki i bardzo pojętny. Czuły dla rodziny, czujny stróż.",tips:"Potrzebuje dużo ruchu i pracy węchowej lub posłuszeństwa. Marznie zimą.",health:"Kardiomiopatia rozstrzeniowa, choroba von Willebranda."},{id:"owczarek-podhalanski",name:"Polski owczarek podhalański",fci:1,origin:"Polska",size:"olbrzym",weight:"36–60",life:"10–12",energy:3,grooming:3,shedding:4,kids:4,training:2,barking:4,alone:4,apartment:1,desc:"Biały strażnik stad z Tatr. Niezależny, spokojny i czujny obrońca terenu.",tips:"Najlepiej czuje się z ogrodem. Decyduje samodzielnie — szkolenie oparte na zaufaniu, nie przymusie.",health:"Dysplazja bioder, skręt żołądka."},{id:"pon",name:"Polski owczarek nizinny (PON)",fci:1,origin:"Polska",size:"średni",weight:"14–22",life:"12–15",energy:4,grooming:4,shedding:2,kids:4,training:4,barking:3,alone:2,apartment:3,desc:"Bystry, czujny i pewny siebie pies pasterski o długiej, kudłatej sierści.",tips:"Regularne rozczesywanie, żeby nie powstawały kołtuny. Ma świetną pamięć — konsekwencja od szczeniaka.",health:"Dysplazja, choroby oczu, niedoczynność tarczycy."},{id:"gonczy-polski",name:"Gończy polski",fci:6,origin:"Polska",size:"średni",weight:"20–32",life:"12–14",energy:4,grooming:1,shedding:2,kids:4,training:3,barking:4,alone:3,apartment:2,desc:"Polska rasa gończa — wytrwała w tropieniu, łagodna w domu.",tips:"Silny instynkt tropienia: zabawy węchowe i spacery na lince. Charakterystyczne, donośne „granie”.",health:"Rasa ogólnie zdrowa; dysplazja sporadycznie."},{id:"chart-polski",name:"Chart polski",fci:10,origin:"Polska",size:"duży",weight:"27–40",life:"12–14",energy:4,grooming:1,shedding:2,kids:3,training:3,barking:2,alone:3,apartment:3,desc:"Najstarsza polska rasa chartów — mocniejsza od innych, spokojna w domu, błyskawiczna w biegu.",tips:"Bieganie tylko na ogrodzonym terenie — goni wzrokiem. W domu potrafi długo odpoczywać.",health:"Wrażliwość na niektóre leki znieczulające (mało tkanki tłuszczowej)."},{id:"corgi",name:"Welsh corgi pembroke",fci:1,origin:"Wielka Brytania",size:"mały",weight:"10–14",life:"12–15",energy:4,grooming:2,shedding:4,kids:4,training:4,barking:4,alone:3,apartment:4,desc:"Mały pies pasterski o dużej osobowości — wesoły, bystry i czujny.",tips:"Pilnuj wagi i kręgosłupa. Może podszczypywać pięty dzieci (instynkt pasterski).",health:"Dyskopatia, dysplazja, mielopatia zwyrodnieniowa."},{id:"aussie",name:"Owczarek australijski",fci:1,origin:"USA",size:"średni",weight:"16–32",life:"12–15",energy:5,grooming:3,shedding:4,kids:4,training:5,barking:3,alone:1,apartment:2,desc:"Energiczny pracuś pasterski, przywiązany do opiekuna i chętny do nauki.",tips:"Potrzebuje dużo ruchu i zadań. Merle × merle to ryzyko głuchoty i ślepoty u szczeniąt.",health:"Mutacja MDR1 (wrażliwość na leki), choroby oczu, padaczka."},{id:"cocker",name:"Cocker spaniel angielski",fci:8,origin:"Wielka Brytania",size:"średni",weight:"12–15",life:"12–15",energy:4,grooming:4,shedding:3,kids:4,training:4,barking:3,alone:2,apartment:4,desc:"Wesoły, czuły płochacz o merdającym ogonie i długich uszach.",tips:"Czyść i susz uszy po kąpieli. Regularne trymowanie sierści.",health:"Zapalenia uszu, choroby oczu, choroby nerek (rodzinna nefropatia)."},{id:"jack-russell",name:"Jack russell terrier",fci:3,origin:"Wielka Brytania",size:"mały",weight:"5–6",life:"13–16",energy:5,grooming:1,shedding:3,kids:3,training:3,barking:4,alone:2,apartment:3,desc:"Mały, ale niezmordowany. Odważny, sprytny i bardzo energiczny terier.",tips:"Potrzebuje dużo zabawy i wyzwań. Lubi kopać i gonić małe zwierzęta.",health:"Zwichnięcie rzepki, głuchota, choroba Legga-Calvégo-Perthesa."},{id:"west",name:"West highland white terrier",fci:3,origin:"Szkocja",size:"mały",weight:"6–10",life:"13–15",energy:3,grooming:4,shedding:1,kids:3,training:3,barking:4,alone:3,apartment:5,desc:"Wesoły biały terier o pewnym siebie, ale przyjaznym usposobieniu.",tips:"Trymowanie sierści co kilka miesięcy. Skłonny do alergii — pilnuj diety.",health:"Atopowe zapalenie skóry, choroby wątroby."},{id:"sznaucer-miniaturowy",name:"Sznaucer miniaturowy",fci:2,origin:"Niemcy",size:"mały",weight:"4–8",life:"12–15",energy:4,grooming:4,shedding:1,kids:4,training:4,barking:4,alone:3,apartment:5,desc:"Czujny, bystry i wesoły. Mało linieje i świetnie odnajduje się w mieście.",tips:"Trymowanie, czesanie brody i bokobrodów. Unikaj tłustego jedzenia (zapalenie trzustki).",health:"Zapalenie trzustki, kamienie moczowe, choroby oczu."},{id:"mops",name:"Mops",fci:9,origin:"Chiny",size:"mały",weight:"6–8",life:"12–15",energy:2,grooming:1,shedding:4,kids:4,training:3,barking:2,alone:3,apartment:5,desc:"Zabawny, towarzyski kanapowiec przywiązany do ludzi. Rasa krótkopyska.",tips:"Uważaj na upał i wysiłek, czyść fałdy na pysku. Bardzo łatwo tyje.",health:"BOAS, choroby oczu (wypadanie gałki, owrzodzenia), otyłość."},{id:"dalmatynczyk",name:"Dalmatyńczyk",fci:6,origin:"Chorwacja",size:"duży",weight:"24–32",life:"11–13",energy:5,grooming:1,shedding:4,kids:4,training:3,barking:2,alone:2,apartment:2,desc:"Wytrzymały, energiczny i przyjazny. Znany z charakterystycznych cętek.",tips:"Potrzebuje dużo biegania. Dieta niskopurynowa i dużo wody — skłonność do kamieni moczanowych.",health:"Głuchota, kamienie moczanowe."},{id:"akita",name:"Akita inu",fci:5,origin:"Japonia",size:"duży",weight:"32–45",life:"10–13",energy:3,grooming:3,shedding:5,kids:3,training:2,barking:1,alone:4,apartment:2,desc:"Godny, spokojny i bardzo lojalny pies o niezależnym charakterze.",tips:"Może nie tolerować innych psów tej samej płci. Dwa razy w roku intensywnie linieje.",health:"Choroby autoimmunologiczne (VKH), dysplazja, niedoczynność tarczycy."},{id:"shiba",name:"Shiba inu",fci:5,origin:"Japonia",size:"mały",weight:"8–11",life:"13–16",energy:3,grooming:2,shedding:4,kids:3,training:2,barking:2,alone:4,apartment:4,desc:"Czysty, niezależny i pewny siebie — kocie usposobienie w psim ciele.",tips:"Przywołanie bywa zawodne — spacery na smyczy. Słynny „krzyk shiby”, gdy coś mu się nie podoba.",health:"Alergie, zwichnięcie rzepki, jaskra."},{id:"samoyed",name:"Samojed",fci:5,origin:"Rosja (Syberia)",size:"duży",weight:"16–30",life:"12–14",energy:4,grooming:5,shedding:5,kids:5,training:3,barking:4,alone:2,apartment:2,desc:"Uśmiechnięty, przyjazny i towarzyski biały pies północy.",tips:"Gęsta sierść wymaga regularnego czesania i źle znosi upał. Nie strzyż na krótko.",health:"Dysplazja, nefropatia dziedziczna, cukrzyca."},{id:"bichon",name:"Bichon frise",fci:9,origin:"Francja / Belgia",size:"mini",weight:"3–5",life:"14–15",energy:3,grooming:5,shedding:1,kids:4,training:4,barking:3,alone:2,apartment:5,desc:"Wesoły, czuły i przyjazny „biały puszek”. Mało linieje.",tips:"Regularne strzyżenie i czesanie. Chętnie uczy się sztuczek.",health:"Alergie skórne, choroby zębów, kamienie moczowe."},{id:"pomeranian",name:"Szpic miniaturowy (pomeranian)",fci:5,origin:"Niemcy / Polska (Pomorze)",size:"mini",weight:"1,5–3",life:"12–16",energy:3,grooming:4,shedding:4,kids:2,training:3,barking:5,alone:3,apartment:5,desc:"Puszysta, energiczna kulka o dużej pewności siebie.",tips:"Czesanie kilka razy w tygodniu. Łatwo uczy się szczekania na wszystko — ucz spokoju od szczeniaka.",health:"Zapaść tchawicy, zwichnięcie rzepki, alopecja X."},{id:"wyzel-weimarski",name:"Wyżeł weimarski",fci:7,origin:"Niemcy",size:"duży",weight:"25–40",life:"11–14",energy:5,grooming:1,shedding:2,kids:4,training:4,barking:3,alone:1,apartment:2,desc:"Elegancki „srebrny duch” — wszechstronny pies myśliwski, bardzo przywiązany do ludzi.",tips:"Potrzebuje dużo ruchu i pracy węchowej. Źle znosi samotność.",health:"Skręt żołądka, dysplazja."},{id:"chart-angielski",name:"Greyhound",fci:10,origin:"Wielka Brytania",size:"duży",weight:"27–40",life:"10–14",energy:3,grooming:1,shedding:2,kids:4,training:3,barking:1,alone:3,apartment:4,desc:"Najszybszy pies świata, a w domu zaskakująco spokojny kanapowiec.",tips:"Krótkie sprinty na ogrodzonym terenie. Marznie — przyda się płaszczyk.",health:"Wrażliwość na środki znieczulające, nowotwory kości."},{id:"nowofundland",name:"Nowofundland",fci:2,origin:"Kanada",size:"olbrzym",weight:"54–68",life:"8–10",energy:2,grooming:4,shedding:5,kids:5,training:4,barking:1,alone:3,apartment:1,desc:"Łagodny olbrzym i znakomity pływak olko",name:"Kółeczko",cat:"sztuczki",level:1,minutes:3,goal:"Pies obraca się wokół własnej osi.",steps:["Smakołyk przy nosie, prowadź po kole.","Po pełnym obrocie — nagroda.","Zmniejszaj gest do ruchu palcem.","Ucz osobno w lewo i w prawo („kółko”, „hop”)."],tip:"Proste i efektowne — dobre na koniec sesji."},{id:"high-five",name:"Piątka",cat:"sztuczki",level:2,minutes:3,goal:"Pies przybija piątkę.",steps:["Naucz najpierw „łapa”.","Pokaż otwartą dłoń pionowo, na wysokości łapy.","Nagradzaj dotyk łapą.","Dodaj słowo „piątka”."],tip:"Przy małych psach kucnij, żeby nie musiały skakać."},{id:"szukaj",name:"Szukaj (węszenie)",cat:"sztuczki",level:1,minutes:10,goal:"Pies szuka ukrytych smakołyków nosem.",steps:["Pokaż, jak chowasz smakołyk tuż obok.","Powiedz „szukaj!” i pozwól znaleźć.","Chowaj coraz dalej, w innym pokoju, pod kubkiem.","Spróbuj matę węchową albo ukryj zabawkę."],tip:"10 minut węszenia męczy psa bardziej niż pół godziny spaceru."},{id:"spokoj",name:"Spokój przy drzwiach",cat:"zachowanie",level:3,minutes:10,goal:"Pies nie skacze na gości i nie szczeka bez końca.",steps:["Naucz najpierw „na miejsce”.","Poproś domownika o dzwonek — wyślij psa na miejsce, nagradzaj.","Otwieraj drzwi, gdy pies zostaje.","Gość wita psa dopiero, gdy ten ma 4 łapy na ziemi."],tip:"Skakanie nagradzane uwagą (nawet „nie wolno!”) się utrwala — ignoruj, nagradzaj spokój."},{id:"samotnosc",name:"Zostawanie samemu",cat:"zachowanie",level:3,minutes:10,goal:"Pies spokojnie czeka, gdy wychodzisz.",steps:["Daj gryzak lub kong i wyjdź do innego pokoju na chwilę.","Wracaj spokojnie, zanim pies zacznie się niepokoić.","Wydłużaj czas o kilka sekund do minut.","Ćwicz rytuał wyjścia (klucze, buty) bez wychodzenia.","Wyjścia i powroty bez emocjonalnych pożegnań."],tip:"Przy silnym lęku separacyjnym poradź się behawiorysty — to nie upór, tylko panika."},{id:"pazury",name:"Obcinanie pazurów bez stresu",cat:"zachowanie",level:2,minutes:5,goal:"Pies spokojnie znosi dotykanie łap i obcinanie pazurów."
