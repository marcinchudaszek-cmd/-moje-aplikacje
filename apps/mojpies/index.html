ni do spokojnego domu."}},{b:{id:"sheltie",name:"Owczarek szetlandzki (sheltie)",fci:1,origin:"Szkocja (Szetlandy)",size:"mały",weight:"6–12",life:"12–14",energy:4,grooming:4,shedding:4,kids:4,training:5,barking:4,alone:2,apartment:4,desc:"Mały, elegancki pies pasterski przypominający miniaturę collie — bystry, łagodny i bardzo przywiązany.",tips:"Uczy się błyskawicznie, ale bywa wrażliwy i nieśmiały wobec obcych — socjalizuj od szczeniaka. Lubi szczekać.",health:"Anomalia oka collie (CEA), mutacja MDR1, niedoczynność tarczycy."},i:{history:"Pochodzi z wysp Szetlandzkich, gdzie wszystko było małe — kuce, owce i psy. Pilnował owiec i odganiał ptaki od upraw. Przodkami były psy pasterskie skrzyżowane z collie i małymi psami do towarzystwa.",look:"Mały (35–37 cm), proporcjonalny pies o długiej, gęstej sierści z bujną grzywą. Umaszczenie sobolowe, trójkolorowe, blue merle, czarno-białe.",character:"Inteligentny, posłuszny, czuły i bardzo wrażliwy. Mocno związany z rodziną, wobec obcych zdystansowany. Czujny i chętnie szczeka.",exercise:"Około 1–1,5 godziny dziennie, chętnie agility, obedience i sztuczki.",grooming:"Szczotkowanie 2–3 razy w tygodniu, dokładnie za uszami i na portkach, gdzie tworzą się kołtuny.",forWhom:"Dla rodzin i osób w mieszkaniu, które lubią szkolić psa i zaakceptują sierść oraz szczekanie."}},{b:{id:"collie",name:"Owczarek szkocki długowłosy (collie)",fci:1,origin:"Szkocja",size:"duży",weight:"20–30",life:"12–14",energy:3,grooming:4,shedding:4,kids:5,training:5,barking:3,alone:2,apartment:3,desc:"Elegancki pies pasterski znany z filmów o Lassie — łagodny, wierny i świetny z dziećmi.",tips:"Przed podaniem leków przeciwpasożytniczych zrób test MDR1. Długa sierść wymaga regularnego czesania.",health:"Mutacja MDR1, anomalia oka collie, dermatomyositis."},i:{history:"Pasterski pies szkockich wyżyn, który w XIX wieku zachwycił królową Wiktorię i trafił na wystawy. Sławę światową przyniosła mu suka Lassie z powieści i filmów.",look:"Duży (51–61 cm), szlachetny pies o wąskiej, klinowatej głowie, półstojących uszach i obfitej, długiej sierści z grzywą. Sobolowy, trójkolorowy lub blue merle, z białym kołnierzem.",character:"Łagodny, wrażliwy, lojalny i niezwykle cierpliwy wobec dzieci. Inteligentny i chętny do współpracy, rzadko agresywny.",exercise:"Umiarkowany ruch: 1–1,5 godziny spacerów i zabaw dziennie.",grooming:"Szczotkowanie kilka razy w tygodniu, w czasie linienia codziennie.",forWhom:"Dla rodzin z dziećmi i osób szukających łagodnego, rodzinnego psa średnio aktywnego."}},{b:{id:"owczarek-szwajcarski",name:"Biały owczarek szwajcarski",fci:1,origin:"Szwajcaria",size:"duży",weight:"25–40",life:"12–14",energy:4,grooming:3,shedding:5,kids:4,training:4,barking:3,alone:2,apartment:2,desc:"Biały kuzyn owczarka niemieckiego — łagodniejszy, wrażliwy i bardzo rodzinny.",tips:"Dużo linieje i potrzebuje ruchu, ale jest mniej „ostry” niż owczarek niemiecki. Wrażliwy na krzyk.",health:"Dysplazja, mutacja MDR1, alergie skórne."},i:{history:"Białe szczenięta rodziły się w miotach owczarków niemieckich od początku, ale w połowie XX wieku wykluczono je z hodowli. Rasę odtworzono w USA i Kanadzie, a w Szwajcarii uznano ją za odrębną (FCI 2003).",look:"Duży, mocny pies o stojących uszach i czysto białej sierści — krótkiej lub półdługiej, z gęstym podszerstkiem.",character:"Przyjazny, czujny, łagodny i bardzo przywiązany do rodziny. Mniej obronny niż owczarek niemiecki, chętnie współpracuje.",exercise:"1,5–2 godziny dziennie, chętnie tropienie, obedience i wędrówki.",grooming:"Szczotkowanie kilka razy w tygodniu, w sezonie codziennie — sierść jest wszędzie.",forWhom:"Dla aktywnych rodzin z domem, które chcą łagodnego owczarka i nie boją się sierści."}},{b:{id:"owczarek-kaukaski",name:"Owczarek kaukaski",fci:2,origin:"Kaukaz",size:"olbrzym",weight:"45–80",life:"10–12",energy:2,grooming:3,shedding:4,kids:3,training:1,barking:4,alone:5,apartment:1,desc:"Potężny, nieustraszony strażnik stad i posesji o bardzo silnym instynkcie obronnym.",tips:"W Polsce na liście ras uznawanych za agresywne — potrzebne zezwolenie gminy. Tylko dla bardzo doświadczonych opiekunów.",health:"Dysplazja, otyłość, choroby serca."},i:{history:"Od wieków chronił stada owiec w górach Kaukazu przed wilkami i złodziejami. W ZSRR wykorzystywano go do pilnowania obiektów wojskowych i granic.",look:"Masywny olbrzym (do 75 cm) o szerokiej głowie i gęstej sierści, krótkiej lub długiej z grzywą. Umaszczenie szare, płowe, rude, łaciate.",character:"Niezależny, pewny siebie, nieufny wobec obcych i bezwzględnie terytorialny. Wobec rodziny spokojny, ale nie lubi narzucania woli.",exercise:"Nie potrzebuje sportu, ale wymaga przestrzeni do patrolowania i solidnego ogrodzenia.",grooming:"Szczotkowanie raz–dwa razy w tygodniu, w sezonie obfite linienie.",forWhom:"Dla doświadczonych właścicieli dużych, dobrze ogrodzonych posesji. Nie dla rodzin z małymi dziećmi i częstymi gośćmi."}},{b:{id:"cane-corso",name:"Cane corso",fci:2,origin:"Włochy",size:"duży",weight:"40–50",life:"9–12",energy:3,grooming:1,shedding:3,kids:3,training:3,barking:2,alone:3,apartment:2,desc:"Atletyczny włoski molos — spokojny w domu, czujny obrońca rodziny i posesji.",tips:"Wymaga starannej socjalizacji i konsekwentnego, spokojnego wychowania od szczeniaka.",health:"Dysplazja, skręt żołądka, wywinięcie powiek."},i:{history:"Potomek rzymskich psów bojowych, przez wieki pilnował gospodarstw w południowych Włoszech i polował na dziki. W latach 70. XX wieku uratowany przed wyginięciem przez włoskich entuzjastów.",look:"Duży (60–68 cm), muskularny, mniej ciężki niż mastif. Krótka, błyszcząca sierść — czarna, szara, płowa lub pręgowana.",character:"Spokojny, inteligentny, lojalny i opiekuńczy. Wobec obcych zdystansowany, wobec rodziny łagodny.",exercise:"1,5 godziny dziennie spacerów i zadań: posłuszeństwo, tropienie.",grooming:"Krótka sierść, mało pracy. Pilnuj wagi i stawów u rosnących psów.",forWhom:"Dla doświadczonych opiekunów z domem, którzy zapewnią szkolenie i kontakt z ludźmi."}},{b:{id:"buldog-angielski",name:"Buldog angielski",fci:2,origin:"Wielka Brytania",size:"średni",weight:"23–25",life:"8–10",energy:1,grooming:2,shedding:3,kids:4,training:2,barking:1,alone:3,apartment:5,desc:"Krępy, spokojny i dobroduszny symbol Anglii — wielki kanapowiec o łagodnym sercu.",tips:"Rasa brachycefaliczna: unikaj upału i wysiłku, czyść fałdy skórne. Wybieraj hodowle dbające o oddech.",health:"BOAS, dysplazja, problemy skórne, trudne porody (często cesarskie cięcie)."},i:{history:"Dawniej używany do okrutnych walk z bykami (bull-baiting). Po zakazie walk w 1835 roku hodowcy przekształcili go w łagodnego psa do towarzystwa.",look:"Niski, szeroki i ciężki pies z masywną głową, głębokimi fałdami, krótkim pyskiem i podgryzem. Krótka sierść, różne umaszczenia.",character:"Spokojny, przyjazny, uparty i bardzo oddany. Świetnie dogaduje się z dziećmi, rzadko szczeka.",exercise:"Krótkie, spokojne spacery — szczególnie ostrożnie latem.",grooming:"Codziennie czyść fałdy na pysku, regularnie kontroluj skórę i uszy.",forWhom:"Dla spokojnych osób w mieszkaniu, gotowych na wyższe koszty weterynaryjne."}},{b:{id:"shar-pei",name:"Shar pei",fci:2,origin:"Chiny",size:"średni",weight:"18–25",life:"8–12",energy:2,grooming:2,shedding:2,kids:3,training:2,barking:2,alone:4,apartment:4,desc:"Chiński pies o pomarszczonej skórze i „hipopotamim” pysku — niezależny, spokojny i lojalny.",tips:"Kontroluj fałdy skóry i oczy. Wymaga wczesnej socjalizacji z ludźmi i psami.",health:"Gorączka shar pei, podwinięcie powiek, choroby skóry i uszu."},i:{history:"Pochodzi z południowych Chin, gdzie był psem stróżującym, myśliwskim i — niestety — do walk. W latach 70. uznany za jedną z najrzadszych ras świata; uratowali go hodowcy z Hongkongu i USA.",look:"Średni, kwadratowy pies o luźnej, pofałdowanej skórze, małych uszach, szerokim pysku i niebieskoczarnym języku. Sierść krótka i szorstka.",character:"Spokojny, niezależny, czysty i przywiązany do rodziny. Wobec obcych podejrzliwy.",exercise:"Umiarkowane spacery, około godziny dziennie.",grooming:"Krótka sierść, ale fałdy i uszy wymagają regularnej kontroli.",forWhom:"Dla doświadczonych, spokojnych osób, które szanują niezależność psa."}},{b:{id:"bernardyn",name:"Bernardyn",fci:2,origin:"Szwajcaria",size:"olbrzym",weight:"65–90",life:"8–10",energy:2,grooming:3,shedding:4,kids:5,training:3,barking:2,alone:3,apartment:1,desc:"Legendarny alpejski ratownik — olbrzym o łagodnym, cierpliwym charakterze.",tips:"Ślini się i dużo je. Źle znosi upał. U szczeniąt ogranicz skoki i schody.",health:"Dysplazja, skręt żołądka, kardiomiopatia, problemy z powiekami."},i:{history:"Mnisi z hospicjum na przełęczy Wielkiej Świętej Bernarda trzymali te psy od XVII wieku. Pomagały odnajdywać zasypanych w śniegu wędrowców — słynny Barry uratował ponoć ponad 40 osób.",look:"Ogromny (70–90 cm), muskularny pies o szerokiej głowie, krótkiej lub półdługiej sierści biało-rudej z ciemną maską.",character:"Łagodny, przyjazny, spokojny i opiekuńczy wobec dzieci. Mimo rozmiarów rzadko jest agresywny.",exercise:"Umiarkowany ruch, spokojne spacery; lubi zimę.",grooming:"Szczotkowanie kilka razy w tygodniu, czyszczenie fałd przy pysku i oczu.",forWhom:"Dla rodzin z domem i ogrodem, w chłodniejszym klimacie, z budżetem na olbrzyma."}},{b:{id:"dog-niemiecki",name:"Dog niemiecki",fci:2,origin:"Niemcy",size:"olbrzym",weight:"50–90",life:"7–10",energy:3,grooming:1,shedding:3,kids:4,training:3,barking:2,alone:3,apartment:2,desc:"„Apollo wśród psów” — najwyższy z psów, elegancki i zaskakująco łagodny.",tips:"Kilka mniejszych posiłków i spokój po jedzeniu — wysokie ryzyko skrętu żołądka.",health:"Skręt żołądka, kardiomiopatia, nowotwory kości; krótka długość życia."},i:{history:"Powstał w Niemczech z dawnych psów do polowań na dziki i niedźwiedzie. Arystokracja trzymała je jako „psy komnatowe” chroniące panów nocą.",look:"Bardzo wysoki (72–90 cm), smukły i muskularny. Krótka sierść: płowa, pręgowana, czarna, niebieska lub arlekin.",character:"Łagodny, przyjazny, spokojny i bardzo przywiązany. Czasem nie zdaje sobie sprawy ze swojej wielkości.",exercise:"Umiarkowany ruch; u młodych psów bez forsownego biegania do 18 miesięcy.",grooming:"Krótka sierść — prosta pielęgnacja. Duże koszty karmy i leczenia.",forWhom:"Dla rodzin z przestrzenią, które zaakceptują krótkie życie i duży budżet."}},{b:{id:"leonberger",name:"Leonberger",fci:2,origin:"Niemcy",size:"olbrzym",weight:"45–75",life:"8–10",energy:3,grooming:4,shedding:5,kids:5,training:4,barking:2,alone:2,apartment:1,desc:"Lwia grzywa i serce przyjaciela — olbrzymi, łagodny pies rodzinny.",tips:"Uwielbia wodę. Długa sierść i ślinienie. Potrzebuje bliskości ludzi.",health:"Dysplazja, polineuropatia, nowotwory."},i:{history:"Wyhodował go w XIX wieku Heinrich Essig, burmistrz Leonbergu, by przypominał lwa z herbu miasta. Krzyżował bernardyny, nowofundlandy i psy pirenejskie.",look:"Olbrzymi (65–80 cm), harmonijny pies o półdługiej, wodoodpornej sierści płowej lub rudej z czarną maską i lwią grzywą.",character:"Spokojny, pewny siebie, przyjazny i cierpliwy. Doskonale dogaduje się z dziećmi.",exercise:"1–1,5 godziny dziennie, pływanie, spacery.",grooming:"Szczotkowanie kilka razy w tygodniu, obfite linienie.",forWhom:"Dla rodzin z domem i ogrodem, które chcą dużego, łagodnego towarzysza."}},{b:{id:"hovawart",name:"Hovawart",fci:2,origin:"Niemcy",size:"duży",weight:"25–40",life:"12–14",energy:4,grooming:3,shedding:3,kids:4,training:3,barking:3,alone:3,apartment:2,desc:"Wszechstronny niemiecki pies stróżujący — lojalny, pewny siebie i długowieczny.",tips:"Późno dojrzewa (nawet do 3 lat). Potrzebuje konsekwencji i zadań.",health:"Rasa ogólnie zdrowa; dysplazja, niedoczynność tarczycy."},i:{history:"Nazwa oznacza „strażnik dworu”. Opisywany w średniowiecznych kronikach, odtworzony na początku XX wieku przez Kurta Königa z psów wiejskich.",look:"Duży (58–70 cm), harmonijny pies o półdługiej, falistej sierści: czarnej, czarnej podpalanej lub blond.",character:"Czujny, lojalny, pewny siebie i niezależny. Opiekuńczy wobec rodziny, wobec obcych powściągliwy.",exercise:"1,5–2 godziny dziennie, tropienie, ratownictwo, obedience.",grooming:"Szczotkowanie raz–dwa razy w tygodniu.",forWhom:"Dla aktywnych osób z domem i doświadczeniem w wychowaniu psa."}},{b:{id:"sznaucer-sredni",name:"Sznaucer średni",fci:2,origin:"Niemcy",size:"średni",weight:"14–20",life:"13–15",energy:4,grooming:4,shedding:1,kids:4,training:4,barking:3,alone:3,apartment:4,desc:"Brodaty, bystry i czujny pies o szorstkiej sierści — oryginał, od którego pochodzą inne sznaucery.",tips:"Trymowanie 2–3 razy w roku. Lubi pracę i potrafi być uparty.",health:"Dysplazja, choroby oczu."},i:{history:"Dawny pies stajenny i gospodarski w Bawarii i Wirtembergii — łapał szczury i pilnował wozów. Nazwa pochodzi od niem. „Schnauze” — pysk.",look:"Kwadratowy, mocny pies (45–50 cm) o szorstkiej sierści z brodą i krzaczastymi brwiami. Pieprz i sól lub czarny.",character:"Inteligentny, czujny, energiczny i oddany. Dobry stróż.",exercise:"1,5 godziny dziennie, sporty kynologiczne.",grooming:"Trymowanie, czesanie brody.",forWhom:"Dla aktywnych rodzin, także alergików (mało linieje)."}},{b:{id:"pinczer-miniaturowy",name:"Pinczer miniaturowy",fci:2,origin:"Niemcy",size:"mini",weight:"4–6",life:"12–16",energy:4,grooming:1,shedding:2,kids:3,training:3,barking:4,alone:3,apartment:5,desc:"Mały, sprężysty pies o dumnym kroku — „król zabawek” pełen energii.",tips:"Marznie zimą. Potrafi uciec przez szparę w płocie.",health:"Zwichnięcie rzepki, choroba Legga-Calvégo-Perthesa."},i:{history:"Wywodzi się z niemieckich pinczerów hodowanych do tępienia gryzoni. Jest starszy od dobermana, z którym nie jest blisko spokrewniony.",look:"Miniaturowy (25–30 cm), elegancki pies o krótkiej, błyszczącej sierści czarnej podpalanej lub rudej. Charakterystyczny chód „konika”.",character:"Odważny, energiczny, ciekawski i czujny. Lubi rządzić.",exercise:"Godzina ruchu i zabaw dziennie.",grooming:"Bardzo prosta.",forWhom:"Dla energicznych osób w mieszkaniu."}},{b:{id:"amstaff",name:"Amerykański staffordshire terier",fci:3,origin:"USA",size:"średni",weight:"25–35",life:"12–16",energy:4,grooming:1,shedding:2,kids:4,training:4,barking:2,alone:2,apartment:3,desc:"Muskularny, pewny siebie i bardzo ludzki pies, który kocha swoją rodzinę.",tips:"Wczesna socjalizacja z psami jest kluczowa. Rasa nie jest na polskiej liście ras agresywnych.",health:"Dysplazja, ataksja móżdżkowa, alergie skórne."},i:{history:"Wywodzi się od angielskich bull terierów przywiezionych do USA w XIX wieku. W 1936 roku uznany jako rasa wystawowa, oddzielona od pit bulla.",look:"Średni (43–48 cm), bardzo muskularny pies o szerokiej głowie i krótkiej, błyszczącej sierści w różnych kolorach.",character:"Przyjazny wobec ludzi, oddany, pewny siebie i odważny. Bywa niechętny innym psom.",exercise:"1,5 godziny dziennie, zabawy siłowe, obedience, weight pulling.",grooming:"Bardzo prosta.",forWhom:"Dla konsekwentnych, aktywnych osób, które zadbają o socjalizację."}},{b:{id:"staffik",name:"Staffordshire bull terier",fci:3,origin:"Wielka Brytania",size:"średni",weight:"11–17",life:"12–14",energy:4,grooming:1,shedding:2,kids:5,training:3,barking:2,alone:2,apartment:4,desc:"Krępy, wesoły i niezwykle czuły „pies niania” — kocha dzieci i ludzi.",tips:"Pracuj nad relacjami z innymi psami. Potrzebuje dużo kontaktu z ludźmi.",health:"Zaćma dziedziczna, L-2-HGA (choroba metaboliczna)."},i:{history:"Powstał w XIX wieku w hrabstwie Staffordshire z buldogów i terierów. Po zakazie walk stał się ulubieńcem robotniczych rodzin.",look:"Średni (36–41 cm), krępy i muskularny, z szeroką głową i krótką sierścią.",character:"Odważny, wesoły, uczuciowy i niezwykle przywiązany do dzieci.",exercise:"Godzina–półtorej dziennie, zabawy z szarpakiem i aportem.",grooming:"Bardzo prosta.",forWhom:"Dla aktywnych rodzin, także w mieszkaniu."}},{b:{id:"bulterier",name:"Bulterier",fci:3,origin:"Wielka Brytania",size:"średni",weight:"20–30",life:"11–14",energy:4,grooming:1,shedding:2,kids:3,training:2,barking:2,alone:2,apartment:3,desc:"Pies o charakterystycznej jajowatej głowie — zabawny, uparty i pełen energii.",tips:"Wymaga konsekwencji i dużo ruchu. Bywa obsesyjny w zabawie (gonienie ogona).",health:"Głuchota (białe psy), choroby nerek i serca."},i:{history:"W połowie XIX wieku James Hinks wyhodował białego bulteriera jako „dżentelmena wśród psów”. Owalna głowa to efekt późniejszej selekcji.",look:"Mocny, muskularny pies o niepowtarzalnej jajowatej głowie, trójkątnych oczach i krótkiej sierści.",character:"Wesoły, odważny, uparty i bardzo przywiązany do ludzi.",exercise:"Godzina–półtorej dziennie, zabawy i ćwiczenia umysłowe.",grooming:"Bardzo prosta.",forWhom:"Dla doświadczonych osób z poczuciem humoru i cierpliwością."}},{b:{id:"cairn",name:"Cairn terrier",fci:3,origin:"Szkocja",size:"mały",weight:"6–8",life:"12–15",energy:4,grooming:2,shedding:2,kids:4,training:3,barking:4,alone:3,apartment:4,desc:"Mały szkocki terier, którego zna każdy jako Toto z „Czarnoksiężnika z krainy Oz”.",tips:"Uwielbia kopać. Trymowanie zamiast strzyżenia.",health:"Ogólnie zdrowy; choroby oczu, przepuklina."},i:{history:"Polował na lisy i gryzonie wśród kamiennych kopców (cairns) na szkockich wyżynach. Jeden z najstarszych terierów Szkocji.",look:"Mały (28–31 cm), krępy terier o szorstkiej sierści w kolorze piasku, szarym lub pręgowanym.",character:"Wesoły, odważny, ciekawski i niezależny.",exercise:"Godzina dziennie, zabawy węchowe.",grooming:"Trymowanie 2–3 razy w roku.",forWhom:"Dla rodzin i osób w mieszkaniu, które lubią spacery."}},{b:{id:"scottie",name:"Scottish terrier",fci:3,origin:"Szkocja",size:"mały",weight:"8–10",life:"11–13",energy:3,grooming:4,shedding:1,kids:3,training:2,barking:3,alone:4,apartment:4,desc:"Brodaty, dostojny Szkot — niezależny, odważny i lojalny.",tips:"Bywa uparty i zdystansowany. Regularne trymowanie.",health:"Kurcz szkockiego teriera, choroba von Willebranda, nowotwory pęcherza."},i:{history:"Pochodzi ze Szkocji, gdzie polował na lisy i borsuki. Ulubieniec prezydenta Roosevelta.",look:"Mały, niski pies o mocnej budowie, z brodą i brwiami. Czarny, pszeniczny lub pręgowany.",character:"Godny, niezależny, odważny i przywiązany do jednej osoby.",exercise:"Godzina spacerów dziennie.",grooming:"Trymowanie, czesanie brody.",forWhom:"Dla dorosłych osób ceniących niezależnego psa."}},{b:{id:"airedale",name:"Airedale terrier",fci:3,origin:"Wielka Brytania",size:"duży",weight:"20–30",life:"11–14",energy:5,grooming:3,shedding:1,kids:4,training:3,barking:3,alone:2,apartment:2,desc:"„Król terierów” — największy z terierów, wszechstronny i pełen zapału.",tips:"Potrzebuje dużo ruchu i zadań. Trymowanie kilka razy w roku.",health:"Dysplazja, niedoczynność tarczycy."},i:{history:"Powstał w dolinie rzeki Aire w Yorkshire do polowań na wydry i szczury. W I wojnie światowej służył jako posłaniec i pies sanitarny.",look:"Duży (56–61 cm) terier o szorstkiej, czarno-podpalanej sierści, z brodą.",character:"Odważny, inteligentny, wesoły i pewny siebie.",exercise:"2 godziny dziennie, chętnie tropienie i agility.",grooming:"Trymowanie 3–4 razy w roku.",forWhom:"Dla aktywnych rodzin z domem."}},{b:{id:"foksterier",name:"Foksterier szorstkowłosy",fci:3,origin:"Wielka Brytania",size:"mały",weight:"7–8",life:"13–15",energy:5,grooming:3,shedding:1,kids:3,training:3,barking:4,alone:2,apartment:3,desc:"Żywiołowy, odważny terier lisi — wieczny optymista pełen energii.",tips:"Silny instynkt łowiecki i kopanie. Potrzebuje dużo zajęć.",health:"Ogólnie zdrowy; choroby oczu, głuchota."},i:{history:"Wypłaszał lisy z nor podczas polowań konnych w Anglii. Odmiana szorstkowłosa uznana pod koniec XIX wieku.",look:"Mały (do 39 cm), kwadratowy terier o szorstkiej sierści, przeważnie białej z czarnymi i rudymi łatami.",character:"Energiczny, czujny, ciekawski i odważny.",exercise:"1,5–2 godziny dziennie.",grooming:"Trymowanie.",forWhom:"Dla aktywnych osób z cierpliwością do terierskiego temperamentu."}}],bg=[{b:{id:"springer",name:"Springer spaniel angielski",fci:8,origin:"Wielka Brytania",size:"średni",weight:"18–25",life:"12–14",energy:5,grooming:3,shedding:3,kids:5,training:4,barking:3,alone:2,apartment:3,desc:"Radosny, niestrudzony płochacz — świetny pies rodzinny i do pracy węchowej.",tips:"Linie użytkowe mają ogromne zapotrzebowanie na ruch. Suszenie uszu po kąpieli.",health:"Zapalenia uszu, dysplazja, choroby oczu (PRA)."},i:{history:"Nazwa od ang. „spring” — wypłaszać zwierzynę. Wywodzi się od dawnych spanieli lądowych, uznany w 1902 roku. Często używany jako pies do wykrywania narkotyków i materiałów wybuchowych.",look:"Średni (48–51 cm), zwarty pies o długich uszach i średniej długości sierści — wątrobiano-białej lub czarno-białej.",character:"Przyjazny, entuzjastyczny, chętny do współpracy i bardzo towarzyski.",exercise:"2 godziny dziennie: aport, pływanie, praca węchowa.",grooming:"Szczotkowanie 2–3 razy w tygodniu, przycinanie frędzli i uszu.",forWhom:"Dla aktywnych rodzin, które lubią spędzać czas na zewnątrz."}},{b:{id:"vizsla",name:"Wyżeł węgierski krótkowłosy (vizsla)",fci:7,origin:"Węgry",size:"duży",weight:"20–30",life:"12–15",energy:5,grooming:1,shedding:2,kids:4,training:4,barking:2,alone:1,apartment:2,desc:"Złoto-rudy, wrażliwy i niezwykle przywiązany wyżeł — prawdziwy „rzep”.",tips:"Źle znosi samotność. Potrzebuje dużo ruchu i bliskości.",health:"Ogólnie zdrowy; padaczka, dysplazja, alergie."},i:{history:"Towarzyszył węgierskiej szlachcie od średniowiecza jako pies do polowań z sokołami, a później jako wszechstronny wyżeł. Po II wojnie niemal wyginął.",look:"Elegancki, smukły pies (54–64 cm) o krótkiej, gęstej sierści w kolorze bułki pszennej i jasnych oczach.",character:"Czuły, łagodny, energiczny i wrażliwy. Mocno potrzebuje kontaktu z ludźmi.",exercise:"2 godziny dziennie: bieganie, canicross, aport.",grooming:"Bardzo prosta.",forWhom:"Dla aktywnych osób, które dużo czasu spędzają z psem."}},{b:{id:"wyzel-niemiecki",name:"Wyżeł niemiecki krótkowłosy",fci:7,origin:"Niemcy",size:"duży",weight:"25–32",life:"12–14",energy:5,grooming:1,shedding:3,kids:4,training:4,barking:3,alone:2,apartment:1,desc:"Wszechstronny pies myśliwski — w lesie, polu i wodzie, a w domu przyjacielski.",tips:"Ogromny popęd do pracy i biegania. Silny instynkt łowiecki.",health:"Dysplazja, skręt żołądka, padaczka."},i:{history:"Wyhodowany w XIX wieku w Niemczech jako pies „do wszystkiego”: wystawia zwierzynę, aportuje i tropi.",look:"Atletyczny, szlachetny pies (58–66 cm) o krótkiej, szorstkiej sierści — brązowej lub dereszowatej.",character:"Energiczny, inteligentny, przyjazny i chętny do pracy.",exercise:"2+ godziny dziennie intensywnego ruchu.",grooming:"Prosta.",forWhom:"Dla myśliwych i bardzo aktywnych osób z domem."}},{b:{id:"seter-irlandzki",name:"Seter irlandzki",fci:7,origin:"Irlandia",size:"duży",weight:"25–32",life:"12–15",energy:5,grooming:3,shedding:3,kids:4,training:3,barking:2,alone:2,apartment:2,desc:"Mahoniowy elegant o radosnym usposobieniu — wieczny optymista.",tips:"Długo dojrzewa. Wymaga dużo ruchu i cierpliwości w szkoleniu.",health:"Skręt żołądka, PRA, niedoczynność tarczycy."},i:{history:"Pies do wystawiania ptactwa w Irlandii, znany od XVIII wieku. Mahoniowe umaszczenie utrwalono w XIX wieku.",look:"Smukły, szlachetny pies (58–67 cm) o jedwabistej, mahoniowej sierści z frędzlami.",character:"Wesoły, przyjacielski, energiczny i trochę roztrzepany.",exercise:"2 godziny dziennie, najlepiej na otwartych przestrzeniach.",grooming:"Szczotkowanie 2–3 razy w tygodniu.",forWhom:"Dla aktywnych rodzin z przestrzenią."}},{b:{id:"basset",name:"Basset hound",fci:6,origin:"Francja / Wielka Brytania",size:"średni",weight:"20–30",life:"10–12",energy:2,grooming:2,shedding:3,kids:5,training:2,barking:4,alone:3,apartment:4,desc:"Niski gończy o długich uszach i smutnym spojrzeniu — spokojny, łagodny i uparty.",tips:"Nos prowadzi go wszędzie. Pilnuj wagi i kręgosłupa.",health:"Dyskopatia, zapalenia uszu, jaskra, otyłość."},i:{history:"Wywodzi się od francuskich psów gończych o skróconych łapach (basset — niski). Polował na zające, idąc wolno przed pieszym myśliwym.",look:"Niski (33–38 cm), ciężki pies o długich uszach, luźnej skórze i krótkiej sierści.",character:"Łagodny, spokojny, przyjazny i uparty. Głośno szczeka i wyje.",exercise:"Godzina spokojnych spacerów z węszeniem.",grooming:"Czyszczenie uszu i fałd.",forWhom:"Dla spokojnych rodzin, cierpliwych do uporu."}},{b:{id:"bloodhound",name:"Posokowiec św. Huberta (bloodhound)",fci:6,origin:"Belgia",size:"duży",weight:"40–50",life:"10–12",energy:3,grooming:2,shedding:3,kids:4,training:2,barking:4,alone:3,apartment:1,desc:"Najlepszy węch świata — łagodny olbrzym tropiący ślady sprzed wielu dni.",tips:"Spacery tylko na smyczy lub lince. Ślini się.",health:"Skręt żołądka, problemy z powiekami i uszami."},i:{history:"Hodowany od średniowiecza przez mnichów z opactwa św. Huberta w Ardenach. Jego zeznania (tropy) uznawano w amerykańskich sądach.",look:"Duży pies (58–69 cm) o luźnej, pofałdowanej skórze, długich uszach i krótkiej sierści.",character:"Łagodny, cierpliwy, uparty i niezwykle wytrwały na tropie.",exercise:"1,5 godziny, najlepiej mantrailing.",grooming:"Czyszczenie fałd i uszu.",forWhom:"Dla miłośników tropienia z domem i ogrodem."}},{b:{id:"ridgeback",name:"Rhodesian ridgeback",fci:6,origin:"Afryka Południowa",size:"duży",weight:"32–36",life:"10–12",energy:4,grooming:1,shedding:2,kids:4,training:3,barking:2,alone:3,apartment:2,desc:"Afrykański „pies na lwy” z pręgą sierści na grzbiecie — dostojny i lojalny.",tips:"Niezależny; wymaga konsekwencji. Silny instynkt łowiecki.",health:"Zatoka skórzasta (dermoid sinus), dysplazja."},i:{history:"Powstał w południowej Afryce z psów kolonistów i lokalnych psów Khoikhoi. Grupa ridgebacków potrafiła zatrzymać lwa do przybycia myśliwego.",look:"Duży (61–69 cm), atletyczny pies o krótkiej, pszenicznej sierści i charakterystycznym grzebieniu sierści rosnącej pod włos wzdłuż grzbietu.",character:"Spokojny, pewny siebie, lojalny i zdystansowany wobec obcych.",exercise:"1,5–2 godziny dziennie, bieganie.",grooming:"Bardzo prosta.",forWhom:"Dla doświadczonych, aktywnych osób."}},{b:{id:"ogar-polski",name:"Ogar polski",fci:6,origin:"Polska",size:"duży",weight:"25–32",life:"12–14",energy:3,grooming:1,shedding:2,kids:4,training:3,barking:4,alone:3,apartment:2,desc:"Polski pies gończy o donośnym głosie — spokojny w domu, wytrwały na tropie.",tips:"Ma melodyjny, głośny głos. Spacery na lince — nos jest silniejszy od komend.",health:"Rasa ogólnie zdrowa."},i:{history:"Znany w Polsce od średniowiecza; opisywał go m.in. Jan Szytier w XIX wieku. Po II wojnie odtworzony przez Piotra Kartawika.",look:"Masywny pies (55–65 cm) o długich uszach, luźnej skórze i krótkiej sierści czarnej z rdzawym podpalaniem.",character:"Łagodny, spokojny, zrównoważony i przywiązany do rodziny.",exercise:"Długie spacery i praca węchowa.",grooming:"Prosta.",forWhom:"Dla miłośników lasu i polskich ras."}},{b:{id:"whippet",name:"Whippet",fci:10,origin:"Wielka Brytania",size:"średni",weight:"11–14",life:"12–15",energy:3,grooming:1,shedding:2,kids:4,training:3,barking:1,alone:3,apartment:5,desc:"Mały chart — błyskawiczny na torze, w domu cichy i przytulaśny.",tips:"Marznie — przyda się płaszczyk. Sprinty tylko w ogrodzonym terenie.",health:"Ogólnie zdrowy; wrażliwość na znieczulenie."},i:{history:"Wyhodowany w XIX wieku przez górników z północnej Anglii do wyścigów i polowań na króliki. Nazywano go „chartem biedaka”.",look:"Smukły, elegancki pies (44–51 cm) o krótkiej, delikatnej sierści w każdym umaszczeniu.",character:"Łagodny, spokojny, czuły i cichy.",exercise:"Spacery i kilka sprintów tygodniowo.",grooming:"Minimalna.",forWhom:"Dla spokojnych osób w mieszkaniu."}},{b:{id:"chart-afganski",name:"Chart afgański",fci:10,origin:"Afganistan",size:"duży",weight:"23–27",life:"12–14",energy:3,grooming:5,shedding:2,kids:3,training:1,barking:2,alone:3,apartment:3,desc:"Arystokrata o jedwabistej sierści — niezależny, dumny i elegancki.",tips:"Długa sierść wymaga częstej kąpieli i czesania. Przywołanie bywa zawodne.",health:"Zaćma, niedoczynność tarczycy."},i:{history:"Polował w górach Afganistanu na antylopy i zające. Do Europy trafił na początku XX wieku.",look:"Wysoki (63–74 cm) chart o długiej, jedwabistej sierści i zakręconym końcu ogona.",character:"Niezależny, dumny, zdystansowany, w domu łagodny.",exercise:"Bieganie na ogrodzonym terenie.",grooming:"Bardzo wymagająca.",forWhom:"Dla osób ceniących niezależność i z czasem na pielęgnację."}},{b:{id:"basenji",name:"Basenji",fci:5,origin:"Afryka Środkowa",size:"mały",weight:"9–11",life:"13–14",energy:4,grooming:1,shedding:1,kids:3,training:2,barking:1,alone:3,apartment:4,desc:"„Pies, który nie szczeka” — za to jodłuje. Czysty, niezależny i sprytny.",tips:"Myje się jak kot. Mistrz ucieczek i niszczenia z nudów.",health:"Zespół Fanconiego (nerki), PRA."},i:{history:"Jedna z najstarszych ras świata, znana ze starożytnego Egiptu. Plemiona Konga używały go do polowań z sieciami.",look:"Mały (40–43 cm), smukły pies o zmarszczonym czole, stojących uszach i ogonie zakręconym w obwarzanek.",character:"Niezależny, inteligentny, czysty i ciekawski.",exercise:"Godzina–półtorej ruchu dziennie.",grooming:"Minimalna, prawie nie pachnie.",forWhom:"Dla osób cierpliwych, ceniących kotowatego psa."}},{b:{id:"malamut",name:"Alaskan malamute",fci:5,origin:"USA (Alaska)",size:"duży",weight:"34–39",life:"10–14",energy:4,grooming:3,shedding:5,kids:4,training:2,barking:2,alone:2,apartment:1,desc:"Potężny pies zaprzęgowy Arktyki — silny, przyjazny i niezależny.",tips:"Ogromne linienie dwa razy w roku. Źle znosi upał.",health:"Dysplazja, polineuropatia, karłowatość chondrodysplastyczna."},i:{history:"Hodowany przez lud Malemiut na Alasce do ciągnięcia ciężkich sań. Brał udział w wyprawach polarnych.",look:"Duży (58–64 cm), masywny pies o gęstej sierści, stojących uszach i puszystym ogonie.",character:"Przyjazny, lojalny, niezależny i uparty.",exercise:"2 godziny dziennie, ciągnięcie, w chłodne dni.",grooming:"Szczotkowanie kilka razy w tygodniu.",forWhom:"Dla aktywnych osób w chłodnym klimacie."}},{b:{id:"chow-chow",name:"Chow chow",fci:5,origin:"Chiny",size:"średni",weight:"20–32",life:"9–15",energy:2,grooming:4,shedding:4,kids:2,training:2,barking:1,alone:4,apartment:4,desc:"Lwia grzywa i niebieski język — dostojny, niezależny i zdystansowany.",tips:"Wczesna socjalizacja. Nie lubi, gdy obcy go dotykają.",health:"Podwinięcie powiek, dysplazja, problemy skórne."},i:{history:"Jedna z najstarszych ras Chin — pies stróżujący, myśliwski i ciągnący wozy. Do Europy trafił w XVIII wieku.",look:"Średni, krępy pies o gęstej sierści z grzywą, niebiesko-czarnym językiem i sztywnym chodzie.",character:"Godny, spokojny, lojalny wobec jednej osoby, zdystansowany wobec reszty.",exercise:"Spokojne spacery.",grooming:"Szczotkowanie kilka razy w tygodniu.",forWhom:"Dla dorosłych, spokojnych osób."}},{b:{id:"szpic-niemiecki",name:"Szpic niemiecki (średni i mały)",fci:5,origin:"Niemcy",size:"mały",weight:"4–11",life:"13–15",energy:3,grooming:4,shedding:4,kids:4,training:3,barking:5,alone:3,apartment:4,desc:"Puszysty, czujny i wesoły pies o lisiej główce — dawny strażnik gospodarstw.",tips:"Chętnie szczeka. Wymaga regularnego czesania, nie strzyż na krótko.",health:"Zwichnięcie rzepki, choroby zębów."},i:{history:"Jedna z najstarszych ras Europy Środkowej — pilnował chłopskich zagród, wozów i barek. Występuje w kilku wielkościach.",look:"Mały lub średni pies o gęstej, odstającej sierści z kryzą, stojących uszach i ogonie na grzbiecie.",character:"Czujny, żywy, przywiązany do rodziny i nieufny wobec obcych.",exercise:"Godzina spacerów i zabaw.",grooming:"Szczotkowanie 2–3 razy w tygodniu.",forWhom:"Dla rodzin w mieszkaniu lub domu."}},{b:{id:"papillon",name:"Papillon (kontynentalny spaniel miniaturowy)",fci:9,origin:"Francja / Belgia",size:"mini",weight:"2–5",life:"13–16",energy:4,grooming:3,shedding:2,kids:3,training:5,barking:3,alone:2,apartment:5,desc:"Piesek o uszach jak skrzydła motyla — bystry, wesoły i bardzo pojętny.",tips:"Świetny w agility i sztuczkach. Delikatny — uważaj na upadki.",health:"Zwichnięcie rzepki, choroby zębów."},i:{history:"Ulubieniec europejskich dworów od XVI wieku, widoczny na obrazach Tycjana i Rubensa. Nazwa od fr. „papillon” — motyl.",look:"Mały (20–28 cm) pies o długiej, jedwabistej sierści i dużych, frędzlastych uszach.",character:"Wesoły, inteligentny, czujny i przyjacielski.",exercise:"Godzina ruchu i sztuczki.",grooming:"Szczotkowanie 2 razy w tygodniu, brak podszerstka.",forWhom:"Dla aktywnych osób w mieszkaniu."}},{b:{id:"pekinczyk",name:"Pekińczyk",fci:9,origin:"Chiny",size:"mini",weight:"3–6",life:"12–14",energy:1,grooming:5,shedding:4,kids:2,training:2,barking:3,alone:4,apartment:5,desc:"Mały „lew” cesarskich Chin — dostojny, uparty i niezależny.",tips:"Rasa brachycefaliczna — uważaj na upał. Długa sierść wymaga codziennej pielęgnacji.",health:"BOAS, choroby oczu, dyskopatia."},i:{history:"Przez wieki był psem cesarskiego dworu w Pekinie, którego nie wolno było wywozić. Do Europy trafił po złupieniu Pałacu Letniego w 1860 roku.",look:"Mały, krępy pies o płaskim pysku, bujnej grzywie i długiej sierści.",character:"Godny, odważny, uparty i lojalny wobec opiekuna.",exercise:"Krótkie spacery.",grooming:"Codzienne czesanie, czyszczenie fałdy nosowej.",forWhom:"Dla spokojnych dorosłych osób."}},{b:{id:"lhasa",name:"Lhasa apso",fci:9,origin:"Tybet",size:"mały",weight:"6–8",life:"12–15",energy:3,grooming:5,shedding:1,kids:3,training:2,barking:4,alone:3,apartment:5,desc:"Tybetański strażnik klasztorów — mały, czujny i niezależny.",tips:"Zdystansowany wobec obcych, dobry „dzwonek alarmowy”.",health:"Choroby oczu, nerek (dysplazja nerkowa)."},i:{history:"Przez wieki pilnował tybetańskich klasztorów i domów w Lhasie, ostrzegając szczekaniem przed obcymi.",look:"Mały (25 cm), długi pies o ciężkiej, prostej sierści opadającej na oczy.",character:"Niezależny, pewny siebie, czujny i lojalny.",exercise:"Godzina spacerów.",grooming:"Codzienne czesanie lub krótka fryzura.",forWhom:"Dla dorosłych osób w mieszkaniu."}},{b:{id:"hawanczyk",name:"Hawańczyk",fci:9,origin:"Kuba",size:"mini",weight:"4–6",life:"14–16",energy:3,grooming:4,shedding:1,kids:5,training:4,barking:2,alone:2,apartment:5,desc:"Kubański bichon — wesoły, przytulaśny i bardzo towarzyski.",tips:"Nie znosi samotności. Mało linieje.",health:"Zwichnięcie rzepki, choroby oczu."},i:{history:"Narodowy pies Kuby, przywieziony przez hiszpańskich osadników. Po rewolucji odbudowany w USA z kilkunastu psów.",look:"Mały (23–27 cm) pies o miękkiej, falistej sierści w różnych kolorach.",character:"Wesoły, czuły, inteligentny i towarzyski.",exercise:"Godzina zabaw i spacerów.",grooming:"Czesanie kilka razy w tygodniu.",forWhom:"Dla rodzin z dziećmi i seniorów."}},{b:{id:"coton",name:"Coton de Tuléar",fci:9,origin:"Madagaskar",size:"mini",weight:"4–6",life:"14–16",energy:3,grooming:4,shedding:1,kids:5,training:4,barking:2,alone:2,apartment:5,desc:"Biały, „bawełniany” piesek z Madagaskaru — wesoły, łagodny i zabawny.",tips:"Sierść jak wata wymaga czesania. Nie lubi samotności.",health:"Ogólnie zdrowy; zwichnięcie rzepki."},i:{history:"Królewski pies Madagaskaru z portu Tuléar, przodków przywieźli żeglarze. Do Europy trafił w latach 70.",look:"Mały (25–28 cm) pies o miękkiej, bawełnianej, białej sierści.",character:"Wesoły, łagodny, towarzyski i inteligentny.",exercise:"Godzina zabaw.",grooming:"Czesanie kilka razy w tygodniu.",forWhom:"Dla rodzin, alergików i seniorów."}},{b:{id:"boston",name:"Boston terrier",fci:9,origin:"USA",size:"mały",weight:"5–11",life:"11–13",energy:3,grooming:1,shedding:2,kids:5,training:4,barking:2,alone:3,apartment:5,desc:"„Amerykański dżentelmen” w smokingu — wesoły, łagodny i towarzyski.",tips:"Krótki pysk — uważaj na upał. Wypukłe oczy łatwo urazić.",health:"BOAS, choroby oczu, głuchota."},i:{history:"Powstał w Bostonie pod koniec XIX wieku z buldogów i terierów. Jedna z pierwszych ras wyhodowanych w USA.",look:"Mały, zwarty pies o kwadratowej głowie, krótkiej sierści czarno-białej lub pręgowanej z białym.",character:"Wesoły, przyjazny, inteligentny i łagodny.",exercise:"Godzina spacerów i zabaw.",grooming:"Bardzo prosta.",forWhom:"Dla rodzin w mieście."}}],kg={0:"Nieuznane przez FCI",1:"I – owczarki i psy pasterskie",2:"II – pinczery, sznaucery, molosy, psy szwajcarskie",3:"III – teriery",4:"IV – jamniki",5:"V – szpice i psy w typie pierwotnym",6:"VI – psy gończe i posokowce",7:"VII – wyżły",8:"VIII – aportery, płochacze, psy wodne",9:"IX – psy ozdobne i do towarzystwa",10:"X – charty"},vz=[{id:"labrador",name:"Labrador retriever",fci:8,origin:"Wielka Brytania",size:"duży",weight:"25–36",life:"10–12",energy:4,grooming:2,shedding:4,kids:5,training:5,barking:2,alone:2,apartment:3,desc:"Przyjazny, łagodny i chętny do współpracy. Jeden z najpopularniejszych psów rodzinnych i asystujących.",tips:"Kocha jedzenie — pilnuj porcji, łatwo tyje. Potrzebuje codziennego ruchu i aportowania; uwielbia wodę.",health:"Dysplazja bioder i łokci, otyłość, choroby oczu (PRA)."},{id:"golden",name:"Golden retriever",fci:8,origin:"Wielka Brytania",size:"duży",weight:"25–34",life:"10–12",energy:4,grooming:3,shedding:4,kids:5,training:5,barking:2,alone:2,apartment:3,desc:"Ciepły, cierpliwy i bardzo towarzyski. Świetnie sprawdza się w rodzinie z dziećmi i jako pies terapeutyczny.",tips:"Szczotkowanie 2–3 razy w tygodniu. Długo zachowuje szczenięcy charakter — potrzebuje zajęcia dla głowy.",health:"Dysplazja, nowotwory, choroby skóry i uszu."},{id:"owczarek-niemiecki",name:"Owczarek niemiecki",fci:1,origin:"Niemcy",size:"duży",weight:"22–40",life:"9–13",energy:5,grooming:3,shedding:5,kids:4,training:5,barking:3,alone:2,apartment:2,desc:"Inteligentny, lojalny i odważny. Pies służbowy, stróżujący i sportowy — przywiązuje się mocno do opiekuna.",tips:"Wymaga konsekwentnego szkolenia i pracy umysłowej. Wczesna socjalizacja chroni przed nadmierną czujnością.",health:"Dysplazja bioder, mielopatia zwyrodnieniowa, skręt żołądka."},{id:"border-collie",name:"Border collie",fci:1,origin:"Wielka Brytania",size:"średni",weight:"14–20",life:"12–15",energy:5,grooming:3,shedding:3,kids:4,training:5,barking:3,alone:1,apartment:1,desc:"Uważany za najinteligentniejszą rasę. Pies pasterski o ogromnej potrzebie pracy i współpracy.",tips:"Bez codziennych zadań (agility, obedience, frisbee, węszenie) szybko się nudzi i wymyśla własne zajęcia.",health:"Anomalia oka collie (CEA), padaczka, dysplazja."},{id:"jamnik",name:"Jamnik",fci:4,origin:"Niemcy",size:"mały",weight:"4–11",life:"12–16",energy:3,grooming:2,shedding:2,kids:3,training:2,barking:4,alone:3,apartment:5,desc:"Odważny, uparty i pełen charakteru pies norowiec. Występuje w odmianach krótko-, długo- i szorstkowłosej.",tips:"Chroń kręgosłup: unikaj skakania z kanapy i schodów, utrzymuj szczupłą sylwetkę. Szkolenie wymaga cierpliwości.",health:"Dyskopatia, otyłość, choroby zębów."},{id:"yorkshire",name:"Yorkshire terrier",fci:3,origin:"Wielka Brytania",size:"mini",weight:"2–3,5",life:"13–16",energy:3,grooming:5,shedding:1,kids:2,training:3,barking:4,alone:3,apartment:5,desc:"Mały pies z temperamentem teriera — czujny, pewny siebie i przywiązany do domowników.",tips:"Długa sierść wymaga codziennego czesania lub regularnego strzyżenia. Dbaj o zęby — szybko odkłada się kamień.",health:"Choroby zębów, zwichnięcie rzepki, zapaść tchawicy."},{id:"buldog-francuski",name:"Buldog francuski",fci:9,origin:"Francja",size:"mały",weight:"8–14",life:"10–12",energy:2,grooming:1,shedding:2,kids:4,training:3,barking:1,alone:3,apartment:5,desc:"Towarzyski, zabawny i spokojny pies do mieszkania. Rasa brachycefaliczna (krótkopyska).",tips:"Unikaj wysiłku w upale — łatwo się przegrzewa. Czyść fałdy skóry. Nie pływa dobrze — pilnuj przy wodzie.",health:"Zespół BOAS (trudności z oddychaniem), alergie skórne, problemy z kręgosłupem."},{id:"chihuahua",name:"Chihuahua",fci:9,origin:"Meksyk",size:"mini",weight:"1,5–3",life:"14–18",energy:3,grooming:1,shedding:2,kids:2,training:3,barking:4,alone:3,apartment:5,desc:"Najmniejsza rasa świata. Odważna, przywiązana zwykle do jednej osoby.",tips:"Marznie zimą — przyda się ubranko. Uważaj przy małych dzieciach, bo łatwo o uraz.",health:"Zwichnięcie rzepki, choroby zębów, hipoglikemia u szczeniąt."},{id:"beagle",name:"Beagle",fci:6,origin:"Wielka Brytania",size:"średni",weight:"9–14",life:"12–15",energy:4,grooming:1,shedding:3,kids:5,training:2,barking:5,alone:2,apartment:3,desc:"Wesoły pies gończy z doskonałym nosem. Towarzyski wobec ludzi i psów, świetny dla rodzin.",tips:"Nos prowadzi go wszędzie — przywołanie trenuj długo, spaceruj na lince. Lubi wyć i szczekać.",health:"Padaczka, niedoczynność tarczycy, otyłość, zapalenia uszu."},{id:"husky",name:"Siberian husky",fci:5,origin:"Rosja (Syberia)",size:"duży",weight:"16–27",life:"12–15",energy:5,grooming:3,shedding:5,kids:4,training:2,barking:2,alone:2,apartment:2,desc:"Wytrzymały pies zaprzęgowy, przyjazny i niezależny. Raczej wyje niż szczeka.",tips:"Potrzebuje dużo biegania (bikejoring, canicross). Ma silny instynkt łowiecki i skłonność do ucieczek.",health:"Choroby oczu (zaćma, PRA), niedoczynność tarczycy."},{id:"pudel",name:"Pudel (miniaturowy / średni / duży)",fci:9,origin:"Francja",size:"średni",weight:"3–30",life:"12–16",energy:4,grooming:5,shedding:1,kids:4,training:5,barking:3,alone:2,apartment:4,desc:"Bardzo inteligentny, wesoły i wszechstronny. Nie linieje — często wybierany przez alergików.",tips:"Strzyżenie co 6–8 tygodni. Uwielbia naukę sztuczek i sporty kynologiczne.",health:"Choroby oczu, padaczka, choroba Addisona, skręt żołądka (duże)."},{id:"shih-tzu",name:"Shih tzu",fci:9,origin:"Tybet / Chiny",size:"mały",weight:"4,5–8",life:"12–16",energy:2,grooming:5,shedding:1,kids:4,training:2,barking:2,alone:3,apartment:5,desc:"Pogodny pies do towarzystwa, przyjazny dla wszystkich.",tips:"Codzienne czesanie lub krótka fryzura. Spinaj grzywkę nad oczami. Wrażliwy na upał.",health:"Problemy z oczami, BOAS, choroby zębów."},{id:"maltanczyk",name:"Maltańczyk",fci:9,origin:"Basen Morza Śródziemnego",size:"mini",weight:"3–4",life:"12–15",energy:3,grooming:5,shedding:1,kids:3,training:3,barking:3,alone:2,apartment:5,desc:"Delikatny, czuły i wesoły piesek o białej, jedwabistej sierści.",tips:"Czesanie codziennie, przemywanie okolic oczu (zacieki). Nie lubi długiej samotności.",health:"Choroby zębów, zwichnięcie rzepki, łzawienie oczu."},{id:"cavalier",name:"Cavalier king charles spaniel",fci:9,origin:"Wielka Brytania",size:"mały",weight:"5,5–8",life:"9–14",energy:3,grooming:3,shedding:3,kids:5,training:4,barking:2,alone:2,apartment:5,desc:"Łagodny, czuły i przyjazny każdemu. Idealny pies rodzinny do mieszkania.",tips:"Regularnie kontroluj serce u weterynarza. Czyść długie uszy.",health:"Choroba zastawki mitralnej, syringomielia."},{id:"bernenczyk",name:"Berneński pies pasterski",fci:2,origin:"Szwajcaria",size:"olbrzym",weight:"35–55",life:"7–10",energy:3,grooming:4,shedding:5,kids:5,training:4,barking:2,alone:2,apartment:1,desc:"Spokojny, łagodny olbrzym bardzo przywiązany do rodziny.",tips:"Źle znosi upał. U szczeniąt ogranicz forsowny ruch i schody — stawy rosną długo.",health:"Nowotwory, dysplazja, skręt żołądka; krótka długość życia."},{id:"rottweiler",name:"Rottweiler",fci:2,origin:"Niemcy",size:"duży",weight:"35–60",life:"9–10",energy:3,grooming:1,shedding:3,kids:3,training:4,barking:2,alone:3,apartment:2,desc:"Silny, pewny siebie i oddany obrońca. Spokojny w domu, czujny wobec obcych.",tips:"Wymaga doświadczonego opiekuna, wczesnej socjalizacji i szkolenia. W PL bywa na liście ras uznanych za agresywne — sprawdź wymogi zezwolenia.",health:"Dysplazja, nowotwory kości, choroby serca."},{id:"bokser",name:"Bokser",fci:2,origin:"Niemcy",size:"duży",weight:"25–32",life:"10–12",energy:5,grooming:1,shedding:2,kids:5,training:3,barking:2,alone:2,apartment:3,desc:"Energiczny, zabawny i oddany. Długo zachowuje szczenięcą radość.",tips:"Wrażliwy na upał i zimno. Potrzebuje dużo ruchu i zabawy.",health:"Kardiomiopatia, nowotwory, problemy z oddychaniem w upale."},{id:"doberman",name:"Doberman",fci:2,origin:"Niemcy",size:"duży",weight:"30–45",life:"10–12",energy:5,grooming:1,shedding:2,kids:4,training:5,barking:3,alone:2,apartment:2,desc:"Elegancki, szybki i bardzo pojętny. Czuły dla rodziny, czujny stróż.",tips:"Potrzebuje dużo ruchu i pracy węchowej lub posłuszeństwa. Marznie zimą.",health:"Kardiomiopatia rozstrzeniowa, choroba von Willebranda."},{id:"owczarek-podhalanski",name:"Polski owczarek podhalański",fci:1,origin:"Polska",size:"olbrzym",weight:"36–60",life:"10–12",energy:3,grooming:3,shedding:4,kids:4,training:2,barking:4,alone:4,apartment:1,desc:"Biały strażnik stad z Tatr. Niezależny, spokojny i czujny obrońca terenu.",tips:"Najlepiej czuje się z ogrodem. Decyduje samodzielnie — szkolenie oparte na zaufaniu, nie przymusie.",health:"Dysplazja bioder, skręt żołądka."},{id:"pon",name:"Polski owczarek nizinny (PON)",fci:1,origin:"Polska",size:"średni",weight:"14–22",life:"12–15",energy:4,grooming:4,shedding:2,kids:4,training:4,barking:3,alone:2,apartment:3,desc:"Bystry, czujny i pewny siebie pies pasterski o długiej, kudłatej sierści.",tips:"Regularne rozczesywanie, żeby nie powstawały kołtuny. Ma świetną pamięć — konsekwencja od szczeniaka.",health:"Dysplazja, choroby oczu, niedoczynność tarczycy."},{id:"gonczy-polski",name:"Gończy polski",fci:6,origin:"Polska",size:"średni",weight:"20–32",life:"12–14",energy:4,grooming:1,shedding:2,kids:4,training:3,barking:4,alone:3,apartment:2,desc:"Polska rasa gończa — wytrwała w tropieniu, łagodna w domu.",tips:"Silny instynkt tropienia: zabawy węchowe i spacery na lince. Charakterystyczne, donośne „granie”.",health:"Rasa ogólnie zdrowa; dysplazja sporadycznie."},{id:"chart-polski",name:"Chart polski",fci:10,origin:"Polska",size:"duży",weight:"27–40",life:"12–14",energy:4,grooming:1,shedding:2,kids:3,training:3,barking:2,alone:3,apartment:3,desc:"Najstarsza polska rasa chartów — mocniejsza od innych, spokojna w domu, błyskawiczna w biegu.",tips:"Bieganie tylko na ogrodzonym terenie — goni wzrokiem. W domu potrafi długo odpoczywać.",health:"Wrażliwość na niektóre leki znieczulające (mało tkanki tłuszczowej)."},{id:"corgi",name:"Welsh corgi pembroke",fci:1,origin:"Wielka Brytania",size:"mały",weight:"10–14",life:"12–15",energy:4,grooming:2,shedding:4,kids:4,training:4,barking:4,alone:3,apartment:4,desc:"Mały pies pasterski o dużej osobowości — wesoły, bystry i czujny.",tips:"Pilnuj wagi i kręgosłupa. Może podszczypywać pięty dzieci (instynkt pasterski).",health:"Dyskopatia, dysplazja, mielopatia zwyrodnieniowa."},{id:"aussie",name:"Owczarek australijski",fci:1,origin:"USA",size:"średni",weight:"16–32",life:"12–15",energy:5,grooming:3,shedding:4,kids:4,training:5,barking:3,alone:1,apartment:2,desc:"Energiczny pracuś pasterski, przywiązany do opiekuna i chętny do nauki.",tips:"Potrzebuje dużo ruchu i zadań. Merle × merle to ryzyko głuchoty i ślepoty u szczeniąt.",health:"Mutacja MDR1 (wrażliwość na leki), choroby oczu, padaczka."},{id:"cocker",name:"Cocker spaniel angielski",fci:8,origin:"Wielka Brytania",size:"średni",weight:"12–15",life:"12–15",energy:4,grooming:4,shedding:3,kids:4,training:4,barking:3,alone:2,apartment:4,desc:"Wesoły, czuły płochacz o merdającym ogonie i długich uszach.",tips:"Czyść i susz uszy po kąpieli. Regularne trymowanie sierści.",health:"Zapalenia uszu, choroby oczu, choroby nerek (rodzinna nefropatia)."},{id:"jack-russell",name:"Jack russell terrier",fci:3,origin:"Wielka Brytania",size:"mały",weight:"5–6",life:"13–16",energy:5,grooming:1,shedding:3,kids:3,training:3,barking:4,alone:2,apartment:3,desc:"Mały, ale niezmordowany. Odważny, sprytny i bardzo energiczny terier.",tips:"Potrzebuje dużo zabawy i wyzwań. Lubi kopać i gonić małe zwierzęta.",health:"Zwichnięcie rzepki, głuchota, choroba Legga-Calvégo-Perthesa."},{id:"west",name:"West highland white terrier",fci:3,origin:"Szkocja",size:"mały",weight:"6–10",life:"13–15",energy:3,grooming:4,shedding:1,kids:3,training:3,barking:4,alone:3,apartment:5,desc:"Wesoły biały terier o pewnym siebie, ale przyjaznym usposobieniu.",tips:"Trymowanie sierści co kilka miesięcy. Skłonny do alergii — pilnuj diety.",health:"Atopowe zapalenie skóry, choroby wątroby."},{id:"sznaucer-miniaturowy",name:"Sznaucer miniaturowy",fci:2,origin:"Niemcy",size:"mały",weight:"4–8",life:"12–15",energy:4,grooming:4,shedding:1,kids:4,training:4,barking:4,alone:3,apartment:5,desc:"Czujny, bystry i wesoły. Mało linieje i świetnie odnajduje się w mieście.",tips:"Trymowanie, czesanie brody i bokobrodów. Unikaj tłustego jedzenia (zapalenie trzustki).",health:"Zapalenie trzustki, kamienie moczowe, choroby oczu."},{id:"mops",name:"Mops",fci:9,origin:"Chiny",size:"mały",weight:"6–8",life:"12–15",energy:2,grooming:1,shedding:4,kids:4,training:3,barking:2,alone:3,apartment:5,desc:"Zabawny, towarzyski kanapowiec przywiązany do ludzi. Rasa krótkopyska.",tips:"Uważaj na upał i wysiłek, czyść fałdy na pysku. Bardzo łatwo tyje.",health:"BOAS, choroby oczu (wypadanie gałki, owrzodzenia), otyłość."},{id:"dalmatynczyk",name:"Dalmatyńczyk",fci:6,origin:"Chorwacja",size:"duży",weight:"24–32",life:"11–13",energy:5,grooming:1,shedding:4,kids:4,training:3,barking:2,alone:2,apartment:2,desc:"Wytrzymały, energiczny i przyjazny. Znany z charakterystycznych cętek.",tips:"Potrzebuje dużo biegania. Dieta niskopurynowa i dużo wody — skłonność do kamieni moczanowych.",health:"Głuchota, kamienie moczanowe."},{id:"akita",name:"Akita inu",fci:5,origin:"Japonia",size:"duży",weight:"32–45",life:"10–13",energy:3,grooming:3,shedding:5,kids:3,training:2,barking:1,alone:4,apartment:2,desc:"Godny, spokojny i bardzo lojalny pies o niezależnym charakterze.",tips:"Może nie tolerować innych psów tej samej płci. Dwa razy w roku intensywnie linieje.",health:"Choroby autoimmunologiczne (VKH), dysplazja, niedoczynność tarczycy."},{id:"shiba",name:"Shiba inu",fci:5,origin:"Japonia",size:"mały",weight:"8–11",life:"13–16",energy:3,grooming:2,shedding:4,kids:3,training:2,barking:2,alone:4,apartment:4,desc:"Czysty, niezależny i pewny siebie — kocie usposobienie w psim ciele.",tips:"Przywołanie bywa zawodne — spacery na smyczy. Słynny „krzyk shiby”, gdy coś mu się nie podoba.",health:"Alergie, zwichnięcie rzepki, jaskra."},{id:"samoyed",name:"Samojed",fci:5,origin:"Rosja (Syberia)",size:"duży",weight:"16–30",life:"12–14",energy:4,grooming:5,shedding:5,kids:5,training:3,barking:4,alone:2,apartment:2,desc:"Uśmiechnięty, przyjazny i towarzyski biały pies północy.",tips:"Gęsta sierść wymaga regularnego czesania i źle znosi upał. Nie strzyż na krótko.",health:"Dysplazja, nefropatia dziedziczna, cukrzyca."},{id:"bichon",name:"Bichon frise",fci:9,origin:"Francja / Belgia",size:"mini",weight:"3–5",life:"14–15",energy:3,grooming:5,shedding:1,kids:4,training:4,barking:3,alone:2,apartment:5,desc:"Wesoły, czuły i przyjazny „biały puszek”. Mało linieje.",tips:"Regularne strzyżenie i czesanie. Chętnie uczy się sztuczek.",health:"Alergie skórne, choroby zębów, kamienie moczowe."},{id:"pomeranian",name:"Szpic miniaturowy (pomeranian)",fci:5,origin:"Niemcy / Polska (Pomorze)",size:"mini",weight:"1,5–3",life:"12–16",energy:3,grooming:4,shedding:4,kids:2,training:3,barking:5,alone:3,apartment:5,desc:"Puszysta, energiczna kulka o dużej pewności siebie.",tips:"Czesanie kilka razy w tygodniu. Łatwo uczy się szczekania na wszystko — ucz spokoju od szczeniaka.",health:"Zapaść tchawicy, zwichnięcie rzepki, alopecja X."},{id:"wyzel-weimarski",name:"Wyżeł weimarski",fci:7,origin:"Niemcy",size:"duży",weight:"25–40",life:"11–14",energy:5,grooming:1,shedding:2,kids:4,training:4,barking:3,alone:1,apartment:2,desc:"Elegancki „srebrny duch” — wszechstronny pies myśliwski, bardzo przywiązany do ludzi.",tips:"Potrzebuje dużo ruchu i pracy węchowej. Źle znosi samotność.",health:"Skręt żołądka, dysplazja."},{id:"chart-angielski",name:"Greyhound",fci:10,origin:"Wielka Brytania",size:"duży",weight:"27–40",life:"10–14",energy:3,grooming:1,shedding:2,kids:4,training:3,barking:1,alone:3,apartment:4,desc:"Najszybszy pies świata, a w domu zaskakująco spokojny kanapowiec.",tips:"Krótkie sprinty na ogrodzonym terenie. Marznie — przyda się płaszczyk.",health:"Wrażliwość na środki znieczulające, nowotwory kości."},{id:"nowofundland",name:"Nowofundland",fci:2,origin:"Kanada",size:"olbrzym",weight:"54–68",life:"8–10",energy:2,grooming:4,shedding:5,kids:5,training:4,barking:1,alone:3,apartment:1,desc:"Łagodny olbrzym i znakomity pływak — pies ratownik wodny.",tips:"Ślini się. Uwielbia wodę. Upał bywa dla niego niebezpieczny.",health:"Dysplazja, podzastawkowe zwężenie aorty, cystynuria."},{id:"mieszaniec",name:"Mieszaniec",fci:0,origin:"cały świat",size:"średni",weight:"różnie",life:"12–16",energy:3,grooming:2,shedding:3,kids:4,training:4,barking:3,alone:3,apartment:4,desc:"Każdy jest inny! Mieszańce ze schronisk to często najwdzięczniejsi przyjaciele.",tips:"Zapytaj w schronisku o charakter konkretnego psa — wiek i historia mówią więcej niż wygląd.",health:"Zwykle mniej chorób dziedzicznych niż u ras czystych."}],nc=[...vz,...vg.map(x=>x.b),...bg.map(x=>x.b)],bz=["mini","mały","średni","duży","olbrzym"],_g=[{key:"energy",label:"Energia"},{key:"training",label:"Łatwość szkolenia"},{key:"kids",label:"Z dziećmi"},{key:"apartment",label:"Do mieszkania"},{key:"alone",label:"Znosi samotność"},{key:"grooming",label:"Pielęgnacja"},{key:"shedding",label:"Linienie"},{key:"barking",label:"Szczekliwość"}],ng={podstawy:"Podstawy",codzienne:"Na co dzień",sztuczki:"Sztuczki",zachowanie:"Dobre maniery"},ag=["Nie zaczęte","Uczymy się","Prawie umie","Opanowane"],ou=[{id:"kliker",name:"Ładowanie klikera",cat:"podstawy",level:1,minutes:3,goal:"Pies wie, że kliknięcie = nagroda.",steps:["Przygotuj 10–15 małych smakołyków.","Kliknij i od razu (w ciągu sekundy) daj smakołyk.","Powtórz 10–15 razy, pies nie musi nic robić.","Sprawdź: kliknij, gdy pies patrzy w bok — jeśli odwraca się do ciebie, kliker jest „naładowany”."],tip:"Klik zaznacza moment dobrego zachowania — zawsze po nim nagroda, nawet jak kliknąłeś za wcześnie."},{id:"imie",name:"Reakcja na imię",cat:"podstawy",level:1,minutes:3,goal:"Pies patrzy na ciebie, gdy słyszy swoje imię.",steps:["W cichym miejscu powiedz imię psa raz, radosnym tonem.","Gdy spojrzy — klik/„tak!” i nagroda.","Powtarzaj w różnych pokojach, potem na podwórku.","Stopniowo dodawaj rozproszenia."],tip:"Nie powtarzaj imienia w kółko i nie używaj go do karcenia."},{id:"siad",name:"Siad",cat:"podstawy",level:1,minutes:5,goal:"Pies siada na komendę i zostaje, aż go zwolnisz.",steps:["Trzymaj smakołyk przy nosie psa.","Powoli przesuń rękę nad jego głową do tyłu — pupa sama opadnie.","W chwili, gdy dotknie ziemi: klik/„tak!” i nagroda.","Gdy robi to płynnie, dodaj słowo „siad” tuż przed ruchem ręki.","Stopniowo zmniejszaj gest, aż wystarczy samo słowo."],tip:"Nie dociskaj pupy ręką — pies ma sam wymyślić, co się opłaca."},{id:"waruj",name:"Waruj (leżeć)",cat:"podstawy",level:1,minutes:5,goal:"Pies kładzie się na komendę.",steps:["Zacznij z pozycji siad.","Smakołyk przy nosie przesuń pionowo w dół, między łapy, potem lekko do przodu.","Gdy łokcie dotkną ziemi — nagroda.","Dodaj słowo „waruj”, potem zmniejszaj gest."],tip:"Jeśli pies wstaje, prowadź rękę wolniej albo ćwicz pod swoją nogą jak pod „tunelem”."},{id:"zostan",name:"Zostań",cat:"podstawy",level:2,minutes:5,goal:"Pies zostaje w miejscu mimo twojego ruchu.",steps:["Pies w siadzie lub warowaniu.","Pokaż otwartą dłoń, powiedz „zostań”, odczekaj 1 sekundę, nagródź.","Wydłużaj czas (3 zasady: czas, odległość, rozproszenia — zwiększaj tylko jedną naraz).","Zrób krok w tył i wróć, nagroda w miejscu.","Kończ słowem zwalniającym („wolne!”)."],tip:"Zawsze wracaj do psa z nagrodą — nie wołaj go z „zostań”, bo pomieszasz dwie komendy."},{id:"do-mnie",name:"Do mnie (przywołanie)",cat:"podstawy",level:2,minutes:5,goal:"Pies przybiega od razu, nawet gdy coś go zajmuje.",steps:["Zacznij w domu: odejdź parę kroków, powiedz radośnie „do mnie!”.","Gdy przybiegnie — świętuj, najlepszy smakołyk.","Ćwicz na długiej lince w parku.","Dodawaj rozproszenia stopniowo.","Nigdy nie wołaj, żeby zrobić coś nieprzyjemnego (kąpiel, koniec spaceru)."],tip:"Przywołanie to najważniejsza komenda — nagroda zawsze ekstra."},{id:"noga",name:"Chodzenie na luźnej smyczy",cat:"codzienne",level:2,minutes:10,goal:"Pies idzie obok, smycz nie jest napięta.",steps:["Nagradzaj przy nodze, gdy smycz jest luźna.","Gdy pies ciągnie — zatrzymaj się jak słup.","Ruszaj, gdy smycz się poluzuje.","Zmieniaj kierunek, nagradzaj, gdy podąża.","Ćwicz najpierw w nudnych miejscach."],tip:"Szelki zamiast obroży przy psach ciągnących. Krótkie, częste sesje."},{id:"zostaw",name:"Zostaw",cat:"codzienne",level:2,minutes:5,goal:"Pies odpuszcza jedzenie lub przedmiot z ziemi.",steps:["Zamknij smakołyk w pięści, pokaż psu.","Pies liże i szturcha — czekaj.","Gdy odsunie nos — nagroda z DRUGIEJ ręki.","Dodaj słowo „zostaw”.","Potem smakołyk na podłodze pod stopą, wreszcie odkryty."],tip:"Pies nigdy nie dostaje tego, co ma zostawić — nagroda zawsze z innego miejsca."},{id:"pusc",name:"Puść",cat:"codzienne",level:2,minutes:5,goal:"Pies oddaje zabawkę lub przedmiot z pyska.",steps:["Pobaw się szarpakiem.","Przestań ruszać zabawką, pokaż smakołyk przy nosie.","Gdy puści — „puść”, nagroda i od razu oddaj zabawkę.","Powtarzaj — pies uczy się, że oddanie nie kończy zabawy."],tip:"Nie wyrywaj siłą — to uczy psa uciekania z łupem."},{id:"miejsce",name:"Na miejsce",cat:"codzienne",level:2,minutes:10,goal:"Pies idzie na posłanie i się tam relaksuje.",steps:["Rzuć smakołyk na posłanie, nagradzaj za wejście.","Nagradzaj za położenie się na posłaniu.","Dodaj słowo „na miejsce”.","Wydłużaj czas, połącz z „zostań”.","Ćwicz, gdy dzwoni dzwonek do drzwi."],tip:"Posłanie ma być miłe — nigdy nie używaj go jako kary."},{id:"lapa",name:"Daj łapę",cat:"sztuczki",level:1,minutes:3,goal:"Pies podaje łapę.",steps:["Pies w siadzie, smakołyk w zamkniętej dłoni przy ziemi.","Gdy dotknie dłoni łapą — klik i nagroda.","Podnoś dłoń coraz wyżej i otwieraj.","Dodaj słowo „łapa”, potem „druga”."],tip:"Świetna sztuczka na rozgrzewkę przed obcinaniem pazurów."},{id:"turlaj",name:"Turlaj się",cat:"sztuczki",level:2,minutes:5,goal:"Pies przewraca się na bok i wstaje z drugiej strony.",steps:["Zacznij z warowania.","Smakołyk przy nosie przesuń w stronę barku — pies przewróci się na bok, nagroda.","Prowadź dalej nad grzbietem — pies przetoczy się.","Dodaj słowo „turlaj”."],tip:"Ćwicz na miękkim — dywan, trawa."},{id:"kolko",name:"Kółeczko",cat:"sztuczki",level:1,minutes:3,goal:"Pies obraca się wokół własnej osi.",steps:["Smakołyk przy nosie, prowadź po kole.","Po pełnym obrocie — nagroda.","Zmniejszaj gest do ruchu palcem.","Ucz osobno w lewo i w prawo („kółko”, „hop”)."],tip:"Proste i efektowne — dobre na koniec sesji."},{id:"high-five",name:"Piątka",cat:"sztuczki",level:2,minutes:3,goal:"Pies przybija piątkę.",steps:["Naucz najpierw „łapa”.","Pokaż otwartą dłoń pionowo, na wysokości łapy.","Nagradzaj dotyk łapą.","Dodaj słowo „piątka”."],tip:"Przy małych psach kucnij, żeby nie musiały skakać."},{id:"szukaj",name:"Szukaj (węszenie)",cat:"sztuczki",level:1,minutes:10,goal:"Pies szuka ukrytych smakołyków nosem.",steps:["Pokaż, jak chowasz smakołyk tuż obok.","Powiedz „szukaj!” i pozwól znaleźć.","Chowaj coraz dalej, w innym pokoju, pod kubkiem.","Spróbuj matę węchową albo ukryj zabawkę."],tip:"10 minut węszenia męczy psa bardziej niż pół godziny spaceru."},{id:"spokoj",name:"Spokój przy drzwiach",cat:"zachowanie",level:3,minutes:10,goal:"Pies nie skacze na gości i nie szczeka bez końca.",steps:["Naucz najpierw „na miejsce”.","Poproś domownika o dzwonek — wyślij psa na miejsce, nagradzaj.","Otwieraj drzwi, gdy pies zostaje.","Gość wita psa dopiero, gdy ten ma 4 łapy na ziemi."],tip:"Skakanie nagradzane uwagą (nawet „nie wolno!”) się utrwala — ignoruj, nagradzaj spokój."},{id:"samotnosc",n
