ornej sierści. Umaszczenie czarne, biszkoptowe (od kremowego po rudawe) lub czekoladowe. Psy mają 56–57 cm w kłębie, suki 54–56 cm.",character:"Pogodny, przyjazny i pozbawiony agresji — lubi ludzi, dzieci i inne psy, dlatego jest kiepskim stróżem. Bardzo chętnie współpracuje i szybko się uczy, co czyni go jednym z najczęstszych psów przewodników i asystujących. Długo dojrzewa — do 2–3 lat potrafi być szalonym nastolatkiem.",exercise:"Potrzebuje co najmniej 1,5–2 godzin ruchu dziennie, najlepiej z aportowaniem, pływaniem i pracą węchową. Znudzony labrador niszczy i podjada. U szczeniąt do roku unikaj forsownego biegania i schodów.",grooming:"Krótka sierść z gęstym podszerstkiem mocno linieje, zwłaszcza wiosną i jesienią — szczotkuj raz–dwa razy w tygodniu, w sezonie codziennie. Po pływaniu wysusz uszy. Kluczowe jest pilnowanie wagi: labradory mają genetycznie słabsze odczuwanie sytości.",forWhom:"Dla aktywnych rodzin, także z dziećmi, i dla osób zaczynających przygodę z psem. Nie dla kogoś, kto szuka psa obronnego albo spokojnego kanapowca na długie godziny samotności."},golden:{history:"Rasa powstała w Szkocji w drugiej połowie XIX wieku w majątku lorda Tweedmoutha, który skrzyżował żółtego retrievera falistowłosego z dziś wymarłym tweed water spanielem. Celem był pies do aportowania ustrzelonego ptactwa z wody i z lądu, delikatnie trzymający zdobycz w pysku.",look:"Harmonijny, średnio duży pies o łagodnym wyrazie oczu. Sierść średniej długości, płaska lub falista, z bogatymi frędzlami na łapach, piersi i ogonie, w odcieniach złota — od kremowego po ciemnozłoty. Wysokość 51–61 cm.",character:"Cierpliwy, czuły i niezwykle przyjacielski. Bardzo przywiązuje się do całej rodziny i źle znosi izolację. Łatwo się szkoli, dlatego świetnie sprawdza się jako pies terapeutyczny, ratowniczy i asystujący.",exercise:"Codziennie 1,5–2 godziny aktywności: spacery, aportowanie, pływanie, zabawy węchowe. Lubi mieć zadanie — dobrze odnajduje się w obedience, rally-o i tropieniu.",grooming:"Szczotkowanie 2–3 razy w tygodniu, w okresie linienia częściej. Regularnie podcinaj sierść między opuszkami i kontroluj uszy, które przy długiej sierści łatwo się zaparzają. Kąpiel tylko w razie potrzeby.",forWhom:"Dla rodzin z dziećmi, osób starszych o dobrej kondycji i każdego, kto chce towarzyskiego psa, z którym da się wszystko robić razem. Mniej dla pedantów (dużo sierści) i osób długo poza domem."},"owczarek-niemiecki":{history:"Rasę stworzył kapitan kawalerii Max von Stephanitz, który w 1899 roku kupił psa Horanda von Grafrath i założył związek hodowców. Z różnych lokalnych psów pasterskich Niemiec powstał pies użytkowy — inteligentny, wytrzymały i posłuszny. Szybko trafił do policji, wojska i ratownictwa.",look:"Nieco wydłużony, muskularny pies o stojących uszach i szablastym ogonie. Najczęściej czarny podpalany lub czarny, rzadziej szary (wilczasty). Odmiana krótkowłosa i długowłosa, zawsze z gęstym podszerstkiem. Psy 60–65 cm, suki 55–60 cm.",character:"Lojalny, odważny, czujny i bardzo pojętny. Mocno wiąże się z opiekunem i rodziną, wobec obcych bywa zdystansowany. Bez zajęcia i jasnych zasad może stać się nerwowy albo nadmiernie terytorialny.",exercise:"Minimum 2 godziny dziennie ruchu połączonego z pracą umysłową: posłuszeństwo, tropienie, sporty obronne, agility. Sam spacer na smyczy to zdecydowanie za mało.",grooming:"Linieje obficie przez cały rok, a dwa razy w roku „gubi” podszerstek garściami — szczotkowanie kilka razy w tygodniu, w sezonie codziennie. Wybieraj hodowle badające stawy (HD/ED) i linie o prostym grzbiecie.",forWhom:"Dla osób konsekwentnych, aktywnych i gotowych na regularne szkolenie — najlepiej z doświadczeniem. Świetny partner do sportu i pracy. Nie dla kogoś, kto chce psa „do ogrodu” bez kontaktu z ludźmi."},"border-collie":{history:"Wywodzi się z pogranicza Szkocji i Anglii (ang. border), gdzie przez wieki selekcjonowano psy wyłącznie pod kątem pracy przy owcach. Protoplastą nowoczesnej linii był pies Old Hemp urodzony w 1893 roku. Do dziś organizuje się zawody pasterskie, na których border collie nie mają sobie równych.",look:"Średniej wielkości, lekki i zwinny pies o czujnym spojrzeniu. Sierść krótka lub półdługa, najczęściej czarno-biała, ale też czerwona, blue merle, trójbarwna i inne. Wysokość około 53 cm u psów, nieco mniej u suk.",character:"Pracoholik o niezwykłej inteligencji i wrażliwości. Bardzo szybko się uczy — także rzeczy niepożądanych. Ma silny instynkt zaganiania: potrafi „pasać” dzieci, rowery i samochody. Wrażliwy na hałas i ostre traktowanie.",exercise:"Wymaga 2–3 godzin dziennie aktywności i codziennych zadań dla głowy: agility, obedience, frisbee, nauka sztuczek, praca węchowa. Bez tego pojawiają się obsesyjne zachowania (gonienie cieni, kręcenie się).",grooming:"Szczotkowanie raz–dwa razy w tygodniu, w okresie linienia częściej. Obcinanie pazurów, kontrola uszu. Hodowla powinna badać psy w kierunku CEA, TNS i dysplazji.",forWhom:"Dla bardzo aktywnych osób, sportowców kynologicznych i rolników. To nie jest pies do bloku dla zapracowanej rodziny — prędzej trener niż pupil."},jamnik:{history:"Jamnik (niem. Dachshund — „borsuczy pies”) powstał w Niemczech w XVII–XVIII wieku do polowań norowych na borsuki i lisy. Krótkie nogi pozwalały mu wchodzić do nor, a donośny głos — informować myśliwego, gdzie jest. Występuje w trzech rozmiarach (standardowy, miniaturowy, króliczy) i trzech odmianach sierści.",look:"Długi tułów na krótkich, mocnych łapach, wydłużona głowa i zwisające uszy. Sierść krótka, długa lub szorstka (z brodą i brwiami). Umaszczenie rude, czarne podpalane, czekoladowe, pręgowane lub tygrysie (dapple). Masa do 9 kg w odmianie standardowej.",character:"Odważny, pewny siebie i uparty — myśliwy, który pod ziemią musiał decydować sam. Czuły wobec rodziny, czujny i dość szczekliwy. Bywa zazdrosny i zaborczy wobec zabawek.",exercise:"Około godziny spaceru dziennie plus zabawy węchowe i kopanie (na wyznaczonym miejscu). Unikaj skakania z wysokości i nadmiernego chodzenia po schodach.",grooming:"Krótkowłosy — prawie bezobsługowy; długowłosy — szczotkowanie 2–3 razy w tygodniu; szorstkowłosy — trymowanie 2–3 razy w roku. Szczupła sylwetka to najlepsza ochrona przed dyskopatią.",forWhom:"Dla osób z poczuciem humoru i cierpliwością do uporu, także w mieszkaniu. Nie dla kogoś, kto oczekuje bezwzględnego posłuszeństwa ani nie zniesie szczekania."},yorkshire:{history:"Powstał w XIX wieku w hrabstwach Yorkshire i Lancashire w Anglii, gdzie robotnicy fabryk i kopalń hodowali małe teriery do tępienia szczurów. Z czasem, dzięki jedwabistej sierści, trafił na salony i stał się jednym z najpopularniejszych psów ozdobnych.",look:"Miniaturowy, zgrabny piesek o masie do 3,2 kg. Długa, prosta, jedwabista sierść w kolorze stalowoniebieskim na tułowiu i złotopodpalanym na głowie i łapach. Szczenięta rodzą się czarne podpalane i zmieniają kolor z wiekiem.",character:"Mały pies z temperamentem teriera — czujny, ciekawski, odważny, czasem zadziorny wobec większych psów. Mocno przywiązany do opiekuna, lubi być w centrum uwagi. Szybko uczy się zarówno sztuczek, jak i szczekania na wszystko.",exercise:"Wystarczą 2–3 krótsze spacery dziennie i zabawy w domu, ale chętnie towarzyszy w dłuższych wycieczkach. Uwaga na upadki z rąk i kanapy.",grooming:"Długa sierść wymaga codziennego czesania; wielu właścicieli wybiera krótką fryzurę „szczeniaczka” co 6–8 tygodni. Mycie zębów kilka razy w tygodniu — mały pyszczek sprzyja kamieniowi i wypadaniu zębów.",forWhom:"Dla osób w mieszkaniu, także starszych, szukających małego, towarzyskiego psa. Ostrożnie w rodzinach z bardzo małymi dziećmi — łatwo o uraz."},"buldog-francuski":{history:"Przodkami były małe buldogi angielskie, które w XIX wieku koronczarki z Nottingham zabrały ze sobą do Francji. Tam skrzyżowano je z lokalnymi psami i utrwalono charakterystyczne „nietoperze” uszy. Rasa szybko stała się modna wśród paryskiej bohemy.",look:"Mały, krępy i muskularny pies o kwadratowej głowie, krótkim pysku i stojących, zaokrąglonych uszach. Krótka, błyszcząca sierść — płowa, pręgowana lub łaciata. Masa 8–14 kg.",character:"Wesoły, przytulaśny i zabawny, uwielbia ludzi i nie lubi być sam. Spokojny w domu, rzadko szczeka. Bywa uparty, ale chętnie współpracuje za jedzenie.",exercise:"Umiarkowane spacery 2–3 razy dziennie, bez forsowania w upale i wilgoci. Nie nadaje się do biegania przy rowerze. W wodzie zawsze w kamizelce — z trudem pływa.",grooming:"Sierść łatwa w pielęgnacji, ale trzeba regularnie czyścić fałdy skórne i uszy. Wybieraj hodowle, które oceniają psy pod kątem oddychania (np. test BOAS) i mają otwarte nozdrza.",forWhom:"Dla mieszkańców miast, rodzin i osób starszych, które chcą wesołego psa do towarzystwa. Nie dla miłośników sportu i gorącego klimatu."},chihuahua:{history:"Nazwa pochodzi od meksykańskiego stanu Chihuahua, gdzie w XIX wieku Amerykanie kupowali te maleńkie psy. Uważa się, że jego przodkiem był techichi — piesek hodowany przez Tolteków i Azteków. Popularność zdobył w USA w XX wieku.",look:"Najmniejsza rasa świata: 1,5–3 kg. Okrągła, „jabłkowata” głowa, duże stojące uszy i wypukłe oczy. Odmiana krótkowłosa i długowłosa w niemal każdym umaszczeniu.",character:"Odważny, czujny i lojalny, często wybiera jedną osobę jako „swoją”. Wobec obcych bywa nieufny i głośny. Pewny siebie mimo rozmiaru — potrafi zaczepiać duże psy.",exercise:"Krótkie spacery i zabawy w domu wystarczą, ale chihuahua chętnie chodzi dłużej. Zimą potrzebuje ubranka, bo szybko traci ciepło.",grooming:"Bardzo mało pielęgnacji: szczotkowanie raz w tygodniu, częściej u długowłosych. Mycie zębów, obcinanie pazurów. Szczenięta karm często, by uniknąć spadków cukru.",forWhom:"Dla dorosłych i osób starszych w mieszkaniu, które poświęcą psu dużo uwagi. Nie dla rodzin z małymi dziećmi."},beagle:{history:"Małe psy gończe do polowań na zające polowano w Anglii już w średniowieczu, a współczesny typ beagle'a ukształtował się w XIX wieku. Polowano z nimi w sforach, pieszo — dlatego do dziś są towarzyskie wobec innych psów i mają niezwykle wytrwały nos.",look:"Zwarty, mocny pies o długich, miękkich uszach i łagodnym spojrzeniu. Krótka, gęsta sierść, najczęściej trójkolorowa (czarny, biały, rudy) z białą końcówką ogona, która w sforze była widoczna w wysokiej trawie. Wysokość 33–40 cm.",character:"Wesoły, towarzyski, zrównoważony i niezwykle przyjazny dla ludzi i psów. Prowadzi go nos — potrafi „wyłączyć uszy”, gdy złapie trop. Głośny: szczeka i charakterystycznie „gra” na tropie.",exercise:"Co najmniej 1,5 godziny ruchu dziennie, najlepiej z pracą węchową (tropienie, maty węchowe, szukanie smakołyków). Poza ogrodzonym terenem — na lince, bo przywołanie przegrywa z zapachem.",grooming:"Bardzo prosta: szczotkowanie raz w tygodniu, kontrola i czyszczenie uszu. Pilnuj diety — beagle zje wszystko i łatwo tyje. Zabezpiecz kosz na śmieci!",forWhom:"Dla rodzin z dziećmi i osób, które lubią długie spacery i mają poczucie humoru. Mniej dla mieszkańców cienkościennych bloków i dla tych, którzy chcą puszczać psa luzem."},husky:{history:"Wyhodowany przez lud Czukczów na Syberii jako wytrzymały pies zaprzęgowy, zdolny pokonywać długie dystanse przy małej ilości jedzenia. Sławę zdobył w 1925 roku podczas „wyścigu surowicy” do Nome na Alasce, gdy psie zaprzęgi dostarczyły lek przeciw błonicy.",look:"Średniej wielkości, lekki i szybki pies o stojących uszach, gęstej podwójnej sierści i puszystym ogonie. Oczy niebieskie, brązowe lub różnobarwne. Typowa maska na pysku. Wysokość 51–60 cm.",character:"Przyjazny, łagodny i towarzyski — wobec ludzi zwykle bez agresji, więc słaby stróż. Niezależny i sprytny, ma silny instynkt łowiecki i potrzebę biegu. Raczej wyje i „gada”, niż szczeka.",exercise:"Potrzebuje dużo intensywnego ruchu: 2+ godziny dziennie, najlepiej w zaprzęgu, bikejoringu lub canicrossie (w chłodne dni). Mistrz ucieczek — wysokie i zakopane ogrodzenie to podstawa.",grooming:"Dwa razy w roku masowo zrzuca podszerstek; szczotkowanie 2–3 razy w tygodniu, w sezonie codziennie. Nie strzyż — sierść chroni też przed upałem. Latem ruch tylko rano i wieczorem.",forWhom:"Dla aktywnych, doświadczonych osób, które lubią sporty zaprzęgowe i chłodniejszy klimat. Nie dla kogoś, kto chce puszczać psa luzem w lesie ani trzymać go w małym mieszkaniu bez ruchu."},pudel:{history:"Wywodzi się od psów wodnych z Europy Zachodniej (nazwa od niem. „pudeln” — chlapać się). Pudel aportował kaczki z wody, a jego słynna fryzura miała chronić stawy i narządy przed zimnem. We Francji stał się psem salonowym i cyrkowym, stąd uznawana tam ojczyzna rasy.",look:"Elegancki, proporcjonalny pies o kręconej, wełnistej sierści, która nie linieje. Cztery rozmiary: toy, miniaturowy, średni i duży (do 60 cm). Umaszczenie jednolite: czarne, białe, brązowe, szare, morelowe, rude.",character:"Jeden z najinteligentniejszych psów — wesoły, czuły, chętny do pracy i bardzo wrażliwy na nastrój opiekuna. Uwielbia uczyć się sztuczek. Bez zajęcia bywa szczekliwy i wymyśla psoty.",exercise:"Duży pudel potrzebuje 1,5–2 godzin ruchu i lubi pływać; mniejsze odmiany — około godziny. Wszystkie odmiany świetnie odnajdują się w agility, obedience i dog dancingu.",grooming:"Wymagająca: czesanie kilka razy w tygodniu i strzyżenie co 6–8 tygodni, bo sierść rośnie bez przerwy i się filcuje. Regularnie czyść uszy, z których wyrasta sierść.",forWhom:"Dla alergików (mniej sierści w domu), rodzin i aktywnych osób, które lubią szkolić psa. Wymaga budżetu na groomera."},"shih-tzu":{history:"Pochodzi z Tybetu, skąd psy podarowane chińskim cesarzom trafiły do Zakazanego Miasta. Tam skrzyżowano je z pekińczykami. Nazwa oznacza „lwi piesek”. Po rewolucji w Chinach rasa niemal zniknęła i odbudowano ją w Europie z kilkunastu psów.",look:"Mały, krępy piesek o krótkim pysku, dużych ciemnych oczach i długiej, gęstej, opadającej sierści z charakterystyczną „chryzantemą” wokół pyska. Każde umaszczenie. Masa 4,5–8 kg.",character:"Pogodny, przyjazny, łagodny i trochę dumny. Lubi ludzi, dzieci i inne zwierzęta, rzadko jest agresywny. Bywa uparty przy szkoleniu czystości.",exercise:"Krótkie spacery i zabawy w domu zupełnie wystarczą. Unikaj wysiłku w upale — ma krótki pysk.",grooming:"Długa sierść wymaga codziennego czesania; wygodniejsza jest krótka fryzura. Grzywkę spinaj gumką, by nie drażniła oczu. Przemywaj okolice oczu i fałd nosowy.",forWhom:"Dla rodzin, seniorów i mieszkańców bloków szukających spokojnego psa do towarzystwa. Nie dla miłośników długich wypraw."},maltanczyk:{history:"Jedna z najstarszych ras ozdobnych Europy — znana już w starożytnej Grecji i Rzymie. Nazwa wiąże się z wyspą Meleda lub Maltą. Przez wieki był ulubieńcem arystokratek, trzymanym na kolanach i w rękawach sukni.",look:"Miniaturowy, biały piesek (3–4 kg) o bardzo długiej, prostej, jedwabistej sierści bez podszerstka, czarnym nosie i ciemnych oczach.",character:"Czuły, wesoły, żywy i inteligentny. Mocno przywiązuje się do opiekuna i źle znosi samotność. Czujny — zaszczeka, gdy coś się dzieje.",exercise:"Spacery 2–3 razy dziennie i zabawy w domu. Lubi sztuczki i krótkie sesje szkoleniowe.",grooming:"Codzienne czesanie lub krótka fryzura, regularne przemywanie oczu (rdzawe zacieki łzowe), mycie zębów. Nie linieje — dobry wybór przy łagodnej alergii.",forWhom:"Dla osób, które dużo czasu spędzają w domu, seniorów i mieszkańców miast. Mniej dla rodzin z maluchami i osób długo poza domem."},cavalier:{history:"Małe spaniele towarzyszyły dworom angielskim od czasów Tudorów; król Karol II tak je kochał, że nazwano je jego imieniem. W latach 20. XX wieku Amerykanin Roswell Eldridge wyznaczył nagrodę za psy w starym typie z dłuższym pyskiem — tak odtworzono cavaliera.",look:"Mały, elegancki spaniel (5,5–8 kg) o długich, pierzastych uszach, dużych ciemnych oczach i jedwabistej sierści. Cztery umaszczenia: blenheim (biało-kasztanowe), trójkolorowe, czarne podpalane i rubinowe.",character:"Łagodny, czuły i przyjazny wszystkim — ludziom, dzieciom, psom i kotom. Dostosowuje się do rytmu domu: chętnie poleży na kanapie i chętnie pójdzie na długi spacer.",exercise:"Około godziny spaceru dziennie; ma resztki instynktu łowieckiego, więc może pogonić ptaki.",grooming:"Szczotkowanie 2–3 razy w tygodniu, kontrola uszu. Koniecznie wybieraj hodowle badające serca (MVD) i skanujące w kierunku syringomielii.",forWhom:"Idealny dla rodzin z dziećmi, seniorów i osób zaczynających z psem — do mieszkania i domu."},bernenczyk:{history:"Pochodzi z kantonu Berno w Szwajcarii, gdzie od wieków pomagał w gospodarstwach: pilnował zagród, pędził bydło i ciągnął wózki z mlekiem i serami na targ. Na początku XX wieku profesor Albert Heim przyczynił się do ratowania i standaryzacji rasy.",look:"Duży, mocny pies o długiej, błyszczącej sierści w charakterystycznym trójkolorowym umaszczeniu: czarny z rdzawymi znaczeniami i białą strzałką, krawatem i łapami. Psy 64–70 cm, suki 58–66 cm.",character:"Spokojny, pewny siebie, łagodny i bardzo przywiązany do rodziny. Cierpliwy wobec dzieci. Czujny, ale nie agresywny. Wrażliwy — źle znosi krzyk.",exercise:"Umiarkowanie aktywny: 1–1,5 godziny spacerów dziennie. Lubi zimę, chętnie ciągnie wózek (draft). Szczenięta rosną szybko — chroń stawy przed przeciążeniem.",grooming:"Obficie linieje — szczotkowanie kilka razy w tygodniu. Pilnuj wagi. Niestety rasa żyje krótko (7–10 lat), głównie z powodu nowotworów; wybieraj hodowle dbające o długowieczność linii.",forWhom:"Dla rodzin z domem i ogrodem, w chłodniejszym klimacie, które zaakceptują sierść i ślinę. Nie dla małych mieszkań bez windy."},rottweiler:{history:"Jego przodkami były psy rzymskich legionów, które pędziły bydło przez Alpy. W średniowiecznym mieście Rottweil psy rzeźników pędziły stada na targ i strzegły sakiewek z pieniędzmi. Na początku XX wieku zaczęły służyć w policji.",look:"Duży, potężny, zwarty pies o szerokiej głowie i krótkiej, gęstej, czarnej sierści z wyraźnym mahoniowym podpalaniem. Psy 61–68 cm i do 50 kg.",character:"Spokojny, pewny siebie, odważny i oddany rodzinie. Naturalny obrońca — nieufny wobec obcych, ale dobrze wychowany nie atakuje bez powodu. Inteligentny i chętny do pracy z przewodnikiem, którego szanuje.",exercise:"1,5–2 godziny dziennie, z elementami pracy: posłuszeństwo, tropienie, sporty obronne, ciągnięcie. Bez pracy może stać się zbyt terytorialny.",grooming:"Krótka sierść — szczotkowanie raz w tygodniu, więcej podczas linienia. Pilnuj wagi i stawów. Uwaga: w Polsce rottweiler jest na liście ras uznawanych za agresywne — potrzebne zezwolenie gminy.",forWhom:"Dla doświadczonych, konsekwentnych osób z czasem na socjalizację i szkolenie. Nie dla pierwszego psa ani do kojca bez kontaktu z ludźmi."},bokser:{history:"Powstał w Niemczech pod koniec XIX wieku z bullenbeisserów — psów do polowań na grubą zwierzynę — i angielskich buldogów. Szybko znalazł pracę w wojsku i policji, a z czasem stał się psem rodzinnym.",look:"Średnio duży, muskularny, kwadratowy pies o krótkim pysku z charakterystycznym podgryzem i krótkiej, przylegającej sierści — płowej lub pręgowanej, często z białymi znaczeniami. Wysokość 53–63 cm.",character:"Wesoły, energiczny, czuły i niezwykle oddany dzieciom. Bardzo długo zachowuje szczenięce usposobienie — skacze, „boksuje” łapami i błaznuje. Czujny stróż.",exercise:"Potrzebuje 1,5–2 godzin aktywności dziennie i zabaw z ludźmi. Uważaj w upale — krótki pysk utrudnia chłodzenie.",grooming:"Bardzo prosta: szczotkowanie gumową rękawicą raz w tygodniu. Kontroluj serce (kardiomiopatia) i skórę (guzy). Zimą przyda się płaszczyk.",forWhom:"Dla aktywnych rodzin z dziećmi, które chcą psa do zabawy i mają cierpliwość do jego wiecznego entuzjazmu."},doberman:{history:"Wyhodował go w latach 80. XIX wieku Friedrich Louis Dobermann, poborca podatkowy z Turyngii, który chciał mieć odważnego psa do ochrony podczas zbierania pieniędzy. W rasie są m.in. rottweiler, pinczer, beauceron i chart angielski.",look:"Elegancki, muskularny i smukły pies o krótkiej, błyszczącej sierści — czarnej lub brązowej z rdzawym podpalaniem. W Polsce kopiowanie uszu i ogona jest zakazane, więc ma naturalne, opadające uszy i długi ogon. Psy 68–72 cm.",character:"Inteligentny, czujny, bardzo przywiązany do rodziny i wrażliwy. W domu przytulas szukający kontaktu, wobec obcych zdystansowany. Szybko się uczy i potrzebuje jasnych, łagodnych zasad.",exercise:"2 godziny dziennie, najlepiej z bieganiem i zadaniami: obedience, tropienie, agility, IGP. Źle znosi samotność i zimno.",grooming:"Minimalna — szczotkowanie raz w tygodniu. Ważne regularne badania serca (Holter, echo) i badanie w kierunku choroby von Willebranda.",forWhom:"Dla aktywnych, konsekwentnych osób, które chcą bardzo bliskiej relacji z psem i mają czas na szkolenie."},"owczarek-podhalanski":{history:"Potomek starych psów pasterskich, które wraz z wołoskimi pasterzami wędrowały łukiem Karpat. W Tatrach i na Podhalu chronił owce przed wilkami i niedźwiedziami — biały kolor pozwalał pasterzowi w nocy odróżnić psa od drapieżnika. Rasę uznano po II wojnie światowej.",look:"Duży, masywny pies o jednolicie białej, gęstej i prostej lub lekko falistej sierści z obfitym podszerstkiem, ciemnych oczach i ciemnym nosie. Psy 65–70 cm, nawet 60 kg.",character:"Spokojny, rozważny, niezależny i bardzo czujny. Obrońca stada — rodziny i terenu. Samodzielnie podejmuje decyzje, dlatego nie słucha ślepo. Wobec domowników łagodny, wobec obcych nieufny.",exercise:"Nie potrzebuje intensywnego sportu, ale musi mieć przestrzeń do patrolowania i codzienne spacery. Najlepiej czuje się z dużym ogrodem.",grooming:"Sierść częściowo samoczyszcząca, ale linieje obficie — szczotkowanie 1–2 razy w tygodniu, w sezonie codziennie. Nie strzyż.",forWhom:"Dla doświadczonych osób z domem i dużym ogrodzonym terenem, na wsi lub przedmieściach. Nie do bloku i nie dla zwolenników sportów kynologicznych."},pon:{history:"Polski owczarek nizinny pomagał pasterzom na nizinach Polski — był na tyle mały, by nie płoszyć owiec, i na tyle bystry, by samodzielnie je zaganiać. Po II wojnie rasę odtworzyła dr Danuta Hryniewicz; ojcem współczesnej linii jest pies Smok.",look:"Średni, krępy pies (42–50 cm) o długiej, gęstej, kudłatej sierści opadającej na oczy, w każdym umaszczeniu (często biało-szare lub biało-czarne). Ogon naturalnie krótki lub długi.",character:"Bystry, czujny, pewny siebie i z świetną pamięcią. Wesoły i przywiązany do rodziny, nieufny wobec obcych — dobry stróż. Potrafi być uparty i „negocjować”.",exercise:"Około 1,5 godziny dziennie, chętnie z zadaniami: agility, obedience, pasienie. Lubi chodzić z rodziną wszędzie.",grooming:"Wymagająca: dokładne rozczesywanie co kilka dni, by nie powstawały kołtuny, szczególnie podczas zmiany sierści u młodych psów. Regularnie wyczesuj okolice oczu.",forWhom:"Dla aktywnych rodzin i osób z doświadczeniem, które lubią szkolić psa i nie boją się czesania. Polska rasa — warto ją wspierać!"},"gonczy-polski":{history:"Polskie psy gończe opisywano już w XVI wieku. Gończy polski wywodzi się z dawnych ogarów, a nowoczesny typ ustalono w XX wieku; uznanie FCI zdobył w 2017 roku. Służy do polowań na dziki, jelenie i lisy.",look:"Średniej wielkości, zwarty pies o mocnej budowie, z długimi zwisającymi uszami i krótką, gęstą sierścią — czarną podpalaną lub brązową podpalaną. Wysokość 50–59 cm.",character:"Na polowaniu wytrwały i zawzięty, w domu łagodny, spokojny i przyjacielski. Ma charakterystyczny, melodyjny głos na tropie. Niezależny — nos bywa ważniejszy od komend.",exercise:"Potrzebuje dużo ruchu, najlepiej długich spacerów na lince i pracy węchowej: mantrailing, tropienie, sporty węchowe.",grooming:"Bardzo prosta — szczotkowanie raz w tygodniu, kontrola uszu i łap po spacerach w lesie.",forWhom:"Dla myśliwych i aktywnych osób, które lubią las i pracę węchową. Mniej dla bloków z cienkimi ścianami."},"chart-polski":{history:"Jedna z najstarszych polskich ras — charty polowały na zające, lisy, a nawet wilki na stepach Rzeczypospolitej, co opisywano już w XVII wieku. W XX wieku rasa prawie wyginęła; odrodziła się dzięki entuzjastom w latach 70.",look:"Duży, mocny chart (68–80 cm), bardziej muskularny niż chart angielski, o krótkiej, sprężystej sierści w każdym umaszczeniu. Długi ogon zakończony haczykiem.",character:"W domu spokojny, zrównoważony i przywiązany do rodziny, wobec obcych powściągliwy. Na polu — błyskawiczny łowca ścigający wzrokiem. Bardziej czujny i obronny niż inne charty.",exercise:"Codzienne spacery i kilka razy w tygodniu możliwość sprintu na ogrodzonym terenie lub coursing. Puszczony luzem w otwartym terenie może pogonić zwierzynę.",grooming:"Minimalna. Zimą przyda się płaszcz. Charty mają mało tkanki tłuszczowej — informuj weterynarza przed znieczuleniem.",forWhom:"Dla osób z dostępem do ogrodzonego wybiegu, które cenią spokojnego psa w domu. Ostrożnie z kotami i małymi zwierzętami."},corgi:{history:"Pembroke welsh corgi pomagał rolnikom w Walii w pędzeniu bydła — podszczypywał krowy w pęciny, a dzięki niskiemu wzrostowi unikał kopnięć. Sławę przyniosła mu królowa Elżbieta II, która przez całe życie miała ponad 30 corgich.",look:"Niski, długi i mocny pies (25–30 cm, 10–14 kg) o lisiej głowie, dużych stojących uszach i gęstej sierści — rudej, sobolowej, płowej lub czarnej podpalanej, z białymi znaczeniami. Ogon często naturalnie krótki.",character:"Wesoły, bystry, odważny i bardzo towarzyski. Czujny — chętnie zaszczeka. Instynkt pasterski sprawia, że może szczypać w pięty dzieci i biegające osoby.",exercise:"Wbrew krótkim nogom lubi ruch: około 1–1,5 godziny dziennie, zabawy i sporty (obedience, rally, pasienie). Ogranicz skakanie i schody.",grooming:"Mocno linieje — szczotkowanie kilka razy w tygodniu. Pilnuj wagi, bo nadwaga obciąża długi kręgosłup.",forWhom:"Dla rodzin i aktywnych osób w domu lub mieszkaniu, które zaakceptują sierść i szczekanie."},aussie:{history:"Mimo nazwy powstał w zachodnich stanach USA, gdzie pracował na ranczach przy owcach i bydle. Prawdopodobnie przodkami były psy pasterskie przywiezione z Baskami przez Australię. Popularność zdobył dzięki rodeo i westernom.",look:"Średniej wielkości (46–58 cm), proporcjonalny pies o półdługiej sierści: blue merle, red merle, czarny lub czerwony, często z białymi i miedzianymi znaczeniami. Oczy brązowe, niebieskie lub różnobarwne.",character:"Inteligentny, energiczny, bardzo przywiązany do opiekuna i chętny do pracy. Z obcymi zdystansowany. Bez zajęcia — nerwowy i destrukcyjny. Silny instynkt zaganiania.",exercise:"2+ godziny dziennie ruchu i pracy umysłowej: agility, frisbee, obedience, pasienie. Codziennie nowe wyzwania.",grooming:"Szczotkowanie 1–2 razy w tygodniu, w okresie linienia częściej. Ważne: test MDR1 (wrażliwość na niektóre leki) i badania oczu.",forWhom:"Dla aktywnych osób, sportowców i doświadczonych opiekunów. Nie dla domatorów i rodzin z małą ilością czasu."},cocker:{history:"Cocker spaniel angielski polował na słonki (ang. woodcock) w gęstych zaroślach — wypłaszał ptaki i aportował je myśliwemu. Jako odrębną rasę uznano go w 1892 roku. Przez dekady był jednym z najpopularniejszych psów rodzinnych w Polsce.",look:"Zwarty, wesoły pies (38–41 cm) o długich uszach pokrytych falistą sierścią i jedwabistej okrywie z frędzlami. Umaszczenie jednolite (rude, czarne, czekoladowe) lub wielobarwne (dereszowate, łaciate).",character:"Radosny, czuły i towarzyski — ogon prawie zawsze w ruchu. Chętnie się uczy, lubi aportować. Linie jednobarwne bywają bardziej zaborcze o zabawki i jedzenie — warto pracować nad tym od szczeniaka.",exercise:"1–1,5 godziny dziennie, z aportowaniem, pływaniem i węszeniem. Linie użytkowe są znacznie bardziej energiczne niż wystawowe.",grooming:"Szczotkowanie kilka razy w tygodniu, trymowanie co 2–3 miesiące, regularne czyszczenie i suszenie uszu. Pilnuj wagi.",forWhom:"Dla rodzin z dziećmi i aktywnych osób, które nie boją się regularnej pielęgnacji."},"jack-russell":{history:"Wyhodował go w XIX wieku pastor John „Jack” Russell z Devon, zapalony myśliwy, który chciał białego teriera — dobrze widocznego na tle lisa — biegającego za końmi i wypłaszającego lisy z nor.",look:"Mały (25–30 cm), zwinny i mocny terier o przewadze bieli z rudymi lub czarnymi plamami. Sierść gładka, szorstka lub pośrednia (łamana).",character:"Energiczny, odważny, sprytny i niezmordowany. Zabawny, ale potrafi być uparty i zaczepny wobec innych psów. Silny instynkt łowiecki — gonienie kotów i gryzoni, kopanie dołów.",exercise:"Wymaga 1,5–2 godzin intensywnego ruchu i zadań dla głowy codziennie: agility, flyball, frisbee, sztuczki. Znudzony — niszczy i szczeka.",grooming:"Prosta: szczotkowanie raz w tygodniu; odmiana szorstkowłosa wymaga trymowania kilka razy w roku.",forWhom:"Dla bardzo aktywnych osób i rodzin ze starszymi dziećmi. Nie jest „łatwym małym pieskiem” do mieszkania."},west:{history:"Biały terier z zachodnich wyżyn Szkocji. Legenda mówi, że pułkownik Malcolm z Poltalloch zaczął hodować białe psy po tym, jak przez pomyłkę zastrzelił swojego rudego teriera wziętego za lisa. Polował na lisy, borsuki i szczury.",look:"Mały (ok. 28 cm), krępy terier o czysto białej, szorstkiej okrywie z miękkim podszerstkiem, „chryzantemowej” głowie, stojących uszach i ciemnych oczach.",character:"Wesoły, pewny siebie, ciekawski i przyjazny. Typowy terier — odważny, czasem uparty, lubi kopać i pogonić małe zwierzęta. Czujny, chętnie szczeka.",exercise:"Około godziny spacerów dziennie i zabawy. Dobrze odnajduje się w mieście.",grooming:"Trymowanie co 3–4 miesiące, szczotkowanie 2 razy w tygodniu. Skłonność do atopowego zapalenia skóry — dobra karma i szybka reakcja na świąd.",forWhom:"Dla rodzin i osób w mieszkaniu, które chcą małego, wesołego i niezbyt delikatnego psa."},"sznaucer-miniaturowy":{history:"Wyhodowany w Niemczech pod koniec XIX wieku ze sznaucera średniego skrzyżowanego z affenpinczerem i pudlem. Pracował w gospodarstwach jako łowca szczurów i czujny stróż.",look:"Mały (30–35 cm), kwadratowy pies o szorstkiej sierści i charakterystycznej brodzie oraz krzaczastych brwiach. Umaszczenie pieprz i sól, czarne, czarne ze srebrem lub białe.",character:"Czujny, bystry, wesoły i odważny. Bardzo przywiązany do rodziny, dobry stróż (chętnie szczeka). Szybko się uczy, lubi aktywność.",exercise:"1–1,5 godziny dziennie, chętnie sporty kynologiczne. Dobrze odnajduje się w mieście.",grooming:"Trymowanie co 2–3 miesiące lub strzyżenie, czesanie brody. Mało linieje. Dieta niskotłuszczowa — skłonność do zapalenia trzustki.",forWhom:"Dla rodzin i osób w mieszkaniu, także dla alergików, które chcą bystrego, czujnego towarzysza."},mops:{history:"Pochodzi z Chin, gdzie hodowano go ponad 2000 lat temu jako psa cesarskiego dworu. Przez Holendrów trafił do Europy w XVI wieku i stał się ulubieńcem dworów, m.in. rodu Orańskiego.",look:"Mały (6–8 kg), kwadratowy i krępy pies o okrągłej głowie z głębokimi zmarszczkami, krótkim pyskiem, dużymi oczami i ogonem zwiniętym w precel. Umaszczenie płowe z czarną maską lub czarne.",character:"Pogodny, zabawny, uroczy kanapowiec, który kocha ludzi. Spokojny, rzadko szczeka, łagodny wobec dzieci i zwierząt. Bywa uparty.",exercise:"Krótkie spacery, bez wysiłku w upale i wilgoci — to rasa brachycefaliczna. Pilnuj, by nie przybierał na wadze.",grooming:"Mimo krótkiej sierści mocno linieje. Codziennie czyść fałd nad nosem, chroń wypukłe oczy przed urazami. Wybieraj hodowle z psami o swobodnym oddechu.",forWhom:"Dla seniorów, mieszkańców miast i osób szukających psa-przytulanki. Nie dla aktywnych sportowców i upałów."},dalmatynczyk:{history:"Nazwa pochodzi od Dalmacji (Chorwacja). W Anglii XVIII–XIX wieku był „psem karetowym” — biegł obok powozów, chroniąc konie i ładunek. W USA towarzyszył wozom strażackim i do dziś jest symbolem straży pożarnej.",look:"Elegancki, muskularny pies (54–61 cm) o krótkiej białej sierści z wyraźnymi, okrągłymi czarnymi lub brązowymi cętkami. Szczenięta rodzą się białe.",character:"Energiczny, przyjazny, wesoły i bardzo wytrzymały. Przywiązany do rodziny, potrafi być wrażliwy i uparty.",exercise:"Stworzony do biegania: 2 godziny ruchu dziennie, jogging, rower, canicross.",grooming:"Krótka sierść, ale linieje cały rok — szczotkowanie gumową rękawicą. Dieta niskopurynowa i dużo wody (kamienie moczanowe). Szczenięta badaj testem BAER (głuchota).",forWhom:"Dla biegaczy i aktywnych rodzin, które zaakceptują białą sierść w domu."},akita:{history:"Pochodzi z prefektury Akita w Japonii, gdzie polował na niedźwiedzie i dziki, a później był psem samurajów. Symbol lojalności — słynny Hachikō przez 9 lat czekał na dworcu na zmarłego właściciela. Uznana za pomnik przyrody Japonii.",look:"Duży (61–70 cm), mocny pies o niedźwiedziej głowie, małych trójkątnych oczach, stojących uszach i puszystym ogonie zawiniętym na grzbiet. Umaszczenie rude, sezamowe, pręgowane lub białe, z białymi znaczeniami (urajiro).",character:"Godny, spokojny, niezależny i bardzo lojalny wobec rodziny. Rzadko szczeka. Zdystansowany wobec obcych, może nie tolerować innych psów, zwłaszcza tej samej płci.",exercise:"Umiarkowane: 1–1,5 godziny spacerów dziennie. Lubi zimę.",grooming:"Szczotkowanie raz w tygodniu, dwa razy w roku intensywna zmiana sierści. Pies czysty, prawie bez zapachu.",forWhom:"Dla doświadczonych, spokojnych osób, które szanują niezależność psa. Nie dla rodzin z innymi psami bez przemyślenia."},shiba:{history:"Najmniejsza i najstarsza z japońskich ras szpiców — polował w górzystych lasach na ptaki i drobną zwierzynę. Po II wojnie światowej niemal wyginął; odbudowano go z trzech lokalnych linii.",look:"Mały (35–41 cm), zwarty pies o lisim wyglądzie, trójkątnych uszach i ogonie zawiniętym na grzbiet. Umaszczenie rude, sezamowe lub czarne podpalane, z białymi znaczeniami.",character:"Niezależny, pewny siebie, czysty i trochę kotowaty. Przywiązany do rodziny, ale nie nachalny. Potrafi głośno „krzyczeć”, gdy coś mu się nie podoba (np. obcinanie pazurów).",exercise:"Około godziny spacerów dziennie, zawsze na smyczy lub w ogrodzonym terenie — przywołanie bywa zawodne.",grooming:"Szczotkowanie raz w tygodniu, dwa razy w roku obfite linienie. Przyzwyczajaj do zabiegów od szczeniaka.",forWhom:"Dla osób cierpliwych, ceniących niezależnego psa i jego czystość. Mniej dla kogoś, kto marzy o psim „sportowcu-posłusznym”."},samoyed:{history:"Wyhodowany przez Samojedów (Nieńców) z syberyjskiej tundry, którzy używali go do pasienia reniferów, ciągnięcia sań i grzania się w namiotach. Brał udział w wyprawach polarnych, m.in. Amundsena.",look:"Średnio duży (51–60 cm) pies o śnieżnobiałej lub kremowej, bardzo gęstej sierści, ogonie zawiniętym na grzbiet i charakterystycznym „samojedzkim uśmiechu”.",character:"Przyjazny, łagodny, towarzyski i radosny — kocha ludzi, więc nie jest stróżem. Gadatliwy, szczeka i „mówi”. Źle znosi samotność.",exercise:"Aktywny: 1,5–2 godziny dziennie, w chłodne dni; lubi ciągnąć (zaprzęg, bikejoring).",grooming:"Wymagająca: szczotkowanie kilka razy w tygodniu, w czasie zmiany sierści codziennie. Nie strzyż. Uważaj na upały.",forWhom:"Dla aktywnych rodzin z czasem na pielęgnację, w chłodniejszym klimacie, akceptujących sierść wszędzie."},bichon:{history:"Należy do rodziny bichonów z basenu Morza Śródziemnego. Żeglarze zabierali je na statki, a na Teneryfie i we Francji stały się ulubieńcami dworu. Później występowały w cyrkach i na jarmarkach jako sprytni artyści.",look:"Mały (do 30 cm) pies o białej, kręconej, puszystej sierści, która nie linieje, z czarnym nosem i ciemnymi oczami.",character:"Wesoły, czuły, łagodny i towarzyski wobec ludzi i zwierząt. Lubi bawić się i uczyć sztuczek. Źle znosi samotność.",exercise:"Około godziny spacerów i zabaw dziennie.",grooming:"Czesanie kilka razy w tygodniu i strzyżenie co 4–6 tygodni. Nie linieje — dobry dla alergików. Przemywaj oczy (zacieki).",forWhom:"Dla rodzin, seniorów i alergików w mieszkaniu, którzy zapewnią psu towarzystwo."},pomeranian:{history:"Najmniejszy z niemieckich szpiców — jego przodkami były większe szpice z Pomorza (stąd nazwa). Miniaturyzację przyspieszyła królowa Wiktoria, która sprowadziła małe pomeraniany do Anglii.",look:"Miniaturowy (1,5–3 kg), puszysty piesek o lisim pyszczku, małych stojących uszkach i bujnej sierści z kryzą. Umaszczenie najczęściej rude, kremowe, czarne, białe lub sobolowe.",character:"Żywy, odważny, ciekawski i bardzo czujny — informuje o wszystkim szczekaniem. Przywiązany do opiekuna, pewny siebie.",exercise:"Krótkie spacery i zabawy w domu. Chętnie uczy się sztuczek.",grooming:"Szczotkowanie kilka razy w tygodniu, aż do skóry. Mycie zębów. Używaj szelek zamiast obroży — zapaść tchawicy.",forWhom:"Dla dorosłych i seniorów w mieszkaniu, ceniących pieska z charakterem. Nie dla małych dzieci."},"wyzel-weimarski":{history:"Wyhodowany na dworze książąt Weimaru w XIX wieku jako wszechstronny pies myśliwski do polowań na grubą zwierzynę, a później na ptactwo. Przez długi czas hodowany wyłącznie przez członków klubu.",look:"Duży (57–70 cm), elegancki pies o srebrzystej, sarniej lub mysioszarej sierści (krótkiej lub długiej), bursztynowych oczach i dużych uszach.",character:"Energiczny, inteligentny, odważny i niezwykle przywiązany do ludzi — „rzep”. Bez zajęcia i towarzystwa szybko robi się lękliwy i destrukcyjny.",exercise:"2+ godziny dziennie: bieganie, aport, praca węchowa, pływanie. Silny instynkt łowiecki.",grooming:"Krótkowłosy — minimum pielęgnacji. Dawaj kilka mniejszych posiłków i odpoczynek po jedzeniu (skręt żołądka).",forWhom:"Dla aktywnych osób, myśliwych i sportowców, które spędzają dużo czasu z psem."},"chart-angielski":{history:"Charty podobne do greyhounda widać na egipskich malowidłach sprzed tysięcy lat. W Anglii był psem szlachty do polowań na zające, później gwiazdą wyścigów. Po zakończeniu kariery wiele greyhoundów trafia do adopcji.",look:"Wysoki (69–76 cm), smukły i muskularny, z głęboką klatką piersiową i podkasanym brzuchem. Krótka, delikatna sierść w każdym umaszczeniu.",character:"Łagodny, spokojny, czuły i nieco wycofany. W domu potrafi przespać większość dnia — „najszybszy kanapowiec świata”. Wrażliwy na krzyk i zimno.",exercise:"Codzienne spacery i kilka sprintów w tygodniu na ogrodzonym terenie. Gonienie wzrokiem jest silniejsze niż przywołanie.",grooming:"Bardzo prosta. Płaszcz zimą i miękkie legowisko (mało tłuszczu, wystające kości). Informuj weterynarza przed znieczuleniem.",forWhom:"Dla spokojnych osób, także w mieszkaniu — a szczególnie dla tych, którzy chcą adoptować emeryta z toru."},nowofundland:{history:"Pochodzi z kanadyjskiej wyspy Nowa Fundlandia, gdzie pomagał rybakom wyciągać sieci i ratował tonących. Ma błony między palcami i wodoodporną sierść. Słynie z ratowania ludzi z wody — do dziś pracuje jako ratownik wodny.",look:"Olbrzymi, masywny pies (66–71 cm, do 70 kg) o gęstej, tłustej, wodoodpornej sierści — czarnej, brązowej lub biało-czarnej (landseer). Łagodny wyraz oczu.",character:"Słodki, cierpliwy, spokojny i bardzo opiekuńczy wobec dzieci. Znany jako „pies niania”. Zrównoważony i pozbawiony agresji.",exercise:"Umiarkowany ruch, najlepiej pływanie. W upale ostrożnie — szybko się przegrzewa.",grooming:"Szczotkowanie kilka razy w tygodniu, obfite linienie, dużo śliny. Duże koszty karmy i leczenia.",forWhom:"Dla rodzin z domem, w chłodniejszym klimacie, najlepiej blisko wody. Nie dla pedantów."},mieszaniec:{history:"Psy bez rodowodu towarzyszą człowiekowi od zawsze — to z nich wyhodowano wszystkie rasy. W polskich schroniskach czeka na dom kilkadziesiąt tysięcy psów, w każdym wieku i rozmiarze.",look:"Każdy jest jedyny w swoim rodzaju: od małych kundelków po duże psy w typie owczarka. Wygląd często zdradza przodków, ale charakter warto oceniać indywidualnie.",character:"Zależy od przodków, doświadczeń i wychowania. Wiele mieszańców jest zrównoważonych i bardzo wdzięcznych za nowy dom. Po adopcji daj psu czas — nawet 3 miesiące — na aklimatyzację.",exercise:"Dopasuj do konkretnego psa: wolontariusze w schronisku zwykle wiedzą, ile ruchu potrzebuje.",grooming:"Zależnie od sierści. Po adopcji: wizyta u weterynarza, szczepienia, odrobaczenie, czip i rejestracja.",forWhom:"Dla każdego, kto chce dać psu drugą szansę. Rozmowa z pracownikami schroniska pomoże wybrać psa pasującego do stylu życia."}},Uz={...Zz,...Object.fromEntries([...vg,...bg].map(x=>[x.b.id,x.i]))},Hz={file:"File:Airedale_Terrier.jpg",artist:"by Jane@rangeairevision.com",license:"Copyrighted free use",url:"https://commons.wikimedia.org/wiki/File:Airedale_Terrier.jpg"},Fz={file:"File:Akita_inu.jpeg",artist:"B@rt",license:"CC BY-SA 3.0",url:"https://commons.wikimedia.org/wiki/File:Akita_inu.jpeg"},Gz={file:"File:AMERICAN_STAFFORDSHIRE_TERRIER,_Zican’s_Bz_Ez_Dragon_(24208348891).2.jpg",artist:"Svenska Mässan from Sweden",license:"CC BY-SA 4.0",url:"https://commons.wikimedia.org/wiki/File:AMERICAN_STAFFORDSHIRE_TERRIER,_Zican%E2%80%99s_Bz_Ez_Dragon_(24208348891).2.jpg"},Wz={file:"File:Australian_Shepherd_red_bi.JPG",artist:"Trickdog-Fina",license:"CC BY-SA 3.0",url:"https://commons.wikimedia.org/wiki/File:Australian_Shepherd_red_bi.JPG"},Yz={file:"File:Basenji_Profile_(loosercrop).jpg",artist:"fugzu",license:"CC BY 2.0",url:"https://commons.wikimedia.org/wiki/File:Basenji_Profile_(loosercrop).jpg"},Iz={file:"File:BassetHound_profil.jpg",artist:"Cali1008",license:"Public domain",url:"https://commons.wikimedia.org/wiki/File:BassetHound_profil.jpg"},Xz={file:"File:Beagle_600.jpg",artist:"autor nieznany",license:"CC BY-SA 3.0",url:"https://commons.wikimedia.org/wiki/File:Beagle_600.jpg"},Vz={file:"File:Hummel_Vedor_vd_Robandahoeve.jpg",artist:"Blanky",license:"CC BY-SA 3.0",url:"https://commons.wikimedia.org/wiki/File:Hummel_Vedor_vd_Robandahoeve.jpg"},Kz={file:"File:3-BerneseMountainDogInGrass.jpg",artist:"FriendlyToaster",license:"CC BY 4.0",url:"https://commons.wikimedia.org/wiki/File:3-BerneseMountainDogInGrass.jpg"},Qz={file:"File:Bichon_Frisé_-_studdogbichon.jpg",artist:"Heike Andres",license:"CC BY-SA 3.0 de",url:"https://commons.wikimedia.org/wiki/File:Bichon_Fris%C3%A9_-_studdogbichon.jpg"},Jz={file:"File:Bloodhound_Erland22.jpg",artist:"Erland22",license:"CC BY-SA 4.0",url:"https://commons.wik
