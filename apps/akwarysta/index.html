asy, samice szare.",breed:"ikra",aliases:["dario","scarlet badis"]},"rozdymka-karlowata":{level:3,life:"4–5 lat",region:"Azja",decor:$("gęste rośliny, kryjówki"),sex:"Samce z ciemną linią na brzuchu i pomarańczowym brzegiem oka.",breed:"ikra",aliases:["pea puffer","rozdymka"]},"krewetka-tygrysia":{level:2,life:"1,5–2 lata",region:"Azja",decor:$("gęste rośliny, mchy"),sex:"Samice większe, z siodełkiem jajników.",breed:"ikra",aliases:["tiger shrimp"],varieties:["Blue Tiger","Orange Eye Tiger","Black Tiger"]},"rak-cpo":{level:1,life:"1,5–2 lata",region:"Ameryka Środk. i Płn.",decor:$("kryjówki, gęste rośliny"),sex:"Samce z wydłużonymi szczypcami i przekształconymi pierwszymi odnóżami odwłoka.",breed:"ikra",breedNote:"Samica nosi jaja pod odwłokiem, młode wychodzą gotowe.",aliases:["cpo","rak pomarańczowy","cambarellus"]},"rak-shufeldta":{level:1,life:"1,5–2 lata",region:"Ameryka Środk. i Płn.",decor:$("kryjówki, gęste rośliny"),sex:"Samce z dłuższymi szczypcami.",breed:"ikra",aliases:["cajun dwarf crayfish","cambarellus"]}},Ho={1:"dla początkujących",2:"średnio wymagający",3:"dla doświadczonych"},wz=["Ameryka Płd.","Ameryka Środk. i Płn.","Afryka","Azja","Australia i Oceania","Europa"],jp={ikra:{title:"Ryby składające ikrę (bez opieki rodziców)",needs:"para albo mała grupa z przewagą samców",level:"średnie",signs:["Samice wyraźnie zaokrąglone w brzuchu.","Samce intensywniej wybarwione, gonią samice.","Ryby częściej przebywają w gęstych roślinach."],steps:[{title:"Przygotuj zbiornik tarliskowy",items:["Osobny zbiornik 20–40 l z wodą z akwarium głównego.","Na dnie siatka, kulki szklane albo gruba warstwa mchu — ikra przez nie przepada, a rodzice jej nie zjedzą.","Filtr gąbkowy (nie wciągnie ikry ani narybku), przyciemnione światło."]},{title:"Przygotuj rodziców",items:["Przez 1–2 tygodnie karm obficie i urozmaicenie, najlepiej pokarmem mrożonym lub żywym.","Jeśli możesz, trzymaj w tym czasie samce i samice osobno — po połączeniu chętniej przystąpią do tarła."]},{title:"Tarło",items:["Przenieś rodziców wieczorem — wiele gatunków trze się o świcie.","Pomaga podmiana części wody na świeżą i ustawienie temperatury w górnej części zakresu gatunku.","Po tarle od razu odłów rodziców — zjadają ikrę i narybek."]},{title:"Opieka nad ikrą",items:["Ikrę wielu kąsaczy niszczy światło — przykryj zbiornik.","Usuwaj białe, zagrzybione ziarenka pipetą, żeby pleśń nie przeszła na zdrowe.","Narybek po wykluciu wisi na szybach i żywi się woreczkiem żółtkowym — nie karm, dopóki nie zacznie pływać."]},{title:"Odchów",items:["Karm małymi porcjami 3–5 razy dziennie.","Codziennie odmulaj dno i podmieniaj ok. 10% wody — narybek jest wrażliwy na zanieczyszczenia.","Do akwarium głównego przenieś młode, gdy nie zmieszczą się w pyszczkach dorosłych ryb (zwykle po 4–8 tygodniach)."]}],fryFood:["wymoczki (pantofelki) lub pył pokarmowy dla narybku — pierwsze dni","świeżo wyklute larwy artemii — gdy narybek podrośnie","mikrorobaki, drobno starty pokarm suchy"],timeline:"Wylęg zwykle po 1–3 dniach, swobodne pływanie po kolejnych 2–4 dniach."},żyworodny:{title:"Ryby żyworodne",needs:"1 samiec na 2–3 samice",level:"łatwe",signs:["Ciemna plamka ciążowa przy płetwie odbytowej powiększa się.","Brzuch staje się kanciasty, „pudełkowaty” tuż przed porodem.","Samica chowa się w roślinach."],steps:[{title:"Obsada",items:["Więcej samic niż samców — samce bez przerwy zalecają się i męczą samice.","Samica może urodzić kilka razy po jednym zapłodnieniu, bo przechowuje nasienie samca."]},{title:"Kryjówki dla narybku",items:["Gęste rośliny pływające i mech przy powierzchni uratują część narybku nawet w ogólnym akwarium.","Jeśli chcesz odchować wszystkie młode, przenieś ciężarną samicę do osobnego, gęsto zarośniętego zbiornika.","Wiszący kotnik stresuje samicę — używaj go najwyżej na kilka godzin przed porodem."]},{title:"Po porodzie",items:["Odłów samicę, bo zjada młode.","Narybek od razu pływa i je — nie ma etapu ikry ani woreczka żółtkowego."]},{title:"Odchów",items:["Karm 3–5 razy dziennie drobnym pokarmem.","Rozdziel płcie po ok. 6–8 tygodniach, jeśli nie chcesz niekontrolowanego mnożenia.","Uważaj na krzyżówki: gupik z gupikiem Endlera, platka z mieczykiem — potomstwo jest płodne i zaciera cechy odmian."]}],fryFood:["drobno roztarte płatki","pył pokarmowy dla narybku","świeżo wyklute larwy artemii"],timeline:"Ciąża trwa zwykle ok. 4 tygodni, poród co 4–6 tygodni."},"gniazdo z piany":{title:"Ryby budujące gniazdo z piany",needs:"para (jeden samiec, jedna gotowa samica)",level:"średnie",signs:["Samiec buduje pod powierzchnią gniazdo z pęcherzyków powietrza.","Samica zaokrąglona, na jej ciele pojawiają się jasne, pionowe pasy (u bojownika).","Samiec intensywnie się wybarwia i rozkłada płetwy przed samicą."],steps:[{title:"Przygotuj zbiornik",items:["Osobny zbiornik 20–40 l, niski poziom wody (10–15 cm), bez ruchu powierzchni.","Rośliny pływające albo liść, pod którym samiec zbuduje gniazdo.","Temperatura w górnej części zakresu gatunku. Szczelnie przykryj — ciepłe, wilgotne powietrze jest potrzebne narybkowi, gdy zacznie łapać powietrze."]},{title:"Zapoznanie",items:["Samicę trzymaj przez kilka dni obok samca, za przezroczystą przegrodą lub w słoiku w tym samym zbiorniku.","Gdy gniazdo jest gotowe, a samica pokazuje pasy i wyraźną brodawkę — wypuść ją."]},{title:"Tarło",items:["Samiec oplata samicę pod gniazdem i zbiera ikrę do piany.","Zaraz po tarle odłów samicę — samiec może ją zaatakować.","Samiec sam pilnuje gniazda i zbiera spadające jaja."]},{title:"Odchów",items:["Gdy narybek zacznie pływać poziomo (ok. 3 dni po wykluciu), odłów samca.","Filtr tylko gąbkowy, bardzo delikatny.","Samce bojownika trzeba rozdzielić, gdy zaczną się bić (zwykle po 8–10 tygodniach)."]}],fryFood:["wymoczki (infuzoria) — przez pierwszy tydzień","świeżo wyklute larwy artemii, mikrorobaki"],timeline:"Wylęg po 24–48 godzinach, swobodne pływanie po kolejnych ok. 3 dniach."},"opieka nad ikrą":{title:"Pielęgnice opiekujące się ikrą w parze",needs:"dobrana para",level:"średnie",signs:["Para trzyma się razem i przegania inne ryby.","Ryby czyszczą pyskiem płaski kamień, liść lub szybę.","Pojawia się brodawka płciowa (u samicy grubsza i tępa, u samca cienka i szpiczasta)."],steps:[{title:"Dobierz parę",items:["Najpewniej kupić 6–8 młodych ryb i pozwolić im same dobrać się w pary, a resztę oddać.","Para dobrana z przypadkowych dorosłych ryb często się nie dogaduje."]},{title:"Miejsce tarła",items:["Płaski kamień, łupek ustawiony ukośnie, szeroki liść albo rurka PCV — zależnie od gatunku.","Spokojne miejsce z dala od ruchliwych współmieszkańców."]},{title:"Tarło i opieka",items:["Samica składa rzędy ikry, samiec je zapładnia; para na zmianę wachluje ikrę płetwami.","W tym czasie para bywa agresywna wobec innych ryb — zapewnij im kryjówki.","Młode pary często zjadają pierwsze złoża ikry. To normalne — zwykle za kilkoma razami się uczą."]},{title:"Odchów",items:["W ogólnym akwarium narybek bywa zjadany nocą — gdy zależy Ci na młodych, przenieś parę z ikrą do osobnego zbiornika.","Część hodowców odbiera ikrę i odchowuje ją osobno z napowietrzaniem — rodzice tracą wtedy okazję do nauki opieki.","Gdy młode pływają, karm je od razu larwami artemii."]}],fryFood:["świeżo wyklute larwy artemii","mikrorobaki, drobny pokarm dla narybku"],timeline:"Wylęg po ok. 2–3 dniach, swobodne pływanie po kolejnych ok. 5 dniach."},"w jaskini":{title:"Ryby składające ikrę w jaskiniach",needs:"para albo samiec z kilkoma samicami (zależnie od gatunku)",level:"średnie",signs:["Ryba zajmuje kryjówkę i broni wejścia.","Samica wybarwia się intensywniej (u pielęgniczek Apistogramma — na żółto).","Para lub samiec częściej wchodzi do jaskini i ją czyści."],steps:[{title:"Jaskinie",items:["Łupiny kokosa, ceramiczne jaskinie, doniczki położone bokiem albo rurki — po jednej na każdą samicę i kilka zapasowych.","Otwór dopasuj do wielkości samicy — wąskie wejście daje jej poczucie bezpieczeństwa.","Dla zbrojników: rurka ceramiczna lub z łupka zamknięta z jednej strony."]},{title:"Tarło",items:["Ikra jest przyklejana do sufitu lub ściany jaskini, więc zwykle jej nie widać.","Opiekun (samica, para albo samiec — zależnie od gatunku) pilnuje wejścia i rzadko pokazuje się wtedy w akwarium."]},{title:"Odchów",items:["Po ok. tygodniu opiekun wyprowadza ławicę narybku — od tej chwili dokarmiaj larwami artemii.","Zapewnij kryjówki rybom przeganianym przez opiekunów.","Młode zbrojniki potrzebują nalotu glonów, tabletek roślinnych i sparzonej cukinii."]}],fryFood:["świeżo wyklute larwy artemii","mikrorobaki","dla zbrojników: tabletki roślinne, warzywa, nalot"],timeline:"Ikra wylęga się zwykle po 2–5 dniach (u zbrojników do ok. tygodnia), narybek wychodzi z jaskini po kolejnym tygodniu."},"w pysku":{title:"Ryby inkubujące ikrę w pysku",needs:"1 samiec na 3–4 samice (pyszczaki Malawi)",level:"średnie",signs:["Samiec wybarwia się najmocniej i kręci się wokół samicy nad płaskim kamieniem.","Po tarle samica ma wyraźnie powiększone podgardle i przestaje jeść."],steps:[{title:"Obsada",items:["Kilka samic na jednego samca rozkłada jego zaloty — pojedyncza samica byłaby bez przerwy ganiana.","Dużo skał z kryjówkami i płaskie miejsca na tarło."]},{title:"Inkubacja",items:["Samica (u pyszczaków Malawi) zbiera ikrę do pyska i nosi ją ok. 3 tygodnie, prawie nic nie jedząc.","Po ok. 2 tygodniach możesz przenieść ją ostrożnie do osobnego zbiornika, żeby wypuściła młode w spokoju.","Wyjmowanie ikry z pyska (tzw. stripping) zostaw doświadczonym — łatwo uszkodzić rybę."]},{title:"Po wypuszczeniu",items:["Młode od razu pływają i jedzą drobny pokarm.","Samicę odkarmiaj przez tydzień–dwa, zanim wróci do grupy.","W akwarium głównym część młodych przeżyje w szczelinach skał."]}],fryFood:["roztarty pokarm ze spiruliną","świeżo wyklute larwy artemii"],timeline:"Inkubacja w pysku trwa zwykle ok. 3 tygodni."},"składa jaja":{title:"Ślimaki",needs:"zależnie od gatunku: obojnaki wystarczy jeden, rozdzielnopłciowe — para",level:"łatwe",signs:["Złoża jaj na szybach, kamieniach albo nad wodą."],steps:[{title:"Liczebność zależy od pokarmu",items:["Ślimaki rozmnażają się tak szybko, jak pozwala im ilość jedzenia — przekarmianie ryb oznacza plagę ślimaków.","Żeby ograniczyć mnożenie, karm oszczędniej i wyjmuj złoża jaj."]},{title:"Ampularia",items:["Jest rozdzielnopłciowa, więc potrzebna jest para — płci nie da się łatwo rozpoznać, więc kupuje się kilka sztuk.","Różowy pakiet jaj składa nad wodą, na szybie lub pokrywie. Musi zostać wilgotny, ale nie zalany.","Młode wylęgają się po 2–4 tygodniach i same spadają do wody. Chcesz uniknąć młodych — usuń pakiet."]},{title:"Zatoczki i ślimak zabójca",items:["Zatoczki to obojnaki: galaretowate złoża jaj na szybach i liściach.","Ślimak zabójca składa pojedyncze jaja, a młode przez kilka miesięcy żyją zakopane w podłożu — mnoży się powoli."]}]},"nie w akwarium":{title:"Gatunek praktycznie nierozmnażany w akwarium",needs:"—",level:"niemożliwe w akwarium",signs:[],steps:[{title:"Dlaczego",items:["Larwy części gatunków (krewetka Amano, rogatki) potrzebują słonej lub słonawej wody, a potem stopniowego przejścia do słodkiej — to zadanie dla wyspecjalizowanych hodowli.","Inne (np. bocja wspaniała, glonojad syjamski, wargacz) w hodowlach rozmnaża się z pomocą hormonów albo w stawach.","Duże gatunki potrzebują do tarła zbiorników, których nie ma w domu."]},{title:"Co możesz zrobić",items:["Kupuj ryby z hodowli, a nie z odłowu, jeśli sklep ma taką informację — to mniej stresu dla ryby i mniej szkody dla przyrody.","Ciesz się zachowaniem w grupie — dla wielu z tych gatunków to ważniejsze niż rozmnażanie."]}]},bezkręgowce:{title:"Krewetki i raki",needs:"kilkanaście sztuk (krewetki) albo para (raki)",level:"łatwe",signs:["Samica krewetki ma za głową żółtawe „siodełko” — to rozwijające się jaja.","Po linieniu samicy samce pływają nerwowo po całym zbiorniku — szukają jej.","Samica nosi jaja pod odwłokiem i nimi wachluje."],steps:[{title:"Warunki",items:["Najważniejsza jest stabilna woda — nagłe zmiany twardości i temperatury powodują, że samice gubią jaja.","Bez ryb albo tylko z bardzo małymi, spokojnymi rybami — inaczej młode zostaną zjedzone.","Gęsty mech i pellia dają młodym kryjówkę i pokarm (biofilm)."]},{title:"Noszenie jaj",items:["Samica krewetki nosi jaja ok. 3–4 tygodni. Młode wychodzą jako miniaturowe kopie dorosłych, bez etapu larwy (dotyczy Neocaridina i Caridina z atlasu).","Samica raka karłowatego nosi jaja, a potem przez kilka dni trzyma przyczepione młode pod odwłokiem."]},{title:"Odchów",items:["Młode krewetki żywią się biofilmem — wystarczy dojrzały zbiornik z mchami, ewentualnie sproszkowany pokarm dla krewetek.","Młode raki oddziel albo zapewnij im dużo kryjówek — dorosłe raki potrafią zjadać młode.","Na wlot filtra załóż gąbkę, żeby nie wciągał młodych."]}],fryFood:["biofilm i nalot w dojrzałym zbiorniku","sproszkowany pokarm dla młodych krewetek"],timeline:"Samica nosi jaja ok. 3–4 tygodni."}},gz={"neon-innesa":{level:"trudne",tips:["Potrzebna bardzo miękka (GH poniżej 4 °n) i kwaśna woda (pH ok. 5,5–6), np. z wody RO z torfem.","Ikra i narybek są wrażliwe na światło — trzymaj zbiornik prawie w ciemności przez pierwsze dni.","Tarło zwykle w nocy lub nad ranem, w drobnolistnych roślinach lub na siatce."]},"neon-czerwony":{level:"trudne",tips:["Jak u neona Innesa, ale woda jeszcze cieplejsza i bardziej miękka. W akwariach udaje się rzadko."]},"razbora-klinowa":{level:"średnie",tips:["Ikra jest przyklejana do spodniej strony szerokich liści — w zbiorniku tarliskowym posadź kryptokorynę lub anubiasa.","Pomaga miękka, lekko kwaśna woda i temperatura ok. 27 °C."]},"danio-pregowany":{level:"łatwe",tips:["Jedna z najłatwiejszych ryb do rozmnożenia — tarło o świcie, często już następnego dnia po przeniesieniu.","Siatka lub kulki na dnie są konieczne — rodzice zjadają ikrę natychmiast."]},kardynalek:{level:"łatwe",tips:["W chłodnej wodzie (ok. 20 °C) rodzice rzadziej zjadają narybek, więc część młodych przeżywa nawet w akwarium głównym."]},"kirysek-spizowy":{level:"łatwe",tips:["Samiec ustawia się z samicą w „pozycję T”. Samica przykleja po kilka jaj na szybę, liście lub kamienie.","Tarło często wywołuje duża podmiana wody o 2–3 °C chłodniejszej, zwłaszcza przy spadku ciśnienia (jesień, deszcz).","Ikrę możesz ostrożnie zebrać palcem z szyby i przenieść do pojemnika z napowietrzaniem."]},"kirysek-panda":{level:"średnie",tips:["Jak u kiryska spiżowego — chłodniejsza podmiana i obfity pokarm mrożony. Ikra jest podatna na pleśń."]},"kirysek-pstry":{level:"łatwe",tips:["Jak u kiryska spiżowego. Gatunek z chłodniejszych wód — chłodna podmiana działa szczególnie dobrze."]},"kirysek-sterby":{level:"średnie",tips:["Jak u innych kirysków, ale tarło udaje się rzadziej. Pomaga duża grupa (8+) i chłodniejsza podmiana."]},"zbrojnik-niebieski":{level:"łatwe",tips:["Wystarczy rurka lub jaskinia zamknięta z jednej strony — samiec zaprosi do niej samicę.","Samiec wachluje ikrę przez ok. tydzień i wtedy prawie nie wychodzi.","Młode jedzą nalot, tabletki roślinne i sparzoną cukinię — potrzebują też korzenia."]},gupik:{level:"łatwe",tips:["Rozmnaża się sam. Problemem jest raczej nadmiar młodych — zaplanuj, co z nimi zrobisz (sklep, znajomi).","Odmiany zachowasz tylko trzymając jedną odmianę w zbiorniku."]},bojownik:{level:"średnie",tips:["Tarło jest łatwe, trudny jest odchów: setki młodych potrzebują wymoczków, a potem osobnych pojemników dla każdego samca.","Samiec pilnuje gniazda bardzo starannie — nie przestawiaj niczego w zbiorniku."]},skalar:{level:"średnie",tips:["Ikrę składa na pionowym liściu, łupku lub rurce ustawionej pod kątem — warto ją dostawić.","Zbiornik musi być wysoki. Para potrafi zjeść ikrę przy hałasie lub nagłym zapaleniu światła."]},ramirezka:{level:"średnie",tips:["Ikrę składa na płaskim kamieniu lub w dołku w piasku.","Potrzebna ciepła (ok. 28–29 °C), miękka i bardzo czysta woda — azotany jak najniższe.","Młode pary często zjadają ikrę kilka razy, zanim się nauczą."]},barwniak:{level:"łatwe",tips:["Para zajmuje jaskinię i rozmnaża się nawet w ogólnym akwarium.","Proporcja płci narybku zależy od pH — w kwaśnej wodzie rodzi się więcej samców."]},"pielegnica-zebra":{level:"łatwe",tips:["Rozmnaża się bardzo chętnie i często — przygotuj się na nadmiar młodych i agresję pary w czasie opieki."]},"pyszczak-zebra":{level:"średnie",tips:["Rozmnaża się chętnie w dobrze urządzonym akwarium Malawi. Nie łącz różnych gatunków mbuna o podobnym ubarwieniu — krzyżują się."]},"teczanka-neonowa":{level:"średnie",tips:["Ikrę składa codziennie po kilka ziarenek na mopie z włóczki lub w mchu. Mop co kilka dni przenieś do osobnego zbiornika.","Ikra wylęga się dopiero po ok. 7–12 dniach, a narybek jest bardzo drobny — zaczynaj od wymoczków."]},"zlota-rybka":{level:"łatwe",tips:["Najłatwiej w oczku wodnym lub dużym zbiorniku po wiosennym ociepleniu wody.","Samiec intensywnie goni samicę. Ikra przykleja się do roślin — rodzice ją zjadają."]},"krewetka-red-cherry":{level:"łatwe",tips:["Kolonia zwykle rozrasta się sama w dojrzałym zbiorniku bez ryb. Stabilność wody jest ważniejsza niż konkretne liczby."]},"krewetka-crystal-red":{level:"trudne",tips:["Wymaga bardzo stabilnej, miękkiej wody (TDS ok. 100–160 ppm) i aktywnego podłoża. Nawet niewielkie wahania kończą się gubieniem jaj."]},ampularia:{level:"łatwe",tips:["Między pokrywą a wodą zostaw kilka centymetrów wolnej przestrzeni — inaczej nie będzie gdzie złożyć jaj."]}},bz=(s,r)=>r==="nie w akwarium"?"niemożliwe w akwarium":(s.kind==="krewetka"||s.kind==="rak")&&r==="ikra"?"łatwe":jp[r].level;function Rc(s){const r=da[s.id];if(!r)return null;const c=(s.kind==="krewetka"||s.kind==="rak")&&r.breed==="ikra",u=jp[c?"bezkręgowce":r.breed],m=gz[s.id];return{guide:u,level:m?.level??bz(s,r.breed),tips:m?.tips??[],note:r.breedNote,sex:r.sex}}const xp={łatwe:"bg-emerald-100 text-emerald-800 dark:bg-emerald-950/50 dark:text-emerald-300",średnie:"bg-amber-100 text-amber-800 dark:bg-amber-950/50 dark:text-amber-300",trudne:"bg-red-100 text-red-800 dark:bg-red-950/50 ]],plants:["nurzaniec-srubowy","moczarka","higrofila","mech-jawajski","ceratopteris"],tips:"Trzymaj więcej samic niż samców. Gęste rośliny pływające uratują część narybku."},{id:"bojownik-30",name:"Bojownik 30 l",icon:"🐠",litres:30,light:"średnie",co2:!1,desc:"Samiec bojownika w spokojnym, zarośniętym zbiorniku z krewetkami Amano i ślimakiem.",animals:[["bojownik",1],["krewetka-amano",3],["rogatka-zebra",1]],plants:["anubias-nana","kryptokoryna-wendta","mech-jawajski","phyllanthus"],tips:"Słaby przepływ wody i rośliny pływające — bojownik lubi spokojną powierzchnię."},{id:"chlodne-120",name:"Bez grzałki 120 l",icon:"❄️",litres:120,light:"średnie",co2:!1,desc:"Ryby chłodnowodne, które dobrze czują się w temperaturze pokojowej.",animals:[["kardynalek",10],["ryzanka-japonska",6],["zatoczek-rogowy",3]],plants:["moczarka","rogatek","nurzaniec-srubowy","mech-jawajski"],tips:"Latem pilnuj, żeby woda nie przekraczała 24 °C — postaw akwarium z dala od okna."},{id:"malawi-300",name:"Malawi 300 l",icon:"🪨",litres:300,light:"średnie",co2:!1,desc:"Pyszczaki z jeziora Malawi wśród skał, w twardej, zasadowej wodzie.",animals:[["pyszczak-cytrynowy",6],["pyszczak-zebra",6]],plants:["anubias-bartera","anubias-kawolistny"],tips:"Jeden samiec na 3–4 samice każdego gatunku, dużo skał z kryjówkami. Rośliny tylko twarde — resztę zjedzą."}],Yi=[{id:"neon-innesa",name:"Neon Innesa",latin:"Paracheirodon innesi",kind:"ryba",temp:[20,26],ph:[5,7],gh:[1,10],minLitres:54,minGroup:10,sizeCm:3.5,temperament:"spokojna",zone:"środkowa",origin:"Ameryka Płd. (dorzecze Amazonki)",diet:"wszystkożerny, drobny pokarm",notes:"Wrażliwy na wahania parametrów — wpuszczaj do dojrzałego zbiornika. Hodowlany znosi wodę do pH 7,5."},{id:"neon-czerwony",name:"Neon czerwony",latin:"Paracheirodon axelrodi",kind:"ryba",temp:[24,29],ph:[4.5,6.8],gh:[1,6],minLitres:60,minGroup:10,sizeCm:4,temperament:"spokojna",zone:"środkowa",origin:"Ameryka Płd. (Rio Negro)",diet:"wszystkożerny, drobny pokarm",notes:"Potrzebuje ciepl biornika do wpuszczenia pierwszych ryb — w jakiej kolejności i dlaczego tak powoli.",blocks:[{h:"1. Zbiornik"},{p:"Na początek lepszy jest większy zbiornik niż mniejszy. W 60–120 l parametry wody zmieniają się wolniej, a błędy (przekarmienie, śnięta ryba) mniej szkodzą. Nano-akwaria poniżej 30 l są trudniejsze, nie łatwiejsze."},{list:["Postaw akwarium na stabilnej, poziomej szafce, która udźwignie ok. 1,2 kg na każdy litr (woda, podłoże, kamienie).","Z dala od okna — słońce to glony i przegrzewanie latem.","Blisko gniazdka, ale tak, żeby kable tworzyły pętlę poniżej gniazdka — woda spływająca po kablu nie trafi do prądu."]},{h:"2. Sprzęt"},{list:["Filtr — najważniejszy element. Dla początkującego dobry jest filtr wewnętrzny lub kubełkowy o wydajności ok. 3–5 pojemności zbiornika na godzinę.","Grzałka z termostatem (ok. 1 W na litr) — dla ryb tropikalnych. Ryby chłodnowodne jej nie potrzebują.","Oświetlenie LED z wyłącznikiem czasowym.","Termometr, uzdatniacz do wody z kranu, wiadro tylko do akwarium, wąż do odmulania.","Testy do wody — co najmniej azotyny (NO₂), azotany (NO₃), pH i KH."]},{h:"3. Podłoże, dekoracje, rośliny"},{p:"Płucz żwir lub piasek, aż woda będzie przejrzysta. Korzenie namocz kilka dni, żeby nie pływały i mniej barwiły wodę. Kamienie kupuj akwarystyczne — wapienne (np. marmur) podnoszą twardość i pH."},{p:"Posadź dużo roślin od pierwszego dnia — zużywają związki azotu i konkurują z glonami. Łatwe na start: anubiasy, mikrozorium, kryptokoryny, moczarka, rogatek, mech jawajski."},{h:"4. Dojrzewanie — bez ryb"},{p:"Zalej, włącz filtr i grzałkę, dodaj uzdatniacz. Teraz zbiornik musi dojrzeć: w filtrze mają się rozwinąć bakterie, które rozkładają toksyczne odchody ryb. Trwa to zwykle 3–6 tygodni. Szczegóły w poradniku „Cykl azotowy”."},{warn:"Najczęstszy błąd początkujących: ryby wpuszczone po 2–3 dniach. Woda wygląda czysto, ale bakterii jeszcze nie ma, rośnie amoniak i azotyny — ryby chorują i giną w pierwszych tygodniach."},{h:"5. Pierwsze ryby"},{list:["Gdy azotyny i amoniak spadną do zera, wpuść pierwszą, niewielką grupę odpornych ryb.","Kolejne dokładaj co 1–2 tygodnie, testując azotyny — bakterie muszą nadążyć za rosnącą obsadą.","Przed zakupem sprawdź w atlasie aplikacji, czy gatunki do siebie pasują."],ordered:!1},{tip:"Załóż w aplikacji akwarium z datą startu — przez pierwsze 4 tygodnie ekran akwarium przypomina o dojrzewaniu."}]},{id:"cykl-azotowy",level:"początkujący",title:"Cykl azotowy, czyli dlaczego akwarium musi dojrzeć",icon:"🔄",minutes:5,summary:"Skąd biorą się amoniak, azotyny i azotany, jak dojrzewa filtr i po czym poznać, że można wpuścić ryby.",blocks:[{p:"Ryby wydalają amoniak, a resztki pokarmu i obumarłe liście rozkładają się do amoniaku. Amoniak jest silnie toksyczny. Na szczęście w filtrze i na każdej powierzchni w akwarium osiedlają się bakterie, które przerabiają go dalej:"},{list:["Amoniak / amon (NH₃/NH₄⁺) — bardzo toksyczny.","↓ bakterie nitryfikacyjne","Azotyny (NO₂⁻) — też toksyczne, utrudniają krwi przenoszenie tlenu.","↓ kolejne bakterie","Azotany (NO₃⁻) — znacznie mniej szkodliwe, gromadzą się i usuwa je podmiana wody oraz rośliny."]},{p:"Toksyczność amoniaku rośnie z pH i temperaturą: przy pH powyżej 7 coraz więcej jest w formie NH₃, która szkodzi najbardziej. W miękkiej, kwaśnej wodzie przeważa łagodniejszy jon amonowy NH₄⁺."},{h:"Jak przebiega dojrzewanie"},{list:["Najpierw pojawia się amoniak.","Po 1–2 tygodniach rosną azotyny — to znak, że pierwsze bakterie już pracują.","Potem azotyny spadają, a rosną azotany.","Zbiornik jest dojrzały, gdy amoniak i azotyny są stale na zero, a azotany rosną."],ordered:!0},{h:"Dojrzewanie bez ryb (zalecane)"},{p:"Bakterie potrzebują „pokarmu”. Dodawaj szczyptę pokarmu dla ryb co 2–3 dni albo czysty amoniak akwarystyczny według instrukcji. Testuj NH₄ i NO₂ co 2–3 dni i zapisuj wyniki w zakładce „Woda” — na wykresie zobaczysz charakterystyczną górkę azotynów."},{tip:"Starter bakteryjny ze sklepu albo garść gąbki z dojrzałego filtra znajomego akwarysty potrafią skrócić dojrzewanie do 1–2 tygodni. Mimo to testuj — dopiero wynik testu mówi, że jest gotowe."},{h:"Jak nie zepsuć dojrzałego filtra"},{list:["Nie myj wkładów pod kranem — chlor zabija bakterie. Płucz je w wodzie z akwarium.","Nie wymieniaj wszystkich wkładów naraz.","Filtr nie może stać wyłączony dłużej niż godzinę–dwie: bakterie się duszą, a po włączeniu do wody trafia zgnilizna.","Antybiotyki i część leków osłabiają bakterie — po leczeniu testuj azotyny częściej."]}]},{id:"pomiar-wody",level:"początkujący",title:"Jak mierzyć parametry wody",icon:"🧪",minutes:8,summary:"Testy kropelkowe, paski i mierniki elektroniczne: co wybrać, jak wykonać pomiar poprawnie, jak czytać wynik i jak często badać wodę.",blocks:[{h:"Co mierzyć i kiedy"},{table:{head:["Parametr","Po co","Jak często"],rows:[["Azotyny NO₂","Toksyczne; pokazują, czy filtr działa","Nowe akwarium: co 2–3 dni. Dojrzałe: przy problemach i po zmianach obsady"],["Amoniak NH₃/NH₄","Toksyczny, ważny w nowym zbiorniku","Jak azotyny"],["Azotany NO₃","Mówią, czy podmiany wystarczają","Co 1–2 tygodnie, przed podmianą"],["pH","Wymagania ryb, stabilność","Co tydzień–dwa"],["KH","Bufor trzymający pH","Co 2–4 tygodnie"],["GH","Twardość — wymagania ryb i krewetek","Co 2–4 tygodnie i po zmianie źródła wody"],["Temperatura","Codziennie rzut oka na termometr","Codziennie"]]}},{h:"Rodzaje testów"},{list:["Testy kropelkowe — najdokładniejsze w domowych warunkach i tańsze w przeliczeniu na pomiar. Polecane jako podstawa.","Paski — szybkie i wygodne, ale mniej dokładne; wilgoć w otwartym opakowaniu psuje je szybko. Dobre do szybkiego sprawdzenia, nie do diagnozowania problemu. Wiele pasków w ogóle nie mierzy amoniaku.","Miernik elektroniczny pH — dokładny, o ile jest regularnie kalibrowany.","Miernik TDS (konduktometr) — pokazuje ilość rozpuszczonych soli. Niezbędny przy wodzie RO i krewetkach, nie zastępuje testów GH/KH."]},{h:"Test kropelkowy krok po kroku"},{list:["Przeczytaj instrukcję tego konkretnego testu — producenci różnią się ilością wody i kropli.","Wypłucz probówkę wodą z akwarium (nie z kranu).","Nabierz próbkę ze środka akwarium, nie spod powierzchni i nie z wylotu filtra. Odmierz dokładnie do kreski — dolny brzeg menisku na kresce.","Butelkę z odczynnikiem trzymaj pionowo, dnem do góry, żeby krople miały równą wielkość. Przed użyciem wstrząśnij nią, jeśli instrukcja tak mówi.","Zakręć probówkę i wymieszaj. Nie zatykaj jej palcem — skóra zanieczyszcza próbkę.","Odczekaj dokładnie tyle, ile podaje instrukcja (często 3–10 minut). Za krótko lub za długo = zły kolor.","Porównaj kolor w świetle dziennym, na tle białej części karty kolorów. Patrz tak, jak każe instrukcja — z boku albo z góry przez całą wysokość probówki.","Wypłucz probówkę czystą wodą i wysusz."],ordered:!0},{warn:"Test azotanów (NO₃) bywa zdradliwy: w wielu zestawach jeden z odczynników zawiera osad, który trzeba bardzo mocno wstrząsnąć (np. przez 30 s), a samą probówkę mieszać dłużej. Słabe wstrząśnięcie zaniża wynik — zbiornik wygląda na czystszy, niż jest."},{h:"Testy miareczkowe GH i KH"},{p:"Tu nie porównuje się kolorów z kartą, tylko liczy krople. Dodajesz odczynnik po jednej kropli, mieszając po każdej, aż kolor zmieni się trwale (np. z niebieskiego na żółty przy KH). W większości testów jedna kropla = 1 °n (stopień niemiecki), ale sprawdź to w instrukcji."},{tip:"Dla dokładności możesz podwoić ilość wody w próbce: wtedy każda kropla to 0,5 °n. Przydaje się przy miękkiej wodzie dla krewetek Caridina."},{h:"Miernik elektroniczny pH"},{list:["Kalibruj co 2–4 tygodnie płynami wzorcowymi (np. pH 7,0 i 4,0) — miernik bez kalibracji potrafi kłamać o kilka dziesiątych.","Elektrodę przechowuj wilgotną, w płynie do przechowywania (KCl) — nigdy w wodzie destylowanej, która ją niszczy.","Przed pomiarem opłucz elektrodę wodą z akwarium i poczekaj, aż odczyt się ustabilizuje."]},{h:"Pułapki"},{list:["pH zmienia się w ciągu doby — rano jest niższe (w nocy rośliny oddają CO₂). Mierz zawsze o podobnej porze.","Mierz przed podmianą wody, a nie zaraz po niej — po podmianie wynik jest zawsze lepszy niż rzeczywistość.","Nie mierz zaraz po nawożeniu ani dodaniu preparatów.","Odczynniki się starzeją: sprawdzaj datę ważności, przechowuj je w ciemnym i chłodnym miejscu. Otwarte zwykle tracą dokładność po 1–2 latach.","Wynik dziwny? Powtórz pomiar, a jeśli możesz — sprawdź wodę z kranu tym samym testem. Gdy kranówka pokazuje azotyny, problem jest w teście albo w wodociągu, nie w akwarium."]},{h:"Jednostki"},{p:"Twardość: 1 °n (°dH) = 17,8 mg/l CaCO₃ (ppm). Gdy test lub wodociąg podaje twardość w mg/l CaCO₃, podziel przez 17,8. Gdy podaje w mmol/l, pomnóż przez 5,6."},{tip:"Zapisuj każdy pomiar w zakładce „Woda”. Pojedynczy wynik mało mówi — trend na wykresie (np. azotany rosnące z tygodnia na tydzień) mówi bardzo dużo."}]},{id:"podmiana-wody",level:"początkujący",title:"Podmiana wody i odmulanie",icon:"🪣",minutes:4,summary:"Ile wody wymieniać, jak często, jak przygotować świeżą wodę i jak czyścić dno.",blocks:[{p:"Podmiana wody to najważniejszy zabieg pielęgnacyjny. Usuwa azotany i inne substancje, których filtr nie rozkłada, i uzupełnia minerały."},{h:"Ile i jak często"},{list:["Typowo 20–30% wody raz w tygodniu.","Zbiornik gęsto obsadzony albo z wysokimi azotanami — częściej lub więcej.","Regularność jest ważniejsza niż ilość: lepiej co tydzień 25% niż raz w miesiącu 70%."]},{warn:"Unikaj bardzo dużych podmian w zaniedbanym akwarium. Ryby przyzwyczajone do starej wody mogą źle znieść nagłą zmianę pH i twardości. Doprowadzaj je do porządku kilkoma mniejszymi podmianami co 2–3 dni."},{h:"Świeża woda"},{list:["Woda z kranu zawiera chlor lub chloraminę — dodaj uzdatniacz zgodnie z instrukcją (na pojemność nowej wody albo całego zbiornika, zależnie od produktu).","Temperatura nowej wody powinna być zbliżona do akwariowej (różnica najwyżej 1–2 °C).","Jeżeli mieszasz wodę z kranu z wodą RO, przygotuj ją wcześniej w wiadrze i sprawdź twardość."]},{h:"Odmulanie"},{list:["Wąż z dzwonem (odmulacz) wbijaj w żwir — zasysa brud spomiędzy ziaren, a żwir opada z powrotem.","W piasku tylko przesuwaj dzwon nad powierzchnią.","Nie odmulaj całego dna naraz w gęsto obsadzonym roślinami zbiorniku — czyść po kawałku przy kolejnych podmianach."]},{tip:"W zakładce „Prace” dodaj zadanie „Podmiana wody” co 7 dni — aplikacja przypomni w telefonie, a odhaczenie trafi do dziennika."}]},{id:"karmienie",level:"początkujący",title:"Karmienie — ile, czym i jak często",icon:"🍤",minutes:3,summary:"Przekarmienie to najczęstsza przyczyna złej wody. Jak dawkować pokarm i co robić na wyjeździe.",blocks:[{list:["Podawaj tyle, ile ryby zjedzą w 2–3 minuty, 1–2 razy dziennie.","Resztki, które opadły na dno i leżą, to za dużo — gniją i podnoszą amoniak.","Raz w tygodniu dzień postu — zdrowym dorosłym rybom to służy.","Ryby denne (kiryski, zbrojniki) potrzebują tonącego pokarmu, podawanego najlepiej wieczorem."]},{h:"Różnorodność"},{p:"Dobry płatek lub granulat jako podstawa, do tego 2–3 razy w tygodniu pokarm mrożony (ochotka, artemia, rozwielitka). Roślinożercy (molinezje, zbrojniki, pyszczaki Malawi) potrzebują pokarmu ze spiruliną i warzyw — sparzona cukinia, ogórek, szpinak."},{warn:"Mrożonki rozmrażaj w odrobinie wody z akwarium i odlewaj sok z rozmrożonego pokarmu — jest bogaty w fosforany."},{h:"Wyjazd"},{p:"Zdrowe dorosłe ryby w dojrzałym akwarium spokojnie zniosą tydzień bez karmienia. Na dłużej lepszy jest automatyczny karmnik niż sąsiad, który „dla pewności” wsypie pół puszki. Jeśli ktoś ma karmić — odmierz porcje w osobnych woreczkach."}]},{id:"aklimatyzacja",level:"początkujący",title:"Wpuszczanie nowych ryb i krewetek",icon:"🛍️",minutes:4,summary:"Aklimatyzacja do temperatury i wody, metoda kroplowa dla krewetek i kwarantanna.",blocks:[{h:"Ryby — metoda pływającego worka"},{list:["Zgaś światło w akwarium — nowe ryby mniej się stresują.","Połóż zamknięty worek na wodzie na 15–20 minut, żeby wyrównać temperaturę.","Otwórz worek i co 5–10 minut dolewaj do niego trochę wody z akwarium, przez ok. 30 minut.","Przełóż ryby siatką do akwarium. Wodę ze sklepu wylej do zlewu — nie do akwarium (mogą w niej być pasożyty i leki)."],ordered:!0},{h:"Krewetki i ryby wrażliwe — metoda kroplowa"},{p:"Przelej zwierzęta z wodą do pojemnika. Wężykiem z kranikiem lub zawiązanym supłem puść z akwarium krople wody (ok. 2–3 na sekundę). Po 1–2 godzinach, gdy wody przybędzie 3–4 razy, przenieś je do zbiornika. Krewetki są bardzo wrażliwe na nagłe zmiany GH i TDS."},{h:"Kwarantanna"},{p:"Najbezpieczniej nowe ryby trzymać 2–4 tygodnie w osobnym, małym akwarium z filtrem. Większość chorób (np. ospa rybia) ujawnia się w tym czasie, zanim zarazi całą obsadę."},{tip:"Pytaj sprzedawcę, w jakiej wodzie trzymane były ryby (pH, twardość). Im bliżej Twojej wody, tym łatwiejsza aklimatyzacja."}]},{id:"twardosc-ph",level:"średniozaawansowany",title:"Twardość i pH — jak je bezpiecznie zmieniać",icon:"⚗️",minutes:7,summary:"Czym różnią się GH i KH, dlaczego pH skacze i jak zmiękczyć lub utwardzić wodę bez szkody dla ryb.",blocks:[{h:"GH, KH i pH — jak się łączą"},{list:["GH (twardość ogólna) — ilość wapnia i magnezu. Ważna dla budowy ciała ryb, muszli ślimaków i linienia krewetek.","KH (twardość węglanowa) — ilość węglanów i wodorowęglanów. Działa jak bufor: trzyma pH w miejscu.","pH — kwasowość. Przy niskim KH łatwo spada (np. przez rozkład materii organicznej i CO₂), przy wysokim jest stabilne, ale trudno je obniżyć."]},{warn:"Stabilność jest ważniejsza niż „idealna” wartość. Ryba hodowlana w stałym pH 7,5 czuje się lepiej niż w pH, które co kilka dni skacze między 6,0 a 7,0 w pogoni za wymaganiami z książki. Zmieniaj pH o nie więcej niż ok. 0,3 na dobę."},{h:"Zmiękczanie wody"},{list:["Woda RO (z odwróconej osmozy) zmieszana z kranówką — najpewniejsza metoda. Wzór: udział kranówki = docelowa twardość ÷ twardość kranówki. Przykład: kranówka GH 15, cel GH 5 → 1/3 kranówki + 2/3 wody RO.","Torf w filtrze — obniża KH i pH, barwi wodę na herbaciano.","Liście ketapangu, szyszki olchy, korzenie — dodają garbników, lekko zakwaszają, mają łagodne działanie antybakteryjne. Ich wpływ na twardość jest niewielki.","Deszczówka — niezalecana w mieście (zanieczyszczenia z dachów i powietrza)."]},{h:"Utwardzanie wody"},{list:["Sole mineralizujące do akwarium (GH+, a niektóre także KH+) — dawkuj wg instrukcji, mierz po każdej zmianie.","Sól oczyszczona do pieczenia (wodorowęglan sodu) podnosi KH: ok. 3 g na 100 l podnosi KH o mniej więcej 1 °n. Nie podnosi GH. Dodawaj stopniowo, rozpuszczoną w wodzie.","Aragonit, piasek koralowy, kamienie wapienne — podnoszą GH i KH powoli i trwale. Dobre dla pielęgnic z jezior Malawi i Tanganika oraz żyworodnych."]},{tip:"W planerze obsady atlasu zobaczysz wspólny zakres pH i GH dla wybranych gatunków. Łatwiej dobrać ryby do swojej kranówki niż kranówkę do ryb."}]},{id:"glony",level:"średniozaawansowany",title:"Glony — rozpoznawanie i przyczyny",icon:"🟢",minutes:6,summary:"Glony to objaw, nie choroba. Jakie są najczęstsze rodzaje, co je powoduje i jak się ich pozbyć.",blocks:[{p:"Trochę glonów jest w każdym zdrowym akwarium. Plaga pojawia się, gdy brakuje równowagi między światłem, nawozami a roślinami — glony wygrywają tam, gdzie rośliny nie nadążają."},{table:{head:["Rodzaj","Wygląd","Częsta przyczyna","Co pomaga"],rows:[["Okrzemki","Brązowy, ścieralny nalot","Nowe akwarium, krzemiany","Mijają same; otoskrzelki, rogatki"],["Zielone kropki","Twarde, zielone kropki na szybie i liściach","Dużo światła, mało fosforanów","Skrobak; krótsze oświetlenie"],["Nitkowate","Zielone nitki, „włosy”","Za dużo światła, nadmiar nawozów","Wyciąganie, krewetki Amano, mniej światła"],["Krasnorost (pędzelek)","Ciemne kępki na brzegach liści i korzeniach","Wahania CO₂, słaby przepływ","Usuwanie liści, stabilne CO₂, glonojad syjamski"],["Sinice","Niebiesko-zielony śluz, nieprzyjemny zapach","Mało azotanów, martwe strefy, brud","Odessać, poprawić przepływ, zaciemnienie 3–4 dni"],["Zielona woda","Woda jak zupa groszkowa","Nadmiar światła i związków odżywczych","Zaciemnienie, lampa UV-C, podmiany"]]}},{h:"Zasady ogólne"},{list:["Oświetlenie 6–8 godzin dziennie na wyłączniku czasowym. Więcej światła = więcej problemów, jeśli rośliny go nie wykorzystują.","Dużo szybko rosnących roślin — to najlepsza „broń” na glony.","Regularne podmiany i nieprzekarmianie.","Nie lecz glonów chemią na ślepo — wiele preparatów szkodzi krewetkom i roślinom, a przyczyna zostaje."]},{tip:"Zmierz azotany i fosforany. Zarówno ich nadmiar, jak i całkowity brak (np. NO₃ = 0 przy sinicach) to wskazówka, co poprawić."}]},{id:"rosliny",level:"średniozaawansowany",title:"Rośliny, światło i nawożenie",icon:"🌿",minutes:6,summary:"Jak dobrać rośliny do oświetlenia, sadzić je poprawnie i nawozić, żeby rosły zamiast gnić.",blocks:[{h:"Trzy rzeczy, których potrzebuje roślina"},{list:["Światło — jego siła decyduje, jak szybko roślina chce rosnąć.","Węgiel (CO₂) — w akwarium bez dozowania jest go mało, więc rośliny rosną wolniej.","Nawozy — makroelementy (azot, fosfor, potas) i mikroelementy (żelazo i inne)."]},{p:"Roślina rośnie tak szybko, jak pozwala składnik, którego brakuje najbardziej. Mocne światło bez CO₂ i nawozów nie przyspiesza roślin, tylko glony."},{h:"Rośliny łatwe (słabe światło, bez CO₂)"},{list:["Anubiasy i mikrozorium (paproć jawajska) — przywiązuj do korzenia lub kamienia; nie zakopuj kłącza, bo zgnije.","Kryptokoryny — sadzone w podłożu, lubią nawozy w kulkach pod korzenie. Po przesadzeniu często „topnieją” i odrastają.","Mech jawajski, rogatek, moczarka, nurzaniec — szybko rosną i dobrze konkurują z glonami.","Rośliny pływające (salwinia, limnobium) — świetnie zbierają nadmiar związków odżywczych."]},{h:"Nawożenie"},{list:["Nawóz płynny w kolumnę wody — dla roślin pobierających składniki liśćmi (łodygowe, mchy, epifity).","Nawóz w kulkach lub tabletkach pod korzenie — dla kryptokoryn, żabienic, nurzańców.","Zaczynaj od połowy dawki z instrukcji i obserwuj."]},{table:{head:["Objaw","Możliwy niedobór"],rows:[["Starsze liście żółkną","Azot"],["Dziurki w liściach, brzegi brązowieją","Potas"],["Nowe liście blade, prawie białe, nerwy zielone","Żelazo"],["Zahamowany wzrost, karłowate liście na czubkach","Wapń lub magnez (bardzo miękka woda)"]]}},{warn:"Krewetki są wrażliwe na miedź. Zanim kupisz nawóz do akwarium z krewetkami, sprawdź skład."}]},{id:"filtr",level:"średniozaawansowany",title:"Filtr i sprzęt — pielęgnacja",icon:"⚙️",minutes:4,summary:"Jak czyścić filtr, żeby nie zniszczyć bakterii, i o co dbać przy grzałce i oświetleniu.",blocks:[{h:"Filtr"},{list:["Czyść, gdy przepływ wyraźnie słabnie — zwykle co 4–8 tygodni. Za częste czyszczenie szkodzi.","Gąbki i wkłady biologiczne płucz w wiadrze z wodą z akwarium, do usunięcia grubego brudu. Nie mają być „jak nowe”.","Wymieniaj wkłady stopniowo — najwyżej połowę naraz, z kilkutygodniową przerwą.","Węgiel aktywny działa kilka tygodni, potem jest zwykłym wkładem. Usuń go na czas leczenia — wiąże leki.","Wirnik i rurki przetrzyj szczoteczką raz na kilka miesięcy."]},{tip:"Nie rób tego samego dnia dużej podmiany wody i czyszczenia filtra — bakterie i ryby dostają wtedy podwójny wstrząs."},{h:"Grzałka"},{list:["Sprawdzaj termometrem, czy temperatura zgadza się z ustawioną na grzałce — termostaty z czasem się rozkalibrowują.","Wyłącz grzałkę na kilka minut przed wyjęciem jej z wody i przed podmianą, przy której odsłoni się jej szklana część — gorące szkło może pęknąć."]},{h:"Oświetlenie"},{p:"Stała pora włączania na wyłączniku czasowym. Lampa LED z czasem traci jasność — po kilku latach rośliny mogą rosnąć gorzej, choć z pozoru nic się nie zmieniło."}]},{id:"choroby",level:"średniozaawansowany",title:"Najczęstsze choroby ryb",icon:"🩺",minutes:6,summary:"Jak rozpoznać ospę rybią, pleśniawkę i gnicie płetw, kiedy leczyć i na co uważać przy lekach.",blocks:[{warn:"Zanim sięgniesz po lek, zmierz wodę. Większość chorób w akwarium wybucha, gdy ryby są osłabione złą wodą — sam lek bez poprawy warunków nie pomoże."},{h:"Ospa rybia (ichtioftirioza)"},{p:"Białe kropki jak ziarenka soli na ciele i płetwach, ryby ocierają się o podłoże. Pasożyt jest wrażliwy tylko w stadium pływającym, dlatego leczy się cały zbiornik przez kilka dni po zniknięciu ostatniej kropki. Stosuje się preparaty przeciw ospie dostępne w sklepach akwarystycznych oraz stopniowe podniesienie temperatury do ok. 28–30 °C — tylko jeśli wszystkie gatunki w zbiorniku to znoszą, przy mocnym napowietrzaniu."},{h:"Gnicie płetw"},{p:"Postrzępione, białawe brzegi płetw, które się skracają. Zwykle bakteryjne, wywołane złą wodą lub urazami (np. skubanie przez inne ryby). Najpierw podmiany i usunięcie przyczyny; w zaawansowanych przypadkach preparat przeciwbakteryjny."},{h:"Pleśniawka"},{p:"Białe, waciste kłaczki, zwykle na ranach. Często wtórna do urazu. Pomaga czysta woda i preparaty przeciwgrzybicze."},{h:"Puchlina (wodobrzusze)"},{p:"Ryba wzdęta, łuski odstają jak szyszka. To objaw ciężkiego uszkodzenia narządów wewnętrznych, rokowanie jest złe. Odizoluj chorą rybę."},{h:"Leczenie — zasady"},{list:["Najlepiej leczyć w osobnym zbiorniku szpitalnym, jeśli chora jest jedna ryba.","Ospę i choroby zakaźne leczy się w całym akwarium.","Usuń węgiel aktywny z filtra.","Krewetki i ślimaki są bardzo wrażliwe na wiele leków (zwłaszcza zawierające miedź) — przenieś je albo wybierz lek bezpieczny dla bezkręgowców.","Trzymaj się dawki i czasu leczenia z ulotki. Nie mieszaj leków.","Po leczeniu testuj azotyny — leki mogą osłabić bakterie w filtrze."]},{tip:"Zapisuj w dzienniku akwarium objawy i daty — łatwiej potem powiedzieć weterynarzowi lub w sklepie, co się działo."}]},{id:"diagnoza",level:"średniozaawansowany",title:"Co się dzieje? Objawy i przyczyny",icon:"🔎",minutes:4,summary:"Szybka ściąga: najczęstsze niepokojące objawy w akwarium, ich prawdopodobne przyczyny i pierwsze kroki.",blocks:[{table:{head:["Objaw","Możliwa przyczyna","Pierwszy krok"],rows:[["Ryby przy powierzchni łapią powietrze","Mało tlenu, nadmiar CO₂, azotyny lub amoniak","Zmierz NO₂ i NH₄, napowietrz, podmień 30–50% wody"],["Biała, mleczna woda w nowym akwarium","Zakwit bakteryjny","Cierpliwość, mniej karmienia, nie myj filtra"],["Zielona woda","Zakwit glonów zawiesinowych","Zaciemnienie 3–4 dni, lampa UV-C"],["Krewetki giną po podmianie","Zbyt duża zmiana parametrów, chlor, miedź","Mniejsze podmiany, uzdatniacz, aklimatyzacja kroplowa"],["Ryby blade, chowają się","Stres, zła woda, agresja, brak kryjówek","Test wody, sprawdź zgodność obsady"],["Ryby ocierają się o podłoże i kamienie","Pasożyty (ospa), podrażnienie amoniakiem","Obejrzyj ryby z bliska, zmierz NH₄"],["Szybkie oddychanie, rozchylone skrzela","Azotyny, mało tlenu, pasożyty skrzeli","Test NO₂, napowietrzanie"],["pH stale spada","KH bliskie zeru","Zmierz KH, podnieś je (poradnik o twardości)"],["Biały, puszysty nalot na nowym korzeniu","Nieszkodliwy nalot bakteryjno-grzybowy","Mija sam po kilku tygodniach"],["Ślimaków nagle dużo","Przekarmianie","Mniej pokarmu, wyławiaj ręcznie"]]}},{tip:"Większość problemów zaczyna się od wody. Zmierz azotyny, amoniak i azotany — zakładka „Woda” od razu oceni wynik i porówna go z wymaganiami Twojej obsady."}]},{id:"co2",level:"zaawansowany",title:"CO₂ pod ciśnieniem i drop checker",icon:"🫧",minutes:6,summary:"Jak działa zestaw CO₂, jak ustawić dozowanie, czytać kolor drop checkera i nie podtruć ryb.",blocks:[{p:"Dwutlenek węgla to główne „paliwo” roślin. W akwarium z mocnym światłem i wymagającymi roślinami (dywanowe, czerwone łodygowe) bez dozowania CO₂ rośliny głodują, a glony wygrywają."},{h:"Zestaw"},{list:["Butla CO₂ z reduktorem i zaworem iglicowym do precyzyjnej regulacji.","Elektrozawór podłączony do wyłącznika czasowego.","Licznik bąbelków i zawór zwrotny (chroni reduktor przed cofnięciem wody).","Dyfuzor (ceramiczny, reaktor przepływowy) — rozpuszcza gaz w wodzie.","Drop checker — szklana kapsułka z płynem wskaźnikowym."]},{h:"Drop checker"},{p:"Napełnia się go płynem o KH 4 °n ze wskaźnikiem. Kolor pokazuje stężenie CO₂ z opóźnieniem ok. 1–2 godzin:"},{table:{head:["Kolor","Znaczenie"],rows:[["Niebieski","Za mało CO₂"],["Zielony","Około 30 mg/l — cel"],["Żółty","Za dużo — ryzyko dla ryb"]]}},{h:"Ustawianie"},{list:["Zacznij od 1 bąbelka na sekundę na ok. 100 l i zwiększaj co kilka dni, obserwując drop checker i ryby.","Włączaj CO₂ 1–2 godziny przed zapaleniem światła, wyłączaj ok. godzinę przed zgaszeniem.","Utrzymuj ruch powierzchni wody — bez niego w nocy brakuje tlenu.","Stabilne stężenie jest ważniejsze niż wysokie — wahania CO₂ sprzyjają krasnorostom."],ordered:!0},{warn:"Ryby przy powierzchni, przyspieszony oddech, krewetki wychodzące z wody — natychmiast zakręć CO₂ i mocno napowietrz. Nigdy nie zwiększaj dozowania i nie wychodź z domu na cały dzień."},{tip:"Tabele szacujące CO₂ z pH i KH bywają mylące, jeśli w wodzie są inne bufory (np. z podłoża aktywnego, garbniki). Do oceny używaj drop checkera albo pomiaru spadku pH: przy ok. 30 mg/l pH spada o mniej więcej 1 względem wody odgazowanej."}]},{id:"krewetki-ro",level:"zaawansowany",title:"Akwarium krewetkowe na wodzie RO",icon:"🦐",minutes:6,summary:"Remineralizacja wody RO dla Caridina i Neocaridina, podłoże aktywne, TDS i stabilność.",blocks:[{p:"Krewetki z rodzaju Caridina (Crystal Red, Taiwan Bee) potrzebują wody miękkiej i kwaśnej, a przede wszystkim bardzo stabilnej. Kranówka rzadko się nadaje, dlatego używa się wody z odwróconej osmozy (RO) i dosala ją minerałami."},{table:{head:["Parametr","Caridina (Crystal Red)","Neocaridina (Red Cherry)"],rows:[["pH","5,8–6,8","6,5–8,0"],["GH","4–6 °n","6–12 °n"],["KH","0–1 °n","2–8 °n"],["TDS","ok. 100–160 ppm","ok. 150–350 ppm"],["Temperatura","20–24 °C","18–28 °C"]]}},{h:"Przygotowanie wody"},{list:["Woda RO ma TDS bliski zeru. Sprawdzaj miernikiem TDS, czy membrana nadal działa (powinno być poniżej ok. 10 ppm).","Dodaj sól mineralizującą GH+ dla Caridina (bez KH) według instrukcji, aż osiągniesz docelowe GH i TDS.","Mieszaj w osobnym pojemniku dzień wcześniej, z grzałką, żeby wyrównać temperaturę."],ordered:!0},{warn:"Odparowana woda to sama czysta woda — minerały zostają w akwarium. Ubytki uzupełniaj czystą wodą RO, a nie zmineralizowaną, inaczej TDS będzie rósł z tygodnia na tydzień."},{h:"Podłoże aktywne"},{list:["Podłoże aktywne (granulat z gleby) zakwasza wodę do ok. pH 6–6,5 i wiąże KH.","Na początku uwalnia amoniak — dojrzewanie trwa dłużej niż zwykle, nawet 4–6 tygodni.","Po ok. 1–2 latach się wyczerpuje: pH zaczyna rosnąć, a granulki się rozpadają. Wtedy trzeba je wymienić."]},{h:"Zasady"},{list:["Mniejsze, a częstsze podmiany (10–15% co tydzień) o identycznych parametrach.","Żadnych nawozów i leków z miedzią.","Karm skromnie — krewetki żywią się głównie biofilmem. Resztki usuwaj po 2–3 godzinach.","Neocaridina i Caridina mogą żyć razem, ale nie krzyżują się. Różne odmiany Neocaridina krzyżują się między sobą — potomstwo wraca do brązowego koloru."]}]},{id:"rozmnazanie",level:"zaawansowany",title:"Rozmnażanie ryb",icon:"🥚",minutes:7,summary:"Żyworodne, ikroluby, pielęgnice, kiryski i bojowniki — jak wywołać tarło i wychować narybek.",blocks:[{h:"Żyworodne (gupiki, zmienniaki, mieczyki, molinezje)"},{list:["Rozmnażają się same. Samica rodzi co ok. 4 tygodnie, ciemna plamka ciążowa przy odbycie rośnie przed porodem.","Dorosłe ryby zjadają młode. Gęste rośliny pływające i mech dają narybkowi kryjówki.","Kotniki (wiszące pojemniki) bywają stresujące dla samicy — lepiej przenieść ją do osobnego, gęsto zarośniętego zbiornika."]},{h:"Ikroluby (kąsaczowate, razbory, danio)"},{list:["Osobny zbiornik tarliskowy, zwykle z miękką, lekko kwaśną wodą i przyciemnieniem.","Na dnie siatka, kulki szklane lub mech — ikra przez nie przepada i rodzice jej nie zjedzą.","Po tarle odłów rodziców. Narybek po wykluciu najpierw żywi się woreczkiem żółtkowym.","Pierwszy pokarm: wymoczki, pył pokarmowy; po kilku dniach świeżo wyklute larwy artemii."]},{h:"Pielęgnice"},{p:"Tworzą pary i opiekują się ikrą oraz narybkiem — w tym czasie bywają agresywne wobec współmieszkańców. Pielęgniczki z rodzaju Apistogramma i barwniaki składają ikrę w jaskiniach, skalary na pionowych liściach lub rurkach, pyszczaki Malawi noszą ikrę w pysku."},{h:"Kiryski"},{p:"Tarło często wywołuje podmiana wody na nieco chłodniejszą przy spadku ciśnienia (jesień, deszcz). Samica przykleja ikrę na szybie i liściach. Ikrę można zebrać palcem i przenieść do osobnego pojemnika z napowietrzaniem."},{h:"Bojowniki"},{list:["Samiec buduje gniazdo z piany pod powierzchnią, najlepiej pod liściem rośliny pływającej.","Po tarle odłów samicę — samiec może ją zabić.","Samiec pilnuje gniazda; odłów go, gdy narybek zacznie samodzielnie pływać (ok. 3 dni po wykluciu).","Młode samce trzeba z czasem rozdzielić."]},{tip:"Wylęgarka artemii: łyżeczka jaj na litr słonej wody (ok. 25–30 g soli na litr), mocne napowietrzanie, światło, ok. 25–28 °C — larwy wykluwają się po ok. dobie."}]},{id:"biotopy",level:"zaawansowany",title:"Akwarium biotopowe",icon:"🗺️",minutes:5,summary:"Jak odtworzyć konkretne środowisko: czarne wody Amazonii, skalne brzegi Malawi, azjatycki strumień.",blocks:[{p:"Akwarium biotopowe łączy ryby, rośliny, podłoże i wodę z jednego regionu. Ryby w takich warunkach lepiej się wybarwiają i zachowują naturalnie, a parametry wody łatwiej dobrać do całej obsady."},{h:"Czarne wody Amazonii"},{list:["Woda bardzo miękka i kwaśna (pH 5–6,5), zabarwiona garbnikami na herbaciano.","Piaszczyste dno, korzenie, opadłe liście (ketapang, dąb), przyćmione światło, mało roślin.","Obsada: neony, zwinniki, ołówki, pielęgniczki Apistogramma, kiryski."]},{h:"Jezioro Malawi (skalny brzeg)"},{list:["Woda twarda i zasadowa (pH 7,8–8,6), stabilna; pomaga piasek koralowy lub aragonit.","Stosy skał z kryjówkami, piasek, prawie bez roślin (pyszczaki je zjadają).","Obsada: pyszczaki (mbuna) w przegęszczeniu i proporcji jeden samiec na kilka samic — rozkłada to agresję."]},{h:"Azjatycki strumień"},{list:["Woda miękka do średnio twardej, chłodniejsza, z silnym przepływem i dużą ilością tlenu.","Otoczaki, żwir, korzenie, mchy i paprocie przywiązane do kamieni.","Obsada: danio, razbory, mikrorasbory, brzanki, przylgi."]},{tip:"Pole „Pochodzenie” w karcie gatunku w atlasie pomoże dobrać ryby z jednego regionu, a planer obsady sprawdzi, czy ich wymagania się pokrywają."}]}];new Map(Uo.map(s=>[s.id,s]));function Th({tank:s,tap:r}){const c=s?.litres;return l.jsxs("div",{className:"space-y-3",children:[l.jsx(ut,{title:"Mieszanie wody RO z kranówką",icon:"💧",desc:"Ile kranówki i ile wody RO, żeby uzyskać docelową twardość lub TDS.",children:l.jsx(Dh,{litres:c,tapGh:r?.gh})}),l.jsx(ut,{title:"Podmiana a azotany",icon:"🔁",desc:"Jak dużą podmianę zrobić, żeby zejść z azotanami do wybranej wartości.",children:l.jsx(Eh,{litres:c,tapNo3:r?.no3})}),l.jsx(ut,{title:"Dawka nawozu lub leku",icon:"🧴",desc:"Przelicza dawkę z opakowania na pojemność Twojego akwarium.",children:l.jsx(Mh,{litres:c})}),l.jsx(ut,{title:"Pojemność netto",icon:"📐",desc:"Ile wody naprawdę jest w akwarium po odjęciu podłoża, dekoracji i pustej przestrzeni pod pokrywą.",children:l.jsx(Oh,{tank:s})}),l.jsx(ut,{title:"Podniesienie KH sodą",icon:"🧂",desc:"Ile wodorowęglanu sodu (sody oczyszczonej) dodać, żeby podnieść KH.",children:l.jsx(Bh,{litres:c})}),l.jsx(ut,{title:"Wylęgarka artemii",icon:"🥚",desc:"Ile soli i jaj na wybraną ilość wody.",children:l.jsx(Rh,{})}),l.jsx(ut,{title:"Jednostki twardości",icon:"🔄",desc:"Przelicza °n (°dH), mg/l CaCO₃ i mmol/l.",children:l.jsx(Hh,{})})]})}function ut({title:s,icon:r,desc:c,children:u}){const[m,y]=H.useState(!1);return l.jsxs("section",{className:"card p-0",children:[l.jsxs("button",{className:"flex w-full items-start gap-3 p-3 text-left",onClick:()=>y(!m),"aria-expanded":m,children:[l.jsx("span",{className:"flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-cyan-50 text-2xl dark:bg-cyan-950/50","aria-hidden":!0,children:r}),l.jsxs("span",{className:"min-w-0 flex-1",children:[l.jsx("span",{className:"block font-medium",children:s}),l.jsx("span",
