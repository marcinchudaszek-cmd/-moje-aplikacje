. Gęste czarne kropki także na płetwie ogonowej, wzdłuż boku różowa „tęczowa” smuga.",habitat:"Łowiska specjalne i komercyjne, rzadziej uciekinierzy z hodowli w rzekach.",baits:"Pasty pstrągowe, robaki, muchy, małe błystki, spinner."},{id:"pstrag-zrodlany",name:"Pstrąg źródlany",nameDe:"Bachsaibling",latin:"Salvelinus fontinalis",group:"lososiowate",desc:"Gatunek z Ameryki Północnej (golec). Ciemny grzbiet z jasnym, robaczkowatym marmurkiem, czerwone plamki z niebieską obwódką, biało-czarne przednie krawędzie dolnych płetw.",habitat:"Zimne potoki górskie i źródliskowe, także zakwaszone; wsiedlany.",baits:"Muchy, małe błystki obrotowe, robaki."},{id:"palia",name:"Palia jeziorowa",nameDe:"Seesaibling",latin:"Salvelinus umbla",group:"lososiowate",desc:"Golec jezior alpejskich: smukły, oliwkowy grzbiet, jasne plamki, w szacie godowej pomarańczowo-czerwony brzuch i płetwy z białą krawędzią.",habitat:"Głębokie, zimne jeziora alpejskie i podalpejskie (Bawaria); w Polsce nie występuje naturalnie.",baits:"Głębokie trollingowanie, małe błystki, sztuczne nimfy, mormyszki spod lodu."},{id:"lipien",name:"Lipień",nameDe:"Äsche",latin:"Thymallus thymallus",group:"lososiowate",desc:"Bardzo wysoka, „chorągiewkowa” płetwa grzbietowa z fioletowym połyskiem, mały pysk, płetwa tłuszczowa, łuski w podłużnych rzędach.",habitat:"Szybko płynące, czyste rzeki podgórskie i wyżynne z kamienistym lub żwirowym dnem.",baits:"Głównie muszkarstwo: nimfy, suche muchy, mokre muchy."},{id:"troc",name:"Troć wędrowna",nameDe:"Meerforelle",latin:"Salmo trutta m. trutta",group:"lososiowate",desc:"Srebrzysta z rzadkimi czarnymi plamkami w kształcie „x”, płetwa tłuszczowa. Wędruje z morza do rzek na tarło.",habitat:"Rzeki pomorskie uchodzące do Bałtyku, dolna Wisła i Odra z dopływami.",baits:"Woblery, błystki wahadłowe i obrotowe, streamery."},{id:"troc-jeziorowa",name:"Troć jeziorowa",nameDe:"Seeforelle",latin:"Salmo trutta m. lacustris",group:"lososiowate",desc:"Jeziorowa forma troci: srebrzysta, duża, z czarnymi plamkami. W Polsce rzadka (głównie Wdzydze), w Bawarii w jeziorach alpejskich.",habitat:"Głębokie, chłodne jeziora o wysokiej przejrzystości.",baits:"Trolling: woblery i błystki wahadłowe."},{id:"losos",name:"Łosoś atlantycki",nameDe:"Atlantischer Lachs",latin:"Salmo salar",group:"lososiowate",desc:"Smukły, srebrny, nieliczne plamki głównie powyżej linii bocznej, cienka nasada ogona, płetwa ogonowa lekko wcięta.",habitat:"Rzeki uchodzące do Bałtyku, do których jest restytuowany (m.in. Drawa, Wieprza, Słupia).",baits:"Woblery, błystki wahadłowe, muchy łososiowe."},{id:"glowacica",name:"Głowacica",nameDe:"Huchen",latin:"Hucho hucho",group:"lososiowate",desc:"Duża, wałkowata łososiowata o szerokiej głowie, miedzianym grzbiecie i drobnych czarnych kropkach.",habitat:"Górskie i podgórskie rzeki; w Polsce głównie Dunajec, Poprad i Czarna Orawa, w Bawarii dorzecze Dunaju (Isar, Inn, Ilz).",baits:"Duże woblery, gumy, wahadłówki, warkocze."},{id:"sieja",name:"Sieja",nameDe:"Renke (Felchen)",latin:"Coregonus maraena",group:"lososiowate",desc:"Srebrzysta, z płetwą tłuszczową i małym, dolnym pyskiem. Łuski duże, łatwo odpadające. W Bawarii pod nazwą Renke/Felchen łowi się kilka form siei.",habitat:"Głębokie, czyste i chłodne jeziora.",baits:"Ochotka, małe muszki i nimfy (zestawy „Hegene”), mormyszki."},{id:"sielawa",name:"Sielawa",nameDe:"Kleine Maräne",latin:"Coregonus albula",group:"lososiowate",desc:"Mała, śledziowata łososiowata z płetwą tłuszczową i wysuniętą dolną szczęką.",habitat:"Głębokie jeziora o chłodnej, natlenionej wodzie (Pojezierze Mazurskie, Pomorskie).",baits:"Ochotka, mormyszki, sztuczne muszki (zwłaszcza spod lodu)."},{id:"stynka",name:"Stynka",nameDe:"Stint",latin:"Osmerus eperlanus",group:"lososiowate",desc:"Mała (zwykle do 20 cm), półprzezroczysta, srebrzysta ryba z płetwą tłuszczową i dużym pyskiem z zębami. Świeża pachnie ogórkiem.",habitat:"Zalewy przymorskie, ujścia rzek i głębokie jeziora.",baits:"Małe błystki i muszki, mormyszki spod lodu; przynęta na drapieżniki."},{id:"karp",name:"Karp",nameDe:"Karpfen",latin:"Cyprinus carpio",group:"karpiowate",desc:"Wysokie ciało, cztery wąsy przy pysku (dwa dłuższe), długa płetwa grzbietowa z ząbkowanym promieniem. Odmiany: pełnołuski, lustrzeń, golec.",habitat:"Stawy, zbiorniki, jeziora i wolne rzeki o mulistym dnie; łowiska komercyjne.",baits:"Kulki proteinowe, pellet, kukurydza, ziemniak, ciasto, robaki."},{id:"amur",name:"Amur biały",nameDe:"Graskarpfen",latin:"Ctenopharyngodon idella",group:"karpiowate",desc:"Gatunek z Azji, wsiedlany. Wałkowaty, duże ciemno obrzeżone łuski, szeroka głowa, brak wąsów. Roślinożerny.",habitat:"Zbiorniki z roślinnością, stawy, łowiska komercyjne, ciepłe kanały.",baits:"Kukurydza, trzcina, koniczyna, pellet, kulki."},{id:"tolpyga",name:"Tołpyga biała",nameDe:"Silberkarpfen",latin:"Hypophthalmichthys molitrix",group:"karpiowate",desc:"Gatunek z Azji, wsiedlany. Srebrna, bardzo drobnołuska, oczy osadzone nisko pod linią pyska, wysoki ostry kil na brzuchu. Filtruje plankton, potrafi wyskakiwać z wody.",habitat:"Zbiorniki zaporowe, duże stawy i łowiska komercyjne.",baits:"Trudna do złowienia na wędkę — gąbki i pływające zanęty planktonowe."},{id:"lin",name:"Lin",nameDe:"Schleie",latin:"Tinca tinca",group:"karpiowate",desc:"Krępy, oliwkowo-złoty, bardzo drobne łuski i gruby śluz, małe czerwone oczy, dwa krótkie wąsy w kącikach pyska.",habitat:"Zarośnięte jeziora, stawy i starorzecza z mulistym dnem.",baits:"Czerwone robaki, białe robaki, kukurydza, pęczak, ochotka."},{id:"karas",name:"Karaś pospolity",nameDe:"Karausche",latin:"Carassius carassius",group:"karpiowate",desc:"Wysoki, złotawo-brązowy, bez wąsów, wypukła (zaokrąglona) krawędź płetwy grzbietowej. Coraz rzadszy rodzimy gatunek.",habitat:"Małe, zarośnięte, często przyduchowe stawy i torfianki.",baits:"Robaki, ciasto, chleb, pęczak."},{id:"karas-srebrzysty",name:"Karaś srebrzysty",nameDe:"Giebel",latin:"Carassius gibelio",group:"karpiowate",desc:"Srebrzysty, bez wąsów, wklęsła krawędź płetwy grzbietowej, czarna otrzewna. Pospolity gatunek obcego pochodzenia.",habitat:"Niemal wszystkie wody stojące i wolno płynące.",baits:"Robaki, kukurydza, pęczak, ciasto."},{id:"leszcz",name:"Leszcz",nameDe:"Brachse (Blei)",latin:"Abramis brama",group:"karpiowate",desc:"Bardzo wysokie, bocznie spłaszczone ciało, wysuwalny pysk, długa płetwa odbytowa. Młode srebrne, duże brązowo-złote.",habitat:"Jeziora i duże rzeki o miękkim dnie; żeruje stadnie przy dnie.",baits:"Białe robaki, czerwone robaki, kukurydza, pęczak, ochotka — metoda gruntowa i feeder."},{id:"krap",name:"Krąp",nameDe:"Güster",latin:"Blicca bjoerkna",group:"karpiowate",desc:"Podobny do młodego leszcza, ale z czerwonawymi nasadami płetw piersiowych i brzusznych, większym okiem i krótszą płetwą odbytową.",habitat:"Jeziora, zbiorniki i wolne rzeki.",baits:"Białe robaki, kukurydza, pęczak."},{id:"rozpior",name:"Rozpiór",nameDe:"Zope",latin:"Ballerus ballerus",group:"karpiowate",desc:"Podobny do leszcza, ale smuklejszy, z górnym pyskiem i bardzo długą płetwą odbytową.",habitat:"Duże rzeki nizinne, zalewy i przepływowe jeziora.",baits:"Białe robaki, ochotka."},{id:"sapa",name:"Sapa",nameDe:"Zobel",latin:"Ballerus sapa",group:"karpiowate",desc:"Leszczowata ryba dużych rzek: wysoka, z półdolnym, tępym pyskiem, dużym okiem i bardzo długą płetwą odbytową; dolny płat ogona dłuższy od górnego.",habitat:"Duże rzeki o wyraźnym nurcie (w Polsce rzadka, głównie Wisła; w Bawarii Dunaj).",baits:"Białe robaki, ochotka — grunt na nurcie."},{id:"ploc",name:"Płoć",nameDe:"Rotauge",latin:"Rutilus rutilus",group:"karpiowate",desc:"Srebrzysta, czerwone tęczówki, płetwa grzbietowa zaczyna się nad nasadą płetw brzusznych. Najpospolitsza ryba spławikowa.",habitat:"Praktycznie wszystkie wody.",baits:"Białe robaki, pęczak, ciasto, konopie, ochotka."},{id:"wzdrega",name:"Wzdręga",nameDe:"Rotfeder",latin:"Scardinius erythrophthalmus",group:"karpiowate",desc:"Podobna do płoci, ale z jaskrawoczerwonymi płetwami, złotawym okiem i pyskiem skierowanym ku górze; płetwa grzbietowa wyraźnie za nasadą brzusznych.",habitat:"Zarośnięte jeziora i starorzecza, przy powierzchni.",baits:"Chleb, białe robaki, owady przy powierzchni."},{id:"klen",name:"Kleń",nameDe:"Döbel (Aitel)",latin:"Squalius cephalus",group:"karpiowate",desc:"Wałkowaty, szeroka „tępa” głowa i duży pysk, łuski z ciemnym obrzeżeniem tworzące siateczkę, wypukła płetwa odbytowa.",habitat:"Rzeki o umiarkowanym i szybkim nurcie, pod nawisami drzew.",baits:"Owady, chleb, wiśnie, małe woblery, muchy."},{id:"jaz",name:"Jaź",nameDe:"Aland (Nerfling)",latin:"Leuciscus idus",group:"karpiowate",desc:"Krępszy od klenia, mniejszy pysk, prosta (lekko wklęsła) płetwa odbytowa, złotawe łuski i czerwonawe płetwy.",habitat:"Większe rzeki nizinne i przepływowe jeziora.",baits:"Robaki, kukurydza, owady, małe błystki i woblery."},{id:"jelec",name:"Jelec",nameDe:"Hasel",latin:"Leuciscus leuciscus",group:"karpiowate",desc:"Smukły, srebrzysty, mała głowa, wklęsła krawędź płetwy odbytowej — tym różni się od młodego klenia.",habitat:"Czyste rzeki z wyraźnym nurtem.",baits:"Białe robaki, owady, sztuczne muszki."},{id:"ukleja",name:"Ukleja",nameDe:"Laube (Ukelei)",latin:"Alburnus alburnus",group:"karpiowate",desc:"Mała, smukła i bardzo srebrzysta, pysk skierowany ku górze, łuski łatwo odpadają. Pływa stadami przy powierzchni.",habitat:"Jeziora i rzeki, warstwa przypowierzchniowa.",baits:"Białe robaki, ciasto, ochotka; świetna przynęta na drapieżniki."},{id:"brzana",name:"Brzana",nameDe:"Barbe",latin:"Barbus barbus",group:"karpiowate",desc:"Wydłużona, płaski brzuch, dolny mięsisty pysk z czterema wąsami. Ryba szybkiego nurtu.",habitat:"Rzeki o szybkim nurcie i żwirowo-kamienistym dnie.",baits:"Robaki, ser, pellet, białe robaki — gruntówka i feeder na nurcie."},{id:"brzanka",name:"Brzanka",nameDe:"Karpatenbarbe",latin:"Barbus carpathicus",group:"karpiowate",desc:"Mniejsza krewna brzany (do ok. 25 cm), z wyraźnymi ciemnymi cętkami na grzbiecie, bokach i płetwach, cztery wąsy.",habitat:"Potoki i małe rzeki karpackie (Wisła górna, San, Dunajec z dopływami).",baits:jt},{id:"swinka",name:"Świnka",nameDe:"Nase",latin:"Chondrostoma nasus",group:"karpiowate",desc:"Charakterystyczny dolny, poprzeczny pysk z twardą, ostrą wargą do zeskrobywania glonów; czarna otrzewna.",habitat:"Rzeki podgórskie i wyżynne z kamienistym dnem.",baits:"Robaki, białe robaki, nimfy."},{id:"certa",name:"Certa",nameDe:"Zährte (Seerüssling)",latin:"Vimba vimba",group:"karpiowate",desc:"Dolny pysk z mięsistym „noskiem”, ciemny grzbiet; wędruje z Bałtyku w górę rzek.",habitat:"Duże rzeki i ich ujścia, zalewy.",baits:"Robaki, białe robaki, ochotka — grunt."},{id:"ciosa",name:"Ciosa",nameDe:"Ziege (Sichling)",latin:"Pelecus cultratus",group:"karpiowate",desc:"Bocznie spłaszczona jak nóż, z prostym grzbietem i łukowato wygiętym brzuchem z ostrym kilem, pysk skierowany stromo ku górze, długie płetwy piersiowe.",habitat:"Zalew Wiślany i ujścia rzek; w Bawarii Dunaj.",baits:"Małe błystki, muszki, białe robaki — przy powierzchni."},{id:"kielb",name:"Kiełb",nameDe:"Gründling",latin:"Gobio gobio",group:"karpiowate",desc:"Mały (do ok. 15 cm), wrzecionowaty, płaski brzuch, dwa wąsy w kącikach dolnego pyska, rząd ciemnych plam wzdłuż boku.",habitat:"Rzeki i jeziora z piaszczystym lub żwirowym dnem.",baits:"Czerwone robaki, białe robaki — przy samym dnie; dobra przynęta na drapieżniki."},{id:"kielb-bialopletwy",name:"Kiełb białopłetwy",nameDe:"Weißflossiger Gründling",latin:"Romanogobio albipinnatus",group:"karpiowate",desc:"Podobny do kiełbia, ale z dłuższymi wąsami i niemal bezbarwnymi, nieplamkowanymi płetwami grzbietową i ogonową.",habitat:"Większe nizinne rzeki o piaszczystym dnie (Wisła, Odra, Bug).",baits:jt},{id:"strzebla-potokowa",name:"Strzebla potokowa",nameDe:"Elritze",latin:"Phoxinus phoxinus",group:"karpiowate",desc:"Mała (do ok. 10 cm), drobnołuska, z ciemnymi plamami lub pręgami na bokach; samce w szacie godowej z czerwonym brzuchem.",habitat:"Zimne, czyste potoki górskie i podgórskie, przejrzyste jeziora.",baits:"Przyłów przy połowie pstrągów na drobne przynęty."},{id:"strzebla-blotna",name:"Strzebla błotna",nameDe:"Sumpfelritze",latin:"Eupallasella percnurus",group:"karpiowate",desc:"Mała, krępa, złotawo-oliwkowa z drobnymi ciemnymi plamkami. Jedna z najrzadszych ryb Polski.",habitat:"Małe, płytkie, zarastające zbiorniki i torfianki.",baits:jt},{id:"slonecznica",name:"Słonecznica",nameDe:"Moderlieschen",latin:"Leucaspius delineatus",group:"karpiowate",desc:"Drobna (do ok. 8 cm), srebrzysta z niebieskawym paskiem wzdłuż boku, niepełna linia boczna, górny pysk.",habitat:"Małe, zarośnięte stawy, rowy i starorzecza.",baits:"Przyłów na bardzo małe przynęty."},{id:"rozanka",name:"Różanka",nameDe:"Bitterling",latin:"Rhodeus amarus",group:"karpiowate",desc:"Mała (do ok. 9 cm), wysoka, z turkusowym paskiem na tylnej części boku; samce w szacie godowej różowo-fioletowe. Składa ikrę do małży.",habitat:"Wolno płynące i stojące wody z małżami skójkowatymi.",baits:jt},{id:"piekielnica",name:"Piekielnica",nameDe:"Schneider",latin:"Alburnoides bipunctatus",group:"karpiowate",desc:"Mała, podobna do uklei, ale z linią boczną obrzeżoną podwójnym rzędem ciemnych kropek.",habitat:"Czyste, szybko płynące rzeki podgórskie i wyżynne.",baits:jt},{id:"sliz",name:"Śliz",nameDe:"Bachschmerle",latin:"Barbatula barbatula",group:"drobne",desc:"Mała (do ok. 15 cm), wałkowata, sześć wąsików przy dolnym pysku, marmurkowa brązowa szata, brak kolców pod okiem.",habitat:"Czyste potoki i rzeki z kamienistym dnem, pod kamieniami.",baits:jt},{id:"koza",name:"Koza pospolita",nameDe:"Steinbeißer",latin:"Cobitis taenia",group:"drobne",desc:"Mała, bocznie spłaszczona, z rzędami ciemnych plam na jasnym tle, sześć wąsików i rozwidlony kolec pod okiem.",habitat:"Piaszczyste dno rzek i jezior, zagrzebana w piasku.",baits:jt},{id:"koza-dunajska",name:"Koza dunajska",nameDe:"Donau-Steinbeißer",latin:"Cobitis elongatoides",group:"drobne",desc:"Bardzo podobna do kozy pospolitej; rozróżnia je badanie genetyczne lub liczenie plam. Kolec pod okiem.",habitat:"Dorzecze Dunaju i południowa Polska (dopływy górnej Wisły, Odry).",baits:jt},{id:"koza-zlotawa",name:"Koza złotawa",nameDe:"Goldsteinbeißer",latin:"Sabanejewia aurata",group:"drobne",desc:"Mała koza o złotawym tle z rzędem dużych ciemnych plam wzdłuż boku; kolec pod okiem.",habitat:"Czyste rzeki podgórskie ze żwirowym dnem (w Polsce bardzo rzadka).",baits:jt},{id:"piskorz",name:"Piskorz",nameDe:"Schlammpeitzger",latin:"Misgurnus fossilis",group:"drobne",desc:"Wydłużony, węgorzowaty (do ok. 30 cm), z podłużnymi ciemnymi pasami i dziesięcioma wąsikami. Potrafi oddychać jelitem i „piszczy” wyjęty z wody.",habitat:"Muliste starorzecza, rowy i stawy, także przyduchowe.",baits:jt},{id:"glowacz-bialopletwy",name:"Głowacz białopłetwy",nameDe:"Koppe (Groppe)",latin:"Cottus gobio",group:"drobne",desc:"Mały (do ok. 15 cm), z dużą spłaszczoną głową i szerokim pyskiem, bez łusek, marmurkowy; płetwy brzuszne jasne, bez wyraźnych pręg.",habitat:"Zimne, czyste potoki i rzeki z kamieniami, pod którymi się kryje.",baits:jt},{id:"glowacz-pregopletwy",name:"Głowacz pręgopłetwy",nameDe:"Buntflossenkoppe",latin:"Cottus poecilopus",group:"drobne",desc:"Bardzo podobny do głowacza białopłetwego, ale z wyraźnymi ciemnymi pręgami na długich płetwach brzusznych.",habitat:"Potoki karpackie i sudeckie, zimne jeziora pomorskie.",baits:jt},{id:"ciernik",name:"Ciernik",nameDe:"Dreistachliger Stichling",latin:"Gasterosteus aculeatus",group:"drobne",desc:"Mały (do ok. 8 cm), z trzema wolnymi kolcami przed płetwą grzbietową i kostnymi płytkami na bokach; samiec w okresie godów z czerwonym gardłem.",habitat:"Rowy, stawy, przybrzeżne wody Bałtyku i rzeki nizinne.",baits:"Nie jest celem wędkarzy — przyłów na drobne przynęty."},{id:"cierniczek",name:"Cierniczek",nameDe:"Neunstachliger Stichling",latin:"Pungitius pungitius",group:"drobne",desc:"Drobny (do ok. 6 cm), z 7–12 małymi kolcami przed płetwą grzbietową; samiec w godach ciemny.",habitat:"Zarośnięte rowy, stawy i torfianki.",baits:"Nie jest celem wędkarzy — przyłów na drobne przynęty."},{id:"jesiotr",name:"Jesiotr ostronosy",nameDe:"Atlantischer Stör (amerikanisch)",latin:"Acipenser oxyrinchus",group:"pradawne",desc:"Pancerz z rzędów kostnych tarczek, wydłużony ryj z wąsami, asymetryczna płetwa ogonowa. Gatunek restytuowany w Wiśle i Odrze.",habitat:"Wisła, Odra i ich ujścia.",baits:"Połów zabroniony przez cały rok — każdy okaz natychmiast wypuść."},{id:"jesiotr-zachodni",name:"Jesiotr zachodni",nameDe:"Atlantischer Stör",latin:"Acipenser sturio",group:"pradawne",desc:"Bardzo podobny do jesiotra ostronosego; dawniej występował w rzekach Niemiec i Polski, dziś skrajnie rzadki i restytuowany.",habitat:"Duże rzeki uchodzące do Morza Północnego i Bałtyku.",baits:"Ochrona całoroczna — każdy okaz natychmiast wypuść."},{id:"sterlet",name:"Sterlet",nameDe:"Sterlet",latin:"Acipenser ruthenus",group:"pradawne",desc:"Mały jesiotr (zwykle do 1 m) z długim, wąskim ryjem i frędzlowatymi wąsami; tarczki grzbietowe ostre.",habitat:"Dunaj z dopływami; w Polsce głównie uciekinierzy z hodowli.",baits:"W Bawarii chroniony przez cały rok — wypuść."},{id:"minog-strumieniowy",name:"Minóg strumieniowy",nameDe:"Bachneunauge",latin:"Lampetra planeri",group:"pradawne",desc:"Bezszczękowiec (nie ryba w ścisłym sensie): węgorzowaty, do ok. 20 cm, z okrągłą przyssawką zamiast pyska i siedmioma otworami skrzelowymi.",habitat:"Czyste potoki; larwy żyją latami zagrzebane w mule.",baits:jt},{id:"minog-rzeczny",name:"Minóg rzeczny",nameDe:"Flussneunauge",latin:"Lampetra fluviatilis",group:"pradawne",desc:"Wędrowny minóg do ok. 50 cm, srebrzysto-szary, z przyssawką i siedmioma otworami skrzelowymi.",habitat:"Bałtyk i rzeki, do których wędruje na tarło.",baits:jt},{id:"minog-morski",name:"Minóg morski",nameDe:"Meerneunauge",latin:"Petromyzon marinus",group:"pradawne",desc:"Największy minóg (do ok. 1 m), marmurkowy, z dużą przyssawką pełną zębów.",habitat:"Morze; do rzek wchodzi na tarło (w Polsce bardzo rzadki).",baits:jt},{id:"minog-ukrainski",name:"Minóg ukraiński",nameDe:"Ukrainisches Bachneunauge",latin:"Eudontomyzon mariae",group:"pradawne",desc:"Niewielki minóg potokowy, podobny do strumieniowego; różni się uzębieniem przyssawki.",habitat:"Potoki dorzecza Dniestru, Bugu i górnej Wisły.",baits:jt},{id:"aloza",name:"Aloza",nameDe:"Maifisch (Alse)",latin:"Alosa alosa",group:"pradawne",desc:"Duży śledź wędrowny (do ok. 70 cm), srebrny, z ostrym kilem na brzuchu i jedną ciemną plamą za pokrywą skrzelową.",habitat:"Morze; dawniej wędrował do Wisły, Odry i Renu, dziś skrajnie rzadki.",baits:jt},{id:"parposz",name:"Parposz",nameDe:"Finte",latin:"Alosa fallax",group:"pradawne",desc:"Śledź wędrowny podobny do alozy, ale mniejszy, z rzędem kilku ciemnych plam za pokrywą skrzelową.",habitat:"Zalew Wiślany, Zatoka Gdańska i ujścia rzek.",baits:jt},{id:"dorsz",name:"Dorsz",nameDe:"Dorsch (Kabeljau)",latin:"Gadus morhua",group:"morskie",desc:"Trzy płetwy grzbietowe i dwie odbytowe, jeden wąs na podbródku, jasna, łukowato wygięta linia boczna. Grzbiet marmurkowy, zielonkawobrązowy, brzuch jasny.",habitat:"Bałtyk: głębsze wody, kamieniste rafy, wraki i spady dna.",baits:"Połów rekreacyjny dorsza jest zakazany przez cały rok (przepisy polskie i UE) — przypadkowo złowionego wypuść natychmiast."},{id:"stornia",name:"Stornia (flądra)",nameDe:"Flunder",latin:"Platichthys flesus",group:"morskie",desc:"Płastuga — oczy zwykle po prawej stronie ciała (bywają po lewej). Szorstkie guzki kostne u nasady płetwy grzbietowej i odbytowej oraz wzdłuż linii bocznej. Strona oczna brązowooliwkowa.",habitat:"Piaszczyste dno przy brzegu, Zatoka Gdańska i Pucka, zalewy i ujścia rzek; najpospolitsza płastuga polskiego wybrzeża.",baits:"Robaki morskie (pierścienice), rosówki, krewetki — z plaży na grunt albo z łodzi przy dnie."},{id:"gladzica",name:"Gładzica",nameDe:"Scholle",latin:"Pleuronectes platessa",group:"morskie",desc:"Płastuga o gładkiej skórze z jaskrawymi pomarańczowymi lub czerwonymi plamami na stronie ocznej; za oczami rząd 4–7 kostnych guzków.",habitat:"Piaszczyste i muliste dno; w polskiej strefie rzadziej niż stornia, częściej w zachodnim Bałtyku.",baits:"Robaki morskie i rosówki na zestawie gruntowym."},{id:"zimnica",name:"Zimnica",nameDe:"Kliesche",latin:"Limanda limanda",group:"morskie",desc:"Niewielka płastuga z linią boczną wygiętą w wysoki łuk nad płetwą piersiową. Strona oczna piaskowobrązowa, szorstka w dotyku od strony ogona ku głowie.",habitat:"Piaszczyste dno głębszych wód; w polskiej strefie rzadka.",baits:"Robaki morskie — przyłów przy połowie storni."},{id:"skarp",name:"Skarp (turbot)",nameDe:"Steinbutt",latin:"Scophthalmus maximus",group:"morskie",desc:"Płastuga o niemal okrągłym ciele, oczy po lewej stronie. Bez łusek; strona oczna pokryta rozsianymi kostnymi guzkami.",habitat:"Piaszczyste i żwirowe dno; latem podchodzi na płytkie wody przybrzeżne na tarło.",baits:"Małe rybki (np. tobiasz), gumy prowadzone przy dnie, robaki morskie."},{id:"naglad",name:"Nagład",nameDe:"Glattbutt",latin:"Scophthalmus rhombus",group:"morskie",desc:"Podobny do skarpa, ale bardziej owalny, pokryty drobnymi gładkimi łuskami i bez kostnych guzków; pierwsze promienie płetwy grzbietowej rozgałęzione.",habitat:"Piaszczyste dno; w Bałtyku rzadki, głównie w jego zachodniej części.",baits:"Małe rybki i robaki przy dnie — przyłów."},{id:"sledz",name:"Śledź",nameDe:"Hering",latin:"Clupea harengus",group:"morskie",desc:"Srebrzysty, grzbiet niebieskozielony, jedna płetwa grzbietowa pośrodku ciała, zaczynająca się przed płetwami brzusznymi. Brzuch bez ostrego, piłkowanego kilu.",habitat:"Ławice na otwartym morzu; wiosną na tarło wchodzi do zatok, zalewów i portów — wtedy łowi się go z falochronów i nabrzeży.",baits:"Zestaw śledziowy z przyponami z małymi haczykami (w morzu najwyżej 5 przyponów, haczyki o rozwarciu do 6 mm) — kolorowe przywieszki."},{id:"szprot",name:"Szprot",nameDe:"Sprotte",latin:"Sprattus sprattus",group:"morskie",desc:"Mały (zwykle do 15 cm) śledziowaty. Od młodego śledzia różni się ostrym, piłkowanym kilem na brzuchu i płetwą grzbietową zaczynającą się za nasadą płetw brzusznych.",habitat:"Ławice w toni otwartego morza i zatok.",baits:"Nie jest celem wędkarzy — przyłów na zestaw śledziowy."},{id:"belona",name:"Belona",nameDe:"Hornhecht",latin:"Belone belone",group:"morskie",desc:"Bardzo wydłużona i smukła, szczęki wyciągnięte w długi „dziób” pełen drobnych zębów. Grzbiet zielononiebieski, boki srebrne; ości zielone.",habitat:"Pływa tuż pod powierzchnią; wiosną (maj–czerwiec) podchodzi do brzegów i falochronów na tarło.",baits:"Wąskie błystki i wahadłówki, sztuczna przynęta z pętlą z włóczki, pasek śledzia pod spławikiem."},{id:"wegorzyca",name:"Węgorzyca",nameDe:"Aalmutter",latin:"Zoarces viviparus",group:"morskie",desc:"Wydłużona jak węgorz, ale z grubymi wargami i dużymi płetwami piersiowymi; długa płetwa grzbietowa ma tuż przed ogonem wyraźne obniżenie. Żyworodna, ości zielone.",habitat:"Kamieniste dno i porośla przy brzegu, falochrony, porty, Zatoka Pucka.",baits:"Robaki i kawałki ryb przy dnie — przyłów."},{id:"makrela",name:"Makrela",nameDe:"Makrele",latin:"Scomber scombrus",group:"morskie",desc:"Wrzecionowata, grzbiet zielononiebieski z czarnymi falistymi pręgami, brzuch srebrny; za płetwami grzbietową i odbytową rzędy drobnych płetewek.",habitat:"Ryba słonych wód — do polskiej części Bałtyku zapływa rzadko, głównie późnym latem i jesienią.",baits:"Pilkery i przywieszki, małe błystki."},{id:"kur-diabel",name:"Kur diabeł",nameDe:"Seeskorpion",latin:"Myoxocephalus scorpius",group:"morskie",desc:"Duża, kolczasta głowa z szerokim pyskiem, ciało bez łusek, marmurkowe. Kolce na pokrywach skrzelowych; samce mają czerwonawy brzuch.",habitat:"Kamieniste dno, falochrony i porośla przybrzeżne.",baits:"Robaki i rybki przy dnie — częsty przyłów."},{id:"kur-rogacz",name:"Kur rogacz",nameDe:"Vierhörniger Seeskorpion",latin:"Myoxocephalus quadricornis",group:"morskie",desc:"Podobny do kura diabła, ale na głowie ma dwie pary kostnych, rogowatych guzów. Relikt epoki lodowcowej.",habitat:"Chłodne, głębsze wody Bałtyku, m.in. Zatoka Gdańska.",baits:jt},{id:"tasza",name:"Tasza",nameDe:"Seehase",latin:"Cyclopterus lumpus",group:"morskie",desc:"Krępa, niemal kulista, z rzędami kostnych guzków; płetwy brzuszne zrośnięte w przyssawkę, pierwsza płetwa grzbietowa ukryta w garbie skóry.",habitat:"Kamieniste dno i glony; wiosną podchodzi do brzegów na tarło.",baits:"Rzadko bierze na wędkę — przyłów."},{id:"iglicznia",name:"Iglicznia",nameDe:"Grasnadel",latin:"Syngnathus typhle",group:"morskie",desc:"Bardzo cienka, wydłużona, w kostnym pancerzu z pierścieni, z rurkowatym pyskiem; krewniak koników morskich.",habitat:"Łąki trawy morskiej i porośla, zwłaszcza Zatoka Pucka.",baits:jt},{id:"babka-bycza",name:"Babka bycza",nameDe:"Schwarzmundgrundel",latin:"Neogobius melanostomus",group:"obce",desc:"Krępa, duża głowa, płetwy brzuszne zrośnięte w przyssawkę, czarna plama na pierwszej płetwie grzbietowej. Gatunek inwazyjny.",habitat:"Zatoka Gdańska, Zalew Wiślany, Wisła, Odra, a w Bawarii Dunaj; kamienie i opaski brzegowe.",baits:"Robaki, kawałki ryb — bierze wszystko przy dnie."},{id:"babka-lysa",name:"Babka łysa",nameDe:"Nackthalsgrundel",latin:"Babka gymnotrachelus",group:"obce",desc:"Babka z przyssawką z płetw brzusznych, ciemnymi poprzecznymi pręgami i nagim (bez łusek) karkiem. Gatunek inwazyjny.",habitat:"Wisła, Bug, Narew i zbiorniki zaporowe.",baits:"Robaki — przyłów przy dnie."},{id:"babka-szczupla",name:"Babka szczupła",nameDe:"Flussgrundel",latin:"Neogobius fluviatilis",group:"obce",desc:"Smukła, piaskowo ubarwiona babka z przyssawką z płetw brzusznych. Gatunek inwazyjny.",habitat:"Wisła, Bug i ich zbiorniki.",baits:"Robaki — przyłów przy dnie."},{id:"babka-rurkonosa",name:"Babka rurkonosa",nameDe:"Marmorierte Grundel",latin:"Proterorhinus semilunaris",group:"obce",desc:"Mała babka z rurkowatymi przednimi otworami nosowymi wystającymi nad górną wargę. Gatunek inwazyjny.",habitat:"Wisła, Dunaj z dopływami, porośnięte brzegi.",baits:"Przyłów na drobne przynęty."},{id:"sumik-karlowaty",name:"Sumik karłowaty",nameDe:"Brauner Zwergwels",latin:"Ameiurus nebulosus",group:"obce",desc:"Mały sum z Ameryki: osiem wąsów, płetwa tłuszczowa, ostre kolce w płetwach piersiowych i grzbietowej. Gatunek inwazyjny.",habitat:"Stawy, starorzecza, zbiorniki o mulistym dnie.",baits:"Robaki, kawałki ryby, nocą przy dnie."},{id:"sumik-czarny",name:"Sumik czarny",nameDe:"Schwarzer Zwergwels",latin:"Ameiurus melas",group:"obce",desc:"Bardzo podobny do sumika karłowatego, ale ciemniejszy, z ciemnymi błonami płetw i gładkim tylnym brzegiem kolca piersiowego. Gatunek inwazyjny.",habitat:"Stawy i starorzecza, także w Bawarii.",baits:"Robaki, kawałki ryby, nocą przy dnie."},{id:"czebaczek-amurski",name:"Czebaczek amurski",nameDe:"Blaubandbärbling",latin:"Pseudorasbora parva",group:"obce",desc:"Mała (do ok. 10 cm) rybka z górnym pyskiem i ciemną smugą wzdłuż boku. Gatunek inwazyjny, przenosi choroby ryb.",habitat:"Stawy, kanały, rowy i zbiorniki, często przy hodowlach karpi.",baits:"Przyłów przy połowie spławikowym na drobne przynęty."},{id:"trawianka",name:"Trawianka",nameDe:"Amurgrundel",latin:"Perccottus glenii",group:"obce",desc:"Ciemna, krępa, z dużym pyskiem, płetwy brzuszne NIE tworzą przyssawki (w odróżnieniu od babek). Gatunek inwazyjny.",habitat:"Zarośnięte drobne zbiorniki, starorzecza, rowy.",baits:"Przyłów na robaki i białe robaki."},{id:"bass-sloneczny",name:"Bass słoneczny",nameDe:"Sonnenbarsch",latin:"Lepomis gibbosus",group:"obce",desc:"Mały, wysoki, kolorowy okoniowaty z Ameryki: niebieskie i pomarańczowe plamki, ciemna plamka z czerwonym brzegiem na pokrywie skrzelowej.",habitat:"Płytkie, nagrzane stawy i zbiorniki; w Polsce lokalnie (m.in. wody pochłodnicze).",baits:"Robaki, białe robaki, małe przynęty sztuczne."}],Nn=Object.fromEntries(Ur.map(c=>[c.id,c])),sk={drapiezne:"Drapieżne",lososiowate:"Łososiowate" nst Pr={naturalne:{label:"Przynęty naturalne",icon:"🪱"},sztuczne:{label:"Przynęty sztuczne",icon:"🎣"},zaneta:{label:"Zanęty i dodatki",icon:"🥣"},sprzet:{label:"Sprzęt",icon:"🧰"},metody:{label:"Metody połowu",icon:"🌊"},porady:{label:"Porady i technika",icon:"💡"},przepisy:{label:"Przepisy o sprzęcie",icon:"⚖️"}},ib={label:"Dz.U. 2023 poz. 1373, § 2",url:"https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20230001373"},ab={label:"AVBayFiG §§ 15, 16, 20, 21",url:"https://www.gesetze-bayern.de/Content/Document/BayAVFiG"},qr=[{id:"rosowka",cat:"naturalne",title:"Rosówka",icon:"🪱",summary:"Duży dżdżownicowy robak — uniwersalna przynęta na grubsze ryby, szczególnie nocą i po deszczu.",sections:[{h:"Na co",p:["Węgorz, sum (w pęczku), leszcz, karp, lin, okoń, kleń, brzana, miętus, a w morzu dorsz i flądra."]},{h:"Jak zakładać",list:["Całą na duży haczyk (nr 2–6), wbijając 2–3 razy i zostawiając ruchliwy koniec.","Na suma i węgorza — pęczek kilku rosówek na mocnym haczyku.","Na mniejsze ryby — kawałek rosówki, żeby ryba wzięła ją razem z grotem."]},{h:"Skąd brać i jak przechowywać",list:["Zbiera się je nocą z latarką na trawnikach po ciepłym deszczu albo kupuje w sklepie.","Trzymaj w wilgotnej ziemi lub mchu, w chłodzie (lodówka, 5–10 °C); martwe od razu usuwaj, bo psują resztę."]}],fish:["wegorz","sum","leszcz","karp","lin","okon","klen","brzana","mietus","dorsz","stornia"],related:["czerwony-robak","grunt","sumowe"]},{id:"czerwony-robak",cat:"naturalne",title:"Czerwony robak (kompostowy)",icon:"🪱",summary:"Mały, ruchliwy robak z kompostu — jedna z najskuteczniejszych przynęt na niemal wszystkie białe ryby i okonie.",sections:[{h:"Na co",p:["Okoń, lin, karaś, leszcz, krąp, płoć, jazgarz, kiełb, pstrąg potokowy (tam, gdzie wolno na naturalne)."]},{h:"Jak zakładać",list:["1–3 sztuki na haczyk nr 10–14, przekłute w poprzek, by zostały ruchliwe końce.","Dobrze działa w kanapce z białym robakiem lub kukurydzą.","Pocięte robaki dodane do zanęty mocno przyciągają leszcze i liny."]}],fish:["okon","lin","karas","leszcz","krap","ploc","jazgarz","kielb","pstrag-potokowy"],related:["rosowka","biale-robaki","splawik"]},{id:"biale-robaki",cat:"naturalne",title:"Białe robaki (larwy much)",icon:"🐛",summary:"Klasyka spławika i feedera; łatwe do kupienia, wytrzymałe na haczyku, świetne do zanęty.",sections:[{h:"Na co",p:["Płoć, leszcz, krąp, wzdręga, ukleja, jelec, kleń, jaź, karaś, a zimą okoń i płoć spod lodu."]},{h:"Jak zakładać",list:["1–3 sztuki na cienki haczyk nr 14–20, za tępy koniec (przy „oczkach”), żeby robak żył i się ruszał.","Dwa–trzy białe w kanapce z ochotką lub kukurydzą.","Garść białych robaków w koszyku feedera lub wsypana przy spławiku utrzymuje ryby w łowisku."]},{h:"Przechowywanie",list:["W lodówce w trocinach lub mące kukurydzianej — w chłodzie nie zamieniają się w poczwarki (kasterki).","Kasterki (poczwarki) też są świetną przynętą na duże płocie i leszcze."]}],fish:["ploc","leszcz","krap","wzdrega","ukleja","jelec","klen","jaz","karas","okon"],related:["ochotka","splawik","feeder","zaneta-gotowa"]},{id:"ochotka",cat:"naturalne",title:"Ochotka",icon:"🔴",summary:"Drobna czerwona larwa komara — przynęta „na trudne dni” i podstawa łowienia spod lodu.",sections:[{h:"Na co",p:["Płoć, leszcz, krąp, okoń, sieja, sielawa, ukleja; zimą prawie wszystko, co żeruje pod lodem."]},{h:"Jak używać",list:["Na haczyk nr 18–22 lub mormyszkę — 2–5 larw przekłutych przy głowie.","Ochotka „zanętowa” (drobniejsza, jokers) — do kul z ziemią lub gliną.","Trzymaj w wilgotnej gazecie w lodówce, nie w wodzie."]}],fish:["ploc","leszcz","krap","okon","sieja","sielawa","ukleja"],related:["podlodowe","mormyszki","biale-robaki"]},{id:"kukurydza",cat:"naturalne",title:"Kukurydza",icon:"🌽",summary:"Tania, selektywna przynęta roślinna — dobra na karpie, amury, liny i leszcze, rzadziej bierze ją drobnica.",sections:[{h:"Jak zakładać",list:["Konserwowa: 1–3 ziarna na haczyk nr 8–12, groty schowane w ziarnie albo na włos.","Gotowana (z suchego ziarna) jest twardsza i dłużej trzyma się haczyka.","Sztuczna pływająca kukurydza na włosie unosi przynętę nad mułem (pop-up)."]},{h:"Uwaga",p:["Suchą kukurydzę zawsze namocz i ugotuj — surowa pęcznieje w przewodzie pokarmowym ryb i może im szkodzić."]}],fish:["karp","amur","lin","leszcz","karas-srebrzysty","jaz"],related:["ziarna","karpiowanie","method-feeder"]},{id:"ziarna",cat:"naturalne",title:"Pęczak, pszenica, konopie",icon:"🌾",summary:"Gotowane ziarna — przynęta i zanęta zarazem; konopie to klasyka na duże płocie.",sections:[{h:"Jak przygotować",list:["Namocz na noc, gotuj do miękkości (pęczak krócej, pszenica i konopie dłużej, aż pękną).","Konopie: pękające ziarno z białym kiełkiem na haczyk nr 14–16 — płoć, kleń, jaź.","Pęczak i pszenica: leszcz, lin, karaś, płoć; świetne jako zanęta przy spławiku."]}],fish:["ploc","leszcz","lin","karas","klen","jaz"],related:["kukurydza","zaneta-gotowa","splawik"]},{id:"ciasto-chleb",cat:"naturalne",title:"Ciasto i chleb",icon:"🍞",summary:"Przynęty z kuchni: miękisz, skórka chleba, ciasto z mąki — proste i skuteczne na karasie, karpie i płocie.",sections:[{list:["Miękisz chleba ugnieciony na haczyku — płoć, karaś, wzdręga.","Skórka chleba na powierzchni — karp i amur w ciepłe dni, kleń pod drzewami.","Ciasto (mąka + woda lub jajko, czasem wanilia, miód) — karaś, karp; zagnieć tak, by trzymało się haczyka przy wyrzucie."]}],fish:["ploc","karas","karas-srebrzysty","karp","amur","wzdrega","klen"],related:["splawik","przynety-powierzchniowe"]},{id:"kulki-pellet",cat:"naturalne",title:"Kulki proteinowe i pellet",icon:"🟤",summary:"Przynęty karpiowe: twarde kulki (boilies) i prasowany pellet — selektywne na duże ryby.",sections:[{h:"Kulki",list:["Tonące, pływające (pop-up) i „wafters” (wolno opadające); średnice 10–24 mm.","Zakłada się je na włos (hair rig), a nie bezpośrednio na haczyk.","Zanęca się tymi samymi kulkami, żeby ryby się do nich przyzwyczaiły."]},{h:"Pellet",list:["Rozpuszcza się w wodzie i tworzy smugę zapachową — świetny w method feederze.","Drobny (2–4 mm) do koszyka, większy (8–20 mm) na włos lub w opasce.","Pellet halibutowy jest bardzo tłusty: działa w ciepłej wodzie, zimą słabiej."]}],fish:["karp","amur","lin","leszcz","brzana","sum"],related:["karpiowanie","method-feeder","zaneta-karpiowa"]},{id:"zywiec",cat:"naturalne",title:"Żywiec",icon:"🐟",summary:"Żywa rybka przynętowa na szczupaka, sandacza, suma i okonia — w Polsce dozwolona, w Bawarii zakazana.",sections:[{h:"Na co i jaki",list:["Szczupak: płoć, krąp lub karaś 10–20 cm; sum: większe, żywotne ryby; sandacz i okoń: drobniejsze, smukłe (ukleja, płoć).","Bierz rybki z łowiska, w którym łowisz — przenoszenie ryb między wodami grozi zawleczeniem chorób i gatunków obcych.","Nie używaj gatunków chronionych ani niewymiarowych gatunków z wymiarem ochronnym."]},{h:"Przepisy",p:["Polska: rozporządzenie nie zakazuje żywca — sprawdź regulamin łowiska (PZW, RZGW), bo bywa ograniczony.","Bawaria: łowienie na żywą rybkę jest zakazane (AVBayFiG § 15 ust. 1 pkt 3). Martwa rybka jako przynęta jest dozwolona (§ 21 ust. 2)."]}],fish:["szczupak","sandacz","sum","okon"],related:["zywcowka","martwa-rybka","przepisy-by"]},{id:"martwa-rybka",cat:"naturalne",title:"Martwa rybka i filet",icon:"🐠",summary:"Na drapieżniki żerujące przy dnie i padlinożerców: szczupak zimą, sandacz, węgorz, miętus, sum.",sections:[{list:["Cała rybka na zestawie gruntowym lub spławikowym — szczupak (zwłaszcza zimą i wczesną wiosną po okresie ochronnym), sandacz.","Kawałek ryby lub filet — węgorz, miętus, sum, a w morzu dorsz.","Śledź lub inna tłusta ryba morska daje silny zapach — klasyka na szczupaka i węgorza.","Martwą rybkę można też prowadzić spinningowo na specjalnym uzbrojeniu (wleczona, „martwa rybka na dragonie”)."]}],fish:["szczupak","sandacz","wegorz","mietus","sum","dorsz"],related:["zywiec","grunt","przypony"]},{id:"owady",cat:"naturalne",title:"Owady i larwy",icon:"🦗",summary:"Konik polny, chrząszcze, chruściki, larwy jętek — naturalny pokarm kleni, pstrągów i jazi.",sections:[{list:["Latem konik polny lub chrząszcz podany na powierzchni pod nawisem drzew to świetna przynęta na klenia i jazia.","Chruściki (larwy w domkach z kamyczków) zbierane spod kamieni — na pstrągi, lipienie, kiełbie.","Owady podaje się na lekkim zestawie, najlepiej z prądem wody, żeby dryfowały naturalnie."]}],fish:["klen","jaz","pstrag-potokowy","lipien","jelec","wzdrega"],related:["muchowka","muchy"]},{id:"przynety-morskie-naturalne",cat:"naturalne",title:"Przynęty morskie: pierścienice, krewetki, śledź",icon:"🦐",summary:"Na dorsza, flądry i węgorzycę z plaży i z kutra — pierścienice (nereis), krewetki, kawałki śledzia.",sections:[{list:["Pierścienica (nereis, „robak morski”) — podstawa łowienia flądry i dorsza z brzegu (surfcasting).","Krewetka i kawałek śledzia — dorsz, węgorzyca; śledź ma silny zapach i dobrze trzyma się haczyka.","Na belonę i śledzia działają drobne paski ryby lub sztuczne muszki (zestawy „śledziowe”)."]}],fish:["dorsz","stornia","gladzica","wegorzyca","belona"],related:["surfcasting","morskie-kuter"]},{id:"woblery",cat:"sztuczne",title:"Woblery",icon:"🐟",summary:"Twarde imitacje rybek ze sterem, który nadaje im akcję i głębokość — na szczupaka, okonia, sandacza, bolenia, pstrąga, klenia.",sections:[{h:"Rodzaje",list:["Pływające (F) — wynurzają się po zatrzymaniu; dobre nad roślinnością.","Tonące (S) i zawieszające (SP) — pracują na stałej głębokości, zatrzymany SP „wisi” w wodzie i prowokuje ataki.","Długi ster = głęboko (trolling, sandacz), krótki = płytko (szczupak w trzcinach, kleń).","Wielosegmentowe i jerki — duże przynęty na szczupaka i suma."]},{h:"Jak prowadzić",list:["Jednostajnie (dobre na start), z przerwami (stop & go), z podszarpnięciami (twitching) — przerwa często wywołuje branie.","Dobierz głębokość: wobler powinien pracować tuż nad roślinnością lub dnem.","Przy szczupaku zawsze przypon stalowy, wolframowy lub z grubego fluorocarbonu."]}],fish:["szczupak","okon","sandacz","bolen","pstrag-potokowy","klen","jaz","sum","troc"],related:["spinning","trolling","przypony"]},{id:"gumy",cat:"sztuczne",title:"Gumy (rippery, twistery)",icon:"🪝",summary:"Miękkie przynęty na główkach jigowych — najlepsze na sandacza i okonia przy dnie, skuteczne też na szczupaka.",sections:[{h:"Rodzaje",list:["Ripper (z łopatką na ogonie) — drga całym ciałem, naśladuje rybkę.","Twister (z ogonem w kształcie sierpa) — mocno wibruje nawet przy wolnym prowadzeniu.","No-action (bez ogona) — subtelne, na pasywne ryby i drop shot.","Gumy pachnące lub solone — ryba dłużej trzyma przynętę w pysku."]},{h:"Główka i prowadzenie",list:["Waga główki: tyle, by guma opadała 2–4 s po każdym podbiciu; na głębszej i szybszej wodzie cięższa.","Klasyka na sandacza: podbicie korbką lub szczytówką, opad na dno (branie najczęściej w opadzie), znów podbicie.","Obserwuj plecionkę — przy opadzie branie widać jako „przyskok” lub zatrzymanie żyłki."]}],fish:["sandacz","okon","szczupak","bolen","sum","dorsz"],related:["spinning","jigi","drop-shot","zylki-plecionki"]},{id:"blystki-obrotowe",cat:"sztuczne",title:"Błystki obrotowe",icon:"🌀",summary:"Paletka wirująca wokół osi daje wibracje i błyski — świetna na okonia, pstrąga, klenia i szczupaka.",sections:[{list:["Rozmiary 0–1 (pstrąg, kleń, okoń), 2–3 (okoń, jaź, szczupak), 4–5 (szczupak).","Prowadź tak, by paletka się kręciła — za wolno przestaje pracować, za szybko wypływa na powierzchnię.","W rzece rzucaj w poprzek lub lekko w dół nurtu i pozwól prądowi „podać” błystkę w miejsce stania ryb.","Obrotówka skręca żyłkę — używaj krętlika lub agrafki z krętlikiem."]}],fish:["okon","pstrag-potokowy","klen","jaz","szczupak","bolen","lipien"],related:["spinning","wahadlowki"]},{id:"wahadlowki",cat:"sztuczne",title:"Błystki wahadłowe",icon:"🥄",summary:"Wygięta blaszka kolebiąca się z boku na bok — daleki rzut, dobra na szczupaka, troć, bolenia i dorsza (pilkery).",sections:[{list:["Lekkie i szerokie — wolne prowadzenie nad roślinnością (szczupak).","Ciężkie i wąskie — daleki rzut, szybka woda, boleń, troć, łosoś.","Prowadzenie z przerwami: opadająca, „trzepocząca” wahadłówka wywołuje ataki.","W morzu ciężkie pilkery to odmiana wahadłówki do pionowego łowienia dorsza."]}],fish:["szczupak","troc","losos","bolen","okon","dorsz"],related:["spinning","pilkery","trolling"]},{id:"cykady",cat:"sztuczne",title:"Cykady",icon:"🔩",summary:"Metalowe blaszki o silnej wibracji — daleki rzut i szybkie prowadzenie, klasyka na bolenia i okonia.",sections:[{list:["Wibrują już przy wolnym podciągnięciu — dobre do łowienia z opadu na sandacza i okonia.","Daleko lecą: świetne na żerujące „kotły” bolenia.","Łatwo zaczepiają o dno — prowadź z wyczuciem, zwłaszcza na kamieniach."]}],fish:["bolen","okon","sandacz","szczupak"],related:["spinning","blystki-obrotowe"]},{id:"przynety-powierzchniowe",cat:"sztuczne",title:"Przynęty powierzchniowe",icon:"💦",summary:"Poppery, stickbaity, „chlapiące” woblery — widowiskowe ataki szczupaka, bolenia, okonia i klenia przy powierzchni.",sections:[{list:["Popper: miseczka na pysku „chlapie” przy szarpnięciu — okoń, szczupak w płytkich zatokach.","Stickbait (walk the dog): prowadzony zygzakiem, rytmicznymi podszarpnięciami.","Najlepiej rano, wieczorem i w pochmurne, ciepłe dni, nad roślinnością.","Zacinaj dopiero, gdy poczujesz ciężar ryby — nie na sam widok ataku."]}],fish:["szczupak","bolen","okon","klen","jaz","sum"],related:["spinning","woblery"]},{id:"jigi",cat:"sztuczne",title:"Jigi, koguty, główki",icon:"🪶",summary:"Obciążona główka z hakiem i gumą, piórkiem lub włosiem — do łowienia przy dnie i z opadu.",sections:[{list:["Kogut (piórka, włosie) na główce — klasyka na sandacza i okonia.","Główka „football” lub stojąca (stand-up) mniej się zaczepia o kamienie.","Hak offsetowy z gumą bez obciążenia (weedless) — przez roślinność na szczupaka.","Im cieńsza plecionka, tym lżejszej główki możesz użyć na tej samej głębokości."]}],fish:["sandacz","okon","szczupak","dorsz"],related:["gumy","spinning"]},{id:"muchy",cat:"sztuczne",title:"Sztuczne muchy",icon:"🪰",summary:"Sucha, mokra, nimfa i streamer — przynęty muszkarskie na pstrągi, lipienie, klenie i jazie.",sections:[{list:["Sucha mucha — imitacja owada na powierzchni; łów, gdy ryby zbierają z powierzchni.","Mokra mucha i nimfa — pod wodą, imitują larwy i topiące się owady; nimfa z obciążeniem przy dnie (np. nimfa czeska, nimfa na długą szczytówkę).","Streamer — imitacja rybki, prowadzony szarpanym ruchem; na większe pstrągi, troć, szczupaka.","Dobór: podnieś kamień z dna i zobacz, jakie larwy żyją w rzece; obserwuj owady nad wodą."]},{h:"Przepisy",p:["W Polsce na wędce muchowej mogą być najwyżej dwie sztuczne muszki imitujące owady (zob. „Przepisy o sprzęcie — Polska”)."]}],fish:["pstrag-potokowy","lipien","klen","jaz","pstrag-teczowy","troc","jelec"],related:["muchowka","owady","przepisy-pl"]},{id:"mormyszki",cat:"sztuczne",title:"Mormyszki i błystki podlodowe",icon:"❄️",summary:"Małe ciężkie haczyki z kulką i pionowe błystki — łowienie spod lodu na okonia, płoć, sieję i szczupaka.",sections:[{list:["Mormyszka z ochotką lub białym robakiem, prowadzona drobnymi drgnięciami — płoć, okoń, leszcz.","Mormyszka „bezrobakowa” (gołe drgania) — aktywne okonie.","Błystka pionowa, balansowa (balanser) — okoń, sandacz, szczupak spod lodu.","Kiwok (czuły sygnalizator na szczytówce) pokazuje delikatne brania."]}],fish:["okon","ploc","leszcz","sieja","sielawa","szczupak","sandacz"],related:["podlodowe","ochotka","bezpieczenstwo-lod"]},{id:"pilkery",cat:"sztuczne",title:"Pilkery i przywieszki morskie",icon:"⚓",summary:"Ciężkie metalowe przynęty do pionowego łowienia dorsza z kutra, często z gumowymi przywieszkami nad pilkerem.",sections:[{list:["Waga 60–250 g — dobierz do głębokości i dryfu łodzi, żeby pilker pracował przy dnie.","Prowadzenie: unieś wędzisko, opuść — branie najczęściej w opadzie.","Przywieszki (twistery, muszki) na bocznych troczkach zwiększają szansę.","Przed wyjazdem sprawdź aktualne unijne i krajowe zasady połowu dorsza — bywa całkowicie zakazany (zakładka Atlas → region Bałtyk)."]}],fish:["dorsz"],related:["morskie-kuter","wahadlowki"]},{id:"zaneta-gotowa",cat:"zaneta",title:"Zanęta gotowa i domowa",icon:"🥣",summary:"Mieszanka, która ściąga ryby w łowisko i utrzymuje je tam — klucz do spławika i feedera.",sections:[{h:"Skład",list:["Baza: bułka tarta, kukurydza mielona, makuchy, pieczywo fluo — to, co wiąże i paruje w wodzie.","Dodatki „smakowe”: biszkopt, prażone konopie, kakao, wanilia (płoć, leszcz), melasa i ostre korzenne zapachy na zimną wodę oszczędnie.","Wkładka: białe robaki, kasterki, pęczak, kukurydza, pocięte robaki — to, co ryba ma znaleźć."]},{h:"Przygotowanie",list:["Zwilżaj stopniowo, przesiej przez sito, odczekaj 10–20 min i dowilż — dobrze nawilżona kula rozpada się na dnie, a nie w powietrzu.","Na rzekę zanęta cięższa i bardziej klejąca (z gliną lub ziemią), na jezioro lżejsza.","Zimą i przy słabym żerowaniu dawkuj mało — przekarmiona ryba nie bierze."]}],fish:["ploc","leszcz","krap","karas","lin","ukleja"],related:["splawik","feeder","glina-ziemia"]},{id:"zaneta-karpiowa",cat:"zaneta",title:"Zanęta karpiowa: spod, kulki, pellet",icon:"🧺",summary:"Zanęcanie pod duże ryby: mieszanki ziaren, kulki i pellet podawane w jedno miejsce.",sections:[{list:["Spod mix: gotowane ziarna (kukurydza, konopie, pszenica, tygrys — zawsze namoczone i ugotowane), pellet, pokruszone kulki, płynny atraktor.","Celność ważniejsza niż ilość: wszystko w jedno miejsce, oznaczone markerem lub odległością na żyłce (tzw. klipsowanie).","Podanie: proca, rakieta zanętowa, łyżka zanętowa (throwing stick) do kulek, łódka zanętowa.","Na krótkich zasiadkach mało i często, na dłuższych — więcej na start."]}],fish:["karp","amur","lin","leszcz","brzana"],related:["karpiowanie","kulki-pellet","pva"]},{id:"atraktory",cat:"zaneta",title:"Atraktory i dipy",icon:"🧪",summary:"Płynne i sypkie dodatki zapachowe — pomagają, gdy ryby są ostrożne lub woda chłodna, ale nie zastąpią dobrego miejsca.",sections:[{list:["Dip: zanurzasz w nim kulkę lub przynętę przed wyrzutem — mocna, krótkotrwała chmura zapachu.","Booster i melasa: do zanęty i ziaren.","Zimą słodkie, owocowe i rybne aromaty działają słabiej niż w lecie — używaj oszczędnie.","Nadmiar zapachu odstrasza — zacznij od małej ilości."]}],fish:["karp","leszcz","lin","karas"],related:["zaneta-karpiowa","zaneta-gotowa"]},{id:"glina-ziemia",cat:"zaneta",title:"Glina i ziemia zanętowa",icon:"🟫",summary:"Obciążają i wiążą zanętę, niosą ochotkę i białe robaki na dno — niezbędne w rzece i zimą.",sections:[{list:["Glina klejąca — kule nie rozpadną się w nurcie i zaniosą wkładkę na dno.","Ziemia (torfowa, czarna) — przyciemnia zanętę i rozprasza robaki; dobra do ochotki.","Proporcje dobierz do wody: w szybkiej rzece nawet połowa gliny, w stawie mało.","Kule z ziemią i ochotką to podstawa łowienia płoci na tyczkę i bata."]}],related:["zaneta-gotowa","ochotka","splawik"]},{id:"pva",cat:"zaneta",title:"Siatki i woreczki PVA",icon:"🫧",summary:"Rozpuszczalne w wodzie woreczki z zanętą zakładane na haczyk — pokarm ląduje dokładnie przy przynęcie.",sections:[{list:["Wypełnienie musi być suche (pellet, pokruszone kulki, suche zanęty) — wilgoć rozpuszcza PVA przed rzutem.","Woreczek z ciężarkiem i haczykiem w środku chroni zestaw przed splątaniem przy rzucie.","Sprawdź, czy PVA rozpuszcza się w zimnej wodzie — niektóre zimą robią to bardzo wolno."]}],fish:["karp","lin","leszcz"],related:["karpiowanie","zaneta-karpiowa"]},{id:"wedziska",cat:"sprzet",title:"Wędziska",icon:"🎣",summary:"Długość, ciężar wyrzutu i akcja — dobierz wędzisko do metody i ryby, a nie „na wszystko”.",sections:[{h:"Rodzaje",list:["Spinningowe 1,8–3 m — ciężar wyrzutu (c.w.) dopasowany do przynęt: UL do 7 g (okoń, pstrąg), L/M 5–30 g (okoń, sandacz, szczupak), H 30–100 g (duży szczupak, sum).","Spławikowe: bat (bez przelotek, 4–7 m), bolonka (z przelotkami, 4–7 m), odległościowe (match, 3,6–4,5 m).","Feederowe 3–4,2 m z wymiennymi szczytówkami-sygnalizatorami.","Karpiowe 3,6 m o krzywej ugięcia 2,75–3,5 lb.","Muchowe — klasy AFTMA 3–5 na pstrąga i lipienia, 6–8 na troć i szczupaka.","Podlodowe — krótkie 30–60 cm, z kiwokiem."]},{h:"Akcja",p:["Szybka (ugina się głównie szczytówka) — precyzja, czucie, mocne zacięcie; paraboliczna (ugina się całe) — amortyzuje zrywy ryby, dobra przy cienkich żyłkach."]},{h:"Przepisy",p:["W Polsce wędzisko musi mieć co najmniej 30 cm, także podlodowe (Dz.U. 2023 poz. 1373, § 2)."]}],related:["kolowrotki","zylki-plecionki","przepisy-pl"]},{id:"kolowrotki",cat:"sprzet",title:"Kołowrotki",icon:"⚙️",summary:"Rozmiar dopasowany do wędziska, płynny hamulec i dobrze nawinięta szpula — od tego zależy zarówno rzut, jak i hol.",sections:[{list:["Rozmiar 1000–2500: spinning ultralekki i lekki, spławik; 3000–4000: spinning na sandacza i szczupaka, feeder; 5000+ z wolnym biegiem: karp, sum, morze.","Hamulec ustaw na ok. 1/3 wytrzymałości żyłki — ryba ma móc ściągać żyłkę przy mocnym zrywie.","Nawijaj żyłkę do 1–2 mm pod rant szpuli: za mało skraca rzut, za dużo powoduje „brody”.","Multiplikator (kołowrotek bębnowy) — do ciężkiego spinningu, trollingu i łowienia z łodzi."]}],related:["wedziska","zylki-plecionki"]},{id:"zylki-plecionki",cat:"sprzet",title:"Żyłka, plecionka, fluorocarbon",icon:"🧵",summary:"Żyłka się rozciąga i wybacza błędy, plecionka daje czucie i siłę przy małej średnicy, fluorocarbon jest najmniej widoczny w wodzie.",sections:[{list:["Żyłka (monofilament): spławik, grunt, karpiowanie; 0,10–0,16 mm na płoć, 0,18–0,25 na leszcza i lina, 0,28–0,35 na karpia.","Plecionka: spinning (sandacz, okoń z jigiem), feeder na dalekie dystanse, sum; brak rozciągliwości = szybkie zacięcie i czucie dna.","Fluorocarbon: przypony i końcówki przy plecionce — mało widoczny, odporny na przetarcia.","Do plecionki zawsze przywiąż odcinek żyłki lub fluorocarbonu (przypon/strzałówka) — sama plecionka jest dobrze widoczna i tnie się na kamieniach.","Wymieniaj żyłkę co sezon; zużytą i ścinki zabieraj ze sobą — w przyrodzie zabija ptaki."]}],related:["przypony","wezly","kolowrotki"]},{id:"przypony",cat:"sprzet",title:"Przypony (w tym stalowe)",icon:"🔗",summary:"Odcinek między linką główną a przynętą — cieńszy przy delikatnych rybach, stalowy lub wolframowy przy szczupaku.",sections:[{list:["Szczupak ma ostre zęby i przecina żyłkę — przy każdej przynęcie, na którą może się trafić, stosuj przypon stalowy, wolframowy, tytanowy lub z grubego fluorocarbonu (0,6 mm+).","Przy spławiku i feederze przypon cieńszy od linki głównej — przy zaczepie zerwie się tylko on.","Długość: spławik 15–40 cm, feeder 40–120 cm (przy ostrożnych rybach dłuższy), karp 15–25 cm.","Krętlik między linką a przyponem chroni przed skręcaniem."]}],fish:["szczupak","sum"],related:["zylki-plecionki","haczyki","woblery"]},{id:"haczyki",cat:"sprzet",title:"Haczyki",icon:"🪝",summary:"Rozmiar dopasowany do przynęty, a nie do ryby, której się spodziewasz; zawsze ostry.",sections:[{list:["Numeracja: im większy numer, tym mniejszy haczyk (nr 20 — ochotka, nr 14 — białe robaki, nr 6 — rosówka, nr 1–2/0 — żywiec i martwa rybka).","Bezzadziorowe lub z dogniecionym zadziorem ułatwiają wypuszczanie ryb — na wielu łowiskach no-kill są wymagane.","Kotwiczki w woblerach i jerkach: kontroluj ostrość i rdzę, wymieniaj stępione.","Sprawdź ostrość na paznokciu — dobry grot „przykleja się”, a nie ślizga."]},{h:"Przepisy",p:["W Polsce na jednej wędce: jeden haczyk z przynętą albo do dwóch haczyków ze sztucznymi muszkami, albo sztuczna przynęta z najwyżej trzema haczykami (szczegóły: „Przepisy o sprzęcie — Polska”). W Bawarii najwyżej 5 haczyków na wędkę."]}],related:["przypony","przepisy-pl","przepisy-by"]},{id:"splawiki-obciazenie",cat:"sprzet",title:"Spławiki, ciężarki, koszyki",icon:"🔴",summary:"Spławik pokazuje branie i niesie przynętę na właściwej głębokości; ciężarki i koszyki trzymają zestaw przy dnie.",sections:[{h:"Spławik",list:["Wyważ (dociąż) go tak, by z wody wystawała tylko antenka — wtedy widać najdelikatniejsze branie.","Gruntuj: ustal głębokość tak, by przynęta była tuż nad dnem lub lekko na nim leżała.","Spławiki przelotowe (waggler) na dalsze rzuty i wiatr, stałe (pod szczytówką) na bliski dystans.","W rzece spławiki o kulistym korpusie stabilniej płyną z nurtem."]},{h:"Ciężarki i koszyki",list:["Ciężarek przelotowy — ryba ciągnie przynętę bez oporu.","Koszyk zanętowy (feeder) — niesie zanętę na haczyk; waga dobrana do odległości i nurtu.","Method feeder — płaski podajnik, wokół którego oblepia się zanętę z przynętą."]}],related:["splawik","feeder","method-feeder"]},{id:"podbierak-mata",cat:"sprzet",title:"Podbierak, mata, szczypce, miarka",icon:"🧰",summary:"Akcesoria, które chronią rybę i ułatwiają ocenę, czy wolno ją zabrać.",sections:[{list:["Podbierak z gumowaną siatką — nie zdziera śluzu i nie plącze kotwic.","Mata karpiowa — duże ryby kładź na mokrej macie, nigdy na piasku czy kamieniach.","Szczypce i wypychacz — szybkie, bezpieczne wyhaczanie, także głęboko połkniętych haczyków (czasem lepiej uciąć przypon).","Miarka lub mata z podziałką — zmierz rybę od początku zamkniętego pyska do końca płetwy ogonowej (w Bawarii łącznie ze złożoną płetwą ogonową) i od razu wiesz, czy jest wymiarowa.","Siatka do przetrzymywania (siatka/kosz) — w Bawarii wolno używać tylko przestronnych siatek z materiału bezwęzłowego, a przetrzymanych w niej ryb nie wolno wypuścić (AVBayFiG § 20)."]}],related:["catch-release","przepisy-by"]},{id:"sygnalizatory",cat:"sprzet",title:"Sygnalizatory brań",icon:"🔔",summary:"Elektroniczne sygnalizatory, swingery, kiwoki i świetliki — żebyś nie przegapił brania.",sections:[{list:["Elektroniczny sygnalizator z swingerem — karpiowanie i nocny grunt; pokazuje kierunek i siłę brania.","Szczytówka feederowa — miękka końcówka wędziska ugina się przy braniu.","Kiwok — podlodowe i delikatne zestawy.","Świetlik (chemiczny lub LED) na spławik lub szczytówkę — łowienie nocą. W Polsce zakazane jest sztuczne światło do lokalizowania i wabienia ryb; w Bawarii — elektryczne źródła światła przy połowie."]}],related:["karpiowanie","feeder","przepisy-pl","przepisy-by"]},{id:"odziez",cat:"sprzet",title:"Odzież i bezpieczeństwo",icon:"🦺",summary:"Ciepło, sucho i bezpiecznie: warstwy ubrań, wodery, kamizelka asekuracyjna, okulary polaryzacyjne.",sections:[{list:["Ubieraj się warstwowo — nad wodą jest chłodniej i bardziej wieje niż w mieście.","Okulary polaryzacyjne: widzisz ryby i dno, chronią oczy przed przynętą przy rzucie.","Wodery i spodniobuty: nigdy nie wchodź głębiej niż do pasa, a w nurt — tylko z kijem do podpierania.","Na łodzi zawsze kamizelka asekuracyjna; zimą na lodzie — kolce asekuracyjne i lina.","Burza: wędzisko z węgla to piorunochron — przy pierwszych grzmotach schodź znad wody."]}],related:["bezpieczenstwo-lod","pogoda"]},{id:"spinning",cat:"metody",title:"Spinning",icon:"🌀",logLabel:"Spinning",summary:"Aktywne łowienie drapieżników na przynęty sztuczne: rzucasz, prowadzisz, zmieniasz miejsca.",sections:[{h:"Na co",p:["Szczupak, okoń, sandacz, boleń, pstrąg, kleń, jaź, sum, troć, a w morzu dorsz."]},{h:"Zestaw",list:["Wędzisko 2–2,7 m o c.w. dopasowanym do przynęt, kołowrotek 2500–4000, plecionka 0,08–0,15 mm z przyponem.","Na szczupaka zawsze przypon stalowy lub wolframowy."]},{h:"Jak łowić",list:["Obłów miejsce wachlarzem rzutów, potem zmień miejsce — drapieżnik albo atakuje szybko, albo go tam nie ma.","Zmieniaj tempo i głębokość prowadzenia, aż znajdziesz to, na co ryby reagują.","Rano i wieczorem przy powierzchni i w płyciznach, w dzień głębiej."]}],fish:["szczupak","okon","sandacz","bolen","pstrag-potokowy","klen","jaz","sum","troc","dorsz"],related:["woblery","gumy","blystki-obrotowe","wahadlowki","drop-shot","przypony"]},{id:"splawik",cat:"metody",title:"Spławik (bat, bolonka, odległościówka)",icon:"🔴",logLabel:"Spławik",summary:"Najbardziej klasyczna metoda: przynęta na ustalonej głębokości, branie widać na spławiku.",sections:[{h:"Odmiany",list:["Bat (bez kołowrotka) — łowienie przy brzegu, szybkie holowanie drobnicy.","Bolonka (z kołowrotkiem) — rzeka, przepuszczanie zestawu z nurtem.","Odległościówka (match/waggler) — dalsze rzuty na jeziorze, spławik przelotowy, żyłka zatopiona pod powierzchnią."]},{h:"Jak łowić",list:["Zgruntuj łowisko i zanęć kilkoma kulami na start, potem dorzucaj mało i często.","Zacinaj na zdecydowane zanurzenie lub położenie się spławika.","Gdy brań brak, zmieniaj głębokość o kilka cm — często decyduje różnica między „na dnie” a „tuż nad dnem”."]}],fish:["ploc","leszcz","krap","karas","lin","wzdrega","ukleja","karp","okon"],related:["biale-robaki","zaneta-gotowa","splawiki-obciazenie"]},{id:"grunt",cat:"metody",title:"Grunt (gruntówka)",icon:"⚓",logLabel:"Grunt / feeder",summary:"Przynęta leży na dnie na ciężarku; dobra na większe ryby, nocą i w rzekach.",sections:[{list:["Zestaw przelotowy z ciężarkiem i krótkim przyponem — ryba bierze bez oporu.","Klasyka nocnego węgorza i suma (rosówka, martwa rybka), leszcza i brzany w rzece.","Sygnalizacja: szczytówka, dzwoneczek, swinger lub elektroniczny sygnalizator.","Wędki ustaw nisko i równolegle do brzegu w nurcie, żeby wiatr i prąd nie dawały fałszywych sygnałów."]}],fish:["wegorz","sum","leszcz","brzana","karp","mietus","certa"],related:["rosowka","martwa-rybka","feeder"]},{id:"feeder",cat:"metody",title:"Feeder (koszyk zanętowy)",icon:"🧺",logLabel:"Grunt / feeder",summary:"Odmiana gruntu z koszykiem zanętowym: zanęta ląduje dokładnie przy haczyku, branie pokazuje miękka szczytówka.",sections:[{list:["Rzucaj zawsze w to samo miejsce — zaklipsuj żyłkę na kołowrotku i wybierz punkt orientacyjny na drugim brzegu.","Na początku kilka szybkich rzutów pełnym koszykiem, żeby zbudować łowisko.","Rzeka: ciężkie koszyki, długie wędziska trzymane wysoko; jezioro: lżejsze koszyki, dłuższe przypony.","Zacinaj na wyraźne ugięcie szczytówki; przy leszczu często pomaga podniesienie wędziska."]}],fish:["leszcz","krap","ploc","brzana","karp","lin","jaz","certa"],related:["zaneta-gotowa","biale-robaki","method-feeder","splawiki-obciazenie"]},{id:"method-feeder",cat:"metody",title:"Method feeder",icon:"🟢",logLabel:"Method feeder",summary:"Przynęta (pellet, kukurydza, kulka) wciśnięta w zanętę oblepioną wokół podajnika — skuteczna na karpie i liny na łowiskach komercyjnych.",sections:[{list:["Krótki przypon (8–12 cm) z przynętą na włosie lub w opasce, wciśniętą w zanętę.","Zanęta method mix lub namoczony drobny pellet — musi trzymać się podajnika w locie i rozpaść na dnie w 1–3 min.","Wymieniaj zestaw co kilka minut na początku, potem rzadziej.","Ryba sama się zacina o ciężar podajnika — wystarczy podnieść wędzisko."]}],fish:["karp","lin","leszcz","karas-srebrzysty","amur"],related:["kulki-pellet","kukurydza","feeder"]},{id:"karpiowanie",cat:"metody",title:"Karpiowanie",icon:"🐋",logLabel:"Karpiowanie",summary:"Zasiadki na duże karpie: włosowe zestawy samozacinające, celne zanęcanie, sygnalizatory i dbałość o rybę.",sections:[{list:["Zestaw z ciężkim ciężarkiem (80–120 g) i przynętą na włosie — karp sam się zacina, ruszając z przynętą.","Klips bezpieczeństwa: przy zerwaniu ciężarek odpada, a ryba nie zostaje uwiązana.","Znajdź miejsce markerem (spławik markerowy, echosonda): krawędzie spadów, twarde dno, okolice roślin.","Ryby kładź na mokrej macie, nawilżaj i wypuszczaj jak najszybciej; zdjęcia rób nisko nad matą."]}],fish:["karp","amur","lin"],related:["kulki-pellet","zaneta-karpiowa","pva","sygnalizatory","catch-release"]},{id:"muchowka",cat:"metody",title:"Muchówka (wędkarstwo muchowe)",icon:"🪰",logLabel:"Muchówka",summary:"Rzucanie ciężkim sznurem i lekką sztuczną muchą — najbardziej „techniczna” metoda na pstrągi, lipienie i klenie.",sections:[{list:["Wędzisko klasy 3–5 z dopasowanym sznurem (pływający do suchej muchy i nimf, tonący do streamerów), przypon stożkowy.","Naucz się rzutu znad głowy na trawie, zanim pojedziesz nad rzekę — oszczędzisz sobie splątanych przyponów.","Prowadzenie suchej muchy: naturalny dryf bez „ciągnięcia” (drag) — poprawiaj sznur (mending).","Nimfa „po czesku” lub na długą szczytówkę — blisko, z małą ilością sznura, przy dnie."]}],fish:["pstrag-potokowy","lipien","klen","jaz","pstrag-teczowy","troc"],related:["muchy","owady","czytanie-wody"]},{id:"podlodowe",cat:"metody",title:"Łowienie spod lodu",icon:"❄️",logLabel:"Podlodowe",summary:"Zimowe łowienie z przerębli: mormyszka, błystka podlodowa, spławik podlodowy — tylko na bezpiecznym lodzie.",sections:[{list:["Wierć kilka przerębli i obławiaj je po kolei — okonie przemieszczają się stadami.","Mormyszka z ochotką: drobne, rytmiczne drgania i przerwy; branie widać na kiwoku.","Najlepiej pierwszy i ostatni lód; w środku zimy ryby są mniej aktywne.","Na lodzie nigdy sam; sprawdzaj grubość pierzchnią lub świdrem."]},{h:"Przepisy",p:["W Polsce przy połowie spod lodu obowiązują osobne limity haczyków (ostrza w kole o średnicy 20 mm) — szczegóły w „Przepisach o sprzęcie — Polska”."]}],fish:["okon","ploc","leszcz","sieja","sielawa","szczupak","sandacz","mietus"],related:["mormyszki","ochotka","bezpieczenstwo-lod","przepisy-pl"]},{id:"trolling",cat:"metody",title:"Trolling",icon:"🚤",logLabel:"Trolling",summary:"Przynęty ciągnięte za płynącą łodzią — na duże drapieżniki na otwartej wodzie jezior i zalewów oraz na troć w morzu.",sections:[{list:["Woblery głęboko schodzące, wahadłówki, duże gumy; głębokość reguluje długość wypuszczonej linki i ster.","Prędkość 2–4 km/h, zakręty po łuku — przynęta zmienia wtedy tempo, co prowokuje ataki.","Echosonda pokazuje stada drobnicy i spady dna, przy których stoją drapieżniki.","Sprawdź regulamin łowiska — trolling bywa zakazany lub ograniczony (np. tylko z łodzi wiosłowej, zakaz silników spalinowych)."]}],fish:["szczupak","sandacz","sum","troc","troc-jeziorowa","losos","okon"],related:["woblery","wahadlowki"]},{id:"zywcowka",cat:"metody",title:"Żywcówka i martwa rybka",icon:"🐟",logLabel:"Żywiec",summary:"Zestaw spławikowy lub gruntowy z rybką przynętową na szczupaka, sandacza i suma.",sections:[{list:["Spławik żywcowy o wyporności dopasowanej do rybki; przynęta 30–50 cm nad dnem lub nad roślinami.","Zawsze przypon stalowy lub wolframowy, kotwiczka lub pojedynczy hak w grzbiecie lub wardze rybki.","Nie zwlekaj z zacięciem — głęboko połknięta przynęta to ranna ryba, której często nie da się już wypuścić.","W Bawarii żywca nie wolno używać — tylko martwą rybkę (AVBayFiG § 15 ust. 1 pkt 3)."]}],fish:["szczupak","sandacz","sum","okon"],related:["zywiec","martwa-rybka","przypony","przepisy-by"]},{id:"drop-shot",cat:"metody",title:"Drop shot",icon:"⬇️",logLabel:"Drop shot",summary:"Ciężarek na końcu linki, gumka kilkadziesiąt cm wyżej — przynęta drga w miejscu nad dnem; zabójcze na okonia i sandacza.",sections:[{list:["Haczyk przywiązany węzłem palomar tak, by grot patrzył w górę; ciężarek 5–20 g na końcu.","Odległość haczyka od ciężarka = wysokość nad dnem, na której stoją ryby (20–60 cm).","Prowadzenie: ciężarek leży, a ty drobnymi ruchami szczytówki poruszasz samą gumką.","Świetne z łodzi nad stadami widocznymi na echosondzie i przy pasywnych rybach zimą."]}],fish:["okon","sandacz","jazgarz"],related:["gumy","wezly","spinning"]},{id:"sumowe",cat:"metody",title:"Łowienie suma (kwok, grunt, spinning)",icon:"🐋",logLabel:"Sumowe",summary:"Sumy to siła: mocny zestaw, nocny grunt, kwokanie z łodzi lub ciężki spinning.",sections:[{list:["Plecionka 0,4–0,6 mm, mocne haki, kołowrotek z dużą szpulą i solidnym hamulcem.","Grunt nocą na pęczek rosówek, martwą rybę, pellet — przy dołach i zwalonych drzewach.","Kwok: drewniany „klocek” uderzany o wodę wywabia suma z głębiny pod przynętę zawieszoną pod łodzią.","Holuj z łodzi, nie siłuj się z brzegu z dużą rybą przy zaczepach."]},{h:"Przepisy",p:["W Polsce sum ma okres ochronny 1 stycznia – 31 maja i wymiar 70 cm. W Bawarii sum nie ma okresu ani wymiaru ochronnego (Atlas → Sum)."]}],fish:["sum"],related:["rosowka","kulki-pellet","grunt"]},{id:"morskie-kuter",cat:"metody",title:"Wędkowanie morskie z kutra",icon:"⛴️",logLabel:"Morskie z kutra",summary:"Pionowe łowienie z łodzi: pilkery i przywieszki na dorsza, zestawy śledziowe, flądry na pierścienice.",sections:[{list:["Wędzisko 2,1–3 m o c.w. 100–250 g, kołowrotek morski, plecionka 0,15–0,25 mm.","Przy dryfie łodzi utrzymuj pilker przy dnie, regularnie podnosząc go i opuszczając.","Na śledzia: zestaw kilku muszek (paternoster) prowadzony w toni.","Sprawdź aktualne zakazy i limity dla dorsza, łososia i troci w Bałtyku (Atlas → region Bałtyk) — zmieniają się co roku."]}],fish:["dorsz","sledz","stornia","gladzica","makrela"],related:["pilkery","przynety-morskie-naturalne","surfcasting"]},{id:"surfcasting",cat:"metody",title:"Surfcasting (z plaży)",icon:"🏖️",logLabel:"Surfcasting",summary:"Dalekie rzuty z brzegu morza ciężkim zestawem gruntowym — flądry, dorsze, węgorzyce, jesienią i zimą.",sections:[{list:["Długie wędziska 3,9–4,5 m, ciężarki z kotwiczkami (pazurami) trzymające zestaw w falach.","Przynęta: pierścienica, krewetka, kawałek śledzia na przyponach z koralikami.","Najlepiej o zmierzchu i nocą, przy umiarkowanej fali, która „kopie” pokarm z dna.","Ustaw wędki na stojaku wysoko, żeby linka nie leżała na falach."]}],fish:["stornia","gladzica","dorsz","wegorzyca","skarp"],related:["przynety-morskie-naturalne","morskie-kuter"]},{id:"wezly",cat:"porady",title:"Węzły wędkarskie",icon:"🪢",summary:"Kilka sprawdzonych węzłów wystarczy na całe życie — najczęstsza przyczyna straty ryby to źle zawiązany węzeł.",sections:[{h:"Najważniejsze",list:["Palomar — haczyk, krętlik, agrafka; bardzo mocny, także dla plecionki i w drop shocie.","Clinch (ulepszony) — haczyk i krętlik na żyłce; 5–7 owinięć.","Pętla chirurgiczna (podwójna ósemka) — pętla na końcu żyłki do zestawów i przyponów.","Grinner/uni-to-uni — łączenie dwóch żyłek lub plecionki z fluorocarbonem.","Węzeł bezwęzłowy (knotless knot) — przynęta na włosie w karpiowaniu."]},{h:"Zasady",list:["Przed zaciśnięciem zawsze zwilż węzeł śliną — tarcie suchej żyłki ją osłabia.","Zaciskaj powoli i mocno, przytnij końcówkę, zostawiając 2–3 mm.","Po zaczepie lub holu sprawdź węzeł i przywiąż na nowo, jeśli żyłka jest szorstka."]}],related:["zylki-plecionki","haczyki","drop-shot"]},{id:"czytanie-wody",cat:"porady",title:"Jak wybrać miejsce (czytanie wody)",icon:"🔍",summary:"Ryby stoją tam, gdzie mają pokarm, schronienie i odpowiedni tlen — naucz się szukać tych miejsc.",sections:[{h:"Jezioro",list:["Krawędzie spadów, granice roślinności, podwodne górki, ujścia strumieni.","Przy wietrze: brzeg, na który wieje, dostaje pokarm i tlen — często tam żeruje drobnica i drapieżniki.","Latem w upał ryby schodzą głębiej, rano i wieczorem wychodzą na płycizny."]},{h:"Rzeka",list:["Za przeszkodami (kamienie, zwalone drzewa), w „warkoczach” (styk szybkiej i wolnej wody), w zakolach i dołkach.","Główki ostróg: boleń i sandacz na granicy nurtu, leszcz i brzana w spokojniejszej wodzie za nimi.","Pstrąg stoi przodem do nurtu tuż za kamieniem, pod podmytym brzegiem."]},{h:"Ogólnie",list:["Ptaki rybożerne, spławiająca się drobnica i „kotły” bolenia zdradzają żerowisko.","Mapa (zakładka Dziennik → Mapa) i analiza dziennika pokażą, gdzie i kiedy łowisz najlepiej."]}],related:["pory-roku","pogoda","muchowka"]},{id:"pory-roku",cat:"porady",title:"Kalendarz wędkarski: co i kiedy",icon:"📅",summary:"Ryby zachowują się inaczej w każdej porze roku — dostosuj metodę i miejsce do miesiąca (i okresów ochronnych).",sections:[{h:"Wiosna",list:["Woda się nagrzewa — najpierw płycizny i zatoki od słońca; płoć i leszcz na spławik.","Wiele drapieżników ma wtedy okresy ochronne (szczupak, sandacz, sum) — sprawdź Atlas dla swojego regionu."]},{h:"Lato",list:["Rano i wieczorem przy powierzchni (kleń, boleń, okoń), w dzień głębiej; nocą węgorz, sum, karp.","Upał i niski poziom tlenu: łów w nurcie, przy dopływach, nocą."]},{h:"Jesień",list:["Najlepszy czas na szczupaka, okonia i sandacza — drapieżniki żerują przed zimą.","Ryby zbierają się w stada i schodzą do głębszych miejsc."]},{h:"Zima",list:["Spod lodu okoń, płoć, sieja; na otwartej wodzie szczupak na martwą rybkę, miętus nocą w rzekach.","Mało zanęty — metabolizm ryb jest powolny."]}],related:["czytanie-wody","podlodowe","pogoda"]},{id:"pogoda",cat:"porady",title:"Pogoda a brania",icon:"🌦️",summary:"Ciśnienie, wiatr, zachmurzenie i światło wpływają na żerowanie — zakładka Prognoza liczy to za ciebie.",sections:[{list:["Stabilne lub powoli spadające ciśnienie zwykle sprzyja; gwałtowne skoki (przejście frontu) często „wyłączają” brania.","Umiarkowany wiatr marszczący wodę ośmiela ryby i natlenia wodę; silny utrudnia łowienie.","Pochmurnie — ryby śmielej żerują w płytszej wodzie; w pełnym słońcu schodzą głębiej lub w cień.","Świt i zmierzch to najczęściej najlepsze pory, zwłaszcza latem.","Twoja analiza dziennika (Dziennik → Analiza) pokaże, jak to wygląda na twoich łowiskach."]}],related:["pory-roku","czytanie-wody","odziez"]},{id:"zacinanie-hol",cat:"porady",title:"Zacięcie i hol",icon:"💪",summary:"Pewne zacięcie, spokojny hol na hamulcu i podbierak pod rybą — tak nie gubi się dużych ryb.",sections:[{list:["Zacinaj zdecydowanie, ale bez szarpania; przy plecionce wystarczy krótki, mocny ruch.","Trzymaj wędzisko wysoko i pod kątem — ugięcie blanku amortyzuje zrywy ryby.","Nie kręć korbką, gdy ryba ściąga żyłkę z hamulca — skręcisz żyłkę.","Prowadź rybę z dala od zaczepów, bocznym ugięciem wędziska zmieniaj jej kierunek.","Podbierak podstawiaj pod rybę, nie „łap” nim ryby od tyłu."]}],related:["kolowrotki","podbierak-mata","catch-release"]},{id:"catch-release",cat:"porady",title:"Jak wypuszczać ryby",icon:"🤲",summary:"Ryba niewymiarowa, chroniona albo po prostu wypuszczana powinna wrócić do wody jak najszybciej i w dobrej kondycji.",sections:[{list:["Mokre ręce, krótko poza wodą — śluz chroni rybę przed infekcjami.","Nie ściskaj ryby i nie trzymaj jej za skrzela; dużą podtrzymuj pod brzuchem poziomo.","Wyhaczaj szczypcami lub wypychaczem; głęboko połknięty haczyk lepiej uciąć niż wyrywać.","Przytrzymaj rybę w wodzie głową pod prąd, aż sama odpłynie.","Polska i Bawaria: rybę niewymiarową lub złowioną w okresie ochronnym trzeba od razu wypuścić; gatunków obcych z listy (np. babki, sumiki) nie wolno wypuszczać — zob. Atlas."]}],related:["podbierak-mata","haczyki","zacinanie-hol"]},{id:"bezpieczenstwo-lod",cat:"porady",title:"Bezpieczeństwo na lodzie",icon:"🧊",summary:"Lód zabija każdej zimy — wchodź tylko na pewny lód i miej przy sobie sprzęt ratunkowy.",sections:[{list:["Za bezpieczny dla jednej osoby przyjmuje się zwykle przezroczysty, twardy lód grubości co najmniej 10 cm; lód biały, porowaty, „spróchniały” lub nad nurtem jest słabszy.","Sprawdzaj lód pierzchnią przed każdym krokiem, omijaj trzciny, ujścia rzek, przepusty i miejsca z przeręblami.","Kolce asekuracyjne na szyi, lina, telefon w wodoszczelnym woreczku; najlepiej łów w towarzystwie.","Gdy lód pęka: połóż się, rozłóż ciężar i czołgaj się w kierunku, z którego przyszedłeś.","Wiosenny lód jest najbardziej zdradliwy — ma grubość, ale traci wytrzymałość."]}],related:["podlodowe","odziez"]},{id:"etyka",cat:"porady",title:"Dobre obyczaje nad wodą",icon:"🌿",summary:"Szacunek dla wody, ryb i innych wędkarzy — dzięki temu łowiska są czyste i pełne ryb.",sections:[{list:["Zabieraj wszystkie śmieci, żyłkę i opakowania (także cudze, jeśli możesz).","Zabieraj tylko tyle ryb, ile zjesz; duże ryby to najlepsze tarlaki — rozważ ich wypuszczenie.","Zachowaj odstęp od innych wędkarzy i nie zarzucaj w ich łowisko.","Nie przenoś ryb, roślin ani wody między zbiornikami — tak rozprzestrzeniają się choroby i gatunki inwazyjne.","Miej przy sobie kartę wędkarską i zezwolenie na łowisko."]}],related:["catch-release","przepisy-pl","przepisy-by"]},{id:"przepisy-pl",cat:"przepisy",title:"Przepisy o sprzęcie — Polska",icon:"🇵🇱",source:ib,summary:"Co mówi rozporządzenie o połowie wędką: liczba haczyków, długość wędziska, sztuczne światło, połów spod lodu, podrywka.",sections:[{h:"Połów wędką (§ 2 ust. 2)",list:["Bez stosowania sztucznego światła do lokalizacji i wabienia ryb.","Wędzisko o długości co najmniej 30 cm z linką zakończoną:","— jednym haczykiem z przynętą, albo","— najwyżej dwoma haczykami, każdy ze sztuczną przynętą imitującą owada lub jego stadia rozwojowe; każdy haczyk najwyżej z dwoma ostrzami mieszczącymi się w kole o średnicy 30 mm, albo","— sztuczną przynętą z najwyżej trzema haczykami, każdy najwyżej z czterema ostrzami mieszczącymi się w kole o średnicy 30 mm."]},{h:"Limit węgorza (§ 2 ust. 3)",p:["Dobowy limit połowu węgorza — do 2 sztuk."]},{h:"Połów spod lodu (§ 2 ust. 4)",list:["Wędzisko co najmniej 30 cm z linką zakończoną:","— jednym haczykiem z przynętą (najwyżej trzy ostrza w kole o średnicy 20 mm), albo","— sztuczną przynętą z najwyżej dwoma haczykami (każdy najwyżej trzy ostrza w kole o średnicy 20 mm)."]},{h:"Podrywka na rybki przynętowe (§ 2 ust. 5)",p:["Siatka najwyżej 1 m × 1 m, oczka nie mniejsze niż 5 mm."]},{h:"Czego rozporządzenie nie reguluje",p:["Liczba wędek, łowienie na żywca, zanęcanie i limity dzienne (poza węgorzem) wynikają z regulaminu łowiska (PZW, RZGW Wód Polskich, właściciel wody). Do połowu potrzebna jest karta wędkarska i zezwolenie uprawnionego do rybactwa w danej wodzie."]}],related:["przepisy-by","haczyki","podlodowe"]},{id:"przepisy-by",cat:"przepisy",title:"Przepisy o sprzęcie — Bawaria",icon:"🇩🇪",source:ab,summary:"AVBayFiG: najwyżej dwie wędki, do 5 haczyków na wędce, zakaz żywca i szarpaka, zasady dla siatek do przetrzymywania ryb.",sections:[{h:"Wędka (§ 16)",list:["Wędka może mieć najwyżej pięć miejsc zacięcia (haczyk pojedynczy, podwójny lub kotwiczka), każde z przynętą naturalną lub sztuczną.","Wędka musi być stale pod nadzorem i nie wolno jej używać jako szarpaka (Reißangel).","Rozstawione sznury gruntowe i zawieszane trzeba podnosić co najmniej codziennie."]},{h:"Zakazy (§ 15 ust. 1)",list:["Połów przy użyciu elektrycznych źródeł światła, elektrycznych przynęt, szarpaków, wędek dryfujących swobodnie, harpunów, ości, dronów i innych wymienionych narzędzi.","Łowienie na żywą rybkę przynętową (pkt 3).","Łowienie więcej niż dwiema wędkami jednocześnie; przy dwóch wędkach łącznie najwyżej sześć miejsc zacięcia (pkt 6)."]},{h:"Przetrzymywanie ryb (§ 20)",list:["Przetrzymywanie ryb w wodzie, w której je złowiono, ma trwać jak najkrócej.","Siatki (Setzkescher) tylko odpowiednio przestronne i z materiału bezwęzłowego.","Ryb przetrzymywanych w siatce nie wolno wypuścić z powrotem do łowiska."]},{h:"Martwa rybka (§ 21 ust. 2)",p:["Zakaz wrzucania martwych ryb do wody nie dotyczy martwych rybek przynętowych używanych zgodnie z dobrą praktyką."]},{h:"Pamiętaj",p:["Okręgi i powiaty mogą wprowadzać dodatkowe ograniczenia (§ 15 ust. 2–3), a szczegóły łowiska (limity, metody, zanęcanie) określa zezwolenie (Erlaubnisschein). Tekst AVBayFiG w brzmieniu od 01.06.2025."]}],related:["przepisy-pl","zywiec","podbierak-mata"]}],nb=Object.fromEntries(qr.map(c=>[c.id,c])),ob=[...new Set(qr.filter(c=>c.logLabel).map(c=>c.logLabel)),"Inna"],sb=["Rosówka","Czerwony robak","Białe robaki","Kasterki","Ochotka","Kukurydza","Pęczak","Konopie","Ciasto","Chleb","Kulka proteinowa","Pellet","Żywiec","Martwa rybka","Filet rybny","Konik polny","Pierścienica","Wobler","Guma (ripper)","Twister","Błystka obrotowa","Wahadłówka","Cykada","Popper","Kogut","Sucha mucha","Nimfa","Streamer","Mormyszka","Balanser","Pilker"];function rb(c){return qr.filter(m=>m.fish?.includes(c)&&(m.cat==="metody"||m.cat==="naturalne"||m.cat==="sztuczne"))}const lb="https://wedkarz-ai.atlas-grzybow.workers.dev",Sz="MDq-u8u1hEOKqRoLt_4i9s-zX0xfitV4",fh=()=>!!Sz;async function Mz(c,m){if(!fh())throw new Error("Rozpoznawanie nie jest skonfigurowane w tej wersji aplikacji.");const f=[];for(const g of c.slice(0,3)){const k=await zz(g,1024,.8);f.push({mediaType:"image/jpeg",base64:await Bk(k)})}let h;try{h=await fetch(`${lb}/identify`,{method:"POST",headers:{"Content-Type":"application/json","X-App-Token":Sz},body:JSON.stringify({images:f,hint:m,month:new Date().getMonth()+1})})}catch{throw new Error("Brak połączenia z internetem — rozpoznawa
