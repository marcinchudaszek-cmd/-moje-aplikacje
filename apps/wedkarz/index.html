up:"drapiezne",desc:"Mały (zwykle do 15 cm), krępy okoniowaty: jedna zrośnięta płetwa grzbietowa z kolcami, oliwkowy w drobne ciemne cętki, duże jamy śluzowe na głowie. Bardzo śluzowaty.",habitat:"Jeziora, zalewy i duże rzeki nad piaszczystym lub mulistym dnem, stadnie przy dnie.",baits:"Robaki, ochotka, białe robaki — często przyłów przy połowie leszczy."},{id:"bolen",name:"Boleń",nameDe:"Rapfen (Schied)",latin:"Leuciscus aspius",group:"drapiezne",desc:"Drapieżna ryba karpiowata: srebrzysty, wydłużony, duży pysk z wysuniętą żuchwą sięgający za oko. Atakuje drobnicę z pluskiem przy powierzchni.",habitat:"Większe rzeki i zbiorniki zaporowe, prąd za przeszkodami, główki ostróg.",baits:"Szybko prowadzone woblery powierzchniowe, cykady, błystki, rzutówki."},{id:"sum",name:"Sum",nameDe:"Wels",latin:"Silurus glanis",group:"drapiezne",desc:"Największa ryba słodkowodna Europy Środkowej. Bez łusek, ogromna głowa, sześć wąsów (dwa długie na górnej szczęce), bardzo długa płetwa odbytowa.",habitat:"Głębokie doły dużych rzek, zbiorniki zaporowe, jeziora; aktywny głównie nocą.",baits:"Pęczek rosówek, żywiec, martwa ryba, pellet, duże gumy i woblery, kwok."},{id:"wegorz",name:"Węgorz",nameDe:"Aal",latin:"Anguilla anguilla",group:"drapiezne",desc:"Wężowate ciało, płetwy grzbietowa, ogonowa i odbytowa zrośnięte w jedną. Śliski, drobne łuski głęboko w skórze. Gatunek krytycznie zagrożony.",habitat:"Jeziora i rzeki o mulistym dnie; żeruje nocą, szczególnie w ciepłe, parne noce.",baits:"Rosówki, martwa rybka, filet, ślimaki."},{id:"mietus",name:"Miętus",nameDe:"Rutte (Quappe, Trüsche)",latin:"Lota lota",group:"drapiezne",desc:"Jedyny słodkowodny przedstawiciel dorszowatych: marmurkowy, brązowo-oliwkowy, jeden wąs na podbródku, długie płetwy grzbietowa i odbytowa.",habitat:"Chłodne, czyste rzeki i głębokie jeziora; aktywny zimą i nocą.",baits:"Rosówki, martwe rybki, filety rybne — nocą przy dnie."},{id:"pstrag-potokowy",name:"Pstrąg potokowy",nameDe:"Bachforelle",latin:"Salmo trutta m. fario",group:"lososiowate",desc:"Czarne i czerwone kropki (czerwone często w jasnej obwódce), płetwa tłuszczowa, ubarwienie zależne od wody — od złotawego po ciemne.",habitat:"Czyste, chłodne, dobrze natlenione potoki i rzeki podgórskie oraz nizinne.",baits:"Muchy (sucha, mokra, nimfa, streamer), małe woblery i błystki obrotowe."},{id:"pstrag-teczowy",name:"Pstrąg tęczowy",nameDe:"Regenbogenforelle",latin:"Oncorhynchus mykiss",group:"lososiowate",desc:"Gatunek z Ameryki Północnej, hodowlany. Gęste czarne kropki także na płetwie ogonowej, wzdłuż boku różowa „tęczowa” smuga.",habitat:"Łowiska specjalne i komercyjne, rzadziej uciekinierzy z hodowli w rzekach.",baits:"Pasty pstrągowe, robaki, muchy, małe błystki, spinner."},{id:"pstrag-zrodlany",name:"Pstrąg źródlany",nameDe:"Bachsaibling",latin:"Salvelinus fontinalis",group:"lososiowate",desc:"Gatunek z Ameryki Północnej (golec). Ciemny grzbiet z jasnym, robaczkowatym marmurkiem, czerwone plamki z niebieską obwódką, biało-czarne przednie krawędzie dolnych płetw.",habitat:"Zimne potoki górskie i źródliskowe, także zakwaszone; wsiedlany.",baits:"Muchy, małe błystki obrotowe, robaki."},{id:"palia",name:"Palia jeziorowa",nameDe:"Seesaibling",latin:"Salvelinus umbla",group:"lososiowate",desc:"Golec jezior alpejskich: smukły, oliwkowy grzbiet, jasne plamki, w szacie godowej pomarańczowo-czerwony brzuch i płetwy z białą krawędzią.",habitat:"Głębokie, zimne jeziora alpejskie i podalpejskie (Bawaria); w Polsce nie występuje naturalnie.",baits:"Głębokie trollingowanie, małe błystki, sztuczne nimfy, mormyszki spod lodu."},{id:"lipien",name:"Lipień",nameDe:"Äsche",latin:"Thymallus thymallus",group:"lososiowate",desc:"Bardzo wysoka, „chorągiewkowa” płetwa grzbietowa z fioletowym połyskiem, mały pysk, płetwa tłuszczowa, łuski w podłużnych rzędach.",habitat:"Szybko płynące, czyste rzeki podgórskie i wyżynne z kamienistym lub żwirowym dnem.",baits:"Głównie muszkarstwo: nimfy, suche muchy, mokre muchy."},{id:"troc",name:"Troć wędrowna",nameDe:"Meerforelle",latin:"Salmo trutta m. trutta",group:"lososiowate",desc:"Srebrzysta z rzadkimi czarnymi plamkami w kształcie „x”, płetwa tłuszczowa. Wędruje z morza do rzek na tarło.",habitat:"Rzeki pomorskie uchodzące do Bałtyku, dolna Wisła i Odra z dopływami.",baits:"Woblery, błystki wahadłowe i obrotowe, streamery."},{id:"troc-jeziorowa",name:"Troć jeziorowa",nameDe:"Seeforelle",latin:"Salmo trutta m. lacustris",group:"lososiowate",desc:"Jeziorowa forma troci: srebrzysta, duża, z czarnymi plamkami. W Polsce rzadka (głównie Wdzydze), w Bawarii w jeziorach alpejskich.",habitat:"Głębokie, chłodne jeziora o wysokiej przejrzystości.",baits:"Trolling: woblery i błystki wahadłowe."},{id:"losos",name:"Łosoś atlantycki",nameDe:"Atlantischer Lachs",latin:"Salmo salar",group:"lososiowate",desc:"Smukły, srebrny, nieliczne plamki głównie powyżej linii bocznej, cienka nasada ogona, płetwa ogonowa lekko wcięta.",habitat:"Rzeki uchodzące do Bałtyku, do których jest restytuowany (m.in. Drawa, Wieprza, Słupia).",baits:"Woblery, błystki wahadłowe, muchy łososiowe."},{id:"glowacica",name:"Głowacica",nameDe:"Huchen",latin:"Hucho hucho",group:"lososiowate",desc:"Duża, wałkowata łososiowata o szerokiej głowie, miedzianym grzbiecie i drobnych czarnych kropkach.",habitat:"Górskie i podgórskie rzeki; w Polsce głównie Dunajec, Poprad i Czarna Orawa, w Bawarii dorzecze Dunaju (Isar, Inn, Ilz).",baits:"Duże woblery, gumy, wahadłówki, warkocze."},{id:"sieja",name:"Sieja",nameDe:"Renke (Felchen)",latin:"Coregonus maraena",group:"lososiowate",desc:"Srebrzysta, z płetwą tłuszczową i małym, dolnym pyskiem. Łuski duże, łatwo odpadające. W Bawarii pod nazwą Renke/Felchen łowi się kilka form siei.",habitat:"Głębokie, czyste i chłodne jeziora.",baits:"Ochotka, małe muszki i nimfy (zestawy „Hegene”), mormyszki."},{id:"sielawa",name:"Sielawa",nameDe:"Kleine Maräne",latin:"Coregonus albula",group:"lososiowate",desc:"Mała, śledziowata łososiowata z płetwą tłuszczową i wysuniętą dolną szczęką.",habitat:"Głębokie jeziora o chłodnej, natlenionej wodzie (Pojezierze Mazurskie, Pomorskie).",baits:"Ochotka, mormyszki, sztuczne muszki (zwłaszcza spod lodu)."},{id:"stynka",name:"Stynka",nameDe:"Stint",latin:"Osmerus eperlanus",group:"lososiowate",desc:"Mała (zwykle do 20 cm), półprzezroczysta, srebrzysta ryba z płetwą tłuszczową i dużym pyskiem z zębami. Świeża pachnie ogórkiem.",habitat:"Zalewy przymorskie, ujścia rzek i głębokie jeziora.",baits:"Małe błystki i muszki, mormyszki spod lodu; przynęta na drapieżniki."},{id:"karp",name:"Karp",nameDe:"Karpfen",latin:"Cyprinus carpio",group:"karpiowate",desc:"Wysokie ciało, cztery wąsy przy pysku (dwa dłuższe), długa płetwa grzbietowa z ząbkowanym promieniem. Odmiany: pełnołuski, lustrzeń, golec.",habitat:"Stawy, zbiorniki, jeziora i wolne rzeki o mulistym dnie; łowiska komercyjne.",baits:"Kulki proteinowe, pellet, kukurydza, ziemniak, ciasto, robaki."},{id:"amur",name:"Amur biały",nameDe:"Graskarpfen",latin:"Ctenopharyngodon idella",group:"karpiowate",desc:"Gatunek z Azji, wsiedlany. Wałkowaty, duże ciemno obrzeżone łuski, szeroka głowa, brak wąsów. Roślinożerny.",habitat:"Zbiorniki z roślinnością, stawy, łowiska komercyjne, ciepłe kanały.",baits:"Kukurydza, trzcina, koniczyna, pellet, kulki."},{id:"tolpyga",name:"Tołpyga biała",nameDe:"Silberkarpfen",latin:"Hypophthalmichthys molitrix",group:"karpiowate",desc:"Gatunek z Azji, wsiedlany. Srebrna, bardzo drobnołuska, oczy osadzone nisko pod linią pyska, wysoki ostry kil na brzuchu. Filtruje plankton, potrafi wyskakiwać z wody.",habitat:"Zbiorniki zaporowe, duże stawy i łowiska komercyjne.",baits:"Trudna do złowienia na wędkę — gąbki i pływające zanęty planktonowe."},{id:"lin",name:"Lin",nameDe:"Schleie",latin:"Tinca tinca",group:"karpiowate",desc:"Krępy, oliwkowo-złoty, bardzo drobne łuski i gruby śluz, małe czerwone oczy, dwa krótkie wąsy w kącikach pyska.",habitat:"Zarośnięte jeziora, stawy i starorzecza z mulistym dnem.",baits:"Czerwone robaki, białe robaki, kukurydza, pęczak, ochotka."},{id:"karas",name:"Karaś pospolity",nameDe:"Karausche",latin:"Carassius carassius",group:"karpiowate",desc:"Wysoki, złotawo-brązowy, bez wąsów, wypukła (zaokrąglona) krawędź płetwy grzbietowej. Coraz rzadszy rodzimy gatunek.",habitat:"Małe, zarośnięte, często przyduchowe stawy i torfianki.",baits:"Robaki, ciasto, chleb, pęczak."},{id:"karas-srebrzysty",name:"Karaś srebrzysty",nameDe:"Giebel",latin:"Carassius gibelio",group:"karpiowate",desc:"Srebrzysty, bez wąsów, wklęsła krawędź płetwy grzbietowej, czarna otrzewna. Pospolity gatunek obcego pochodzenia.",habitat:"Niemal wszystkie wody stojące i wolno płynące.",baits:"Robaki, kukurydza, pęczak, ciasto."},{id:"leszcz",name:"Leszcz",nameDe:"Brachse (Blei)",latin:"Abramis brama",group:"karpiowate",desc:"Bardzo wysokie, bocznie spłaszczone ciało, wysuwalny pysk, długa płetwa odbytowa. Młode srebrne, duże brązowo-złote.",habitat:"Jeziora i duże rzeki o miękkim dnie; żeruje stadnie przy dnie.",baits:"Białe robaki, czerwone robaki, kukurydza, pęczak, ochotka — metoda gruntowa i feeder."},{id:"krap",name:"Krąp",nameDe:"Güster",latin:"Blicca bjoerkna",group:"karpiowate",desc:"Podobny do młodego leszcza, ale z czerwonawymi nasadami płetw piersiowych i brzusznych, większym okiem i krótszą płetwą odbytową.",habitat:"Jeziora, zbiorniki i wolne rzeki.",baits:"Białe robaki, kukurydza, pęczak."},{id:"rozpior",name:"Rozpiór",nameDe:"Zope",latin:"Ballerus ballerus",group:"karpiowate",desc:"Podobny do leszcza, ale smuklejszy, z górnym pyskiem i bardzo długą płetwą odbytową.",habitat:"Duże rzeki nizinne, zalewy i przepływowe jeziora.",baits:"Białe robaki, ochotka."},{id:"sapa",name:"Sapa",nameDe:"Zobel",latin:"Ballerus sapa",group:"karpiowate",desc:"Leszczowata ryba dużych rzek: wysoka, z półdolnym, tępym pyskiem, dużym okiem i bardzo długą płetwą odbytową; dolny płat ogona dłuższy od górnego.",habitat:"Duże rzeki o wyraźnym nurcie (w Polsce rzadka, głównie Wisła; w Bawarii Dunaj).",baits:"Białe robaki, ochotka — grunt na nurcie."},{id:"ploc",name:"Płoć",nameDe:"Rotauge",latin:"Rutilus rutilus",group:"karpiowate",desc:"Srebrzysta, czerwone tęczówki, płetwa grzbietowa zaczyna się nad nasadą płetw brzusznych. Najpospolitsza ryba spławikowa.",habitat:"Praktycznie wszystkie wody.",baits:"Białe robaki, pęczak, ciasto, konopie, ochotka."},{id:"wzdrega",name:"Wzdręga",nameDe:"Rotfeder",latin:"Scardinius erythrophthalmus",group:"karpiowate",desc:"Podobna do płoci, ale z jaskrawoczerwonymi płetwami, złotawym okiem i pyskiem skierowanym ku górze; płetwa grzbietowa wyraźnie za nasadą brzusznych.",habitat:"Zarośnięte jeziora i starorzecza, przy powierzchni.",baits:"Chleb, białe robaki, owady przy powierzchni."},{id:"klen",name:"Kleń",nameDe:"Döbel (Aitel)",latin:"Squalius cephalus",group:"karpiowate",desc:"Wałkowaty, szeroka „tępa” głowa i duży pysk, łuski z ciemnym obrzeżeniem tworzące siateczkę, wypukła płetwa odbytowa.",habitat:"Rzeki o umiarkowanym i szybkim nurcie, pod nawisami drzew.",baits:"Owady, chleb, wiśnie, małe woblery, muchy."},{id:"jaz",name:"Jaź",nameDe:"Aland (Nerfling)",latin:"Leuciscus idus",group:"karpiowate",desc:"Krępszy od klenia, mniejszy pysk, prosta (lekko wklęsła) płetwa odbytowa, złotawe łuski i czerwonawe płetwy.",habitat:"Większe rzeki nizinne i przepływowe jeziora.",baits:"Robaki, kukurydza, owady, małe błystki i woblery."},{id:"jelec",name:"Jelec",nameDe:"Hasel",latin:"Leuciscus leuciscus",group:"karpiowate",desc:"Smukły, srebrzysty, mała głowa, wklęsła krawędź płetwy odbytowej — tym różni się od młodego klenia.",habitat:"Czyste rzeki z wyraźnym nurtem.",baits:"Białe robaki, owady, sztuczne muszki."},{id:"ukleja",name:"Ukleja",nameDe:"Laube (Ukelei)",latin:"Alburnus alburnus",group:"karpiowate",desc:"Mała, smukła i bardzo srebrzysta, pysk skierowany ku górze, łuski łatwo odpadają. Pływa stadami przy powierzchni.",habitat:"Jeziora i rzeki, warstwa przypowierzchniowa.",baits:"Białe robaki, ciasto, ochotka; świetna przynęta na drapieżniki."},{id:"brzana",name:"Brzana",nameDe:"Barbe",latin:"Barbus barbus",group:"karpiowate",desc:"Wydłużona, płaski brzuch, dolny mięsisty pysk z czterema wąsami. Ryba szybkiego nurtu.",habitat:"Rzeki o szybkim nurcie i żwirowo-kamienistym dnie.",baits:"Robaki, ser, pellet, białe robaki — gruntówka i feeder na nurcie."},{id:"brzanka",name:"Brzanka",nameDe:"Karpatenbarbe",latin:"Barbus carpathicus",group:"karpiowate",desc:"Mniejsza krewna brzany (do ok. 25 cm), z wyraźnymi ciemnymi cętkami na grzbiecie, bokach i płetwach, cztery wąsy.",habitat:"Potoki i małe rzeki karpackie (Wisła górna, San, Dunajec z dopływami).",baits:ke},{id:"swinka",name:"Świnka",nameDe:"Nase",latin:"Chondrostoma nasus",group:"karpiowate",desc:"Charakterystyczny dolny, poprzeczny pysk z twardą, ostrą wargą do zeskrobywania glonów; czarna otrzewna.",habitat:"Rzeki podgórskie i wyżynne z kamienistym dnem.",baits:"Robaki, białe robaki, nimfy."},{id:"certa",name:"Certa",nameDe:"Zährte (Seerüssling)",latin:"Vimba vimba",group:"karpiowate",desc:"Dolny pysk z mięsistym „noskiem”, ciemny grzbiet; wędruje z Bałtyku w górę rzek.",habitat:"Duże rzeki i ich ujścia, zalewy.",baits:"Robaki, białe robaki, ochotka — grunt."},{id:"ciosa",name:"Ciosa",nameDe:"Ziege (Sichling)",latin:"Pelecus cultratus",group:"karpiowate",desc:"Bocznie spłaszczona jak nóż, z prostym grzbietem i łukowato wygiętym brzuchem z ostrym kilem, pysk skierowany stromo ku górze, długie płetwy piersiowe.",habitat:"Zalew Wiślany i ujścia rzek; w Bawarii Dunaj.",baits:"Małe błystki, muszki, białe robaki — przy powierzchni."},{id:"kielb",name:"Kiełb",nameDe:"Gründling",latin:"Gobio gobio",group:"karpiowate",desc:"Mały (do ok. 15 cm), wrzecionowaty, płaski brzuch, dwa wąsy w kącikach dolnego pyska, rząd ciemnych plam wzdłuż boku.",habitat:"Rzeki i jeziora z piaszczystym lub żwirowym dnem.",baits:"Czerwone robaki, białe robaki — przy samym dnie; dobra przynęta na drapieżniki."},{id:"kielb-bialopletwy",name:"Kiełb białopłetwy",nameDe:"Weißflossiger Gründling",latin:"Romanogobio albipinnatus",group:"karpiowate",desc:"Podobny do kiełbia, ale z dłuższymi wąsami i niemal bezbarwnymi, nieplamkowanymi płetwami grzbietową i ogonową.",habitat:"Większe nizinne rzeki o piaszczystym dnie (Wisła, Odra, Bug).",baits:ke},{id:"strzebla-potokowa",name:"Strzebla potokowa",nameDe:"Elritze",latin:"Phoxinus phoxinus",group:"karpiowate",desc:"Mała (do ok. 10 cm), drobnołuska, z ciemnymi plamami lub pręgami na bokach; samce w szacie godowej z czerwonym brzuchem.",habitat:"Zimne, czyste potoki górskie i podgórskie, przejrzyste jeziora.",baits:"Przyłów przy połowie pstrągów na drobne przynęty."},{id:"strzebla-blotna",name:"Strzebla błotna",nameDe:"Sumpfelritze",latin:"Eupallasella percnurus",group:"karpiowate",desc:"Mała, krępa, złotawo-oliwkowa z drobnymi ciemnymi plamkami. Jedna z najrzadszych ryb Polski.",habitat:"Małe, płytkie, zarastające zbiorniki i torfianki.",baits:ke},{id:"slonecznica",name:"Słonecznica",nameDe:"Moderlieschen",latin:"Leucaspius delineatus",group:"karpiowate",desc:"Drobna (do ok. 8 cm), srebrzysta z niebieskawym paskiem wzdłuż boku, niepełna linia boczna, górny pysk.",habitat:"Małe, zarośnięte stawy, rowy i starorzecza.",baits:"Przyłów na bardzo małe przynęty."},{id:"rozanka",name:"Różanka",nameDe:"Bitterling",latin:"Rhodeus amarus",group:"karpiowate",desc:"Mała (do ok. 9 cm), wysoka, z turkusowym paskiem na tylnej części boku; samce w szacie godowej różowo-fioletowe. Składa ikrę do małży.",habitat:"Wolno płynące i stojące wody z małżami skójkowatymi.",baits:ke},{id:"piekielnica",name:"Piekielnica",nameDe:"Schneider",latin:"Alburnoides bipunctatus",group:"karpiowate",desc:"Mała, podobna do uklei, ale z linią boczną obrzeżoną podwójnym rzędem ciemnych kropek.",habitat:"Czyste, szybko płynące rzeki podgórskie i wyżynne.",baits:ke},{id:"sliz",name:"Śliz",nameDe:"Bachschmerle",latin:"Barbatula barbatula",group:"drobne",desc:"Mała (do ok. 15 cm), wałkowata, sześć wąsików przy dolnym pysku, marmurkowa brązowa szata, brak kolców pod okiem.",habitat:"Czyste potoki i rzeki z kamienistym dnem, pod kamieniami.",baits:ke},{id:"koza",name:"Koza pospolita",nameDe:"Steinbeißer",latin:"Cobitis taenia",group:"drobne",desc:"Mała, bocznie spłaszczona, z rzędami ciemnych plam na jasnym tle, sześć wąsików i rozwidlony kolec pod okiem.",habitat:"Piaszczyste dno rzek i jezior, zagrzebana w piasku.",baits:ke},{id:"koza-dunajska",name:"Koza dunajska",nameDe:"Donau-Steinbeißer",latin:"Cobitis elongatoides",group:"drobne",desc:"Bardzo podobna do kozy pospolitej; rozróżnia je badanie genetyczne lub liczenie plam. Kolec pod okiem.",habitat:"Dorzecze Dunaju i południowa Polska (dopływy górnej Wisły, Odry).",baits:ke},{id:"koza-zlotawa",name:"Koza złotawa",nameDe:"Goldsteinbeißer",latin:"Sabanejewia aurata",group:"drobne",desc:"Mała koza o złotawym tle z rzędem dużych ciemnych plam wzdłuż boku; kolec pod okiem.",habitat:"Czyste rzeki podgórskie ze żwirowym dnem (w Polsce bardzo rzadka).",baits:ke},{id:"piskorz",name:"Piskorz",nameDe:"Schlammpeitzger",latin:"Misgurnus fossilis",group:"drobne",desc:"Wydłużony, węgorzowaty (do ok. 30 cm), z podłużnymi ciemnymi pasami i dziesięcioma wąsikami. Potrafi oddychać jelitem i „piszczy” wyjęty z wody.",habitat:"Muliste starorzecza, rowy i stawy, także przyduchowe.",baits:ke},{id:"glowacz-bialopletwy",name:"Głowacz białopłetwy",nameDe:"Koppe (Groppe)",latin:"Cottus gobio",group:"drobne",desc:"Mały (do ok. 15 cm), z dużą spłaszczoną głową i szerokim pyskiem, bez łusek, marmurkowy; płetwy brzuszne jasne, bez wyraźnych pręg.",habitat:"Zimne, czyste potoki i rzeki z kamieniami, pod którymi się kryje.",baits:ke},{id:"glowacz-pregopletwy",name:"Głowacz pręgopłetwy",nameDe:"Buntflossenkoppe",latin:"Cottus poecilopus",group:"drobne",desc:"Bardzo podobny do głowacza białopłetwego, ale z wyraźnymi ciemnymi pręgami na długich płetwach brzusznych.",habitat:"Potoki karpackie i sudeckie, zimne jeziora pomorskie.",baits:ke},{id:"ciernik",name:"Ciernik",nameDe:"Dreistachliger Stichling",latin:"Gasterosteus aculeatus",group:"drobne",desc:"Mały (do ok. 8 cm), z trzema wolnymi kolcami przed płetwą grzbietową i kostnymi płytkami na bokach; samiec w okresie godów z czerwonym gardłem.",habitat:"Rowy, stawy, przybrzeżne wody Bałtyku i rzeki nizinne.",baits:"Nie jest celem wędkarzy — przyłów na drobne przynęty."},{id:"cierniczek",name:"Cierniczek",nameDe:"Neunstachliger Stichling",latin:"Pungitius pungitius",group:"drobne",desc:"Drobny (do ok. 6 cm), z 7–12 małymi kolcami przed płetwą grzbietową; samiec w godach ciemny.",habitat:"Zarośnięte rowy, stawy i torfianki.",baits:"Nie jest celem wędkarzy — przyłów na drobne przynęty."},{id:"jesiotr",name:"Jesiotr ostronosy",nameDe:"Atlantischer Stör (amerikanisch)",latin:"Acipenser oxyrinchus",group:"pradawne",desc:"Pancerz z rzędów kostnych tarczek, wydłużony ryj z wąsami, asymetryczna płetwa ogonowa. Gatunek restytuowany w Wiśle i Odrze.",habitat:"Wisła, Odra i ich ujścia.",baits:"Połów zabroniony przez cały rok — każdy okaz natychmiast wypuść."},{id:"jesiotr-zachodni",name:"Jesiotr zachodni",nameDe:"Atlantischer Stör",latin:"Acipenser sturio",group:"pradawne",desc:"Bardzo podobny do jesiotra ostronosego; dawniej występował w rzekach Niemiec i Polski, dziś skrajnie rzadki i restytuowany.",habitat:"Duże rzeki uchodzące do Morza Północnego i Bałtyku.",baits:"Ochrona całoroczna — każdy okaz natychmiast wypuść."},{id:"sterlet",name:"Sterlet",nameDe:"Sterlet",latin:"Acipenser ruthenus",group:"pradawne",desc:"Mały jesiotr (zwykle do 1 m) z długim, wąskim ryjem i frędzlowatymi wąsami; tarczki grzbietowe ostre.",habitat:"Dunaj z dopływami; w Polsce głównie uciekinierzy z hodowli.",baits:"W Bawarii chroniony przez cały rok — wypuść."},{id:"minog-strumieniowy",name:"Minóg strumieniowy",nameDe:"Bachneunauge",latin:"Lampetra planeri",group:"pradawne",desc:"Bezszczękowiec (nie ryba w ścisłym sensie): węgorzowaty, do ok. 20 cm, z okrągłą przyssawką zamiast pyska i siedmioma otworami skrzelowymi.",habitat:"Czyste potoki; larwy żyją latami zagrzebane w mule.",baits:ke},{id:"minog-rzeczny",name:"Minóg rzeczny",nameDe:"Flussneunauge",latin:"Lampetra fluviatilis",group:"pradawne",desc:"Wędrowny minóg do ok. 50 cm, srebrzysto-szary, z przyssawką i siedmioma otworami skrzelowymi.",habitat:"Bałtyk i rzeki, do których wędruje na tarło.",baits:ke},{id:"minog-morski",name:"Minóg morski",nameDe:"Meerneunauge",latin:"Petromyzon marinus",group:"pradawne",desc:"Największy minóg (do ok. 1 m), marmurkowy, z dużą przyssawką pełną zębów.",habitat:"Morze; do rzek wchodzi na tarło (w Polsce bardzo rzadki).",baits:ke},{id:"minog-ukrainski",name:"Minóg ukraiński",nameDe:"Ukrainisches Bachneunauge",latin:"Eudontomyzon mariae",group:"pradawne",desc:"Niewielki minóg potokowy, podobny do strumieniowego; różni się uzębieniem przyssawki.",habitat:"Potoki dorzecza Dniestru, Bugu i górnej Wisły.",baits:ke},{id:"aloza",name:"Aloza",nameDe:"Maifisch (Alse)",latin:"Alosa alosa",group:"pradawne",desc:"Duży śledź wędrowny (do ok. 70 cm), srebrny, z ostrym kilem na brzuchu i jedną ciemną plamą za pokrywą skrzelową.",habitat:"Morze; dawniej wędrował do Wisły, Odry i Renu, dziś skrajnie rzadki.",baits:ke},{id:"parposz",name:"Parposz",nameDe:"Finte",latin:"Alosa fallax",group:"pradawne",desc:"Śledź wędrowny podobny do alozy, ale mniejszy, z rzędem kilku ciemnych plam za pokrywą skrzelową.",habitat:"Zalew Wiślany, Zatoka Gdańska i ujścia rzek.",baits:ke},{id:"dorsz",name:"Dorsz",nameDe:"Dorsch (Kabeljau)",latin:"Gadus morhua",group:"morskie",desc:"Trzy płetwy grzbietowe i dwie odbytowe, jeden wąs na podbródku, jasna, łukowato wygięta linia boczna. Grzbiet marmurkowy, zielonkawobrązowy, brzuch jasny.",habitat:"Bałtyk: głębsze wody, kamieniste rafy, wraki i spady dna.",baits:"Połów rekreacyjny dorsza jest zakazany przez cały rok (przepisy polskie i UE) — przypadkowo złowionego wypuść natychmiast."},{id:"stornia",name:"Stornia (flądra)",nameDe:"Flunder",latin:"Platichthys flesus",group:"morskie",desc:"Płastuga — oczy zwykle po prawej stronie ciała (bywają po lewej). Szorstkie guzki kostne u nasady płetwy grzbietowej i odbytowej oraz wzdłuż linii bocznej. Strona oczna brązowooliwkowa.",habitat:"Piaszczyste dno przy brzegu, Zatoka Gdańska i Pucka, zalewy i ujścia rzek; najpospolitsza płastuga polskiego wybrzeża.",baits:"Robaki morskie (pierścienice), rosówki, krewetki — z plaży na grunt albo z łodzi przy dnie."},{id:"gladzica",name:"Gładzica",nameDe:"Scholle",latin:"Pleuronectes platessa",group:"morskie",desc:"Płastuga o gładkiej skórze z jaskrawymi pomarańczowymi lub czerwonymi plamami na stronie ocznej; za oczami rząd 4–7 kostnych guzków.",habitat:"Piaszczyste i muliste dno; w polskiej strefie rzadziej niż stornia, częściej w zachodnim Bałtyku.",baits:"Robaki morskie i rosówki na zestawie gruntowym."},{id:"zimnica",name:"Zimnica",nameDe:"Kliesche",latin:"Limanda limanda",group:"morskie",desc:"Niewielka płastuga z linią boczną wygiętą w wysoki łuk nad płetwą piersiową. Strona oczna piaskowobrązowa, szorstka w dotyku od strony ogona ku głowie.",habitat:"Piaszczyste dno głębszych wód; w polskiej strefie rzadka.",baits:"Robaki morskie — przyłów przy połowie storni."},{id:"skarp",name:"Skarp (turbot)",nameDe:"Steinbutt",latin:"Scophthalmus maximus",group:"morskie",desc:"Płastuga o niemal okrągłym ciele, oczy po lewej stronie. Bez łusek; strona oczna pokryta rozsianymi kostnymi guzkami.",habitat:"Piaszczyste i żwirowe dno; latem podchodzi na płytkie wody przybrzeżne na tarło.",baits:"Małe rybki (np. tobiasz), gumy prowadzone przy dnie, robaki morskie."},{id:"naglad",name:"Nagład",nameDe:"Glattbutt",latin:"Scophthalmus rhombus",group:"morskie",desc:"Podobny do skarpa, ale bardziej owalny, pokryty drobnymi gładkimi łuskami i bez kostnych guzków; pierwsze promienie płetwy grzbietowej rozgałęzione.",habitat:"Piaszczyste dno; w Bałtyku rzadki, głównie w jego zachodniej części.",baits:"Małe rybki i robaki przy dnie — przyłów."},{id:"sledz",name:"Śledź",nameDe:"Hering",latin:"Clupea harengus",group:"morskie",desc:"Srebrzysty, grzbiet niebieskozielony, jedna płetwa grzbietowa pośrodku ciała, zaczynająca się przed płetwami brzusznymi. Brzuch bez ostrego, piłkowanego kilu.",habitat:"Ławice na otwartym morzu; wiosną na tarło wchodzi do zatok, zalewów i portów — wtedy łowi się go z falochronów i nabrzeży.",baits:"Zestaw śledziowy z przyponami z małymi haczykami (w morzu najwyżej 5 przyponów, haczyki o rozwarciu do 6 mm) — kolorowe przywieszki."},{id:"szprot",name:"Szprot",nameDe:"Sprotte",latin:"Sprattus sprattus",group:"morskie",desc:"Mały (zwykle do 15 cm) śledziowaty. Od młodego śledzia różni się ostrym, piłkowanym kilem na brzuchu i płetwą grzbietową zaczynającą się za nasadą płetw brzusznych.",habitat:"Ławice w toni otwartego morza i zatok.",baits:"Nie jest celem wędkarzy — przyłów na zestaw śledziowy."},{id:"belona",name:"Belona",nameDe:"Hornhecht",latin:"Belone belone",group:"morskie",desc:"Bardzo wydłużona i smukła, szczęki wyciągnięte w długi „dziób” pełen drobnych zębów. Grzbiet zielononiebieski, boki srebrne; ości zielone.",habitat:"Pływa tuż pod powierzchnią; wiosną (maj–czerwiec) podchodzi do brzegów i falochronów na tarło.",baits:"Wąskie błystki i wahadłówki, sztuczna przynęta z pętlą z włóczki, pasek śledzia pod spławikiem."},{id:"wegorzyca",name:"Węgorzyca",nameDe:"Aalmutter",latin:"Zoarces viviparus",group:"morskie",desc:"Wydłużona jak węgorz, ale z grubymi wargami i dużymi płetwami piersiowymi; długa płetwa grzbietowa ma tuż przed ogonem wyraźne obniżenie. Żyworodna, ości zielone.",habitat:"Kamieniste dno i porośla przy brzegu, falochrony, porty, Zatoka Pucka.",baits:"Robaki i kawałki ryb przy dnie — przyłów."},{id:"makrela",name:"Makrela",nameDe:"Makrele",latin:"Scomber scombrus",group:"morskie",desc:"Wrzecionowata, grzbiet zielononiebieski z czarnymi falistymi pręgami, brzuch srebrny; za płetwami grzbietową i odbytową rzędy drobnych płetewek.",habitat:"Ryba słonych wód — do polskiej części Bałtyku zapływa rzadko, głównie późnym latem i jesienią.",baits:"Pilkery i przywieszki, małe błystki."},{id:"kur-diabel",name:"Kur diabeł",nameDe:"Seeskorpion",latin:"Myoxocephalus scorpius",group:"morskie",desc:"Duża, kolczasta głowa z szerokim pyskiem, ciało bez łusek, marmurkowe. Kolce na pokrywach skrzelowych; samce mają czerwonawy brzuch.",habitat:"Kamieniste dno, falochrony i porośla przybrzeżne.",baits:"Robaki i rybki przy dnie — częsty przyłów."},{id:"kur-rogacz",name:"Kur rogacz",nameDe:"Vierhörniger Seeskorpion",latin:"Myoxocephalus quadricornis",group:"morskie",desc:"Podobny do kura diabła, ale na głowie ma dwie pary kostnych, rogowatych guzów. Relikt epoki lodowcowej.",habitat:"Chłodne, głębsze wody Bałtyku, m.in. Zatoka Gdańska.",baits:ke},{id:"tasza",name:"Tasza",nameDe:"Seehase",latin:"Cyclopterus lumpus",group:"morskie",desc:"Krępa, niemal kulista, z rzędami kostnych guzków; płetwy brzuszne zrośnięte w przyssawkę, pierwsza płetwa grzbietowa ukryta w garbie skóry.",habitat:"Kamieniste dno i glony; wiosną podchodzi do brzegów na tarło.",baits:"Rzadko bierze na wędkę — przyłów."},{id:"iglicznia",name:"Iglicznia",nameDe:"Grasnadel",latin:"Syngnathus typhle",group:"morskie",desc:"Bardzo cienka, wydłużona, w kostnym pancerzu z pierścieni, z rurkowatym pyskiem; krewniak koników morskich.",habitat:"Łąki trawy morskiej i porośla, zwłaszcza Zatoka Pucka.",baits:ke},{id:"babka-bycza",name:"Babka bycza",nameDe:"Schwarzmundgrundel",latin:"Neogobius melanostomus",group:"obce",desc:"Krępa, duża głowa, płetwy brzuszne zrośnięte w przyssawkę, czarna plama na pierwszej płetwie grzbietowej. Gatunek inwazyjny.",habitat:"Zatoka Gdańska, Zalew Wiślany, Wisła, Odra, a w Bawarii Dunaj; kamienie i opaski brzegowe.",baits:"Robaki, kawałki ryb — bierze wszystko przy dnie."},{id:"babka-lysa",name:"Babka łysa",nameDe:"Nackthalsgrundel",latin:"Babka gymnotrachelus",group:"obce",desc:"Babka z przyssawką z płetw brzusznych, ciemnymi poprzecznymi pręgami i nagim (bez łusek) karkiem. Gatunek inwazyjny.",habitat:"Wisła, Bug, Narew i zbiorniki zaporowe.",baits:"Robaki — przyłów przy dnie."},{id:"babka-szczupla",name:"Babka szczupła",nameDe:"Flussgrundel",latin:"Neogobius fluviatilis",group:"obce",desc:"Smukła, piaskowo ubarwiona babka z przyssawką z płetw brzusznych. Gatunek inwazyjny.",habitat:"Wisła, Bug i ich zbiorniki.",baits:"Robaki — przyłów przy dnie."},{id:"babka-rurkonosa",name:"Babka rurkonosa",nameDe:"Marmorierte Grundel",latin:"Proterorhinus semilunaris",group:"obce",desc:"Mała babka z rurkowatymi przednimi otworami nosowymi wystającymi nad górną wargę. Gatunek inwazyjny.",habitat:"Wisła, Dunaj z dopływami, porośnięte brzegi.",baits:"Przyłów na drobne przynęty."},{id:"sumik-karlowaty",name:"Sumik karłowaty",nameDe:"Brauner Zwergwels",latin:"Ameiurus nebulosus",group:"obce",desc:"Mały sum z Ameryki: osiem wąsów, płetwa tłuszczowa, ostre kolce w płetwach piersiowych i grzbietowej. Gatunek inwazyjny.",habitat:"Stawy, starorzecza, zbiorniki o mulistym dnie.",baits:"Robaki, kawałki ryby, nocą przy dnie."},{id:"sumik-czarny",name:"Sumik czarny",nameDe:"Schwarzer Zwergwels",latin:"Ameiurus melas",group:"obce",desc:"Bardzo podobny do sumika karłowatego, ale ciemniejszy, z ciemnymi błonami płetw i gładkim tylnym brzegiem kolca piersiowego. Gatunek inwazyjny.",habitat:"Stawy i starorzecza, także w Bawarii.",baits:"Robaki, kawałki ryby, nocą przy dnie."},{id:"czebaczek-amurski",name:"Czebaczek amurski",nameDe:"Blaubandbärbling",latin:"Pseudorasbora parva",group:"obce",desc:"Mała (do ok. 10 cm) rybka z górnym pyskiem i ciemną smugą wzdłuż boku. Gatunek inwazyjny, przenosi choroby ryb.",habitat:"Stawy, kanały, rowy i zbiorniki, często przy hodowlach karpi.",baits:"Przyłów przy połowie spławikowym na drobne przynęty."},{id:"trawianka",name:"Trawianka",nameDe:"Amurgrundel",latin:"Perccottus glenii",group:"obce",desc:"Ciemna, krępa, z dużym pyskiem, płetwy brzuszne NIE tworzą przyssawki (w odróżnieniu od babek). Gatunek inwazyjny.",habitat:"Zarośnięte drobne zbiorniki, starorzecza, rowy.",baits:"Przyłów na robaki i białe robak
