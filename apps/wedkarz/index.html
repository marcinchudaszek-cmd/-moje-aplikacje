y wolnym prowadzeniu.","No-action (bez ogona) — subtelne, na pasywne ryby i drop shot.","Gumy pachnące lub solone — ryba dłużej trzyma przynętę w pysku."]},{h:"Główka i prowadzenie",list:["Waga główki: tyle, by guma opadała 2–4 s po każdym podbiciu; na głębszej i szybszej wodzie cięższa.","Klasyka na sandacza: podbicie korbką lub szczytówką, opad na dno (branie najczęściej w opadzie), znów podbicie.","Obserwuj plecionkę — przy opadzie branie widać jako „przyskok” lub zatrzymanie żyłki."]}],fish:["sandacz","okon","szczupak","bolen","sum","dorsz"],related:["spinning","jigi","drop-shot","zylki-plecionki"]},{id:"blystki-obrotowe",cat:"sztuczne",title:"Błystki obrotowe",icon:"🌀",summary:"Paletka wirująca wokół osi daje wibracje i błyski — świetna na okonia, pstrąga, klenia i szczupaka.",sections:[{list:["Rozmiary 0–1 (pstrąg, kleń, okoń), 2–3 (okoń, jaź, szczupak), 4–5 (szczupak).","Prowadź tak, by paletka się kręciła — za wolno przestaje pracować, za szybko wypływa na powierzchnię.","W rzece rzucaj w poprzek lub lekko w dół nurtu i pozwól prądowi „podać” błystkę w miejsce stania ryb.","Obrotówka skręca żyłkę — używaj krętlika lub agrafki z krętlikiem."]}],fish:["okon","pstrag-potokowy","klen","jaz","szczupak","bolen","lipien"],related:["spinning","wahadlowki"]},{id:"wahadlowki",cat:"sztuczne",title:"Błystki wahadłowe",icon:"🥄",summary:"Wygięta blaszka kolebiąca się z boku na bok — daleki rzut, dobra na szczupaka, troć, bolenia i dorsza (pilkery).",sections:[{list:["Lekkie i szerokie — wolne prowadzenie nad roślinnością (szczupak).","Ciężkie i wąskie — daleki rzut, szybka woda, boleń, troć, łosoś.","Prowadzenie z przerwami: opadająca, „trzepocząca” wahadłówka wywołuje ataki.","W morzu ciężkie pilkery to odmiana wahadłówki do pionowego łowienia dorsza."]}],fish:["szczupak","troc","losos","bolen","okon","dorsz"],related:["spinning","pilkery","trolling"]},{id:"cykady",cat:"sztuczne",title:"Cykady",icon:"🔩",summary:"Metalowe blaszki o silnej wibracji — daleki rzut i szybkie prowadzenie, klasyka na bolenia i okonia.",sections:[{list:["Wibrują już przy wolnym podciągnięciu — dobre do łowienia z opadu na sandacza i okonia.","Daleko lecą: świetne na żerujące „kotły” bolenia.","Łatwo zaczepiają o dno — prowadź z wyczuciem, zwłaszcza na kamieniach."]}],fish:["bolen","okon","sandacz","szczupak"],related:["spinning","blystki-obrotowe"]},{id:"przynety-powierzchniowe",cat:"sztuczne",title:"Przynęty powierzchniowe",icon:"💦",summary:"Poppery, stickbaity, „chlapiące” woblery — widowiskowe ataki szczupaka, bolenia, okonia i klenia przy powierzchni.",sections:[{list:["Popper: miseczka na pysku „chlapie” przy szarpnięciu — okoń, szczupak w płytkich zatokach.","Stickbait (walk the dog): prowadzony zygzakiem, rytmicznymi podszarpnięciami.","Najlepiej rano, wieczorem i w pochmurne, ciepłe dni, nad roślinnością.","Zacinaj dopiero, gdy poczujesz ciężar ryby — nie na sam widok ataku."]}],fish:["szczupak","bolen","okon","klen","jaz","sum"],related:["spinning","woblery"]},{id:"jigi",cat:"sztuczne",title:"Jigi, koguty, główki",icon:"🪶",summary:"Obciążona główka z hakiem i gumą, piórkiem lub włosiem — do łowienia przy dnie i z opadu.",sections:[{list:["Kogut (piórka, włosie) na główce — klasyka na sandacza i okonia.","Główka „football” lub stojąca (stand-up) mniej się zaczepia o kamienie.","Hak offsetowy z gumą bez obciążenia (weedless) — przez roślinność na szczupaka.","Im cieńsza plecionka, tym lżejszej główki możesz użyć na tej samej głębokości."]}],fish:["sandacz","okon","szczupak","dorsz"],related:["gumy","spinning"]},{id:"muchy",cat:"sztuczne",title:"Sztuczne muchy",icon:"🪰",summary:"Sucha, mokra, nimfa i streamer — przynęty muszkarskie na pstrągi, lipienie, klenie i jazie.",sections:[{list:["Sucha mucha — imitacja owada na powierzchni; łów, gdy ryby zbierają z powierzchni.","Mokra mucha i nimfa — pod wodą, imitują larwy i topiące się owady; nimfa z obciążeniem przy dnie (np. nimfa czeska, nimfa na długą szczytówkę).","Streamer — imitacja rybki, prowadzony szarpanym ruchem; na większe pstrągi, troć, szczupaka.","Dobór: podnieś kamień z dna i zobacz, jakie larwy żyją w rzece; obserwuj owady nad wodą."]},{h:"Przepisy",p:["W Polsce na wędce muchowej mogą być najwyżej dwie sztuczne muszki imitujące owady (zob. „Przepisy o sprzęcie — Polska”)."]}],fish:["pstrag-potokowy","lipien","klen","jaz","pstrag-teczowy","troc","jelec"],related:["muchowka","owady","przepisy-pl"]},{id:"mormyszki",cat:"sztuczne",title:"Mormyszki i błystki podlodowe",icon:"❄️",summary:"Małe ciężkie haczyki z kulką i pionowe błystki — łowienie spod lodu na okonia, płoć, sieję i szczupaka.",sections:[{list:["Mormyszka z ochotką lub białym robakiem, prowadzona drobnymi drgnięciami — płoć, okoń, leszcz.","Mormyszka „bezrobakowa” (gołe drgania) — aktywne okonie.","Błystka pionowa, balansowa (balanser) — okoń, sandacz, szczupak spod lodu.","Kiwok (czuły sygnalizator na szczytówce) pokazuje delikatne brania."]}],fish:["okon","ploc","leszcz","sieja","sielawa","szczupak","sandacz"],related:["podlodowe","ochotka","bezpieczenstwo-lod"]},{id:"pilkery",cat:"sztuczne",title:"Pilkery i przywieszki morskie",icon:"⚓",summary:"Ciężkie metalowe przynęty do pionowego łowienia dorsza z kutra, często z gumowymi przywieszkami nad pilkerem.",sections:[{list:["Waga 60–250 g — dobierz do głębokości i dryfu łodzi, żeby pilker pracował przy dnie.","Prowadzenie: unieś wędzisko, opuść — branie najczęściej w opadzie.","Przywieszki (twistery, muszki) na bocznych troczkach zwiększają szansę.","Przed wyjazdem sprawdź aktualne unijne i krajowe zasady połowu dorsza — bywa całkowicie zakazany (zakładka Atlas → region Bałtyk)."]}],fish:["dorsz"],related:["morskie-kuter","wahadlowki"]},{id:"zaneta-gotowa",cat:"zaneta",title:"Zanęta gotowa i domowa",icon:"🥣",summary:"Mieszanka, która ściąga ryby w łowisko i utrzymuje je tam — klucz do spławika i feedera.",sections:[{h:"Skład",list:["Baza: bułka tarta, kukurydza mielona, makuchy, pieczywo fluo — to, co wiąże i paruje w wodzie.","Dodatki „smakowe”: biszkopt, prażone konopie, kakao, wanilia (płoć, leszcz), melasa i ostre korzenne zapachy na zimną wodę oszczędnie.","Wkładka: białe robaki, kasterki, pęczak, kukurydza, pocięte robaki — to, co ryba ma znaleźć."]},{h:"Przygotowanie",list:["Zwilżaj stopniowo, przesiej przez sito, odczekaj 10–20 min i dowilż — dobrze nawilżona kula rozpada się na dnie, a nie w powietrzu.","Na rzekę zanęta cięższa i bardziej klejąca (z gliną lub ziemią), na jezioro lżejsza.","Zimą i przy słabym żerowaniu dawkuj mało — przekarmiona ryba nie bierze."]}],fish:["ploc","leszcz","krap","karas","lin","ukleja"],related:["splawik","feeder","glina-ziemia"]},{id:"zaneta-karpiowa",cat:"zaneta",title:"Zanęta karpiowa: spod, kulki, pellet",icon:"🧺",summary:"Zanęcanie pod duże ryby: mieszanki ziaren, kulki i pellet podawane w jedno miejsce.",sections:[{list:["Spod mix: gotowane ziarna (kukurydza, konopie, pszenica, tygrys — zawsze namoczone i ugotowane), pellet, pokruszone kulki, płynny atraktor.","Celność ważniejsza niż ilość: wszystko w jedno miejsce, oznaczone markerem lub odległością na żyłce (tzw. klipsowanie).","Podanie: proca, rakieta zanętowa, łyżka zanętowa (throwing stick) do kulek, łódka zanętowa.","Na krótkich zasiadkach mało i często, na dłuższych — więcej na start."]}],fish:["karp","amur","lin","leszcz","brzana"],related:["karpiowanie","kulki-pellet","pva"]},{id:"atraktory",cat:"zaneta",title:"Atraktory i dipy",icon:"🧪",summary:"Płynne i sypkie dodatki zapachowe — pomagają, gdy ryby są ostrożne lub woda chłodna, ale nie zastąpią dobrego miejsca.",sections:[{list:["Dip: zanurzasz w nim kulkę lub przynętę przed wyrzutem — mocna, krótkotrwała chmura zapachu.","Booster i melasa: do zanęty i ziaren.","Zimą słodkie, owocowe i rybne aromaty działają słabiej niż w lecie — używaj oszczędnie.","Nadmiar zapachu odstrasza — zacznij od małej ilości."]}],fish:["karp","leszcz","lin","karas"],related:["zaneta-karpiowa","zaneta-gotowa"]},{id:"glina-ziemia",cat:"zaneta",title:"Glina i ziemia zanętowa",icon:"🟫",summary:"Obciążają i wiążą zanętę, niosą ochotkę i białe robaki na dno — niezbędne w rzece i zimą.",sections:[{list:["Glina klejąca — kule nie rozpadną się w nurcie i zaniosą wkładkę na dno.","Ziemia (torfowa, czarna) — przyciemnia zanętę i rozprasza robaki; dobra do ochotki.","Proporcje dobierz do wody: w szybkiej rzece nawet połowa gliny, w stawie mało.","Kule z ziemią i ochotką to podstawa łowienia płoci na tyczkę i bata."]}],related:["zaneta-gotowa","ochotka","splawik"]},{id:"pva",cat:"zaneta",title:"Siatki i woreczki PVA",icon:"🫧",summary:"Rozpuszczalne w wodzie woreczki z zanętą zakładane na haczyk — pokarm ląduje dokładnie przy przynęcie.",sections:[{list:["Wypełnienie musi być suche (pellet, pokruszone kulki, suche zanęty) — wilgoć rozpuszcza PVA przed rzutem.","Woreczek z ciężarkiem i haczykiem w środku chroni zestaw przed splątaniem przy rzucie.","Sprawdź, czy PVA rozpuszcza się w zimnej wodzie — niektóre zimą robią to bardzo wolno."]}],fish:["karp","lin","leszcz"],related:["karpiowanie","zaneta-karpiowa"]},{id:"wedziska",cat:"sprzet",title:"Wędziska",icon:"🎣",summary:"Długość, ciężar wyrzutu i akcja — dobierz wędzisko do metody i ryby, a nie „na wszystko”.",sections:[{h:"Rodzaje",list:["Spinningowe 1,8–3 m — ciężar wyrzutu (c.w.) dopasowany do przynęt: UL do 7 g (okoń, pstrąg), L/M 5–30 g (okoń, sandacz, szczupak), H 30–100 g (duży szczupak, sum).","Spławikowe: bat (bez przelotek, 4–7 m), bolonka (z przelotkami, 4–7 m), odległościowe (match, 3,6–4,5 m).","Feederowe 3–4,2 m z wymiennymi szczytówkami-sygnalizatorami.","Karpiowe 3,6 m o krzywej ugięcia 2,75–3,5 lb.","Muchowe — klasy AFTMA 3–5 na pstrąga i lipienia, 6–8 na troć i szczupaka.","Podlodowe — krótkie 30–60 cm, z kiwokiem."]},{h:"Akcja",p:["Szybka (ugina się głównie szczytówka) — precyzja, czucie, mocne zacięcie; paraboliczna (ugina się całe) — amortyzuje zrywy ryby, dobra przy cienkich żyłkach."]},{h:"Przepisy",p:["W Polsce wędzisko musi mieć co najmniej 30 cm, także podlodowe (Dz.U. 2023 poz. 1373, § 2)."]}],related:["kolowrotki","zylki-plecionki","przepisy-pl"]},{id:"kolowrotki",cat:"sprzet",title:"Kołowrotki",icon:"⚙️",summary:"Rozmiar dopasowany do wędziska, płynny hamulec i dobrze nawinięta szpula — od tego zależy zarówno rzut, jak i hol.",sections:[{list:["Rozmiar 1000–2500: spinning ultralekki i lekki, spławik; 3000–4000: spinning na sandacza i szczupaka, feeder; 5000+ z wolnym biegiem: karp, sum, morze.","Hamulec ustaw na ok. 1/3 wytrzymałości żyłki — ryba ma móc ściągać żyłkę przy mocnym zrywie.","Nawijaj żyłkę do 1–2 mm pod rant szpuli: za mało skraca rzut, za dużo powoduje „brody”.","Multiplikator (kołowrotek bębnowy) — do ciężkiego spinningu, trollingu i łowienia z łodzi."]}],related:["wedziska","zylki-plecionki"]},{id:"zylki-plecionki",cat:"sprzet",title:"Żyłka, plecionka, fluorocarbon",icon:"🧵",summary:"Żyłka się rozciąga i wybacza błędy, plecionka daje czucie i siłę przy małej średnicy, fluorocarbon jest najmniej widoczny w wodzie.",sections:[{list:["Żyłka (monofilament): spławik, grunt, karpiowanie; 0,10–0,16 mm na płoć, 0,18–0,25 na leszcza i lina, 0,28–0,35 na karpia.","Plecionka: spinning (sandacz, okoń z jigiem), feeder na dalekie dystanse, sum; brak rozciągliwości = szybkie zacięcie i czucie dna.","Fluorocarbon: przypony i końcówki przy plecionce — mało widoczny, odporny na przetarcia.","Do plecionki zawsze przywiąż odcinek żyłki lub fluorocarbonu (przypon/strzałówka) — sama plecionka jest dobrze widoczna i tnie się na kamieniach.","Wymieniaj żyłkę co sezon; zużytą i ścinki zabieraj ze sobą — w przyrodzie zabija ptaki."]}],related:["przypony","wezly","kolowrotki"]},{id:"przypony",cat:"sprzet",title:"Przypony (w tym stalowe)",icon:"🔗",summary:"Odcinek między linką główną a przynętą — cieńszy przy delikatnych rybach, stalowy lub wolframowy przy szczupaku.",sections:[{list:["Szczupak ma ostre zęby i przecina żyłkę — przy każdej przynęcie, na którą może się trafić, stosuj przypon stalowy, wolframowy, tytanowy lub z grubego fluorocarbonu (0,6 mm+).","Przy spławiku i feederze przypon cieńszy od linki głównej — przy zaczepie zerwie się tylko on.","Długość: spławik 15–40 cm, feeder 40–120 cm (przy ostrożnych rybach dłuższy), karp 15–25 cm.","Krętlik między linką a przyponem chroni przed skręcaniem."]}],fish:["szczupak","sum"],related:["zylki-plecionki","haczyki","woblery"]},{id:"haczyki",cat:"sprzet",title:"Haczyki",icon:"🪝",summary:"Rozmiar dopasowany do przynęty, a nie do ryby, której się spodziewasz; zawsze ostry.",sections:[{list:["Numeracja: im większy numer, tym mniejszy haczyk (nr 20 — ochotka, nr 14 — białe robaki, nr 6 — rosówka, nr 1–2/0 — żywiec i martwa rybka).","Bezzadziorowe lub z dogniecionym zadziorem ułatwiają wypuszczanie ryb — na wielu łowiskach no-kill są wymagane.","Kotwiczki w woblerach i jerkach: kontroluj ostrość i rdzę, wymieniaj stępione.","Sprawdź ostrość na paznokciu — dobry grot „przykleja się”, a nie ślizga."]},{h:"Przepisy",p:["W Polsce na jednej wędce: jeden haczyk z przynętą albo do dwóch haczyków ze sztucznymi muszkami, albo sztuczna przynęta z najwyżej trzema haczykami (szczegóły: „Przepisy o sprzęcie — Polska”). W Bawarii najwyżej 5 haczyków na wędkę."]}],related:["przypony","przepisy-pl","przepisy-by"]},{id:"splawiki-obciazenie",cat:"sprzet",title:"Spławiki, ciężarki, koszyki",icon:"🔴",summary:"Spławik pokazuje branie i niesie przynętę na właściwej głębokości; ciężarki i koszyki trzymają zestaw przy dnie.",sections:[{h:"Spławik",list:["Wyważ (dociąż) go tak, by z wody wystawała tylko antenka — wtedy widać najdelikatniejsze branie.","Gruntuj: ustal głębokość tak, by przynęta była tuż nad dnem lub lekko na nim leżała.","Spławiki przelotowe (waggler) na dalsze rzuty i wiatr, stałe (pod szczytówką) na bliski dystans.","W rzece spławiki o kulistym korpusie stabilniej płyną z nurtem."]},{h:"Ciężarki i koszyki",list:["Ciężarek przelotowy — ryba ciągnie przynętę bez oporu.","Koszyk zanętowy (feeder) — niesie zanętę na haczyk; waga dobrana do odległości i nurtu.","Method feeder — płaski podajnik, wokół którego oblepia się zanętę z przynętą."]}],related:["splawik","feeder","method-feeder"]},{id:"podbierak-mata",cat:"sprzet",title:"Podbierak, mata, szczypce, miarka",icon:"🧰",summary:"Akcesoria, które chronią rybę i ułatwiają ocenę, czy wolno ją zabrać.",sections:[{list:["Podbierak z gumowaną siatką — nie zdziera śluzu i nie plącze kotwic.","Mata karpiowa — duże ryby kładź na mokrej macie, nigdy na piasku czy kamieniach.","Szczypce i wypychacz — szybkie, bezpieczne wyhaczanie, także głęboko połkniętych haczyków (czasem lepiej uciąć przypon).","Miarka lub mata z podziałką — zmierz rybę od początku zamkniętego pyska do końca płetwy ogonowej (w Bawarii łącznie ze złożoną płetwą ogonową) i od razu wiesz, czy jest wymiarowa.","Siatka do przetrzymywania (siatka/kosz) — w Bawarii wolno używać tylko przestronnych siatek z materiału bezwęzłowego, a przetrzymanych w niej ryb nie wolno wypuścić (AVBayFiG § 20)."]}],related:["catch-release","przepisy-by"]},{id:"sygnalizatory",cat:"sprzet",title:"Sygnalizatory brań",icon:"🔔",summary:"Elektroniczne sygnalizatory, swingery, kiwoki i świetliki — żebyś nie przegapił brania.",sections:[{list:["Elektroniczny sygnalizator z swingerem — karpiowanie i nocny grunt; pokazuje kierunek i siłę brania.","Szczytówka feederowa — miękka końcówka wędziska ugina się przy braniu.","Kiwok — podlodowe i delikatne zestawy.","Świetlik (chemiczny lub LED) na spławik lub szczytówkę — łowienie nocą. W Polsce zakazane jest sztuczne światło do lokalizowania i wabienia ryb; w Bawarii — elektryczne źródła światła przy połowie."]}],related:["karpiowanie","feeder","przepisy-pl","przepisy-by"]},{id:"odziez",cat:"sprzet",title:"Odzież i bezpieczeństwo",icon:"🦺",summary:"Ciepło, sucho i bezpiecznie: warstwy ubrań, wodery, kamizelka asekuracyjna, okulary polaryzacyjne.",sections:[{list:["Ubieraj się warstwowo — nad wodą jest chłodniej i bardziej wieje niż w mieście.","Okulary polaryzacyjne: widzisz ryby i dno, chronią oczy przed przynętą przy rzucie.","Wodery i spodniobuty: nigdy nie wchodź głębiej niż do pasa, a w nurt — tylko z kijem do podpierania.","Na łodzi zawsze kamizelka asekuracyjna; zimą na lodzie — kolce asekuracyjne i lina.","Burza: wędzisko z węgla to piorunochron — przy pierwszych grzmotach schodź znad wody."]}],related:["bezpieczenstwo-lod","pogoda"]},{id:"spinning",cat:"metody",title:"Spinning",icon:"🌀",logLabel:"Spinning",summary:"Aktywne łowienie drapieżników na przynęty sztuczne: rzucasz, prowadzisz, zmieniasz miejsca.",sections:[{h:"Na co",p:["Szczupak, okoń, sandacz, boleń, pstrąg, kleń, jaź, sum, troć, a w morzu dorsz."]},{h:"Zestaw",list:["Wędzisko 2–2,7 m o c.w. dopasowanym do przynęt, kołowrotek 2500–4000, plecionka 0,08–0,15 mm z przyponem.","Na szczupaka zawsze przypon stalowy lub wolframowy."]},{h:"Jak łowić",list:["Obłów miejsce wachlarzem rzutów, potem zmień miejsce — drapieżnik albo atakuje szybko, albo go tam nie ma.","Zmieniaj tempo i głębokość prowadzenia, aż znajdziesz to, na co ryby reagują.","Rano i wieczorem przy powierzchni i w płyciznach, w dzień głębiej."]}],fish:["szczupak","okon","sandacz","bolen","pstrag-potokowy","klen","jaz","sum","troc","dorsz"],related:["woblery","gumy","blystki-obrotowe","wahadlowki","drop-shot","przypony"]},{id:"splawik",cat:"metody",title:"Spławik (bat, bolonka, odległościówka)",icon:"🔴",logLabel:"Spławik",summary:"Najbardziej klasyczna metoda: przynęta na ustalonej głębokości, branie widać na spławiku.",sections:[{h:"Odmiany",list:["Bat (bez kołowrotka) — łowienie przy brzegu, szybkie holowanie drobnicy.","Bolonka (z kołowrotkiem) — rzeka, przepuszczanie zestawu z nurtem.","Odległościówka (match/waggler) — dalsze rzuty na jeziorze, spławik przelotowy, żyłka zatopiona pod powierzchnią."]},{h:"Jak łowić",list:["Zgruntuj łowisko i zanęć kilkoma kulami na start, potem dorzucaj mało i często.","Zacinaj na zdecydowane zanurzenie lub położenie się spławika.","Gdy brań brak, zmieniaj głębokość o kilka cm — często decyduje różnica między „na dnie” a „tuż nad dnem”."]}],fish:["ploc","leszcz","krap","karas","lin","wzdrega","ukleja","karp","okon"],related:["biale-robaki","zaneta-gotowa","splawiki-obciazenie"]},{id:"grunt",cat:"metody",title:"Grunt (gruntówka)",icon:"⚓",logLabel:"Grunt / feeder",summary:"Przynęta leży na dnie na ciężarku; dobra na większe ryby, nocą i w rzekach.",sections:[{list:["Zestaw przelotowy z ciężarkiem i krótkim przyponem — ryba bierze bez oporu.","Klasyka nocnego węgorza i suma (rosówka, martwa rybka), leszcza i brzany w rzece.","Sygnalizacja: szczytówka, dzwoneczek, swinger lub elektroniczny sygnalizator.","Wędki ustaw nisko i równolegle do brzegu w nurcie, żeby wiatr i prąd nie dawały fałszywych sygnałów."]}],fish:["wegorz","sum","leszcz","brzana","karp","mietus","certa"],related:["rosowka","martwa-rybka","feeder"]},{id:"feeder",cat:"metody",title:"Feeder (koszyk zanętowy)",icon:"🧺",logLabel:"Grunt / feeder",summary:"Odmiana gruntu z koszykiem zanętowym: zanęta ląduje dokładnie przy haczyku, branie pokazuje miękka szczytówka.",sections:[{list:["Rzucaj zawsze w to samo miejsce — zaklipsuj żyłkę na kołowrotku i wybierz punkt orientacyjny na drugim brzegu.","Na początku kilka szybkich rzutów pełnym koszykiem, żeby zbudować łowisko.","Rzeka: ciężkie koszyki, długie wędziska trzymane wysoko; jezioro: lżejsze koszyki, dłuższe przypony.","Zacinaj na wyraźne ugięcie szczytówki; przy leszczu często pomaga podniesienie wędziska."]}],fish:["leszcz","krap","ploc","brzana","karp","lin","jaz","certa"],related:["zaneta-gotowa","biale-robaki","method-feeder","splawiki-obciazenie"]},{id:"method-feeder",cat:"metody",title:"Method feeder",icon:"🟢",logLabel:"Method feeder",summary:"Przynęta (pellet, kukurydza, kulka) wciśnięta w zanętę oblepioną wokół podajnika — skuteczna na karpie i liny na łowiskach komercyjnych.",sections:[{list:["Krótki przypon (8–12 cm) z przynętą na włosie lub w opasce, wciśniętą w zanętę.","Zanęta method mix lub namoczony drobny pellet — musi trzymać się podajnika w locie i rozpaść na dnie w 1–3 min.","Wymieniaj zestaw co kilka minut na początku, potem rzadziej.","Ryba sama się zacina o ciężar podajnika — wystarczy podnieść wędzisko."]}],fish:["karp","lin","leszcz","karas-srebrzysty","amur"],related:["kulki-pellet","kukurydza","feeder"]},{id:"karpiowanie",cat:"metody",title:"Karpiowanie",icon:"🐋",logLabel:"Karpiowanie",summary:"Zasiadki na duże karpie: włosowe zestawy samozacinające, celne zanęcanie, sygnalizatory i dbałość o rybę.",sections:[{list:["Zestaw z ciężkim ciężarkiem (80–120 g) i przynętą na włosie — karp sam się zacina, ruszając z przynętą.","Klips bezpieczeństwa: przy zerwaniu ciężarek odpada, a ryba nie zostaje uwiązana.","Znajdź miejsce markerem (spławik markerowy, echosonda): krawędzie spadów, twarde dno, okolice roślin.","Ryby kładź na mokrej macie, nawilżaj i wypuszczaj jak najszybciej; zdjęcia rób nisko nad matą."]}],fish:["karp","amur","lin"],related:["kulki-pellet","zaneta-karpiowa","pva","sygnalizatory","catch-release"]},{id:"muchowka",cat:"metody",title:"Muchówka (wędkarstwo muchowe)",icon:"🪰",logLabel:"Muchówka",summary:"Rzucanie ciężkim sznurem i lekką sztuczną muchą — najbardziej „techniczna” metoda na pstrągi, lipienie i klenie.",sections:[{list:["Wędzisko klasy 3–5 z dopasowanym sznurem (pływający do suchej muchy i nimf, tonący do streamerów), przypon stożkowy.","Naucz się rzutu znad głowy na trawie, zanim pojedziesz nad rzekę — oszczędzisz sobie splątanych przyponów.","Prowadzenie suchej muchy: naturalny dryf bez „ciągnięcia” (drag) — poprawiaj sznur (mending).","Nimfa „po czesku” lub na długą szczytówkę — blisko, z małą ilością sznura, przy dnie."]}],fish:["pstrag-potokowy","lipien","klen","jaz","pstrag-teczowy","troc"],related:["muchy","owady","czytanie-wody"]},{id:"podlodowe",cat:"metody",title:"Łowienie spod lodu",icon:"❄️",logLabel:"Podlodowe",summary:"Zimowe łowienie z przerębli: mormyszka, błystka podlodowa, spławik podlodowy — tylko na bezpiecznym lodzie.",sections:[{list:["Wierć kilka przerębli i obławiaj je po kolei — okonie przemieszczają się stadami.","Mormyszka z ochotką: drobne, rytmiczne drgania i przerwy; branie widać na kiwoku.","Najlepiej pierwszy i ostatni lód; w środku zimy ryby są mniej aktywne.","Na lodzie nigdy sam; sprawdzaj grubość pierzchnią lub świdrem."]},{h:"Przepisy",p:["W Polsce przy połowie spod lodu obowiązują osobne limity haczyków (ostrza w kole o średnicy 20 mm) — szczegóły w „Przepisach o sprzęcie — Polska”."]}],fish:["okon","ploc","leszcz","sieja","sielawa","szczupak","sandacz","mietus"],related:["mormyszki","ochotka","bezpieczenstwo-lod","przepisy-pl"]},{id:"trolling",cat:"metody",title:"Trolling",icon:"🚤",logLabel:"Trolling",summary:"Przynęty ciągnięte za płynącą łodzią — na duże drapieżniki na otwartej wodzie jezior i zalewów oraz na troć w morzu.",sections:[{list:["Woblery głęboko schodzące, wahadłówki, duże gumy; głębokość reguluje długość wypuszczonej linki i ster.","Prędkość 2–4 km/h, zakręty po łuku — przynęta zmienia wtedy tempo, co prowokuje ataki.","Echosonda pokazuje stada drobnicy i spady dna, przy których stoją drapieżniki.","Sprawdź regulamin łowiska — trolling bywa zakazany lub ograniczony (np. tylko z łodzi wiosłowej, zakaz silników spalinowych)."]}],fish:["szczupak","sandacz","sum","troc","troc-jeziorowa","losos","okon"],related:["woblery","wahadlowki"]},{id:"zywcowka",cat:"metody",title:"Żywcówka i martwa rybka",icon:"🐟",logLabel:"Żywiec",summary:"Zestaw spławikowy lub gruntowy z rybką przynętową na szczupaka, sandacza i suma.",sections:[{list:["Spławik żywcowy o wyporności dopasowanej do rybki; przynęta 30–50 cm nad dnem lub nad roślinami.","Zawsze przypon stalowy lub wolframowy, kotwiczka lub pojedynczy hak w grzbiecie lub wardze rybki.","Nie zwlekaj z zacięciem — głęboko połknięta przynęta to ranna ryba, której często nie da się już wypuścić.","W Bawarii żywca nie wolno używać — tylko martwą rybkę (AVBayFiG § 15 ust. 1 pkt 3)."]}],fish:["szczupak","sandacz","sum","okon"],related:["zywiec","martwa-rybka","przypony","przepisy-by"]},{id:"drop-shot",cat:"metody",title:"Drop shot",icon:"⬇️",logLabel:"Drop shot",summary:"Ciężarek na końcu linki, gumka kilkadziesiąt cm wyżej — przynęta drga w miejscu nad dnem; zabójcze na okonia i sandacza.",sections:[{list:["Haczyk przywiązany węzłem palomar tak, by grot patrzył w górę; ciężarek 5–20 g na końcu.","Odległość haczyka od ciężarka = wysokość nad dnem, na której stoją ryby (20–60 cm).","Prowadzenie: ciężarek leży, a ty drobnymi ruchami szczytówki poruszasz samą gumką.","Świetne z łodzi nad stadami widocznymi na echosondzie i przy pasywnych rybach zimą."]}],fish:["okon","sandacz","jazgarz"],related:["gumy","wezly","spinning"]},{id:"sumowe",cat:"metody",title:"Łowienie suma (kwok, grunt, spinning)",icon:"🐋",logLabel:"Sumowe",summary:"Sumy to siła: mocny zestaw, nocny grunt, kwokanie z łodzi lub ciężki spinning.",sections:[{list:["Plecionka 0,4–0,6 mm, mocne haki, kołowrotek z dużą szpulą i solidnym hamulcem.","Grunt nocą na pęczek rosówek, martwą rybę, pellet — przy dołach i zwalonych drzewach.","Kwok: drewniany „klocek” uderzany o wodę wywabia suma z głębiny pod przynętę zawieszoną pod łodzią.","Holuj z łodzi, nie siłuj się z brzegu z dużą rybą przy zaczepach."]},{h:"Przepisy",p:["W Polsce sum ma okres ochronny 1 stycznia – 31 maja i wymiar 70 cm. W Bawarii sum nie ma okresu ani wymiaru ochronnego (Atlas → Sum)."]}],fish:["sum"],related:["rosowka","kulki-pellet","grunt"]},{id:"morskie-kuter",cat:"metody",title:"Wędkowanie morskie z kutra",icon:"⛴️",logLabel:"Morskie z kutra",summary:"Pionowe łowienie z łodzi: pilkery i przywieszki na dorsza, zestawy śledziowe, flądry na pierścienice.",sections:[{list:["Wędzisko 2,1–3 m o c.w. 100–250 g, kołowrotek morski, plecionka 0,15–0,25 mm.","Przy dryfie łodzi utrzymuj pilker przy dnie, regularnie podnosząc go i opuszczając.","Na śledzia: zestaw kilku muszek (paternoster) prowadzony w toni.","Sprawdź aktualne zakazy i limity dla dorsza, łososia i troci w Bałtyku (Atlas → region Bałtyk) — zmieniają się co roku."]}],fish:["dorsz","sledz","stornia","gladzica","makrela"],related:["pilkery","przynety-morskie-naturalne","surfcasting"]},{id:"surfcasting",cat:"metody",title:"Surfcasting (z plaży)",icon:"🏖️",logLabel:"Surfcasting",summary:"Dalekie rzuty z brzegu morza ciężkim zestawem gruntowym — flądry, dorsze, węgorzyce, jesienią i zimą.",sections:[{list:["Długie wędziska 3,9–4,5 m, ciężarki z kotwiczkami (pazurami) trzymające zestaw w falach.","Przynęta: pierścienica, krewetka, kawałek śledzia na przyponach z koralikami.","Najlepiej o zmierzchu i nocą, przy umiarkowanej fali, która „kopie” pokarm z dna.","Ustaw wędki na stojaku wysoko, żeby linka nie leżała na falach."]}],fish:["stornia","gladzica","dorsz","wegorzyca","skarp"],related:["przynety-morskie-naturalne","morskie-kuter"]},{id:"wezly",cat:"porady",title:"Węzły wędkarskie",icon:"🪢",summary:"Kilka sprawdzonych węzłów wystarczy na całe życie — najczęstsza przyczyna straty ryby to źle zawiązany węzeł.",sections:[{h:"Najważniejsze",list:["Palomar — haczyk, krętlik, agrafka; bardzo mocny, także dla plecionki i w drop shocie.","Clinch (ulepszony) — haczyk i krętlik na żyłce; 5–7 owinięć.","Pętla chirurgiczna (podwójna ósemka) — pętla na końcu żyłki do zestawów i przyponów.","Grinner/uni-to-uni — łączenie dwóch żyłek lub plecionki z fluorocarbonem.","Węzeł bezwęzłowy (knotless knot) — przynęta na włosie w karpiowaniu."]},{h:"Zasady",list:["Przed zaciśnięciem zawsze zwilż węzeł śliną — tarcie suchej żyłki ją osłabia.","Zaciskaj powoli i mocno, przytnij końcówkę, zostawiając 2–3 mm.","Po zaczepie lub holu sprawdź węzeł i przywiąż na nowo, jeśli żyłka jest szorstka."]}],related:["zylki-plecionki","haczyki","drop-shot"]},{id:"czytanie-wody",cat:"porady",title:"Jak wybrać miejsce (czytanie wody)",icon:"🔍",summary:"Ryby stoją tam, gdzie mają pokarm, schronienie i odpowiedni tlen — naucz się szukać tych miejsc.",sections:[{h:"Jezioro",list:["Krawędzie spadów, granice roślinności, podwodne górki, ujścia strumieni.","Przy wietrze: brzeg, na który wieje, dostaje pokarm i tlen — często tam żeruje drobnica i drapieżniki.","Latem w upał ryby schodzą głębiej, rano i wieczorem wychodzą na płycizny."]},{h:"Rzeka",list:["Za przeszkodami (kamienie, zwalone drzewa), w „warkoczach” (styk szybkiej i wolnej wody), w zakolach i dołkach.","Główki ostróg: boleń i sandacz na granicy nurtu, leszcz i brzana w spokojniejszej wodzie za nimi.","Pstrąg stoi przodem do nurtu tuż za kamieniem, pod podmytym brzegiem."]},{h:"Ogólnie",list:["Ptaki rybożerne, spławiająca się drobnica i „kotły” bolenia zdradzają żerowisko.","Mapa (zakładka Dziennik → Mapa) i analiza dziennika pokażą, gdzie i kiedy łowisz najlepiej."]}],related:["pory-roku","pogoda","muchowka"]},{id:"pory-roku",cat:"porady",title:"Kalendarz wędkarski: co i kiedy",icon:"📅",summary:"Ryby zachowują się inaczej w każdej porze roku — dostosuj metodę i miejsce do miesiąca (i okresów ochronnych).",sections:[{h:"Wiosna",list:["Woda się nagrzewa — najpierw płycizny i zatoki od słońca; płoć i leszcz na spławik.","Wiele drapieżników ma wtedy okresy ochronne (szczupak, sandacz, sum) — sprawdź Atlas dla swojego regionu."]},{h:"Lato",list:["Rano i wieczorem przy powierzchni (kleń, boleń, okoń), w dzień głębiej; nocą węgorz, sum, karp.","Upał i niski poziom tlenu: łów w nurcie, przy dopływach, nocą."]},{h:"Jesień",list:["Najlepszy czas na szczupaka, okonia i sandacza — drapieżniki żerują przed zimą.","Ryby zbierają się w stada i schodzą do głębszych miejsc."]},{h:"Zima",list:["Spod lodu okoń, płoć, sieja; na otwartej wodzie szczupak na martwą rybkę, miętus nocą w rzekach.","Mało zanęty — metabolizm ryb jest powolny."]}],related:["czytanie-wody","podlodowe","pogoda"]},{id:"pogoda",cat:"porady",title:"Pogoda a brania",icon:"🌦️",summary:"Ciśnienie, wiatr, zachmurzenie i światło wpływają na żerowanie — zakładka Prognoza liczy to za ciebie.",sections:[{list:["Stabilne lub powoli spadające ciśnienie zwykle sprzyja; gwałtowne skoki (przejście frontu) często „wyłączają” brania.","Umiarkowany wiatr marszczący wodę ośmiela ryby i natlenia wodę; silny utrudnia łowienie.","Pochmurnie — ryby śmielej żerują w płytszej wodzie; w pełnym słońcu schodzą głębiej lub w cień.","Świt i zmierzch to najczęściej najlepsze pory, zwłaszcza latem.","Twoja analiza dziennika (Dziennik → Analiza) pokaże, jak to wygląda na twoich łowiskach."]}],related:["pory-roku","czytanie-wody","odziez"]},{id:"zacinanie-hol",cat:"porady",title:"Zacięcie i hol",icon:"💪",summary:"Pewne zacięcie, spokojny hol na hamulcu i podbierak pod rybą — tak nie gubi się dużych ryb.",sections:[{list:["Zacinaj zdecydowanie, ale bez szarpania; przy plecionce wystarczy krótki, mocny ruch.","Trzymaj wędzisko wysoko i pod kątem — ugięcie blanku amortyzuje zrywy ryby.","Nie kręć korbką, gdy ryba ściąga żyłkę z hamulca — skręcisz żyłkę.","Prowadź rybę z dala od zaczepów, bocznym ugięciem wędziska zmieniaj jej kierunek.","Podbierak podstawiaj pod rybę, nie „łap” nim ryby od tyłu."]}],related:["kolowrotki","podbierak-mata","catch-release"]},{id:"catch-release",cat:"porady",title:"Jak wypuszczać ryby",icon:"🤲",summary:"Ryba niewymiarowa, chroniona albo po prostu wypuszczana powinna wrócić do wody jak najszybciej i w dobrej kondycji.",sections:[{list:["Mokre ręce, krótko poza wodą — śluz chroni rybę przed infekcjami.","Nie ściskaj ryby i nie trzymaj jej za skrzela; dużą podtrzymuj pod brzuchem poziomo.","Wyhaczaj szczypcami lub wypychaczem; głęboko połknięty haczyk lepiej uciąć niż wyrywać.","Przytrzymaj rybę w wodzie głową pod prąd, aż sama odpłynie.","Polska i Bawaria: rybę niewymiarową lub złowioną w okresie ochronnym trzeba od razu wypuścić; gatunków obcych z listy (np. babki, sumiki) nie wolno wypuszczać — zob. Atlas."]}],related:["podbierak-mata","haczyki","zacinanie-hol"]},{id:"bezpieczenstwo-lod",cat:"porady",title:"Bezpieczeństwo na lodzie",icon:"🧊",summary:"Lód zabija każdej zimy — wchodź tylko na pewny lód i miej przy sobie sprzęt ratunkowy.",sections:[{list:["Za bezpieczny dla jednej osoby przyjmuje się zwykle przezroczysty, twardy lód grubości co najmniej 10 cm; lód biały, porowaty, „spróchniały” lub nad nurtem jest słabszy.","Sprawdzaj lód pierzchnią przed każdym krokiem, omijaj trzciny, ujścia rzek, przepusty i miejsca z przeręblami.","Kolce asekuracyjne na szyi, lina, telefon w wodoszczelnym woreczku; najlepiej łów w towarzystwie.","Gdy lód pęka: połóż się, rozłóż ciężar i czołgaj się w kierunku, z którego przyszedłeś.","Wiosenny lód jest najbardziej zdradliwy — ma grubość, ale traci wytrzymałość."]}],related:["podlodowe","odziez"]},{id:"etyka",cat:"porady",title:"Dobre obyczaje nad wodą",icon:"🌿",summary:"Szacunek dla wody, ryb i innych wędkarzy — dzięki temu łowiska są czyste i pełne ryb.",sections:[{list:["Zabieraj wszystkie śmieci, żyłkę i opakowania (także cudze, jeśli możesz).","Zabieraj tylko tyle ryb, ile zjesz; duże ryby to najlepsze tarlaki — rozważ ich wypuszczenie.","Zachowaj odstęp od innych wędkarzy i nie zarzucaj w ich łowisko.","Nie przenoś ryb, roślin ani wody między zbiornikami — tak rozprzestrzeniają się choroby i gatunki inwazyjne.","Miej przy sobie kartę wędkarską i zezwolenie na łowisko."]}],related:["catch-release","przepisy-pl","przepisy-by"]},{id:"przepisy-pl",cat:"przepisy",title:"Przepisy o sprzęcie — Polska",icon:"🇵🇱",source:lb,summary:"Co mówi rozporządzenie o połowie wędką: liczba haczyków, długość wędziska, sztuczne światło, połów spod lodu, podrywka.",sections:[{h:"Połów wędką (§ 2 ust. 2)",list:["Bez stosowania sztucznego światła do lokalizacji i wabienia ryb.","Wędzisko o długości co najmniej 30 cm z linką zakończoną:","— jednym haczykiem z przynętą, albo","— najwyżej dwoma haczykami, każdy ze sztuczną przynętą imitującą owada lub jego stadia rozwojowe; każdy haczyk najwyżej z dwoma ostrzami mieszczącymi się w kole o średnicy 30 mm, albo","— sztuczną przynętą z najwyżej trzema haczykami, każdy najwyżej z czterema ostrzami mieszczącymi się w kole o średnicy 30 mm."]},{h:"Limit węgorza (§ 2 ust. 3)",p:["Dobowy limit połowu węgorza — do 2 sztuk."]},{h:"Połów spod lodu (§ 2 ust. 4)",list:["Wędzisko co najmniej 30 cm z linką zakończoną:","— jednym haczykiem z przynętą (najwyżej trzy ostrza w kole o średnicy 20 mm), albo","— sztuczną przynętą z najwyżej dwoma haczykami (każdy najwyżej trzy ostrza w kole o średnicy 20 mm)."]},{h:"Podrywka na rybki przynętowe (§ 2 ust. 5)",p:["Siatka najwyżej 1 m × 1 m, oczka nie mniejsze niż 5 mm."]},{h:"Czego rozporządzenie nie reguluje",p:["Liczba wędek, łowienie na żywca, zanęcanie i limity dzienne (poza węgorzem) wynikają z regulaminu łowiska (PZW, RZGW Wód Polskich, właściciel wody). Do połowu potrzebna jest karta wędkarska i zezwolenie uprawnionego do rybactwa w danej wodzie."]}],related:["przepisy-by","haczyki","podlodowe"]},{id:"przepisy-by",cat:"przepisy",title:"Przepisy o sprzęcie — Bawaria",icon:"🇩🇪",source:cb,summary:"AVBayFiG: najwyżej dwie wędki, do 5 haczyków na wędce, zakaz żywca i szarpaka, zasady dla siatek do przetrzymywania ryb.",sections:[{h:"Wędka (§ 16)",list:["Wędka może mieć najwyżej pięć miejsc zacięcia (haczyk pojedynczy, podwójny lub kotwiczka), każde z przynętą naturalną lub sztuczną.","Wędka musi być stale pod nadzorem i nie wolno jej używać jako szarpaka (Reißangel).","Rozstawione sznury gruntowe i zawieszane trzeba podnosić co najmniej codziennie."]},{h:"Zakazy (§ 15 ust. 1)",list:["Połów przy użyciu elektrycznych źródeł światła, elektrycznych przynęt, szarpaków, wędek dryfujących swobodnie, harpunów, ości, dronów i innych wymienionych narzędzi.","Łowienie na żywą rybkę przynętową (pkt 3).","Łowienie więcej niż dwiema wędkami jednocześnie; przy dwóch wędkach łącznie najwyżej sześć miejsc zacięcia (pkt 6)."]},{h:"Przetrzymywanie ryb (§ 20)",list:["Przetrzymywanie ryb w wodzie, w której je złowiono, ma trwać jak najkrócej.","Siatki (Setzkescher) tylko odpowiednio przestronne i z materiału bezwęzłowego.","Ryb przetrzymywanych w siatce nie wolno wypuścić z powrotem do łowiska."]},{h:"Martwa rybka (§ 21 ust. 2)",p:["Zakaz wrzucania martwych ryb do wody nie dotyczy martwych rybek przynętowych używanych zgodnie z dobrą praktyką."]},{h:"Pamiętaj",p:["Okręgi i powiaty mogą wprowadzać dodatkowe ograniczenia (§ 15 ust. 2–3), a szczegóły łowiska (limity, metody, zanęcanie) określa zezwolenie (Erlaubnisschein). Tekst AVBayFiG w brzmieniu od 01.06.2025."]}],related:["przepisy-pl","zywiec","podbierak-mata"]},...sb],fh=Object.fromEntries(_s.map(c=>[c.id,c])),ub=[...new Set(_s.filter(c=>c.logLabel).map(c=>c.logLabel)),"Inna"],db=["Rosówka","Czerwony robak","Białe robaki","Kasterki","Ochotka","Kukurydza","Pęczak","Konopie","Ciasto","Chleb","Kulka proteinowa","Pellet","Żywiec","Martwa rybka","Filet rybny","Konik polny","Pierścienica","Wobler","Guma (ripper)","Twister","Błystka obrotowa","Wahadłówka","Cykada","Popper","Kogut","Sucha mucha","Nimfa","Streamer","Mormyszka","Balanser","Pilker"],Cz={metody:"Metody",przynety:"Przynęty i zanęty",sprzet:"Sprzęt",zestawy:"Zestawy",techniki:"Techniki i porady"};function hb(c){switch(c.cat){case"metody":return"metody";case"naturalne":case"sztuczne":case"zaneta":return"przynety";case"sprzet":return"sprzet";case"zestawy":return"zestawy";case"techniki":case"porady":return"techniki";default:return}}function mb(c){const m=Ac[c],p=m?[...m.methods,...m.baits,...m.gear,...m.rigs??[],...m.techniques??[]]:[],h=new Set,z=[];for(const w of[...p.map(g=>fh[g]),..._s.filter(g=>g.fish?.includes(c))])w&&!h.has(w.id)&&(h.add(w.id),z.push(w));return Object.keys(Cz).map(w=>({group:w,entries:z.filter(g=>hb(g)===w)})).filter(w=>w.entries.length>0)}function Tz(c){const m=new Set(fh[c]?.fish??[]);for(const[p,h]of Object.entries(Ac))[...h.methods,...h.baits,...h.gear,...h.rigs??[],...h.techniques??[]].includes(c)&&m.add(p);return[...m]}const pb="https://wedkarz-ai.atlas-grzybow.workers.dev",Nz="MDq-u8u1hEOKqRoLt_4i9s-zX0xfitV4",yh=()=>!!Nz;async function Az(c,m){if(!yh())throw new Error("Rozpoznawanie nie jest skonfigurowane w tej wersji aplikacji.");const
