y. Gęste czarne kropki także na płetwie ogonowej, wzdłuż boku różowa „tęczowa” smuga.",habitat:"Łowiska specjalne i komercyjne, rzadziej uciekinierzy z hodowli w rzekach.",baits:"Pasty pstrągowe, robaki, muchy, małe błystki, spinner."},{id:"pstrag-zrodlany",name:"Pstrąg źródlany",nameDe:"Bachsaibling",latin:"Salvelinus fontinalis",group:"lososiowate",desc:"Gatunek z Ameryki Północnej (golec). Ciemny grzbiet z jasnym, robaczkowatym marmurkiem, czerwone plamki z niebieską obwódką, biało-czarne przednie krawędzie dolnych płetw.",habitat:"Zimne potoki górskie i źródliskowe, także zakwaszone; wsiedlany.",baits:"Muchy, małe błystki obrotowe, robaki."},{id:"palia",name:"Palia jeziorowa",nameDe:"Seesaibling",latin:"Salvelinus umbla",group:"lososiowate",desc:"Golec jezior alpejskich: smukły, oliwkowy grzbiet, jasne plamki, w szacie godowej pomarańczowo-czerwony brzuch i płetwy z białą krawędzią.",habitat:"Głębokie, zimne jeziora alpejskie i podalpejskie (Bawaria); w Polsce nie występuje naturalnie.",baits:"Głębokie trollingowanie, małe błystki, sztuczne nimfy, mormyszki spod lodu."},{id:"lipien",name:"Lipień",nameDe:"Äsche",latin:"Thymallus thymallus",group:"lososiowate",desc:"Bardzo wysoka, „chorągiewkowa” płetwa grzbietowa z fioletowym połyskiem, mały pysk, płetwa tłuszczowa, łuski w podłużnych rzędach.",habitat:"Szybko płynące, czyste rzeki podgórskie i wyżynne z kamienistym lub żwirowym dnem.",baits:"Głównie muszkarstwo: nimfy, suche muchy, mokre muchy."},{id:"troc",name:"Troć wędrowna",nameDe:"Meerforelle",latin:"Salmo trutta m. trutta",group:"lososiowate",desc:"Srebrzysta z rzadkimi czarnymi plamkami w kształcie „x”, płetwa tłuszczowa. Wędruje z morza do rzek na tarło.",habitat:"Rzeki pomorskie uchodzące do Bałtyku, dolna Wisła i Odra z dopływami.",baits:"Woblery, błystki wahadłowe i obrotowe, streamery."},{id:"troc-jeziorowa",name:"Troć jeziorowa",nameDe:"Seeforelle",latin:"Salmo trutta m. lacustris",group:"lososiowate",desc:"Jeziorowa forma troci: srebrzysta, duża, z czarnymi plamkami. W Polsce rzadka (głównie Wdzydze), w Bawarii w jeziorach alpejskich.",habitat:"Głębokie, chłodne jeziora o wysokiej przejrzystości.",baits:"Trolling: woblery i błystki wahadłowe."},{id:"losos",name:"Łosoś atlantycki",nameDe:"Atlantischer Lachs",latin:"Salmo salar",group:"lososiowate",desc:"Smukły, srebrny, nieliczne plamki głównie powyżej linii bocznej, cienka nasada ogona, płetwa ogonowa lekko wcięta.",habitat:"Rzeki uchodzące do Bałtyku, do których jest restytuowany (m.in. Drawa, Wieprza, Słupia).",baits:"Woblery, błystki wahadłowe, muchy łososiowe."},{id:"glowacica",name:"Głowacica",nameDe:"Huchen",latin:"Hucho hucho",group:"lososiowate",desc:"Duża, wałkowata łososiowata o szerokiej głowie, miedzianym grzbiecie i drobnych czarnych kropkach.",habitat:"Górskie i podgórskie rzeki; w Polsce głównie Dunajec, Poprad i Czarna Orawa, w Bawarii dorzecze Dunaju (Isar, Inn, Ilz).",baits:"Duże woblery, gumy, wahadłówki, warkocze."},{id:"sieja",name:"Sieja",nameDe:"Renke (Felchen)",latin:"Coregonus maraena",group:"lososiowate",desc:"Srebrzysta, z płetwą tłuszczową i małym, dolnym pyskiem. Łuski duże, łatwo odpadające. W Bawarii pod nazwą Renke/Felchen łowi się kilka form siei.",habitat:"Głębokie, czyste i chłodne jeziora.",baits:"Ochotka, małe muszki i nimfy (zestawy „Hegene”), mormyszki."},{id:"sielawa",name:"Sielawa",nameDe:"Kleine Maräne",latin:"Coregonus albula",group:"lososiowate",desc:"Mała, śledziowata łososiowata z płetwą tłuszczową i wysuniętą dolną szczęką.",habitat:"Głębokie jeziora o chłodnej, natlenionej wodzie (Pojezierze Mazurskie, Pomorskie).",baits:"Ochotka, mormyszki, sztuczne muszki (zwłaszcza spod lodu)."},{id:"stynka",name:"Stynka",nameDe:"Stint",latin:"Osmerus eperlanus",group:"lososiowate",desc:"Mała (zwykle do 20 cm), półprzezroczysta, srebrzysta ryba z płetwą tłuszczową i dużym pyskiem z zębami. Świeża pachnie ogórkiem.",habitat:"Zalewy przymorskie, ujścia rzek i głębokie jeziora.",baits:"Małe błystki i muszki, mormyszki spod lodu; przynęta na drapieżniki."},{id:"karp",name:"Karp",nameDe:"Karpfen",latin:"Cyprinus carpio",group:"karpiowate",desc:"Wysokie ciało, cztery wąsy przy pysku (dwa dłuższe), długa płetwa grzbietowa z ząbkowanym promieniem. Odmiany: pełnołuski, lustrzeń, golec.",habitat:"Stawy, zbiorniki, jeziora i wolne rzeki o mulistym dnie; łowiska komercyjne.",baits:"Kulki proteinowe, pellet, kukurydza, ziemniak, ciasto, robaki."},{id:"amur",name:"Amur biały",nameDe:"Graskarpfen",latin:"Ctenopharyngodon idella",group:"karpiowate",desc:"Gatunek z Azji, wsiedlany. Wałkowaty, duże ciemno obrzeżone łuski, szeroka głowa, brak wąsów. Roślinożerny.",habitat:"Zbiorniki z roślinnością, stawy, łowiska komercyjne, ciepłe kanały.",baits:"Kukurydza, trzcina, koniczyna, pellet, kulki."},{id:"tolpyga",name:"Tołpyga biała",nameDe:"Silberkarpfen",latin:"Hypophthalmichthys molitrix",group:"karpiowate",desc:"Gatunek z Azji, wsiedlany. Srebrna, bardzo drobnołuska, oczy osadzone nisko pod linią pyska, wysoki ostry kil na brzuchu. Filtruje plankton, potrafi wyskakiwać z wody.",habitat:"Zbiorniki zaporowe, duże stawy i łowiska komercyjne.",baits:"Trudna do złowienia na wędkę — gąbki i pływające zanęty planktonowe."},{id:"lin",name:"Lin",nameDe:"Schleie",latin:"Tinca tinca",group:"karpiowate",desc:"Krępy, oliwkowo-złoty, bardzo drobne łuski i gruby śluz, małe czerwone oczy, dwa krótkie wąsy w kącikach pyska.",habitat:"Zarośnięte jeziora, stawy i starorzecza z mulistym dnem.",baits:"Czerwone robaki, białe robaki, kukurydza, pęczak, ochotka."},{id:"karas",name:"Karaś pospolity",nameDe:"Karausche",latin:"Carassius carassius",group:"karpiowate",desc:"Wysoki, złotawo-brązowy, bez wąsów, wypukła (zaokrąglona) krawędź płetwy grzbietowej. Coraz rzadszy rodzimy gatunek.",habitat:"Małe, zarośnięte, często przyduchowe stawy i torfianki.",baits:"Robaki, ciasto, chleb, pęczak."},{id:"karas-srebrzysty",name:"Karaś srebrzysty",nameDe:"Giebel",latin:"Carassius gibelio",group:"karpiowate",desc:"Srebrzysty, bez wąsów, wklęsła krawędź płetwy grzbietowej, czarna otrzewna. Pospolity gatunek obcego pochodzenia.",habitat:"Niemal wszystkie wody stojące i wolno płynące.",baits:"Robaki, kukurydza, pęczak, ciasto."},{id:"leszcz",name:"Leszcz",nameDe:"Brachse (Blei)",latin:"Abramis brama",group:"karpiowate",desc:"Bardzo wysokie, bocznie spłaszczone ciało, wysuwalny pysk, długa płetwa odbytowa. Młode srebrne, duże brązowo-złote.",habitat:"Jeziora i duże rzeki o miękkim dnie; żeruje stadnie przy dnie.",baits:"Białe robaki, czerwone robaki, kukurydza, pęczak, ochotka — metoda gruntowa i feeder."},{id:"krap",name:"Krąp",nameDe:"Güster",latin:"Blicca bjoerkna",group:"karpiowate",desc:"Podobny do młodego leszcza, ale z czerwonawymi nasadami płetw piersiowych i brzusznych, większym okiem i krótszą płetwą odbytową.",habitat:"Jeziora, zbiorniki i wolne rzeki.",baits:"Białe robaki, kukurydza, pęczak."},{id:"rozpior",name:"Rozpiór",nameDe:"Zope",latin:"Ballerus ballerus",group:"karpiowate",desc:"Podobny do leszcza, ale smuklejszy, z górnym pyskiem i bardzo długą płetwą odbytową.",habitat:"Duże rzeki nizinne, zalewy i przepływowe jeziora.",baits:"Białe robaki, ochotka."},{id:"sapa",name:"Sapa",nameDe:"Zobel",latin:"Ballerus sapa",group:"karpiowate",desc:"Leszczowata ryba dużych rzek: wysoka, z półdolnym, tępym pyskiem, dużym okiem i bardzo długą płetwą odbytową; dolny płat ogona dłuższy od górnego.",habitat:"Duże rzeki o wyraźnym nurcie (w Polsce rzadka, głównie Wisła; w Bawarii Dunaj).",baits:"Białe robaki, ochotka — grunt na nurcie."},{id:"ploc",name:"Płoć",nameDe:"Rotauge",latin:"Rutilus rutilus",group:"karpiowate",desc:"Srebrzysta, czerwone tęczówki, płetwa grzbietowa zaczyna się nad nasadą płetw brzusznych. Najpospolitsza ryba spławikowa.",habitat:"Praktycznie wszystkie wody.",baits:"Białe robaki, pęczak, ciasto, konopie, ochotka."},{id:"wzdrega",name:"Wzdręga",nameDe:"Rotfeder",latin:"Scardinius erythrophthalmus",group:"karpiowate",desc:"Podobna do płoci, ale z jaskrawoczerwonymi płetwami, złotawym okiem i pyskiem skierowanym ku górze; płetwa grzbietowa wyraźnie za nasadą brzusznych.",habitat:"Zarośnięte jeziora i starorzecza, przy powierzchni.",baits:"Chleb, białe robaki, owady przy powierzchni."},{id:"klen",name:"Kleń",nameDe:"Döbel (Aitel)",latin:"Squalius cephalus",group:"karpiowate",desc:"Wałkowaty, szeroka „tępa” głowa i duży pysk, łuski z ciemnym obrzeżeniem tworzące siateczkę, wypukła płetwa odbytowa.",habitat:"Rzeki o umiarkowanym i szybkim nurcie, pod nawisami drzew.",baits:"Owady, chleb, wiśnie, małe woblery, muchy."},{id:"jaz",name:"Jaź",nameDe:"Aland (Nerfling)",latin:"Leuciscus idus",group:"karpiowate",desc:"Krępszy od klenia, mniejszy pysk, prosta (lekko wklęsła) płetwa odbytowa, złotawe łuski i czerwonawe płetwy.",habitat:"Większe rzeki nizinne i przepływowe jeziora.",baits:"Robaki, kukurydza, owady, małe błystki i woblery."},{id:"jelec",name:"Jelec",nameDe:"Hasel",latin:"Leuciscus leuciscus",group:"karpiowate",desc:"Smukły, srebrzysty, mała głowa, wklęsła krawędź płetwy odbytowej — tym różni się od młodego klenia.",habitat:"Czyste rzeki z wyraźnym nurtem.",baits:"Białe robaki, owady, sztuczne muszki."},{id:"ukleja",name:"Ukleja",nameDe:"Laube (Ukelei)",latin:"Alburnus alburnus",group:"karpiowate",desc:"Mała, smukła i bardzo srebrzysta, pysk skierowany ku górze, łuski łatwo odpadają. Pływa stadami przy powierzchni.",habitat:"Jeziora i rzeki, warstwa przypowierzchniowa.",baits:"Białe robaki, ciasto, ochotka; świetna przynęta na drapieżniki."},{id:"brzana",name:"Brzana",nameDe:"Barbe",latin:"Barbus barbus",group:"karpiowate",desc:"Wydłużona, płaski brzuch, dolny mięsisty pysk z czterema wąsami. Ryba szybkiego nurtu.",habitat:"Rzeki o szybkim nurcie i żwirowo-kamienistym dnie.",baits:"Robaki, ser, pellet, białe robaki — gruntówka i feeder na nurcie."},{id:"brzanka",name:"Brzanka",nameDe:"Karpatenbarbe",latin:"Barbus carpathicus",group:"karpiowate",desc:"Mniejsza krewna brzany (do ok. 25 cm), z wyraźnymi ciemnymi cętkami na grzbiecie, bokach i płetwach, cztery wąsy.",habitat:"Potoki i małe rzeki karpackie (Wisła górna, San, Dunajec z dopływami).",baits:xt},{id:"swinka",name:"Świnka",nameDe:"Nase",latin:"Chondrostoma nasus",group:"karpiowate",desc:"Charakterystyczny dolny, poprzeczny pysk z twardą, ostrą wargą do zeskrobywania glonów; czarna otrzewna.",habitat:"Rzeki podgórskie i wyżynne z kamienistym dnem.",baits:"Robaki, białe robaki, nimfy."},{id:"certa",name:"Certa",nameDe:"Zährte (Seerüssling)",latin:"Vimba vimba",group:"karpiowate",desc:"Dolny pysk z mięsistym „noskiem”, ciemny grzbiet; wędruje z Bałtyku w górę rzek.",habitat:"Duże rzeki i ich ujścia, zalewy.",baits:"Robaki, białe robaki, ochotka — grunt."},{id:"ciosa",name:"Ciosa",nameDe:"Ziege (Sichling)",latin:"Pelecus cultratus",group:"karpiowate",desc:"Bocznie spłaszczona jak nóż, z prostym grzbietem i łukowato wygiętym brzuchem z ostrym kilem, pysk skierowany stromo ku górze, długie płetwy piersiowe.",habitat:"Zalew Wiślany i ujścia rzek; w Bawarii Dunaj.",baits:"Małe błystki, muszki, białe robaki — przy powierzchni."},{id:"kielb",name:"Kiełb",nameDe:"Gründling",latin:"Gobio gobio",group:"karpiowate",desc:"Mały (do ok. 15 cm), wrzecionowaty, płaski brzuch, dwa wąsy w kącikach dolnego pyska, rząd ciemnych plam wzdłuż boku.",habitat:"Rzeki i jeziora z piaszczystym lub żwirowym dnem.",baits:"Czerwone robaki, białe robaki — przy samym dnie; dobra przynęta na drapieżniki."},{id:"kielb-bialopletwy",name:"Kiełb białopłetwy",nameDe:"Weißflossiger Gründling",latin:"Romanogobio albipinnatus",group:"karpiowate",desc:"Podobny do kiełbia, ale z dłuższymi wąsami i niemal bezbarwnymi, nieplamkowanymi płetwami grzbietową i ogonową.",habitat:"Większe nizinne rzeki o piaszczystym dnie (Wisła, Odra, Bug).",baits:xt},{id:"strzebla-potokowa",name:"Strzebla potokowa",nameDe:"Elritze",latin:"Phoxinus phoxinus",group:"karpiowate",desc:"Mała (do ok. 10 cm), drobnołuska, z ciemnymi plamami lub pręgami na bokach; samce w szacie godowej z czerwonym brzuchem.",habitat:"Zimne, czyste potoki górskie i podgórskie, przejrzyste jeziora.",baits:"Przyłów przy połowie pstrągów na drobne przynęty."},{id:"strzebla-blotna",name:"Strzebla błotna",nameDe:"Sumpfelritze",latin:"Eupallasella percnurus",group:"karpiowate",desc:"Mała, krępa, złotawo-oliwkowa z drobnymi ciemnymi plamkami. Jedna z najrzadszych ryb Polski.",habitat:"Małe, płytkie, zarastające zbiorniki i torfianki.",baits:xt},{id:"slonecznica",name:"Słonecznica",nameDe:"Moderlieschen",latin:"Leucaspius delineatus",group:"karpiowate",desc:"Drobna (do ok. 8 cm), srebrzysta z niebieskawym paskiem wzdłuż boku, niepełna linia boczna, górny pysk.",habitat:"Małe, zarośnięte stawy, rowy i starorzecza.",baits:"Przyłów na bardzo małe przynęty."},{id:"rozanka",name:"Różanka",nameDe:"Bitterling",latin:"Rhodeus amarus",group:"karpiowate",desc:"Mała (do ok. 9 cm), wysoka, z turkusowym paskiem na tylnej części boku; samce w szacie godowej różowo-fioletowe. Składa ikrę do małży.",habitat:"Wolno płynące i stojące wody z małżami skójkowatymi.",baits:xt},{id:"piekielnica",name:"Piekielnica",nameDe:"Schneider",latin:"Alburnoides bipunctatus",group:"karpiowate",desc:"Mała, podobna do uklei, ale z linią boczną obrzeżoną podwójnym rzędem ciemnych kropek.",habitat:"Czyste, szybko płynące rzeki podgórskie i wyżynne.",baits:xt},{id:"sliz",name:"Śliz",nameDe:"Bachschmerle",latin:"Barbatula barbatula",group:"drobne",desc:"Mała (do ok. 15 cm), wałkowata, sześć wąsików przy dolnym pysku, marmurkowa brązowa szata, brak kolców pod okiem.",habitat:"Czyste potoki i rzeki z kamienistym dnem, pod kamieniami.",baits:xt},{id:"koza",name:"Koza pospolita",nameDe:"Steinbeißer",latin:"Cobitis taenia",group:"drobne",desc:"Mała, bocznie spłaszczona, z rzędami ciemnych plam na jasnym tle, sześć wąsików i rozwidlony kolec pod okiem.",habitat:"Piaszczyste dno rzek i jezior, zagrzebana w piasku.",baits:xt},{id:"koza-dunajska",name:"Koza dunajska",nameDe:"Donau-Steinbeißer",latin:"Cobitis elongatoides",group:"drobne",desc:"Bardzo podobna do kozy pospolitej; rozróżnia je badanie genetyczne lub liczenie plam. Kolec pod okiem.",habitat:"Dorzecze Dunaju i południowa Polska (dopływy górnej Wisły, Odry).",baits:xt},{id:"koza-zlotawa",name:"Koza złotawa",nameDe:"Goldsteinbeißer",latin:"Sabanejewia aurata",group:"drobne",desc:"Mała koza o złotawym tle z rzędem dużych ciemnych plam wzdłuż boku; kolec pod okiem.",habitat:"Czyste rzeki podgórskie ze żwirowym dnem (w Polsce bardzo rzadka).",baits:xt},{id:"piskorz",name:"Piskorz",nameDe:"Schlammpeitzger",latin:"Misgurnus fossilis",group:"drobne",desc:"Wydłużony, węgorzowaty (do ok. 30 cm), z podłużnymi ciemnymi pasami i dziesięcioma wąsikami. Potrafi oddychać jelitem i „piszczy” wyjęty z wody.",habitat:"Muliste starorzecza, rowy i stawy, także przyduchowe.",baits:xt},{id:"glowacz-bialopletwy",name:"Głowacz białopłetwy",nameDe:"Koppe (Groppe)",latin:"Cottus gobio",group:"drobne",desc:"Mały (do ok. 15 cm), z dużą spłaszczoną głową i szerokim pyskiem, bez łusek, marmurkowy; płetwy brzuszne jasne, bez wyraźnych pręg.",habitat:"Zimne, czyste potoki i rzeki z kamieniami, pod którymi się kryje.",baits:xt},{id:"glowacz-pregopletwy",name:"Głowacz pręgopłetwy",nameDe:"Buntflossenkoppe",latin:"Cottus poecilopus",group:"drobne",desc:"Bardzo podobny do głowacza białopłetwego, ale z wyraźnymi ciemnymi pręgami na długich płetwach brzusznych.",habitat:"Potoki karpackie i sudeckie, zimne jeziora pomorskie.",baits:xt},{id:"ciernik",name:"Ciernik",nameDe:"Dreistachliger Stichling",latin:"Gasterosteus aculeatus",group:"drobne",desc:"Mały (do ok. 8 cm), z trzema wolnymi kolcami przed płetwą grzbietową i kostnymi płytkami na bokach; samiec w okresie godów z czerwonym gardłem.",habitat:"Rowy, stawy, przybrzeżne wody Bałtyku i rzeki nizinne.",baits:"Nie jest celem wędkarzy — przyłów na drobne przynęty."},{id:"cierniczek",name:"Cierniczek",nameDe:"Neunstachliger Stichling",latin:"Pungitius pungitius",group:"drobne",desc:"Drobny (do ok. 6 cm), z 7–12 małymi kolcami przed płetwą grzbietową; samiec w godach ciemny.",habitat:"Zarośnięte rowy, stawy i torfianki.",baits:"Nie jest celem wędkarzy — przyłów na drobne przynęty."},{id:"jesiotr",name:"Jesiotr ostronosy",nameDe:"Atlantischer Stör (amerikanisch)",latin:"Acipenser oxyrinchus",group:"pradawne",desc:"Pancerz z rzędów kostnych tarczek, wydłużony ryj z wąsami, asymetryczna płetwa ogonowa. Gatunek restytuowany w Wiśle i Odrze.",habitat:"Wisła, Odra i ich ujścia.",baits:"Połów zabroniony przez cały rok — każdy okaz natychmiast wypuść."},{id:"jesiotr-zachodni",name:"Jesiotr zachodni",nameDe:"Atlantischer Stör",latin:"Acipenser sturio",group:"pradawne",desc:"Bardzo podobny do jesiotra ostronosego; dawniej występował w rzekach Niemiec i Polski, dziś skrajnie rzadki i restytuowany.",habitat:"Duże rzeki uchodzące do Morza Północnego i Bałtyku.",baits:"Ochrona całoroczna — każdy okaz natychmiast wypuść."},{id:"sterlet",name:"Sterlet",nameDe:"Sterlet",latin:"Acipenser ruthenus",group:"pradawne",desc:"Mały jesiotr (zwykle do 1 m) z długim, wąskim ryjem i frędzlowatymi wąsami; tarczki grzbietowe ostre.",habitat:"Dunaj z dopływami; w Polsce głównie uciekinierzy z hodowli.",baits:"W Bawarii chroniony przez cały rok — wypuść."},{id:"minog-strumieniowy",name:"Minóg strumieniowy",nameDe:"Bachneunauge",latin:"Lampetra planeri",group:"pradawne",desc:"Bezszczękowiec (nie ryba w ścisłym sensie): węgorzowaty, do ok. 20 cm, z okrągłą przyssawką zamiast pyska i siedmioma otworami skrzelowymi.",habitat:"Czyste potoki; larwy żyją latami zagrzebane w mule.",baits:xt},{id:"minog-rzeczny",name:"Minóg rzeczny",nameDe:"Flussneunauge",latin:"Lampetra fluviatilis",group:"pradawne",desc:"Wędrowny minóg do ok. 50 cm, srebrzysto-szary, z przyssawką i siedmioma otworami skrzelowymi.",habitat:"Bałtyk i rzeki, do których wędruje na tarło.",baits:xt},{id:"minog-morski",name:"Minóg morski",nameDe:"Meerneunauge",latin:"Petromyzon marinus",group:"pradawne",desc:"Największy minóg (do ok. 1 m), marmurkowy, z dużą przyssawką pełną zębów.",habitat:"Morze; do rzek wchodzi na tarło (w Polsce bardzo rzadki).",baits:xt},{id:"minog-ukrainski",name:"Minóg ukraiński",nameDe:"Ukrainisches Bachneunauge",latin:"Eudontomyzon mariae",group:"pradawne",desc:"Niewielki minóg potokowy, podobny do strumieniowego; różni się uzębieniem przyssawki.",habitat:"Potoki dorzecza Dniestru, Bugu i górnej Wisły.",baits:xt},{id:"aloza",name:"Aloza",nameDe:"Maifisch (Alse)",latin:"Alosa alosa",group:"pradawne",desc:"Duży śledź wędrowny (do ok. 70 cm), srebrny, z ostrym kilem na brzuchu i jedną ciemną plamą za pokrywą skrzelową.",habitat:"Morze; dawniej wędrował do Wisły, Odry i Renu, dziś skrajnie rzadki.",baits:xt},{id:"parposz",name:"Parposz",nameDe:"Finte",latin:"Alosa fallax",group:"pradawne",desc:"Śledź wędrowny podobny do alozy, ale mniejszy, z rzędem kilku ciemnych plam za pokrywą skrzelową.",habitat:"Zalew Wiślany, Zatoka Gdańska i ujścia rzek.",baits:xt},{id:"dorsz",name:"Dorsz",nameDe:"Dorsch (Kabeljau)",latin:"Gadus morhua",group:"morskie",desc:"Trzy płetwy grzbietowe i dwie odbytowe, jeden wąs na podbródku, jasna, łukowato wygięta linia boczna. Grzbiet marmurkowy, zielonkawobrązowy, brzuch jasny.",habitat:"Bałtyk: głębsze wody, kamieniste rafy, wraki i spady dna.",baits:"Połów rekreacyjny dorsza jest zakazany przez cały rok (przepisy polskie i UE) — przypadkowo złowionego wypuść natychmiast."},{id:"stornia",name:"Stornia (flądra)",nameDe:"Flunder",latin:"Platichthys flesus",group:"morskie",desc:"Płastuga — oczy zwykle po prawej stronie ciała (bywają po lewej). Szorstkie guzki kostne u nasady płetwy grzbietowej i odbytowej oraz wzdłuż linii bocznej. Strona oczna brązowooliwkowa.",habitat:"Piaszczyste dno przy brzegu, Zatoka Gdańska i Pucka, zalewy i ujścia rzek; najpospolitsza płastuga polskiego wybrzeża.",baits:"Robaki morskie (pierścienice), rosówki, krewetki — z plaży na grunt albo z łodzi przy dnie."},{id:"gladzica",name:"Gładzica",nameDe:"Scholle",latin:"Pleuronectes platessa",group:"morskie",desc:"Płastuga o gładkiej skórze z jaskrawymi pomarańczowymi lub czerwonymi plamami na stronie ocznej; za oczami rząd 4–7 kostnych guzków.",habitat:"Piaszczyste i muliste dno; w polskiej strefie rzadziej niż stornia, częściej w zachodnim Bałtyku.",baits:"Robaki morskie i rosówki na zestawie gruntowym."},{id:"zimnica",name:"Zimnica",nameDe:"Kliesche",latin:"Limanda limanda",group:"morskie",desc:"Niewielka płastuga z linią boczną wygiętą w wysoki łuk nad płetwą piersiową. Strona oczna piaskowobrązowa, szorstka w dotyku od strony ogona ku głowie.",habitat:"Piaszczyste dno głębszych wód; w polskiej strefie rzadka.",baits:"Robaki morskie — przyłów przy połowie storni."},{id:"skarp",name:"Skarp (turbot)",nameDe:"Steinbutt",latin:"Scophthalmus maximus",group:"morskie",desc:"Płastuga o niemal okrągłym ciele, oczy po lewej stronie. Bez łusek; strona oczna pokryta rozsianymi kostnymi guzkami.",habitat:"Piaszczyste i żwirowe dno; latem podchodzi na płytkie wody przybrzeżne na tarło.",baits:"Małe rybki (np. tobiasz), gumy prowadzone przy dnie, robaki morskie."},{id:"naglad",name:"Nagład",nameDe:"Glattbutt",latin:"Scophthalmus rhombus",group:"morskie",desc:"Podobny do skarpa, ale bardziej owalny, pokryty drobnymi gładkimi łuskami i bez kostnych guzków; pierwsze promienie płetwy grzbietowej rozgałęzione.",habitat:"Piaszczyste dno; w Bałtyku rzadki, głównie w jego zachodniej części.",baits:"Małe rybki i robaki przy dnie — przyłów."},{id:"sledz",name:"Śledź",nameDe:"Hering",latin:"Clupea harengus",group:"morskie",desc:"Srebrzysty, grzbiet niebieskozielony, jedna płetwa grzbietowa pośrodku ciała, zaczynająca się przed płetwami brzusznymi. Brzuch bez ostrego, piłkowanego kilu.",habitat:"Ławice na otwartym morzu; wiosną na tarło wchodzi do zatok, zalewów i portów — wtedy łowi się go z falochronów i nabrzeży.",baits:"Zestaw śledziowy z przyponami z małymi haczykami (w morzu najwyżej 5 przyponów, haczyki o rozwarciu do 6 mm) — kolorowe przywieszki."},{id:"szprot",name:"Szprot",nameDe:"Sprotte",latin:"Sprattus sprattus",group:"morskie",desc:"Mały (zwykle do 15 cm) śledziowaty. Od młodego śledzia różni się ostrym, piłkowanym kilem na brzuchu i płetwą grzbietową zaczynającą się za nasadą płetw brzusznych.",habitat:"Ławice w toni otwartego morza i zatok.",baits:"Nie jest celem wędkarzy — przyłów na zestaw śledziowy."},{id:"belona",name:"Belona",nameDe:"Hornhecht",latin:"Belone belone",group:"morskie",desc:"Bardzo wydłużona i smukła, szczęki wyciągnięte w długi „dziób” pełen drobnych zębów. Grzbiet zielononiebieski, boki srebrne; ości zielone.",habitat:"Pływa tuż pod powierzchnią; wiosną (maj–czerwiec) podchodzi do brzegów i falochronów na tarło.",baits:"Wąskie błystki i wahadłówki, sztuczna przynęta z pętlą z włóczki, pasek śledzia pod spławikiem."},{id:"wegorzyca",name:"Węgorzyca",nameDe:"Aalmutter",latin:"Zoarces viviparus",group:"morskie",desc:"Wydłużona jak węgorz, ale z grubymi wargami i dużymi płetwami piersiowymi; długa płetwa grzbietowa ma tuż przed ogonem wyraźne obniżenie. Żyworodna, ości zielone.",habitat:"Kamieniste dno i porośla przy brzegu, falochrony, porty, Zatoka Pucka.",baits:"Robaki i kawałki ryb przy dnie — przyłów."},{id:"makrela",name:"Makrela",nameDe:"Makrele",latin:"Scomber scombrus",group:"morskie",desc:"Wrzecionowata, grzbiet zielononiebieski z czarnymi falistymi pręgami, brzuch srebrny; za płetwami grzbietową i odbytową rzędy drobnych płetewek.",habitat:"Ryba słonych wód — do polskiej części Bałtyku zapływa rzadko, głównie późnym latem i jesienią.",baits:"Pilkery i przywieszki, małe błystki."},{id:"kur-diabel",name:"Kur diabeł",nameDe:"Seeskorpion",latin:"Myoxocephalus scorpius",group:"morskie",desc:"Duża, kolczasta głowa z szerokim pyskiem, ciało bez łusek, marmurkowe. Kolce na pokrywach skrzelowych; samce mają czerwonawy brzuch.",habitat:"Kamieniste dno, falochrony i porośla przybrzeżne.",baits:"Robaki i rybki przy dnie — częsty przyłów."},{id:"kur-rogacz",name:"Kur rogacz",nameDe:"Vierhörniger Seeskorpion",latin:"Myoxocephalus quadricornis",group:"morskie",desc:"Podobny do kura diabła, ale na głowie ma dwie pary kostnych, rogowatych guzów. Relikt epoki lodowcowej.",habitat:"Chłodne, głębsze wody Bałtyku, m.in. Zatoka Gdańska.",baits:xt},{id:"tasza",name:"Tasza",nameDe:"Seehase",latin:"Cyclopterus lumpus",group:"morskie",desc:"Krępa, niemal kulista, z rzędami kostnych guzków; płetwy brzuszne zrośnięte w przyssawkę, pierwsza płetwa grzbietowa ukryta w garbie skóry.",habitat:"Kamieniste dno i glony; wiosną podchodzi do brzegów na tarło.",baits:"Rzadko bierze na wędkę — przyłów."},{id:"iglicznia",name:"Iglicznia",nameDe:"Grasnadel",latin:"Syngnathus typhle",group:"morskie",desc:"Bardzo cienka, wydłużona, w kostnym pancerzu z pierścieni, z rurkowatym pyskiem; krewniak koników morskich.",habitat:"Łąki trawy morskiej i porośla, zwłaszcza Zatoka Pucka.",baits:xt},{id:"babka-bycza",name:"Babka bycza",nameDe:"Schwarzmundgrundel",latin:"Neogobius melanostomus",group:"obce",desc:"Krępa, duża głowa, płetwy brzuszne zrośnięte w przyssawkę, czarna plama na pierwszej płetwie grzbietowej. Gatunek inwazyjny.",habitat:"Zatoka Gdańska, Zalew Wiślany, Wisła, Odra, a w Bawarii Dunaj; kamienie i opaski brzegowe.",baits:"Robaki, kawałki ryb — bierze wszystko przy dnie."},{id:"babka-lysa",name:"Babka łysa",nameDe:"Nackthalsgrundel",latin:"Babka gymnotrachelus",group:"obce",desc:"Babka z przyssawką z płetw brzusznych, ciemnymi poprzecznymi pręgami i nagim (bez łusek) karkiem. Gatunek inwazyjny.",habitat:"Wisła, Bug, Narew i zbiorniki zaporowe.",baits:"Robaki — przyłów przy dnie."},{id:"babka-szczupla",name:"Babka szczupła",nameDe:"Flussgrundel",latin:"Neogobius fluviatilis",group:"obce",desc:"Smukła, piaskowo ubarwiona babka z przyssawką z płetw brzusznych. Gatunek inwazyjny.",habitat:"Wisła, Bug i ich zbiorniki.",baits:"Robaki — przyłów przy dnie."},{id:"babka-rurkonosa",name:"Babka rurkonosa",nameDe:"Marmorierte Grundel",latin:"Proterorhinus semilunaris",group:"obce",desc:"Mała babka z rurkowatymi przednimi otworami nosowymi wystającymi nad górną wargę. Gatunek inwazyjny.",habitat:"Wisła, Dunaj z dopływami, porośnięte brzegi.",baits:"Przyłów na drobne przynęty."},{id:"sumik-karlowaty",name:"Sumik karłowaty",nameDe:"Brauner Zwergwels",latin:"Ameiurus nebulosus",group:"obce",desc:"Mały sum z Ameryki: osiem wąsów, płetwa tłuszczowa, ostre kolce w płetwach piersiowych i grzbietowej. Gatunek inwazyjny.",habitat:"Stawy, starorzecza, zbiorniki o mulistym dnie.",baits:"Robaki, kawałki ryby, nocą przy dnie."},{id:"sumik-czarny",name:"Sumik czarny",nameDe:"Schwarzer Zwergwels",latin:"Ameiurus melas",group:"obce",desc:"Bardzo podobny do sumika karłowatego, ale ciemniejszy, z ciemnymi błonami płetw i gładkim tylnym brzegiem kolca piersiowego. Gatunek inwazyjny.",habitat:"Stawy i starorzecza, także w Bawarii.",baits:"Robaki, kawałki ryby, nocą przy dnie."},{id:"czebaczek-amurski",name:"Czebaczek amurski",nameDe:"Blaubandbärbling",latin:"Pseudorasbora parva",group:"obce",desc:"Mała (do ok. 10 cm) rybka z górnym pyskiem i ciemną smugą wzdłuż boku. Gatunek inwazyjny, przenosi choroby ryb.",habitat:"Stawy, kanały, rowy i zbiorniki, często przy hodowlach karpi.",baits:"Przyłów przy połowie spławikowym na drobne przynęty."},{id:"trawianka",name:"Trawianka",nameDe:"Amurgrundel",latin:"Perccottus glenii",group:"obce",desc:"Ciemna, krępa, z dużym pyskiem, płetwy brzuszne NIE tworzą przyssawki (w odróżnieniu od babek). Gatunek inwazyjny.",habitat:"Zarośnięte drobne zbiorniki, starorzecza, rowy.",baits:"Przyłów na robaki i białe robaki."},{id:"bass-sloneczny",name:"Bass słoneczny",nameDe:"Sonnenbarsch",latin:"Lepomis gibbosus",group:"obce",desc:"Mały, wysoki, kolorowy okoniowaty z Ameryki: niebieskie i pomarańczowe plamki, ciemna plamka z czerwonym brzegiem na pokrywie skrzelowej.",habitat:"Płytkie, nagrzane stawy i zbiorniki; w Polsce lokalnie (m.in. wody pochłodnicze).",baits:"Robaki, białe robaki, małe przynęty sztuczne."}],Ga=Object.fromEntries(Gr.map(c=>[c.id,c])),uk={drapiezne:"Drapieżne",lososiowate:"Łososiowate :["Ryby niewymiarowe, chronione, złowione w okresie ochronnym lub w obszarze zamkniętym dla rybołówstwa komercyjnego, a także zahaczone poza obrębem głowy (za linią pokryw skrzelowych) wypuszcza się niezwłocznie (§ 12).","Limity na dobę: łosoś 1 szt. (tylko z przyciętą płetwą tłuszczową), troć 2, sandacz i szczupak łącznie 2, sum 2, lin 5, leszcz 5, belona 10, okoń 15, śledź 6 kg, pozostałe gatunki łącznie 7 kg (§ 11).","Dorsz: okres ochronny przez cały rok (§ 3 pkt 10) i unijny zakaz połowów rekreacyjnych w podrejonach 22–32 (rozp. Rady (UE) 2025/2454 art. 10). Węgorz: okres ochronny przez cały rok (§ 3 pkt 5) i unijny zakaz połowów rekreacyjnych na wszystkich etapach życia (rozp. Rady (UE) 2026/249 art. 14 ust. 8).","Łosoś: UE zakazuje połowów rekreacyjnych, z wyjątkiem 1 łososia z przyciętą płetwą tłuszczową na dobę — po jego zatrzymaniu kończy się tego dnia połów łososia (rozp. Rady (UE) 2025/2454 art. 11).","Wolno łowić wędką lub kuszą (§ 4 ust. 1). Najwyżej 2 wędki na osobę, przy spinningu albo sztucznej musze — 1 wędka (§ 6 pkt 5). Trolling z łodzi bez żywej ryby jako przynęty; dopuszczalna liczba wędek zależy od akwenu (§ 5 ust. 4–5).","W granicach portów Darłowo, Dźwirzyno, Kołobrzeg, Łeba, Mrzeżyno, Rowy i Ustka od 15 września do końca lutego nie wolno łowić od 17:00 do 7:00 ani metodą spinningową (§ 5 ust. 3). W porcie Kołobrzeg na Parsęcie (od mostu kolejowego przy ul. Solnej do Mostu Portowego) zakaz połowu od 1 września do 31 grudnia (§ 4 ust. 2).","Nie łowi się ze znaków nawigacyjnych ani z mostów; trzeba zachować co najmniej 100 m od kąpielisk i od granic obszarów zamkniętych dla rybołówstwa komercyjnego (§ 4 ust. 2, § 6 pkt 7).","Złowione ryby trzyma się żywe w siatce w wodzie albo uśmierca od razu po złowieniu; gatunki obce (babki, sumiki, czebaczek, trawianka, bass słoneczny, pstrąg tęczowy) trzeba niezwłocznie uśmiercić (§ 8).","Połów w morzu wymaga opłaty za rybołówstwo rekreacyjne: 15 zł na tydzień, 25 zł na miesiąc, 65 zł na 12 miesięcy (50 zł ",children:m})]})}const sb=[{id:"zestaw-wlosowy",cat:"zestawy",level:"zaawansowane",title:"Zestaw włosowy (hair rig)",icon:"🧷",summary:"Przynęta na żyłce („włosie”) za haczykiem, a nie na nim — goły grot łatwiej wbija się w pysk karpia i lina.",sections:[{h:"Budowa",list:["Przypon (plecionka przyponowa lub fluorocarbon) 15–25 cm, haczyk nr 4–8 z prostym lub zakrzywionym trzonkiem.","Węzeł bezwęzłowy (knotless): pętla włosa wychodzi spod trzonka od strony kolanka haczyka.","Długość włosa: przynęta ma wisieć ok. 1–2 cm za kolankiem — za długi włos daje puste brania, za krótki blokuje grot.","Przynętę nawlekasz igłą do kulek i blokujesz stoperem."]},{h:"Warianty",list:["Pop-up (pływająca kulka) z ciężarkiem na przyponie — przynęta unosi się nad mułem i liśćmi.","Wafter — kulka wyważona tak, by opadała powoli i leżała lekko — karp łatwiej zasysa ją razem z haczykiem.","„Kanapka” kulka + sztuczna kukurydza — kontrastowa i pływająca."]},{h:"Dlaczego działa",p:["Karp zasysa pokarm i wydmuchuje to, co podejrzane. Goły haczyk za przynętą chwyta wargę w chwili wydmuchiwania, a ciężar zestawu dokańcza zacięcie (zestaw samozacinający)."]}],fish:["karp","amur","lin","leszcz","brzana"],related:["karpiowanie","zestaw-ciezarek-karpiowy","zestaw-chod","kulki-pellet","wezly"]},{id:"zestaw-ciezarek-karpiowy",cat:"zestawy",level:"zaawansowane",title:"Ciężarek karpiowy: na klipsie i inline",icon:"⚖️",summary:"Dwa podstawowe sposoby mocowania ciężkiego ołowiu w zestawie samozacinającym — i dlaczego klips bezpieczeństwa jest obowiązkowy.",sections:[{h:"Na klipsie bezpieczeństwa",list:["Ołów w klipsie, nad nim gumowa nasadka (tail rubber).","Przy zerwaniu linki ołów wypada — ryba nie ciągnie za sobą obciążenia (to podstawowa zasada etyczna).","Nasadkę wciśnij tylko lekko: za mocno zaciśnięta nie puści ołowiu."]},{h:"Inline",list:["Ołów nawleczony na linkę z przyponem wciśniętym w jego trzon — najsilniejszy efekt samozacięcia.","Używaj tylko wersji, z których przypon wysuwa się po zerwaniu."]},{h:"Waga",p:["Na jeziorze zwykle 70–110 g, w rzece i na dalekich rzutach więcej. Cięższy ołów lepiej zacina, ale głębiej zapada się w miękkim mule — wtedy wybierz chod lub helikopter."]}],fish:["karp","amur","lin"],related:["zestaw-wlosowy","zestaw-helikopter","karpiowanie"]},{id:"zestaw-chod",cat:"zestawy",level:"zaawansowane",title:"Chod rig (na muł i zielsko)",icon:"🌿",summary:"Krótki, sztywny przypon z pływającą przynętą, ślizgający się po lince ponad ołowiem — przynęta nigdy nie tonie w mule.",sections:[{list:["Przypon 5–8 cm z sztywnej żyłki, haczyk z oczkiem wygiętym do środka, pop-up na krótkim włosie.","Przypon ślizga się między dwoma stoperami na odcinku linki 30–60 cm nad ołowiem.","Gdy ołów zapada się w muł lub roślinność, przynęta zostaje na wierzchu.","Zestaw dobry do „łowienia na pojedynczą przynętę” (bez zanęty) — szybkie przerzucanie na różne miejsca."]}],fish:["karp"],related:["zestaw-wlosowy","zestaw-helikopter","karpiowanie"]},{id:"zestaw-helikopter",cat:"zestawy",level:"zaawansowane",title:"Zestaw helikopter",icon:"🚁",summary:"Ołów na samym końcu linki, przypon obracający się wokół niej powyżej — daleki rzut bez splątań i bezpieczeństwo przy zerwaniu.",sections:[{list:["Przypon na krętliku, który obraca się na rurce lub odcinku linki nad ołowiem — w locie nie owija się wokół ciężarka.","Ustaw górny stoper tak, by przypon mógł się przesuwać; dolny musi dać się zsunąć przy zerwaniu, żeby ryba mogła zrzucić ołów.","Najlepszy przy rzutach na 80 m i więcej oraz na miękkim dnie."]}],fish:["karp","leszcz","lin"],related:["zestaw-chod","zestaw-ciezarek-karpiowy","karpiowanie"]},{id:"zestaw-feeder-paternoster",cat:"zestawy",level:"zaawansowane",title:"Zestawy feederowe: pętla, paternoster, przelotowy",icon:"🧺",summary:"Jak przywiązać koszyk, żeby brania były wyraźne, a zestaw się nie plątał.",sections:[{h:"Pętla (asymetryczna)",list:["Na końcu linki długa pętla (30–40 cm) z koszykiem przesuwającym się po jej dłuższym ramieniu, przypon wpięty w krótszy koniec.","Działa jak zestaw samozacinający: ryba odpływając z przynętą napina linkę na koszyku.","Najczęściej stosowany zestaw na leszcza i krąpia na jeziorach."]},{h:"Paternoster",list:["Koszyk na bocznym odcinku 5–15 cm, przypon na końcu linki.","Bardzo czułe brania, mało splątań — dobry na rzekę i na ostrożne ryby."]},{h:"Przelotowy z gumą antysplątaniową",list:["Koszyk na krętliku przesuwnym, poniżej stoper i przypon; rurka antysplątaniowa przy dalekich rzutach.","Najprostszy, ale przy cienkich przyponach plącze się częściej niż pętla."]},{h:"Dobór przyponu",p:["Zaczynaj od 50–70 cm. Gdy szczytówka drga, a ryb brak — wydłuż przypon (ryba zdąży wziąć, zanim poczuje koszyk). Gdy ryby połykają głęboko — skróć."]}],fish:["leszcz","krap","ploc","brzana","jaz","certa","lin"],related:["feeder","zaneta-gotowa","splawiki-obciazenie"]},{id:"zestaw-splawik-przelotowy",cat:"zestawy",level:"zaawansowane",title:"Spławik przelotowy i wyważanie zestawu",icon:"🎯",summary:"Łowienie głęboko (głębiej niż długość wędziska) i precyzyjne obciążenie, przy którym widać nawet „podnoszące” brania.",sections:[{h:"Przelotowy",list:["Spławik ślizga się po żyłce, a głębokość wyznacza stoper (węzełek lub gumka) nad nim.","Waggler mocowany za dolne oczko, żyłka zatopiona pod powierzchnią — wiatr nie przesuwa zestawu.","Dzięki temu możesz łowić na 6–8 m wody wędziskiem 4 m."]},{h:"Rozkład obciążenia",list:["Główna masa (oliwka lub śruciny „w łańcuszku”) 40–80 cm nad haczykiem.","Mała śrucina sygnalizacyjna („cyngiel”) 10–20 cm nad haczykiem — od niej zależy, jak wyraźnie widać branie.","Gdy ryba podnosi przynętę z dna, spławik się wynurza — to też branie (tzw. podnoszące).","W rzece część obciążenia bliżej haczyka, żeby przynęta szła przy dnie przed spławikiem."]}],fish:["ploc","leszcz","krap","lin","karas","wzdrega"],related:["splawik","splawiki-obciazenie","biale-robaki"]},{id:"zestaw-texas-carolina",cat:"zestawy",level:"zaawansowane",title:"Texas rig i Carolina rig",icon:"🪱",summary:"Gumy uzbrojone „bezzaczepowo” — do łowienia w zawadach, trawie i na kamieniach, gdzie zwykła główka jigowa zostaje na dnie.",sections:[{h:"Texas",list:["Haczyk offsetowy z grotem schowanym w gumie, nad nim przesuwny ciężarek stożkowy (bullet), często z koralikiem.","Przechodzi przez trzcinę, lilie i gałęzie; świetny na szczupaka i okonia w zielsku.","Zacinaj mocno — grot musi przebić gumę."]},{h:"Carolina",list:["Ciężarek na lince głównej, krętlik, przypon 40–100 cm i guma na haczyku offsetowym.","Ołów ciągnięty po dnie wzbija mułu, a guma unosi się i opada za nim — dobre na sandacza i okonia na rozległych płaskich blatach.","Pływające gumy (np. z dodatkiem soli tonie, bez — unosi się) zmieniają wysokość pracy przynęty."]}],fish:["szczupak","okon","sandacz","sum"],related:["gumy","jigi","spinning","jigowanie-zaawansowane"]},{id:"zestaw-nimfa",cat:"zestawy",level:"zaawansowane",title:"Nimfowanie: zestaw czeski i francuski",icon:"🪰",summary:"Łowienie obciążonymi nimfami blisko dna, na krótkim dystansie, z czuciem przez naprężoną linkę — najskuteczniejsza metoda na lipienia i pstrąga.",sections:[{list:["Czeski: ciężka nimfa i lżejsza na skoczku, rzut pod prąd na kilka metrów, zestaw prowadzony szczytówką z prędkością wody.","Francuski: bardzo długi przypon (kilka metrów), kolorowy sygnalizator na przyponie, lżejsze nimfy, większy dystans.","Branie to zatrzymanie lub drgnięcie sygnalizatora — zacinaj natychmiast.","Obciążenie nimf dobierz do głębokości i nurtu: nimfa ma „stukać” o dno, a nie leżeć na nim."]},{h:"Przepisy",p:["W Polsce na jednej wędce najwyżej dwa haczyki ze sztucznymi przynętami imitującymi owady — więc zestaw maksymalnie z dwiema nimfami (Dz.U. 2023 poz. 1373, § 2 ust. 2 pkt 2 lit. b)."]}],fish:["lipien","pstrag-potokowy","pstrag-teczowy","klen"],related:["muchowka","muchy","przepisy-pl","czytanie-rzeki"]},{id:"zestaw-martwa-rybka",cat:"zestawy",level:"zaawansowane",title:"Zestaw na martwą rybkę i żywca",icon:"🐟",summary:"Uzbrojenie rybki przynętowej tak, by brania były skuteczne, a ryba nie połykała przynęty głęboko — i co pozwalają przepisy.",sections:[{h:"Uzbrojenie",list:["Spławik żywcowy lub zestaw gruntowy z przesuwnym ciężarkiem, przypon stalowy/wolframowy 30–50 cm.","Pojedynczy hak lub kotwiczka w grzbiecie albo wardze rybki (żywiec) albo za płetwą grzbietową (martwa rybka).","Zacinaj szybko, gdy spławik ruszy i odpłynie — długie czekanie oznacza głębokie połknięcie.","Martwą rybkę można też prowadzić spinningowo na specjalnych główkach (tzw. martwa rybka na spinning)."]},{h:"Przepisy — Polska",p:["Przy przynęcie naturalnej (żywiec, martwa rybka) dozwolony jest jeden haczyk z przynętą (§ 2 ust. 2 pkt 2 lit. a) — zestawy z dwiema kotwiczkami, popularne w niektórych krajach, w Polsce są niedozwolone."]},{h:"Przepisy — Bawaria",p:["Żywiec zakazany (AVBayFiG § 15 ust. 1 pkt 3); martwa rybka dozwolona (§ 21 ust. 2). Na wędce najwyżej 5 miejsc zacięcia (§ 16 ust. 1)."]}],fish:["szczupak","sandacz","sum","wegorz","mietus"],related:["zywcowka","martwa-rybka","zywiec","przypony","przepisy-pl","przepisy-by"]},{id:"zestaw-morski-paternoster",cat:"zestawy",level:"zaawansowane",title:"Zestawy morskie: śledziowy, flądrowy, pilker z przywieszką",icon:"⚓",summary:"Budowa zestawów na Bałtyk — z kutra i z plaży.",sections:[{list:["Śledziowy: kilka małych błyszczących muszek na bocznych troczkach, ciężarek na końcu; prowadzony w toni, gdzie echosonda pokazuje ławicę.","Flądrowy (z plaży): ciężarek z pazurami na końcu, 1–2 przypony z koralikami i pierścienicą lub krewetką.","Dorszowy z kutra: pilker na końcu, nad nim 1–2 przywieszki (twister, muszka) na troczkach.","Liczba haczyków i dopuszczalne metody w wodach morskich wynikają z przepisów morskich — sprawdź Atlas → region Bałtyk przed wyjazdem."]}],fish:["sledz","stornia","gladzica","dorsz","makrela","belona"],related:["morskie-kuter","surfcasting","pilkery","przynety-morskie-naturalne"]},{id:"jigowanie-zaawansowane",cat:"techniki",level:"zaawansowane",title:"Jigowanie zaawansowane: opad, dragging, wybór główki",icon:"📉",summary:"Kontrola opadu to klucz do sandacza: dobór masy główki do głębokości i nurtu, różne rytmy prowadzenia i czytanie brań na plecionce.",sections:[{h:"Masa główki",list:["Punkt wyjścia: guma ma dojść do dna w 2–4 s po każdym podbiciu.","Za lekka — długi opad, guma odpływa z nurtem, tracisz kontakt; za ciężka — „wpada” w dno i przestaje kusić.","W nurcie lub przy wietrze zwiększaj masę; zimą lżej i wolniej."]},{h:"Rytmy prowadzenia",list:["Klasyczny: 1–3 obroty korbką, opad na napiętej lince, pauza.","Podbicie szczytówką: krótki, ostry ruch wędziskiem, potem zbieranie luzu.","Dragging: ciągnięcie gumy po dnie wędziskiem z małymi przerwami — na pasywne sandacze i zimą.","Podwójne podbicie i „skok” — gdy ryby gonią przynętę, ale nie atakują."]},{h:"Sygnały brań",list:["Puknięcie w trakcie opadu, zatrzymanie opadu wcześniej niż powinno, nagłe zluzowanie plecionki.","Patrz na plecionkę w miejscu, gdzie wchodzi do wody — tam widać więcej niż na szczytówce.","Zacięcie od razu, krótkie i mocne."]}],fish:["sandacz","okon","szczupak","sum","dorsz"],related:["gumy","jigi","spinning","zestaw-texas-carolina","echosonda"]},{id:"twitching",cat:"techniki",level:"zaawansowane",title:"Twitching i jerkowanie",icon:"⚡",summary:"Krótkie, ostre podszarpnięcia wędziskiem nadają woblerom i jerkom chaotyczną akcję rannej rybki — branie najczęściej przychodzi w pauzie.",sections:[{list:["Twitching: woblery typu minnow/SP; 2–3 szybkie szarpnięcia szczytówką w dół, pauza 1–3 s, zbieranie luzu.","Jerkowanie: duże przynęty bez steru (glidery, pullbaity) na krótkim, sztywnym wędzisku, często z multiplikatorem.","Pracuj na luźnej lince przy szarpnięciu, ale bez dużych luzów przy pauzie — branie trzeba poczuć.","Im zimniejsza woda, tym dłuższe pauzy; latem szybciej.","Twitching to klasyka na pstrąga, klenia i okonia, jerkowanie — na dużego szczupaka."]}],fish:["szczupak","pstrag-potokowy","klen","okon","bolen","troc"],related:["woblery","spinning","dobor-koloru"]},{id:"ultralight",cat:"techniki",level:"zaawansowane",title:"Ultralight i finezja",icon:"🪶",summary:"Bardzo lekki sprzęt i małe przynęty — więcej brań od ostrożnych ryb i przyjemność z holu, ale wymaga precyzji.",sections:[{list:["Wędzisko UL o c.w. do ok. 5–7 g, kołowrotek 1000–2000, plecionka 0,04–0,08 mm lub żyłka 0,12–0,16 mm.","Przynęty: mikrogumy 2–5 cm na główkach 1–3 g, obrotówki 00–1, małe woblery.","Ustaw hamulec delikatnie i holuj spokojnie — większa ryba na UL to hol na kilka minut.","Na wodach ze szczupakiem stosuj cienki przypon tytanowy lub wolframowy — szczupak bierze też małe przynęty.","Najlepsze okno: okoń, kleń, jaź, pstrąg, jazgarz; zimą na otwartej wodzie okonie przy dnie."]}],fish:["okon","klen","jaz","pstrag-potokowy","jazgarz","jelec"],related:["spinning","gumy","blystki-obrotowe","balans-zestawu"]},{id:"echosonda",cat:"techniki",level:"zaawansowane",title:"Echosonda: jak czytać ekran",icon:"📡",summary:"Echosonda nie pokazuje „ryb na talerzu” — uczy rozumieć dno, głębokość, roślinność i położenie drobnicy oraz drapieżników.",sections:[{h:"Dno",list:["Twarde dno (żwir, kamienie) daje grubą, jasną linię i często drugie echo; miękkie (muł) — cienką i ciemniejszą.","Spady i górki to granice, przy których stoją sandacze, okonie i szczupaki.","Roślinność widać jako „pióropusze” od dna w górę."]},{h:"Ryby",list:["Łuki (arches) to ryby przepływające pod przetwornikiem w trybie klasycznym; drobnica — chmury i kropki.","Pojedyncze duże łuki pod stadem drobnicy lub przy spadzie = drapieżniki.","Tryb boczny (side imaging) i obrazowanie w dół pomagają odróżnić kamienie od ryb."]},{h:"Woda",list:["Latem na jeziorach często widać termoklinę jako poziomą smugę zakłóceń — poniżej niej bywa mało tlenu i mało ryb.","Notuj głębokości brań w dzienniku — analiza pokaże, na jakiej głębokości łowisz najwięcej."]}],related:["termoklina","jigowanie-zaawansowane","trolling","czytanie-wody"]},{id:"termoklina",cat:"techniki",level:"zaawansowane",title:"Temperatura wody, termoklina i tlen",icon:"🌡️",summary:"Ryby są zmiennocieplne: temperatura i tlen decydują, gdzie stoją i jak aktywnie żerują w danej porze roku.",sections:[{list:["Latem głębsze jeziora rozwarstwiają się: ciepła warstwa przy powierzchni, cienka warstwa skoku temperatury (termoklina) i zimna, często uboga w tlen woda przy dnie.","W upały wiele ryb trzyma się okolic termokliny lub płytszych, natlenionych miejsc (wiatr, dopływy, roślinność w dzień).","Jesienią woda się miesza — ryby rozchodzą się po całym zbiorniku, potem zbierają na zimowiskach w głębi.","Zimą pod lodem najcieplejsza (ok. 4 °C) woda leży przy dnie — tam przebywa większość ryb.","Ryby zimnolubne (pstrąg, lipień, sieja, sielawa, miętus) żerują aktywniej w chłodnej wodzie; karp, lin, amur — w ciepłej.","Termometr do wody (albo echosonda z czujnikiem) to tani sposób, by przestać zgadywać."]}],related:["echosonda","pory-roku","pogoda","tarlo-sezon"]},{id:"dobor-koloru",cat:"techniki",level:"zaawansowane",title:"Dobór koloru i wielkości przynęty",icon:"🎨",summary:"Kolor to sprawa kontrastu i widoczności w danej wodzie; wielkość i sylwetka — dopasowania do naturalnego pokarmu.",sections:[{list:["Czysta woda i słońce: kolory naturalne (srebro, oliwka, „płoć”, „okoń”), przynęty przejrzyste.","Mętna woda, pochmurno, zmierzch: jaskrawe i kontrastowe (seledyn, pomarańcz, biel, czerń) — ryba ma przynętę zobaczyć lub wyczuć liną boczną.","Głęboko kolory szybko „gasną” (najpierw czerwień) — liczy się kontrast jasne/ciemne i wibracja.","Wielkość dopasuj do drobnicy w wodzie: wiosną mniejsze przynęty, jesienią często większe.","Zmieniaj jedną rzecz naraz (kolor albo rozmiar albo tempo), żeby wiedzieć, co zadziałało — i zapisuj to w dzienniku."]}],related:["woblery","gumy","twitching","jigowanie-zaawansowane"]},{id:"balans-zestawu",cat:"techniki",level:"zaawansowane",title:"Balans zestawu: wytrzymałość, hamulec, c.w.",icon:"🔧",summary:"Najsłabsze ogniwo powinno być tam, gdzie zaplanujesz — wtedy przy zaczepie tracisz tylko przypon, a duża ryba nie zrywa zestawu.",sections:[{list:["Kolejność wytrzymałości: linka główna > przypon > (opcjonalnie) haczyk zginający się przy zaczepie.","Hamulec ustaw na ok. 1/4–1/3 wytrzymałości najsłabszego elementu; sprawdź, ciągnąc linkę ręką lub wagą.","Ciężar wyrzutu wędziska dopasuj do przynęt — przeciążone wędzisko nie rzuci i może pęknąć, niedociążone nie zarzuci daleko.","Plecionka nie amortyzuje szarpnięć — przy niej miękka akcja wędziska i luźniejszy hamulec; przy żyłce można ciaśniej.","Węzły osłabiają linkę — testuj je na sucho przed wyprawą."]}],related:["wedziska","kolowrotki","zylki-plecionki","przypony","wezly","zacinanie-hol"]},{id:"lowienie-nocne",cat:"techniki",level:"zaawansowane",title:"Łowienie nocą",icon:"🌙",summary:"Noc to czas węgorza, suma, miętusa i dużych karpi — ale też najwięcej przepisów i zasad bezpieczeństwa.",sections:[{list:["Przygotuj stanowisko za dnia: zaczepy, głębokość, odległość rzutu (klipsowanie linki).","Sygnalizatory elektroniczne lub dzwonki, świetliki na szczytówkach — zapis brań bez świecenia w wodę.","Latarka czołowa z czerwonym światłem nie oślepia i mniej płoszy ryby przy brzegu.","Polska: nie wolno używać sztucznego światła do lokalizacji i wabienia ryb (§ 2 ust. 2 pkt 1); regulamin łowiska może też ograniczać łowienie nocą.","Bawaria: zakazany połów z użyciem elektrycznych źródeł światła (AVBayFiG § 15 ust. 1 pkt 1) — sprawdź też Erlaubnisschein.","Bezpieczeństwo: nie łów sam przy wysokim brzegu ani na łodzi bez kamizelki."]}],fish:["wegorz","sum","mietus","karp","sandacz","leszcz"],related:["grunt","sygnalizatory","przepisy-pl","przepisy-by"]},{id:"tarlo-sezon",cat:"techniki",level:"zaawansowane",title:"Tarło i cykl roczny ryb",icon:"🔄",summary:"Przed tarłem ryby intensywnie żerują, w trakcie zwykle nie biorą, po tarle przez pewien czas są osłabione — okresy ochronne chronią właśnie ten czas.",sections:[{list:["Wiosną (luty–maj) trą się szczupak, okoń, sandacz, boleń, jaź, płoć; późną wiosną i latem — karp, lin, leszcz, karaś; jesienią i zimą — pstrąg, troć, sieja, sielawa, miętus.","Przed tarłem ryby zbierają się w pobliżu tarlisk — to także czas, gdy są najbardziej wrażliwe.","Po tarle drapieżniki wracają do żerowania stopniowo; duże samice szczupaka są osłabione i warto je wypuszczać.","Okresy ochronne i obręby ochronne (miejsca tarła i zimowisk, oznaczone tablicami) w Atlasie i na tablicach nad wodą mają pierwszeństwo przed każdą poradą."]}],related:["pory-roku","termoklina","zbiorki-jesienne","catch-release"]},{id:"zbiorki-jesienne",cat:"techniki",level:"zaawansowane",title:"Jesienne i zimowe skupiska drapieżników",icon:"🍂",summary:"Jesienią sandacze, okonie i szczupaki gromadzą się przy głębszych miejscach i stadach drobnicy — kto je znajdzie, łowi seryjnie.",sections:[{list:["Szukaj stad drobnicy echosondą — drapieżniki stoją pod nimi lub na krawędzi spadu obok.","W rzekach: głębokie zakola, główki ostróg, porty i zatoki, gdzie woda jest spokojniejsza i cieplejsza.","Prowadź wolniej i bliżej dna niż latem; wiele brań w opadzie.","Miejsca gromadnego zimowania ryb mogą być ustanowione jako obręby ochronne — w Polsce oznacza się je niebieskimi tablicami z żółtym napisem „obręb ochronny — połów i czynności szkodliwe dla ryb wzbronione” (Dz.U. 2023 poz. 1373, §§ 14–15). Tam nie łowisz."]}],fish:["sandacz","okon","szczupak","bolen"],related:["echosonda","jigowanie-zaawansowane","tarlo-sezon","pory-roku"]},{id:"czytanie-rzeki",cat:"techniki",level:"zaawansowane",title:"Czytanie rzeki dla zaawansowanych",icon:"🏞️",summary:"Rzeka to mozaika prądów: ryby stoją tam, gdzie mało muszą płynąć, a pokarm sam do nich przychodzi.",sections:[{list:["Linia styku szybkiego i wolnego nurtu (warkocz, szew) — najlepsze stanowisko żerowe kleni, jazi, pstrągów, boleni.","Przed i za przeszkodą: ryba stoi w „cieniu prądowym” — za kamieniem, ale także tuż przed nim, gdzie woda się piętrzy.","Bystrza z kamieniami — lipień, pstrąg, brzana, świnka; głębokie, spokojne plosa — leszcz, sum, sandacz.","Podmyte brzegi i korzenie — pstrągi i klenie; wpływ dopływu — świeża, natleniona i chłodniejsza woda latem.","Po wezbraniu ryby chowają się przy brzegach i w zatokach, gdzie nurt jest słabszy.","Rzucaj pod prąd lub w poprzek i pozwól przynęcie płynąć naturalnie z wodą — ryby stoją głowami pod prąd."]}],fish:["klen","jaz","pstrag-potokowy","lipien","brzana","bolen","swinka"],related:["czytanie-wody","muchowka","zestaw-nimfa","spinning"]}],Ac={szczupak:{methods:["spinning","zywcowka","trolling","podlodowe"],baits:["woblery","gumy","blystki-obrotowe","wahadlowki","przynety-powierzchniowe","martwa-rybka"],gear:["przypony","wedziska","zylki-plecionki","podbierak-mata"],rigs:["zestaw-texas-carolina","zestaw-martwa-rybka"],techniques:["twitching","dobor-koloru","tarlo-sezon"],setup:["Wędzisko spinningowe 2,4–2,7 m, c.w. 10–40 g (do jerków krótsze i sztywniejsze).","Kołowrotek 3000–4000, plecionka 0,12–0,18 mm.","Przypon stalowy, tytanowy lub wolframowy 25–40 cm — zawsze, szczupak przecina żyłkę i fluorocarbon.","Duży podbierak z gumowaną siatką, szczypce i długi wypychacz."],when:"Najlepiej jesienią (październik–listopad) i wczesnym latem po tarle; w ciągu dnia rano, wieczorem i przy pochmurnej, wietrznej pogodzie.",where:"Skraje trzcin i grążeli, krawędzie podwodnych łąk, zatoki, spady przy roślinności; jesienią głębsze miejsca przy stadach drobnicy.",tips:["Zaczynaj od przynęt szybkich i płytkich, potem schodź niżej i wolniej.","Duże samice wypuszczaj — to one dają najwięcej potomstwa.","Z pyska wyjmuj haki szczypcami, rybę trzymaj poziomo pod brzuchem."]},sandacz:{methods:["spinning","zywcowka","grunt"],baits:["gumy","jigi","woblery","martwa-rybka","zywiec"],gear:["zylki-plecionki","wedziska","kolowrotki"],rigs:["zestaw-texas-carolina","zestaw-martwa-rybka"],techniques:["jigowanie-zaawansowane","echosonda","zbiorki-jesienne","lowienie-nocne"],setup:["Wędzisko 2,4–2,7 m, szybka akcja, c.w. 10–35 g (czułe na puknięcia).","Plecionka 0,08–0,14 mm, przypon fluorocarbon 0,30–0,40 mm; na wodach ze szczupakiem — cienka stal lub wolfram.","Główki jigowe 8–30 g zależnie od głębokości i nurtu."],when:"Wieczór, noc i świt; mętna woda i pochmurne dni sprzyjają łowieniu w dzień. Szczyt — jesień.",where:"Twarde dno, spady, główki ostróg, zatopione drzewa, kamieniste górki na jeziorach i zaporówkach.",tips:["Gumę prowadź tuż przy dnie — sandacz rzadko podnosi się wysoko.","Branie to często tylko „puknięcie” — zacinaj od razu.","Notuj głębokość brań: ta sama głębokość działa zwykle na całym zbiorniku."]},okon:{methods:["spinning","splawik","podlodowe","drop-shot"],baits:["gumy","blystki-obrotowe","jigi","mormyszki","rosowka","biale-robaki"],gear:["wedziska","zylki-plecionki"],rigs:["zestaw-texas-carolina"],techniques:["ultralight","jigowanie-zaawansowane","echosonda","zbiorki-jesienne"],setup:["Wędzisko UL/L 1,8–2,4 m, c.w. 1–10 g.","Kołowrotek 1000–2500, plecionka 0,04–0,10 mm z przyponem fluorocarbon 0,16–0,22 mm.","Główki 1–7 g, małe obrotówki 0–2."],when:"Przez cały rok w dzień; latem rano i wieczorem, zimą świetnie spod lodu.",where:"Kamieniste i żwirowe górki, pomosty, skraje roślinności, spady; duże okonie często głębiej niż małe.",tips:["Okonie żerują stadami — po jednym braniu łów dalej w tym samym miejscu.","Gdy biorą małe, zmień przynętę na większą lub zejdź głębiej.","Drop shot pozwala trzymać przynętę długo w jednym miejscu nad dnem."]},bolen:{methods:["spinning"],baits:["woblery","wahadlowki","przynety-powierzchniowe","gumy"],gear:["wedziska","kolowrotki","zylki-plecionki"],techniques:["twitching","czytanie-rzeki","zbiorki-jesienne"],setup:["Wędzisko 2,7–3,0 m do dalekich rzutów, c.w. 10–40 g.","Kołowrotek 3000–4000 z szybkim przełożeniem, plecionka 0,10–0,16 mm, przypon fluorocarbon 0,25–0,35 mm.","Smukłe woblery, ciężkie cykady i wahadłówki — przynęty, które daleko lecą."],when:"Latem i wczesną jesienią, rano i wieczorem; widoczne żerowanie przy powierzchni („bicie”).",where:"Rzeki: główki ostróg, przykosy, ujścia dopływów, napływy poniżej jazów; zaporówki — płycizny z ukleją.",tips:["Rzucaj za żerującą rybę i prowadź szybko — boleń atakuje uciekającą drobnicę.","Przy ostrożnych rybach — mniejsze przynęty i dłuższy fluorocarbon.","Hol w nurcie bywa gwałtowny — hamulec nie za ciasno."]},sum:{methods:["sumowe","grunt","spinning"],baits:["rosowka","zywiec","martwa-rybka","kulki-pellet","gumy"],gear:["wedziska","kolowrotki","zylki-plecionki","haczyki","podbierak-mata"],rigs:["zestaw-martwa-rybka"],techniques:["lowienie-nocne","echosonda","balans-zestawu"],setup:["Wędzisko sumowe 2,7–3,3 m, c.w. 100–300 g.","Duży kołowrotek z mocnym hamulcem (6000+) lub multiplikator, plecionka 0,40–0,60 mm.","Przypon z bardzo mocnej plecionki, haki 4/0–8/0 pojedyncze.","Mata, rękawica do chwytu za żuchwę."],when:"Ciepłe miesiące (czerwiec–wrzesień), szczególnie noce i dni przed burzą.",where:"Głębokie doły w rzekach, zwalone drzewa, ostrogi, zaporówki przy starym korycie.",tips:["Kwok (klonk) przyciąga suma z łodzi — wymaga wprawy.","Pęczek rosówek na dużym haku to klasyczna, skuteczna przynęta.","Ustaw hamulec tak, by zestaw wytrzymał pierwszy odjazd — sum potrafi wyciągnąć dziesiątki metrów."]},wegorz:{methods:["grunt"],baits:["rosowka","martwa-rybka","zywiec"],gear:["sygnalizatory","haczyki","przypony"],techniques:["lowienie-nocne"],setup:["Wędzisko gruntowe 2,7–3,6 m, c.w. 30–80 g.","Żyłka 0,30–0,35 mm, przypon 0,30 mm lub cienka plecionka (węgorz bywa trudny do wyjęcia z zaczepu).","Hak nr 2–6, ciężarek przesuwny."],when:"Ciepłe noce od czerwca do sierpnia, zwłaszcza przy wzroście wody i przed burzą.",where:"Dno przy zaczepach, podmyte brzegi, kamienne opaski, porty i kanały.",tips:["Zacinaj po chwili, gdy linka przestaje się odwijać nierówno.","W Polsce obowiązuje limit 2 szt. na dobę — sprawdź Atlas → przepisy.","Szmatka lub rękawica ułatwia chwyt śliskiej ryby."]},mietus:{methods:["grunt","podlodowe"],baits:["rosowka","martwa-rybka","zywiec"],gear:["sygnalizatory","haczyki"],techniques:["lowienie-nocne","termoklina"],setup:["Wędzisko gruntowe 2,7–3,3 m, żyłka 0,25–0,30 mm.","Przypon 0,22–0,25 mm, hak nr 2–6, ciężarek przesuwny lub mała koszyczka.","Spod lodu — krótki kij i ciężka błystka lub rosówka przy dnie."],when:"Zimna woda: od listopada do marca, najlepiej nocą i w pochmurne dni.",where:"Kamieniste dno i opaski w rzekach, głębokie miejsca w jeziorach, porty.",tips:["Miętus żeruje przy samym dnie — przynęta musi leżeć.","Najlepsze brania przy mrozie i niskiej, czystej wodzie."]},"pstrag-potokowy":{methods:["spinning","muchowka"],baits:["woblery","blystki-obrotowe","muchy","gumy"],gear:["wedziska","zylki-plecionki","odziez"],rigs:["zestaw-nimfa"],techniques:["czytanie-rzeki","twitching","ultralight","catch-release"],setup:["Wędzisko 1,8–2,4 m, c.w. 2–10 g; muchowe klasy 3–5.","Żyłka 0,14–0,18 mm albo plecionka z fluorocarbonem 0,16–0,20 mm.","Małe woblery 3–6 cm, obrotówki 0–2, nimfy i suche muchy."],when:"Od otwarcia sezonu wiosną do jesieni; rano i wieczorem, po lekkim podniesieniu i zmąceniu wody.",where:"Podmyte brzegi, korzenie, za kamieniami, wyloty bystrzy do dołków, cień drzew.",tips:["Podchodź od dołu rzeki i nie stawaj na tle nieba — pstrąg jest bardzo płochliwy.","Prowadź przynętę z nurtem lub w poprzek — tak płynie naturalny pokarm.","Haczyki bez zadziorów ułatwiają wypuszczanie."]},"pstrag-teczowy":{methods:["spinning","muchowka","splawik"],baits:["blystki-obrotowe","woblery","muchy","biale-robaki","kulki-pellet"],gear:["wedziska","zylki-plecionki"],rigs:["zestaw-nimfa"],techniques:["ultralight","dobor-koloru"],setup:["Wędzisko 2,1–2,7 m, c.w. 2–15 g.","Żyłka 0,16–0,20 mm.","Na łowiskach komercyjnych: pasta pstrągowa, spławik lub sbirulino."],when:"Przez większość roku; w łowiskach komercyjnych najlepiej chłodniejsze miesiące.",where:"Rzeki górskie i podgórskie, łowiska specjalne, stawy pstrągowe.",tips:["Jaskrawe kolory często lepsze niż naturalne — szczególnie na rybach z hodowli.","Gdy ryby „szarpią” przynętę, zmniejsz rozmiar."]},lipien:{methods:["muchowka","spinning"],baits:["muchy","owady","blystki-obrotowe"],gear:["wedziska","odziez"],rigs:["zestaw-nimfa"],techniques:["czytanie-rzeki","catch-release"],setup:["Wędzisko muchowe klasy 3–5, przypon 0,10–0,14 mm.","Nimfy 14–18, suche muchy 16–20.","Na spinning bardzo małe obrotówki (00–0) — tylko gdzie regulamin pozwala."],when:"Późne lato i jesień (lipień jest chroniony wiosną — sprawdź okres).",where:"Żwirowe bystrza i rynny o umiarkowanym nurcie, czysta, natleniona woda.",tips:["Lipień ma delikatny pysk — zacinaj lekko i holuj spokojnie.","Wiele odcinków to łowiska „no kill” lub tylko muchowe — sprawdź regulamin."]},troc:{methods:["spinning","muchowka","trolling"],baits:["wahadlowki","woblery","blystki-obrotowe","muchy"],gear:["wedziska","kolowrotki","zylki-plecionki","odziez"],techniques:["czytanie-rzeki","twitching"],setup:["Wędzisko 2,7–3,0 m, c.w. 10–40 g (rzeki) lub 10–30 g (wybrzeże).","Kołowrotek 3000–4000, plecionka 0,12–0,18 mm, fluorocarbon 0,30–0,40 mm.","Wahadłówki i woblery tonące, ciężkie obrotówki."],when:"Rzeki: zależnie od wejść ryb i okresów ochronnych; wybrzeże — wiosna i jesień przy chłodnej wodzie.",where:"Rzeki przymorskie: rynny, doły pod spiętrzeniami, zakręty; wybrzeże — kamienie i rafy przy brzegu.",tips:["Troć często bierze na przynętę prowadzoną wolno przy dnie.","Okresy i wymiary troci różnią się regionami — zawsze sprawdź regulamin wody i Atlas → przepisy."]},losos:{methods:["spinning","muchowka","trolling"],baits:["wahadlowki","woblery","muchy"],gear:["wedziska","kolowrotki","zylki-plecionki"],setup:["Mocny spinning 2,7–3,0 m, c.w. 20–60 g, lub dwuręczna muchówka.","Plecionka 0,16–0,22 mm, fluorocarbon 0,35–0,45 mm."],when:"Zależnie od wędrówki ryb i przepisów morskich/rzecznych.",where:"Rzeki z wędrówką łososia, trolling na otwartym Bałtyku.",tips:["Połów łososia w Bałtyku ma szczegółowe ograniczenia UE — sprawdź region Bałtyk w atlasie."]},sieja:{methods:["podlodowe","splawik","muchowka"],baits:["ochotka","biale-robaki","mormyszki","muchy"],gear:["wedziska"],techniques:["termoklina","echosonda"],setup:["Delikatny zestaw: żyłka 0,12–0,16 mm, mały hak 14–18.","Spod lodu — mormyszki i małe błystki."],when:"Zimna woda; zimą spod lodu.",where:"Głębokie, czyste jeziora; ryby w toni lub nad dnem na znacznej głębokości.",tips:["Szukaj stada echosondą i dopasuj głębokość przynęty."]},karp:{methods:["karpiowanie","method-feeder","feeder","splawik"],baits:["kulki-pellet","kukurydza","ziarna","ciasto-chleb","rosowka","zaneta-karpiowa","pva"],gear:["sygnalizatory","kolowrotki","podbierak-mata","haczyki","wedziska"],rigs:["zestaw-wlosowy","zestaw-ciezarek-karpiowy","zestaw-chod","zestaw-helikopter"],techniques:["balans-zestawu","lowienie-nocne","termoklina"],setup:["Wędziska karpiowe 3,6–3,9 m, krzywa ugięcia 2,75–3,5 lb.","Kołowrotek z wolnym biegiem lub dużą szpulą, żyłka 0,30–0,35 mm albo plecionka z leaderem.","Przypon 15–25 cm (plecionka przyponowa), haczyk 4–8 na włosie, ołów 70–110 g na klipsie bezpieczeństwa.","Mata, duży podbierak, środek odkażający na rany."],when:"Od maja do października; najlepiej przy ciepłej wodzie, przy zmianie ciśnienia i nocą.",where:"Granice roślinności, blaty i górki, czyste miejsca w zielsku, płytsze zatoki wiosną, rejon, w który wieje ciepły wiatr.",tips:["Zanęcaj precyzyjnie — klipsuj linkę i używaj markera lub łodzi zanętowej tam, gdzie wolno.","Rybę zawsze kładź na macie i polewaj wodą.","Notuj w dzienniku miejsce, przynętę i ciśnienie — szybko zobaczysz, co działa na danej wodzie."]},amur:{methods:["karpiowanie","splawik","method-feeder"],baits:["kukurydza","ziarna","kulki-pellet","ciasto-chleb"],gear:["sygnalizatory","podbierak-mata"],rigs:["zestaw-wlosowy","zestaw-ciezarek-karpiowy"],setup:["Sprzęt jak na karpia; amur ma mocny, długi odjazd.","Przy powierzchni — pływający chleb lub sztuczna trawa na kontrolerze."],when:"Latem przy wysokiej temperaturze wody.",where:"Pasy roślinności i płycizny nagrzane słońcem.",tips:["Amur często żeruje pod powierzchnią — obserwuj trzciny i lilie."]},lin:{methods:["splawik","method-feeder","feeder"],baits:["rosowka","czerwony-robak","kukurydza","biale-robaki","kulki-pellet"],gear:["splawiki-obciazenie","haczyki"],rigs:["zestaw-splawik-przelotowy","zestaw-wlosowy","zestaw-feeder-paternoster"],setup:["Wędzisko spławikowe 4–6 m lub feeder 3,3–3,6 m.","Żyłka 0,18–0,22 mm, przypon 0,14–0,18 mm, hak 10–14.","Spławik z lekką antenką — lin delikatnie podnosi przynętę."],when:"Maj–wrzesień, świt i wieczór, ciepłe i parne dni.",where:"Zarośnięte stawy i zatoki, skraje grążeli, muliste dno przy roślinności.",tips:["Wyczyść małą „okienko” w roślinności i zanęcaj w jednym punkcie.","Bąbelki na powierzchni zdradzają żerującego lina."]},leszcz:{methods:["feeder","method-feeder","splawik","grunt"],baits:["biale-robaki","ochotka","kukurydza","czerwony-robak","rosowka","zaneta-gotowa","atraktory"],gear:["kolowrotki","splawiki-obciazenie"],rigs:["zestaw-feeder-paternoster","zestaw-splawik-przelotowy"],techniques:["lowienie-nocne","echosonda"],setup:["Feeder 3,6–3,9 m, c.w. do 80–120 g, żyłka 0,20–0,22 mm lub plecionka z leaderem.","Przypon 0,12–0,16 mm, 50–100 cm, hak 12–16.","Koszyk zanętowy, zanęta słodka z dodatkiem białka i robaków."],when:"Od maja do października; najlepiej wieczorem i nocą, latem także w pochmurne dni.",where:"Głębsze, spokojne miejsca z mulistym dnem; w rzekach — zakola i wolniejszy nurt.",tips:["Leszcze chodzą dużymi stadami — mocne zanęcenie na starcie zatrzymuje je w łowisku.","Przy wielu „drgnięciach” bez zacięcia wydłuż przypon."]},krap:{methods:["feeder","splawik"],baits:["biale-robaki","ochotka","kukurydza"],gear:["splawiki-obciazenie"],rigs:["zestaw-feeder-paternoster","zestaw-splawik-przelotowy"],setup:["Lekki feeder lub spławik; żyłka 0,14–0,18 mm, przypon 0,10–0,12 mm, hak 14–18."],when:"Od wiosny do jesieni, w dzień.",where:"Podobnie jak leszcz, często bliżej brzegu i płycej.",tips:["Mniejsze przynęty i drobniejsza zanęta niż na leszcza."]},ploc:{methods:["splawik","feeder","podlodowe"],baits:["biale-robaki","ochotka","ziarna","ciasto-chleb"],gear:["splawiki-obciazenie","haczyki"],rigs:["zestaw-splawik-przelotowy","zestaw-feeder-paternoster"],setup:["Bat 5–7 m lub tyczka, żyłka 0,10–0,14 mm, przypon 0,08–0,10 mm, hak 16–20.","Lekki spławik 0,5–2 g wyważony do antenki."],when:"Cały rok; zimą świetnie spod lodu na ochotkę.",where:"Prawie wszędzie: rzeki, jeziora, kanały; zimą głębsze miejsca.",tips:["Częste, drobne zanęcanie zatrzymuje stado.","Pęczak i konopie latem wybierają większe płocie."]},klen:{methods:["spinning","splawik","muchowka"],baits:["woblery","owady","ciasto-chleb","blystki-obrotowe","muchy"],gear:["wedziska","zylki-plecionki"],rigs:["zestaw-nimfa"],techniques:["czytanie-rzeki","twitching","ultralight"],setup:["Spinning UL/L 2,1–2,4 m, c.w. 2–10 g, żyłka 0,16–0,20 mm.","Małe woblery, obrotówki, przynęty owadopodobne; latem chrabąszcz czy konik na powierzchni."],when:"Od wiosny do jesieni; latem przy powierzchni w ciepłe dni.",where:"Pod nawisającymi drzewami, przy filarach mostów, za przeszkodami w nurcie.",tips:["Kleń jest płochliwy — rzucaj z daleka i nie pokazuj się nad wodą.","Przynęta spływająca z prądem pod gałęzie to klasyka."]},jaz:{methods:["spinning","splawik","feeder"],baits:["woblery","ziarna","kukurydza","biale-robaki"],gear:["wedziska"],techniques:["czytanie-rzeki","ultralight"],setup:["Lekki spinning lub spławik w nurcie; żyłka 0,16–0,20 mm."],when:"Wiosna po tarle i jesień.",where:"Rzeki nizinne: warkocze nurtu, ostrogi, przykosy.",tips:["Jaź często łowi się „przy okazji” na kleniowe przynęty."]},brzana:{methods:["feeder","grunt"],baits:["kulki-pellet","biale-robaki","rosowka"],gear:["kolowrotki","wedziska"],rigs:["zestaw-feeder-paternoster","zestaw-wlosowy"],techniques:["czytanie-rzeki"],setup:["Mocny feeder rzeczny 3,6–3,9 m, c.w. 100–150 g, żyłka 0,22–0,25 mm.","Ciężki koszyk lub ołów rzeczny, przypon 0,18–0,22 mm, hak 8–12 lub włos z pelletem."],when:"Latem i wczesną jesienią, często wieczorem.",where:"Szybki nurt z kamienistym i żwirowym dnem.",tips:["Brzana bierze mocno — szczytówka gwałtownie się wygina, nie trzeba zacinać długo."]},karas:{methods:["splawik","method-feeder"],baits:["biale-robaki","czerwony-robak","ciasto-chleb","kukurydza"],gear:["splawiki-obciazenie"],rigs:["zestaw-splawik-przelotowy"],setup:["Delikatny spławik, żyłka 0,12–0,16 mm, hak 14–18."],when:"Ciepła pora roku.",where:"Małe, zarośnięte stawy i glinianki.",tips:["Karaś delikatnie skubie — spławik wyważ bardzo czule."]},"karas-srebrzysty":{methods:["splawik","method-feeder","feeder"],baits:["biale-robaki","kukurydza","ciasto-chleb","kulki-pellet"],gear:["splawiki-obciazenie"],rigs:["zestaw-splawik-przelotowy"],setup:["Spławik lub method feeder; żyłka 0,14–0,18 mm, hak 12–16."],when:"Od wiosny do jesieni.",where:"Stawy, glinianki, starorzecza, wolne rzeki.",tips:["Gatunek obcy — sprawdź w przepisach regionu, czy złowionego wolno wypuścić."]},dorsz:{methods:["morskie-kuter","surfcasting"],baits:["pilkery","gumy","przynety-morskie-naturalne"],gear:["wedziska","kolowrotki","zylki-plecionki","odziez"],rigs:["zestaw-morski-paternoster"],techniques:["jigowanie-zaawansowane","echosonda"],setup:["Wędzisko pilkerowe 2,1–2,7 m, c.w. 60–200 g.","Kołowrotek 5000+, plecionka 0,16–0,25 mm, przypon fluorocarbon 0,50–0,70 mm.","Pilker 60–200 g zależnie od głębokości i dryfu, 1–2 przywieszki."],when:"Zależnie od przepisów UE na dany rok — sprawdź region Bałtyk.",where:"Kamieniste dno i wraki na Bałtyku, z kutra.",tips:["Zasady połowu dorsza w Bałtyku zmieniają się co roku — przed rejsem sprawdź Atlas → Bałtyk."]},stornia:{methods:["surfcasting","morskie-kuter"],baits:["przynety-morskie-naturalne"],gear:["wedziska","kolowrotki"],rigs:["zestaw-morski-paternoster"],setup:["Wędzisko surfowe 3,9–4,5 m, c.w. 100–200 g, żyłka 0,30–0,35 mm lub plecionka ze strzałówką.","Ciężarek z pazurami, przypony z koralikami, haki 2–6."],when:"Jesień, zima i wiosna; po sztormie, gdy woda lekko zmącona.",where:"Piaszczyste plaże, rynny między łachami, zatoki i ujścia rzek.",tips:["Kolorowe koraliki nad haczykiem przyciągają flądry.","Rzucaj za drugą łachę — tam często stoją ryby."]},sledz:{methods:["morskie-kuter"],baits:["przynety-morskie-naturalne"],gear:["wedziska"],rigs:["zestaw-morski-paternoster"],setup:["Wędzisko 2,7–3,6 m, zestaw śledziowy z kilkoma muszkami, ciężarek 20–60 g."],when:"Wiosną, gdy ławice wchodzą do zatok i portów na tarło.",where:"Falochrony, nabrzeża portów, Zatoka Pucka i Gdańska.",tips:["Szukaj głębokości, na której stoi ławica — zmieniaj ją co kilka rzutów."]},belona:{methods:["spinning","surfcasting"],baits:["wahadlowki","blystki-obrotowe","przynety-morskie-naturalne"],gear:["wedziska"],setup:["Spinning 2,7–3,0 m, c.w. 10–30 g, smukła wahadłówka; często z przyponem z cienkiej nici zamiast kotwicy (zęby belony się w nią wplątują)."],when:"Maj–czerwiec, gdy podchodzi do brzegu.",where:"Przy powierzchni w pobliżu falochronów i kamienistych brzegów.",tips:["Prowadź szybko tuż pod powierzchnią; belona długo trzyma przynętę — zacinaj spokojnie."]},makrela:{methods:["morskie-kuter","spinning"],baits:["pilkery","wahadlowki"],gear:["wedziska"],rigs:["zestaw-morski-paternoster"],setup:["Zestaw z kilkoma muszkami lub mały pilker, wędzisko 2,4–3,0 m."],when:"Późne lato w zachodniej części Bałtyku.",where:"Otwarta woda, ławice w toni.",tips:["W polskiej strefie Bałtyku makrela pojawia się rzadko i nieregularnie."]}};function rb(c){return Ac[c]}const Zr={naturalne:{label:"Przynęty naturalne",icon:"🪱"},sztuczne:{label:"Przynęty sztuczne",icon:"🎣"},zaneta:{label:"Zanęty i dodatki",icon:"🥣"},sprzet:{label:"Sprzęt",icon:"🧰"},metody:{label:"Metody połowu",icon:"🌊"},zestawy:{label:"Zestawy (rigi)",icon:"🪢"},techniki:{label:"Techniki zaawansowane",icon:"🧠"},porady:{label:"Porady i technika",icon:"💡"},przepisy:{label:"Przepisy o sprzęcie",icon:"⚖️"}},lb={label:"Dz.U. 2023 poz. 1373, § 2",url:"https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20230001373"},cb={label:"AVBayFiG §§ 15, 16, 20, 21",url:"https://www.gesetze-bayern.de/Content/Document/BayAVFiG"},_s=[{id:"rosowka",cat:"naturalne",title:"Rosówka",icon:"🪱",summary:"Duży dżdżownicowy robak — uniwersalna przynęta na grubsze ryby, szczególnie nocą i po deszczu.",sections:[{h:"Na co",p:["Węgorz, sum (w pęczku), leszcz, karp, lin, okoń, kleń, brzana, miętus, a w morzu dorsz i flądra."]},{h:"Jak zakładać",list:["Całą na duży haczyk (nr 2–6), wbijając 2–3 razy i zostawiając ruchliwy koniec.","Na suma i węgorza — pęczek kilku rosówek na mocnym haczyku.","Na mniejsze ryby — kawałek rosówki, żeby ryba wzięła ją razem z grotem."]},{h:"Skąd brać i jak przechowywać",list:["Zbiera się je nocą z latarką na trawnikach po ciepłym deszczu albo kupuje w sklepie.","Trzymaj w wilgotnej ziemi lub mchu, w chłodzie (lodówka, 5–10 °C); martwe od razu usuwaj, bo psują resztę."]}],fish:["wegorz","sum","leszcz","karp","lin","okon","klen","brzana","mietus","dorsz","stornia"],related:["czerwony-robak","grunt","sumowe"]},{id:"czerwony-robak",cat:"naturalne",title:"Czerwony robak (kompostowy)",icon:"🪱",summary:"Mały, ruchliwy robak z kompostu — jedna z najskuteczniejszych przynęt na niemal wszystkie białe ryby i okonie.",sections:[{h:"Na co",p:["Okoń, lin, karaś, leszcz, krąp, płoć, jazgarz, kiełb, pstrąg potokowy (tam, gdzie wolno na naturalne)."]},{h:"Jak zakładać",list:["1–3 sztuki na haczyk nr 10–14, przekłute w poprzek, by zostały ruchliwe końce.","Dobrze działa w kanapce z białym robakiem lub kukurydzą.","Pocięte robaki dodane do zanęty mocno przyciągają leszcze i liny."]}],fish:["okon","lin","karas","leszcz","krap","ploc","jazgarz","kielb","pstrag-potokowy"],related:["rosowka","biale-robaki","splawik"]},{id:"biale-robaki",cat:"naturalne",title:"Białe robaki (larwy much)",icon:"🐛",summary:"Klasyka spławika i feedera; łatwe do kupienia, wytrzymałe na haczyku, świetne do zanęty.",sections:[{h:"Na co",p:["Płoć, leszcz, krąp, wzdręga, ukleja, jelec, kleń, jaź, karaś, a zimą okoń i płoć spod lodu."]},{h:"Jak zakładać",list:["1–3 sztuki na cienki haczyk nr 14–20, za tępy koniec (przy „oczkach”), żeby robak żył i się ruszał.","Dwa–trzy białe w kanapce z ochotką lub kukurydzą.","Garść białych robaków w koszyku feedera lub wsypana przy spławiku utrzymuje ryby w łowisku."]},{h:"Przechowywanie",list:["W lodówce w trocinach lub mące kukurydzianej — w chłodzie nie zamieniają się w poczwarki (kasterki).","Kasterki (poczwarki) też są świetną przynętą na duże płocie i leszcze."]}],fish:["ploc","leszcz","krap","wzdrega","ukleja","jelec","klen","jaz","karas","okon"],related:["ochotka","splawik","feeder","zaneta-gotowa"]},{id:"ochotka",cat:"naturalne",title:"Ochotka",icon:"🔴",summary:"Drobna czerwona larwa komara — przynęta „na trudne dni” i podstawa łowienia spod lodu.",sections:[{h:"Na co",p:["Płoć, leszcz, krąp, okoń, sieja, sielawa, ukleja; zimą prawie wszystko, co żeruje pod lodem."]},{h:"Jak używać",list:["Na haczyk nr 18–22 lub mormyszkę — 2–5 larw przekłutych przy głowie.","Ochotka „zanętowa” (drobniejsza, jokers) — do kul z ziemią lub gliną.","Trzymaj w wilgotnej gazecie w lodówce, nie w wodzie."]}],fish:["ploc","leszcz","krap","okon","sieja","sielawa","ukleja"],related:["podlodowe","mormyszki","biale-robaki"]},{id:"kukurydza",cat:"naturalne",title:"Kukurydza",icon:"🌽",summary:"Tania, selektywna przynęta roślinna — dobra na karpie, amury, liny i leszcze, rzadziej bierze ją drobnica.",sections:[{h:"Jak zakładać",list:["Konserwowa: 1–3 ziarna na haczyk nr 8–12, groty schowane w ziarnie albo na włos.","Gotowana (z suchego ziarna) jest twardsza i dłużej trzyma się haczyka.","Sztuczna pływająca kukurydza na włosie unosi przynętę nad mułem (pop-up)."]},{h:"Uwaga",p:["Suchą kukurydzę zawsze namocz i ugotuj — surowa pęcznieje w przewodzie pokarmowym ryb i może im szkodzić."]}],fish:["karp","amur","lin","leszcz","karas-srebrzysty","jaz"],related:["ziarna","karpiowanie","method-feeder"]},{id:"ziarna",cat:"naturalne",title:"Pęczak, pszenica, konopie",icon:"🌾",summary:"Gotowane ziarna — przynęta i zanęta zarazem; konopie to klasyka na duże płocie.",sections:[{h:"Jak przygotować",list:["Namocz na noc, gotuj do miękkości (pęczak krócej, pszenica i konopie dłużej, aż pękną).","Konopie: pękające ziarno z białym kiełkiem na haczyk nr 14–16 — płoć, kleń, jaź.","Pęczak i pszenica: leszcz, lin, karaś, płoć; świetne jako zanęta przy spławiku."]}],fish:["ploc","leszcz","lin","karas","klen","jaz"],related:["kukurydza","zaneta-gotowa","splawik"]},{id:"ciasto-chleb",cat:"naturalne",title:"Ciasto i chleb",icon:"🍞",summary:"Przynęty z kuchni: miękisz, skórka chleba, ciasto z mąki — proste i skuteczne na karasie, karpie i płocie.",sections:[{list:["Miękisz chleba ugnieciony na haczyku — płoć, karaś, wzdręga.","Skórka chleba na powierzchni — karp i amur w ciepłe dni, kleń pod drzewami.","Ciasto (mąka + woda lub jajko, czasem wanilia, miód) — karaś, karp; zagnieć tak, by trzymało się haczyka przy wyrzucie."]}],fish:["ploc","karas","karas-srebrzysty","karp","amur","wzdrega","klen"],related:["splawik","przynety-powierzchniowe"]},{id:"kulki-pellet",cat:"naturalne",title:"Kulki proteinowe i pellet",icon:"🟤",summary:"Przynęty karpiowe: twarde kulki (boilies) i prasowany pellet — selektywne na duże ryby.",sections:[{h:"Kulki",list:["Tonące, pływające (pop-up) i „wafters” (wolno opadające); średnice 10–24 mm.","Zakłada się je na włos (hair rig), a nie bezpośrednio na haczyk.","Zanęca się tymi samymi kulkami, żeby ryby się do nich przyzwyczaiły."]},{h:"Pellet",list:["Rozpuszcza się w wodzie i tworzy smugę zapachową — świetny w method feederze.","Drobny (2–4 mm) do koszyka, większy (8–20 mm) na włos lub w opasce.","Pellet halibutowy jest bardzo tłusty: działa w ciepłej wodzie, zimą słabiej."]}],fish:["karp","amur","lin","leszcz","brzana","sum"],related:["karpiowanie","method-feeder","zaneta-karpiowa"]},{id:"zywiec",cat:"naturalne",title:"Żywiec",icon:"🐟",summary:"Żywa rybka przynętowa na szczupaka, sandacza, suma i okonia — w Polsce dozwolona, w Bawarii zakazana.",sections:[{h:"Na co i jaki",list:["Szczupak: płoć, krąp lub karaś 10–20 cm; sum: większe, żywotne ryby; sandacz i okoń: drobniejsze, smukłe (ukleja, płoć).","Bierz rybki z łowiska, w którym łowisz — przenoszenie ryb między wodami grozi zawleczeniem chorób i gatunków obcych.","Nie używaj gatunków chronionych ani niewymiarowych gatunków z wymiarem ochronnym."]},{h:"Przepisy",p:["Polska: rozporządzenie nie zakazuje żywca — sprawdź regulamin łowiska (PZW, RZGW), bo bywa ograniczony.","Bawaria: łowienie na żywą rybkę jest zakazane (AVBayFiG § 15 ust. 1 pkt 3). Martwa rybka jako przynęta jest dozwolona (§ 21 ust. 2)."]}],fish:["szczupak","sandacz","sum","okon"],related:["zywcowka","martwa-rybka","przepisy-by"]},{id:"martwa-rybka",cat:"naturalne",title:"Martwa rybka i filet",icon:"🐠",summary:"Na drapieżniki żerujące przy dnie i padlinożerców: szczupak zimą, sandacz, węgorz, miętus, sum.",sections:[{list:["Cała rybka na zestawie gruntowym lub spławikowym — szczupak (zwłaszcza zimą i wczesną wiosną po okresie ochronnym), sandacz.","Kawałek ryby lub filet — węgorz, miętus, sum, a w morzu dorsz.","Śledź lub inna tłusta ryba morska daje silny zapach — klasyka na szczupaka i węgorza.","Martwą rybkę można też prowadzić spinningowo na specjalnym uzbrojeniu (wleczona, „martwa rybka na dragonie”)."]}],fish:["szczupak","sandacz","wegorz","mietus","sum","dorsz"],related:["zywiec","grunt","przypony"]},{id:"owady",cat:"naturalne",title:"Owady i larwy",icon:"🦗",summary:"Konik polny, chrząszcze, chruściki, larwy jętek — naturalny pokarm kleni, pstrągów i jazi.",sections:[{list:["Latem konik polny lub chrząszcz podany na powierzchni pod nawisem drzew to świetna przynęta na klenia i jazia.","Chruściki (larwy w domkach z kamyczków) zbierane spod kamieni — na pstrągi, lipienie, kiełbie.","Owady podaje się na lekkim zestawie, najlepiej z prądem wody, żeby dryfowały naturalnie."]}],fish:["klen","jaz","pstrag-potokowy","lipien","jelec","wzdrega"],related:["muchowka","muchy"]},{id:"przynety-morskie-naturalne",cat:"naturalne",title:"Przynęty morskie: pierścienice, krewetki, śledź",icon:"🦐",summary:"Na dorsza, flądry i węgorzycę z plaży i z kutra — pierścienice (nereis), krewetki, kawałki śledzia.",sections:[{list:["Pierścienica (nereis, „robak morski”) — podstawa łowienia flądry i dorsza z brzegu (surfcasting).","Krewetka i kawałek śledzia — dorsz, węgorzyca; śledź ma silny zapach i dobrze trzyma się haczyka.","Na belonę i śledzia działają drobne paski ryby lub sztuczne muszki (zestawy „śledziowe”)."]}],fish:["dorsz","stornia","gladzica","wegorzyca","belona"],related:["surfcasting","morskie-kuter"]},{id:"woblery",cat:"sztuczne",title:"Woblery",icon:"🐟",summary:"Twarde imitacje rybek ze sterem, który nadaje im akcję i głębokość — na szczupaka, okonia, sandacza, bolenia, pstrąga, klenia.",sections:[{h:"Rodzaje",list:["Pływające (F) — wynurzają się po zatrzymaniu; dobre nad roślinnością.","Tonące (S) i zawieszające (SP) — pracują na stałej głębokości, zatrzymany SP „wisi” w wodzie i prowokuje ataki.","Długi ster = głęboko (trolling, sandacz), krótki = płytko (szczupak w trzcinach, kleń).","Wielosegmentowe i jerki — duże przynęty na szczupaka i suma."]},{h:"Jak prowadzić",list:["Jednostajnie (dobre na start), z przerwami (stop & go), z podszarpnięciami (twitching) — przerwa często wywołuje branie.","Dobierz głębokość: wobler powinien pracować tuż nad roślinnością lub dnem.","Przy szczupaku zawsze przypon stalowy, wolframowy lub z grubego fluorocarbonu."]}],fish:["szczupak","okon","sandacz","bolen","pstrag-potokowy","klen","jaz","sum","troc"],related:["spinning","trolling","przypony"]},{id:"gumy",cat:"sztuczne",title:"Gumy (rippery, twistery)",icon:"🪝",summary:"Miękkie przynęty na główkach jigowych — najlepsze na sandacza i okonia przy dnie, skuteczne też na szczupaka.",sections:[{h:"Rodzaje",list:["Ripper (z łopatką na ogonie) — drga całym ciałem, naśladuje rybkę.","Twister (z ogonem w kształcie sierpa) — mocno wibruje nawet prz
