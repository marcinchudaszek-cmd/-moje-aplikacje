:0,julia:!0,jx:-.8,jy:.156,view:{x:0,y:0,span:2.4},palette:"neon"},{id:"julia-krolik",name:"Julia: królik Douady’ego",desc:"c = −0,123 + 0,745i",type:0,julia:!0,jx:-.123,jy:.745,view:{x:0,y:0,span:2.8},palette:"lod"},{id:"julia-galaktyka",name:"Julia: galaktyka",desc:"c = −0,7269 + 0,1889i",type:0,julia:!0,jx:-.7269,jy:.1889,view:{x:0,y:0,span:2.4},palette:"klasyczny"},{id:"julia-blyskawica",name:"Julia: błyskawica",desc:"c = i — dendryt bez wnętrza",type:0,julia:!0,jx:0,jy:1,view:{x:0,y:0,span:2.6},palette:"zorza"}];function Db(a,i){return{x:a.x,y:a.y,span:Math.max(a.h,a.w/i)*1.04}}const xn=[{id:0,name:"Mandelbrot",desc:"z² + c — klasyk wszech czasów",home:{x:-.65,y:0,w:2.7,h:2.5}},{id:1,name:"Płonący statek",desc:"(|Re z| + i|Im z|)² + c",home:{x:-.45,y:-.5,w:3.2,h:2.8}},{id:2,name:"Tricorn",desc:"z̄² + c — „Mandelbar”",home:{x:-.3,y:0,w:3.2,h:3.2}},{id:3,name:"Multibrot³",desc:"z³ + c — dwa płaty",home:{x:0,y:0,w:2.4,h:2.8}},{id:4,name:"Celtycki",desc:"|Re z²| + i·Im z² + c",home:{x:-.4,y:0,w:3.4,h:3}},{id:5,name:"Newton",desc:"z³ − 1 = 0 — baseny trzech pierwiastków",home:{x:0,y:0,w:3,h:3}},{id:6,name:"Phoenix",desc:"z² + c − ½·z₋₁ — z pamięcią",home:{x:-.2,y:0,w:3,h:2.6}},{id:7,name:"Prostopadły statek",desc:"x² − y² + c, −2x|y| — ostre iglice",home:{x:-.5,y:0,w:3.4,h:3}}],nc=[5];function c0(a){return a===5?2e-5:qb}const Lb={x:0,y:0,w:2.9,h:2.4},qb=2e-11,Fb=12;function Pr(a,i){const s=Math.max(0,Math.log10(3/a)),l=150+90*s+6*s*s;return Math.round(Math.min(8e3,Math.max(50,l*i)))}const Vb=[{title:"Czym jest fraktal?",paragraphs:["Fraktal to kształt, który w każdej skali wygląda podobnie: jego fragment przypomina całość, a fragment fragmentu — znowu całość. Tę cechę nazywa się samopodobieństwem. Nazwę wymyślił w 1975 roku matematyk Benoit Mandelbrot, od łacińskiego fractus — „połamany, nieregularny”.","Fraktale mają też wymiar ułamkowy. Linia ma wymiar 1, kwadrat 2, a brzeg fraktala potrafi mieć np. 1,26 — jest „czymś więcej” niż krzywa, ale nie wypełnia płaszczyzny. Brzeg zbioru Mandelbrota jest tak poszarpany, że jego wymiar wynosi aż 2 (udowodnił to Mitsuhiro Shishikura w 1998 roku).","W przyrodzie fraktali jest pełno: paprocie, kalafior romanesco, korony drzew, błyskawice, sieci rzek, naczynia krwionośne i płuca. Linia brzegowa też jest fraktalem — im dokładniej ją mierzysz, tym wychodzi dłuższa. Mandelbrot opisał to w słynnym artykule z 1967 roku o długości wybrzeża Wielkiej Brytanii."]},{title:"Jak powstaje ten obraz?",paragraphs:["Każdy piksel to liczba zespolona c — punkt na płaszczyźnie. Zaczynamy od z = 0 i w kółko powtarzamy jedno proste działanie, np. z → z² + c. Albo wynik ucieka do nieskończoności, albo na zawsze zostaje w pobliżu początku.","Punkty, które nigdy nie uciekają, należą do zbioru — to czarne obszary. Kolor pozostałych mówi, jak szybko uciekły: po kilku krokach czy po tysiącu. Najpiękniejsze wzory powstają na granicy, gdzie o losie punktu decydują ułamki milionowych części.","Im głębiej przybliżasz, tym więcej kroków trzeba policzyć, żeby rozstrzygnąć, czy punkt ucieka. Dlatego aplikacja sama zwiększa liczbę iteracji, a od powiększenia około ×100 000 przechodzi na emulowaną podwójną precyzję (znaczek FP64). Liczby zwykłej precyzji są już wtedy za mało dokładne i obraz rozpadłby się na kwadraty."]},{title:"Mandelbrot i Julia — mapa i krajobrazy",paragraphs:["Zbiory Julii badali Gaston Julia i Pierre Fatou około 1918 roku, długo przed komputerami — nikt wtedy nie widział, jak wyglądają. W zbiorze Julii stała c jest jedna dla całego obrazu, a piksel wyznacza punkt startowy z.","Zbiór Mandelbrota to mapa wszystkich zbiorów Julii. Jeśli wybierzesz c z czarnego wnętrza zbioru Mandelbrota, jego zbiór Julii będzie jednym spójnym kształtem. Jeśli c leży na zewnątrz, Julia rozsypie się w „pył” oddzielnych punktów. Najciekawsze są punkty tuż przy brzegu — wypróbuj przycisk Julia w różnych miejscach.","Pierwsze komputerowe obrazy zbioru Mandelbrota powstały pod koniec lat 70. Sam Mandelbrot pokazał go w 1980 roku, pracując w IBM, a w 1985 trafił na okładkę „Scientific American” — od tego zaczęła się popularność fraktali."]}],sp={0:{formula:"z → z² + c",text:["Najsłynniejszy fraktal świata i najprostszy możliwy wzór. Główne „ciało” to kardioida (kształt serca), do której przyrastają koła, a do nich kolejne, coraz mniejsze.","Wszędzie na brzegu kryją się miniaturowe kopie całego zbioru, połączone z nim cienkimi włóknami — zbiór jest spójny, choć z bliska tego nie widać."]},1:{formula:"z → (|Re z| + i·|Im z|)² + c",text:["Odkryty w 1992 roku przez Michaela Michelitscha i Otto Rösslera. Różni się od Mandelbrota jednym szczegółem: przed podniesieniem do kwadratu obie części liczby stają się dodatnie.","Ta drobna zmiana łamie symetrię i daje obraz płonącego okrętu z masztami. Wzdłuż osi płynie cała flota mniejszych statków (zobacz miejsce „Armada”)."]},2:{formula:"z → z̄² + c",text:["Zamiast z bierzemy sprzężenie z̄ — odbicie lustrzane względem osi poziomej. Nazwę „tricorn” (trójgraniasty kapelusz) nadał mu John Milnor w 1992 roku, a bywa też nazywany Mandelbarem.","Ma symetrię trzykrotną, a jego brzeg zamiast gładkich spiral tworzy charakterystyczne pofalowane, „rozmyte” linie."]},3:{formula:"z → z³ + c",text:["Multibroty to rodzina z dowolną potęgą zamiast kwadratu. Potęga 3 daje dwa płaty i symetrię dwukrotną, potęga d daje d − 1 płatów.","Na brzegu powtarzają się podobne motywy co u Mandelbrota — spirale, koła i miniaturowe kopie całego zbioru, tyle że w nowym, symetrycznym układzie."]},4:{formula:"z → |Re(z²)| + i·Im(z²) + c",text:["Kuzyn Mandelbrota z wartością bezwzględną wziętą tylko z części rzeczywistej kwadratu. Powstaje dzięki temu wzór przypominający celtyckie plecionki i koronki.","To jeden z wielu „abs-wariantów”, które amatorzy fraktali odkrywali hurtowo, sprawdzając, co da wstawienie wartości bezwzględnej w różne miejsca wzoru."]},5:{formula:"z → z − (z³ − 1) / 3z²",text:["Zupełnie inny rodzaj fraktala. Metoda Newtona to sposób szukania pierwiastków równania: zgadujesz, poprawiasz, poprawiasz… Równanie z³ = 1 ma trzy rozwiązania, więc każdy punkt startowy w końcu trafia do jednego z nich.","Kolor mówi, do którego. Arthur Cayley już w 1879 roku pytał, jak wyglądają granice między tymi „basenami”, i nie umiał odpowiedzieć. Odpowiedź jest zaskakująca: w każdym punkcie granicy stykają się wszystkie trzy kolory naraz."]},6:{formula:"zₙ₊₁ = zₙ² + c + p·zₙ₋₁",text:["Fraktal z pamięcią: nowy krok zależy nie tylko od bieżącej wartości, ale też od poprzedniej (tu p = −½). Opisał go Shigehiro Ushiki w 1988 roku.","Najbardziej znany jest jego zbiór Julii dla c ≈ 0,5667 — przypomina rozpostarte skrzydła, stąd nazwa Feniks (zobacz miejsce „Feniks”)."]},7:{formula:"x → x² − y² + a,  y → −2x·|y| + b",text:["Wariant Płonącego statku, w którym wartość bezwzględna obejmuje tylko część urojoną, i to w innym miejscu wzoru.","Zamiast okrętu powstają ostre, pionowe iglice i strzeliste konstrukcje, ułożone prostopadle do osi — stąd nazwa."]}},Pb={0:"⁰",1:"¹",2:"²",3:"³",4:"⁴",5:"⁵",6:"⁶",7:"⁷",8:"⁸",9:"⁹","-":"⁻"};function ac(a,i=3){const s=i/a;if(s<10)return"×"+s.toFixed(1).replace(".",",");if(s<1e3)return"×"+Math.round(s);if(s<1e6)return"×"+(s/1e3).toFixed(1).replace(".",",")+" tys.";const l=Math.floor(Math.log10(s));return"×"+(s/10**l).toFixed(1).replace(".",",")+"·10"+String(l).split("").map(f=>Pb[f]).join("")}function zl(a,i){const s=Math.min(17,Math.max(3,Math.ceil(-Math.log10(i))+3));return a.toFixed(s)}function Uc(a,i,s=1e-4){const l=zl(a,s),c=zl(Math.abs(i),s);return`${l} ${i<0?"−":"+"} ${c}i`}const Gb="https://beagleapps.pl/apps/fraktal/",gl=a=>String(+a.toPrecision(17));function Xb(a){const i=new URLSearchParams;return i.set("t",String(a.type)),i.set("x",gl(a.view.x)),i.set("y",gl(a.view.y)),i.set("s",a.view.span.toPrecision(6)),a.julia&&(i.set("jx",gl(a.jx)),i.set("jy",gl(a.jy))),a.colors?(i.set("pc",a.colors.map(s=>s.slice(1)).join("-")),a.interior&&i.set("pi",a.interior.slice(1))):i.set("p",a.palette),a.density!==1&&i.set("d",a.den
