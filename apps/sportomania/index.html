ą emisje, finansując sadzenie lasów i inwestycje w energię odnawialną. Krytycy zauważają jednak, że najskuteczniejsze jest po prostu ograniczenie lotów.",category:"ecology",year:2020,emoji:"🌳"},{id:"ec10",text:"Wielkie maratony rezygnują z jednorazowych kubków na rzecz stacji z wielorazowymi bidonami i gąbkami. Po dużym biegu z ulic znikały wcześniej setki tysięcy plastikowych naczyń.",category:"ecology",year:2019,emoji:"🥤"},{id:"ec11",text:"Powstają projekty stadionów budowanych niemal w całości z drewna konstrukcyjnego. Taki obiekt ma wielokrotnie mniejszy ślad węglowy niż porównywalna konstrukcja z betonu i stali.",category:"ecology",year:2019,emoji:"🪵"},{id:"ec12",text:"Coraz więcej klubów wlicza w cenę biletu przejazd komunikacją miejską. Rozwiązanie zmniejsza korki wokół stadionu i emisje w dniu meczowym.",category:"ecology",year:2010,emoji:"🚌"},{id:"fp9",text:"Robbie Fowler po podyktowaniu karnego na jego korzyść tłumaczył sędziemu, że nie było faulu, i prosił o cofnięcie decyzji. Za tę postawę otrzymał nagrodę fair play UEFA.",category:"fairplay",year:1997,emoji:"🙋"},{id:"fp10",text:"Gdy gol pada w okolicznościach uznanych za nieuczciwe, drużyny czasem pozwalają rywalom odpowiedzieć trafieniem bez obrony. Taki gest zdarzał się i w niższych ligach, i w wielkich pucharach.",category:"fairplay",year:1999,emoji:"🤲"},{id:"fp11",text:"W narciarstwie i kolarstwie zdarza się, że zawodnik oddaje rywalowi sprzęt po awarii — narty, koło, a nawet cały rower. Przepisy tego nie nakazują, robi to zwykła sportowa przyzwoitość.",category:"fairplay",year:2018,emoji:"🔧"},{id:"fp12",text:"FIFA przyznaje nagrodę fair play od 1987 roku. Otrzymywali ją nie tylko zawodnicy, ale też całe drużyny, kibice, a nawet grupy sportowców z krajów pozostających w konflikcie.",category:"fairplay",year:1987,emoji:"🏅"},{id:"fa9",text:"Jos Verstappen ścigał się w Formule 1, a jego syn Max został mistrzem świata. Ojciec woził go po Europie na wyścigi gokartów, sam serwisując silniki w przyczepie.",category:"families",year:2021,emoji:"🏎️"},{id:"fa10",text:"Ken Griffey senior i junior grali w jednym składzie baseballowym — i w tym samym meczu obaj zdobyli home runy. To jedyny taki przypadek ojca i syna w historii ligi.",category:"families",year:1990,emoji:"⚾"},{id:"fa11",text:"Dell Curry grał w NBA, a jego synowie Stephen i Seth poszli w jego ślady. Rodzina Curry zmieniła koszykówkę, czyniąc z rzutu za trzy punkty podstawową broń.",category:"families",year:2015,emoji:"🎯"},{id:"fa12",text:"Bracia Boateng zagrali przeciwko sobie na mistrzostwach świata — jeden w barwach Niemiec, drugi Ghany. Ich matka przyznała, że nie potrafiła wybrać, komu kibicować.",category:"families",year:2010,emoji:"🌍"},{id:"fi9",text:"Pierwszy mecz piłkarski przy sztucznym oświetleniu rozegrano w Sheffield w 1878 roku. Lampy łukowe zasilały maszyny parowe, a na trybunach zjawiły się tysiące ciekawskich.",category:"firsts",year:1878,emoji:"💡"},{id:"fi10",text:"Przez większość historii futbolu zmiany były zakazane — kontuzjowany zawodnik schodził, a drużyna grała w osłabieniu. Zmienników dopuszczono na mundialu dopiero w 1970 roku.",category:"firsts",year:1970,emoji:"🔄"},{id:"fi11",text:"Pierwszą czerwoną kartkę w historii mistrzostw świata zobaczył Chilijczyk Carlos Caszely w 1974 roku — kilka lat po tym, jak wprowadzono system kartek.",category:"firsts",year:1974,emoji:"🟥"},{id:"fi12",text:"Pierwszego hat-tricka w historii mundiali strzelił w 1930 roku Amerykanin Bert Patenaude. FIFA oficjalnie uznała ten wyczyn dopiero po siedemdziesięciu latach analiz archiwów.",category:"firsts",year:1930,emoji:"3️⃣"},{id:"fs9",text:"W Polsce najpopularniejszą metodą sportową jest spinning — łowienie drapieżników na sztuczne przynęty prowadzone w wodzie. Zawody rozgrywa się z brzegu i z łodzi.",category:"fishing",year:1990,emoji:"🐟"},{id:"fs10",text:"Echosondy i kamery podwodne bywają w zawodach ograniczane lub zakazane. Organizatorzy chcą, by o wyniku decydowała umiejętność czytania wody, a nie sam sprzęt elektroniczny.",category:"fishing",year:2015,emoji:"📡"},{id:"fs11",text:"Rekordy wielkości ryb rejestruje się na podstawie zdjęć, pomiarów i zeznań świadków. Część rekordowych okazów po zważeniu wraca do wody, bo dokumentacja wystarcza do zatwierdzenia.",category:"fishing",year:2e3,emoji:"📸"},{id:"fs12",text:"W brytyjskim „match fishing” zawodnicy losują stanowiska tuż przed startem. Ma to wykluczyć przewagę tych, którzy wcześniej zanęcili najlepsze miejsca.",category:"fishing",year:1970,emoji:"🎲"},{id:"gk9",text:"Trenerzy bramkarzy stali się standardem w sztabach dopiero od lat 90. Wcześniej golkiperzy ćwiczyli z resztą drużyny albo sami wymyślali sobie zajęcia.",category:"goalkeepers",year:1990,emoji:"🧑‍🏫"},{id:"gk10",text:"Rękawice bramkarskie mają lateksowe chwyty, które ścierają się po kilku meczach. Golkiperzy zużywają ich w sezonie kilkadziesiąt par, a przed meczem zwilżają je wodą.",category:"goalkeepers",year:2e3,emoji:"💧"},{id:"gk11",text:"Bramkarz rzadko bywa kapitanem, bo trudniej mu dyrygować drużyną z odległości. Wyjątki, jak Buffon czy Casillas, prowadziły swoje zespoły po mistrzostwo świata.",category:"goalkeepers",year:2010,emoji:"🎽"},{id:"gk12",text:"W futsalu bramkarz może grać jako dodatkowy zawodnik z pola. Drużyna przegrywająca często ryzykuje taką grę „na piątkę”, zostawiając własną bramkę pustą.",category:"goalkeepers",year:2e3,emoji:"⚡"},{id:"ic9",text:"Lód hokejowy ma zaledwie około dwóch centymetrów grubości i jest twardszy oraz zimniejszy niż tafla do łyżwiarstwa figurowego, która musi być bardziej miękka pod lądowania.",category:"ice",year:1990,emoji:"📏"},{id:"ic10",text:"W short tracku zawodnicy podpierają się dłonią o lód na wirażach. Noszą kevlarowe kombinezony chroniące przed ostrzami i rękawice z twardymi nakładkami na palcach.",category:"ice",year:1992,emoji:"🧤"},{id:"ic11",text:"Hokejowe przepisy o spalonym i „icingu” mają zmuszać drużyny do rozegrania akcji zamiast wybijania krążka na oślep. To one nadają grze charakterystyczne tempo.",category:"ice",year:1937,emoji:"🚩"},{id:"ic12",text:"Łyżwy ostrzy się przed niemal każdym meczem, a zawodnicy mają wyczucie różnicy rzędu ułamków milimetra. Wielu wozi ze sobą własną ostrzarkę i nie ufa nikomu innemu.",category:"ice",year:2e3,emoji:"🔪"},{id:"mw9",text:"W judo idealnie wykonany rzut, czyli ippon, kończy walkę natychmiast — niezależnie od tego, ile czasu zostało do końca. To nagroda za technikę, nie za przewagę punktową.",category:"martial",year:1900,emoji:"⚡"},{id:"mw10",text:"W karate rywalizuje się w dwóch formach: kata to układ ruchów wykonywany solo i oceniany przez sędziów, a kumite to walka z przeciwnikiem.",category:"martial",year:1970,emoji:"🥋"},{id:"mw11",text:"Sanda to sportowa odmiana chińskiego wushu — walka na podwyższonym podeście, z której można spaść. Zepchnięcie rywala z maty jest punktowane.",category:"martial",year:1979,emoji:"🇨🇳"},{id:"mw12",text:"W brazylijskim jiu-jitsu walka toczy się głównie w parterze, a celem jest zmuszenie rywala do poddania się. Kolory pasów oznaczają wieloletnią drogę — do czarnego idzie się zwykle około dekady.",category:"martial",year:1925,emoji:"🥋"},{id:"ma9",text:"W 1953 roku Węgry rozbiły Anglię na Wembley 6:3 — gospodarze po raz pierwszy przegrali u siebie z drużyną spoza Wysp Brytyjskich. Mecz zmusił Anglików do przemyślenia całej taktyki.",category:"matches",year:1953,emoji:"🇭🇺"},{id:"ma10",text:"Blok LeBrona Jamesa w decydującym meczu finałów NBA 2016 przeszedł do historii jako „The Block”. Cleveland odrobiło wtedy stratę 1:3 w serii — czego nikt wcześniej nie dokonał w finale.",category:"matches",year:2016,emoji:"🚫"},{id:"ma11",text:"W półfinale Ligi Mistrzów 2022 Real Madryt strzelił Manchesterowi City dwa gole w półtorej minuty doliczonego czasu i wygrał po dogrywce. Kilka tygodni później sięgnął po puchar.",category:"matches",year:2022,emoji:"⏱️"},{id:"ma12",text:"Finał mistrzostw świata 2010 rozstrzygnął się dopiero w 116. minucie, po golu Andrésa Iniesty. Był to najbardziej faulowany finał w historii — sędzia pokazał czternaście żółtych kartek.",category:"matches",year:2010,emoji:"🇪🇸"},{id:"mn9",text:"Psycholog sportowy jest dziś stałym członkiem sztabu w wielu kadrach. Pracuje nad radzeniem sobie z presją, koncentracją i powrotem do formy po kontuzji.",category:"mind",year:2e3,emoji:"🧑‍⚕️"},{id:"mn10",text:"Stan „flow” to poczucie całkowitego zanurzenia w wykonywanej czynności, gdy działanie przychodzi bez wysiłku. Sportowcy opisują go jako moment, w którym „ciało wie samo, co robić”.",category:"mind",year:1975,emoji:"🌊"},{id:"mn11",text:"Zawodnicy trenują „mowę wewnętrzną” — krótkie hasła powtarzane w kluczowych momentach. Badania pokazują, że dobrze dobrane słowa poprawiają technikę i wytrwałość.",category:"mind",year:2011,emoji:"💭"},{id:"mn12",text:"Statystyki konkursów rzutów karnych pokazują, że drużyna wykonująca pierwszą jedenastkę wygrywa nieco częściej. Presja rośnie bowiem po stronie tych, którzy muszą odpowiadać.",category:"mind",year:2010,emoji:"📊"},{id:"nk9",text:"Brazylijskiego Ronaldo nazwano we Włoszech „Il Fenomeno” — zjawiskiem. Przydomek przylgnął po sezonie, w którym jako dwudziestolatek rozbijał najlepsze obrony świata.",category:"nicknames",year:1997,emoji:"🌟"},{id:"nk10",text:"Jacka Nicklausa nazywano „Złotym Niedźwiedziem” — od blond czupryny i potężnej sylwetki. Przydomek stał się później marką odzieżową i logo jego pól golfowych.",category:"nicknames",year:1962,emoji:"🐻"},{id:"nk11",text:"Michael Schumacher bywał nazywany „Czerwonym Baronem” — od czerwieni Ferrari i słynnego niemieckiego pilota myśliwskiego z pierwszej wojny światowej.",category:"nicknames",year:2e3,emoji:"🔴"},{id:"nk12",text:"Larry'ego Birda przezywano „chłopakiem z French Lick” — od nazwy maleńkiego miasteczka, z którego pochodził. Przydomek podkreślał kontrast między prowincją a wielką sceną NBA.",category:"nicknames",year:1980,emoji:"🏘️"},{id:"nd9",text:"Bjørn Dæhlie zdobył osiem złotych medali olimpijskich w biegach narciarskich. Norweg słynął z tego, że latem trenował na nartorolkach po asfaltowych drogach w górach.",category:"nordic",year:1998,emoji:"🇳🇴"},{id:"nd10",text:"W sztafecie 4×10 km dwie pierwsze zmiany biegnie się techniką klasyczną, a dwie kolejne łyżwową. Zawodnicy muszą więc mieć opanowane oba style na najwyższym poziomie.",category:"nordic",year:1992,emoji:"🔗"},{id:"nd11",text:"Sprint w biegach narciarskich rozgrywa się w rundach — od kwalifikacji, przez ćwierćfinały, po sześcioosobowy finał. Format wprowadzono na początku XXI wieku, by uatrakcyjnić transmisje.",category:"nordic",year:2001,emoji:"⚡"},{id:"nd12",text:"Karabin biathlonisty waży co najmniej trzy i pół kilograma i przez cały bieg spoczywa na plecach zawodnika. Amunicję trzyma się w magazynkach przy kolbie.",category:"nordic",year:1978,emoji:"🎒"},{id:"nu9",text:"W kolarstwie numer startowy 1 przysługuje obrońcy tytułu z poprzedniego roku. Reszta ekipy dostaje kolejne numery, więc po samej tarczy widać hierarchię w drużynie.",category:"numbers",year:1930,emoji:"1️⃣"},{id:"nu10",text:"Mistrz świata Formuły 1 ma prawo jeździć z numerem 1. Nie wszyscy z tego korzystają — niektórzy zostają przy swoich stałych numerach, uznając je za część własnej marki.",category:"numbers",year:2014,emoji:"🏎️"},{id:"nu11",text:"W siatkówce numery są ograniczone do wąskiego zakresu, a libero musi mieć koszulkę w kontrastowym kolorze. Dzięki temu sędziowie od razu widzą, kto nie może atakować z przodu.",category:"numbers",year:1998,emoji:"🏐"},{id:"nu12",text:"Numer startowy w biegach masowych to dziś także układ elektroniczny — wszyty chip mierzy czas od przekroczenia linii startu, a nie od wystrzału startera.",category:"numbers",year:1996,emoji:"⏱️"},{id:"of9",text:"Międzynarodowa federacja lekkoatletyczna zmieniła w 2019 roku nazwę na World Athletics. Chodziło o uproszczenie wizerunku po latach kryzysów wywołanych aferami dopingowymi.",category:"officials",year:2019,emoji:"🔤"},{id:"of10",text:"UEFA powstała w 1954 roku i zrzesza dziś 55 federacji — w tym kraje leżące częściowo lub całkowicie w Azji, jak Izrael czy Kazachstan.",category:"officials",year:1954,emoji:"🇪🇺"},{id:"of11",text:"Na kongresie FIFA każda federacja ma jeden głos — mała wyspa waży tyle samo co potęga futbolu. Ta zasada od dekad kształtuje politykę w światowej piłce.",category:"officials",year:1960,emoji:"🗳️"},{id:"of12",text:"Na świecie działa ponad dwieście narodowych komitetów olimpijskich — więcej, niż jest państw uznawanych przez ONZ. Własne komitety mają m.in. terytoria zależne.",category:"officials",year:2020,emoji:"🌐"},{id:"pa9",text:"Pierwsze zimowe igrzyska paraolimpijskie odbyły się w Szwecji w 1976 roku. Startowali w nich głównie narciarze po amputacjach i osoby z dysfunkcją wzroku.",category:"para",year:1976,emoji:"🎿"},{id:"pa10",text:"Klasyfikacja zawodników bywa źródłem sporów — od przydzielonej klasy zależy, z kim się rywalizuje. Federacje regularnie weryfikują oceny, a odwołania trafiają aż do trybunału arbitrażowego.",category:"para",year:2016,emoji:"⚖️"},{id:"pa11",text:"Niewidomi biegacze startują z przewodnikiem połączonym z nimi krótką linką. Przewodnik również otrzymuje medal — bez jego pracy start w ogóle nie byłby możliwy.",category:"para",year:2012,emoji:"🤝"},{id:"pa12",text:"W parahokeju zawodnicy siedzą na saniach i posługują się dwoma krótkimi kijami — jednym końcem odbijają krążek, drugim, zakończonym kolcami, odpychają się od lodu.",category:"para",year:1994,emoji:"🛷"},{id:"qu9",text:"Nelson Mandela mówił, że sport ma moc zmieniania świata i jednoczenia ludzi w sposób, w jaki niewiele rzeczy potrafi. Sam udowodnił to podczas mistrzostw świata w rugby w 1995 roku.",category:"quotes",year:2e3,emoji:"🕊️"},{id:"qu10",text:"Ayrton Senna tłumaczył, że jeśli kierowca widzi lukę i w nią nie wjeżdża, to przestaje być kierowcą wyścigowym. To zdanie do dziś cytują zawodnicy przed każdym wyprzedzaniem.",category:"quotes",year:1990,emoji:"🏎️"},{id:"qu11",text:"Muhammad Ali powtarzał „jestem najlepszy” jeszcze zanim został mistrzem. Sam przyznawał, że mówił to, by w to uwierzyć — najpierw on, potem cała reszta.",category:"quotes",year:1964,emoji:"🥊"},{id:"qu12",text:"„Ciężka praca bije talent, gdy talent nie pracuje ciężko” — hasło z sal treningowych, spopularyzowane przez koszykarzy, wisi dziś w tysiącach szkolnych siłowni na całym świecie.",category:"quotes",year:2010,emoji:"💪"},{id:"rq9",text:"Piłeczka do tenisa stołowego potrafi rotować z prędkością kilku tysięcy obrotów na minutę. To dlatego przy tym samym uderzeniu odbija się w zupełnie różne strony.",category:"racquet",year:2e3,emoji:"🌀"},{id:"rq10",text:"Piłkę do squasha trzeba najpierw rozgrzać uderzeniami, inaczej prawie się nie odbija. Kropki na niej oznaczają szybkość — im wolniejsza piłka, tym dla lepszych graczy.",category:"racquet",year:1970,emoji:"🔴"},{id:"rq11",text:"Rakieta badmintonowa waży zaledwie około 85 gramów — mniej niż dwie tabliczki czekolady. Naciąg jest przy tym napięty tak mocno, że potrafi pęknąć od zmiany temperatury.",category:"racquet",year:2e3,emoji:"🪶"},{id:"rq12",text:"Padel to najszybciej rosnący sport rakietowy świata. Gra się w nim na mniejszym korcie otoczonym szklanymi ścianami, od których wolno odbijać piłkę jak w squashu.",category:"racquet",year:2020,emoji:"🎾"},{id:"rv9",text:"Rywalizacja Michaela Schumachera z Miką Häkkinenem zdefiniowała przełom wieków w Formule 1. Ich pojedynek na torze Spa w 2000 roku, z wyprzedzaniem przy 300 km/h, uchodzi za wzorcowy.",category:"rivalries",year:2e3,emoji:"🏁"},{id:"rv10",text:"Spór o miano najszybszego człowieka świata między Michaelem Johnsonem a Donovanem Baileyem rozstrzygano w 1997 roku specjalnym biegiem na 150 metrów — dystansie, którego nie ma w programie żadnych zawodów.",category:"rivalries",year:1997,emoji:"💨"},{id:"rv11",text:"Bradley Wiggins i Chris Froome ścigali się o zwycięstwo w Tour de France, jadąc w tej samej drużynie. Napięcie między liderami jednej ekipy bywa większe niż rywalizacja z konkurencją.",category:"rivalries",year:2012,emoji:"🚴"},{id:"rv12",text:"Martin Fourcade i Ole Einar Bjørndalen dzielili biathlonową scenę przez lata — Norweg jako rekordzista medali, Francuz jako jego następca. Obaj wygrywali Puchar Świata po kilka razy z rzędu.",category:"rivalries",year:2016,emoji:"🎯"},{id:"rw9",text:"Ruch wioślarza dzieli się na fazy: „chwyt”, gdy wiosło wchodzi do wody, i „wykończenie”, gdy je wyjmuje. Cała ósemka musi robić to w tej samej setnej sekundy.",category:"rowing",year:1900,emoji:"🎯"},{id:"rw10",text:"Wioślarze siedzą na ruchomych siodełkach jeżdżących po szynach — dzięki temu do napędu pracują przede wszystkim nogi, a nie ramiona, jak podpowiadałaby intuicja.",category:"rowing",year:1857,emoji:"🦵"},{id:"rw11",text:"Łodzie różnią się liczbą wioseł na zawodnika: w wiosłowaniu podwójnym każdy trzyma dwa, a w pojedynczym tylko jedno, po jednej stronie. Stąd nazwy jak „czwórka bez sternika”.",category:"rowing",year:1900,emoji:"🚣"},{id:"rw12",text:"Regaty Henley Royal Regatta odbywają się od 1839 roku i mają własny kodeks ubioru dla widzów. W niektórych sektorach panom wciąż nie wolno wejść bez marynarki.",category:"rowing",year:1839,emoji:"🎩"},{id:"sf9",text:"Ochraniacze na zęby są obowiązkowe w większości sportów kontaktowych. Chronią nie tylko uzębienie — amortyzują też uderzenia w żuchwę, zmniejszając ryzyko wstrząśnienia mózgu.",category:"safety",year:1960,emoji:"🦷"},{id:"sf10",text:"Na torach żużlowych stosuje się dziś dmuchane bandy zamiast dawnych drewnianych płotów. Miękka bariera pochłania uderzenie zawodnika pędzącego ponad 70 km/h bez hamulców.",category:"safety",year:2e3,emoji:"🎈"},{id:"sf11",text:"W Formule 1 samochód medyczny z lekarzem jedzie za stawką przez całe pierwsze okrążenie — właśnie wtedy, gdy ryzyko kraksy jest największe.",category:"safety",year:1993,emoji:"🚑"},{id:"sf12",text:"Liga futbolu amerykańskiego ograniczyła liczbę treningów w pełnym kontakcie. Badania pokazały, że to nie mecze, lecz codzienne zderzenia na treningach dawały największe obciążenie dla głowy.",category:"safety",year:2011,emoji:"🛑"},{id:"sl9",text:"Michael Jordan po zakończeniu kariery został właścicielem klubu NBA. Jako pierwszy były zawodnik ligi objął większościowe udziały w drużynie.",category:"secondlife",year:2010,emoji:"💼"},{id:"sl10",text:"David Beckham wykorzystał zapisaną w kontrakcie opcję i za symboliczną kwotę założył własny klub w Miami. Dziś jest jednym z jego współwłaścicieli.",category:"secondlife",year:2018,emoji:"🌴"},{id:"sl11",text:"Magic Johnson po zakończeniu kariery zbudował imperium biznesowe i został współwłaścicielem klubu baseballowego. Inwestował głównie w dzielnice, z których sam pochodził.",category:"secondlife",year:2012,emoji:"📈"},{id:"sl12",text:"Andrij Szewczenko po futbolu spróbował zawodowego golfa, później został selekcjonerem reprezentacji, a następnie prezesem ukraińskiej federacji piłkarskiej.",category:"secondlife",year:2022,emoji:"⛳"},{id:"sn9",text:"Chorwacja, licząca około czterech milionów mieszkańców, dotarła do finału mistrzostw świata w 2018 roku i po brąz sięgnęła cztery lata później. To fenomen w skali światowego futbolu.",category:"smallnations",year:2018,emoji:"🇭🇷"},{id:"sn10",text:"Urugwaj z niespełna czterema milionami mieszkańców dwukrotnie zdobył mistrzostwo świata. Na koszulkach reprezentacji widnieją cztery gwiazdki — kraj wlicza także dwa złota olimpijskie.",category:"smallnations",year:1950,emoji:"🇺🇾"},{id:"sn11",text:"Słowenia, mająca około dwóch milionów mieszkańców, wydała jednocześnie najlepszego kolarza i jedną z gwiazd NBA. Trudno o lepszy przykład sportowej efektywności małego kraju.",category:"smallnations",year:2021,emoji:"🇸🇮"},{id:"sn12",text:"Nowa Zelandia z pięcioma milionami mieszkańców dominuje w rugby i wielokrotnie wygrywała Puchar Ameryki w żeglarstwie — najbardziej prestiżowe regaty świata.",category:"smallnations",year:2021,emoji:"🇳🇿"},{id:"sb9",text:"Deski dzielą się na kierunkowe, przeznaczone do jazdy w jedną stronę, i symetryczne „twin-tip”, którymi jeździ się przodem i tyłem. Freestyle wymaga tych drugich.",category:"snowboard",year:1995,emoji:"🎿"},{id:"sb10",text:"Wiązania miękkie dają swobodę ruchu potrzebną do trików, a twarde, przypominające narciarskie, zapewniają precyzję w konkurencjach szybkościowych. To praktycznie dwa różne sporty.",category:"snowboard",year:1998,emoji:"🔗"},{id:"sb11",text:"Slalom równoległy to jedyna czysto szybkościowa konkurencja snowboardowa na igrzyskach obok crossu. Dwóch zawodników ściga się jednocześnie na bliźniaczych trasach.",category:"snowboard",year:2002,emoji:"⏱️"},{id:"sb12",text:"Chloe Kim zdobyła olimpijskie złoto w halfpipie w wieku 17 lat, a cztery lata wcześniej była już zbyt młoda, by wystartować mimo wygrywania zawodów z dorosłymi.",category:"snowboard",year:2018,emoji:"🥇"},{id:"st9",text:"Trójbój siłowy składa się z przysiadu, wyciskania leżąc i martwego ciągu. Wynik to suma najlepszych podejść — dlatego liczy się równomierna siła, a nie jeden mocny bój.",category:"strength",year:1972,emoji:"🏋️"},{id:"st10",text:"Olimpijskie podnoszenie ciężarów to dwa boje: rwanie, w którym sztangę wyrzuca się nad głowę jednym ruchem, i podrzut, wykonywany w dwóch fazach z przystankiem na klatce piersiowej.",category:"strength",year:1972,emoji:"🥇"},{id:"st11",text:"W zawodach strongman konkurencje zmieniają się co roku — od ciągnięcia ciężarówek po spacer farmera. Zawodnicy nigdy nie wiedzą, do czego dokładnie będą się przygotowywać.",category:"strength",year:1977,emoji:"🚚"},{id:"st12",text:"W najcięższej kategorii ciężarowców nie ma górnego limitu wagi. To właśnie tam padają rekordy świata, a zawodnicy ważą nierzadko ponad 150 kilogramów.",category:"strength",year:2e3,emoji:"⚖️"},{id:"su9",text:"Piłkarze potrafią grać w tych samych korkach przez całą zwycięską serię, nawet gdy są już zniszczone. Zmiana butów po wygranej uchodzi za proszenie się o kłopoty.",category:"superstitions",year:2e3,emoji:"👟"},{id:"su10",text:"Kibice mają własne rytuały — oglądanie meczu w tym samym fotelu, w tej samej koszulce, a nawet wychodzenie z pokoju, gdy „ich obecność” psuje wynik.",category:"superstitions",year:2e3,emoji:"🛋️"},{id:"su11",text:"W autokarach drużynowych zawodnicy zajmują zawsze te same miejsca. Zmiana ustalonego porządku bywa traktowana przez szatnię jako poważne naruszenie zasad.",category:"superstitions",year:1990,emoji:"🚌"},{id:"su12",text:"Krąży przekonanie o „klątwie okładki” — sportowiec sfotografowany na okładce magazynu lub gry wkrótce traci formę albo łapie kontuzję. Statystycy tłumaczą to zwykłym powrotem do średniej.",category:"superstitions",year:2002,emoji:"📕"},{id:"tg9",text:"W 1985 roku pożar drewnianej trybuny na stadionie w Bradford pochłonął dziesiątki ofiar. Ogień rozprzestrzenił się w kilka minut od śmieci nagromadzonych pod deskami.",category:"tragedies",year:1985,emoji:"🔥"},{id:"tg10",text:"Katastrofa na stadionie Ibrox w Glasgow w 1971 roku wydarzyła się na zatłoczonych schodach po zakończeniu derbów. Zginęły dziesiątki kibiców schodzących z trybun.",category:"tragedies",year:1971,emoji:"🕯️"},{id:"tg11",text:"W 1970 roku w katastrofie lotniczej zginęła niemal cała akademicka drużyna futbolowa Marshall University wraz ze sztabem. Uczelnia odbudowała zespół od podstaw, o czym opowiada film „Byliśmy bohaterami”.",category:"tragedies",year:1970,emoji:"✈️"},{id:"tg12",text:"Finał baseballowej World Series w 1989 roku przerwało trzęsienie ziemi, które nawiedziło rejon Zatoki San Francisco tuż przed pierwszym rzutem. Rozgrywki wznowiono dopiero po dziesięciu dniach.",category:"tragedies",year:1989,emoji:"🌎"},{id:"tf9",text:"Zawodnik bez ważnego kontraktu jest „wolnym agentem” i może podpisać umowę z dowolnym klubem. Największe gwiazdy potrafią celowo doczekać tego statusu, by samodzielnie wybrać przyszłość.",category:"transfers",year:1995,emoji:"🕊️"},{id:"tf10",text:"W amerykańskich ligach istnieje „buyout” — klub wypłaca zawodnikowi część kontraktu, by zwolnić miejsce w składzie. Gracz staje się wtedy wolny i może podpisać nową umowę.",category:"transfers",year:2e3,emoji:"✂️"},{id:"tf11",text:"Wypożyczenie z obowiązkiem wykupu to w praktyce rozłożony na raty transfer definitywny. Kluby stosują ten zabieg, by ominąć jednorazowy wydatek i przepisy o równowadze finansowej.",category:"transfers",year:2015,emoji:"🧾"},{id:"tf12",text:"Rekordy transferowe w piłce kobiet biją kolejne bariery co kilka sezonów. Kwoty wciąż są ułamkiem tych z męskiego futbolu, ale rosną najszybciej ze wszystkich dyscyplin.",category:"transfers",year:2024,emoji:"📈"},{id:"tp9",text:"Puchar Ameryki w żeglarstwie, ustanowiony w 1851 roku, uchodzi za najstarsze trofeum w międzynarodowym sporcie — jest starszy od nowożytnych igrzysk olimpijskich.",category:"trophies",year:1851,emoji:"⛵"},{id:"tp10",text:"Zdobywca Pucharu Świata w skokach narciarskich odbiera Kryształową Kulę. Trofeum jest ciężkie i kruche, więc zawodnicy podnoszą je nad głowę z wyraźną ostrożnością.",category:"trophies",year:1980,emoji:"🔮"},{id:"tp11",text:"Złota Piłka przez pierwsze dekady przysługiwała wyłącznie Europejczykom grającym w europejskich klubach. Zasady rozszerzano stopniowo, aż nagroda stała się w pełni światowa.",category:"trophies",year:1995,emoji:"🌍"},{id:"tp12",text:"Trofeum Ryder Cup to złoty puchar z figurką golfisty na wieczku. Jest zaskakująco mały jak na rangę rywalizacji — mierzy zaledwie kilkadziesiąt centymetrów.",category:"trophies",year:1927,emoji:"🏆"},{id:"uw9",text:"W nurkowaniu na bezdech istnieje kilka konkurencji głębokościowych — z płetwami, bez płetw i z podciąganiem się po linie. W każdej obowiązują inne rekordy.",category:"underwater",year:1996,emoji:"📏"},{id:"uw10",text:"Największym zagrożeniem dla freediverów jest utrata przytomności tuż pod powierzchnią, przy wynurzeniu. Dlatego każdemu zejściu towarzyszy asekurant czekający na ostatnich metrach.",category:"underwater",year:2e3,emoji:"⚠️"},{id:"uw11",text:"Nurkowanie pod lodem to osobna konkurencja — zawodnicy pokonują dziesiątki metrów pod zamarzniętą taflą, mając nad głową sufit, przez który nie da się wynurzyć.",category:"underwater",year:2010,emoji:"🧊"},{id:"uw12",text:"Freediver zabiera pod wodę monopłetwę, cienki kombinezon i precyzyjnie dobrane obciążenie. Zbyt duże utrudni wynurzenie, zbyt małe zmusi do walki z wyporem przez całe zejście.",category:"underwater",year:2005,emoji:"🤿"},{id:"up9",text:"Emma Raducanu wygrała US Open jako zawodniczka z kwalifikacji, nie tracąc po drodze ani jednego seta. Przed turniejem była poza pierwszą setką rankingu.",category:"upsets",year:2021,emoji:"🎾"},{id:"up10",text:"Boston Red Sox przegrywali w 2004 roku 0:3 w serii z Yankees i odrobili stratę, wygrywając cztery mecze z rzędu. To jedyny taki powrót w historii play-offów baseballu.",category:"upsets",year:2004,emoji:"🔄"},{id:"up11",text:"Villanova wygrała finał akademickich mistrzostw USA w 1985 roku, trafiając niemal wszystkie rzuty z gry. Do dziś uchodzi to za najbardziej perfekcyjny mecz w historii turnieju.",category:"upsets",year:1985,emoji:"🏀"},{id:"up12",text:"Na mundialu 2022 Japonia pokonała Niemcy i Hiszpanię, w obu meczach przegrywając do przerwy. Wyszła z grupy jako pierwsza, zostawiając mistrzów świata z 2010 roku za sobą.",category:"upsets",year:2022,emoji:"🇯🇵"},{id:"ur9",text:"Koszykówka 3x3, wywodząca się z ulicznych boisk, trafiła na igrzyska w Tokio. Mecz trwa dziesięć minut lub do 21 punktów, a gra toczy się na jednym koszu bez przerw.",category:"urban",year:2021,emoji:"🏀"},{id:"ur10",text:"W downhillu na longboardzie zawodnicy zjeżdżają krętymi drogami z prędkością przekraczającą 100 km/h, hamując dłońmi w skórzanych rękawicach ze specjalnymi ślizgaczami.",category:"urban",year:2010,emoji:"🛼"},{id:"ur11",text:"Projekt Skateistan uczy dzieci w Afganistanie i innych krajach jazdy na deskorolce, łącząc to z edukacją. Dla wielu dziewcząt była to jedyna dostępna forma sportu.",category:"urban",year:2007,emoji:"🛹"},{id:"ur12",text:"Freestyle football, czyli sztuka żonglowania piłką, ma własne mistrzostwa świata i sędziów oceniających trudność oraz oryginalność układów.",category:"urban",year:2008,emoji:"⚽"},{id:"wr9",text:"Tadeusz „Teddy” Pietrzykowski, przedwojenny pięściarz, stoczył w obozie Auschwitz kilkadziesiąt walk z esesmanami i więźniami funkcyjnymi. Za wygrane dostawał chleb, którym dzielił się ze współwięźniami.",category:"war",year:1941,emoji:"🥊"},{id:"wr10",text:"Po inwazji Rosji na Ukrainę w 2022 roku tamtejsze rozgrywki zawieszono, a wielu sportowców wstąpiło do wojska lub obrony terytorialnej. Część klubów grała potem mecze charytatywne za granicą.",category:"war",year:2022,emoji:"🇺🇦"},{id:"wr11",text:"W wielu krajach istnieją wojskowe kluby sportowe, w których zawodnicy formalnie służą w armii. To rozwiązanie pozwalało im trenować zawodowo w czasach obowiązkowego poboru.",category:"war",year:1950,emoji:"🎖️"},{id:"wr12",text:"Na stadionach i w klubach wiszą tablice z nazwiskami sportowców poległych na wojnach. Niektóre kluby mają ich po kilkudziesięciu — całe przedwojenne składy, które nigdy nie wróciły.",category:"war",year:1945,emoji:"🪦"},{id:"af10",text:"Rywalizacja Kenii z Etiopią w biegach długich trwa od dekad. Oba kraje dzielą między sobą większość medali olimpijskich na dystansach od 5000 metrów wzwyż.",category:"africa",year:2016,emoji:"🏃"},{id:"af11",text:"Akademie piłkarskie w Afryce Zachodniej wychowały setki zawodników europejskich lig. Najlepsze z nich łączą treningi z obowiązkową nauką, by chłopcy mieli plan awaryjny.",category:"africa",year:2e3,emoji:"🎓"},{id:"za10",text:"Kluby trzymają żywe maskotki — orły, kozy czy sokoły — które przed meczem obchodzą murawę. W kilku ligach zwyczaj ograniczono ze względu na dobrostan zwierząt.",category:"animals",year:1990,emoji:"🦅"},{id:"za11",text:"Konie policyjne pracujące wokół stadionów przechodzą specjalne szkolenie — uczą się nie reagować na race, huk i śpiewy kilkudziesięciu tysięcy ludzi.",category:"animals",year:1980,emoji:"🐴"},{id:"bd10",text:"Skurcze mięśni podczas długiego wysiłku wynikają najczęściej ze zmęczenia układu nerwowego, a nie z samego braku magnezu. Dlatego pomaga rozciąganie i zwolnienie tempa.",category:"body",year:2010,emoji:"🦵"},{id:"bd11",text:"Rozgrzewka podnosi temperaturę mięśni o około dwa stopnie, zwiększając ich elastyczność i szybkość skurczu. To dlatego wejście „na zimno” tak często kończy się urazem.",category:"body",year:2005,emoji:"🔥"},{id:"co10",text:"Arrigo Sacchi, który zbudował wielki Milan, nigdy nie grał zawodowo w piłkę. Krytykom odpowiadał, że aby zostać dobrym dżokejem, nie trzeba wcześniej być koniem.",category:"coaches",year:1989,emoji:"🐎"},{id:"co11",text:"Marcelo Bielsa jest nazywany „trenerem trenerów” — jego pomysły przejęli szkoleniowcy, którzy zdobyli największe trofea. Sam wygrał w karierze zaskakująco niewiele.",category:"coaches",year:2011,emoji:"📋"},{id:"e9",text:"Zawodowe drużyny e-sportowe mieszkają razem w domach treningowych, z trenerem, analitykiem i kucharzem. Dzień pracy przy komputerze potrafi trwać dziesięć godzin.",category:"esport",year:2015,emoji:"🏠"},{id:"e10",text:"Kariery w e-sporcie kończą się wcześnie — wielu zawodników odchodzi około dwudziestego piątego roku życia. Powodem są refleks, wypalenie i przeciążenia nadgarstków.",category:"esport",year:2020,emoji:"⌛"},{id:"gear10",text:"Piłka użyta na mundialu 2022 miała wewnątrz czujnik przesyłający dane setki razy na sekundę. Dzięki temu system potrafił wskazać dokładny moment kontaktu z nogą przy ocenie spalonego.",category:"gear",year:2022,emoji:"📡"},{id:"gear11",text:"Kolce lekkoatletyczne z płytką węglową w podeszwie zrewolucjonizowały biegi po 2018 roku. Rekordy padały tak masowo, że federacja musiała określić maksymalną grubość podeszwy.",category:"gear",year:2020,emoji:"👟"},{id:"ge10",text:"Stadion w La Paz leży na wysokości ponad trzech i pół tysiąca metrów. Rywale Boliwii skarżyli się na zadyszkę tak długo, że federacja przez pewien czas rozważała zakaz gry na takich wysokościach.",category:"geography",year:2007,emoji:"⛰️"},{id:"ge11",text:"Tor Formuły 1 w Monako jest najwolniejszy w kalendarzu i jedyny poprowadzony zwykłymi ulicami miasta. Bariery stoją tak blisko, że wyprzedzanie prawie nie istnieje, a kwalifikacje decydują o wyścigu.",category:"geography",year:1929,emoji:"🏎️"},{id:"ge12",text:"Maraton w Bostonie ma profil opadający, więc formalnie nie liczy się do rekordów świata. Przepisy wymagają, by trasa nie traciła zbyt wielu metrów wysokości między startem a metą.",category:"geography",year:1897,emoji:"📉"},{id:"hf10",text:"Galeria Sław Hokeja w Toronto przechowuje oryginalny Puchar Stanleya, a drużyny dostają kopię do świętowania. Nazwiska mistrzów wygrawerowane na obręczach zajmują już kilka pasów metalu.",category:"halls",year:1943,emoji:"🏒"},{id:"hf11",text:"Muzeum Sportu i Turystyki w Warszawie gromadzi medale polskich olimpijczyków i sprzęt z dawnych dekad. Można tam zobaczyć pamiątki po zawodnikach, których wyczyny znane są dziś głównie z kronik filmowych.",category:"halls",year:1952,emoji:"🏛️"},{id:"hf12",text:"Muzeum Olimpijskie w Lozannie stoi nad brzegiem Jeziora Genewskiego, obok siedziby komitetu olimpijskiego. W ogrodzie ustawiono bieżnię i sprzęt, na którym zwiedzający mogą porównać się z rekordzistami.",category:"halls",year:1993,emoji:"🔥"},{id:"md10",text:"Pierwszą transmisję telewizyjną z igrzysk pokazano w Berlinie w 1936 roku, ale nie do domów. Obraz trafiał do specjalnych sal projekcyjnych w mieście, gdzie oglądały go tłumy.",category:"media",year:1936,emoji:"📽️"},{id:"md11",text:"Powtórka wideo weszła do transmisji sportowych przypadkiem, gdy realizator odtworzył zapisane ujęcie akcji. Widzowie byli tak zdezorientowani, że komentator musiał tłumaczyć, iż zespół nie zdobył punktu drugi raz.",category:"media",year:1963,emoji:"⏪"},{id:"md12",text:"Prawa telewizyjne stały się głównym źródłem dochodów wielkich lig i to one dyktują godziny rozpoczęcia meczów. Dlatego finały rozgrywane bywają późnym wieczorem, wygodnie dla widzów po drugiej stronie oceanu.",category:"media",year:1990,emoji:"💰"},{id:"pe10",text:"Na Euro 2016 Polska przeszła grupę bez porażki i odpadła dopiero w ćwierćfinale po rzutach karnych. Był to najlepszy wynik reprezentacji w historii startów w mistrzostwach Europy.",category:"polandeuro",year:2016,emoji:"🇵🇱"},{id:"pe11",text:"Euro 2012 Polska współorganizowała z Ukrainą, a mecz otwarcia zagrała w Warszawie. Turniej zostawił po sobie cztery nowe stadiony, które służą dziś klubom i reprezentacji.",category:"polandeuro",year:2012,emoji:"🏟️"},{id:"pe12",text:"Pierwszego gola Polski w historii mistrzostw Europy strzelił Robert Lewandowski w meczu otwarcia z Grecją. Reprezentacja debiutowała wtedy w turnieju jako gospodarz, bez wcześniejszych awansów.",category:"polandeuro",year:2012,emoji:"⚽"},{id:"pol10",text:"Dyplomacja pingpongowa otworzyła drogę do kontaktów Stanów Zjednoczonych z Chinami. Wizyta amerykańskich tenisistów stołowych poprzedziła rozmowy polityczne na najwyższym szczeblu.",category:"politics",year:1971,emoji:"🏓"},{id:"pol11",text:"Mecz rugby z udziałem Nelsona Mandeli w koszulce drużyny narodowej stał się symbolem pojednania w RPA. Stadion, dotąd kojarzony z jedną społecznością, oklaskiwał prezydenta wybranego przez wszystkich.",category:"politics",year:1995,emoji:"🤝"},{id:"pol12",text:"Wspólna reprezentacja Korei Południowej i Północnej maszerowała pod jedną flagą podczas ceremonii otwarcia igrzysk. Zespoły grały jednak osobno, poza turniejem hokeja kobiet, gdzie wystawiono wspólną drużynę.",category:"politics",year:2018,emoji:"🕊️"},{id:"pr10",text:"W łucznictwie olimpijskim tarcza stoi siedemdziesiąt metrów od zawodnika, a jej najwyżej punktowany środek ma dwanaście centymetrów średnicy. Z perspektywy strzelca wygląda mniej więcej jak główka od szpilki.",category:"precision",year:1972,emoji:"🎯"},{id:"pr11",text:"Strzelcy sportowi uczą się oddawać strzał między uderzeniami serca, bo puls wystarcza, by przesunąć lufę. Trening obejmuje więc pracę nad oddechem i tętnem, nie tylko celowanie.",category:"precision",year:1990,emoji:"🫀"},{id:"pr12",text:"Maksymalny wynik w snookerze to sto czterdzieści siedem punktów zdobytych jednym podejściem do stołu. Zawodnik musi wbić piętnaście czerwonych bil, każdą z czarną, a na koniec wszystkie kolorowe po kolei.",category:"precision",year:1982,emoji:"🎱"},{id:"ar10",text:"Sędziowie piłkarscy przebiegają w meczu podobny dystans co pomocnicy, często ponad dziesięć kilometrów. Przed sezonem zdają testy sprawnościowe, których nie zaliczają wszyscy chętni.",category:"referees",year:2005,emoji:"🏃"},{id:"ar11",text:"W koszykówce NBA sędziowie po meczu przeglądają nagrania z ostatnich dwóch minut i liga publikuje raport z pomyłkami. To rzadki przypadek, gdy federacja oficjalnie przyznaje się do błędnych decyzji.",category:"referees",year:2015,emoji:"📋"},{id:"ar12",text:"System wideoweryfikacji w piłce nożnej zadebiutował na mundialu w 2018 roku. Sędzia ogląda powtórkę przy monitorze, ale ostateczna decyzja wciąż należy do niego, nie do operatora.",category:"referees",year:2018,emoji:"📺"},{id:"ru10",text:"Zasada złotego gola kończyła dogrywkę natychmiast po trafieniu i obowiązywała w wielkich turniejach przez kilka lat. Zrezygnowano z niej, bo drużyny grały wtedy bardziej zachowawczo, niż zakładano.",category:"rules",year:2004,emoji:"🥅"},{id:"ru11",text:"W siatkówce długo punktowała tylko drużyna serwująca, więc sety potrafiły ciągnąć się godzinami. Przejście na punkt za każdą akcję skróciło mecze i uporządkowało telewizyjne ramówki.",category:"rules",year:1999,emoji:"🏐"},{id:"ru12",text:"Przepis zakazujący bramkarzowi łapania piłki podanej nogą przez kolegę wprowadzono po mundialu pełnym przeciągania czasu. Tempo gry wzrosło natychmiast, a bramkarze musieli nauczyć się grać nogami.",category:"rules",year:1992,emoji:"🧤"},{id:"sp10",text:"Lotka badmintonowa po smeczu osiąga prędkość wyższą niż piłka w jakiejkolwiek innej grze rakietowej. Hamuje jednak gwałtownie, bo pióra działają jak spadochron.",category:"speed",year:2013,emoji:"🏸"},{id:"sp11",text:"Skoczkowie spadochronowi w konkurencji lotu nurkowego przekraczają czterysta kilometrów na godzinę w pozycji głową w dół. Pomiar prowadzi się na ustalonym odcinku wysokości, a nie na oko.",category:"speed",year:2005,emoji:"🪂"},{id:"sp12",text:"Zjazd narciarski na torze w Wengen bywa najszybszą konkurencją Pucharu Świata, z prędkościami przekraczającymi sto sześćdziesiąt kilometrów na godzinę. Zawodnicy pokonują ten dystans w niecałe dwie i pół minuty.",category:"speed",year:2013,emoji:"⛷️"},{id:"un10",text:"Sepak takraw przypomina siatkówkę graną wyłącznie nogami, głową i tułowiem. Zawodnicy kończą akcje przewrotkami w powietrzu, a dyscyplina jest w Azji Południowo-Wschodniej rozgrywana zawodowo.",category:"unusual",year:1965,emoji:"🤸"},{id:"un11",text:"Kabaddi polega na tym, że zawodnik wbiega na połowę rywala, dotyka przeciwników i musi wrócić bez wzięcia wdechu. Tradycyjnie kontrolowano to, każąc mu powtarzać nazwę dyscypliny bez przerwy.",category:"unusual",year:1990,emoji:"🫁"},{id:"un12",text:"Szachboks łączy rundy boksu z partiami szachów rozgrywanymi między nimi. Wygrać można nokautem albo matem, a zmęczenie po rundzie potrafi kosztować figurę.",category:"unusual",year:2003,emoji:"♟️"},{id:"as11",text:"Baseball jest w Japonii sportem numer jeden, a licealny turniej w Koshien ogląda cały kraj. Przegrani zabierają ze sobą garść ziemi z boiska na pamiątkę.",category:"asia",year:1915,emoji:"⚾"},{id:"as12",text:"Krykiet w Indiach gromadzi widownię liczoną w setkach milionów, a liga zawodowa należy do najbogatszych na świecie. Zawodnicy trafiają na billboardy szybciej niż aktorzy.",category:"asia",year:2008,emoji:"🏏"},{id:"as13",text:"Turnieje sumo w Japonii trwają piętnaście dni i odbywają się sześć razy w roku. Zawodnicy mieszkają w stajniach treningowych, gdzie obowiązuje ścisła hierarchia i wspólny rozkład dnia.",category:"asia",year:1958,emoji:"🤼"},{id:"ca11",text:"Wielki Szlem w tenisie to cztery turnieje rozgrywane na trzech różnych nawierzchniach w ciągu jednego sezonu. Wygranie wszystkich w tym samym roku udało się w historii tylko kilku zawodnikom.",category:"calendar",year:1969,emoji:"🎾"},{id:"ca12",text:"Igrzyska letnie i zimowe rozdzielono w kalendarzu tak, by wypadały co dwa lata na przemian. Wcześniej odbywały się w tym samym roku, co rozmywało uwagę widzów i sponsorów.",category:"calendar",year:1994,emoji:"🗓️"},{id:"ca13",text:"Wielkie Toury kolarskie to Giro, Tour de France i Vuelta, rozłożone od wiosny do jesieni. Wygranie wszystkich trzech w jednym sezonie nie udało się dotąd nikomu.",category:"calendar",year:1935,emoji:"🚴"},{id:"eq10",text:"W ujeżdżeniu sędziowie oceniają przejazd do muzyki, a układ przygotowuje się pod konkretnego konia. Punkty przyznaje kilku sędziów siedzących wokół czworoboku, każdy z innej perspektywy.",category:"equestrian",year:1996,emoji:"🎵"},{id:"eq11",text:"Wszechstronny konkurs konia wierzchowego łączy ujeżdżenie, próbę terenową i skoki przez przeszkody w ciągu kilku dni. Ta sama para musi poradzić sobie z zupełnie różnymi wymaganiami.",category:"equestrian",year:1912,emoji:"🏇"},{id:"eq12",text:"Jeździectwo to jedyna dyscyplina olimpijska, w której kobiety i mężczyźni rywalizują wspólnie o te same medale. Wspólnie startuje też zwierzę, formalnie uznawane za część zespołu.",category:"equestrian",year:1952,emoji:"⚖️"},{id:"x11",text:"Wingsuit pozwala szybować w kombinezonie z membranami między kończynami, ale lądowanie wciąż wymaga spadochronu. Loty wzdłuż ścian skalnych należą do najbardziej ryzykownych aktywności w sporcie.",category:"extreme",year:1999,emoji:"🦅"},{id:"x12",text:"Nurkowanie na zatrzymanym oddechu w dyscyplinie ze stałym balastem sięga ponad stu metrów w głąb. Zawodnik schodzi i wraca o własnych siłach, a płuca na dole kurczą się do ułamka objętości.",category:"extreme",year:2016,emoji:"🌊"},{id:"x13",text:"Surferzy na falach olbrzymich w Nazaré doholowywani są skuterem, bo samodzielne wiosłowanie nie wystarcza. Ściana wody potrafi przekroczyć wysokość ośmiopiętrowego budynku.",category:"extreme",year:2011,emoji:"🏄"},{id:"fw11",text:"Kareem Abdul-Jabbar żegnał się z NBA przez cały sezon, a kibice rywali wręczali mu prezenty na wyjazdach. Odchodził jako najlepszy strzelec w historii ligi, z rekordem, który przetrwał dekady.",category:"farewells",year:1989,emoji:"🏀"},{id:"fw12",text:"Pożegnalny mecz Zinedine'a Zidane'a wypadł akurat w finale mistrzostw świata i skończył się czerwoną kartką. Mimo to zawodnik odebrał nagrodę dla najlepszego piłkarza turnieju.",category:"farewells",year:2006,emoji:"🟥"},{id:"fw13",text:"Ostatni mecz Adama Małysza w Pucharze Świata odbył się w Planicy przy pełnej skoczni. Kibice z Polski jechali tam autokarami, żeby pożegnać go na miejscu.",category:"farewells",year:2011,emoji:"🎿"},{id:"ga11",text:"Igrzyska Wspólnoty Narodów gromadzą reprezentacje krajów związanych z dawnym imperium brytyjskim. Rozgrywane co cztery lata, bywają dla wielu zawodników pierwszym dużym startem w karierze.",category:"games",year:1930,emoji:"🎽"},{id:"ga12",text:"Uniwersjada to igrzyska studentów, na których debiutowało wielu późniejszych mistrzów olimpijskich. Polska organizowała jej zimową odsłonę w Zakopanem.",category:"games",year:1993,emoji:"🎓"},{id:"ga13",text:"Igrzyska Azjatyckie należą do największych imprez wielodyscyplinowych po olimpiadzie. W programie znajdują się także dyscypliny regionalne, nieobecne w kalendarzu olimpijskim.",category:"games",year:1951,emoji:"🌏"},{id:"g11",text:"Elementy gimnastyczne noszą nazwiska zawodników, którzy wykonali je pierwsi na dużej imprezie. Aby trafić do przepisów, trzeba zgłosić element wcześniej i zaprezentować go czysto.",category:"gymnastics",year:1972,emoji:"📖"},{id:"g12",text:"Punktacja gimnastyczna dzieli się dziś na ocenę trudności i ocenę wykonania, więc wynik nie ma górnej granicy. Dawna dziesiątka zniknęła po zmianie przepisów.",category:"gymnastics",year:2006,emoji:"🔢"},{id:"g13",text:"Gimnastyczki na równoważni pracują na belce szerokiej na dziesięć centymetrów, wykonując na niej salta. Podczas układu stopa ma mniej miejsca niż długość dłoni.",category:"gymnastics",year:1976,emoji:"🤸"},{id:"prl11",text:"Wyścig Pokoju był największą amatorską imprezą kolarską bloku wschodniego i biegł przez Warszawę, Berlin i Pragę. Zwycięzca zyskiwał w Polsce popularność porównywalną z gwiazdami filmu.",category:"prl",year:1952,emoji:"🚲"},{id:"prl12",text:"Transmisje radiowe z meczów reprezentacji gromadziły w PRL rodziny przy odbiornikach, bo telewizor miał nie każdy. Głos komentatora bywał jedynym źródłem relacji z wyjazdowych spotkań.",category:"prl",year:1966,emoji:"📻"},{id:"prl13",text:"Zawodnicy wyjeżdżający na Zachód w czasach PRL potrzebowali zgody władz i limitów wiekowych na transfer. Część karier za granicą zaczynała się dopiero po trzydziestce.",category:"prl",year:1980,emoji:"🛂"},{id:"sj11",text:"Nota za skok narciarski łączy długość z oceną stylu wystawianą przez pięciu sędziów. Skrajne oceny się odrzuca, więc liczą się tylko trzy środkowe.",category:"skijumping",year:1924,emoji:"📝"},{id:"sj12",text:"Przelicznik za wiatr i zmianę belki startowej wprowadzono, by wyrównać szanse przy zmiennych warunkach. Dzięki temu skoczek z gorszym wiatrem dostaje punkty rekompensaty.",category:"skijumping",year:2010,emoji:"🌬️"},{id:"sj13",text:"Loty narciarskie rozgrywa się tylko na kilku mamucich skoczniach na świecie, a odległości przekraczają dwieście metrów. Konkurs wymaga osobnych mistrzostw, bo przepisy różnią się od zwykłych skoków.",category:"skijumping",year:1972,emoji:"🦅"},{id:"tr11",text:"Lacrosse wywodzi się z gier rdzennych mieszkańców Ameryki Północnej, gdzie mecze trwały nieraz kilka dni. Bramki ustawiano w odległości liczonej w kilometrach, a grało po kilkuset zawodników.",category:"traditional",year:1867,emoji:"🥍"},{id:"tr12",text:"Hurling to irlandzka gra kijem i piłką, rozgrywana amatorsko mimo ogromnej popularności. Zawodnicy nie dostają pensji, a finał w Dublinie wypełnia jeden z największych stadionów Europy.",category:"traditional",year:1884,emoji:"☘️"},{id:"tr13",text:"Palant, dawna polska gra podwórkowa, przypomina zasadami baseball i był kiedyś w szkolnym programie wychowania fizycznego. Do gry wystarczał kij, piłka i kawałek trawy.",category:"traditional",year:1950,emoji:"🪵"},{id:"we11",text:"„Fog Bowl” z 31 grudnia 1988 roku: w trakcie meczu play-off NFL Chicago Bears z Philadelphia Eagles nad stadion w Chicago nadciągnęła gęsta mgła. Zawodnicy nie widzieli piłki po kopnięciu, a kibice — boiska.",category:"weather",year:1988,emoji:"🌫️"},{id:"we12",text:"Deszcz tak opóźnił Wimbledon 2001, że finał mężczyzn Goran Ivanišević – Pat Rafter rozegrano dopiero w poniedziałek, przy wolnej sprzedaży biletów. Od 2009 roku nad kortem centralnym działa już rozsuwany dach.",category:"weather",year:2001,emoji:"☔"},{id:"we13",text:"Z obawy przed tokijskim upałem maraton i chód igrzysk Tokio 2020 przeniesiono o ponad 800 km na północ — do Sapporo. Organizatorzy zdecydowali się na to mimo protestów władz Tokio.",category:"weather",year:2021,emoji:"🥵"},{id:"we14",text:"Maraton kobiet na mistrzostwach świata w Dosze w 2019 roku wystartował o północy, a i tak było ponad 30°C przy ogromnej wilgotności. Z 68 zawodniczek bieg ukończyło tylko 40.",category:"weather",year:2019,emoji:"🌙"},{id:"e11",text:"„Evo Moment 37”: w 2004 roku Japończyk Daigo Umehara w Street Fighterze III odparował wszystkie ciosy superkombinacji rywala, mając tak mało życia, że każdy zablokowany cios by go pokonał — i wygrał rundę. To najsłynniejsze zagranie w historii bijatyk.",category:"esport",year:2004,emoji:"🕹️"},{id:"e12",text:"Counter-Strike powstał w 1999 roku jako amatorska modyfikacja gry Half-Life, stworzona przez dwóch studentów w wolnym czasie. Z hobbystycznego projektu wyrosła jedna z największych dyscyplin e-sportu.",category:"esport",year:1999,emoji:"🔫"},{id:"e13",text:"W marcu 2014 roku polska drużyna Virtus.pro wygrała w katowickim Spodku turniej rangi major w Counter-Strike: Global Offensive. Polscy gracze triumfowali przed własną publicznością.",category:"esport",year:2014,emoji:"🇵🇱"},{id:"e14",text:"W grudniu 2023 roku 13-letni Amerykanin Willis Gibson jako pierwszy człowiek „pokonał” klasycznego Tetrisa na konsolę NES — doprowadził grę do poziomu, na którym się zawiesza. Wcześniej udawało się to tylko programom komputerowym.",category:"esport",year:2023,emoji:"🧱"},{id:"hb13",text:"Za ojca piłki ręcznej uważa się duńskiego nauczyciela Holgera Nielsena, który pod koniec XIX wieku spisał zasady gry dla swoich uczniów. Niemal równolegle podobne gry rozwijały się w Niemczech i Czechach.",category:"handball",year:1898,emoji:"📜"},{id:"hb14",text:"Halowa, siedmioosobowa piłka ręczna weszła do programu igrzysk w Monachium w 1972 roku. Kobiety dołączyły cztery lata później, w Montrealu.",category:"handball",year:1972,emoji:"🏟️"},{id:"hb15",text:"W piłce ręcznej zawodnik z piłką może zrobić najwyżej trzy kroki i trzymać ją nie dłużej niż trzy sekundy. Potem musi kozłować, podać albo rzucić.",category:"handball",emoji:"👣"},{id:"hb16",text:"Francuz Nikola Karabatić to jeden z najwybitniejszych szczypiornistów w historii — trzykrotny mistrz olimpijski (Pekin 2008, Londyn 2012, Tokio 2020) i trzykrotnie najlepszy zawodnik świata. Karierę zakończył po igrzyskach w Paryżu 2024.",category:"handball",year:2024,emoji:"🇫🇷"},{id:"pf12",text:"Egon Franke zdobył w Tokio w 1964 roku pierwsze w historii polskie indywidualne złoto olimpijskie w szermierce — we florecie. Cztery lata później w Meksyku po złoto w szabli sięgnął Jerzy Pawłowski.",category:"polandfirsts",year:1964,emoji:"🤺"},{id:"pf13",text:"Józef Szmidt jako pierwszy człowiek na świecie skoczył w trójskoku ponad 17 metrów — 17,03 m w Olsztynie w 1960 roku. W tym samym roku i cztery lata później zdobywał złoto olimpijskie.",category:"polandfirsts",year:1960,emoji:"📏"},{id:"pf14",text:"Leszek Blanik zdobył w Pekinie w 2008 roku pierwsze w historii polskie złoto olimpijskie w gimnastyce sportowej — w skoku. Jeden z jego skoków nosi w przepisach nazwę „Blanik”.",category:"polandfirsts",year:2008,emoji:"🤸"},{id:"pf15",text:"Mariusz Czerkawski był pierwszym wychowankiem polskiego hokeja, który zagrał w lidze NHL. Zadebiutował w barwach Boston Bruins w 1994 roku i rozegrał w lidze ponad 700 meczów.",category:"polandfirsts",year:1994,emoji:"🏒"},{id:"sc12",text:"„Crashgate”: w Grand Prix Singapuru 2008 Nelson Piquet junior celowo rozbił bolid na polecenie szefów zespołu Renault, by samochód bezpieczeństwa pomógł wygrać Fernandowi Alonso. Sprawa wyszła na jaw rok później.",category:"scandals",year:2008,emoji:"💥"},{id:"sc13",text:"„Sandpapergate” (2018): australijscy krykieciści w meczu w Kapsztadzie próbowali zmienić tor lotu piłki, pocierając ją papierem ściernym. Kapitan Steve Smith i David Warner dostali po rok zawieszenia.",category:"scandals",year:2018,emoji:"🧽"},{id:"sc14",text:"Kapitan reprezentacji RPA w krykiecie Hansie Cronje przyznał w 2000 roku, że brał pieniądze od bukmacherów. Został dożywotnio zdyskwalifikowany, a dwa lata później zginął w katastrofie lotniczej.",category:"scandals",year:2e3,emoji:"🏏"},{id:"sc15",text:"W 2010 roku trzech pakistańskich krykiecistów celowo spaliło rzuty (tzw. no-balle) w ustalonych momentach meczu na Lord's — na zlecenie bukmachera. Wszyscy trzej trafili w Anglii do więzienia.",category:"scandals",year:2010,emoji:"⚖️"},{id:"wm12",text:"Babe Didrikson zdobyła na igrzyskach w Los Angeles 1932 dwa złote medale (oszczep i 80 m przez płotki) i srebro w skoku wzwyż. Później została jedną z najlepszych golfistek w historii.",category:"women",year:1932,emoji:"🎯"},{id:"wm13",text:"Gdy MKOl nie chciał dopuścić kobiet do lekkoatletyki olimpijskiej, Francuzka Alice Milliat zorganizowała w 1922 roku w Paryżu osobne Światowe Igrzyska Kobiet. Presja przyniosła skutek — w 1928 roku kobiety wystartowały w lekkoatletyce na igrzyskach.",category:"women",year:1922,emoji:"🇫🇷"},{id:"wm14",text:"Kobiece skoki narciarskie zadebiutowały na igrzyskach dopiero w Soczi w 2014 roku. Pierwszą mistrzynią olimpijską została Niemka Carina Vogt.",category:"women",year:2014,emoji:"🎿"},{id:"wm15",text:"Boks kobiet trafił do programu igrzysk w Londynie w 2012 roku — jako ostatnia dyscyplina, w której wcześniej startowali tylko mężczyźni. Pierwszą mistrzynią olimpijską została Brytyjka Nicola Adams.",category:"women",year:2012,emoji:"🥊"},{id:"co12",text:"Bill Belichick jako główny trener New England Patriots wygrał sześć Super Bowl — więcej niż jakikolwiek inny trener w historii NFL. Większość z nich zdobył z rozgrywającym Tomem Bradym.",category:"coaches",year:2019,emoji:"🏈"},{id:"co13",text:"Helenio Herrera rozsławił catenaccio — żelazną obronę z dodatkowym obrońcą z tyłu. Z Interem Mediolan wygrał Puchar Europy w 1964 i 1965 roku Słynął z motywujących haseł wywieszanych w szatni.",category:"coaches",year:1965,emoji:"🔒"},{id:"co14",text:"Ottmar Hitzfeld wygrał Ligę Mistrzów z dwoma różnymi niemieckimi klubami — z Borussią Dortmund w 1997 roku i z Bayernem Monachium w 2001. Nazywano go „Generałem”.",category:"coaches",year:2001,emoji:"🏆"},{id:"co15",text:"José Mourinho wygrał Ligę Mistrzów z FC Porto w 2004 roku i z Interem Mediolan w 2010. Na pierwszej konferencji w Chelsea przedstawił się jako „The Special One” i przydomek przylgnął do niego na zawsze.",category:"coaches",year:2010,emoji:"🗣️"},{id:"za12",text:"Phar Lap, nowozelandzki koń wyścigowy, stał się bohaterem Australii w czasach wielkiego kryzysu. Jego serce, ważące ponad sześć kilogramów, przechowywane jest w muzeum w Canberze.",category:"animals",year:1932,emoji:"🐎"},{id:"za13",text:"Brytyjski ogier Frankel wygrał wszystkie 14 gonitw, w których wystartował (2010–2012). Wielu ekspertów uważa go za najlepszego konia wyścigowego w historii.",category:"animals",year:2012,emoji:"🏇"},{id:"za14",text:"Australijska klacz Winx wygrała 33 gonitwy z rzędu w latach 2015–2019, w tym 25 najwyższej rangi. Na jej ostatni start przyszły tłumy, jak na finał wielkiego turnieju.",category:"animals",year:2019,emoji:"🌟"},{id:"za15",text:"Na zimowych igrzyskach w Lake Placid w 1932 roku rozegrano pokazowy wyścig psich zaprzęgów. Psie zaprzęgi nigdy nie weszły jednak na stałe do programu olimpijskiego.",category:"animals",year:1932,emoji:"🐕"},{id:"gear12",text:"Rakiety tenisowe z „podwójnym naciągiem” (tzw. spaghetti) nadawały piłce tak nieprzewidywalną rotację, że słabsi gracze ogrywali nimi gwiazdy. Międzynarodowa federacja zakazała ich w 1977 roku.",category:"gear",year:1977,emoji:"🎾"},{id:"gear13",text:"Żółte piłki tenisowe wprowadzono na początku lat 70., bo lepiej widać je w kolorowej telewizji. Wimbledon trzymał się białych piłek aż do 1986 roku.",category:"gear",year:1986,emoji:"🎾"},{id:"gear14",text:"Kask w zawodowym kolarstwie szosowym stał się obowiązkowy dopiero w 2003 roku — po śmierci Kazacha Andrieja Kiwilewa, który upadł podczas wyścigu Paryż–Nicea. Wcześniej wielu kolarzy jeździło w czapeczkach.",category:"gear",year:2003,emoji:"⛑️"},{id:"gear15",text:"Przed finałem mundialu 1954 padał deszcz, a Niemcy mieli buty z wkręcanymi korkami, które dało się wymienić na dłuższe. Wygrali z faworyzowanymi Węgrami 3:2 — wymienne korki do dziś przypomina się przy „cudzie z Berna”.",category:"gear",year:1954,emoji:"👟"},{id:"bd12",text:"Michael Phelps ma 193 cm wzrostu, ale rozpiętość ramion około 2 metrów — więcej niż wzrost. Długie ręce i stosunkowo krótkie nogi to wymarzone proporcje pływaka.",category:"body",year:2008,emoji:"📐"},{id:"bd13",text:"Norweski kolarz Oskar Svendsen miał zmierzony pułap tlenowy (VO2max) 97,5 ml na kilogram masy ciała na minutę — jeden z najwyższych wyników w historii. Przeciętny dorosły ma mniej niż połowę tej wartości.",category:"body",year:2012,emoji:"🫁"},{id:"bd14",text:"Popularne „zakwasy”, czyli ból mięśni dzień–dwa po wysiłku, nie biorą się z kwasu mlekowego. Mleczan znika z mięśni w ciągu godziny, a ból powodują drobne uszkodzenia włókien i stan zapalny.",category:"body",year:2003,emoji:"🦵"},{id:"bd15",text:"Serce wytrenowanego wytrzymałościowca jest większe niż przeciętne i przy jednym skurczu tłoczy więcej krwi. Dlatego bije w spoczynku znacznie wolniej — lekarze nazywają to „sercem sportowca”.",category:"body",year:1990,emoji:"❤️"},{id:"af12",text:"Egipt wygrał Puchar Narodów Afryki siedem razy — najwięcej w historii, w tym trzy razy z rzędu (2006, 2008, 2010). Na mundialu radził sobie dużo słabiej.",category:"africa",year:2010,emoji:"🇪🇬"},{id:"af13",text:"Na otwarcie mundialu 1990 Kamerun pokonał broniącą tytułu Argentynę z Maradoną 1:0, kończąc mecz w dziewiątkę. Potem jako pierwsza afrykańska drużyna dotarł do ćwierćfinału mistrzostw świata.",category:"africa",year:1990,emoji:"🇨🇲"},{id:"af14",text:"Etiopczyk Haile Gebrselassie pobił w karierze kilkadziesiąt rekordów świata na różnych dystansach. W 2008 roku w Berlinie jako pierwszy człowiek przebiegł maraton poniżej 2:04.",category:"africa",year:2008,emoji:"🇪🇹"},{id:"af15",text:"Zimbabweńska pływaczka Kirsty Coventry, siedmiokrotna medalistka olimpijska, w 2025 roku została przewodniczącą MKOl. Jest pierwszą kobietą i pierwszą osobą z Afryki na tym stanowisku.",category:"africa",year:2025,emoji:"🇿🇼"},{id:"me12",text:"Ostatnie medale olimpijskie z litego złota wręczono w Sztokholmie w 1912 roku. Dzisiejsze „złote” medale to głównie srebro pokryte kilkoma gramami złota.",category:"medals",year:1912,emoji:"🥇"},{id:"me13",text:"Medale igrzysk w Paryżu 2024 miały wprawiony sześciokątny kawałek oryginalnego żelaza z wieży Eiffla. Metal pochodził z elementów zdemontowanych podczas remontów wieży.",category:"medals",year:2024,emoji:"🗼"},{id:"me14",text:"Na pierwszych nowożytnych igrzyskach w Atenach w 1896 roku zwycięzcy dostawali srebrny medal i gałązkę oliwną, a drudzy — medal z brązu. Za trzecie miejsce nie przewidziano nic.",category:"medals",year:1896,emoji:"🫒"},{id:"me15",text:"Na igrzyskach w Paryżu w 1900 roku medale miały kształt prostokątnych plakiet, a wielu zwycięzców dostało zamiast nich puchary lub inne nagrody. Część sportowców do końca życia nie wiedziała, że startowała na igrzyskach.",category:"medals",year:1900,emoji:"▭"},{id:"am12",text:"Bieg Western States na 100 mil przez kalifornijskie góry narodził się w 1974 roku, gdy Gordy Ainsleigh pokonał pieszo trasę zawodów konnych. Zmieścił się w limicie przewidzianym dla koni.",category:"amateur",year:1974,emoji:"⛰️"},{id:"am13",text:"Spartathlon to bieg na 246 km z Aten do Sparty, nawiązujący do legendy posłańca Filippidesa. Rozgrywany jest od 1983 roku, a limit czasu wynosi 36 godzin.",category:"amateur",year:1983,emoji:"🏛️"},{id:"am14",text:"Maraton Warszawski rozgrywany jest od 1979 roku, początkowo jako Maraton Pokoju. Najstarszy maraton w Polsce odbywa się jednak w Dębnie — od 1966 roku.",category:"amateur",year:1979,emoji:"🇵🇱"},{id:"am15",text:"Maraton londyński, biegany od 1981 roku, to największa jednodniowa zbiórka charytatywna na świecie. Uczestnicy zebrali łącznie ponad miliard funtów, a wielu biegnie w przebraniach.",category:"amateur",year:1981,emoji:"💷"},{id:"gf12",text:"Tiger Woods jako jedyny w nowoczesnej erze golfa trzymał jednocześnie tytuły wszystkich czterech turniejów wielkoszlemowych — od US Open 2000 do Masters 2001. Ten wyczyn nazwano „Tiger Slam”.",category:"golf",year:2001,emoji:"🐯"},{id:"gf13",text:"Jack Nicklaus wygrał rekordowe 18 turniejów wielkoszlemowych. Ostatni z nich — Masters w 1986 roku — zdobył w wieku 46 lat, jako najstarszy zwycięzca tego turnieju.",category:"golf",year:1986,emoji:"🐻"},{id:"gf14",text:"Bobby Jones w 1930 roku wygrał wszystkie cztery najważniejsze turnieje swoich czasów — jako amator. Zaraz potem zakończył karierę w wieku 28 lat, a później współtworzył pole Augusta National.",category:"golf",year:1930,emoji:"🎩"},{id:"gf15",text:"Golf wrócił na igrzyska olimpijskie w Rio de Janeiro w 2016 roku — po 112 latach przerwy. Wcześniej rozgrywano go tylko w 1900 i 1904 roku.",category:"golf",year:2016,emoji:"⛳"},{id:"ch10",text:"Pierwszym oficjalnym mistrzem świata w szachach został w 1886 roku Wilhelm Steinitz, który wygrał mecz z Johannesem Zukertortem. Zukertort urodził się w Lublinie.",category:"chess",year:1886,emoji:"👑"},{id:"ch11",text:"Polska wygrała olimpiadę szachową w Hamburgu w 1930 roku. W drużynie grali m.in. Akiba Rubinstein i Ksawery Tartakower.",category:"chess",year:1930,emoji:"🇵🇱"},{id:"ch12",text:"Jan-Krzysztof Duda wygrał w 2021 roku Puchar Świata FIDE, pokonując po drodze w półfinale mistrza świata Magnusa Carlsena. Rok wcześniej przerwał jego serię 125 partii klasycznych bez porażki.",category:"chess",year:2021,emoji:"♞"},{id:"ch13",text:"Hindus Gukesh Dommaraju został w 2024 roku najmłodszym mistrzem świata w historii szachów — miał 18 lat. W meczu o tytuł pokonał Chińczyka Ding Lirena.",category:"chess",year:2024,emoji:"🇮🇳"},{id:"st13",text:"Ireneusz Paliński zdobył w Rzymie w 1960 roku pierwsze w historii polskie złoto olimpijskie w podnoszeniu ciężarów. Cztery lata później dołożył brąz.",category:"strength",year:1960,emoji:"🏋️"},{id:"st14",text:"Waldemar Baszanowski był dwukrotnym mistrzem olimpijskim (Tokio 1964, Meksyk 1968) w wadze lekkiej. Wielokrotnie bił też rekordy świata i uchodził za mistrza techniki.",category:"strength",year:1968,emoji:"🥇"},{id:"st15",text:"Zygmunt Smalcerz wygrał w Monachium w 1972 roku złoto olimpijskie w najlżejszej kategorii, do 52 kg. Po latach został cenionym trenerem ciężarowców w USA.",category:"strength",year:1972,emoji:"💪"},{id:"st16",text:"Radziecki superciężki Wasilij Aleksiejew pobił 80 rekordów świata i zdobył dwa złota olimpijskie (1972, 1976). Jako pierwszy podniósł w trzech bojach łącznie ponad 600 kg.",category:"strength",year:1976,emoji:"🐻"},{id:"rq13",text:"Badminton zadebiutował jako pełnoprawna dyscyplina olimpijska w Barcelonie w 1992 roku. Oba złota w singlu zdobyli Indonezyjczycy — Susi Susanti i Alan Budikusuma, którzy kilka lat później wzięli ślub.",category:"racquet",year:1992,emoji:"🏸"},{id:"rq14",text:"Chińczyk Lin Dan, nazywany „Super Danem”, jako pierwszy badmintonista obronił olimpijskie złoto w singlu (Pekin 2008, Londyn 2012). Zdobył też pięć tytułów mistrza świata.",category:"racquet",year:2012,emoji:"🇨🇳"},{id:"rq15",text:"Pickleball wymyślili w 1965 roku ojcowie z wyspy Bainbridge koło Seattle, by zająć nudzące się dzieci. Grali na korcie do badmintona drewnianymi rakietkami i dziurkowaną plastikową piłką.",category:"racquet",year:1965,emoji:"🥒"},{id:"rq16",text:"Chińczyk Ma Long jako pierwszy tenisista stołowy obronił olimpijskie złoto w singlu mężczyzn (Rio 2016, Tokio 2020). W karierze wygrał wszystkie najważniejsze turnieje tej dyscypliny.",category:"racquet",year:2021,emoji:"🏓"},{id:"pwc13",text:"Na mundialu 1974 Polska rozbiła Haiti 7:0 — to najwyższe zwycięstwo biało-czerwonych w historii mistrzostw świata. Trzy gole strzelił wtedy Andrzej Szarmach.",category:"polandwc",year:1974,emoji:"7️⃣"},{id:"pwc14",text:"Na mundialu 1982 Polska zremisowała 0:0 z ZSRR w Barcelonie i awansowała do półfinału. Mecz rozgrywano w czasie stanu wojennego, a na trybunach wisiały transparenty „Solidarności”.",category:"polandwc",year:1982,emoji:"✊"},{id:"pwc15",text:"Rosja 2018: Polska przegrała z Senegalem 1:2 i z Kolumbią 0:3, odpadając już po dwóch meczach. Na pożegnanie pokonała Japonię 1:0 po golu Jana Bednarka.",category:"polandwc",year:2018,emoji:"🇷🇺"},{id:"pwc16",text:"Niemcy 2006: po porażkach z Ekwadorem i gospodarzami Polska wygrała na koniec z Kostaryką 2:1. Oba gole strzelił obrońca Bartosz Bosacki, który do kadry na mundial dostał się w ostatniej chwili.",category:"polandwc",year:2006,emoji:"⚽"},{id:"pe13",text:"11 października 2014 roku Polska po raz pierwszy w historii pokonała Niemcy — 2:0 w Warszawie, w eliminacjach Euro 2016. Gole strzelili Arkadiusz Milik i Sebastian Mila.",category:"polandeuro",year:2014,emoji:"🇩🇪"},{id:"pe14",text:"Kacper Kozłowski wszedł na boisko w meczu z Hiszpanią na Euro 2020, mając 17 lat i 246 dni. Został wtedy najmłodszym zawodnikiem w historii mistrzostw Europy.",category:"polandeuro",year:2021,emoji:"👶"},{id:"pe15",text:"Na Euro 2020 Robert Lewandowski strzelił Szwecji dwa gole, ale Polska przegrała 2:3 po golu w doliczonym czasie i odpadła z turnieju. Wcześniej to Lewandowski dał remis 1:1 z Hiszpanią.",category:"polandeuro",year:2021,emoji:"🇸🇪"},{id:"pe16",text:"W ćwierćfinale Euro 2016 z Portugalią Robert Lewandowski strzelił gola już po około 100 sekundach gry. Polska odpadła dopiero po rzutach karnych z późniejszymi mistrzami Europy.",category:"polandeuro",year:2016,emoji:"⏱️"},{id:"rv13",text:"Björn Borg i John McEnroe zagrali ze sobą 14 razy i każdy wygrał po siedem meczów. Lodowato spokojny Szwed i wybuchowy Amerykanin stworzyli najsłynniejszy kontrast charakterów w historii tenisa.",category:"rivalries",year:1981,emoji:"🎾"},{id:"rv14",text:"Garri Kasparow i Anatolij Karpow rozegrali pięć meczów o mistrzostwo świata (1984–1990) — łącznie 144 partie. Pierwszy mecz przerwano po pięciu miesiącach gry bez rozstrzygnięcia.",category:"rivalries",year:1990,emoji:"♟️"},{id:"rv15",text:"Novak Djoković i Rafael Nadal zmierzyli się 60 razy — to najczęściej rozgrywany pojedynek w męskim tenisie ery open. Nieznacznie lepszy bilans ma Serb.",category:"rivalries",year:2022,emoji:"🎾"},{id:"rv16",text:"W latach 2008–2017 Złotą Piłkę zdobywali wyłącznie Lionel Messi i Cristiano Ronaldo — po pięć razy każdy. Passę przerwał dopiero Luka Modrić w 2018 roku.",category:"rivalries",year:2017,emoji:"⚽"},{id:"mo13",text:"W grudniu 2023 roku Shohei Ohtani podpisał z Los Angeles Dodgers 10-letni kontrakt na 700 milionów dolarów — największy w historii sportu. Większość tej kwoty ma dostać dopiero po zakończeniu umowy.",category:"money",year:2023,emoji:"⚾"},{id:"mo14",text:"Real Madryt jako pierwszy klub piłkarski w historii przekroczył miliard euro przychodów w jednym sezonie (2023/24). Dużą część zarobił na odnowionym stadionie Santiago Bernabéu.",category:"money",year:2024,emoji:"💶"},{id:"mo15",text:"Gdy w 1968 roku Wimbledon po raz pierwszy wpuścił zawodowców, mistrz Rod Laver dostał 2000 funtów, a mistrzyni Billie Jean King — 750. Dziś zwycięzcy otrzymują kwoty liczone w milionach.",category:"money",year:1968,emoji:"💷"},{id:"mo16",text:"Od 2021 roku zespoły Formuły 1 mają limit wydatków — początkowo 145 milionów dolarów rocznie. Wcześniej czołowe ekipy wydawały nawet ponad dwa razy więcej.",category:"money",year:2021,emoji:"📉"},{id:"fi13",text:"Pierwszy turniej na Wimbledonie rozegrano w 1877 roku — wygrał go Spencer Gore przed około dwustoma widzami. Dochód z biletów miał pokryć naprawę walca do trawy.",category:"firsts",year:1877,emoji:"🌱"},{id:"fi14",text:"Pierwsze w historii złoto zimowych igrzysk zdobył Amerykanin Charles Jewtraw — w biegu na 500 m w łyżwiarstwie szybkim w Chamonix w 1924 roku.",category:"firsts",year:1924,emoji:"⛸️"},{id:"fi15",text:"Ray Harroun wygrał pierwszy wyścig Indianapolis 500 w 1911 roku, jadąc bez mechanika, który zwykle obserwował rywali. Zamiast niego zamontował lusterko wsteczne — jedno z pierwszych w historii motoryzacji.",category:"firsts",year:1911,emoji:"🪞"},{id:"fi16",text:"Na pierwszy Super Bowl w 1967 roku nie wyprzedano biletów — około jednej trzeciej miejsc na stadionie w Los Angeles zostało pustych. Wejściówki kosztowały 12 dolarów.",category:"firsts",year:1967,emoji:"🏈"},{id:"age13",text:"Koreanka Kim Yun-mi zdobyła złoto olimpijskie w sztafecie short tracku w Lillehammer w 1994 roku, mając 13 lat. Jest najmłodszą mistrzynią zimowych igrzysk.",category:"ages",year:1994,emoji:"⛸️"},{id:"age14",text:"Sachin Tendulkar zadebiutował w reprezentacji Indii w krykiecie w 1989 roku jako 16-latek — w meczu z Pakistanem. Grał potem na najwyższym poziomie przez 24 lata.",category:"ages",year:1989,emoji:"🏏"},{id:"age15",text:"Gordie Howe grał w NHL jeszcze w sezonie 1979/80, mając 51–52 lata. W tym ostatnim sezonie wystąpił we wszystkich 80 meczach swojej drużyny.",category:"ages",year:1980,emoji:"🏒"},{id:"age16",text:"Ken Rosewall w 1974 roku, w wieku 39 lat, doszedł do finałów Wimbledonu i US Open. Swój pierwszy finał wielkoszlemowy grał dwadzieścia lat wcześniej.",category:"ages",year:1974,emoji:"🎾"},{id:"dy13",text:"New York Yankees wygrali World Series pięć razy z rzędu (1949–1953). Żadna inna drużyna baseballowa nie zdobyła więcej niż trzech tytułów z rzędu.",category:"dynasties",year:1953,emoji:"⚾"},{id:"dy14",text:"Australia wygrała mistrzostwa świata w krykiecie trzy razy z rzędu (1999, 2003, 2007). Między 1999 a 2011 rokiem rozegrała na mundialach 34 mecze z rzędu bez porażki.",category:"dynasties",year:2007,emoji:"🏏"},{id:"dy15",text:"Rosjanki wygrały wszystkie olimpijskie konkurencje pływania synchronicznego od Sydney 2000 do Rio 2016 — w duetach i drużynach. Na pięciu igrzyskach z rzędu nie oddały ani jednego złota.",category:"dynasties",year:2016,emoji:"🩱"},{id:"dy16",text:"Nowozelandzcy All Blacks jako pierwsi obronili tytuł mistrzów świata w rugby (2011, 2015). Wygrali też pierwszy w historii Puchar Świata, w 1987 roku.",category:"dynasties",year:2015,emoji:"🏉"},{id:"nk13",text:"Emila Zátopka nazywano „czeską lokomotywą”. Biegał z wykrzywioną twarzą, kiwając głową i ciężko sapiąc, jakby każdy krok był ostatnim — a mimo to wygrywał.",category:"nicknames",year:1952,emoji:"🚂"},{id:"nk14",text:"Joe Louisa nazywano „Brązowym Bombardierem” (Brown Bomber). Tytuł mistrza świata wagi ciężkiej obronił rekordowe 25 razy.",category:"nicknames",year:1937,emoji:"🥊"},{id:"nk15",text:"Portugalczyka Eusébio nazywano „Czarną Perłą” i „Czarną Panterą”. Na mundialu 1966 został królem strzelców z dziewięcioma golami.",category:"nicknames",year:1966,emoji:"🐆"},{id:"nk16",text:"Diego Maradonę nazywano w Argentynie „El Pibe de Oro” — złotym chłopcem. W Neapolu, z którym zdobył dwa mistrzostwa Włoch, czczono go niemal jak świętego.",category:"nicknames",year:1987,emoji:"🌟"},{id:"ru13",text:"Trzy punkty za zwycięstwo zamiast dwóch wprowadzono w Anglii w 1981 roku, by zachęcić drużyny do gry o wygraną. Na mistrzostwach świata zasada obowiązuje od 1994 roku.",category:"rules",year:1981,emoji:"3️⃣"},{id:"ru14",text:"Libero — siatkarz w koszulce innego koloru, specjalista od obrony i przyjęcia — pojawił się w przepisach w 1998 roku. Nie wolno mu atakować piłki powyżej siatki.",category:"rules",year:1998,emoji:"🏐"},{id:"ru15",text:"Linia rzutów za trzy punkty pojawiła się w NBA dopiero w sezonie 1979/80. Wcześniej taki przepis stosowała konkurencyjna liga ABA.",category:"rules",year:1979,emoji:"🏀"},{id:"ru16",text:"Od 1990 roku zawodnik ustawiony na równi z przedostatnim obrońcą nie jest na spalonym. Wcześniej taka pozycja była karana, a zmiana miała sprzyjać atakującym.",category:"rules",year:1990,emoji:"🚩"},{id:"up13",text:"Na mundialu 1950 złożona z amatorów drużyna USA pokonała Anglię 1:0. Według legendy część redakcji uznała wynik za pomyłkę i wydrukowała 10:1 dla Anglików.",category:"upsets",year:1950,emoji:"🇺🇸"},{id:"up14",text:"Na mundialu 1966 Korea Północna pokonała Włochy 1:0 po golu Pak Doo-ika i wyeliminowała je z turnieju. Włoskich piłkarzy po powrocie obrzucono na lotnisku pomidorami.",category:"upsets",year:1966,emoji:"🍅"},{id:"up15",text:"Arabia Saudyjska na mundialu 2022 pokonała 2:1 Argentynę, niepokonaną wcześniej w 36 meczach z rzędu. Król ogłosił następnego dnia w kraju dzień wolny.",category:"upsets",year:2022,emoji:"🇸🇦"},{id:"up16",text:"Australijczyk Steven Bradbury zdobył złoto w short tracku w Salt Lake City 2002, choć na ostatnim wirażu finału był wyraźnie ostatni. Wszyscy rywale przewrócili się tuż przed nim.",category:"upsets",year:2002,emoji:"⛸️"},{id:"ma13",text:"Ćwierćfinał mundialu 1986 Argentyna–Anglia (2:1): w ciągu czterech minut Diego Maradona strzelił gola ręką, nazwanego „ręką Boga”, i „gola stulecia” po rajdzie przez pół boiska.",category:"matches",year:1986,emoji:"✋"},{id:"ma14",text:"Półfinał mundialu 2014 w Belo Horizonte: Niemcy rozbiły gospodarzy Brazylię 7:1, a po 29 minutach prowadziły już 5:0. Cztery gole padły w ciągu sześciu minut.",category:"matches",year:2014,emoji:"😱"},{id:"ma15",text:"Finał Australian Open 2012 Djoković–Nadal trwał 5 godzin i 53 minuty — to najdłuższy finał w historii Wielkiego Szlema. Wyczerpanym zawodnikom podano krzesła podczas ceremonii.",category:"matches",year:2012,emoji:"🎾"},{id:"ma16",text:"W półfinale Ligi Mistrzów 2019 Liverpool przegrał w Barcelonie 0:3, a w rewanżu na Anfield wygrał 4:0 — bez kontuzjowanych Salaha i Firmino. Decydujący gol padł po błyskawicznie wykonanym rzucie rożnym.",category:"matches",year:2019,emoji:"🔴"},{id:"der13",text:"Derby Mediolanu nazywane są „Derby della Madonnina” — od złotej figurki Matki Boskiej na szczycie mediolańskiej katedry. Milan i Inter dzielą ten sam stadion San Siro.",category:"derbies",year:1908,emoji:"⛪"},{id:"der14",text:"Krakowska „Święta Wojna” Wisły z Cracovią to najstarsze derby w Polsce — kluby grają ze sobą od 1906 roku. Ich stadiony dzielą tylko Błonia, kilkaset metrów.",category:"derbies",year:1906,emoji:"⚔️"},{id:"der15",text:"Real i Atlético Madryt zagrały ze sobą w dwóch finałach Ligi Mistrzów (2014 i 2016) — oba wygrał Real. W 2014 roku Atlético prowadziło aż do doliczonego czasu gry.",category:"derbies",year:2014,emoji:"🏆"},{id:"der16",text:"W październiku 2011 roku Manchester City wygrał derby na Old Trafford 6:1. Mario Balotelli po golu pokazał koszulkę z napisem „Why always me?”.",category:"derbies",year:2011,emoji:"🔵"},{id:"gk13",text:"Walter Zenga na mundialu 1990 nie puścił gola przez 517 minut z rzędu — to wciąż rekord mistrzostw świata. Passę przerwał dopiero Claudio Caniggia w półfinale.",category:"goalkeepers",year:1990,emoji:"🧤"},{id:"gk14",text:"Na mundialu 2014 trener Holandii Louis van Gaal w ostatniej minucie dogrywki ćwierćfinału z Kostaryką wpuścił rezerwowego bramkarza Tima Krula specjalnie na rzuty karne. Krul obronił dwa strzały.",category:"goalkeepers",year:2014,emoji:"🔄"},{id:"gk15",text:"Jerzy Dudek w finale Ligi Mistrzów 2005 rozpraszał strzelców „tańcem na linii”, wzorowanym na Bruce'u Grobbelaarze. Obronił dwa karne, a wcześniej w dogrywce podwójną okazję Szewczenki.",category:"goalkeepers",year:2005,emoji:"🕺"},{id:"gk16",text:"Juventus kupił Gianluigiego Buffona z Parmy w 2001 roku za równowartość ponad 50 milionów euro. Przez 17 lat był to najdroższy transfer bramkarza w historii.",category:"goalkeepers",year:2001,emoji:"💰"},{id:"sp13",text:"Brytyjski samochód ThrustSSC jako pierwszy pojazd lądowy przekroczył barierę dźwięku — w 1997 roku na pustyni w Nevadzie osiągnął 1228 km/h. Prowadził go pilot myśliwca Andy Green.",category:"speed",year:1997,emoji:"🚀"},{id:"sp14",text:"Zdeno Chára uderzył w 2012 roku krążek z prędkością 175,1 km/h — to rekord konkursu umiejętności NHL. Krążek z taką prędkością pokonałby długość lodowiska w niewiele ponad sekundę.",category:"speed",year:2012,emoji:"🏒"},{id:"sp15",text:"Motocykle żużlowe nie mają hamulców ani skrzyni biegów, a na prostych rozpędzają się do ponad 100 km/h. Zawodnik wytraca prędkość, kładąc maszynę w ślizgu.",category:"speed",year:1950,emoji:"🏍️"},{id:"sp16",text:"Czwórki bobslejowe rozpędzają się na lodowych torach do ponad 150 km/h. W wirażach zawodnicy odczuwają przeciążenia kilkukrotnie przekraczające ich masę ciała.",category:"speed",year:2010,emoji:"🛷"},{id:"bb13",text:"Cal Ripken Jr. zagrał w 2632 meczach MLB z rzędu (1982–1998), nie opuszczając ani jednego spotkania przez ponad 16 lat. Pobił rekord Lou Gehriga, który przetrwał 56 lat.",category:"baseball",year:1995,emoji:"🔁"},{id:"bb14",text:"Hank Aaron w 1974 roku pobił rekord 714 home runów Babe'a Rutha. W okresie poprzedzającym rekord dostawał tysiące listów z pogróżkami od rasistów.",category:"baseball",year:1974,emoji:"⚾"},{id:"bb15",text:"Barry Bonds zakończył karierę z rekordowymi 762 home runami. Jego osiągnięcia przyćmiły jednak oskarżenia o stosowanie sterydów.",category:"baseball",year:2007,emoji:"💥"},{id:"bb16",text:"Japończyk Ichiro Suzuki zaliczył w sezonie 2004 aż 262 uderzenia — rekord MLB. Poprzedni rekord, George'a Sislera z 1920 roku, przetrwał 84 lata.",category:"baseball",year:2004,emoji:"🇯🇵"},{id:"cr13",text:"Indie prowadzone przez Kapila Deva w 1983 roku sensacyjnie wygrały mistrzostwa świata w krykiecie, pokonując w finale dwukrotnych mistrzów z Indii Zachodnich. Ten sukces rozpalił krykietowe szaleństwo w Indiach.",category:"cricket",year:1983,emoji:"🇮🇳"},{id:"cr14",text:"Brian Lara z Indii Zachodnich zdobył w 2004 roku w meczu testowym z Anglią 400 punktów w jednej rundzie, nie dając się wyeliminować. To wciąż rekord krykieta testowego.",category:"cricket",year:2004,emoji:"4️⃣"},{id:"cr15",text:"Lankijski spinner Muttiah Muralitharan zakończył karierę testową w 2010 roku z 800 wyeliminowanymi pałkarzami — najwięcej w historii. Ostatnią, 800. ofiarę zdobył w swoim pożegnalnym meczu.",category:"cricket",year:2010,emoji:"🌀"},{id:"cr16",text:"Pierwszy rzut Shane'a Warne'a w meczach o The Ashes w 1993 roku nazwano „piłką stulecia”. Piłka skręciła tak mocno, że minęła pałkę Mike'a Gattinga i strąciła bramkę.",category:"cricket",year:1993,emoji:"🎯"},{id:"nd13",text:"Justyna Kowalczyk wygrała Tour de Ski cztery razy z rzędu (2010–2013). Czterokrotnie zdobyła też Kryształową Kulę za zwycięstwo w Pucharze Świata.",category:"nordic",year:2013,emoji:"🇵🇱"},{id:"nd14",text:"W biegu na 15 km w Lake Placid 1980 Szwed Thomas Wassberg pokonał Fina Juhę Mieto o jedną setną sekundy. Po tym wyścigu w biegach narciarskich zaczęto zaokrąglać czasy do dziesiątych części sekundy.",category:"nordic",year:1980,emoji:"⏱️"},{id:"nd15",text:"Biathlon zadebiutował na igrzyskach w Squaw Valley w 1960 roku — jednym biegiem na 20 km. Pierwszym mistrzem olimpijskim został Szwed Klas Lestander.",category:"nordic",year:1960,emoji:"🎯"},{id:"nd16",text:"Kobiety rywalizują w olimpijskim biathlonie dopiero od igrzysk w Albertville w 1992 roku — 32 lata po mężczyznach.",category:"nordic",year:1992,emoji:"👩"},{id:"tp13",text:"Zwycięzca Roland Garros dostaje Puchar Muszkieterów — nazwany na cześć czterech francuskich tenisistów, którzy pod koniec lat 20. wygrali Puchar Davisa. To dla obrony tego trofeum zbudowano stadion Roland Garros.",category:"trophies",year:1928,emoji:"🤺"},{id:"tp14",text:"Trofeum Vince'a Lombardiego dla zwycięzcy Super Bowl wykonuje jubilerska firma Tiffany & Co. To srebrna piłka ustawiona do kopnięcia — co roku powstaje nowa, a mistrz zatrzymuje ją na zawsze.",category:"trophies",year:1967,emoji:"💎"},{id:"tp15",text:"Puchar Stanleya kupił w 1892 roku gubernator generalny Kanady lord Stanley — za dziesięć gwinei. Sam nigdy nie zobaczył meczu o swoje trofeum.",category:"trophies",year:1892,emoji:"🏒"},{id:"tp16",text:"Męskie trofeum Wimbledonu to pozłacany srebrny puchar z napisem „The All England Lawn Tennis Club Single Handed Champion of the World”. Zwycięzca dostaje na własność tylko jego pomniejszoną replikę.",category:"trophies",year:1887,emoji:"🏆"},{id:"pr13",text:"Węgierski strzelec Károly Takács stracił prawą dłoń w wypadku z granatem w 1938 roku. Nauczył się strzelać lewą ręką i zdobył złoto olimpijskie w strzelaniu z pistoletu w 1948 i 1952 roku.",category:"precision",year:1948,emoji:"🎯"},{id:"pr14",text:"Pétanque wymyślono w 1907 roku w La Ciotat dla gracza cierpiącego na reumatyzm, który nie mógł robić rozbiegu. Rzuca się z miejsca, ze złączonymi stopami — po prowansalsku „pieds tanqués”.",category:"precision",year:1907,emoji:"⚪"},{id:"pr15",text:"Renata Mauer-Różańska zdobyła dwa złote medale olimpijskie w strzelectwie: w Atlancie 1996 z karabinu pneumatycznego i w Sydney 2000 z karabinu w trzech postawach.",category:"precision",year:2e3,emoji:"🇵🇱"},{id:"pc13",text:"Legia Warszawa doszła w 1970 roku do półfinału Pucharu Europy Mistrzów Klubowych. Odpadła z Feyenoordem, który później wygrał całe rozgrywki.",category:"polandclubs",year:1970,emoji:"🏟️"},{id:"pc14",text:"Raków Częstochowa zdobył pierwsze w historii mistrzostwo Polski w 2023 roku, po latach gry w niższych ligach. Do Ekstraklasy klub awansował dopiero w 2019 roku.",category:"polandclubs",year:2023,emoji:"🏆"},{id:"pc15",tex
