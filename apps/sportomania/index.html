t:"Lech Poznań w 2023 roku doszedł do ćwierćfinału Ligi Konferencji Europy, gdzie przegrał z Fiorentiną. Było to najlepsze europejskie osiągnięcie polskiego klubu od lat.",category:"polandclubs",year:2023,emoji:"🦅"},{id:"pol13",text:"Mundial 1978 rozegrano w Argentynie rządzonej przez wojskową juntę. Kilka kilometrów od stadionu finałowego działało tajne więzienie, a turniej miał ocieplić wizerunek dyktatury.",category:"politics",year:1978,emoji:"🇦🇷"},{id:"pol14",text:"Od 1981 roku kobietom w Iranie praktycznie nie wolno było wchodzić na stadiony piłkarskie. Dopiero w 2019 roku, pod presją FIFA, kilka tysięcy kobiet obejrzało z trybun mecz reprezentacji.",category:"politics",year:2019,emoji:"🇮🇷"},{id:"pol15",text:"Gibraltar, brytyjskie terytorium zamorskie, został członkiem UEFA w 2013 roku mimo sprzeciwu Hiszpanii. Z tego powodu obie reprezentacje są rozdzielane przy losowaniach grup.",category:"politics",year:2013,emoji:"🇬🇮"},{id:"cb13",text:"Tiger Woods po serii operacji kręgosłupa nie był w stanie normalnie chodzić i wypadł poza tysięczne miejsce w rankingu. W 2019 roku, w wieku 43 lat, wygrał Masters — swój 15. turniej wielkoszlemowy.",category:"comebacks",year:2019,emoji:"🐯"},{id:"cb14",text:"Greg LeMond w 1987 roku został przypadkowo postrzelony na polowaniu i w jego ciele zostało kilkadziesiąt śrucin. Dwa lata później wygrał Tour de France — o osiem sekund, najmniejszą przewagą w historii.",category:"comebacks",year:1989,emoji:"🚴"},{id:"cb15",text:"Robert Kubica w 2011 roku ciężko rozbił się w rajdzie, a jego prawa ręka była niemal zmiażdżona. Po ośmiu latach wrócił do Formuły 1 w zespole Williams i zdobył w sezonie 2019 punkt.",category:"comebacks",year:2019,emoji:"🏎️"},{id:"mn13",text:"Jana Novotná w finale Wimbledonu 1993 prowadziła ze Steffi Graf w trzecim secie 4:1 — i przegrała. Płakała na ramieniu księżnej Kentu, a turniej wygrała dopiero pięć lat później.",category:"mind",year:1993,emoji:"😢"},{id:"mn14",text:"W Pekinie 2008 Michaelowi Phelpsowi na 200 m motylkiem gogle zalały się wodą. Płynął praktycznie na ślepo, licząc ruchy ramion, i wygrał z rekordem świata.",category:"mind",year:2008,emoji:"🥽"},{id:"mn15",text:"Naomi Osaka w 2021 roku wycofała się z Roland Garros, mówiąc otwarcie o depresji i lęku przed konferencjami prasowymi. Jej decyzja rozpoczęła szeroką dyskusję o zdrowiu psychicznym sportowców.",category:"mind",year:2021,emoji:"🧠"},{id:"cl13",text:"Holendrzy grają na pomarańczowo, choć na ich fladze tego koloru nie ma. Barwa pochodzi od panującej dynastii Orańskiej (Oranje-Nassau).",category:"colors",year:1934,emoji:"🟠"},{id:"cl14",text:"Włoscy sportowcy to „Azzurri”, bo niebieski był kolorem dynastii sabaudzkiej, która zjednoczyła Włochy. Niebieskie koszulki piłkarze reprezentacji noszą od 1911 roku.",category:"colors",year:1911,emoji:"🔵"},{id:"cl15",text:"Arsenal gra na czerwono dzięki Nottingham Forest. Gdy klub powstał w 1886 roku, dwóch jego założycieli wcześniej grało w Forest i stamtąd dostało pierwszy komplet czerwonych koszulek.",category:"colors",year:1886,emoji:"🔴"},{id:"un13",text:"Quidditch z książek o Harrym Potterze stał się prawdziwym sportem w 2005 roku na amerykańskim Middlebury College. Zawodnicy biegają z kijem między nogami, a dziś dyscyplina nosi nazwę quadball.",category:"unusual",year:2005,emoji:"🧹"},{id:"un14",text:"Cotswold Olimpicks w Anglii rozgrywane są od 1612 roku. Najsłynniejszą konkurencją jest kopanie się po goleniach — zawodnicy wypychają spodnie słomą, by złagodzić ciosy.",category:"unusual",year:1612,emoji:"🦵"},{id:"un15",text:"W fińskim Oulu od 1996 roku odbywają się mistrzostwa świata w grze na niewidzialnej gitarze. Sędziowie oceniają technikę, ekspresję i „airness”.",category:"unusual",year:1996,emoji:"🎸"},{id:"fn13",text:"Japońscy kibice na mundialach zasłynęli sprzątaniem trybun po meczach — przynoszą własne worki na śmieci. Szatnię po sobie sprzątają też japońscy piłkarze.",category:"fans",year:2018,emoji:"🧹"},{id:"fn14",text:"Hamburski FC St. Pauli ma kibiców z całego świata, a jego nieoficjalnym symbolem jest piracka czaszka ze skrzyżowanymi piszczelami. Klub słynie z zaangażowania w sprawy społeczne.",category:"fans",year:1980,emoji:"🏴‍☠️"},{id:"fn15",text:"Kibice Unionu Berlin sami przebudowali swój stadion w 2008 roku — ponad dwa tysiące wolontariuszy przepracowało przy tym około 140 tysięcy godzin. Wcześniej oddawali krew, by ratować klub przed bankructwem.",category:"fans",year:2008,emoji:"🔨"},{id:"md13",text:"Pierwszą radiową transmisję meczu baseballowego nadała w 1921 roku stacja KDKA z Pittsburgha. Spiker Harold Arlin relacjonował mecz z drewnianej budki przy trybunach.",category:"media",year:1921,emoji:"📻"},{id:"md14",text:"Wimbledon 1967 był pierwszym programem pokazanym w Wielkiej Brytanii w kolorze. BBC wybrała tenis, bo zielona trawa i białe stroje dobrze prezentowały nową technologię.",category:"media",year:1967,emoji:"🌈"},{id:"md15",text:"„Monday Night Football” zadebiutował w 1970 roku jako pierwszy cotygodniowy mecz NFL w telewizyjnym czasie największej oglądalności. Program nadawany jest do dziś.",category:"media",year:1970,emoji:"🏈"},{id:"ce13",text:"Znicz olimpijski w Atlancie 1996 zapalił Muhammad Ali, już wtedy chory na parkinsona. Drżącymi rękami trzymał pochodnię przed milionami widzów.",category:"ceremonies",year:1996,emoji:"🔥"},{id:"ce14",text:"Hymn olimpijski skomponował Spiros Samaras na pierwsze nowożytne igrzyska w 1896 roku. Na długo o nim zapomniano — oficjalnym hymnem MKOl uczynił go dopiero w 1958 roku.",category:"ceremonies",year:1958,emoji:"🎼"},{id:"ce15",text:"Hymn Ligi Mistrzów skomponował w 1992 roku Tony Britten, wzorując się na utworze „Zadok the Priest” Händla. Słowa śpiewane są po angielsku, francusku i niemiecku.",category:"ceremonies",year:1992,emoji:"🎶"},{id:"ge13",text:"Pole golfowe Furnace Creek w Dolinie Śmierci leży około 65 metrów poniżej poziomu morza — to najniżej położone pole golfowe świata. Latem temperatura przekracza tam 50°C.",category:"geography",emoji:"⛳"},{id:"ge14",text:"Na mundialu 1994 rozegrano pierwszy w historii mecz mistrzostw świata pod dachem — w hali Pontiac Silverdome koło Detroit. Naturalną trawę wyhodowano poza halą i ułożono na boisku w setkach sześciokątnych palet.",category:"geography",year:1994,emoji:"🏟️"},{id:"ge15",text:"Tour de France po raz pierwszy wystartował za granicą w 1954 roku — w Amsterdamie. Dziś zagraniczny start („Grand Départ”) to prestiżowe wydarzenie, o które walczą miasta Europy.",category:"geography",year:1954,emoji:"🗺️"},{id:"fa13",text:"Cesare i Paolo Maldini, ojciec i syn, jako kapitanowie Milanu podnosili Puchar Europy — Cesare w 1963, a Paolo w 2003 roku. W barwach Milanu grał też wnuk Daniel.",category:"families",year:2003,emoji:"🔴"},{id:"fa14",text:"Bracia Bobby i Jack Charltonowie razem zdobyli mistrzostwo świata z Anglią w 1966 roku. Bobby był gwiazdą ataku, a Jack — twardym środkowym obrońcą.",category:"families",year:1966,emoji:"🏴"},{id:"fa15",text:"Keke Rosberg został mistrzem świata Formuły 1 w 1982 roku, a jego syn Nico — w 2016. Nico zaraz po zdobyciu tytułu ogłosił zakończenie kariery.",category:"families",year:2016,emoji:"🏁"},{id:"wr13",text:"W Boże Narodzenie 1914 roku na froncie zachodnim doszło do spontanicznego rozejmu. Brytyjscy i niemieccy żołnierze wychodzili z okopów, a według relacji w kilku miejscach grali razem w piłkę.",category:"war",year:1914,emoji:"🎄"},{id:"wr14",text:"Bronisław Czech, najwszechstronniejszy polski narciarz okresu międzywojennego, był kurierem podziemia. Zginął w Auschwitz w 1944 roku, a w obozie malował i rzeźbił.",category:"war",year:1944,emoji:"⛷️"},{id:"wr15",text:"Gino Bartali, dwukrotny zwycięzca Tour de France, w czasie wojny przewoził w ramie roweru fałszywe dokumenty dla Żydów, udając treningi. W 2013 roku został uznany za Sprawiedliwego wśród Narodów Świata.",category:"war",year:1943,emoji:"🚲"},{id:"di13",text:"Legenda głosi, że Michael Phelps w czasie igrzysk w Pekinie jadł 12 tysięcy kalorii dziennie. Sam pływak przyznał później, że ta liczba była mocno przesadzona.",category:"diet",year:2008,emoji:"🍳"},{id:"di14",text:"Badania z 2009 roku wykazały, że sok z buraków poprawia wydolność — azotany pomagają mięśniom zużywać mniej tlenu. Od tego czasu buraczane shoty stały się popularne wśród biegaczy i kolarzy.",category:"diet",year:2009,emoji:"🥤"},{id:"di15",text:"Novak Djoković po wykryciu nietolerancji glutenu w 2010 roku zmienił dietę. W następnym sezonie wygrał trzy turnieje wielkoszlemowe i został liderem rankingu.",category:"diet",year:2011,emoji:"🍞"},{id:"ar13",text:"W finale US Open 2018 sędzia Carlos Ramos ukarał Serenę Williams trzema ostrzeżeniami — za podpowiedzi trenera, rozbicie rakiety i obrażanie go — co kosztowało ją gema. Turniej wygrała Naomi Osaka.",category:"referees",year:2018,emoji:"🎾"},{id:"ar14",text:"W finale mundialu 2010 Hiszpania–Holandia Howard Webb pokazał 14 żółtych kartek i jedną czerwoną — rekord finałów mistrzostw świata. Holender Nigel de Jong kopnął wtedy Xabiego Alonso w klatkę piersiową.",category:"referees",year:2010,emoji:"🟥"},{id:"ar15",text:"Sarah Thomas w 2021 roku jako pierwsza kobieta sędziowała Super Bowl. Wcześniej była też pierwszą stałą sędzią w lidze NFL.",category:"referees",year:2021,emoji:"🏈"},{id:"tg13",text:"Weekend Grand Prix San Marino 1994 na torze Imola przyniósł śmierć Rolanda Ratzenbergera i trzykrotnego mistrza świata Ayrtona Senny. Po tych wypadkach Formuła 1 gruntownie zmieniła przepisy bezpieczeństwa.",category:"tragedies",year:1994,emoji:"🕯️"},{id:"tg14",text:"W 1964 roku na stadionie narodowym w Limie, podczas meczu Peru–Argentyna, wybuchła panika po nieuznanym golu. Zginęło ponad 300 osób — to jedna z największych tragedii w historii sportu.",category:"tragedies",year:1964,emoji:"🇵🇪"},{id:"tg15",text:"W 2022 roku na stadionie Kanjuruhan w Indonezji policja użyła gazu łzawiącego na trybunach. W panice przy zamkniętych wyjściach zginęło 135 osób.",category:"tragedies",year:2022,emoji:"🇮🇩"},{id:"fp13",text:"Miroslav Klose w 2012 roku sam przyznał sędziemu, że gola dla Lazio przeciwko Napoli zdobył ręką. Bramkę anulowano, a Niemiec dostał oklaski nawet od rywali.",category:"fairplay",year:2012,emoji:"✋"},{id:"fp14",text:"Emil Zátopek w 1966 roku podarował swój złoty medal olimpijski Australijczykowi Ronowi Clarke'owi. Clarke bił rekordy świata, ale nigdy nie wygrał igrzysk — Czech uznał, że zasłużył na złoto.",category:"fairplay",year:1966,emoji:"🎁"},{id:"fp15",text:"Na igrzyskach w Turynie 2006 Kanadyjce Sarze Renner złamał się kijek w sprincie drużynowym. Norweski trener podał jej zapasowy — Kanada zdobyła srebro, a Norwegia skończyła tuż za podium.",category:"fairplay",year:2006,emoji:"🎿"},{id:"cg13",text:"Pierwszy mecz akademickiego futbolu w USA rozegrały w 1869 roku Rutgers i Princeton. Gra bardziej przypominała wtedy piłkę nożną niż dzisiejszy futbol amerykański.",category:"college",year:1869,emoji:"🏈"},{id:"cg14",text:"Związek, z którego wyrosła NCAA, powstał w 1906 roku po serii śmiertelnych wypadków w akademickim futbolu. Do zmiany przepisów namawiał uczelnie prezydent Theodore Roosevelt.",category:"college",year:1906,emoji:"⚖️"},{id:"cg15",text:"Mike Krzyzewski, pochodzący z polskiej rodziny z Chicago, wygrał jako trener koszykarzy Duke ponad 1200 meczów — najwięcej w historii męskiej koszykówki akademickiej. Zdobył też pięć tytułów mistrza NCAA.",category:"college",year:2022,emoji:"🇵🇱"},{id:"sl13",text:"Bill Bradley, dwukrotny mistrz NBA z New York Knicks, po karierze przez 18 lat zasiadał w Senacie USA. W 2000 roku ubiegał się nawet o nominację prezydencką.",category:"secondlife",year:1979,emoji:"🏛️"},{id:"sl14",text:"Pelé w latach 1995–1998 był ministrem sportu Brazylii. Przygotował ustawę, która ułatwiła piłkarzom zmianę klubów po wygaśnięciu kontraktu.",category:"secondlife",year:1995,emoji:"⚽"},{id:"sl15",text:"Usain Bolt po zakończeniu kariery lekkoatletycznej próbował zostać zawodowym piłkarzem. W 2018 roku trenował z australijskim Central Coast Mariners i strzelił dwa gole w meczu sparingowym.",category:"secondlife",year:2018,emoji:"⚡"},{id:"nu13",text:"Numer 99 Wayne'a Gretzky'ego zastrzeżono w 2000 roku w całej lidze NHL. Żaden hokeista nie może już w nim zagrać.",category:"numbers",year:2e3,emoji:"9️⃣"},{id:"nu14",text:"Po śmierci Billa Russella w 2022 roku NBA zastrzegła jego numer 6 we wszystkich klubach — jako pierwszy w historii ligi. Zawodnicy, którzy już go nosili, mogli przy nim zostać.",category:"numbers",year:2022,emoji:"6️⃣"},{id:"nu15",text:"W NFL numer na koszulce zależy od pozycji — przepis wprowadzono w 1973 roku. Dzięki temu sędziowie od razu wiedzą, który zawodnik linii może legalnie złapać podanie.",category:"numbers",year:1973,emoji:"🔢"},{id:"su13",text:"Na mundialu 1998 Laurent Blanc przed każdym meczem całował łysą głowę bramkarza Fabiena Bartheza. Francja wygrała turniej, a rytuał stał się symbolem tamtej drużyny.",category:"superstitions",year:1998,emoji:"💋"},{id:"su14",text:"Baseballista Wade Boggs przed każdym meczem jadł kurczaka, a trening odbijania zaczynał zawsze o 17:17. Koledzy nazywali go „Chicken Man”.",category:"superstitions",year:1990,emoji:"🍗"},{id:"su15",text:"Goran Ivanišević podczas zwycięskiego Wimbledonu 2001 codziennie jadł w tej samej restauracji przy tym samym stoliku. Rano oglądał też „Teletubisie”, bo uznał je za szczęśliwe.",category:"superstitions",year:2001,emoji:"📺"},{id:"hf13",text:"Galeria Sław futbolu amerykańskiego stoi w Canton w stanie Ohio — w mieście, w którym w 1920 roku założono ligę, z której wyrosła NFL. Nowo przyjęci zawodnicy dostają złote marynarki.",category:"halls",year:1963,emoji:"🏈"},{id:"hf14",text:"Pete Rose, rekordzista MLB w liczbie uderzeń, przez dekady nie mógł trafić do Galerii Sław baseballu, bo obstawiał mecze, także własnej drużyny. W 2025 roku, już po jego śmierci, liga zdjęła z niego dożywotni zakaz.",category:"halls",year:2025,emoji:"⚾"},{id:"hf15",text:"Muzeum Realu Madryt na stadionie Santiago Bernabéu należy do najchętniej odwiedzanych muzeów w Madrycie. Gablota z pucharami Ligi Mistrzów zajmuje w nim całą ścianę.",category:"halls",year:2e3,emoji:"🏛️"},{id:"aa13",text:"Na mundialu 1978 sędzia Clive Thomas zakończył mecz Brazylia–Szwecja w chwili, gdy piłka po rzucie rożnym leciała do bramki. Zico trafił głową, ale gola nie uznano i padł remis 1:1.",category:"anecdotes",year:1978,emoji:"⏱️"},{id:"aa14",text:"W ostatnim meczu sezonu 1999 wypożyczony bramkarz Carlisle United Jimmy Glass pobiegł w doliczonym czasie pod bramkę rywali i strzelił gola. Uratował klub przed spadkiem z ligi zawodowej.",category:"anecdotes",year:1999,emoji:"🧤"},{id:"aa15",text:"Na mundialu 1962 na boisko podczas meczu Anglia–Brazylia wbiegł pies. Jimmy Greaves złapał go, a zwierzę w podzięce obsikało mu koszulkę. Garrincha podobno potem zabrał psa do domu.",category:"anecdotes",year:1962,emoji:"🐕"},{id:"mw13",text:"Judo zadebiutowało na igrzyskach w Tokio w 1964 roku, a Japończycy byli pewni złota w kategorii otwartej. Wygrał jednak Holender Anton Geesink — w hali zapadła cisza.",category:"martial",year:1964,emoji:"🥋"},{id:"mw14",text:"Bruce Lee stworzył własną filozofię walki jeet kune do i spopularyzował sztuki walki na Zachodzie. Zmarł w 1973 roku, w wieku 32 lat, tuż przed premierą filmu „Wejście smoka”.",category:"martial",year:1973,emoji:"🐉"},{id:"mw15",text:"Paweł Nastula zdobył złoto olimpijskie w judo w Atlancie w 1996 roku i przez kilka lat nie przegrał żadnej walki. Później jako jeden z pierwszych polskich mistrzów olimpijskich spróbował sił w MMA.",category:"martial",year:1996,emoji:"🇵🇱"},{id:"pa13",text:"Rafał Wilk, były żużlowiec, po wypadku na torze stracił władzę w nogach i zaczął ścigać się na rowerze ręcznym. Na igrzyskach paraolimpijskich w Londynie 2012 zdobył dwa złote medale.",category:"para",year:2012,emoji:"🇵🇱"},{id:"pa14",text:"Włoszka Bebe Vio jako dziecko straciła wszystkie cztery kończyny z powodu zapalenia opon mózgowych. Mimo to została mistrzynią paraolimpijską we florecie na wózkach w Rio 2016 i Tokio 2020.",category:"para",year:2016,emoji:"🤺"},{id:"pa15",text:"Brazylijski pływak Daniel Dias zdobył 27 medali paraolimpijskich, w tym 14 złotych. Pływać nauczył się dopiero jako 16-latek, zainspirowany występami innych paraolimpijczyków.",category:"para",year:2021,emoji:"🏊"},{id:"sn13",text:"San Marino zdobyło w Tokio 2020 swoje pierwsze medale olimpijskie — od razu trzy. Stało się najmniejszym państwem w historii z medalem letnich igrzysk.",category:"smallnations",year:2021,emoji:"🇸🇲"},{id:"sn14",text:"Julien Alfred wygrała w Paryżu 2024 bieg na 100 m i zdobyła pierwszy w historii medal olimpijski dla Saint Lucii. Wyspa liczy niespełna 200 tysięcy mieszkańców.",category:"smallnations",year:2024,emoji:"🇱🇨"},{id:"sn15",text:"Wyspy Owcze w swoim pierwszym oficjalnym meczu w 1990 roku pokonały Austrię 1:0. Ich bramkarz grał w czapce z pomponem, a mecz rozegrano w Szwecji, bo na wyspach nie było boiska z trawą.",category:"smallnations",year:1990,emoji:"🇫🇴"},{id:"qu13",text:"Olimpijskie motto „Citius, Altius, Fortius” (szybciej, wyżej, mocniej) wymyślił dominikanin Henri Didon dla swoich uczniów. Pierre de Coubertin przejął je dla ruchu olimpijskiego w 1894 roku.",category:"quotes",year:1894,emoji:"🏅"},{id:"qu14",text:"Mike Tyson zapytany o taktykę rywala odpowiedział, że każdy ma plan, dopóki nie dostanie w twarz. Zdanie cytują dziś menedżerowie i wojskowi.",category:"quotes",emoji:"🥊"},{id:"qu15",text:"Określenie „piękna gra” na piłkę nożną spopularyzował Pelé — jego autobiografia z 1977 roku nosi tytuł „Moje życie i piękna gra”. Brazylijczycy mówią o „jogo bonito”.",category:"quotes",year:1977,emoji:"⚽"},{id:"ad13",text:"Ben Johnson wygrał w Seulu 1988 bieg na 100 m z rekordem świata 9,79 s, ale po trzech dniach odebrano mu złoto za stanozolol. Ten finał nazywa się „najbrudniejszym wyścigiem w historii”.",category:"antidoping",year:1988,emoji:"💉"},{id:"ad14",text:"Marion Jones zdobyła w Sydney 2000 pięć medali, a w 2007 roku przyznała się do dopingu. Oddała wszystkie medale i trafiła na pół roku do więzienia za składanie fałszywych zeznań.",category:"antidoping",year:2007,emoji:"⚖️"},{id:"ad15",text:"Maria Szarapowa w 2016 roku została zawieszona za meldonium, które od początku roku znalazło się na liście zakazanych. Twierdziła, że przyjmowała lek od lat i przeoczyła zmianę przepisów.",category:"antidoping",year:2016,emoji:"💊"},{id:"cmt13",text:"Jan Ciszewski komentował mecze „Orłów Górskiego” na mundialu 1974 i dla całego pokolenia jego głos był dźwiękiem tamtych sukcesów. Słynął z ogromnych emocji przy mikrofonie.",category:"commentators",year:1974,emoji:"🎙️"},{id:"cmt14",text:"Amerykański dziennikarz Howard Cosell stworzył z Muhammadem Alim telewizyjny duet — ich słowne pojedynki przyciągały widzów równie mocno jak walki. Cosell był też jednym z głosów „Monday Night Football”.",category:"commentators",year:1970,emoji:"📺"},{id:"cmt15",text:"Po zwycięstwie Norwegii nad Anglią 2:1 w 1981 roku komentator Bjørge Lillelien wyliczał na antenie brytyjskie sławy, od Churchilla po Margaret Thatcher, krzycząc, że „wasi chłopcy dostali niezłe lanie”.",category:"commentators",year:1981,emoji:"🇳🇴"},{id:"ur13",text:"Brytyjka Sky Brown zdobyła brąz w skateboardingu w Tokio 2020, mając 13 lat. Została najmłodszą medalistką olimpijską w historii Wielkiej Brytanii.",category:"urban",year:2021,emoji:"🛹"},{id:"ur14",text:"Wyścigi BMX zadebiutowały na igrzyskach w Pekinie w 2008 roku. Zawodnicy startują z rampy wysokiej na kilka metrów, a cały wyścig trwa około 40 sekund.",category:"urban",year:2008,emoji:"🚲"},{id:"ur15",text:"Prawdziwy rozkwit deskorolki zaczął się w 1972 roku, gdy Frank Nasworthy zastosował kółka z uretanu. Wcześniej deski jeździły na kółkach z metalu lub gliny, które ślizgały się i blokowały na kamyczkach.",category:"urban",year:1972,emoji:"🛞"},{id:"cm13",text:"Amerykanka Lynn Hill w 1993 roku jako pierwsza przeszła klasycznie drogę The Nose na El Capitan, bez obciążania sprzętu. Powiedziała potem: „It goes, boys”.",category:"climbing",year:1993,emoji:"🧗‍♀️"},{id:"cm14",text:"Słowenka Janja Garnbret zdobyła złoto olimpijskie we wspinaczce sportowej w Tokio 2020 i obroniła je w Paryżu 2024. Wcześniej wygrała jako pierwsza wszystkie zawody Pucharu Świata w boulderingu w jednym sezonie.",category:"climbing",year:2024,emoji:"🇸🇮"},{id:"cm15",text:"Edmund Hillary i Szerpa Tenzing Norgay jako pierwsi stanęli na Mount Evereście 29 maja 1953 roku. Wiadomość dotarła do Londynu w dniu koronacji Elżbiety II.",category:"climbing",year:1953,emoji:"🏔️"},{id:"uw13",text:"Jacques Cousteau i inżynier Émile Gagnan skonstruowali w 1943 roku akwalung — automat oddechowy pozwalający swobodnie oddychać pod wodą z butli. Ten wynalazek otworzył drogę do nurkowania rekreacyjnego.",category:"underwater",year:1943,emoji:"🤿"},{id:"uw14",text:"Francuz Stéphane Mifsud wstrzymał oddech pod wodą na 11 minut i 35 sekund w 2009 roku — to rekord świata w bezdechu statycznym. Leżał nieruchomo na powierzchni basenu twarzą w dół.",category:"underwater",year:2009,emoji:"⏱️"},{id:"uw15",text:"Rosjanka Natalia Mołczanowa, najbardziej utytułowana freediverka w historii, pobiła ponad 40 rekordów świata. Zaginęła w 2015 roku podczas rekreacyjnego nurkowania u wybrzeży Hiszpanii.",category:"underwater",year:2015,emoji:"🌊"},{id:"fs13",text:"Australijczyk Alf Dean złowił w 1959 roku na wędkę żarłacza białego ważącego około 1200 kg. To wciąż rekord świata dla ryby złowionej na wędkę.",category:"fishing",year:1959,emoji:"🦈"},{id:"fs14",text:"Izaak Walton wydał w 1653 roku „Doskonałego wędkarza” — jedną z najczęściej wznawianych książek w historii języka angielskiego. Pisał w niej nie tylko o połowie, ale i o spokoju nad wodą.",category:"fishing",year:1653,emoji:"📖"},{id:"fs15",text:"Najstarszy angielski traktat o wędkarstwie wydrukowano w 1496 roku. Zawierał już opis kilkunastu sztucznych much na pstrągi, których wzory wędkarze odtwarzają do dziś.",category:"fishing",year:1496,emoji:"🪝"},{id:"sb13",text:"Czeszka Ester Ledecká na igrzyskach w Pjongczangu 2018 zdobyła złoto w supergigancie na nartach i w slalomie gigancie równoległym na snowboardzie. Nikt wcześniej nie wygrał na jednych igrzyskach w dwóch sportach z dwoma różnymi rodzajami sprzętu.",category:"snowboard",year:2018,emoji:"🇨🇿"},{id:"sb14",text:"Jake Burton Carpenter założył w 1977 roku w Vermont firmę produkującą deski snowboardowe. Przez lata objeżdżał ośrodki, przekonując je, by w ogóle wpuszczały snowboardzistów na stoki.",category:"snowboard",year:1977,emoji:"🏂"},{id:"sb15",text:"Kilka ośrodków narciarskich w USA — m.in. Alta i Deer Valley w Utah — do dziś nie wpuszcza snowboardzistów. Na stokach mogą zjeżdżać tylko narciarze.",category:"snowboard",year:2e3,emoji:"🚫"},{id:"rw13",text:"Brytyjski wioślarz Steve Redgrave zdobył złoto na pięciu igrzyskach z rzędu (1984–2000). Po czwartym złocie powiedział, że jeśli jeszcze kiedyś zobaczy łódź, może go zastrzelić — i wrócił po piąte.",category:"rowing",year:2e3,emoji:"🇬🇧"},{id:"rw14",text:"Australijczyk Bobby Pearce w ćwierćfinale igrzysk w Amsterdamie w 1928 roku zatrzymał łódź, by przepuścić rodzinę kaczek. Mimo to wygrał wyścig, a potem cały turniej.",category:"rowing",year:1928,emoji:"🦆"},{id:"rw15",text:"Polska czwórka podwójna wioślarzy zdobyła złoto olimpijskie w Pekinie w 2008 roku. W osadzie płynęli Konrad Wasielewski, Marek Kolbowicz, Michał Jeleński i Adam Korol.",category:"rowing",year:2008,emoji:"🇵🇱"},{id:"dn13",text:"Festiwal tańca w Blackpool, rozgrywany od 1920 roku, jest najstarszym i najbardziej prestiżowym turniejem tańca towarzyskiego na świecie. Zwycięstwo w nim bywa dla par ważniejsze niż tytuł mistrzów świata.",category:"dance",year:1920,emoji:"💃"},{id:"dn14",text:"Pierwszymi mistrzami olimpijskimi w breakingu zostali w Paryżu 2024 Japonka Ami Yuasa i Kanadyjczyk Phil Wizard. Na igrzyskach w Los Angeles 2028 breakingu już nie będzie.",category:"dance",year:2024,emoji:"🎧"},{id:"dn15",text:"Brytyjczycy Jayne Torvill i Christopher Dean za taniec do „Bolera” na igrzyskach w Sarajewie 1984 dostali od wszystkich sędziów maksymalne noty za wrażenie artystyczne. Występ obejrzało w Wielkiej Brytanii ponad 20 milionów widzów.",category:"dance",year:1984,emoji:"⛸️"},{id:"av13",text:"Sebastian Kawa to jeden z najbardziej utytułowanych szybowników w historii — zdobył ponad dziesięć tytułów mistrza świata. Latał szybowcem nawet nad Himalajami.",category:"aviation",year:2018,emoji:"🪁"},{id:"av14",text:"Pierwszy udokumentowany skok ze spadochronem wykonał Francuz André-Jacques Garnerin w 1797 roku nad Paryżem — z kosza balonu. Spadochron nie miał otworu na szczycie, więc kołysał się tak mocno, że skoczek wymiotował.",category:"aviation",year:1797,emoji:"🪂"},{id:"av15",text:"Bertrand Piccard i Brian Jones w 1999 roku jako pierwsi oblecieli Ziemię balonem bez lądowania. Podróż balonem Breitling Orbiter 3 trwała prawie 20 dni.",category:"aviation",year:1999,emoji:"🎈"},{id:"of13",text:"Po zamachu na igrzyskach w Monachium 1972 przewodniczący MKOl Avery Brundage zdecydował o kontynuowaniu zawodów słowami „igrzyska muszą trwać”. Decyzja do dziś budzi spory.",category:"officials",year:1972,emoji:"🕊️"},{id:"of14",text:"Thomas Bach, przewodniczący MKOl w latach 2013–2025, był wcześniej szermierzem — w 1976 roku zdobył złoto olimpijskie w drużynowym florecie dla RFN.",category:"officials",year:2013,emoji:"🤺"},{id:"of15",text:"Sepp Blatter kierował FIFA przez 17 lat. Pod koniec 2015 roku, w czasie śledztw korupcyjnych, komisja etyki zawiesiła go na osiem lat (później skrócono to do sześciu).",category:"officials",year:2015,emoji:"🚫"},{id:"tf13",text:"Trevor Francis został w 1979 roku pierwszym piłkarzem w Anglii kupionym za milion funtów. Trener Nottingham Forest Brian Clough twierdził, że zapłacił 999 999 funtów, by gracz nie przejął się kwotą.",category:"transfers",year:1979,emoji:"💷"},{id:"tf14",text:"Diego Maradona dwukrotnie był najdroższym piłkarzem świata — w 1982 roku przy przejściu do Barcelony i w 1984 roku do Napoli. Na jego prezentację w Neapolu przyszło około 70 tysięcy kibiców.",category:"transfers",year:1984,emoji:"🇮🇹"},{id:"tf15",text:"Robert Lewandowski przeszedł do Bayernu w 2014 roku za darmo, po wygaśnięciu kontraktu z Borussią. Osiem lat później Bayern sprzedał go Barcelonie za około 45 milionów euro.",category:"transfers",year:2022,emoji:"🇵🇱"},{id:"ic13",text:"Holenderka Ireen Wüst zdobyła medale olimpijskie w łyżwiarstwie szybkim na pięciu igrzyskach z rzędu (2006–2022), w tym sześć złotych. Jest najbardziej utytułowaną panczenistką w historii.",category:"ice",year:2022,emoji:"🇳🇱"},{id:"ic14",text:"Na igrzyskach w Soczi 2014 Holendrzy zdobyli w łyżwiarstwie szybkim 23 z 36 możliwych medali. W czterech konkurencjach zajęli całe podium.",category:"ice",year:2014,emoji:"🧡"},{id:"ic15",text:"W Pekinie 2022 u 15-letniej łyżwiarki Kamiły Walijewej wykryto zakazany lek na serce. Ceremonii dekoracji w konkursie drużynowym nie przeprowadzono, a medalistki czekały na rozstrzygnięcie ponad dwa lata.",category:"ice",year:2022,emoji:"⚠️"},{id:"sf13",text:"Po śmierci Dale'a Earnhardta w wyścigu Daytona 500 w 2001 roku NASCAR wprowadził obowiązek stosowania systemu HANS, który chroni szyję kierowcy przy uderzeniu. W Formule 1 HANS jest obowiązkowy od 2003 roku.",category:"safety",year:2001,emoji:"🏁"},{id:"sf14",text:"W 2014 roku australijski krykiecista Phillip Hughes zmarł po uderzeniu piłką w szyję. Po tej tragedii udoskonalono kaski, a w 2019 roku wprowadzono zmiany za zawodników ze wstrząśnieniem mózgu.",category:"safety",year:2014,emoji:"🏏"},{id:"sf15",text:"Od igrzysk w Rio 2016 mężczyźni w boksie olimpijskim walczą bez kasków. Badania wykazały, że kask ogranicza rozcięcia, ale nie chroni przed wstrząśnieniem mózgu, a bez niego sędziowie częściej przerywają walki.",category:"safety",year:2016,emoji:"🥊"},{id:"ec13",text:"Igrzyska w Lillehammer 1994 uważa się za pierwsze „zielone igrzyska” — z programem ochrony środowiska. Po nich MKOl uznał ekologię za trzeci filar ruchu olimpijskiego, obok sportu i kultury.",category:"ecology",year:1994,emoji:"🌲"},{id:"ec14",text:"Formuła E, seria wyścigów samochodów elektrycznych, ruszyła w 2014 roku. Wyścigi odbywają się zwykle na ulicznych torach w centrach miast.",category:"ecology",year:2014,emoji:"🔌"},{id:"ec15",text:"W Kopenhadze na dachu spalarni śmieci CopenHill urządzono całoroczny stok narciarski ze sztuczną nawierzchnią. Obiekt otwarto w 2019 roku.",category:"ecology",year:2019,emoji:"🏔️"},{id:"an14",text:"Zwycięzca olimpijski wracał do ojczyzny jako bohater. Ateny zapewniały swoim mistrzom m.in. darmowe posiłki w prytanejonie do końca życia.",category:"ancient",emoji:"🍽️"},{id:"an15",text:"Starożytni zawodnicy przed ćwiczeniami nacierali ciało oliwą, a po wysiłku zeskrobywali ją razem z potem i piaskiem zakrzywionym skrobakiem — strigilem.",category:"ancient",emoji:"🫒"},{id:"eq13",text:"Igrzyska 1956 odbyły się w Melbourne, ale konkurencje jeździeckie przeniesiono do Sztokholmu. Australijska kwarantanna dla zwierząt była tak surowa, że konie nie mogły przyjechać.",category:"equestrian",year:1956,emoji:"✈️"},{id:"eq14",text:"Niemka Isabell Werth zdobyła w ujeżdżeniu osiem złotych medali olimpijskich, ostatnie w Paryżu 2024. Jest najbardziej utytułowaną jeźdźczynią w historii igrzysk.",category:"equestrian",year:2024,emoji:"🇩🇪"},{id:"rg14",text:"Japonia w 2019 roku jako pierwszy kraj w Azji zorganizowała Puchar Świata w rugby. Gospodarze wygrali grupę, pokonując m.in. Irlandię i Szkocję, i pierwszy raz awansowali do ćwierćfinału.",category:"rugby",year:2019,emoji:"🇯🇵"},{id:"rg15",text:"Podanie do przodu w futbolu amerykańskim zalegalizowano dopiero w 1906 roku, w ramach reform po serii śmiertelnych wypadków. Wcześniej gra polegała głównie na przepychaniu się w zwartej masie.",category:"rugby",year:1906,emoji:"🏈"},{id:"g14",text:"Helena Rakoczy zdobyła na mistrzostwach świata w Bazylei w 1950 roku cztery złote medale. To do dziś największy sukces w historii polskiej gimnastyki.",category:"gymnastics",year:1950,emoji:"🇵🇱"},{id:"g15",text:"Simone Biles zdobyła 11 medali olimpijskich i ponad 30 medali mistrzostw świata — najwięcej w historii gimnastyki. Pięć elementów w przepisach nosi jej nazwisko.",category:"gymnastics",year:2024,emoji:"🇺🇸"},{id:"x14",text:"Andrzej Bargiel w 2018 roku jako pierwszy człowiek zjechał na nartach ze szczytu K2 do bazy, bez zdejmowania nart. Trasę śledził z drona jego brat Bartłomiej.",category:"extreme",year:2018,emoji:"⛷️"},{id:"x15",text:"Kaskader motocyklowy Evel Knievel trafił do Księgi Rekordów Guinnessa jako człowiek z największą liczbą złamań w życiu. Jego skoki przez autobusy i kaniony oglądały miliony widzów.",category:"extreme",year:1976,emoji:"🏍️"},{id:"tr14",text:"Futbol gaelicki, w którym piłkę wolno kopać i nieść w rękach, to najpopularniejszy sport w Irlandii. Finał rozgrywek na stadionie Croke Park w Dublinie przyciąga ponad 80 tysięcy widzów, choć zawodnicy są amatorami.",category:"traditional",year:1884,emoji:"🇮🇪"},{id:"tr15",text:"Narodowym sportem Argentyny formalnie nie jest piłka nożna, lecz pato — gra jeźdźców o skórzaną piłkę z uchwytami. Taki status nadano mu dekretem w 1953 roku.",category:"traditional",year:1953,emoji:"🇦🇷"},{id:"eu14",text:"Euro 2000 było pierwszymi mistrzostwami Europy organizowanymi przez dwa kraje — Belgię i Holandię. Tytuł zdobyła Francja dzięki złotemu golowi Davida Trezegueta w finale z Włochami.",category:"euro",year:2e3,emoji:"🇧🇪"},{id:"eu15",text:"Hiszpania jako pierwsza reprezentacja wygrała trzy wielkie turnieje z rzędu: Euro 2008, mundial 2010 i Euro 2012. W finale Euro 2012 rozbiła Włochy 4:0.",category:"euro",year:2012,emoji:"🇪🇸"},{id:"as14",text:"Neeraj Chopra zdobył w Tokio 2020 złoto w rzucie oszczepem — pierwsze olimpijskie złoto Indii w lekkoatletyce. Dzień jego zwycięstwa ogłoszono w Indiach Dniem Oszczepu.",category:"asia",year:2021,emoji:"🇮🇳"},{id:"as15",text:"Na igrzyskach w Pekinie 2008 Chiny po raz pierwszy wygrały klasyfikację złotych medali — zdobyły ich 48. Wcześniej przez dekady w tabeli prowadziły USA lub ZSRR.",category:"asia",year:2008,emoji:"🇨🇳"},{id:"fw14",text:"Pelé pożegnał się z piłką w 1977 roku meczem New York Cosmos z Santosem, grając po jednej połowie w barwach każdego z klubów. Na zakończenie poprosił widzów, by trzykrotnie powtórzyli z nim słowo „miłość”.",category:"farewells",year:1977,emoji:"⚽"},{id:"fw15",text:"Usain Bolt zakończył karierę na mistrzostwach świata w Londynie w 2017 roku. W ostatnim biegu, na ostatniej zmianie sztafety, złapał skurcz i upadł na bieżnię.",category:"farewells",year:2017,emoji:"🤕"},{id:"sj14",text:"Szwajcar Simon Ammann zdobył cztery indywidualne złota olimpijskie — po dwa w Salt Lake City 2002 i Vancouver 2010. W 2002 roku był niemal nieznanym skoczkiem w okularach.",category:"skijumping",year:2010,emoji:"🇨🇭"},{id:"sj15",text:"W 2024 roku Ryoyu Kobayashi skoczył na specjalnie przygotowanej skoczni w Islandii 291 metrów. Wynik nie jest oficjalnym rekordem, bo nie padł w zawodach FIS.",category:"skijumping",year:2024,emoji:"🇯🇵"},{id:"ca14",text:"Do 2022 roku na Wimbledonie obowiązywała „środkowa niedziela” — dzień bez meczów, by trawa mogła odpocząć. Grano wtedy tylko wyjątkowo, gdy deszcz opóźnił turniej.",category:"calendar",year:2022,emoji:"🌿"},{id:"ca15",text:"Maraton bostoński odbywa się zawsze w Dniu Patriotów, czyli w trzeci poniedziałek kwietnia. Bieg rozgrywany jest od 1897 roku i jest najstarszym corocznym maratonem świata.",category:"calendar",year:1897,emoji:"🇺🇸"},{id:"prl14",text:"W 1973 roku trzy Polskie Fiaty 125p ustanowiły na torze Monza międzynarodowe rekordy długodystansowe, jeżdżąc dzień i noc przez kilkanaście dni. Wyczyn był chwalony w propagandzie jako dowód jakości polskiej motoryzacji.",category:"prl",year:1973,emoji:"🚗"},{id:"prl15",text:"Polskich lekkoatletów z przełomu lat 50. i 60. nazywano „Wunderteamem”. Zawodnicy tacy jak Józef Szmidt, Zdzisław Krzyszkowiak czy Janusz Sidło wygrywali mecze z największymi potęgami.",category:"prl",year:1958,emoji:"🏃"},{id:"ga14",text:"Igrzyska Machabejskie, rozgrywane w Izraelu od 1932 roku, gromadzą żydowskich sportowców z całego świata. Należą do największych imprez wielodyscyplinowych.",category:"games",year:1932,emoji:"✡️"},{id:"ga15",text:"Gay Games odbyły się po raz pierwszy w San Francisco w 1982 roku. Zawody są otwarte dla wszystkich, niezależnie od orientacji i poziomu sportowego.",category:"games",year:1982,emoji:"🏳️‍🌈"},{id:"v17",text:"Chinka Lang Ping, nazywana „Żelaznym Młotem”, zdobyła złoto olimpijskie jako siatkarka w 1984 roku, a 32 lata później — jako trenerka reprezentacji Chin w Rio 2016.",category:"volleyball",year:2016,emoji:"🇨🇳"},{id:"v18",text:"Włoska „generacja fenomenów” wygrała mistrzostwa świata trzy razy z rzędu (1990, 1994, 1998). Złota olimpijskiego nigdy jednak nie zdobyła — przegrała m.in. finał w Atlancie 1996.",category:"volleyball",year:1998,emoji:"🇮🇹"},{id:"v19",text:"Mecz otwarcia mistrzostw świata 2014 Polska–Serbia rozegrano na Stadionie Narodowym w Warszawie przy ponad 60 tysiącach widzów — to rekord frekwencji w historii siatkówki. Turniej wygrali Polacy.",category:"volleyball",year:2014,emoji:"🏟️"},{id:"hk15",text:"Na mistrzostwach świata w Katowicach w 1976 roku Polska sensacyjnie pokonała ZSRR 6:4. Radzieccy hokeiści byli wtedy aktualnymi mistrzami olimpijskimi.",category:"hockey",year:1976,emoji:"🇵🇱"},{id:"hk16",text:"Bobby Orr dał Boston Bruins Puchar Stanleya w 1970 roku golem w dogrywce — i w tej samej chwili, podcięty przez rywala, poszybował nad lodem z rękami w górze. Zdjęcie tego lotu jest jednym z najsłynniejszych w historii hokeja.",category:"hockey",year:1970,emoji:"🦅"},{id:"hk17",text:"Sidney Crosby strzelił w dogrywce finału igrzysk w Vancouver 2010 „złotego gola” dla Kanady przeciwko USA. Mecz obejrzała w telewizji niemal połowa Kanadyjczyków.",category:"hockey",year:2010,emoji:"🇨🇦"},{id:"sd15",text:"Allianz Arena w Monachium ma fasadę z ponad 2800 poduszek, które podświetla się na różne kolory. Gdy gra Bayern, stadion świeci na czerwono.",category:"stadiums",year:2005,emoji:"💡"},{id:"sd16",text:"Melbourne Cricket Ground mieści około 100 tysięcy widzów. Był głównym stadionem igrzysk w 1956 roku, a co roku odbywa się na nim finał ligi futbolu australijskiego.",category:"stadiums",year:1956,emoji:"🏏"},{id:"sd17",text:"Pekiński Stadion Narodowy, zwany „Ptasim Gniazdem”, jako pierwszy obiekt w historii gościł ceremonie otwarcia zarówno letnich (2008), jak i zimowych igrzysk (2022).",category:"stadiums",year:2022,emoji:"🪺"},{id:"we15",text:"W Boże Narodzenie 1937 roku mecz Chelsea z Charltonem przerwano z powodu mgły. Bramkarz Charltonu Sam Bartram nie usłyszał gwizdka i jeszcze kwadrans stał samotnie w bramce, aż zabrał go stamtąd policjant.",category:"weather",year:1937,emoji:"🌫️"},{id:"we16",text:"Przed igrzyskami w Vancouver 2010 na stoku Cypress Mountain zabrakło śniegu — była to jedna z najcieplejszych zim w historii miasta. Śnieg dowożono ciężarówkami i helikopterami.",category:"weather",year:2010,emoji:"🚁"},{id:"we17",text:"Podczas Australian Open 2014 w Melbourne temperatura przekraczała 40°C, a zawodnicy mdleli i wymiotowali na korcie. Po tym turnieju zaostrzono zasady przerywania gry w upale.",category:"weather",year:2014,emoji:"🌡️"},{id:"gf16",text:"Rory McIlroy wygrał w 2025 roku turniej Masters i jako szósty golfista w historii skompletował wszystkie cztery tytuły wielkoszlemowe. Na ostatni brakujący czekał 11 lat.",category:"golf",year:2025,emoji:"🟢"},{id:"ch14",text:"Pierwszą mistrzynią świata w szachach została w 1927 roku Vera Menchik. Grała też w turniejach z mężczyznami, a pokonanych przez nią mistrzów żartobliwie nazywano „klubem Very Menchik”.",category:"chess",year:1927,emoji:"👑"},{id:"st17",text:"Hidilyn Diaz zdobyła w podnoszeniu ciężarów w Tokio 2020 pierwsze w historii złoto olimpijskie dla Filipin. Kraj czekał na nie od 1924 roku.",category:"strength",year:2021,emoji:"🇵🇭"},{id:"rq17",text:"Szwed Jan-Ove Waldner, nazywany „Mozartem tenisa stołowego”, zdobył złoto olimpijskie w Barcelonie w 1992 roku. W Chinach był tak popularny, że rozpoznawano go na ulicach.",category:"racquet",year:1992,emoji:"🏓"},{id:"pwc17",text:"Jedyne zwycięstwo Polski na mundialu w Meksyku w 1986 roku to 1:0 z Portugalią po golu Włodzimierza Smolarka. Drużyna wyszła z grupy z trzeciego miejsca.",category:"polandwc",year:1986,emoji:"⚽"},{id:"pe17",text:"Leo Beenhakker, pierwszy zagraniczny selekcjoner reprezentacji Polski, wprowadził ją w 2007 roku na pierwsze w historii mistrzostwa Europy. W eliminacjach Polska wygrała grupę przed Portugalią.",category:"polandeuro",year:2006,emoji:"🇳🇱"},{id:"rv17",text:"Rywalizacja Justyny Kowalczyk z Marit Bjørgen elektryzowała kibiców biegów narciarskich przez całą dekadę. Polka publicznie krytykowała też stosowanie przez Norweżki leków na astmę.",category:"rivalries",year:2013,emoji:"🎿"},{id:"mo17",text:"LeBron James w 2022 roku jako pierwszy czynny koszykarz NBA stał się miliarderem. Większość majątku zarobił na reklamach i inwestycjach, a nie na kontraktach.",category:"money",year:2022,emoji:"🏀"},{id:"fi17",text:"Pierwszą kobietą, która wystartowała w wyścigu Formuły 1, była Włoszka Maria Teresa de Filippis — w 1958 roku. Na jednym z wyścigów dyrektor nie dopuścił jej, mówiąc, że jedyny kask, jaki kobieta powinna nosić, to ten u fryzjera.",category:"firsts",year:1958,emoji:"🏎️"},{id:"age17",text:"Portugalczyk Carlos Lopes wygrał maraton olimpijski w Los Angeles w 1984 roku, mając 37 lat. Rok później pobił też rekord świata w tym biegu.",category:"ages",year:1984,emoji:"🏃"},{id:"dy17",text:"Kenijczycy wygrywali bieg na 3000 m z przeszkodami na każdych igrzyskach, w których startowali, od 1968 do 2016 roku. Passę przerwał dopiero Marokańczyk Soufiane El Bakkali w Tokio 2020.",category:"dynasties",year:2016,emoji:"🇰🇪"},{id:"nk17",text:"Usaina Bolta nazywano „Błyskawicą” (Lightning Bolt) — przydomek to gra słów z jego nazwiskiem. Jego gest celowania w niebo po zwycięstwie naśladowały miliony dzieci.",category:"nicknames",year:2008,emoji:"⚡"},{id:"ru17",text:"Od 2019 roku golfista może puttować, zostawiając flagę w dołku. Wcześniej uderzenie w nią z greenu groziło karą.",category:"rules",year:2019,emoji:"⛳"},{id:"up17",text:"Wigan Athletic w 2013 roku sensacyjnie pokonał Manchester City w finale Pucharu Anglii 1:0. Trzy dni później spadł z Premier League — jako pierwszy zdobywca tego pucharu w tym samym sezonie.",category:"upsets",year:2013,emoji:"🏆"},{id:"ma17",text:"W Super Bowl LI w 2017 roku New England Patriots przegrywali z Atlanta Falcons 3:28. Odrobili straty i wygrali po dogrywce — to największa pogoń w historii finałów NFL.",category:"matches",year:2017,emoji:"🏈"},{id:"der17",text:"Derby Łodzi to pojedynki Widzewa z ŁKS-em — dwóch klubów z jednego włókienniczego miasta. Każdy z nich zdobywał mistrzostwo Polski.",category:"derbies",emoji:"🧵"},{id:"gk17",text:"Peter Schmeichel w 2001 roku jako pierwszy bramkarz strzelił gola w Premier League — w barwach Aston Villi, po rzucie rożnym, w meczu z Evertonem.",category:"goalkeepers",year:2001,emoji:"🧤"},{id:"sp17",text:"Brazylijczyk César Cielo przepłynął w 2009 roku 50 m stylem dowolnym w 20,91 sekundy — średnio ponad 8,5 km/h. Wynik padł jeszcze w czasach kostiumów z poliuretanu.",category:"speed",year:2009,emoji:"🏊"},{id:"bb17",text:"W World Series 1932 Babe Ruth miał podobno wskazać ręką miejsce na trybunach, a potem posłać tam piłkę. Do dziś trwa spór, czy ten „zapowiedziany home run” rzeczywiście się wydarzył.",category:"baseball",year:1932,emoji:"👉"},{id:"cr17",text:"W pierwszym meczu testowym w historii, w 1877 roku, Australia pokonała Anglię 45 punktami. Sto lat później, na meczu jubileuszowym w 1977 roku, Australia wygrała… dokładnie tą samą różnicą.",category:"cricket",year:1977,emoji:"🏏"},{id:"nd17",text:"Festiwal narciarski w Holmenkollen pod Oslo rozgrywany jest od 1892 roku. Bieg na 50 km i konkurs skoków ściągają tam co roku dziesiątki tysięcy kibiców, a wśród nich często członków rodziny królewskiej.",category:"nordic",year:1892,emoji:"🇳🇴"},{id:"tp17",text:"Pierwsze trofeum Pucharu Anglii skradziono w 1895 roku z wystawy w sklepie w Birmingham i nigdy go nie odnaleziono. Złodziej przyznał się po kilkudziesięciu latach, twierdząc, że przetopił puchar na podrabiane monety.",category:"trophies",year:1895,emoji:"🚨"},{id:"k16",text:"Czesław Lang zdobył srebro olimpijskie w Moskwie 1980 i jako jeden z pierwszych Polaków przeszedł do zawodowego peletonu. Później przejął organizację Tour de Pologne i zrobił z niego wyścig najwyższej rangi.",category:"cycling",year:1980,emoji:"🇵🇱"},{id:"k17",text:"Zdjęcie z Tour de France 1952, na którym Fausto Coppi i Gino Bartali podają sobie bidon, stało się ikoną włoskiego sportu. Do dziś trwa spór, który z zaciętych rywali komu go podał.",category:"cycling",year:1952,emoji:"🍶"},{id:"an16",text:"Pierwszym znanym z imienia zwycięzcą olimpijskim był Korojbos z Elidy, kucharz lub piekarz. Wygrał bieg na długość stadionu w 776 roku p.n.e.",category:"ancient",emoji:"🏃"},{id:"an17",text:"Igrzyska w Olimpii były tylko jednymi z czterech wielkich igrzysk panhelleńskich. Obok nich rozgrywano Igrzyska Pytyjskie w Delfach, Istmijskie koło Koryntu i Nemejskie — razem tworzyły cykl, w którym startowali najlepsi.",category:"ancient",emoji:"🏛️"},{id:"e15",text:"Zwycięzca turnieju Red Annihilation w grze Quake w 1997 roku, Dennis „Thresh” Fong, dostał w nagrodę Ferrari należące wcześniej do Johna Carmacka, twórcy gry.",category:"esport",year:1997,emoji:"🏎️"},{id:"e16",text:"Pierwszy Esports World Cup w Rijadzie w 2024 roku miał pulę nagród przekraczającą 60 milionów dolarów — najwyższą w historii e-sportu. Turniej trwał osiem tygodni.",category:"esport",year:2024,emoji:"💵"},{id:"eq15",text:"Dunka Lis Hartel, sparaliżowana częściowo po chorobie Heinego-Medina, zdobyła srebro w ujeżdżeniu na igrzyskach w Helsinkach 1952 — w pierwszym roku, w którym kobiety mogły startować w tej konkurencji.",category:"equestrian",year:1952,emoji:"♿"},{id:"eq16",text:"Nowozelandczyk Mark Todd na koniu Charisma wygrał wszechstronny konkurs konia wierzchowego na igrzyskach w 1984 i 1988 roku. Później ogłoszono go jeźdźcem stulecia.",category:"equestrian",year:1988,emoji:"🇳🇿"},{id:"rg16",text:"W 1895 roku kluby z północy Anglii odłączyły się od związku rugby, bo chciały płacić zawodnikom za utracone dniówki. Tak powstało rugby league, które do dziś ma osobne przepisy i rozgrywki.",category:"rugby",year:1895,emoji:"✂️"},{id:"rg17",text:"Jonny Wilkinson dał Anglii mistrzostwo świata w rugby w 2003 roku kopnięciem z dropu na 26 sekund przed końcem dogrywki finału z Australią.",category:"rugby",year:2003,emoji:"🦶"},{id:"g16",text:"Oksana Czusowitina startowała w gimnastyce na ośmiu igrzyskach (1992–2020), reprezentując trzy różne kraje. Złoto zdobyła jeszcze w Barcelonie 1992, a w Tokio miała 46 lat.",category:"gymnastics",year:2021,emoji:"👵"},{id:"g17",text:"Gimnastyka sportowa była na igrzyskach od 1896 roku, ale kobiety mogły w niej startować dopiero od Amsterdamu 1928 — i tylko w zawodach drużynowych.",category:"gymnastics",year:1928,emoji:"🤸‍♀️"},{id:"x16",text:"Francuz Philippe Petit w 1974 roku przeszedł po linie rozpiętej między wieżami World Trade Center, ponad 400 metrów nad ziemią. Spacerował tam i z powrotem przez około 45 minut.",category:"extreme",year:1974,emoji:"🎪"},{id:"x17",text:"Skoki na bungee spopularyzował Nowozelandczyk A.J. Hackett, który w 1987 roku skoczył na linie z wieży Eiffla. Inspiracją był rytuał mieszkańców wyspy Pentecost w Vanuatu.",category:"extreme",year:1987,emoji:"🪢"},{id:"pr16",text:"Luke Littler został w 2025 roku mistrzem świata w darcie, mając 17 lat — najmłodszym w historii. Rok wcześniej, jako 16-latek, sensacyjnie doszedł do finału.",category:"precision",year:2025,emoji:"🎯"},{id:"pr17",text:"Joe Davis wygrał pierwsze mistrzostwa świata w snookerze w 1927 roku, a potem zdobywał tytuł nieprzerwanie aż do 1946 roku — 15 razy z rzędu. Za pierwsze zwycięstwo dostał około sześciu funtów.",category:"precision",year:1946,emoji:"🎱"},{id:"tr16",text:"Kubb, nazywany „szachami wikingów”, polega na rzucaniu drewnianymi pałkami w klocki przeciwnika. Mistrzostwa świata rozgrywa się od 1995 roku na szwedzkiej Gotlandii.",category:"traditional",year:1995,emoji:"🪵"},{id:"tr17",text:"Fińska gra mölkky, w której drewnianym kijkiem zbija się ponumerowane kręgle, powstała w 1996 roku na wzór dawnej karelskiej zabawy. Ma już własne mistrzostwa świata.",category:"traditional",year:1996,emoji:"🇫🇮"},{id:"hb17",text:"Polski bramkarz Sławomir Szmal został w 2009 roku wybrany przez IHF najlepszym piłkarzem ręcznym świata. Rzadko zdarza się, by to wyróżnienie trafiało do bramkarza.",category:"handball",year:2009,emoji:"🧤"},{id:"hb18",text:"Mecz piłki ręcznej prowadzi para równorzędnych sędziów, która jeździ razem na zawody przez całą karierę. Na wielkie turnieje powołuje się całe pary, a nie pojedynczych arbitrów.",category:"handball",year:1990,emoji:"👥"},{id:"eu16",text:"Cristiano Ronaldo jako pierwszy piłkarz zagrał na sześciu mistrzostwach Europy (2004–2024). Jest też najlepszym strzelcem w historii tego turnieju.",category:"euro",year:2024,emoji:"🇵🇹"},{id:"eu17",text:"Na pierwsze mistrzostwa Europy w 1960 roku Hiszpania nie pojechała do ćwierćfinału ze Związkiem Radzieckim — generał Franco nie zgodził się na mecz z ZSRR. Hiszpanie oddali walkowera.",category:"euro",year:1960,emoji:"🇪🇸"},{id:"pc16",text:"Stal Mielec w sezonie 1975/76 doszła do ćwierćfinału Pucharu UEFA, gdzie przegrała z Hamburgerem SV. W tamtych latach klub z niewielkiego miasta dwukrotnie zdobył mistrzostwo Polski.",category:"polandclubs",year:1976,emoji:"🇵🇱"},{id:"pc17",text:"Wisła Kraków w sezonie 2002/03 doszła do 1/8 finału Pucharu UEFA, eliminując m.in. Parmę i Schalke 04. Odpadła dopiero z Lazio.",category:"polandclubs",year:2003,emoji:"⭐"},{id:"pf16",text:"Iga Świątek w kwietniu 2022 roku jako pierwsza osoba z Polski została liderką światowego rankingu tenisowego. Wcześniej, w 2020 roku, jako pierwsza Polka wygrała turniej wielkoszlemowy w singlu.",category:"polandfirsts",year:2022,emoji:"🎾"},{id:"pf17",text:"Jan Błachowicz w 2020 roku jako pierwszy Polak zdobył mistrzostwo UFC — w wadze półciężkiej. Pas obronił w walce z Israelem Adesanyą.",category:"polandfirsts",year:2020,emoji:"🥊"},{id:"sc16",text:"Rosie Ruiz „wygrała” maraton bostoński w 1980 roku, choć większość trasy przejechała metrem. Wyszło to na jaw po kilku dniach — nikt nie widział jej na trasie, a na mecie była prawie niespocona.",category:"scandals",year:1980,emoji:"🚇"},{id:"sc17",text:"W polskiej piłce w latach 2005–2006 wybuchła afera korupcyjna dotycząca ustawiania meczów. Zarzuty usłyszało kilkaset osób — sędziów, działaczy i zawodników — a kilka klubów ukarano degradacją.",category:"scandals",year:2006,emoji:"⚖️"},{id:"wm16",text:"Igrzyska w Paryżu 2024 jako pierwsze w historii miały dokładnie tyle samo miejsc dla kobiet i mężczyzn. Na pierwszych nowożytnych igrzyskach w 1896 roku nie wystartowała ani jedna kobieta.",category:"women",year:2024,emoji:"⚖️"},{id:"wm17",text:"Amerykanka Alice Coachman wygrała skok wzwyż na igrzyskach w Londynie w 1948 roku i została pierwszą czarnoskórą kobietą ze złotym medalem olimpijskim.",category:"women",year:1948,emoji:"🥇"},{id:"co16",text:"Arsène Wenger prowadził Arsenal przez 22 lata (1996–2018) i zmienił angielski futbol — wprowadził dietę, nowoczesne treningi i zagranicznych zawodników. To on stał za „Niepokonanymi” z sezonu 2003/04.",category:"coaches",year:2018,emoji:"🇫🇷"},{id:"co17",text:"Carlo Ancelotti jako pierwszy trener wygrał Ligę Mistrzów pięć razy — dwukrotnie z Milanem i trzykrotnie z Realem Madryt. Zdobył też mistrzostwo we wszystkich pięciu najsilniejszych ligach Europy.",category:"coaches",year:2024,emoji:"🤨"},{id:"za16",text:"Słynny ogier wyścigowy Shergar, zwycięzca Derby z 1981 roku, został w 1983 roku porwany ze stadniny w Irlandii przez uzbrojonych sprawców. Okupu nie zapłacono, a koń nigdy się nie odnalazł.",category:"animals",year:1983,emoji:"🐴"},{id:"za17",text:"American Pharoah w 2015 roku jako pierwszy koń od 37 lat zdobył amerykańską Potrójną Koronę. Tego samego roku wygrał też Breeders' Cup Classic.",category:"animals",year:2015,emoji:"🐎"},{id:"sci16",text:"Amerykańskie boby na igrzyska w Soczi 2014 zaprojektowali inżynierowie BMW w tunelach aerodynamicznych. W sportach saneczkowych o medalu decydują setne części sekundy, więc liczy się każdy detal kształtu.",category:"science",year:2014,emoji:"🛷"},{id:"sci17",text:"System Hawk-Eye śledzi lot piłki tenisowej wieloma szybkimi kamerami i odtwarza go w trójwymiarze. Średni błąd systemu szacuje się na kilka milimetrów — mniej niż grubość linii kortu.",category:"science",year:2006,emoji:"🎾"},{id:"cu16",text:"Robert De Niro, by zagrać boksera Jake'a LaMottę we „Wściekłym byku” (1980), przytył około 30 kilogramów. Zdobył za tę rolę Oscara.",category:"culture",year:1980,emoji:"🥊"},{id:"cu17",text:"Utwór „We Are the Champions” zespołu Queen z 1977 roku stał się nieoficjalnym hymnem zwycięzców — puszcza się go po finałach na stadionach całego świata.",category:"culture",year:1977,emoji:"🎵"},{id:"pol16",text:"Igrzyska w Montrealu 1976 zbojkotowały 22 państwa afrykańskie. Protestowały, bo MKOl nie wykluczył Nowej Zelandii, której drużyna rugby grała w RPA w czasach apartheidu.",category:"politics",year:1976,emoji:"✊"},{id:"pol17",text:"Na igrzyskach w Melbourne 1956, kilka tygodni po stłumieniu powstania węgierskiego, Węgrzy zmierzyli się z ZSRR w piłce wodnej. Mecz był tak brutalny, że przeszedł do historii jako „krew w wodzie”.",category:"politics",year:1956,emoji:"🩸"},{id:"cb16",text:"Austriacki narciarz Hermann Maier w 2001 roku miał wypadek motocyklowy, a lekarze rozważali amputację nogi. Wrócił i w 2004 roku wygrał Puchar Świata.",category:"comebacks",year:2004,emoji:"⛷️"},{id:"cb17",text:"Czeszka Petra Kvitová w 2016 roku została zaatakowana nożem we własnym domu i miała poważnie uszkodzoną lewą rękę, którą gra. Wróciła na kort po pięciu miesiącach i wygrała turniej w Birmingham.",category:"comebacks",year:2017,emoji:"🎾"},{id:"gear16",text:"Narty taliowane, tzw. carvingowe, rozpowszechniły się w latach 90. Dzięki wąskiej talii skręcają na krawędzi, co sprawiło, że jazda stała się łatwiejsza dla amatorów i szybsza dla zawodników.",category:"gear",year:1993,emoji:"🎿"},{id:"gear17",text:"Na igrzyskach w Soczi 2014 amerykańscy panczeniści jeździli w nowych kombinezonach firmy Under Armour i zawodzili. Część zawodników obwiniała stroje i w trakcie igrzysk wróciła do starych modeli.",category:"gear",year:2014,emoji:"🧥"},{id:"mn16",text:"Andre Agassi w autobiografii „Open” wyznał, że przez większość kariery nienawidził tenisa, do którego zmusił go ojciec. Mimo to wygrał wszystkie cztery turnieje wielkoszlemowe.",category:"mind",year:2009,emoji:"📖"},{id:"mn17",text:"Ronnie O'Sullivan przypisuje część swoich sukcesów pracy z psychiatrą Steve'em Petersem. Po latach zmagań z emocjami wygrał kolejne tytuły mistrza świata w snookerze.",category:"mind",year:2012,emoji:"🧠"},{id:"cl16",text:"Brazylijczycy grali kiedyś na biało. Po przegranym finale mundialu 1950 białe stroje uznano za pechowe, a w konkursie z 1953 roku wybrano projekt 19-letniego Aldyra Schlee — żółto-zieloną koszulkę z niebieskimi spodenkami.",category:"colors",year:1953,emoji:"🇧🇷"},{id:"cl17",text:"Według jednej z wersji niebiesko-bordowe barwy FC Barcelony wybrał założyciel klubu, Szwajcar Joan Gamper, wzorując się na barwach klubu z Bazylei. Innych wyjaśnień jest jednak kilka.",category:"colors",year:1899,emoji:"🔵"},{id:"un16",text:"W fińskim Savonlinnie od 2000 roku rozgrywa się mistrzostwa świata w rzucie telefonem komórkowym. Ocenia się zarówno odległość, jak i styl rzutu.",category:"unusual",year:2e3,emoji:"📱"},{id:"un17",text:"W angielskim hrabstwie Derbyshire od lat 70. odbywają się mistrzostwa świata w zapasach na palce u stóp. Zawodnicy siedzą naprzeciw siebie i próbują przygnieść stopę rywala do podłoża.",category:"unusual",year:1976,emoji:"🦶"},{id:"fn16",text:"Kibice Kansas City Chiefs w 2014 roku wyśrubowali rekord Guinnessa w głośności dopingu na stadionie — 142,2 decybela. To więcej niż hałas startującego odrzutowca z bliska.",category:"fans",year:2014,emoji:"📢"},{id:"fn17",text:"Stadion Boca Juniors w Buenos Aires nazywany jest „La Bombonera” — bombonierką. Trybuny są tak strome i bliskie boiska, że kibice mówią, iż stadion „nie drży, tylko bije jak serce”.",category:"fans",year:1940,emoji:"💛"},{id:"md16",text:"Mundial w Szwajcarii w 1954 roku był pierwszym, z którego mecze pokazywała telewizja. Transmisje oglądano w kilku krajach Europy.",category:"media",year:1954,emoji:"📺"},{id:"md17",text:"Wraz z powstaniem Premier League w 1992 roku telewizja Sky zapłaciła 304 miliony funtów za prawa do pięciu sezonów. Dziś podobne umowy liczy się w miliardach.",category:"media",year:1992,emoji:"📡"},{id:"bd16",text:"Simone Biles ma 142 cm wzrostu. Niski wzrost i krótkie kończyny ułatwiają gimnastyczkom szybkie obroty w powietrzu.",category:"body",year:2016,emoji:"📏"},{id:"bd17",text:"Usain Bolt choruje na skoliozę — skrzywienie kręgosłupa, przez które jedna noga jest krótsza. Wzmocnione mięśnie tułowia pozwoliły mu mimo to zostać najszybszym człowiekiem świata.",category:"body",year:2008,emoji:"🦴"},{id:"ce16",text:"Ogień olimpijski zapłonął po raz pierwszy na igrzyskach w Amsterdamie w 1928 roku, na wieży stadionu. Sztafetę z ogniem z Olimpii wprowadzono osiem lat później.",category:"ceremonies",year:1928,emoji:"🔥"},{id:"ce17",text:"Od igrzysk w Melbourne 1956 sportowcy na ceremonię zamknięcia wchodzą razem, wymieszani, a nie w ekipach narodowych. Pomysł podsunął w liście do organizatorów nastoletni John Ian Wing.",category:"ceremonies",year:1956,emoji:"🤝"},{id:"ge16",text:"Wyścig motocyklowy Isle of Man TT rozgrywa się od 1907 roku na zwykłych drogach wyspy Man. Trasa liczy około 60 km i prowadzi przez wioski, między murami i domami.",category:"geography",year:1907,emoji:"🏍️"},{id:"ge17",text:"W maju 2008 roku chińska ekipa wniosła ogień olimpijski na szczyt Mount Everestu. Specjalną pochodnię skonstruowano tak, by płonęła w rozrzedzonym powietrzu.",category:"geography",year:2008,emoji:"🔥"},{id:"fa16",text:"Brytyjscy bracia Alistair i Jonny Brownlee zdobyli razem złoto i srebro olimpijskie w triathlonie. W 2016 roku Alistair dosłownie doprowadził słaniającego się brata do mety zawodów w Meksyku.",category:"families",year:2016,emoji:"🏊"},{id:"fa17",text:"Bracia Michael i Brian Laudrupowie należeli do najlepszych duńskich piłkarzy w historii. Brian zdobył mistrzostwo Europy w 1992 roku — Michael, skłócony wtedy z trenerem, w tym turnieju nie zagrał.",category:"families",year:1992,emoji:"🇩🇰"},{id:"wr16",text:"Igrzyska w Londynie w 1948 roku nazwano „igrzyskami oszczędności”. Sportowcy mieszkali w koszarach i szkołach, sami przywozili jedzenie, a Niemiec i Japonii nie zaproszono.",category:"war",year:1948,emoji:"🪖"},{id:"wr17",text:"Niemiecki bokser Max Schmeling podczas pogromu Nocy Kryształowej w 1938 roku ukrył w swoim hotelowym apartamencie dwóch żydowskich chłopców. Pomógł im potem wyjechać z Niemiec.",category:"war",year:1938,emoji:"🥊"},{id:"di16",text:"Tom Brady słynął z bardzo restrykcyjnej diety — około 80% warzyw i produktów pełnoziarnistych, bez cukru i większości przetworzonej żywności. Grał w NFL do 45. roku życia.",category:"diet",year:2017,emoji:"🥑"},{id:"di17",text:"Kolarze na pierwszych Tour de France pili w trakcie wyścigu wino, piwo, a nawet szampana. Alkohol uznawano wtedy za środek dodający energii i uśmierzający ból.",category:"diet",year:1903,emoji:"🍷"},{id:"ar16",text:"Niemka Bibiana Steinhaus w 2017 roku jako pierwsza kobieta sędziowała mecz Bundesligi. Była też pierwszą kobietą prowadzącą mecz w jednej z czołowych lig męskich w Europie.",category:"referees",year:2017,emoji:"👩‍⚖️"},{id:"ar17",text:"Szymon Marciniak poprowadził finał mundialu 2022 Argentyna–Francja — jeden z najbardziej dramatycznych w historii. Był pierwszym polskim sędzią w finale mistrzostw świata.",category:"referees",year:2022,emoji:"🇵🇱"},{id:"tg16",text:"W 2003 roku podczas półfinału Pucharu Konfederacji Kameruńczyk Marc-Vivien Foé upadł na boisko i zmarł z powodu wady serca. Jego numer zastrzegły kluby, w których grał.",category:"tragedies",year:2003,emoji:"🕯️"},{id:"tg17",text:"W 1992 roku przed półfinałem Pucharu Francji w Bastii zawaliła się prowizoryczna trybuna. Zginęło 18 osób, a we Francji 5 maja nie rozgrywa się meczów zawodowych.",category:"tragedies",year:1992,emoji:"🏗️"},{id:"fp16",text:"W 2005 roku w Rzymie Andy Roddick miał piłkę meczową, gdy sędzia uznał, że rywal zaserwował podwójny błąd. Amerykanin wskazał ślad piłki na korcie, dowodząc, że serwis był dobry — i ostatecznie przegrał mecz.",category:"fairplay",year:2005,emoji:"🎾"},{id:"fp17",text:"W kolarstwie obowiązuje niepisana zasada, że nie atakuje się lidera, gdy ma awarię. Gdy w Tour de France 2010 Alberto Contador odjechał Andy'emu Schleckowi, któremu spadł łańcuch, wybuchła burza — Hiszpan publicznie przeprosił.",category:"fairplay",year:2010,emoji:"⛓️"},{id:"cg16",text:"Uczelnie amerykańskiej Ivy League, m.in. Harvard, Yale i Princeton, nie przyznają stypendiów sportowych. Zawodnicy dostają pomoc finansową na tych samych zasadach co pozostali studenci.",category:"college",year:1954,emoji:"🎓"},{id:"cg17",text:"Jim Thorpe, przyszły mistrz olimpijski, grał w futbol w szkole dla rdzennych Amerykanów w Carlisle. W 1912 roku jego drużyna pokonała potężną akademię wojskową West Point, w której grał przyszły generał Dwight Eisenhower.",category:"college",year:1912,emoji:"🏈"},{id:"sl16",text:"Zbigniew Boniek po karierze piłkarskiej był trenerem i komentatorem, a w latach 2012–2021 prezesem PZPN. Później został wiceprezydentem UEFA.",category:"secondlife",year:2012,emoji:"🇵🇱"},{id:"sl17",text:"Wojciech Fibak, najlepszy polski tenisista lat 70., po karierze został znanym kolekcjonerem sztuki i marszandem. Prowadził własną galerię i promował polskich malarzy.",category:"secondlife",year:1990,emoji:"🖼️"},{id:"nu16",text:"Ajax zastrzegł w 2007 roku numer 14 na cześć Johana Cruyffa. Cruyff wybrał go przypadkiem w 1970 roku: oddał swoją dziewiątkę koledze, który nie mógł znaleźć koszulki, a sam wziął czternastkę z kosza.",category:"numbers",year:2007,emoji:"🇳🇱"},{id:"nu17",text:"„Siódemka” Manchesteru United ma własną legendę — nosili ją George Best, Eric Cantona, David Beckham i Cristiano Ronaldo. Dla kolejnych zawodników bywa wyróżnieniem, ale i ciężarem.",category:"numbers",year:2003,emoji:"7️⃣"},{id:"su16",text:"Kibice Detroit Red Wings od 1952 roku rzucają na lód ośmiornice. Osiem ramion symbolizowało osiem zwycięstw potrzebnych wtedy do zdobycia Pucharu Stanleya.",category:"superstitions",year:1952,emoji:"🐙"},{id:"su17",text:"Serena Williams przyznawała, że w czasie zwycięskiego turnieju nie zmienia skarpetek. Miała też stały rytuał odbijania piłki przed serwisem — pięć razy przed pierwszym podaniem.",category:"superstitions",year:2008,emoji:"🧦"},{id:"as16",text:"Chinka Li Na wygrała w 2011 roku Roland Garros i została pierwszą osobą z Azji ze zwycięstwem wielkoszlemowym w singlu. Jej finał oglądało w Chinach ponad 100 milionów widzów.",category:"asia",year:2011,emoji:"🇨🇳"},{id:"as17",text:"Japończyk Kei Nishikori w 2014 roku jako pierwszy tenisista z Azji zagrał w finale turnieju wielkoszlemowego w singlu mężczyzn — na US Open.",category:"asia",year:2014,emoji:"🇯🇵"},{id:"hf16",text:"Międzynarodowa Galeria Sław Boksu mieści się w Canastocie w stanie Nowy Jork — miasteczku, z którego pochodzili dwaj mistrzowie świata. Co roku na ceremonię przyjeżdżają legendy ringu.",category:"halls",year:1990,emoji:"🥊"},{id:"hf17",text:"W 2017 roku FIA utworzyła Galerię Sław Formuły 1 i przyjęła do niej od razu wszystkich dotychczasowych mistrzów świata. W kolejnych latach dołączają nowi czempioni.",category:"halls",year:2017,emoji:"🏁"},{id:"aa16",text:"W 1994 roku Barbados, by awansować, potrzebował z Grenadą wygranej dwiema bramkami, a gol w dogrywce liczył się podwójnie. Przy stanie 2:1 Barbadosczycy strzelili samobója, by doprowadzić do dogrywki — i ją wygrali.",category:"anecdotes",year:1994,emoji:"🤯"},{id:"aa17",text:"Brazylijczyk Carlos Kaiser przez lata podpisywał kontrakty z klubami, prawie nie grając w piłkę — symulował kontuzje i korzystał ze znajomości z gwiazdami. Powstał o nim film dokumentalny „Kaiser!”.",category:"anecdotes",year:1990,emoji:"🎭"},{id:"af16",text:"Po awansie Wybrzeża Kości Słoniowej na mundial w 2005 roku Didier Drogba w szatni, przed kamerami, błagał walczące strony wojny domowej o złożenie broni. Jego apel przyczynił się do zawieszenia broni.",category:"africa",year:2005,emoji:"🕊️"},{id:"af17",text:"Kenijka Faith Kipyegon wygrała bieg na 1500 m na trzech igrzyskach z rzędu (2016, 2021, 2024). Jest pierwszą kobietą z takim wyczynem na tym dystansie.",category:"africa",year:2024,emoji:"🇰🇪"},{id:"mw16",text:"Masutatsu Oyama, twórca karate kyokushin, słynął z pokazów, w których walczył z bykami i jednym ciosem łamał im rogi. W karate kyokushin walczy się w pełnym kontakcie.",category:"martial",year:1964,emoji:"🥋"},{id:"mw17",text:"Ronda Rousey zdobyła brąz w judo na igrzyskach w Pekinie 2008 — jako pierwsza Amerykanka z medalem olimpijskim w tej dyscyplinie. Później została gwiazdą i mistrzynią UFC.",category:"martial",year:2008,emoji:"🇺🇸"},{id:"pa16",text:"Brytyjka Ellie Simmonds w wieku 13 lat zdobyła na igrzyskach paraolimpijskich w Pekinie 2008 dwa złote medale w pływaniu. Rok później, jako 14-latka, została najmłodszą osobą odznaczoną Orderem Imperium Brytyjskiego.",category:"para",year:2008,emoji:"🏊‍♀️"},{id:"pa17",text:"Egipcjanin Ibrahim Hamadtou, który stracił obie ręce w wypadku w dzieciństwie, gra w tenisa stołowego, trzymając rakietkę w ustach. Serwuje, podrzucając piłeczkę stopą.",category:"para",year:2016,emoji:"🏓"},{id:"sn16",text:"Pita Taufatofua z Tonga stał się sławny jako chorąży, który na otwarciu igrzysk w Rio 2016 wystąpił z nagim, natłuszczonym torsem. Startował potem także na zimowych igrzyskach — w biegach narciarskich.",category:"smallnations",year:2016,emoji:"🇹🇴"},{id:"sn17",text:"Josy Barthel wygrał w Helsinkach w 1952 roku bieg na 1500 m i sensacyjnie zdobył złoto dla Luksemburga. To jedyne złoto olimpijskie tego kraju w zawodach sportowych.",category:"smallnations",year:1952,emoji:"🇱🇺"},{id:"me16",text:"Jeden ze złotych medali Jesse'ego Owensa z igrzysk w Berlinie w 1936 roku sprzedano w 2013 roku na aukcji za ponad 1,4 miliona dolarów.",category:"medals",year:2013,emoji:"💰"},{id:"me17",text:"Medale igrzysk w Pekinie 2008 miały na odwrocie krążek z jadeitu — kamienia, który w Chinach symbolizuje szlachetność. Złote medale miały jadeit biały, srebrne jasnozielony, a brązowe ciemnozielony.",category:"medals",year:2008,emoji:"💚"},{id:"qu16",text:"„Fruwaj jak motyl, żądl jak pszczoła” — tak Muhammad Ali opisywał swój styl przed walką z Sonnym Listonem w 1964 roku. Hasło wymyślił jego asystent Drew Bundini Brown.",category:"quotes",year:1964,emoji:"🦋"},{id:"qu17",text:"Golfiście Gary'emu Playerowi przypisuje się zdanie, że im więcej trenuje, tym więcej ma szczęścia. Podobne powiedzenia krążyły jednak wcześniej i trudno ustalić, kto był pierwszy.",category:"quotes",emoji:"🍀"},{id:"ad16",text:"Alberto Contadorowi odebrano zwycięstwo w Tour de France 2010 po wykryciu klenbuterolu. Hiszpan twierdził, że substancja pochodziła ze skażonego steku.",category:"antidoping",year:2012,emoji:"🥩"},{id:"ad17",text:"Paul Pogba został w 2024 roku zawieszony na cztery lata za podwyższony poziom testosteronu. Sąd sportowy skrócił potem karę do 18 miesięcy.",category:"antidoping",year:2024,emoji:"⚽"},{id:"am16",text:"Ultra-Trail du Mont-Blanc, rozgrywany od 2003 roku, prowadzi przez Francję, Włochy i Szwajcarię wokół masywu Mont Blanc. Trasa liczy około 170 km i ponad 10 tysięcy metrów przewyższenia.",category:"amateur",year:2003,emoji:"⛰️"},{id:"am17",text:"W biegu Wings for Life World Run nie ma mety — pół godziny po starcie rusza samochód, który goni biegaczy. Kogo dogoni, ten kończy bieg, a całe wpisowe trafia na badania nad urazami rdzenia kręgowego.",category:"amateur",year:2014,emoji:"🚗"},{id:"cmt16",text:"Brytyjczyk Murray Walker komentował wyścigi Formuły 1 przez ponad 20 lat. Słynął z ogromnego entuzjazmu i przejęzyczeń, które kibice zbierali jak cytaty.",category:"commentators",year:2001,emoji:"🏎️"},{id:"cmt17",text:"Okrzyk Martina Tylera „Agüerooooo!” po golu w 94. minucie, który dał Manchesterowi City mistrzostwo Anglii w 2012 roku, uchodzi za jeden z najsłynniejszych komentarzy w historii piłki.",category:"commentators",year:2012,emoji:"🗣️"},{id:"fw16",text:"Sachin Tendulkar pożegnał się z krykietem w 2013 roku na stadionie Wankhede w Bombaju. Po ostatnim meczu ukląkł i dotknął boiska, a jego przemówienie oglądały miliony Hindusów.",category:"farewells",year:2013,emoji:"🏏"},{id:"fw17",text:"Serena Williams zagrała ostatni turniej na US Open 2022. Sama nie lubiła słowa „emerytura” — mówiła, że „ewoluuje” w stronę innych zajęć.",category:"farewells",year:2022,emoji:"🎾"},{id:"sj16",text:"Piotr Żyła dwa razy z rzędu zdobył indywidualne mistrzostwo świata na skoczni normalnej — w Oberstdorfie w 2021 i w Planicy w 2023 roku.",category:"skijumping",year:2023,emoji:"🇵🇱"},{id:"sj17",text:"Fin Matti Nykänen zdobył cztery złote medale olimpijskie, w tym trzy na igrzyskach w Calgary w 1988 roku. Wygrał też Turniej Czterech Skoczni i cztery Puchary Świata.",category:"skijumping",year:1988,emoji:"🇫🇮"},{id:"ur16",text:"Japończyk Yuto Horigome wygrał olimpijską konkurencję street w skateboardingu w Tokio 2020 i obronił złoto w Paryżu 2024, decydującym trikiem w ostatniej próbie.",category:"urban",year:2024,emoji:"🇯🇵"},{id:"ur17",text:"W Norwegii w latach 1978–1989 obowiązywał zakaz sprzedaży i używania deskorolek, uznanych za zbyt niebezpieczne. Młodzież jeździła na nich mimo to, a zakaz w końcu zniesiono.",category:"urban",year:1989,emoji:"🚫"},{id:"cm16",text:"Wojciech Kurtyka w 2016 roku otrzymał Złoty Czekan za całokształt twórczości — najważniejszą nagrodę w alpinizmie. Wcześniej wielokrotnie odmawiał jej przyjęcia.",category:"climbing",year:2016,emoji:"🏆"},{id:"cm17",text:"Nepalczyk Nirmal Purja w 2019 roku zdobył wszystkie 14 ośmiotysięczników w ciągu niewiele ponad sześciu miesięcy. Wcześniej najszybsze zdobycie korony Himalajów trwało blisko osiem lat.",category:"climbing",year:2019,emoji:"🇳🇵"},{id:"uw16",text:"Nowozelandczyk William Trubridge zanurkował na wstrzymanym oddechu na głębokość 102 metrów bez płetw i bez balastu — o własnych siłach, tylko ruchami rąk i nóg.",category:"underwater",year:2016,emoji:"🇳🇿"},{id:"uw17",text:"Chorwat Budimir Šobat w 2021 roku wstrzymał oddech pod wodą na 24 minuty i 37 sekund. Przed próbą oddychał czystym tlenem, dlatego jest to osobna kategoria rekordów.",category:"underwater",year:2021,emoji:"⏳"},{id:"fs16",text:"W 2019 roku na pierwszej noworocznej aukcji w Tokio tuńczyk błękitnopłetwy ważący 278 kg został sprzedany za około 3 miliony dolarów. Kupił go właściciel sieci restauracji sushi.",category:"fishing",year:2019,emoji:"🐟"},{id:"fs17",text:"Japońska tenkara to wędkarstwo muchowe bez kołowrotka — żyłka jest przywiązana bezpośrednio do końca długiej wędki. Metodę stosowali dawniej górscy rybacy łowiący pstrągi.",category:"fishing",emoji:"🎣"},{id:"sb16",text:"Japończyk Ayumu Hirano zdobył złoto w halfpipie w Pekinie 2022, wykonując jako pierwszy na igrzyskach potrójny obrót z przewrotem (triple cork 1440). Startował też w skateboardingu na igrzyskach w Tokio.",category:"snowboard",year:2022,emoji:"🇯🇵"},{id:"sb17",text:"Lindsey Jacobellis w 2006 roku straciła pewne złoto w snowboardcrossie, bo popisywała się efektownym chwytem przed metą i upadła. Na złoto czekała 16 lat — zdobyła je w Pekinie 2022.",category:"snowboard",year:2022,emoji:"🇺🇸"},{id:"rw16",text:"Robert Sycz i Tomasz Kucharski zdobyli złoto olimpijskie w dwójce podwójnej wagi lekkiej w Sydney 2000 i obronili je w Atenach 2004.",category:"rowing",year:2004,emoji:"🇵🇱"},{id:"rw17",text:"Niemiecka kajakarka Birgit Fischer zdobyła osiem złotych medali olimpijskich w latach 1980–2004. Ostatnie złoto wywalczyła w wieku 42 lat.",category:"rowing",year:2004,emoji:"🇩🇪"},{id:"dn16",text:"Mistrzostwa świata w tańcu irlandzkim rozgrywane są od 1970 roku i przyciągają tysiące tancerzy z całego świata. Popularność tej dyscypliny wystrzeliła po spektaklu „Riverdance” z 1994 roku.",category:"dance",year:1970,emoji:"☘️"},{id:"dn17",text:"Taniec na rurze w wersji sportowej ma własną federację i mistrzostwa świata. W 2017 roku zrzeszenie międzynarodowych federacji sportowych przyznało mu status obserwatora.",category:"dance",year:2017,emoji:"💃"},{id:"av16",text:"Franciszek Żwirko i Stanisław Wigura wygrali w 1932 roku międzynarodowe zawody lotnicze Challenge na polskiej konstrukcji RWD-6. Kilka tygodni później obaj zginęli w katastrofie lotniczej.",category:"aviation",year:1932,emoji:"✈️"},{id:"av17",text:"Niemiecka paralotniarka Ewa Wiśnierska w 2007 roku została wciągnięta przez chmurę burzową na wysokość blisko 10 kilometrów. Straciła przytomność, ale przeżyła i wylądowała po kilku godzinach.",category:"aviation",year:2007,emoji:"⛈️"},{id:"of16",text:"Francuz Jules Rimet kierował FIFA przez 33 lata (1921–1954) — najdłużej w historii. To z jego inicjatywy powstały mistrzostwa świata, a pierwsze trofeum mundialu nosiło jego imię.",category:"officials",year:1954,emoji:"🏆"},{id:"of17",text:"Irena Szewińska po karierze została członkinią Międzynarodowego Komitetu Olimpijskiego i przez wiele lat była prezesem Polskiego Związku Lekkiej Atletyki.",category:"officials",year:1998,emoji:"🇵🇱"},{id:"tf16",text:"Luís Figo przeszedł w 2000 roku z Barcelony do Realu Madryt, który wykupił jego klauzulę. Gdy w 2002 roku wrócił na Camp Nou, kibice rzucili w niego świńskim łbem.",category:"transfers",year:2002,emoji:"🐷"},{id:"tf17",text:"Real Madryt kupił w 2009 roku Cristiano Ronaldo z Manchesteru United za około 94 miliony euro — wtedy rekord świata. Jego prezentację na Bernabéu oglądało około 80 tysięcy kibiców.",category:"transfers",year:2009,emoji:"💶"},{id:"ca16",text:"Mistrzostwa świata w lekkoatletyce odbywały się początkowo co cztery lata (1983, 1987), a od 1991 roku co dwa. Dzięki temu najlepsi startują na wielkiej imprezie niemal co roku.",category:"calendar",year:1991,emoji:"🏃"},{id:"ca17",text:"W Święto Dziękczynienia w USA od 1934 roku rozgrywane są mecze NFL z udziałem Detroit Lions. Futbol po świątecznym obiedzie to dla wielu Amerykanów rodzinna tradycja.",category:"calendar",year:1934,emoji:"🦃"},{id:"ic16",text:"Polskie panczenistki zdobyły brąz w wyścigu drużynowym na igrzyskach w Vancouver 2010. To był pierwszy olimpijski medal Polek w łyżwiarstwie szybkim od 1960 roku.",category:"ice",year:2010,emoji:"🇵🇱"},{id:"ic17",text:"Katarina Witt z NRD zdobyła złoto olimpijskie w łyżwiarstwie figurowym w 1984 i 1988 roku. Po zjednoczeniu Niemiec okazało się, że Stasi prowadziła jej obszerną teczkę.",category:"ice",year:1988,emoji:"🇩🇪"},{id:"sf16",text:"Gruziński saneczkarz Nodar Kumaritaszwili zginął na treningu w dniu otwarcia igrzysk w Vancouver 2010. Po wypadku przesunięto start, by zmniejszyć prędkość, i podwyższono bandy.",category:"safety",year:2010,emoji:"🛷"},{id:"sf17",text:"Samochód bezpieczeństwa w Formule 1 pojawił się po raz pierwszy w 1973 roku podczas Grand Prix Kanady. Wprowadzenie go wywołało chaos w punktacji, więc na stałe wrócił dopiero w latach 90.",category:"safety",year:1973,emoji:"🚗"},{id:"ec16",text:"Igrzyska w Pekinie 2022 jako pierwsze w historii odbyły się niemal całkowicie na sztucznym śniegu. Do jego produkcji zużyto miliony metrów sześciennych wody.",category:"ecology",year:2022,emoji:"❄️"},{id:"ec17",text:"Organizatorzy igrzysk w Sydney 2000 współpracowali z Greenpeace przy projektowaniu wioski olimpijskiej. Domy zasilano energią słoneczną, a teren dawnego wysypiska zamieniono w park.",category:"ecology",year:2e3,emoji:"🌿"},{id:"prl16",text:"Gdy Polska zbojkotowała igrzyska w Los Angeles 1984, dla sportowców bloku wschodniego zorganizowano zastępcze Zawody Przyjaźni-84. Wiele wyników było lepszych niż te z Los Angeles.",category:"prl",year:1984,emoji:"🤝"},{id:"prl17",text:"Stanisław Królak w 1956 roku jako pierwszy Polak wygrał Wyścig Pokoju. Według legendy podczas jednego z etapów odganiał rywali pompką rowerową.",category:"prl",year:1956,emoji:"🚴"},{id:"ga16",text:"Igrzyska Frankofonii, organizowane od 1989 roku dla krajów francuskojęzycznych, łączą zawody sportowe z konkursami artystycznymi — od śpiewu po literaturę.",category:"games",year:1989,emoji:"🇫🇷"},{id:"ga17",text:"Światowe Igrzyska Koczowników w Kirgistanie, organizowane od 2014 roku, gromadzą dyscypliny ludów stepu — od łucznictwa konnego po kok-boru, czyli grę jeźdźców o tuszę kozy.",category:"games",year:2014,emoji:"🐎"}];function ek(y,c=Pi){const z=y==="all"?c:c.filter(d=>d.category===y),s=z.length>0?z:c;return s[Math.floor(Math.random()*s.length)]}function Ho(y,c=Pi){return y==="all"?c:c.filter(z=>z.category===y)}function ak(y,c=Pi){const z=y.trim().toLowerCase();return z?c.filter(s=>{const d=ra.find(m=>m.id===s.category);return s.text.toLowerCase().includes(z)||d&&d.label.toLowerCase().includes(z)||s.year!==void 0&&String(s.year).includes(z)}):[]}function _t(y,c){const[z,s]=H.useState(()=>{try{const m=localStorage.getItem(y);return m!==null?JSON.parse(m):c}catch{return c}});return[z,m=>{s(k=>{const f=typeof m=="function"?m(k):m;try{localStorage.setItem(y,JSON.stringify(f))}catch{}return f})}]}var Jo;(function(y){y.Unimplemented="UNIMPLEMENTED",y.Unavailable="UNAVAILABLE"})(Jo||(Jo={}));class Kc extends Error{constructor(c,z,s){super(c),this.message=c,this.code=z,this.data=s}}const ik=y=>{var c,z;return y?.androidBridge?"android":!((z=(c=y?.webkit)===null||c===void 0?void 0:c.messageHandlers)===null||z===void 0)&&z.bridge?"ios":"web"},ok=y=>{const c=y.CapacitorCustomPlatform||null,z=y.Capacitor||{},s=z.Plugins=z.Plugins||{},d=()=>c!==null?c.name:ik(y),m=()=>d()!=="web",k=N
