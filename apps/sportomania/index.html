 nim wszyscy z zasłoniętymi oczami. Piłka ma w środku dzwonki, więc na hali obowiązuje absolutna cisza — kibice wiwatują dopiero po golu.",category:"para",year:1976,emoji:"🔔"},{id:"pa4",text:"Boccia to jedna z niewielu dyscyplin paraolimpijskich bez odpowiednika na igrzyskach olimpijskich. Zawodnicy z najcięższymi niepełnosprawnościami toczą piłki po parkiecie, korzystając czasem z rynny i pomocy asystenta.",category:"para",year:1984,emoji:"🎯"},{id:"pa5",text:"Niemiec Markus Rehm skacze w dal na protezie dalej, niż wynoszą zwycięskie wyniki wielu igrzysk olimpijskich. Trwa spór, czy proteza daje mu przewagę, czy tylko wyrównuje szanse.",category:"para",year:2018,emoji:"📏"},{id:"pa6",text:"Amerykanka Trischa Zorn zdobyła w pływaniu ponad 50 medali paraolimpijskich — to najbardziej utytułowana zawodniczka w historii tych igrzysk.",category:"para",year:2004,emoji:"🏊‍♀️"},{id:"pa7",text:"Rugby na wózkach bywa nazywane „murderball” — wózki są wzmacniane niczym zderzaki, a zderzenia tak mocne, że zawodnicy regularnie się wywracają. To pełnokontaktowy sport z prawdziwego zdarzenia.",category:"para",year:1977,emoji:"💥"},{id:"pa8",text:"Polska reprezentacja paraolimpijska od dekad przywozi z igrzysk kilkadziesiąt medali — w niektórych edycjach zdobywała ich więcej niż kadra olimpijska.",category:"para",year:2016,emoji:"🇵🇱"},{id:"o46",text:"Podczas igrzysk dla osób niesłyszących, zwanych Deaflympics, start sygnalizuje się światłem zamiast wystrzału. Impreza jest starsza od paraolimpiady — pierwszą rozegrano w 1924 roku.",category:"olympics",year:1924,emoji:"💡"},{id:"sci11",text:"Protezy biegowe w kształcie litery C wykonuje się z włókna węglowego i projektuje tak, by oddawały energię przy odbiciu. Nie mają jednak mięśni — całą pracę wykonuje reszta ciała zawodnika.",category:"science",year:1996,emoji:"🦿"},{id:"sn1",text:"Islandia z około 380 tysiącami mieszkańców awansowała na mistrzostwa świata 2018 — to najmniejszy kraj w historii mundialu. Jeden na dziesięciu Islandczyków pojechał wcześniej na Euro 2016.",category:"smallnations",year:2018,emoji:"🇮🇸"},{id:"sn2",text:"Jamajka, licząca niecałe trzy miliony mieszkańców, od dekad dominuje w sprincie. Bieganie jest tam sportem szkolnym numer jeden, a mistrzostwa młodzieży wypełniają stadiony.",category:"smallnations",year:2012,emoji:"🇯🇲"},{id:"sn3",text:"Fidżi zdobyło pierwszy medal olimpijski w swojej historii dopiero w 2016 roku — i od razu było to złoto w rugby siedmioosobowym. W kraju ogłoszono z tej okazji święto narodowe.",category:"smallnations",year:2016,emoji:"🇫🇯"},{id:"sn4",text:"Bahamy mają jeden z najwyższych na świecie wskaźników medali olimpijskich w przeliczeniu na mieszkańca — głównie dzięki sprinterom i sztafetom.",category:"smallnations",year:2012,emoji:"🏝️"},{id:"sn5",text:"Liechtenstein, kraj mniejszy od niejednego miasta, zdobywał medale olimpijskie wyłącznie zimą. Wszystkie wywalczyli narciarze alpejscy, w tym rodzeństwo Wenzelów.",category:"smallnations",year:1980,emoji:"🇱🇮"},{id:"sn6",text:"Norwegia z około 5,5 miliona mieszkańców zdobyła w historii zimowych igrzysk więcej medali niż jakikolwiek inny kraj. Mówi się tam, że Norwegowie „rodzą się z nartami na nogach”.",category:"smallnations",year:2022,emoji:"🇳🇴"},{id:"sn7",text:"Grenada, wyspa licząca około 110 tysięcy mieszkańców, ma własnego mistrza olimpijskiego — Kirani James wygrał bieg na 400 metrów w Londynie 2012.",category:"smallnations",year:2012,emoji:"🇬🇩"},{id:"sn8",text:"Kosowo zdobyło pierwsze w historii złoto olimpijskie zaledwie kilka lat po uznaniu jego reprezentacji — wywalczyła je judoczka Majlinda Kelmendi w Rio de Janeiro.",category:"smallnations",year:2016,emoji:"🥋"},{id:"me1",text:"Bermudy stały się najmniejszym terytorium ze złotym medalem letnich igrzysk — Flora Duffy wygrała triathlon w Tokio, a wyspa świętowała dniem wolnym od pracy.",category:"medals",year:2021,emoji:"🇧🇲"},{id:"geo9",text:"Kraje bez śniegu też startują na zimowych igrzyskach — reprezentacje tropikalnych wysp zgłaszają bobsleistów i narciarzy, którzy trenują na lodowiskach i sztucznych stokach.",category:"geography",year:1988,emoji:"🌴"},{id:"qu1",text:"Bill Shankly rzucił kiedyś, że futbol nie jest kwestią życia i śmierci — jest „czymś znacznie ważniejszym”. Sam traktował to jako żart, ale zdanie stało się mottem kibiców na całym świecie.",category:"quotes",year:1981,emoji:"⚽"},{id:"qu2",text:"Gary Lineker podsumował futbol słowami: to prosta gra, w której dwudziestu dwóch mężczyzn goni piłkę, a na końcu i tak wygrywają Niemcy. Powiedział to po przegranym półfinale z RFN.",category:"quotes",year:1990,emoji:"🇩🇪"},{id:"qu3",text:"Wayne Gretzky mawiał, że nie trafi się w sto procent strzałów, których się nie oddało. Zdanie hokeisty stało się jednym z najczęściej cytowanych motywacyjnych powiedzeń świata.",category:"quotes",year:1990,emoji:"🏒"},{id:"qu4",text:"Vince Lombardi twierdził, że zwycięstwo nie jest wszystkim — ale chęć zwycięstwa już tak. Jego przemowy do zawodników cytuje się dziś na kursach zarządzania.",category:"quotes",year:1965,emoji:"🏈"},{id:"qu5",text:"Michael Jordan przypominał, ile razy przegrywał: setki meczów, tysiące niecelnych rzutów, kilkadziesiąt razy zawiódł, mając oddać decydujący strzał. „I właśnie dlatego odnoszę sukcesy”.",category:"quotes",year:1997,emoji:"🏀"},{id:"qu6",text:"Baseballista Yogi Berra słynął z paradoksów: „to nie koniec, dopóki się nie skończy” albo „baseball to w 90 procentach gra mentalna, a druga połowa jest fizyczna”.",category:"quotes",year:1973,emoji:"😄"},{id:"qu7",text:"Johan Cruyff mawiał, że grać w piłkę jest bardzo łatwo — trudno jest grać prosto. Jego zdania o futbolu do dziś powtarzają trenerzy na całym świecie.",category:"quotes",year:1990,emoji:"🇳🇱"},{id:"qu8",text:"Powiedzenie „najważniejszy jest udział” przypisuje się Coubertinowi, ale twórca igrzysk zapożyczył je z kazania biskupa wygłoszonego podczas olimpiady w Londynie w 1908 roku.",category:"quotes",year:1908,emoji:"🕊️"},{id:"p32",text:"Kazimierz Górski wszedł do języka polskiego jak mało który trener — jego „dopóki piłka w grze, wszystko jest możliwe” cytuje się dziś także poza sportem.",category:"poland",year:1974,emoji:"🗣️"},{id:"cu12",text:"Sportowe powiedzenia trafiły do codziennej polszczyzny: „rzutem na taśmę”, „poniżej pasa”, „w przedbiegach” czy „rzucić ręcznik” to zwroty rodem z bieżni, ringu i boiska.",category:"culture",year:2e3,emoji:"💬"},{id:"ad1",text:"Światowa Agencja Antydopingowa powstała w 1999 roku — bezpośrednim impulsem była afera dopingowa, która rok wcześniej wstrząsnęła Tour de France.",category:"antidoping",year:1999,emoji:"🏛️"},{id:"ad2",text:"Paszport biologiczny nie szuka konkretnych substancji, lecz śledzi parametry krwi zawodnika przez lata. Nagłe odchylenia od jego własnej normy same w sobie mogą być dowodem dopingu.",category:"antidoping",year:2009,emoji:"📈"},{id:"ad3",text:"Sportowcy z puli badań muszą przez cały rok podawać, gdzie będą dostępni przez godzinę każdego dnia. Trzy nieudane próby kontroli traktuje się jak pozytywny wynik.",category:"antidoping",year:2004,emoji:"📍"},{id:"ad4",text:"Próbki z igrzysk przechowuje się przez dekadę i bada ponownie, gdy pojawią się nowe metody wykrywania. Dlatego medale bywają odbierane i przyznawane nawet osiem lat po zawodach.",category:"antidoping",year:2016,emoji:"🧊"},{id:"ad5",text:"Pierwsza tragedia dopingowa na igrzyskach wydarzyła się w Rzymie w 1960 roku, gdy podczas wyścigu kolarskiego zmarł duński zawodnik. To przyspieszyło wprowadzenie kontroli antydopingowych.",category:"antidoping",year:1960,emoji:"🕯️"},{id:"ad6",text:"Regularne testy antydopingowe wprowadzono na igrzyskach dopiero w 1968 roku. Wcześniej stosowanie środków wspomagających nie było formalnie zakazane.",category:"antidoping",year:1968,emoji:"🧪"},{id:"ad7",text:"Aferę z „projektowanym” sterydem THG wykryto dzięki anonimowej przesyłce — ktoś wysłał do laboratorium strzykawkę z resztkami nieznanej substancji. Na jej podstawie opracowano test wykrywający.",category:"antidoping",year:2003,emoji:"💉"},{id:"ad8",text:"Istnieje też doping mechaniczny — ukryty silniczek w ramie roweru. Pierwszy udowodniony przypadek wykryto w 2016 roku, a od tamtej pory ramy prześwietla się tabletami i kamerami termowizyjnymi.",category:"antidoping",year:2016,emoji:"🔧"},{id:"sc10",text:"Kolarze z lat 90. i 2000. masowo stosowali EPO, na które długo nie było testu. Gdy w końcu go opracowano, wyniki całych sezonów trzeba było czytać na nowo.",category:"scandals",year:2e3,emoji:"🩸"},{id:"sci12",text:"Niektóre leki na astmę czy przeziębienie zawierają substancje z listy zakazanych. Sportowcy muszą występować o wyłączenie terapeutyczne, a przypadkowe zażycie syropu bywało powodem dyskwalifikacji.",category:"science",year:2010,emoji:"💊"},{id:"am1",text:"Parkrun to darmowe sobotnie biegi na 5 km organizowane przez wolontariuszy w kilkudziesięciu krajach. Nie ma zwycięzców ani nagród — liczy się wspólny start i własny czas.",category:"amateur",year:2004,emoji:"🏃"},{id:"am2",text:"Maraton nowojorski to największy bieg świata — na starcie staje około 50 tysięcy osób, a trasa prowadzi przez wszystkie pięć dzielnic miasta.",category:"amateur",year:1970,emoji:"🗽"},{id:"am3",text:"Sześć najbardziej prestiżowych maratonów świata tworzy cykl World Marathon Majors. Za ukończenie wszystkich biegacz dostaje specjalny medal z sześcioma gwiazdami.",category:"amateur",year:2006,emoji:"⭐"},{id:"am4",text:"Do największych maratonów wchodzi się przez losowanie — chętnych jest kilka razy więcej niż miejsc. Niektórzy próbują szczęścia w loterii przez wiele lat z rzędu.",category:"amateur",year:2015,emoji:"🎫"},{id:"am5",text:"W dużych biegach pomagają „pacemakerzy” z balonikami oznaczającymi docelowy czas. Wystarczy biec za odpowiednim balonem, by ukończyć maraton w wymarzonym rezultacie.",category:"amateur",year:2e3,emoji:"🎈"},{id:"am6",text:"Bieg Niepodległości w Warszawie gromadzi kilkadziesiąt tysięcy uczestników i jest jednym z największych biegów w Europie Środkowej. Startują w nim całe rodziny.",category:"amateur",year:1989,emoji:"🇵🇱"},{id:"am7",text:"Ironman to 3,8 km pływania, 180 km na rowerze i pełny maraton — wszystko w jeden dzień, w limicie 17 godzin. Na mecie każdy słyszy zdanie: „You are an Ironman”.",category:"amateur",year:1978,emoji:"🔱"},{id:"am8",text:"Biegi z przeszkodami przeżywają boom — uczestnicy czołgają się w błocie, wspinają po ścianach i brodzą w lodowatej wodzie. W Polsce popularność zdobyły imprezy typu Runmageddon.",category:"amateur",year:2014,emoji:"🪖"},{id:"am9",text:"Amatorzy w maratonie biegną tą samą trasą co mistrzowie świata — to jedyny taki przypadek w sporcie. W piłce nożnej odpowiednikiem byłby mecz kibiców z mistrzami olimpijskimi.",category:"amateur",year:2e3,emoji:"🤝"},{id:"am10",text:"Najstarsi uczestnicy maratonów mają po osiemdziesiąt i dziewięćdziesiąt lat. Organizatorzy tworzą dla nich osobne kategorie wiekowe, często z pojedynczymi zawodnikami na liście startowej.",category:"amateur",year:2010,emoji:"👵"},{id:"cmt1",text:"Amerykanin Vin Scully komentował mecze jednego klubu baseballowego przez 67 sezonów. Zaczynał w czasach, gdy transmisje szły tylko w radiu, a skończył w erze streamingu.",category:"commentators",year:2016,emoji:"🎙️"},{id:"cmt2",text:"Okrzyk „He shoots, he scores!” wymyślił Foster Hewitt, komentując mecze hokeja z drewnianej budki zawieszonej wysoko nad lodowiskiem. Fraza weszła do kanonu sportowego języka.",category:"commentators",year:1933,emoji:"🏒"},{id:"cmt3",text:"Bohdan Tomaszewski komentował kilkanaście igrzysk olimpijskich, a jego relacje uchodziły za literaturę. Mówił spokojnie i obrazowo, w czasach, gdy radio było jedynym oknem na świat sportu.",category:"commentators",year:1956,emoji:"📻"},{id:"cmt4",text:"Dariusz Szpakowski komentuje mecze polskiej reprezentacji od lat 80. — dla kilku pokoleń kibiców jego głos jest nieodłączną częścią wielkich turniejów.",category:"commentators",year:1982,emoji:"🇵🇱"},{id:"cmt5",text:"Hiszpańskojęzyczni komentatorzy ciągną okrzyk „goool” nawet kilkanaście sekund na jednym oddechu. Ta maniera narodziła się w Ameryce Łacińskiej i stała się znakiem rozpoznawczym tamtejszych transmisji.",category:"commentators",year:1950,emoji:"📢"},{id:"cmt6",text:"Najsłynniejsze zdanie brytyjskiej telewizji sportowej padło w finale mundialu 1966: komentator zauważył wbiegających na boisko kibiców i rzucił, że „myślą, że już po wszystkim — teraz już tak”.",category:"commentators",year:1966,emoji:"🏴󠁧󠁢󠁥󠁮󠁧󠁿"},{id:"cmt7",text:"Najlepsi komentatorzy potrafią zamilknąć w kluczowym momencie, oddając głos stadionowi. Ta technika, zwana „letting the pictures breathe”, bywa mocniejsza niż jakikolwiek okrzyk.",category:"commentators",year:1990,emoji:"🤫"},{id:"cmt8",text:"Radiowy komentarz rządzi się innymi prawami niż telewizyjny — trzeba nieprzerwanie opisywać pozycje zawodników, bo słuchacz niczego nie widzi. Dobrzy radiowcy mówią po kilkanaście tysięcy słów w trakcie meczu.",category:"commentators",year:1930,emoji:"🗣️"},{id:"md9",text:"Podczas transmisji z wielkich igrzysk pracuje kilkanaście tysięcy osób — więcej niż startuje sportowców. Same kamery liczy się w setkach, a przewody kablowe w setkach kilometrów.",category:"media",year:2021,emoji:"🎥"},{id:"fn11",text:"Kibice często wyciszają telewizor i słuchają radiowego komentarza, uważając go za bardziej emocjonalny. Problem w tym, że sygnał radiowy potrafi wyprzedzać obraz nawet o kilkanaście sekund.",category:"fans",year:2005,emoji:"📺"},{id:"fw1",text:"Lou Gehrig żegnał się z baseballem w 1939 roku, wiedząc, że jest śmiertelnie chory. Powiedział wtedy do pełnego stadionu, że uważa się za „najszczęśliwszego człowieka na świecie”.",category:"farewells",year:1939,emoji:"🕯️"},{id:"fw2",text:"Kobe Bryant w ostatnim meczu kariery zdobył 60 punktów — najwięcej ze wszystkich koszykarzy tamtego wieczoru w całej lidze. Miał wtedy 37 lat i grał już z licznymi kontuzjami.",category:"farewells",year:2016,emoji:"🐍"},{id:"fw3",text:"Na pożegnalnym meczu Diego Maradony w 2001 roku padło jego słynne zdanie o tym, że piłka „się nie brudzi”. Przyznał się do błędów, ale poprosił, by nie obwiniać za nie futbolu.",category:"farewells",year:2001,emoji:"⚽"},{id:"fw4",text:"Zinedine Zidane zakończył karierę czerwoną kartką w finale mistrzostw świata 2006 — za uderzenie rywala głową w klatkę piersiową. Kilka miesięcy wcześniej zapowiedział, że to jego ostatni mecz w życiu.",category:"farewells",year:2006,emoji:"🟥"},{id:"fw5",text:"Roger Federer pożegnał się z tenisem, grając debla u boku Rafaela Nadala. Po ostatniej piłce obaj płakali, trzymając się za ręce — zdjęcie obiegło cały świat.",category:"farewells",year:2022,emoji:"🥹"},{id:"fw6",text:"Michael Jordan ogłaszał zakończenie kariery trzy razy i dwa razy wracał. Ostatni mecz rozegrał w wieku 40 lat, w barwach klubu, którego był wtedy współwłaścicielem.",category:"farewells",year:2003,emoji:"🔁"},{id:"fw7",text:"Robert Korzeniowski zakończył karierę tak, jak marzy każdy sportowiec — złotym medalem olimpijskim w Atenach. Po dekoracji od razu ogłosił, że to jego ostatni start.",category:"farewells",year:2004,emoji:"🥇"},{id:"fw8",text:"Muhammad Ali stoczył ostatnią walkę w wieku 39 lat i przegrał ją na punkty. Sam przyznał później, że wrócił do ringu o kilka lat za późno.",category:"farewells",year:1981,emoji:"🥊"},{id:"fw9",text:"Sportowcy żegnani „szpalerem” przechodzą między dwoma rzędami klaszczących rywali. Ten gest, zapożyczony z krykieta i rugby, jest jednym z najwyższych wyrazów szacunku w sporcie.",category:"farewells",year:1990,emoji:"👏"},{id:"fw10",text:"Adam Małysz pożegnał się ze skokami w 2011 roku, a na jego ostatnie konkursy przyjeżdżały tłumy kibiców. Zaraz potem rozpoczął zupełnie nową karierę — jako kierowca rajdowy.",category:"farewells",year:2011,emoji:"🦅"},{id:"sj1",text:"Największa skocznia świata stoi w norweskim Vikersund. To mamut, na którym padają rekordy długości lotu — skoczkowie są w powietrzu przez kilka długich sekund.",category:"skijumping",year:2011,emoji:"🏔️"},{id:"sj2",text:"Turniej Czterech Skoczni rozgrywany jest od 1953 roku między Bożym Narodzeniem a Trzech Króli. Wygranie wszystkich czterech konkursów w jednej edycji udało się w historii tylko trzem skoczkom.",category:"skijumping",year:1953,emoji:"4️⃣"},{id:"sj3",text:"Styl V wprowadził w latach 80. Szwed Jan Boklöv. Sędziowie karali go za brzydki wygląd skoków, ale przewaga w odległości była tak duża, że wkrótce skakał tak cały świat.",category:"skijumping",year:1985,emoji:"✌️"},{id:"sj4",text:"Belka startowa jest regulowana — trener może obniżyć rozbieg, gdy warunki są zbyt dobre. Za krótszy najazd zawodnik dostaje punkty rekompensaty.",category:"skijumping",year:2010,emoji:"🪑"},{id:"sj5",text:"Od 2010 roku wynik skoku koryguje się o siłę i kierunek wiatru. Skok pod wiatr jest łatwiejszy, więc odejmuje się punkty — z wiatrem w plecy zawodnik je otrzymuje.",category:"skijumping",year:2010,emoji:"🌬️"},{id:"sj6",text:"Loty narciarskie mają własne mistrzostwa świata, rozgrywane co dwa lata. Na całym świecie jest zaledwie kilka skoczni mamucich, na których można je organizować.",category:"skijumping",year:1972,emoji:"🦅"},{id:"sj7",text:"Na progu skoczni zawodnik pędzi z prędkością około 90–100 km/h. Odbicie trwa ułamek sekundy i to ono w największym stopniu decyduje o długości skoku.",category:"skijumping",year:2015,emoji:"⚡"},{id:"sj8",text:"Za pierwszy udokumentowany skok narciarski uznaje się wyczyn norweskiego oficera Olafa Ryego z 1809 roku. Skoczył około dziewięciu metrów na oczach kolegów z wojska.",category:"skijumping",year:1809,emoji:"📜"},{id:"sj9",text:"Kombinezony skoczków są ściśle mierzone przed konkursem — zbyt luźny materiał działa jak skrzydła. Za odstępstwo od norm grozi natychmiastowa dyskwalifikacja, nawet po świetnym skoku.",category:"skijumping",year:2e3,emoji:"📐"},{id:"sj10",text:"Konkursy drużynowe rozgrywa się w czterech seriach, w których skacze po jednym zawodniku z każdej ekipy. Napięcie rośnie do ostatniego skoku — kolejność ustala się według wyników.",category:"skijumping",year:1988,emoji:"🤝"},{id:"me2",text:"MKOl oficjalnie nie prowadzi tabeli medalowej państw. Kraje liczą ją po swojemu: Amerykanie według łącznej liczby medali, większość świata według liczby złotych.",category:"medals",year:1908,emoji:"📊"},{id:"me3",text:"W Tokio 2020 dwóch skoczków wzwyż miało identyczny wynik i zamiast dogrywki zgodziło się podzielić złotem. Wzruszona reakcja obu zawodników obiegła cały świat.",category:"medals",year:2021,emoji:"🤝"},{id:"me4",text:"Po dyskwalifikacjach dopingowych medale wędrują w dół klasyfikacji nawet po wielu latach. Niektórzy sportowcy odbierali swoje krążki na uroczystościach organizowanych długo po zakończeniu kariery.",category:"medals",year:2016,emoji:"⏳"},{id:"me5",text:"Współczesne medale olimpijskie ważą po kilkaset gramów i mają kilkanaście centymetrów średnicy. Każdy gospodarz projektuje własne, ale awers od dekad przedstawia grecką boginię zwycięstwa.",category:"medals",year:2004,emoji:"🥇"},{id:"me6",text:"W judo, boksie i zapasach przyznaje się po dwa brązowe medale — przegrani półfinaliści nie grają o trzecie miejsce. Uznano, że po ciężkich walkach dodatkowy pojedynek byłby zbyt obciążający.",category:"medals",year:1952,emoji:"🥉"},{id:"me7",text:"W sportach drużynowych medal dostaje każdy zawodnik z kadry — także rezerwowi, którzy nie zagrali ani minuty. W niektórych dyscyplinach obejmuje to również trenerów.",category:"medals",year:1980,emoji:"👥"},{id:"me8",text:"Rekord medali zdobytych przez jeden kraj na jednych igrzyskach należy do gospodarzy z początku XX wieku, gdy w wielu konkurencjach startowali niemal wyłącznie oni sami.",category:"medals",year:1904,emoji:"🏅"},{id:"me9",text:"Medale wręcza się dziś na podium według miejsc, ale zwyczaj ten wprowadzono dopiero w latach 30. XX wieku. Wcześniej nagrody rozdawano zbiorczo na zakończenie całych igrzysk.",category:"medals",year:1932,emoji:"🏆"},{id:"me10",text:"Sportowcy czasem sprzedają medale na cele charytatywne. Bywa, że nabywcy oddają je potem zawodnikom — chcieli tylko wesprzeć szczytny cel, nie zabierać pamiątki.",category:"medals",year:2021,emoji:"💛"},{id:"me11",text:"Medale olimpijskie mają na obrzeżu wygrawerowaną nazwę konkurencji — dzięki temu po latach wiadomo dokładnie, za co zostały przyznane. Zwyczaj ten wprowadzono na igrzyskach w Atenach w 2004 roku.",category:"medals",year:2004,emoji:"✍️"},{id:"bb1",text:"Baseball przez ponad sto lat nie miał zegara — mecz trwał, dopóki nie rozegrano kompletu zmian. Dopiero w 2023 roku wprowadzono limit czasu na przygotowanie rzutu, skracając spotkania o pół godziny.",category:"baseball",year:2023,emoji:"⏱️"},{id:"bb2",text:"Piłka baseballowa ma dokładnie 108 podwójnych szwów, a każda jest zszywana ręcznie. Podczas jednego meczu ligi zużywa się kilkadziesiąt piłek — wymienia się je, gdy tylko dotkną ziemi.",category:"baseball",year:1900,emoji:"🧵"},{id:"bb3",text:"W połowie siódmej zmiany cały stadion wstaje i śpiewa „Take Me Out to the Ball Game”. Ten „seventh-inning stretch” to jeden z najstarszych rytuałów amerykańskiego sportu.",category:"baseball",year:1910,emoji:"🎶"},{id:"bb4",text:"Sezon zasadniczy MLB liczy 162 mecze na drużynę — więcej niż w jakiejkolwiek innej wielkiej lidze. Zespoły grają praktycznie codziennie przez pół roku, przemieszczając się między miastami.",category:"baseball",year:1961,emoji:"📅"},{id:"bb5",text:"Trenerzy baseballowi wychodzą na boisko w pełnym stroju drużyny, z numerem na plecach. To jedyny taki zwyczaj wśród wielkich sportów zawodowych — w innych szkoleniowcy noszą garnitury lub dresy.",category:"baseball",year:1900,emoji:"🧢"},{id:"bb6",text:"Sędzia główny kuca tuż za łapaczem i ocenia, czy piłka przeszła przez wyimaginowaną strefę strike'ów. Od kilku lat liga testuje system, w którym zawodnik może zakwestionować decyzję i poprosić o werdykt komputera.",category:"baseball",year:2024,emoji:"👁️"},{id:"bb7",text:"Najdalsze uderzenia w historii baseballu przelatywały ponad 150 metrów. Takie trafienia mają własne nazwy — „moonshot” dla najwyższych i „dinger” dla każdego wybicia poza boisko.",category:"baseball",year:2019,emoji:"🌕"},{id:"bb8",text:"Baseball znikał i wracał do programu igrzysk kilkakrotnie — grano w niego w latach 1992–2008, potem raz w Tokio, a kolejny powrót zaplanowano na Los Angeles 2028.",category:"baseball",year:2028,emoji:"🔁"},{id:"fn12",text:"Kibic, który złapie piłkę po home runie, zatrzymuje ją na własność. Wyjątkiem są historyczne trafienia — wtedy klub zwykle proponuje wymianę na pamiątki lub spotkanie z zawodnikiem.",category:"fans",year:1998,emoji:"🧤"},{id:"as10",text:"Japońska liga baseballowa ma własne rytuały — kibice każdej drużyny śpiewają osobne pieśni dla każdego pałkarza, z towarzyszeniem trąbek i bębnów przez cały mecz.",category:"asia",year:1936,emoji:"🎺"},{id:"cr1",text:"Mecz testowy w krykiecie trwa do pięciu dni po kilka godzin dziennie — i mimo to całkiem często kończy się remisem, gdy zabraknie czasu na dokończenie rywalizacji.",category:"cricket",year:1877,emoji:"📆"},{id:"cr2",text:"Krykiet ma trzy formaty: pięciodniowy test, jednodniowy mecz i trwający około trzech godzin T20. Ten ostatni, wprowadzony w 2003 roku, całkowicie zmienił oblicze dyscypliny.",category:"cricket",year:2003,emoji:"⚡"},{id:"cr3",text:"Anglia i Australia grają o „The Ashes” — maleńką urnę z prochami spalonego elementu wyposażenia. Trofeum powstało po żartobliwym nekrologu angielskiego krykieta z 1882 roku.",category:"cricket",year:1882,emoji:"⚱️"},{id:"cr4",text:"Don Bradman zakończył karierę ze średnią 99,94 punktu — wynikiem, do którego nikt się nawet nie zbliżył. W ostatnim występie potrzebował czterech punktów do okrągłej setki i nie zdobył żadnego.",category:"cricket",year:1948,emoji:"💯"},{id:"cr5",text:"Krykiet uchodzi za drugi najpopularniejszy sport świata — ma około 2,5 miliarda fanów, głównie w Indiach, Pakistanie, Bangladeszu i Australii.",category:"cricket",year:2020,emoji:"🌏"},{id:"cr6",text:"Piłka krykietowa jest twarda jak kamień i leci ponad 140 km/h. Hełmy dla pałkarzy weszły do użytku dopiero w latach 70. — wcześniej grano w zwykłych czapkach.",category:"cricket",year:1978,emoji:"🪖"},{id:"cr7",text:"Regulamin meczu testowego przewiduje przerwy na lunch i na podwieczorek. To jedyny sport, w którym pora herbaty jest formalnie zapisana w przepisach.",category:"cricket",year:1900,emoji:"☕"},{id:"cr8",text:"Boiska krykietowe są owalne, ale nie mają ustalonych wymiarów — każdy stadion jest inny. Stała jest tylko środkowa część, na której toczy się gra: prostokąt o długości około 20 metrów.",category:"cricket",year:1900,emoji:"📐"},{id:"af9",text:"RPA, Zimbabwe i Kenia to najsilniejsze krykietowe kraje Afryki. Reprezentacja RPA regularnie walczy o mistrzostwo świata, a krykiet jest tam drugim sportem po rugby.",category:"africa",year:2015,emoji:"🏏"},{id:"mo11",text:"Zawodnicy indyjskiej ligi krykieta są kupowani na aukcjach transmitowanych na żywo. Za jednego gracza kluby potrafią zapłacić kilkanaście milionów dolarów — za dwa miesiące gry.",category:"money",year:2024,emoji:"🔨"},{id:"ur1",text:"Skateboarding narodził się w Kalifornii jako „surfing na chodniku” — surferzy przybijali kółka do desek, żeby mieć zajęcie w bezwietrzne dni.",category:"urban",year:1960,emoji:"🌊"},{id:"ur2",text:"Wielka susza w Kalifornii w latach 70. kazała opróżnić prywatne baseny. Skaterzy wjechali w nie deskami i tak narodziła się jazda po pionowych ścianach, z której wyrosły dzisiejsze rampy.",category:"urban",year:1976,emoji:"🏊"},{id:"ur3",text:"Trik „ollie” — wybicie deski w powietrze bez użycia rąk — wymyślił nastolatek Alan Gelfand pod koniec lat 70. Bez niego nie istniałaby żadna nowoczesna jazda uliczna.",category:"urban",year:1978,emoji:"🛹"},{id:"ur4",text:"Skateboarding zadebiutował na igrzyskach w Tokio, a medale zdobywały tam trzynastolatki. Najmłodsze medalistki tych igrzysk pojechały prosto z podium na plac zabaw.",category:"urban",year:2021,emoji:"🥇"},{id:"ur5",text:"BMX freestyle również trafił do programu olimpijskiego w Tokio. Zawodnicy mają 60 sekund na pokaz trików na rowerze — oceniane są trudność, oryginalność i płynność jazdy.",category:"urban",year:2021,emoji:"🚲"},{id:"ur6",text:"Rucker Park w Harlemie to legendarne uliczne boisko koszykarskie. Latem grywały tam gwiazdy NBA, a widownia stała tuż przy linii bocznej, dosłownie na wyciągnięcie ręki.",category:"urban",year:1950,emoji:"🏀"},{id:"ur7",text:"Standardowa deska skateboardowa składa się z siedmiu warstw klonu sklejonych pod ciśnieniem. Taka konstrukcja daje sprężystość potrzebną do wybicia i wytrzymuje setki twardych lądowań.",category:"urban",year:1970,emoji:"🪵"},{id:"ur8",text:"Miasta budują dziś skateparki jako element polityki miejskiej — zauważono, że legalne miejsca do jazdy zmniejszają konflikty o place i schody w centrach.",category:"urban",year:2e3,emoji:"🏙️"},{id:"x9",text:"Zawody Red Bull Art of Motion odbywają się na dachach i uliczkach greckiej wyspy Santorini. Zawodnicy freerunningu skaczą tam nad przepaściami między białymi domami.",category:"extreme",year:2011,emoji:"🇬🇷"},{id:"cu13",text:"Gry wideo z serii Tony Hawk's Pro Skater wprowadziły skateboarding do popkultury i nauczyły całe pokolenie nazw trików, zanim jeszcze stanęło na desce.",category:"culture",year:1999,emoji:"🎮"},{id:"cm1",text:"Na igrzyskach w Tokio wspinaczka sportowa była jedną konkurencją łączącą trzy zupełnie różne dyscypliny — czas, bouldering i prowadzenie. Zawodnicy krytykowali ten format, porównując go do łączenia sprintu z maratonem.",category:"climbing",year:2021,emoji:"🧗"},{id:"cm2",text:"Bouldering to wspinaczka bez liny na wysokość kilku metrów, nad grubymi materacami. Kluczem nie jest wytrzymałość, lecz rozwiązanie ruchowej zagadki — dlatego drogi nazywa się tam „problemami”.",category:"climbing",year:1990,emoji:"🧩"},{id:"cm3",text:"Ścianka do wspinaczki na czas ma na całym świecie identyczny układ chwytów, zatwierdzony w 2007 roku. Dzięki temu można porównywać rekordy z różnych kontynentów co do setnych sekundy.",category:"climbing",year:2007,emoji:"⏱️"},{id:"cm4",text:"Najtrudniejsze drogi wspinaczkowe świata wycenia się dziś na 9c w skali francuskiej. Pokonanie takiej drogi zajmuje najlepszym wspinaczom całe miesiące prób.",category:"climbing",year:2017,emoji:"📈"},{id:"cm5",text:"Woreczek z magnezją to podstawowe wyposażenie wspinacza — proszek osusza dłonie. W niektórych halach jest zakazany w formie sypkiej, bo unoszący się pył utrudnia oddychanie.",category:"climbing",year:1980,emoji:"🤲"},{id:"cm6",text:"K2 zimą uchodziło za ostatni wielki problem himalaizmu. Szczyt zdobyła w 2021 roku dziesiątka Nepalczyków, którzy weszli na wierzchołek wspólnie, śpiewając hymn swojego kraju.",category:"climbing",year:2021,emoji:"🇳🇵"},{id:"cm7",text:"Zdjęcie kolejki wspinaczy w „strefie śmierci” powyżej 8000 metrów na Evereście obiegło świat w 2019 roku. Oczekiwanie na swoją kolej przy szczycie potrafi trwać godzinami.",category:"climbing",year:2019,emoji:"⛰️"},{id:"cm8",text:"„Free climbing” to wspinaczka, w której sprzęt służy tylko do asekuracji, a nie do wyciągania się w górę. Dopiero „free solo” oznacza wejście całkowicie bez liny.",category:"climbing",year:1990,emoji:"🪢"},{id:"p33",text:"Polska szkoła wspinaczki sportowej wychowała mistrzów świata w konkurencji na czas. Rekordowe przejścia piętnastometrowej ścianki liczy się dziś w setnych częściach sekundy.",category:"poland",year:2023,emoji:"🇵🇱"},{id:"x10",text:"Wspinaczka lodowa to osobna dyscyplina — zawodnicy pokonują zamarznięte wodospady i sztuczne konstrukcje z użyciem czekanów i raków. Puchar Świata rozgrywa się także w warunkach miejskich.",category:"extreme",year:2e3,emoji:"🧊"},{id:"uw1",text:"W konkurencji bezdechu statycznego zawodnik leży nieruchomo twarzą w wodzie. Najlepsi wytrzymują ponad jedenaście minut — dłużej niż trwa przerwa w meczu piłkarskim.",category:"underwater",year:2016,emoji:"⏳"},{id:"uw2",text:"Podwodny hokej, zwany „octopush”, rozgrywa się krążkiem na dnie basenu. Zawodnicy nurkują z płetwami i krótkimi kijami, wynurzając się tylko na oddech — mecz wygląda jak zmiana wart pod wodą.",category:"underwater",year:1954,emoji:"🏒"},{id:"uw3",text:"W rugby podwodnym gra się piłką wypełnioną słoną wodą, żeby tonęła. To jedyny zespołowy sport rozgrywany w trzech wymiarach — akcje toczą się także w pionie.",category:"underwater",year:1961,emoji:"🏉"},{id:"uw4",text:"W pływaniu z monopłetwą zawodnicy poruszają się falowym ruchem całego ciała, osiągając prędkości nieosiągalne dla klasycznych stylów. To najszybszy sposób poruszania się człowieka w wodzie o własnych siłach.",category:"underwater",year:1980,emoji:"🐬"},{id:"uw5",text:"Nurkowanie jaskiniowe uchodzi za jedną z najbardziej wymagających aktywności świata. Obowiązkowa lina prowadząca jest jedynym pewnym sposobem odnalezienia drogi powrotnej w zmąconej wodzie.",category:"underwater",year:1990,emoji:"🕳️"},{id:"uw6",text:"Egipska Blue Hole to jedno z najbardziej znanych miejsc nurkowych świata — i jedno z najniebezpieczniejszych. Kuszący podwodny tunel „Arch” leży znacznie głębiej, niż wydaje się z powierzchni.",category:"underwater",year:2e3,emoji:"🔵"},{id:"uw7",text:"Rekord głębokości nurkowania ze sprzętem przekracza 330 metrów. Samo zejście zajęło kilkanaście minut, a bezpieczne wynurzenie z dekompresją — kilkanaście godzin.",category:"underwater",year:2014,emoji:"📉"},{id:"uw8",text:"Podwodne fotografowanie i orientacja to również dyscypliny zawodnicze. W nurkowaniu orientacyjnym zawodnicy szukają celów pod wodą, korzystając wyłącznie z kompasu i licznika odległości.",category:"underwater",year:1970,emoji:"🧭"},{id:"s16",text:"Skoczkowie do wody z wysokich wież wchodzą do wody z prędkością około 55 km/h. Dlatego pod taflą pracują dysze wzburzające powierzchnię — miękka, spieniona woda amortyzuje uderzenie.",category:"water",year:2e3,emoji:"💦"},{id:"sci13",text:"Podczas nurkowania na bezdech płuca zmniejszają objętość kilkukrotnie pod wpływem ciśnienia. Organizm przekierowuje krew do klatki piersiowej, chroniąc je przed zapadnięciem.",category:"science",year:2005,emoji:"🫁"},{id:"fs1",text:"W większości zawodów wędkarskich obowiązuje zasada „złów i wypuść” — ryby wracają do wody zaraz po zważeniu. Punktuje się łączną masę połowu, a nie liczbę zabranych ryb.",category:"fishing",year:1990,emoji:"♻️"},{id:"fs2",text:"W USA połów okoni typu bass to zawodowy sport z milionowymi nagrodami i transmisjami telewizyjnymi. Najlepsi wędkarze są tam rozpoznawalni jak gwiazdy innych dyscyplin.",category:"fishing",year:1967,emoji:"🎣"},{id:"fs3",text:"Casting to konkurencja polegająca na rzucie na odległość i celność. Najlepsi zawodnicy potrafią posłać przynętę na dystans przekraczający sto metrów.",category:"fishing",year:1955,emoji:"🎯"},{id:"fs4",text:"Rekordy wędkarskie zatwierdza się według grubości użytej żyłki. Dzięki temu złowienie wielkiej ryby na cienkiej lince liczy się wyżej niż ten sam okaz na grubej.",category:"fishing",year:1939,emoji:"📏"},{id:"fs5",text:"Zawody spławikowe trwają zwykle pięć godzin, a zawodnicy stoją w wyznaczonych sektorach. Po sygnale końcowym waży się cały połów, po czym ryby wracają do wody.",category:"fishing",year:1957,emoji:"⚖️"},{id:"fs6",text:"Zawody podlodowe rozgrywa się na zamarzniętych jeziorach — zawodnicy wiercą własne otwory i przemieszczają się między nimi. Liczy się nie tylko technika, ale też umiejętność znalezienia ławicy.",category:"fishing",year:1970,emoji:"🧊"},{id:"fs7",text:"Big-game fishing spopularyzowała literatura — historia starego rybaka walczącego z marlinem uczyniła z tego sportu symbol wytrwałości. Walka z wielką rybą potrafi trwać wiele godzin.",category:"fishing",year:1952,emoji:"📖"},{id:"fs8",text:"Karpiarze spędzają nad wodą całe doby, śpiąc w namiotach obok wędek z sygnalizatorami. Złowione ryby, ważące nierzadko ponad dwadzieścia kilogramów, po zdjęciu wracają do stawu.",category:"fishing",year:1980,emoji:"⛺"},{id:"un9",text:"W kilku krajach rozgrywa się zawody w łowieniu ryb gołymi rękami w mętnej wodzie. Ta wywodząca się z ludowych tradycji konkurencja ma dziś własne regulaminy i mistrzostwa.",category:"unusual",year:1990,emoji:"🤲"},{id:"za9",text:"Sokolnictwo, choć nie jest klasycznym sportem, ma swoje zawody i wielowiekowe tradycje. W krajach Zatoki Perskiej najlepsze sokoły wyceniane są na setki tysięcy dolarów.",category:"animals",year:2e3,emoji:"🦅"},{id:"sb1",text:"Pierwowzorem snowboardu był „snurfer” z lat 60. — deska bez wiązań, z linką trzymaną w ręce dla równowagi. Wymyślono ją jako zabawkę dla dzieci.",category:"snowboard",year:1965,emoji:"🛷"},{id:"sb2",text:"Ściany olimpijskiego halfpipe'a mają blisko siedem metrów wysokości. Zawodnicy wylatują ponad krawędź na kolejne pięć metrów — czyli na wysokość dwupiętrowego budynku.",category:"snowboard",year:2010,emoji:"🌗"},{id:"sb3",text:"Shaun White, zwany „Latającym Pomidorem” od rudych włosów, zdobył trzy złote medale olimpijskie w halfpipie. Wcześniej był też zawodowym skaterem.",category:"snowboard",year:2018,emoji:"🍅"},{id:"sb4",text:"W konkurencji Big Air zawodnicy zjeżdżają z ogromnej skoczni i lądują po locie z wysokości kilkunastu metrów. Dyscyplina trafiła na igrzyska w 2018 roku.",category:"snowboard",year:2018,emoji:"🚀"},{id:"sb5",text:"Slopestyle to przejazd przez tor pełen poręczy, skrzyń i skoczni. Sędziowie oceniają nie tylko triki, ale też płynność i wykorzystanie całej trasy.",category:"snowboard",year:2014,emoji:"🎢"},{id:"sb6",text:"Nazwy trików opisują dokładnie liczbę obrotów i przewrotów — „backside 1440” oznacza cztery pełne obroty w powietrzu. Zawodnicy uczą się ich najpierw nad basenem lub na trampolinie.",category:"snowboard",year:2015,emoji:"🔄"},{id:"sb7",text:"W snowboardcrossie czterech zawodników jednocześnie pokonuje tor z hopkami i wirażami. Kontakt jest nieunikniony, a kolejność potrafi zmienić się na ostatnim skoku.",category:"snowboard",year:2006,emoji:"💨"},{id:"sb8",text:"Narciarska jazda po muldach łączy slalom między garbami z dwoma skokami akrobatycznymi. Ocenia się technikę, wysokość skoków i czas przejazdu jednocześnie.",category:"snowboard",year:1992,emoji:"⛷️"},{id:"w26",text:"W akrobacjach narciarskich zawodnicy wybijają się z kilkumetrowej skoczni i wykonują nawet trzy salta z kilkoma śrubami. Latem trenują te ewolucje, lądując do basenu.",category:"winter",year:1994,emoji:"🤸"},{id:"cu14",text:"X Games, stworzone w 1995 roku, dały sportom ekstremalnym własną wielką imprezę i telewizyjną scenę. To tam wypromowano gwiazdy skateboardingu, BMX-u i snowboardu.",category:"culture",year:1995,emoji:"❌"},{id:"rw1",text:"Wioślarze siedzą tyłem do kierunku płynięcia i nie widzą mety. Jedyną osobą patrzącą do przodu jest sternik, który steruje łodzią i wykrzykuje tempo przez mikrofon.",category:"rowing",year:1900,emoji:"🔙"},{id:"rw2",text:"Sternik musi ważyć nie mniej niż określony limit — jeśli jest lżejszy, do łodzi dokłada się balast. Bez tego drużyny wybierałyby do sterowania jak najmniejsze osoby.",category:"rowing",year:1980,emoji:"⚖️"},{id:"rw3",text:"Ósemka to najszybsza łódź wioślarska — dystans 2000 metrów pokonuje w czasie około pięciu i pół minuty, płynąc z prędkością ponad 20 km/h.",category:"rowing",year:2017,emoji:"⚡"},{id:"rw4",text:"Wyścig wioślarski na 2000 metrów uchodzi za jeden z najbardziej wyczerpujących wysiłków w sporcie. Zawodnicy po przekroczeniu mety często nie są w stanie samodzielnie wyjść z łodzi.",category:"rowing",year:2e3,emoji:"😵"},{id:"rw5",text:"W kajakarstwie górskim zawodnicy pokonują rwącą wodę, przepływając przez zawieszone bramki. Zielone bierze się z prądem, a czerwone trzeba pokonać płynąc pod prąd.",category:"rowing",year:1972,emoji:"🚦"},{id:"rw6",text:"Różnica między kajakiem a kanadyjką jest prosta: w kajaku siedzi się z wiosłem dwupiórowym, a w kanadyjce klęczy na jednym kolanie i wiosłuje jednym piórem.",category:"rowing",year:1936,emoji:"🛶"},{id:"rw7",text:"Polskie kajakarstwo od dekad przywozi medale olimpijskie — reprezentanci zdobywali je zarówno w kajakach, jak i kanadyjkach, na dystansach sprinterskich.",category:"rowing",year:2021,emoji:"🇵🇱"},{id:"rw8",text:"Zawody rozgrywa się także na ergometrach wioślarskich w halach. Mistrzostwa świata na maszynach przyciągają zarówno olimpijczyków, jak i amatorów rywalizujących w kategoriach wiekowych.",category:"rowing",year:2018,emoji:"🏋️"},{id:"s17",text:"Regaty smoczych łodzi wywodzą się z chińskiej tradycji sprzed ponad dwóch tysięcy lat. Na dziobie łodzi siedzi bębniarz, który wybija rytm dla nawet dwudziestu wioślarzy.",category:"water",year:1976,emoji:"🐉"},{id:"am11",text:"Wioślarskie regaty Oxford–Cambridge oglądają nad Tamizą setki tysięcy widzów, choć startują w nich wyłącznie studenci. To jedno z niewielu wydarzeń, gdzie amatorzy przyciągają telewizyjne kamery z całego świata.",category:"amateur",year:1829,emoji:"🎓"},{id:"dn1",text:"Breaking zadebiutował na igrzyskach w Paryżu 2024 jako pierwszy taniec w programie olimpijskim. W Los Angeles 2028 już go nie będzie — organizatorzy wybrali inne dyscypliny.",category:"dance",year:2024,emoji:"🕺"},{id:"dn2",text:"W tańcu towarzyskim rywalizuje się w dwóch stylach po pięć tańców: standardowym i latynoamerykańskim. Pary zdobywają klasy taneczne od E do najwyższej S.",category:"dance",year:1930,emoji:"💃"},{id:"dn3",text:"W battle'u breakingowym DJ nie zapowiada utworu — tancerze muszą improwizować do nieznanej wcześniej muzyki. Sędziowie oceniają technikę, muzykalność i oryginalność.",category:"dance",year:2018,emoji:"🎧"},{id:"dn4",text:"Cheerleading został tymczasowo uznany przez MKOl za sport w 2016 roku. Jego akrobatyczna odmiana wymaga umiejętności porównywalnych z gimnastyką sportową.",category:"dance",year:2016,emoji:"📣"},{id:"dn5",text:"W tańcu na lodzie obowiązują ścisłe przepisy — między innymi zakaz podnoszenia partnerki powyżej ramion. To właśnie odróżnia tę konkurencję od par sportowych.",category:"dance",year:1976,emoji:"⛸️"},{id:"dn6",text:"Akrobatyczny rock and roll to dyscyplina z własnymi mistrzostwami świata. Pary wykonują w nim rzuty i salta, utrzymując przy tym stałe, bardzo szybkie tempo kroków.",category:"dance",year:1974,emoji:"🎸"},{id:"dn7",text:"Polskie pary taneczne zdobywały medale mistrzostw świata i Europy, a kraj wychował wielu sędziów międzynarodowych. Turnieje tańca towarzyskiego gromadzą u nas tysiące par rocznie.",category:"dance",year:2010,emoji:"🇵🇱"},{id:"dn8",text:"W cheerleadingu buduje się piramidy z kilku poziomów zawodniczek. To właśnie upadki z takich konstrukcji odpowiadają za większość poważnych kontuzji w amerykańskim sporcie szkolnym.",category:"dance",year:2010,emoji:"🔺"},{id:"g10",text:"Gimnastyka artystyczna łączy taniec z przyborami — wstążką, obręczą, piłką, maczugami i skakanką. Zawodniczki muszą utrzymać przybór w nieustannym ruchu przez cały układ.",category:"gymnastics",year:1984,emoji:"🎀"},{id:"cu15",text:"Filmy i seriale o tańcu — od „Flashdance” po „Step Up” — zbudowały masową popularność tańca ulicznego. Dzięki nim szkoły tańca notowały skokowe wzrosty zapisów.",category:"culture",year:1983,emoji:"🎬"},{id:"av1",text:"Szybownicy pokonują ponad tysiąc kilometrów bez silnika, korzystając z prądów wznoszących i fal górskich. Lot trwa wtedy cały dzień — od porannego startu po lądowanie o zmroku.",category:"aviation",year:2003,emoji:"🛩️"},{id:"av2",text:"Polska szkoła szybownictwa należy do najlepszych na świecie — Góra Żar i Leszno wychowały mistrzów świata, a polscy konstruktorzy projektowali szybowce używane w wielu krajach.",category:"aviation",year:1958,emoji:"🇵🇱"},{id:"av3",text:"Podczas akrobacji samolotowej pilot znosi przeciążenia sięgające 10 G. Aby nie stracić przytomności, napina mięśnie nóg i brzucha specjalną techniką oddechową.",category:"aviation",year:1960,emoji:"🌀"},{id:"av4",text:"W wyścigach Red Bull Air Race piloci przelatywali między nadmuchiwanymi pylonami na wysokości kilkunastu metrów, pędząc ponad 370 km/h. Zbyt mocne przeciążenie oznaczało karę.",category:"aviation",year:2003,emoji:"🏁"},{id:"av5",text:"W zawodach Red Bull X-Alps zawodnicy przemierzają Alpy, na przemian lecąc na paralotni i idąc pieszo. Trasa liczy ponad tysiąc kilometrów, a zwycięzcy zajmuje to około dwóch tygodni.",category:"aviation",year:2003,emoji:"🏔️"},{id:"av6",text:"W skokach spadochronowych na celność liczy się trafienie piętą w elektroniczny znacznik o średnicy dwóch centymetrów. Najlepsi trafiają w niego seriami.",category:"aviation",year:1980,emoji:"🎯"},{id:"av7",text:"Kombinezon wingsuit zamienia człowieka w skrzydło — pozwala przelecieć trzy metry w poziomie na każdy metr opadania. Prędkość lotu przekracza 200 km/h.",category:"aviation",year:1999,emoji:"🦇"},{id:"av8",text:"Zawody balonowe Gordon Bennett odbywają się od 1906 roku i są najstarszymi zawodami lotniczymi świata. Wygrywa ten, kto doleci najdalej — loty trwają nawet kilka dób.",category:"aviation",year:1906,emoji:"🎈"},{id:"sp9",text:"Najszybsze samoloty akrobacyjne rozpędzają się do ponad 400 km/h, a ich piloci wykonują manewry w przestrzeni wielkości boiska. Precyzję ocenia sędziowski panel z ziemi.",category:"speed",year:2010,emoji:"✈️"},{id:"hf9",text:"Muzea lotnictwa sportowego przechowują szybowce i samoloty rekordzistów. W Polsce największą taką kolekcję zgromadzono w Krakowie, na terenie dawnego lotniska Rakowice-Czyżyny.",category:"halls",year:1964,emoji:"🏛️"},{id:"nd1",text:"W biegach narciarskich obowiązują dwie techniki: klasyczna, w wyciętych torach, i łyżwowa, przypominająca jazdę na łyżwach. Ta druga upowszechniła się dopiero w latach 80. i wywołała gorący spór, bo niszczyła klasyczne ślady.",category:"nordic",year:1985,emoji:"🎿"},{id:"nd2",text:"Serwis techniczny testuje przed startem kilkadziesiąt kombinacji smarów, dobierając je do temperatury i wilgotności śniegu. Zły wybór potrafi przekreślić szanse najlepszego zawodnika.",category:"nordic",year:2010,emoji:"🧪"},{id:"nd3",text:"Od 2021 roku zakazano smarów z fluorem — były skuteczne, ale szkodliwe dla zdrowia serwisantów i środowiska. Na zawodach sprawdza się narty specjalnymi skanerami.",category:"nordic",year:2021,emoji:"🚫"},{id:"nd4",text:"Tour de Ski kończy się morderczym wbiegiem na stok Alpe Cermis o nachyleniu dochodzącym do 28 procent. Zawodnicy pokonują go już po kilku dniach ścigania.",category:"nordic",year:2007,emoji:"⛰️"},{id:"nd5",text:"W biathlonie strzela się z odległości 50 metrów: leżąc do tarczy wielkości spodka od filiżanki, a stojąc — do nieco większej. Każde pudło oznacza karną rundę lub doliczoną minutę.",category:"nordic",year:1978,emoji:"🎯"},{id:"nd6",text:"W skiathlonie zawodnicy zmieniają narty w trakcie biegu — pierwszą część pokonują techniką klasyczną, drugą łyżwową. Strefa zmiany bywa miejscem kluczowych roszad w czołówce.",category:"nordic",year:2003,emoji:"🔄"},{id:"nd7",text:"Bieg na 50 kilometrów nazywany jest „królewskim dystansem”. Od 2022 roku kobiety rywalizują na tych samych dystansach co mężczyźni — wcześniej ich najdłuższy bieg liczył 30 km.",category:"nordic",year:2022,emoji:"👑"},{id:"nd8",text:"Coraz więcej zawodów rozgrywa się na śniegu magazynowanym pod warstwą trocin od poprzedniej zimy. Ta metoda, zwana snow farmingiem, ratuje kalendarz w ciepłe listopady.",category:"nordic",year:2015,emoji:"❄️"},{id:"w27",text:"Kombinacja norweska łączy skoki narciarskie z biegiem — punkty ze skoczni przelicza się na sekundy straty na starcie biegu. Kto skacze najdalej, rusza pierwszy.",category:"winter",year:1924,emoji:"➕"},{id:"sci14",text:"Biegacze narciarscy mają jedne z najwyższych zmierzonych pułapów tlenowych wśród wszystkich sportowców. Ich dyscyplina angażuje jednocześnie mięśnie nóg, rąk i tułowia.",category:"science",year:2e3,emoji:"🫀"},{id:"tp1",text:"Puchar Stanleya składa się z pierścieni z nazwiskami mistrzów. Gdy zabraknie miejsca, najstarszy pierścień trafia do muzeum, a na jego miejsce zakłada się nowy.",category:"trophies",year:1958,emoji:"💍"},{id:"tp2",text:"Puchar Ligi Mistrzów, zwany „wielkouchym”, wraca co roku do UEFA. Kluby z pięcioma triumfami dostają jednak własną kopię i prawo do noszenia specjalnej odznaki na koszulkach.",category:"trophies",year:1967,emoji:"👂"},{id:"tp3",text:"Heisman Trophy dla najlepszego zawodnika futbolu akademickiego przedstawia gracza odpychającego rywala wyciągniętą ręką. To jedna z najbardziej rozpoznawalnych statuetek w USA.",category:"trophies",year:1935,emoji:"🗽"},{id:"tp4",text:"Mistrz NBA dostaje trofeum na własność — co roku odlewa się nową kopię. W innych ligach puchar krąży między zwycięzcami i wraca do organizatora.",category:"trophies",year:1977,emoji:"🏀"},{id:"tp5",text:"W amerykańskich ligach ważniejszy od pucharu bywa pierścień mistrzowski. Współczesne egzemplarze wysadza się setkami diamentów, a ich wartość liczy się w dziesiątkach tysięcy dolarów.",category:"trophies",year:2e3,emoji:"💎"},{id:"tp6",text:"Na trofeum Indianapolis 500 umieszcza się srebrne odlewy twarzy wszystkich zwycięzców. Puchar jest tak cenny, że nie opuszcza muzeum — zwycięzca dostaje miniaturę.",category:"trophies",year:1936,emoji:"🗿"},{id:"tp7",text:"Zwyciężczyni Wimbledonu otrzymuje srebrną tacę zdobioną mitologicznymi postaciami, a nie klasyczny puchar. Mężczyźni dostają złocony puchar z ananasem na szczycie.",category:"trophies",year:1886,emoji:"🍽️"},{id:"tp8",text:"Dawniej trofea zdobywano na własność po trzech zwycięstwach z rzędu. Ta zasada zniknęła, gdy organizatorzy zorientowali się, że tracą swoje najcenniejsze puchary.",category:"trophies",year:1970,emoji:"3️⃣"},{id:"hk14",text:"Każdy hokeista mistrzowskiej drużyny spędza z Pucharem Stanleya jeden dzień, gdzie tylko zechce. Trofeum bywało w kościołach, na szczytach gór i w basenach — zawsze pod okiem opiekuna.",category:"hockey",year:1995,emoji:"🌍"},{id:"ce12",text:"Wręczanie pucharu poprzedza często wciągnięcie kapitana na ramiona kolegów. Ten obrazek — uniesione trofeum wśród konfetti — jest dziś reżyserowany co do sekundy przez realizatorów transmisji.",category:"ceremonies",year:2e3,emoji:"🎊"},{id:"of1",text:"Międzynarodowy Komitet Olimpijski powstał w 1894 roku w Paryżu z inicjatywy Pierre'a de Coubertina. Liczy około stu członków, którzy formalnie reprezentują MKOl w swoich krajach, a nie odwrotnie.",category:"officials",year:1894,emoji:"🏛️"},{id:"of2",text:"FIFA ma dziś 211 federacji członkowskich — więcej, niż ONZ ma państw członkowskich. Wynika to z osobnego członkostwa terytoriów takich jak Wyspy Owcze czy Gibraltar.",category:"officials",year:2016,emoji:"🌐"},{id:"of3",text:"W 2015 roku szwajcarska policja zatrzymała działaczy FIFA w luksusowym hotelu w Zurychu na wniosek amerykańskiego wymiaru sprawiedliwości. Śledztwo ujawniło system łapówek wart setki milionów dolarów.",category:"officials",year:2015,emoji:"🚔"},{id:"of4",text:"Po skandalu z przyznaniem igrzysk Salt Lake City MKOl zakazał członkom odwiedzania miast kandydujących. Wcześniej takie wizyty bywały okazją do wręczania kosztownych prezentów.",category:"officials",year:1999,emoji:"🎁"},{id:"of5",text:"Juan Antonio Samaranch przekształcił igrzyska w globalny produkt medialny, wprowadzając program stałych sponsorów. Dzięki temu MKOl przestał zależeć wyłącznie od pieniędzy gospodarzy.",category:"officials",year:1985,emoji:"💼"},{id:"of6",text:"Trybunał Arbitrażowy do spraw Sportu w Lozannie rozstrzyga spory dopingowe i transferowe z całego świata. Podczas igrzysk działa jego doraźny oddział, orzekający w ciągu doby.",category:"officials",year:1984,emoji:"⚖️"},{id:"of7",text:"Za przepisy każdej dyscypliny odpowiada osobna federacja międzynarodowa. To one, a nie MKOl, decydują o zmianach zasad gry, kalendarzu i formacie mistrzostw świata.",category:"officials",year:1900,emoji:"📋"},{id:"of8",text:"Mundial rozrósł się z 16 do 48 drużyn w ciągu kilku dekad. Każde rozszerzenie oznaczało więcej meczów, więcej praw telewizyjnych i głośne spory o poziom sportowy turnieju.",category:"officials",year:2026,emoji:"📈"},{id:"sc11",text:"Wybory gospodarzy wielkich imprez wielokrotnie budziły podejrzenia o korupcję. Po serii afer organizacje przeszły na bardziej przejrzyste procedury z udziałem niezależnych komisji.",category:"scandals",year:2010,emoji:"🗳️"},{id:"pol9",text:"Kraje rywalizują o organizację igrzysk także z powodów wizerunkowych. Bywa jednak odwrotnie — mieszkańcy kilku miast odrzucili kandydatury w referendach, obawiając się kosztów.",category:"politics",year:2015,emoji:"🗳️"},{id:"tf1",text:"Wyrok Trybunału Sprawiedliwości w sprawie Jean-Marca Bosmana z 1995 roku pozwolił piłkarzom odchodzić za darmo po wygaśnięciu kontraktu. To najważniejsza zmiana w historii rynku transferowego.",category:"transfers",year:1995,emoji:"⚖️"},{id:"tf2",text:"Okna transferowe wprowadzono w Europie w 2002 roku po porozumieniu z Komisją Europejską. Wcześniej kluby mogły kupować zawodników niemal przez cały sezon.",category:"transfers",year:2002,emoji:"🪟"},{id:"tf3",text:"W Hiszpanii każdy kontrakt piłkarski musi zawierać klauzulę odstępnego. To dlatego kwoty w tamtejszych umowach bywają absurdalnie wysokie — mają odstraszać kupujących.",category:"transfers",year:1985,emoji:"🇪🇸"},{id:"tf4",text:"Ostatni dzień okna transferowego, zwany „deadline day”, to osobne widowisko medialne. Umowy dopina się dosłownie na minuty przed północą, wysyłając dokumenty faksem lub mailem.",category:"transfers",year:2010,emoji:"⏰"},{id:"tf5",text:"FIFA ograniczyła liczbę zawodników, których klub może jednocześnie wypożyczyć. Wcześniej największe kluby utrzymywały dziesiątki graczy rozsianych po całym świecie.",category:"transfers",year:2022,emoji:"🔁"},{id:"tf6",text:"W amerykańskich ligach zawodników rozdziela draft — najsłabsze drużyny wybierają pierwsze. W NBA o kolejności decyduje dodatkowo loteria, żeby kluby nie przegrywały celowo.",category:"transfers",year:1985,emoji:"🎲"},{id:"tf7",text:"Ligi w USA stosują limit wydatków na płace, którego nie wolno przekroczyć. W Europie odpowiednikiem są przepisy finansowego fair play, wiążące wydatki z przychodami klubu.",category:"transfers",year:2011,emoji:"💰"},{id:"tf8",text:"Niektóre kontrakty zawierają klauzulę zakazującą wymiany zawodnika bez jego zgody. Gwiazdy negocjują też prawo do wykupu ostatniego roku umowy i odejścia na własnych warunkach.",category:"transfers",year:2e3,emoji:"✍️"},{id:"mo12",text:"Agenci piłkarscy inkasują prowizje sięgające kilku procent wartości transferu. Przy największych umowach oznacza to zarobek liczony w milionach za doprowadzenie do jednej transakcji.",category:"money",year:2019,emoji:"🤝"},{id:"f41",text:"Kluby zarabiają na tak zwanych mechanizmach solidarnościowych — część każdego transferu trafia do drużyn, które szkoliły zawodnika jako nastolatka. Dla małych klubów bywa to główne źródło dochodu.",category:"football",year:2001,emoji:"🌱"},{id:"ca1",text:"Słowo „olimpiada” oznacza w rzeczywistości czteroletni okres między igrzyskami, a nie same zawody. Starożytni Grecy używali olimpiad jako jednostki rachuby czasu.",category:"calendar",year:776,emoji:"🗓️"},{id:"ca2",text:"Cztery turnieje wielkoszlemowe rozgrywa się na trzech różnych nawierzchniach: twardej, ziemnej i trawiastej. Zawodnicy muszą w ciągu jednego sezonu przestawiać się na zupełnie inny styl gry.",category:"calendar",year:1988,emoji:"🎾"},{id:"ca3",text:"Zimowy Puchar Świata to cykl kilkudziesięciu zawodów od listopada do marca. Za każdy start przyznaje się punkty, a zwycięzca klasyfikacji generalnej odbiera Kryształową Kulę.",category:"calendar",year:1967,emoji:"🔮"},{id:"ca4",text:"Kalendarz Formuły 1 rozrósł się z kilku wyścigów w latach 50. do ponad dwudziestu rund na pięciu kontynentach. Zespoły spędzają w podróży większą część roku.",category:"calendar",year:2023,emoji:"✈️"},{id:"ca5",text:"FIFA wyznacza okienka reprezentacyjne, w których kluby muszą zwolnić zawodników do kadr. Piłkarze z odległych krajów potrafią w takim tygodniu przelecieć kilkanaście tysięcy kilometrów.",category:"calendar",year:2e3,emoji:"🌍"},{id:"ca6",text:"Ligi skandynawskie grają wiosną i latem, bo zimą jest zbyt zimno. Dlatego ich sezon nie pokrywa się z resztą Europy, co komplikuje transfery i puchary.",category:"calendar",year:1990,emoji:"❄️"},{id:"ca7",text:"Mistrzostwa Europy w piłce nożnej rozgrywa się co cztery lata, w połowie cyklu między mundialami. Dzięki temu kibice mają wielki turniej co dwa lata.",category:"calendar",year:1960,emoji:"🔄"},{id:"ca8",text:"Sezon w Bundeslidze przerywa długa pauza zimowa, a w Anglii gra się nieprzerwanie przez święta. Ten kontrast to jedna z najstarszych różnic kulturowych w europejskim futbolu.",category:"calendar",year:1963,emoji:"🎄"},{id:"ca9",text:"Mundial w Katarze przeniesiono na listopad i grudzień z powodu upałów. Europejskie ligi musiały zrobić w środku sezonu bezprecedensową, sześciotygodniową przerwę.",category:"calendar",year:2022,emoji:"🌡️"},{id:"ca10",text:"Terminarze wielkich lig układają dziś algorytmy, uwzględniające podróże, transmisje i bezpieczeństwo. Sam kalendarz jednej ligi to problem obliczeniowy z milionami możliwych rozwiązań.",category:"calendar",year:2010,emoji:"🧮"},{id:"ic1",text:"W short tracku kilku zawodników ściga się jednocześnie na ciasnym owalu. Kontakt i upadki są nieuniknione, a o medalu decyduje często ostatni wiraż.",category:"ice",year:1992,emoji:"💨"},{id:"ic2",text:"Szczotkowanie lodu w curlingu nie jest teatrem — tarcie podgrzewa powierzchnię i zmienia tor kamienia nawet o kilka metrów. Dobrzy „sweeperzy” są równie ważni jak rzucający.",category:"ice",year:1998,emoji:"🧹"},{id:"ic3",text:"Lód curlingowy spryskuje się kropelkami wody, które zamarzają w drobne wypustki. Kamień ślizga się po ich czubkach, dzięki czemu w ogóle może się kręcić i zakrzywiać tor.",category:"ice",year:1950,emoji:"💧"},{id:"ic4",text:"Na torze panczenowym zawodnicy jadą parami i obowiązkowo zmieniają się torami na prostej. Bez tej zasady jeden z nich miałby do pokonania dłuższy dystans.",category:"ice",year:1900,emoji:"🔀"},{id:"ic5",text:"Po skandalu sędziowskim z 2002 roku łyżwiarstwo figurowe porzuciło noty od 0 do 6. Dziś każdy element ma swoją wartość bazową, do której sędziowie dodają lub odejmują punkty za jakość.",category:"ice",year:2004,emoji:"🔢"},{id:"ic6",text:"Axel to jedyny skok figurowy wykonywany z wyjściem przodem, dlatego zawiera dodatkowe pół obrotu. Potrójny axel to w praktyce trzy i pół obrotu w powietrzu.",category:"ice",year:1882,emoji:"🌀"},{id:"ic7",text:"Bandy przypomina hokej, ale gra się w nie piłką na lodowisku wielkości boiska piłkarskiego, po jedenastu zawodników w drużynie. W Rosji i Skandynawii ma status sportu narodowego.",category:"ice",year:1898,emoji:"🏑"},{id:"ic8",text:"Utrzymanie tafli w hali to inżynieryjna łamigłówka: lód musi mieć około minus pięciu stopni, a widzowie kilkanaście na plusie. Nad taflą stale pracują osuszacze powietrza.",category:"ice",year:1980,emoji:"🌡️"},{id:"w28",text:"Łyżwy do panczenów mają odczepianą piętę, a do figurówki — ząbki z przodu, służące do wybicia. To dwa zupełnie różne narzędzia, mimo podobnego wyglądu.",category:"winter",year:1900,emoji:"⛸️"},{id:"pg25",text:"Polscy panczeniści zdobywali medale olimpijskie zarówno indywidualnie, jak i w biegu drużynowym. Tor w Zakopanem i hala w Tomaszowie Mazowieckim wychowały kolejne pokolenia zawodników.",category:"polandgames",year:2018,emoji:"🇵🇱"},{id:"sf1",text:"Podczas Euro 2020 Christian Eriksen doznał zatrzymania krążenia na boisku i został uratowany dzięki natychmiastowej reanimacji oraz defibrylatorowi. Po tym zdarzeniu wiele federacji zaostrzyło wymogi dotyczące sprzętu ratunkowego.",category:"safety",year:2021,emoji:"❤️‍🩹"},{id:"sf2",text:"W rugby obowiązuje protokół oceny wstrząśnienia mózgu — zawodnik podejrzany o uraz głowy musi natychmiast zejść z boiska na badanie. Bez zgody lekarza nie wraca do gry.",category:"safety",year:2012,emoji:"🧠"},{id:"sf3",text:"W kilku krajach zakazano główkowania piłki przez najmłodszych zawodników. Badania nad byłymi piłkarzami wykazały zwiększone ryzyko chorób neurologicznych w późniejszym wieku.",category:"safety",year:2020,emoji:"🚸"},{id:"sf4",text:"Kaski w hokeju NHL stały się obowiązkowe w 1979 roku, ale zawodnicy z wcześniejszymi kontraktami mogli grać bez nich. Ostatni golił głowę na lodzie jeszcze przez kilkanaście lat.",category:"safety",year:1979,emoji:"🪖"},{id:"sf5",text:"Na torach wyścigowych stosuje się bariery pochłaniające energię — zbudowane z warstw pianki i stali, które odkształcają się przy uderzeniu zamiast odbijać samochód z powrotem na tor.",category:"safety",year:2002,emoji:"🚧"},{id:"sf6",text:"We Włoszech od dziesięcioleci obowiązują szczegółowe badania kardiologiczne dla sportowców. Program ten wykrył setki wad serca i uznawany jest za wzór profilaktyki nagłych zgonów.",category:"safety",year:1982,emoji:"🩺"},{id:"sf7",text:"Po tragediach na stadionach zlikwidowano klatki i płoty oddzielające trybuny od boiska. Dziś bezpieczeństwo zapewnia się przez numerowane miejsca, monitoring i szerokie drogi ewakuacyjne.",category:"safety",year:1990,emoji:"🚪"},{id:"sf8",text:"W boksie zawodowym lekarz może przerwać walkę w każdej chwili, a po nokaucie obowiązuje przymusowa przerwa od walk i treningów sparingowych — zwykle kilkutygodniowa.",category:"safety",year:1985,emoji:"🥊"},{id:"sci15",text:"Powtarzające się mikrourazy głowy mogą prowadzić do przewlekłej encefalopatii pourazowej. Badania nad mózgami byłych zawodników futbolu amerykańskiego zmieniły podejście do bezpieczeństwa w całym sporcie.",category:"science",year:2005,emoji:"🔬"},{id:"gear9",text:"Nowoczesne kaski rowerowe i narciarskie mają wkładki obracające się o kilka milimetrów przy uderzeniu. Ta technologia ma ograniczać siły rotacyjne, najgroźniejsze dla mózgu.",category:"gear",year:2015,emoji:"⛑️"},{id:"ec1",text:"Angielski klub Forest Green Rovers uznano za pierwszy na świecie klub piłkarski neutralny klimatycznie. Serwuje wyłącznie wegańskie jedzenie, a murawę utrzymuje bez pestycydów.",category:"ecology",year:2018,emoji:"🌿"},{id:"ec2",text:"Stadion 974 w Katarze zbudowano z kontenerów transportowych i stalowych modułów. Po mundialu rozebrano go w całości — miał być dowodem, że wielkie obiekty nie muszą stać pusto po turnieju.",category:"ecology",year:2022,emoji:"📦"},{id:"ec3",text:"Organizatorzy igrzysk w Paryżu postawili na obiekty już istniejące lub tymczasowe — nowych aren zbudowano minimalną liczbę. Celem było zmniejszenie śladu węglowego o połowę.",category:"ecology",year:2024,emoji:"♻️"},{id:"ec4",text:"Ośrodki narciarskie magazynują śnieg pod grubą warstwą trocin, by przetrwał lato. Ta metoda pozwala rozpocząć sezon nawet wtedy, gdy listopad jest wyjątkowo ciepły.",category:"ecology",year:2010,emoji:"🏔️"},{id:"ec5",text:"W kolarstwie obowiązują strefy, w których wolno wyrzucać bidony i opakowania. Poza nimi grożą kary finansowe i punkty ujemne — śmieci w rowach psuły wizerunek dyscypliny.",category:"ecology",year:2021,emoji:"🗑️"},{id:"ec6",text:"Granulat gumowy z boisk ze sztuczną trawą to jedno z większych źródeł mikroplastiku w Europie. Unia Europejska zdecydowała o stopniowym wycofaniu tego typu wypełnienia.",category:"ecology",year:2023,emoji:"🟩"},{id:"ec7",text:"Formuła 1 zapowiedziała neutralność klimatyczną i przechodzi na paliwa syntetyczne. Największym problemem nie są jednak silniki, lecz transport sprzętu między kontynentami.",category:"ecology",year:2030,emoji:"⚗️"},{id:"ec8",text:"Nowoczesne stadiony zbierają deszczówkę do podlewania murawy i produkują prąd z paneli na dachu. Niektóre obiekty oddają nadwyżkę energii do miejskiej sieci.",category:"ecology",year:2015,emoji:"🔋"},{id:"sd14",text:"Murawy na wielkich stadionach doświetla się lampami na wózkach, bo dachy odcinają światło słoneczne. Bez tego trawa w cieniu po prostu nie rośnie.",category:"stadiums",year:2005,emoji:"💡"},{id:"we10",text:"Coraz cieplejsze zimy zmuszają organizatorów zawodów narciarskich do przenoszenia konkursów wyżej w góry. Część historycznych ośrodków w niższych partiach straciła szansę na Puchar Świata.",category:"weather",year:2020,emoji:"🌡️"},{id:"prl1",text:"Wyścig Pokoju, jadący trasą Warszawa–Berlin–Praga, był największą imprezą kolarską bloku wschodniego. Przy trasach stały miliony ludzi, a zwycięzcy zyskiwali sławę porównywalną z gwiazdami filmowymi.",category:"prl",year:1952,emoji:"🚴"},{id:"prl2",text:"Kluby w PRL przypisane były do resortów i zakładów pracy: Legia do wojska, Gwardia do MSW, Górnik do kopalń, a Stal do hut. Ta struktura ukształtowała mapę polskiego sportu na dekady.",category:"prl",year:1950,emoji:"🏭"},{id:"prl3",text:"Formalnie w PRL nie istniał sport zawodowy — zawodnicy byli „zatrudniani” w zakładach pracy, do których często nigdy nie zaglądali. Dzięki tej fikcji mogli startować w igrzyskach jako amatorzy.",category:"prl",year:1960,emoji:"📄"},{id:"prl4",text:"Przed mundialem 1974 sklepy odnotowały skokowy wzrost sprzedaży telewizorów. Transmisje z Niemiec oglądano zbiorowo — w świetlicach, klubach zakładowych i u sąsiadów.",category:"prl",year:1974,emoji:"📺"},{id:"prl5",text:"Wyjazdy na zawody wiązały się z reglamentowanymi paszportami i opieką funkcjonariuszy. Zdarzały się ucieczki sportowców, którzy zostawali za granicą po zakończeniu turnieju.",category:"prl",year:1980,emoji:"🛂"},{id:"prl6",text:"Sport finansowano między innymi z gier liczbowych — część wpływów z Toto-Lotka trafiała do klubów i na budowę obiektów. Stąd wzięło się wiele osiedlowych boisk i basenów.",category:"prl",year:1956,emoji:"🎰"},{id:"prl7",text:"Spartakiady i masowe imprezy młodzieżowe gromadziły dziesiątki tysięcy uczestników. Miały wyławiać talenty, ale przede wszystkim pokazywać masowość socjalistycznego sportu.",category:"prl",year:1955,emoji:"🎽"},{id:"prl8",text:"Zakłady pracy budowały przy fabrykach stadiony, hale i pływalnie. Znaczna część tej infrastruktury służy do dziś — często pod zmienionymi nazwami i z nowymi właścicielami.",category:"prl",year:1970,emoji:"🏟️"},{id:"prl9",text:"Relacje radiowe z wielkich imprez miały w PRL status wydarzeń rodzinnych. Przy odbiornikach zbierały się całe kamienice, a komentatorzy stawali się postaciami rozpoznawalnymi po samym głosie.",category:"prl",year:1960,emoji:"📻"},{id:"prl10",text:"Prasa sportowa w PRL miała ogromne nakłady — „Przegląd Sportowy” i „Sport” czytano od deski do deski, a kolejki po gazetę po ważnych meczach ustawiały się od rana.",category:"prl",year:1970,emoji:"📰"},{id:"ga1",text:"Igrzyska Wspólnoty Narodów rozgrywane są od 1930 roku dla krajów dawnego imperium brytyjskiego. To druga po olimpiadzie najstarsza wielodyscyplinowa impreza tej skali.",category:"games",year:1930,emoji:"👑"},{id:"ga2",text:"Igrzyska Europejskie odbywają się od 2015 roku, a ich trzecia edycja przypadła Krakowowi i Małopolsce. Dla wielu dyscyplin są jednocześnie mistrzostwami kontynentu.",category:"games",year:2023,emoji:"🇪🇺"},{id:"ga3",text:"The World Games to zawody dla dyscyplin spoza programu olimpijskiego — od wspinaczki po ratownictwo wodne. W 2017 roku gospodarzem tej imprezy był Wrocław.",category:"games",year:2017,emoji:"🌐"},{id:"ga4",text:"Igrzyska Panamerykańskie, organizowane od 1951 roku, gromadzą sportowców obu Ameryk. Dla wielu dyscyplin są jednocześnie kwalifikacjami olimpijskimi.",category:"games",year:1951,emoji:"🌎"},{id:"ga5",text:"Igrzyska Śródziemnomorskie łączą kraje trzech kontynentów leżące nad jednym morzem. Powstały w 1951 roku jako sposób na budowanie kontaktów w regionie po wojnie.",category:"games",year:1951,emoji:"🌊"},{id:"ga6",text:"Młodzieżowe Igrzyska Olimpijskie zadebiutowały w Singapurze w 2010 roku. Obok rywalizacji obowiązkowe są tam warsztaty edukacyjne o zdrowiu, karierze i uczciwej grze.",category:"games",year:2010,emoji:"🧒"},{id:"ga7",text:"Invictus Games to zawody dla weteranów i żołnierzy rannych podczas służby. Ich nazwa pochodzi od łacińskiego słowa oznaczającego „niepokonany”.",category:"games",year:2014,emoji:"🎖️"},{id:"ga8",text:"Olimpiady Specjalne organizowane są dla osób z niepełnosprawnością intelektualną. Ich przysięga brzmi: „Chcę zwyciężyć, lecz jeśli nie zdołam, niech będę dzielny w swym wysiłku”.",category:"games",year:1968,emoji:"💪"},{id:"ga9",text:"Igrzyska Afrykańskie odbywają się od 1965 roku i są dla wielu tamtejszych sportowców najważniejszym startem w cyklu. Dla części dyscyplin stanowią przepustkę na olimpiadę.",category:"games",year:1965,emoji:"🌍"},{id:"ga10",text:"Uniwersjada, Igrzyska Wspólnoty Narodów i Igrzyska Europejskie mają własne wioski zawodników, ceremonie i znicze. W skali organizacyjnej niewiele ustępują igrzyskom olimpijskim.",category:"games",year:2019,emoji:"🔥"},{id:"age9",text:"Norman Whiteside zagrał na mundialu 1982 w wieku 17 lat, bijąc rekord należący wcześniej do Pelégo. Do dziś pozostaje najmłodszym piłkarzem w historii mistrzostw świata.",category:"ages",year:1982,emoji:"👦"},{id:"age10",text:"Jaromír Jágr grał zawodowo w hokeja jeszcze po pięćdziesiątce — w klubie, którego sam jest właścicielem. Karierę zaczynał, gdy jego późniejsi koledzy z drużyny jeszcze się nie urodzili.",category:"ages",year:2023,emoji:"🏒"},{id:"age11",text:"Wilfred Benítez zdobył mistrzostwo świata w boksie w wieku 17 lat — jest najmłodszym mistrzem w historii tego sportu. Zawodowo walczył już jako piętnastolatek.",category:"ages",year:1976,emoji:"🥊"},{id:"age12",text:"Najstarszym zwycięzcą Tour de France pozostaje Firmin Lambot, który wygrał wyścig w wieku 36 lat. W erze zawodowego kolarstwa nikt starszy nie stanął na najwyższym stopniu podium.",category:"ages",year:1922,emoji:"🚴"},{id:"aa9",text:"Na Tour de France 2021 kibicka z tekturowym transparentem wystawiła go na trasę i wywołała gigantyczną kraksę. Peleton przewrócił się jak kostki domina, a sprawa trafiła do sądu.",category:"anecdotes",year:2021,emoji:"🪧"},{id:"aa10",text:"Podczas meczu NBA na parkiet wleciał nietoperz. Manu Ginóbili złapał go gołą ręką w locie, po czym pracownicy hali wynieśli zwierzę na zewnątrz — mecz wznowiono po kilku minutach.",category:"anecdotes",year:2009,emoji:"🦇"},{id:"aa11",text:"Zdarza się, że zawodnik wchodzi z ławki i schodzi z niej po kilkunastu sekundach — czasem przez kontuzję, czasem przez czerwoną kartkę. Takie występy trafiają do statystyk jako najkrótsze w historii lig.",category:"anecdotes",year:2010,emoji:"⏱️"},{id:"aa12",text:"Gole samobójcze z połowy boiska zdarzały się przy próbach wybicia piłki do bramkarza. Zawodnik zamiast podać, przerzucał piłkę nad własnym golkiperem — i wpisywał się do kronik z najgorszej strony.",category:"anecdotes",year:2e3,emoji:"🙈"},{id:"ad9",text:"Podczas kontroli antydopingowej zawodnik oddaje próbkę pod bezpośrednią obserwacją kontrolera tej samej płci. Procedura jest krępująca, ale ma uniemożliwić podmianę moczu.",category:"antidoping",year:2e3,emoji:"👀"},{id:"ad10",text:"Każdą próbkę dzieli się na dwie części: A i B. Drugą otwiera się wyłącznie na wniosek zawodnika, gdy chce zakwestionować pozytywny wynik pierwszej.",category:"antidoping",year:1989,emoji:"🅱️"},{id:"ad11",text:"Lista zakazanych obejmuje nie tylko substancje, ale i metody — transfuzje własnej krwi, manipulacje przy próbce czy podawanie tlenu w sposób niedozwolony.",category:"antidoping",year:2004,emoji:"🚫"},{id:"ad12",text:"Kontrolerzy mogą pojawić się bez zapowiedzi w domu zawodnika, na treningu albo w hotelu. Sportowcy z puli badań muszą być dostępni także w wakacje i przerwie między sezonami.",category:"antidoping",year:2009,emoji:"🚪"},{id:"av9",text:"Szybowce startują holowane przez samolot albo wyciągane stalową liną przez wyciągarkę. W drugim przypadku maszyna nabiera wysokości w kilkanaście sekund, wznosząc się niemal pionowo.",category:"aviation",year:1930,emoji:"🪝"},{id:"av10",text:"Rekord wysokości lotu szybowca przekracza 22 kilometry — to pułap wyższy niż osiąga większość samolotów pasażerskich. Piloci potrzebują wtedy skafandrów ciśnieniowych.",category:"aviation",year:2018,emoji:"🌌"},{id:"av11",text:"W skokach grupowych spadochroniarze budują w powietrzu formacje liczące setki osób. Każdy uczestnik ma wyznaczone miejsce i ułamki sekund na chwycenie sąsiadów za nadgarstki.",category:"aviation",year:2006,emoji:"🤝"},{id:"av12",text:"Kompletna paralotnia mieści się w plecaku i waży kilkanaście kilogramów. Dzięki temu pilot może wejść z nią na szczyt góry i wystartować dosłownie z kilku kroków.",category:"aviation",year:1990,emoji:"🎒"},{id:"bb9",text:"Miotacze operują całym arsenałem rzutów: szybkim fastballem, kręconym curveballem, ślizgającym się sliderem i zwalniającym changeupem. Różnią się chwytem piłki i nadaną jej rotacją.",category:"baseball",year:1900,emoji:"🌀"},{id:"bb10",text:"Aby skrócić maratońskie dogrywki, w 2020 roku wprowadzono zasadę, że każda dodatkowa zmiana zaczyna się od biegacza ustawionego na drugiej bazie. Wcześniej mecze potrafiły ciągnąć się godzinami.",category:"baseball",year:2020,emoji:"🏃"},{id:"bb11",text:"„Perfect game” to mecz, w którym miotacz nie pozwolił żadnemu rywalowi dotrzeć do bazy — 27 zawodników wyeliminowanych z rzędu. W ponad stuletniej historii ligi zdarzyło się to ledwie kilkanaście razy.",category:"baseball",year:1904,emoji:"💎"},{id:"bb12",text:"Każda pozycja w polu ma rękawicę innego kształtu — łapacz używa grubo wyściełanej, pierwszobazowy dłuższej, a zawodnicy wewnętrzni płytkiej, z której szybko wyjmuje się piłkę.",category:"baseball",year:1920,emoji:"🧤"},{id:"cm9",text:"Drogi w halach wspinaczkowych projektują zawodowi „setterzy”, przykręcając chwyty do ściany. Ich praca decyduje o tym, czy problem będzie wymagał siły, czy sprytu.",category:"climbing",year:1990,emoji:"🔩"},{id:"cm10",text:"Przejście drogi „onsight” oznacza wejście za pierwszym razem bez żadnych wskazówek. „Flash” to również pierwsza próba, ale z podpowiedziami — dla wspinaczy różnica jest zasadnicza.",category:"climbing",year:1985,emoji:"👁️"},{id:"cm11",text:"Wspinaczka wielowyciągowa dzieli ścianę na odcinki. Partnerzy asekurują się na kolejnych stanowiskach, a pokonanie długiej drogi potrafi zająć cały dzień, z noclegiem w wiszącym hamaku.",category:"climbing",year:1960,emoji:"🛏️"},{id:"cm12",text:"Buty wspinaczkowe kupuje się o kilka rozmiarów za małe, żeby stopa działała jak sztywne narzędzie. Zawodnicy zdejmują je natychmiast po zejściu ze ściany.",category:"climbing",year:1980,emoji:"👟"},{id:"cg9",text:"Amerykańskie uczelnie dzielą się na trzy dywizje sportowe. W najniższej nie wolno przyznawać stypendiów sportowych — zawodnicy grają wyłącznie dla przyjemności i prestiżu szkoły.",category:"college",year:1973,emoji:"3️⃣"},{id:"cg10",text:"„Walk-on” to zawodnik przyjęty do drużyny bez stypendium, często po otwartych testach. Kilku takich graczy przebiło się później do zawodowych lig i zostało gwiazdami.",category:"college",year:1980,emoji:"🚶"},{id:"cg11",text:"Najstarsze akademickie rywalizacje mają własne nazwy pisane wielką literą — mecz Harvardu z Yale to po prostu „The Game”. Rozgrywają go od XIX wieku.",category:"college",year:1875,emoji:"🎓"},{id:"cg12",text:"W wielu stanach USA najlepiej zarabiającym pracownikiem publicznym jest trener uczelnianej drużyny futbolowej lub koszykarskiej — więcej niż gubernator czy rektor.",category:"college",year:2015,emoji:"💵"},{id:"cl9",text:"Stroje wyjazdowe wymyślono dla kontrastu — gdy barwy obu drużyn są podobne, goście zmieniają komplet. W czasach telewizji czarno-białej decydował o tym odcień szarości.",category:"colors",year:1950,emoji:"👕"},{id:"cl10",text:"Trzeci komplet strojów rzadko bywa potrzebny sportowo — to przede wszystkim produkt marketingowy, projektowany z myślą o sprzedaży kibicom.",category:"colors",year:1990,emoji:"🛍️"},{id:"cl11",text:"Sędziowie tradycyjnie ubierali się na czarno, bo był to jedyny kolor niekojarzony z żadnym klubem. Dziś mają do wyboru kilka zestawów, dobieranych do barw drużyn.",category:"colors",year:1994,emoji:"⚫"},{id:"cl12",text:"Federacje coraz częściej sprawdzają zestawienia barw pod kątem daltonizmu. Czerwony na tle zieleni bywa nieczytelny dla milionów kibiców i części zawodników.",category:"colors",year:2017,emoji:"👓"},{id:"cb9",text:"Alex Zanardi stracił obie nogi w wypadku podczas wyścigu. Wrócił do sportu na handbike'u i zdobył złote medale paraolimpijskie, a później znów ścigał się samochodami.",category:"comebacks",year:2012,emoji:"🦾"},{id:"cb10",text:"Mario Lemieux wrócił na lód po leczeniu chłoniaka — w dniu ostatniej sesji radioterapii poleciał na mecz i zdobył punkty. W tym samym sezonie wygrał klasyfikację kanadyjską.",category:"comebacks",year:1993,emoji:"🏒"},{id:"cb11",text:"Kim Clijsters wróciła do tenisa po urodzeniu dziecka i wygrała US Open, mając na trybunach córkę. Powtórzyła ten sukces w kolejnym sezonie.",category:"comebacks",year:2009,emoji:"👶"},{id:"cb12",text:"W amerykańskich ligach przyznaje się osobną nagrodę „Comeback Player of the Year” — dla zawodnika, który wrócił do najwyższej formy po kontuzji lub słabym sezonie.",category:"comebacks",year:1965,emoji:"🏅"},{id:"cmt9",text:"Komentator przygotowuje przed meczem ściągi z wymową nazwisk, statystykami i historiami zawodników. Przy wielkich turniejach to setki stron notatek na kilka dni transmisji.",category:"commentators",year:2e3,emoji:"📝"},{id:"cmt10",text:"Standardem stał się duet: komentator prowadzący relację i ekspert — zwykle były zawodnik lub trener. Ten pierwszy opisuje, drugi tłumaczy, dlaczego coś się dzieje.",category:"commentators",year:1990,emoji:"👥"},{id:"cmt11",text:"W kabinie komentatorskiej stoi kilka monitorów, terminal ze statystykami i słuchawki z realizatorem. Komentator słyszy jednocześnie mecz, reżysera i własny głos w podglądzie.",category:"commentators",year:2010,emoji:"🎛️"},{id:"cmt12",text:"Sposób relacjonowania kontrowersji potrafi ukształtować pamięć o meczu. To komentator decyduje, czy sporna sytuacja zostanie zapamiętana jako skandal, czy jako zwykły epizod.",category:"commentators",year:2e3,emoji:"🗯️"},{id:"cr9",text:"Słowo „hat-trick” pochodzi z krykieta — bowler, który wyeliminował trzech pałkarzy trzema kolejnymi piłkami, dostawał od klubu nowy kapelusz.",category:"cricket",year:1858,emoji:"🎩"},{id:"cr10",text:"W drużynie krykietowej role są ściśle podzielone: bowler rzuca, batsman odbija, wicket-keeper stoi za bramką, a pozostali zajmują pozycje w polu o barwnych nazwach jak „silly point”.",category:"cricket",year:1900,emoji:"🧭"},{id:"cr11",text:"Wyeliminowanie pałkarza bez zdobycia punktu nazywa się „duck”. Gdy zdarzy się to przy pierwszej odbitej piłce, mówi się o „golden duck” — złotej kaczce.",category:"cricket",year:1866,emoji:"🦆"},{id:"cr12",text:"Krykiet ma jedne z najstarszych spisanych przepisów w sporcie — pierwszy kodeks powstał w 1744 roku, na długo przed regułami futbolu czy rugby.",category:"cricket",year:1744,emoji:"📜"},{id:"dn9",text:"Buty do tańców latynoamerykańskich mają zamszową podeszwę i wysoki obcas, który przenosi ciężar na przód stopy. Zamsz zapewnia idealny poślizg — ani za duży, ani za mały.",category:"dance",year:1960,emoji:"👠"},{id:"dn10",text:"W stylu standardowym obowiązuje ścisły kod ubioru: frak z białą muszką i długa suknia balowa. Sędziowie oceniają także prezencję i sylwetkę pary.",category:"dance",year:1950,emoji:"🤵"},{id:"dn11",text:"Określenia „b-boy” i „b-girl” pochodzą od „break boy” — tancerza wchodzącego na parkiet podczas przerywnika, czyli breaku puszczanego przez didżeja.",category:"dance",year:1973,emoji:"🎵"},{id:"dn12",text:"Taniec towarzyski od dekad stara się o stały status olimpijski. Mimo uznania przez MKOl nie doczekał się jeszcze debiutu na igrzyskach.",category:"dance",year:1997,emoji:"🎯"},{id:"der9",text:"Derby wieczne w Grecji rozgrywają Olympiakos i Panathinaikos. Rywalizacja obu klubów obejmuje nie tylko futbol, ale też koszykówkę i siatkówkę.",category:"derbies",year:1925,emoji:"🇬🇷"},{id:"der10",text:"Derby Merseyside między Evertonem a Liverpoolem nazywa się „przyjaznymi” — w wielu rodzinach kibice obu klubów siedzą obok siebie na trybunach.",category:"derbies",year:1894,emoji:"👨‍👩‍👦"},{id:"der11",text:"Kairskie derby Al Ahly z Zamalekiem bywają sędziowane przez arbitrów sprowadzanych z zagranicy. Temperatura sporu jest tak wysoka, że lokalnym sędziom nie ufa żadna ze stron.",category:"derbies",year:1911,emoji:"🇪🇬"},{id:"der12",text:"W Lizbonie rywalizują Benfica i Sporting, których stadiony dzieli zaledwie kilka minut spaceru. To jedne z najbliżej położonych aren wielkich rywali w Europie.",category:"derbies",year:1907,emoji:"🇵🇹"},{id:"di9",text:"Zawodowi sportowcy jedzą zwykle pięć do siedmiu posiłków dziennie, rozłożonych wokół treningów. Chodzi nie tylko o kalorie, ale o stały dopływ energii i budulca do regeneracji.",category:"diet",year:2010,emoji:"🍽️"},{id:"di10",text:"Kolarze na górskich etapach przyjmują nawet 100 gramów węglowodanów na godzinę — w żelach, batonach i napojach. Żołądek trzeba do takich ilości trenować całymi miesiącami.",category:"diet",year:2022,emoji:"🍯"},{id:"di11",text:"Suplementy bywają zanieczyszczone substancjami z listy zakazanych. Dlatego zawodowcy korzystają wyłącznie z produktów objętych certyfikacją i badanych partia po partii.",category:"diet",year:2015,emoji:"⚠️"},{id:"di12",text:"W sportach walki ważenie odbywa się zwykle dzień przed galą. Ta doba pozwala zawodnikom nawodnić organizm i wejść do klatki znacznie cięższymi, niż pokazała waga.",category:"diet",year:2010,emoji:"⏳"},{id:"dy9",text:"Ferrari zdobywało tytuł konstruktorów sześć razy z rzędu na przełomie wieków. Zespół z Maranello połączył wtedy Schumachera, projektanta Rory'ego Byrne'a i szefa Jeana Todta w niemal niepokonaną maszynę.",category:"dynasties",year:2004,emoji:"🐎"},{id:"dy10",text:"Mercedes wygrał osiem klasyfikacji konstruktorów z rzędu po zmianie przepisów silnikowych w 2014 roku. Żaden zespół w historii Formuły 1 nie dominował tak długo bez przerwy.",category:"dynasties",year:2021,emoji:"🥈"},{id:"dy11",text:"Amerykańskie koszykarki wygrały siedem turniejów olimpijskich z rzędu. Ich passa zwycięstw na igrzyskach liczy dziesiątki meczów bez porażki.",category:"dynasties",year:2021,emoji:"🏀"},{id:"dy12",text:"Chicago Bulls zdobyli sześć tytułów NBA w dwóch seriach po trzy — przedzielonych odejściem Michaela Jordana do baseballu. Gdyby nie ta przerwa, mogliby wygrać osiem z rzędu.",category:"dynasties",year:1998,emoji:"🐂"},{id:"ec9",text:"Kluby i organizatorzy kompensuj
