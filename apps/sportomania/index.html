bez „poczwórnych” nie sposób marzyć o medalu w łyżwiarstwie figurowym mężczyzn.",category:"winter",year:1988,emoji:"🔄"},{id:"f32",text:"Najszybszą czerwoną kartkę w historii futbolu zobaczył Anglik Lee Todd w 2000 roku — po 2 sekundach. Zaklął głośno tuż przy sędzim, gdy ten odgwizdał rozpoczęcie meczu.",category:"football",year:2e3,emoji:"🟥"},{id:"a26",text:"Rekord świata Pauli Radcliffe w maratonie kobiet (2:15:25 z 2003 roku) przetrwał aż 16 lat. Przez długi czas Brytyjka biegała szybciej niż jakakolwiek inna kobieta w historii o wiele minut.",category:"athletics",year:2003,emoji:"👑"},{id:"b22",text:"Najwyższymi koszykarzami w historii NBA byli Rumun Gheorghe Mureșan i Sudańczyk Manute Bol — obaj mierzyli po 231 cm. Bol potrafił blokować rzuty, prawie nie odrywając się od podłoża.",category:"basketball",year:1993,emoji:"📏"},{id:"age1",text:"Michael Chang wygrał Roland Garros 1989 w wieku 17 lat — do dziś jest najmłodszym triumfatorem turnieju wielkoszlemowego w historii męskiego tenisa. W ćwierćfinale grał z kurczami, serwując po prostu z dołu.",category:"ages",year:1989,emoji:"🎾"},{id:"age2",text:"Lottie Dod wygrała Wimbledon w 1887 roku, mając zaledwie 15 lat — pozostaje najmłodszą mistrzynią tego turnieju w singlu. Później zdobyła też medale olimpijskie w łucznictwie i mistrzostwo Anglii w golfie.",category:"ages",year:1887,emoji:"👧"},{id:"age3",text:"Max Verstappen zadebiutował w Formule 1 jako 17-latek, a pierwszy wyścig wygrał mając 18 lat — w obu przypadkach jako najmłodszy w historii. Przepisy wieku zaostrzono właśnie po jego debiucie.",category:"ages",year:2016,emoji:"🏎️"},{id:"age4",text:"Egipski bramkarz Essam El-Hadary wystąpił na mundialu 2018 w wieku 45 lat — jako najstarszy zawodnik w historii mistrzostw świata. W swoim jedynym meczu na turnieju obronił nawet rzut karny.",category:"ages",year:2018,emoji:"🧤"},{id:"age5",text:"Amerykanka Marjorie Gestring zdobyła złoto olimpijskie w skokach do wody w 1936 roku, mając 13 lat. Pozostaje najmłodszą indywidualną mistrzynią olimpijską w historii igrzysk.",category:"ages",year:1936,emoji:"🤿"},{id:"age6",text:"Japończyk Kazuyoshi Miura wciąż zawodowo grał w piłkę nożną po pięćdziesiątce — jako najstarszy zawodowy piłkarz świata. W młodości uciekł z domu do Brazylii, by uczyć się futbolu u jego źródeł.",category:"ages",year:2023,emoji:"⚽"},{id:"age7",text:"Bernard Hopkins jako 48-latek został najstarszym w historii bokserem, który zdobył mistrzostwo świata. Rok później, mając 49 lat, wciąż jednoczył pasy wagi półciężkiej.",category:"ages",year:2013,emoji:"🥊"},{id:"age8",text:"Japończyk Yūichirō Miura zdobył szczyt Mount Everestu w 2013 roku, mając 80 lat — jako najstarszy człowiek w historii. Wcześniej, w latach 70., zjechał z Everestu na nartach, hamując spadochronem.",category:"ages",year:2013,emoji:"🏔️"},{id:"t24",text:"Martina Hingis została liderką światowego rankingu tenisistek w wieku 16 lat — najmłodszą w historii. W tym samym sezonie wygrała trzy z czterech turniejów wielkoszlemowych.",category:"tennis",year:1997,emoji:"👑"},{id:"gf10",text:"Phil Mickelson wygrał PGA Championship w 2021 roku w wieku 50 lat — jako najstarszy zwycięzca turnieju wielkoszlemowego w historii golfa. Kibice tłumnie ruszyli wtedy za nim na pole, tworząc chaos przy ostatnim dołku.",category:"golf",year:2021,emoji:"🎂"},{id:"s14",text:"Amerykańska pływaczka Dara Torres zdobyła srebrne medale olimpijskie w 2008 roku, mając 41 lat — rywalizując z zawodniczkami o połowę młodszymi. Startowała w pięciu olimpiadach na przestrzeni 24 lat.",category:"water",year:2008,emoji:"🏊‍♀️"},{id:"c22",text:"W rewanżu z Sugar Rayem Leonardem w 1980 roku Roberto Durán nagle poddał walkę, mówiąc podobno „no más” („dość”). Ta scena przeszła do historii boksu jako jeden z najbardziej zagadkowych momentów.",category:"combat",year:1980,emoji:"🛑"},{id:"dy1",text:"Pakistański squashista Jahangir Khan pozostawał niepokonany przez ponad pięć lat — według szacunków przez około 555 meczów z rzędu. To najdłuższa passa zwycięstw w historii sportu zawodowego.",category:"dynasties",year:1986,emoji:"🎾"},{id:"dy2",text:"Edwin Moses wygrał 122 biegi na 400 m przez płotki z rzędu — przez blisko dekadę (1977–1987) nikt na świecie go nie pokonał. Zdominował swoją konkurencję jak mało kto w historii lekkoatletyki.",category:"dynasties",year:1987,emoji:"🏃"},{id:"dy3",text:"Boston Celtics zdobyli 8 tytułów mistrza NBA z rzędu (1959–1966) — to najdłuższa seria mistrzowska w historii wielkich lig zawodowych Ameryki Północnej.",category:"dynasties",year:1966,emoji:"🍀"},{id:"dy4",text:"Bayern Monachium wygrywał mistrzostwo Niemiec 11 razy z rzędu (2013–2023). Taka dominacja jednej drużyny w wielkiej europejskiej lidze nie miała wcześniej precedensu.",category:"dynasties",year:2023,emoji:"🇩🇪"},{id:"dy5",text:"Węgierska „Złota Drużyna” lat 50. nie przegrała 32 meczów z rzędu. Passa urwała się w najgorszym możliwym momencie — w finale mistrzostw świata 1954, przegranym mimo prowadzenia 2:0.",category:"dynasties",year:1954,emoji:"🇭🇺"},{id:"dy6",text:"Holenderka Esther Vergeer, gwiazda tenisa na wózkach, nie przegrała ani jednego meczu przez dziesięć lat — jej seria zwycięstw sięgnęła około 470 spotkań, zanim zakończyła karierę.",category:"dynasties",year:2012,emoji:"♿"},{id:"dy7",text:"Rafael Nadal wygrał 81 meczów z rzędu na kortach ziemnych (2005–2007) — to rekord ery open. Na mączce był tak niepokonany, że rywale walczyli głównie o to, by urwać mu choć jednego seta.",category:"dynasties",year:2007,emoji:"🟠"},{id:"dy8",text:"Los Angeles Lakers wygrali w sezonie 1971/72 rekordowe 33 mecze NBA z rzędu. Ta passa trwała od listopada do stycznia i do dziś pozostaje niepobita.",category:"dynasties",year:1972,emoji:"🔥"},{id:"hk10",text:"Montreal Canadiens zdobyli 24 Puchary Stanleya — najwięcej w historii ligi NHL. Przez dekady byli synonimem hokejowej wielkości i dumą francuskojęzycznej Kanady.",category:"hockey",year:1993,emoji:"🏆"},{id:"a27",text:"Usain Bolt nigdy nie przegrał olimpijskiego finału na 100 m ani 200 m — wygrał je na trzech kolejnych igrzyskach (2008, 2012, 2016). W biegach indywidualnych na największej scenie był absolutnie niezawodny.",category:"athletics",year:2016,emoji:"⚡"},{id:"nk1",text:"Brazylijczyka Manuela dos Santosa cały świat znał jako Garrinchę — „małego ptaszka”. Urodził się ze skrzywionym kręgosłupem i nogami wygiętymi w łuk, a mimo to stał się jednym z najlepszych dryblerów w historii, zwanym „radością ludu”.",category:"nicknames",year:1962,emoji:"🐦"},{id:"nk2",text:"Niemieckiego snajpera Gerda Müllera nazywano „Der Bomber” — bombardierem narodu. Przez dekady jego rekord goli w jednym sezonie Bundesligi uchodził za nie do pobicia, aż zrobił to Robert Lewandowski.",category:"nicknames",year:1972,emoji:"💣"},{id:"nk3",text:"Roberta Baggio, gwiazdę włoskiego futbolu lat 90., nazywano „Boskim Kucykiem” — od charakterystycznej fryzury i nieziemskiej techniki. Jego pudło w finale mundialu 1994 to jeden z najsłynniejszych obrazów w historii sportu.",category:"nicknames",year:1994,emoji:"💇"},{id:"nk4",text:"Australijski golfista Greg Norman zawdzięczał przydomek „Wielki Biały Rekin” swojej agresywnej grze i jasnej czuprynie. Przez łącznie ponad 300 tygodni był liderem światowego rankingu.",category:"nicknames",year:1986,emoji:"🦈"},{id:"nk5",text:"Franza Beckenbauera, eleganckiego niemieckiego libero, nazywano po prostu „Kaiserem” — cesarzem. Jako jeden z nielicznych zdobył mistrzostwo świata i jako piłkarz (1974), i jako selekcjoner (1990).",category:"nicknames",year:1974,emoji:"👑"},{id:"nk6",text:"Snookerzystę Ronniego O'Sullivana nazywają „Rakietą” za błyskawiczne tempo gry. Swój najsłynniejszy maksymalny brejk 147 punktów ułożył w około 5 minut — szybciej, niż niejeden gracz rozgrywa jednego bila.",category:"nicknames",year:1997,emoji:"🚀"},{id:"nk7",text:"Węgra Ferenca Puskása, jedną z największych gwiazd futbolu w historii, przezywano „Galopującym Majorem” — bo naprawdę służył w wojsku w stopniu majora. Dziś jego imię nosi coroczna nagroda FIFA za najpiękniejszego gola.",category:"nicknames",year:1953,emoji:"🎖️"},{id:"nk8",text:"Zinedine'a Zidane'a cały świat zna jako „Zizou”. Ten pieszczotliwy przydomek z dzieciństwa w Marsylii stał się jednym z najbardziej rozpoznawalnych pseudonimów w dziejach sportu.",category:"nicknames",year:1998,emoji:"🇫🇷"},{id:"m18",text:"Finlandia, mimo zaledwie ok. 5,5 miliona mieszkańców, wydała zdumiewająco wielu mistrzów Formuły 1 i rajdów. „Latający Finowie” słyną z zimnej krwi za kierownicą na śliskich, ośnieżonych trasach.",category:"motorsport",year:2007,emoji:"🇫🇮"},{id:"b23",text:"W sezonie 1961/62 Wilt Chamberlain zdobywał średnio 50,4 punktu na mecz — przez cały sezon. Żaden inny koszykarz w historii NBA nie zbliżył się do takiej średniej.",category:"basketball",year:1962,emoji:"5️⃣"},{id:"ru1",text:"Zasadę zakazującą bramkarzowi łapania piłki podanej nogą przez kolegę z drużyny wprowadzono w 1992 roku. Powodem był potwornie nudny mundial 1990, na którym drużyny grały na czas, cofając piłkę do bramkarza.",category:"rules",year:1992,emoji:"🧤"},{id:"ru2",text:"Przez dekady o awansie w europejskich pucharach decydowała „zasada bramek na wyjeździe” — gol strzelony u rywala liczył się podwójnie przy remisie. UEFA zniosła ją dopiero w 2021 roku.",category:"rules",year:2021,emoji:"✈️"},{id:"ru3",text:"„Infield fly” to jeden z najbardziej zawiłych przepisów baseballu — sędzia może uznać pałkarza za wyeliminowanego, zanim piłka w ogóle spadnie, by uniemożliwić polowym celowe upuszczenie jej dla podwójnej eliminacji.",category:"rules",year:1895,emoji:"⚾"},{id:"ru4",text:"W skokach narciarskich obowiązują przepisy wiążące długość nart z wagą zawodnika. Wprowadzono je, bo skoczkowie głodzili się dla lekkości — zbyt szczupli muszą używać krótszych, mniej nośnych nart.",category:"rules",year:2004,emoji:"⚖️"},{id:"ru5",text:"W szachach obowiązuje zasada „dotknięte — ruszone”: jeśli dotkniesz swojej figury, musisz nią zagrać. Chcąc tylko poprawić jej ustawienie, trzeba wcześniej powiedzieć „poprawiam” (fr. „j'adoube”).",category:"rules",emoji:"♟️"},{id:"ru6",text:"Golfista może mieć w torbie najwyżej 14 kijów. Za każdy dodatkowy grożą kary — dlatego dobór zestawu kijów przed rundą to element strategii samej w sobie.",category:"rules",year:1938,emoji:"🏌️"},{id:"ru7",text:"Bramkarz w piłce nożnej może trzymać piłkę w rękach najwyżej 6 sekund. Przepis istnieje od lat, ale sędziowie egzekwują go tak rzadko, że wielu kibiców nawet o nim nie wie.",category:"rules",year:2e3,emoji:"⏱️"},{id:"ru8",text:"W krykiecie pałkarza można wyeliminować na kuriozalne sposoby — m.in. za „przekroczenie czasu” na wejście do gry, „utrudnianie” polowym czy dwukrotne uderzenie piłki. Część z tych przepisów zastosowano w historii ledwie kilka razy.",category:"rules",emoji:"🏏"},{id:"t25",text:"Na Wimbledonie obowiązuje rygorystyczny biały strój — zawodnicy bywali proszeni o zmianę ubrania za zbyt kolorowe elementy. Dopiero niedawno złagodzono przepis, dopuszczając ciemną bieliznę u tenisistek.",category:"tennis",year:2023,emoji:"👚"},{id:"w23",text:"W skokach narciarskich za styl przyznaje się punkty m.in. za lądowanie „telemarkiem” — z jedną nogą wysuniętą przed drugą i ugiętymi kolanami. Brak telemarku oznacza niższe noty od sędziów.",category:"winter",year:2010,emoji:"🎿"},{id:"mn1",text:"Barierę 4 minut w biegu na milę uważano za fizycznie nieprzekraczalną. Gdy Roger Bannister przełamał ją w 1954 roku, rekord zaczął padać seryjnie — okazało się, że była to bariera w głowach, nie w nogach.",category:"mind",year:1954,emoji:"🧱"},{id:"mn2",text:"„Ściana” w maratonie pojawia się zwykle po ok. 30 km, gdy w mięśniach kończą się zapasy glikogenu. Nogi robią się jak z ołowiu, a ukończenie biegu staje się w równej mierze walką ciała, co psychiki.",category:"mind",year:2e3,emoji:"🧱"},{id:"mn3",text:"„Yips” to tajemnicza, wywołana stresem utrata precyzji ruchów — nagle golfista nie potrafi trafić krótkiego putta, a darter rzucić lotki. To zjawisko zakończyło niejedną wielką karierę.",category:"mind",year:2010,emoji:"😰"},{id:"mn4",text:"Biathlonista dobiega na strzelnicę z tętnem sięgającym 180 uderzeń na minutę, a potem musi trafić tarczę wielkości monety. Najlepsi uczą się ściągać spust w krótkiej chwili między kolejnymi uderzeniami serca.",category:"mind",year:2014,emoji:"🎯"},{id:"mn5",text:"Rafael Nadal na korcie ma dziesiątki drobnych rytuałów — precyzyjnie ustawia bidony etykietami do przodu i nigdy nie nadeptuje na linie. To nie zabobon dla zabawy, lecz sposób na skupienie i opanowanie nerwów.",category:"mind",year:2010,emoji:"🧴"},{id:"mn6",text:"Gimnastycy potrafią stracić w powietrzu orientację, gdzie jest góra, a gdzie dół — nazywają to „twisties”. Ten groźny blok psychiczny sprawił, że Simone Biles wycofała się z kilku finałów igrzysk 2020.",category:"mind",year:2021,emoji:"🌀"},{id:"mn7",text:"Greg Norman przystąpił do ostatniej rundy Masters 1996 z przewagą sześciu uderzeń — i przegrał turniej. Jego załamanie pod presją to podręcznikowy przykład „udławienia się” w sporcie.",category:"mind",year:1996,emoji:"📉"},{id:"mn8",text:"Najlepsi sportowcy przed startem w wyobraźni przechodzą cały występ w najdrobniejszych szczegółach. Badania pokazują, że taka wizualizacja pobudza w mózgu podobne ścieżki co realny trening.",category:"mind",year:2012,emoji:"🧠"},{id:"gf11",text:"„Kondor” w golfie to zdobycie dołka na cztery uderzenia poniżej par — np. wbicie piłki do dołka jednym uderzeniem na par 5, „na skróty” przez zakręt. W historii odnotowano ledwie kilka takich przypadków.",category:"golf",year:2007,emoji:"🦅"},{id:"rg12",text:"Nowozelandczycy mają drugą, groźniejszą wersję haki — „Kapa o Pango” z 2005 roku — kończącą się gestem podcięcia gardła. Wywołała ona międzynarodową dyskusję o granicach przedmeczowego zastraszania.",category:"rugby",year:2005,emoji:"😤"},{id:"cl1",text:"Czarno-białe pasy Juventusu to zasługa Anglika. W 1903 roku klubowy działacz sprowadził komplet strojów z angielskiego Notts County — i barwy zostały do dziś.",category:"colors",year:1903,emoji:"⚫"},{id:"cl2",text:"Biały strój Realu Madryt wzorowano na angielskim amatorskim klubie Corinthian FC, uważanym na przełomie XIX i XX wieku za wzór dżentelmeńskiego futbolu.",category:"colors",year:1902,emoji:"⚪"},{id:"cl3",text:"Liverpool przez pierwsze lata grał w barwach niebiesko-białych. Czerwień — dziś nierozerwalnie związaną z klubem — przyjęto dopiero później, nawiązując do koloru miasta.",category:"colors",year:1896,emoji:"🔴"},{id:"cl4",text:"Herb Ajaxu Amsterdam to stylizowana twarz greckiego bohatera Ajaksa, narysowana z 11 linii — po jednej na każdego z jedenastu zawodników drużyny na boisku.",category:"colors",year:1990,emoji:"🛡️"},{id:"cl5",text:"Niebiesko-żółte barwy argentyńskiej Boca Juniors wybrano — jak głosi legenda — od flagi pierwszego statku, który wpłynął do portu. Był to statek szwedzki.",category:"colors",year:1907,emoji:"🚢"},{id:"cl6",text:"Słynny „koń” w logo Ferrari pochodzi z samolotu włoskiego asa myśliwskiego I wojny światowej, Francesca Baraki. Sama czerwień to „rosso corsa” — historyczna barwa włoskich aut wyścigowych.",category:"colors",year:1923,emoji:"🐎"},{id:"cl7",text:"Drużyna futbolu amerykańskiego Green Bay Packers wzięła nazwę od... zakładów mięsnych, które w 1919 roku sfinansowały jej pierwsze stroje. „Packers” znaczy dosłownie „pakowacze”.",category:"colors",year:1919,emoji:"🥩"},{id:"cl8",text:"Zielono-białe pasy szkockiego Celticu i cała otoczka klubu podkreślają jego irlandzkie, katolickie korzenie. Barwy i symbole klubów sportowych bywają nośnikiem tożsamości całych społeczności.",category:"colors",year:1888,emoji:"🍀"},{id:"f35",text:"Puchar Anglii (FA Cup), rozgrywany od sezonu 1871/72, to najstarsze piłkarskie rozgrywki na świecie. Wciąż potrafi dostarczać sensacji, gdy amatorskie kluby trafiają na gigantów Premier League.",category:"football",year:1871,emoji:"🏆"},{id:"m19",text:"Legenda głosi, że „Srebrne Strzały” Mercedesa narodziły się w 1934 roku, gdy bolid o kilogram przekroczył limit wagi. W nocy zeskrobano z niego biały lakier, odsłaniając srebrny metal — i tak powstała kultowa barwa.",category:"motorsport",year:1934,emoji:"🥈"},{id:"un1",text:"W angielskim Gloucestershire co roku odbywa się wyścig za toczącym się w dół stromego wzgórza kręgiem sera. Ser rozpędza się do ok. 100 km/h, a zwycięzca — kto pierwszy na dole — zabiera go do domu.",category:"unusual",year:1826,emoji:"🧀"},{id:"un2",text:"W Finlandii rozgrywa się mistrzostwa świata w noszeniu żony (eukonkanto). Mężczyzna pokonuje tor przeszkód z partnerką na plecach, a główną nagrodą jest... waga żony w piwie.",category:"unusual",year:1992,emoji:"💑"},{id:"un3",text:"W walijskim miasteczku Llanwrtyd Wells rozgrywa się mistrzostwa świata w nurkowaniu w bagnie. Zawodnicy w płetwach i masce muszą przepłynąć rów wypełniony torfowym błotem, nie używając klasycznych ruchów pływackich.",category:"unusual",year:1985,emoji:"🤿"},{id:"un4",text:"Chessboxing łączy szachy i boks w naprzemiennych rundach. Wygrać można matem przy szachownicy albo nokautem w ringu — potrzeba więc i tężyzny fizycznej, i zimnej głowy.",category:"unusual",year:2003,emoji:"♟️"},{id:"un5",text:"Szwajcarski hornussen to wiejski sport zespołowy, w którym krążek („hornuss”) wystrzeliwuje się elastycznym prętem, a przeciwnicy próbują strącić go w locie wielkimi drewnianymi tablicami.",category:"unusual",year:1900,emoji:"🥏"},{id:"un6",text:"W japońskim yukigassen bitwa na śnieżki jest sportem z prawdziwego zdarzenia — dwie drużyny walczą według ścisłych zasad, trochę jak w zdobywaniu flagi. Dziś rozgrywa się go już na kilku kontynentach.",category:"unusual",year:1989,emoji:"⛄"},{id:"un7",text:"Bawarski fingerhakeln to zapasy... na palce. Dwóch mężczyzn zahacza o skórzaną pętlę po jednym palcu i próbuje przeciągnąć rywala przez stół. Konkurencja bywa tak zacięta, że palce potrafią ulec kontuzji.",category:"unusual",year:1950,emoji:"🤙"},{id:"un8",text:"W Turcji, w regionie egejskim, od stuleci organizuje się festiwale zapasów wielbłądów. Samce mocują się ze sobą w sezonie godowym, a wydarzenie przyciąga tłumy widzów i całe rodziny na pikniki.",category:"unusual",year:2010,emoji:"🐫"},{id:"hb11",text:"Piłka ręczna to jeden z najszybszych i najbardziej bramkostrzelnych sportów zespołowych — w jednym meczu pada zwykle 50–60 goli łącznie, czyli mniej więcej gol co pół minuty.",category:"handball",year:2012,emoji:"⚡"},{id:"s15",text:"W pływaniu artystycznym zawodniczki nie mogą dotykać dna basenu, a pod wodą wstrzymują oddech nawet na blisko minutę, wykonując przy tym precyzyjne figury do muzyki. Na nosie noszą specjalny zacisk.",category:"water",year:2016,emoji:"🤽‍♀️"},{id:"fn1",text:"Hymn kibiców Liverpoolu „You'll Never Walk Alone” pochodzi z musicalu z 1945 roku. Śpiewany na trybunie The Kop od lat 60., stał się jedną z najbardziej rozpoznawalnych pieśni sportowych świata.",category:"fans",year:1963,emoji:"🎶"},{id:"fn2",text:"„Poznań” to celebracja wymyślona przez kibiców Lecha Poznań — odwracają się tyłem do boiska i skacząc, trzymają się za ramiona. Gest podpatrzyli i przejęli fani Manchesteru City.",category:"fans",year:2010,emoji:"🔄"},{id:"fn3",text:"Kibice Seattle Seahawks są tak głośni, że klub zastrzegł dla nich koszulkę z numerem 12 („12. zawodnik”), a ich doping ustanowił oficjalny rekord Guinnessa hałasu na stadionie.",category:"fans",year:2013,emoji:"📣"},{id:"fn4",text:"Tifo to gigantyczna, precyzyjnie zaplanowana oprawa na trybunach — potrafi zakryć cały sektor obrazem czy napisem. Przygotowanie największych zajmuje kibicom całe tygodnie pracy w ukryciu.",category:"fans",year:2e3,emoji:"🎨"},{id:"fn5",text:"„Lambeau Leap” to rytuał zawodników Green Bay Packers, którzy po zdobyciu przyłożenia wskakują w objęcia kibiców na trybunach. Tradycja trwa nieprzerwanie od lat 90.",category:"fans",year:1993,emoji:"🤸"},{id:"fn6",text:"W Anglii Boxing Day (26 grudnia) to od ponad stu lat wielkie święto futbolu — rozgrywa się wtedy komplet meczów, a stadiony pękają w szwach mimo świątecznego okresu.",category:"fans",year:1900,emoji:"🎄"},{id:"fn7",text:"Stambulska Galatasaray zasłynęła transparentami „Welcome to Hell” witającymi rywali. Atmosfera na jej stadionie uchodzi za jedną z najbardziej onieśmielających w europejskim futbolu.",category:"fans",year:1993,emoji:"🔥"},{id:"fn8",text:"FC Barcelona i Real Madryt należą do swoich kibiców — tzw. socios. To członkowie klubu wybierają prezydenta w wyborach, mając realny wpływ na losy drużyny.",category:"fans",year:2003,emoji:"🗳️"},{id:"m20",text:"Tradycja spryskiwania podium szampanem narodziła się przypadkiem — w 1967 roku Amerykanin Dan Gurney po zwycięstwie w Le Mans potrząsnął butelką i oblał wszystkich dookoła. Zwyczaj przyjął się na całym świecie.",category:"motorsport",year:1967,emoji:"🍾"},{id:"o42",text:"Znicz olimpijski w drodze na igrzyska bywał niesiony w najbardziej niezwykłych miejscach — nurkowano z nim pod wodą przy Wielkiej Rafie Koralowej, a przed igrzyskami w Soczi zabrano go nawet w kosmos, na spacer kosmiczny.",category:"olympics",year:2014,emoji:"🚀"},{id:"md1",text:"Pierwszą transmisję meczu piłki nożnej pokazała telewizja BBC w 1937 roku — było to specjalnie zaaranżowane spotkanie treningowe Arsenalu. Widownia telewizyjna liczyła wtedy zaledwie kilka tysięcy osób.",category:"media",year:1937,emoji:"📡"},{id:"md2",text:"Powtórkę wideo pokazano w telewizji po raz pierwszy w 1963 roku, podczas meczu futbolu amerykańskiego. Widzowie byli tak zdezorientowani, że komentator musiał krzyczeć: „To nie jest nowa akcja!”.",category:"media",year:1963,emoji:"⏪"},{id:"md3",text:"Walka bokserska Dempsey–Carpentier z 1921 roku była jedną z pierwszych transmisji sportowych w radiu, których słuchały masy. Ludzie gromadzili się wokół odbiorników, by „usłyszeć” pojedynek na żywo.",category:"media",year:1921,emoji:"📻"},{id:"md4",text:"Jedną z pierwszych gier wideo w historii było „Tennis for Two” z 1958 roku — symulacja tenisa na ekranie oscyloskopu. Dopiero „Pong” z 1972 roku uczynił sportowe gry masową rozrywką.",category:"media",year:1958,emoji:"🎮"},{id:"md5",text:"Stację ESPN — pierwszy całodobowy kanał sportowy — uruchomiono w 1979 roku. Wielu wróżyło jej klęskę, pytając, kto miałby oglądać sport przez całą dobę. Dziś to potęga medialna.",category:"media",year:1979,emoji:"📺"},{id:"md6",text:"Brytyjski „Match of the Day” — program ze skrótami meczów piłkarskich — nadawany jest od 1964 roku. To jeden z najdłużej emitowanych programów sportowych w historii telewizji.",category:"media",year:1964,emoji:"⚽"},{id:"md7",text:"Spidercam to kamera latająca nad boiskiem na linkach rozpiętych między trybunami. Daje widzom spektakularne ujęcia z góry, jakby unosili się tuż nad grającymi zawodnikami.",category:"media",year:2010,emoji:"🕷️"},{id:"md8",text:"W krykiecie od 1992 roku decyzje wspiera „trzeci sędzia” z dostępem do powtórek, a technologie jak Hot Spot czy Snickometer wykrywają nawet muśnięcie piłki o krawędź kija.",category:"media",year:1992,emoji:"🔍"},{id:"t26",text:"Wimbledon po niemal 150 latach pożegnał sędziów liniowych — od 2025 roku o tym, czy piłka była w korcie, decyduje wyłącznie automatyczny, elektroniczny system. Zniknął tym samym jeden z symboli turnieju.",category:"tennis",year:2025,emoji:"🤖"},{id:"a28",text:"Na mecie biegów sprinterskich pracują kamery do fotofiniszu rejestrujące nawet tysiące klatek na sekundę. Dzięki nim można rozdzielić zawodników, których dzieli tysięczna część sekundy.",category:"athletics",year:2016,emoji:"📸"},{id:"bd1",text:"O tym, czy ktoś jest urodzonym sprinterem, czy maratończykiem, w dużej mierze decyduje genetyka. Włókna szybkokurczliwe dają eksplozywną moc, a wolnokurczliwe — wytrzymałość na długim dystansie.",category:"body",year:2e3,emoji:"💪"},{id:"bd2",text:"Wysoki wzrost uchodził za wadę sprintera, ale Usain Bolt obrócił go w atut. Na 100 m potrzebował około 41 kroków, podczas gdy niżsi rywale musieli wykonać ich kilka więcej.",category:"body",year:2009,emoji:"👣"},{id:"bd3",text:"„Euforia biegacza” to nie mit — przy długim wysiłku mózg zalewają endorfiny i substancje podobne do tych z konopi. Stąd uczucie lekkości i szczęścia, które potrafi uzależnić od biegania.",category:"body",year:2008,emoji:"😌"},{id:"bd4",text:"Trening na dużej wysokości zmusza organizm do produkcji większej liczby czerwonych krwinek. Po powrocie na niziny sportowiec przenosi więcej tlenu — dlatego wielu trenuje w górach przed startami.",category:"body",year:1968,emoji:"⛰️"},{id:"bd5",text:"Podczas maratonu zawodnik może stracić z potem kilka litrów płynów i sporą część masy ciała. Utrzymanie równowagi wodnej i soli bywa równie ważne jak sama forma biegowa.",category:"body",year:2010,emoji:"💧"},{id:"bd6",text:"Powtarzane ciosy w głowę mogą prowadzić u bokserów do „dementia pugilistica” — zespołu otępiennego zwanego „byciem groggy”. To jeden z głównych powodów badań lekarskich i troski o bezpieczeństwo w tym sporcie.",category:"body",year:1928,emoji:"🥊"},{id:"bd7",text:"Nurkom na bezdechu pomaga „odruch nurkowania ssaków” — serce zwalnia, a śledziona kurczy się, wyrzucając do krwi dodatkowe czerwone krwinki. Dzięki temu człowiek potrafi wytrzymać pod wodą zaskakująco długo.",category:"body",year:2007,emoji:"🫁"},{id:"bd8",text:"Najlepsi pałkarze i uderzający słyną z wyjątkowego wzroku. Baseballowa legenda Ted Williams miał podobno wzrok 20/10 — widział szczegóły dwa razy ostrzej niż przeciętny człowiek.",category:"body",year:1941,emoji:"👁️"},{id:"w24",text:"Biathlon łączy dwie skrajności: morderczy bieg narciarski i wymagające lodowatego spokoju strzelanie. Każdy nietrafiony strzał oznacza karną pętlę, więc losy zawodów potrafią odwrócić się na strzelnicy.",category:"winter",year:2014,emoji:"🎯"},{id:"c23",text:"Zapasy to jeden z niewielu sportów obecnych na wszystkich nowożytnych igrzyskach od 1896 roku. W 2013 roku MKOl chciał je usunąć z programu, ale po fali protestów z całego świata szybko przywrócono je na igrzyska.",category:"combat",year:2013,emoji:"🤼"},{id:"ce1",text:"Ogień olimpijski zapala się w greckiej Olimpii wyłącznie od promieni słońca, skupionych zwierciadłem parabolicznym. Na wypadek zgaśnięcia płomienia przechowuje się zapasowy ogień z tego samego źródła.",category:"ceremonies",year:1936,emoji:"🔥"},{id:"ce2",text:"Podczas parady narodów na otwarciu igrzysk Grecja zawsze idzie pierwsza — jako kolebka olimpiady — a gospodarze na samym końcu. Reszta reprezentacji maszeruje pośrodku, zwykle w kolejności alfabetycznej.",category:"ceremonies",year:1928,emoji:"🇬🇷"},{id:"ce3",text:"Na zamknięciu igrzysk burmistrz miasta-gospodarza przekazuje flagę olimpijską burmistrzowi następnego gospodarza. Ten symboliczny gest oficjalnie „przekazuje pałeczkę” kolejnym igrzyskom.",category:"ceremonies",year:1920,emoji:"🏳️"},{id:"ce4",text:"Męskie trofeum Wimbledonu wieńczy maleńki złoty... ananas. Nikt nie wie na pewno dlaczego — być może to nawiązanie do czasów, gdy ananas był luksusowym symbolem bogactwa i gościnności.",category:"ceremonies",year:1887,emoji:"🍍"},{id:"ce5",text:"Koszulki Tour de France to cała symbolika: żółta dla lidera, zielona dla najlepszego w sprintach, grochata dla króla gór i biała dla najlepszego młodzieżowca. Każda ma własną historię i prestiż.",category:"ceremonies",year:1975,emoji:"👕"},{id:"ce6",text:"W baseballu wielkie mecze otwiera „ceremonialny pierwszy rzut” wykonywany przez znane osobistości. Tradycję zapoczątkował w 1910 roku prezydent USA William Taft.",category:"ceremonies",year:1910,emoji:"⚾"},{id:"ce7",text:"Zwycięzcę wyścigu Kentucky Derby okrywa się kapą z róż — stąd nazwa „Bieg po Róże”. W tym czasie tłumy śpiewają rzewną pieśń „My Old Kentucky Home”.",category:"ceremonies",year:1896,emoji:"🌹"},{id:"ce8",text:"Finał Pucharu Anglii od lat 20. XX wieku poprzedza wspólne odśpiewanie hymnu „Abide with Me”. To rzadki moment, gdy przed meczem cały stadion śpiewa jednym głosem.",category:"ceremonies",year:1927,emoji:"🎶"},{id:"ce9",text:"Medaliści na zdjęciach często „gryzą” swoje medale. To pomysł fotografów — nawiązanie do dawnego sprawdzania, czy złoto jest prawdziwe (miękkie ustępowało pod zębami). Dziś to już tylko efektowna poza.",category:"ceremonies",year:2012,emoji:"🦷"},{id:"k15",text:"Ostatni zawodnik Tour de France ma swój przydomek — „lanterne rouge”, czyli „czerwona latarnia”, od światła na końcu pociągu. Bywa, że kolarze walczą o to miejsce, bo przynosi zaskakująco dużo rozgłosu.",category:"cycling",year:1980,emoji:"🔴"},{id:"o43",text:"Symbol igrzysk paraolimpijskich to trzy „agito” — łukowate elementy w ruchu. Nazwa pochodzi od łacińskiego „agito”, czyli „poruszam się”, a hasło ruchu brzmi „Spirit in Motion” — „duch w ruchu”.",category:"olympics",year:2003,emoji:"♾️"},{id:"up1",text:"W 1990 roku niepokonany Mike Tyson przegrał przez nokaut z Busterem Douglasem — mało znanym pretendentem, na którego bukmacherzy stawiali 42 do 1. To jedna z największych sensacji w historii boksu.",category:"upsets",year:1990,emoji:"🥊"},{id:"up2",text:"Rosyjski zapaśnik Aleksandr Karielin nie przegrał przez 13 lat i przez dekadę nie stracił nawet punktu. W finale igrzysk 2000 pokonał go jednak Amerykanin Rulon Gardner — sensacja, w którą nikt nie wierzył.",category:"upsets",year:2e3,emoji:"🤼"},{id:"up3",text:"Boris Becker wygrał Wimbledon w 1985 roku jako nierozstawiony 17-latek — najmłodszy mistrz w historii turnieju. Do tej pory nikt bez rozstawienia nie sięgnął po ten tytuł.",category:"upsets",year:1985,emoji:"🎾"},{id:"up4",text:"Goran Ivanišević wygrał Wimbledon 2001 z „dziką kartą”, będąc poza pierwszą setką rankingu. Trzykrotny finalista wreszcie dopiął swego — jako jeden z najniżej notowanych triumfatorów wielkoszlemowych.",category:"upsets",year:2001,emoji:"🃏"},{id:"up5",text:"„Cud w Stambule” 2005: Liverpool przegrywał w finale Ligi Mistrzów z AC Milanem 0:3 do przerwy. W drugiej połowie w 6 minut doprowadził do remisu i wygrał po rzutach karnych.",category:"upsets",year:2005,emoji:"🔄"},{id:"up6",text:"Na mistrzostwach świata w rugby 2015 Japonia pokonała potężną RPA w ostatniej akcji meczu. „Cud w Brighton” uchodzi za jedną z największych sensacji w historii sportu drużynowego.",category:"upsets",year:2015,emoji:"🌸"},{id:"up7",text:"W półfinale US Open 2015 Roberta Vinci, notowana jako outsider z szansami 300 do 1, zatrzymała Serenę Williams tuż przed kompletem wielkoszlemowym. Rozczarowana faworytka odmówiła nawet rozmowy z mediami.",category:"upsets",year:2015,emoji:"🛑"},{id:"up8",text:"W 1982 roku maleńka uczelnia Chaminade pokonała w koszykówce prowadzącą w rankingu drużynę Virginii z gwiazdorem Ralphem Sampsonem. To wciąż największa sensacja w historii amerykańskiej koszykówki akademickiej.",category:"upsets",year:1982,emoji:"🏀"},{id:"m21",text:"Uliczny tor w Monako jest tak wąski i kręty, że wyprzedzanie graniczy z cudem. Nelson Piquet porównał jazdę po nim do „jeżdżenia rowerem po własnym salonie”.",category:"motorsport",year:1985,emoji:"🚲"},{id:"t27",text:"Kolejka po bilety na Wimbledon („The Queue”) to instytucja sama w sobie — kibice koczują w namiotach nawet całą noc, a obowiązuje ich oficjalny kodeks zachowania. To jedna z najbardziej brytyjskich tradycji w sporcie.",category:"tennis",year:2010,emoji:"⛺"},{id:"ge1",text:"Boliwijski stadion w La Paz leży na wysokości ok. 3600 m n.p.m. Rywale reprezentacji Boliwii łapią tam zadyszkę już po kilkunastu minutach — FIFA przez pewien czas zakazywała nawet gry na takich wysokościach.",category:"geography",year:2007,emoji:"⛰️"},{id:"ge2",text:"Na Svalbardzie, niedaleko bieguna północnego, rozgrywa się maratony w pełnym słońcu o północy. Latem słońce nie zachodzi tam przez wiele tygodni, a organizatorzy patrolują trasę, wypatrując niedźwiedzi polarnych.",category:"geography",year:2015,emoji:"🐻‍❄️"},{id:"ge3",text:"Everesting to wyzwanie kolarskie polegające na pokonaniu w jeden dzień takiej liczby podjazdów na dowolne wzgórze, by suma przewyższeń dorównała wysokości Mount Everestu — 8848 metrów.",category:"geography",year:2014,emoji:"🚵"},{id:"ge4",text:"Sto lat temu Nordowie zdominowali biegi narciarskie, a Kenijczycy maratony — nie przypadkiem. Wysokość, klimat i codzienne przemieszczanie się kształtowały pokolenia zawodników na długo przed erą profesjonalnych treningów.",category:"geography",year:1968,emoji:"🌍"},{id:"ge5",text:"W Zjednoczonych Emiratach Arabskich powstały hale narciarskie z prawdziwym śniegiem — można tam zjeżdżać na nartach, gdy na zewnątrz temperatura przekracza 40°C.",category:"geography",year:2005,emoji:"🎿"},{id:"ge6",text:"Rajd Dakar prowadził niegdyś przez Saharę z Europy do Senegalu, potem przeniósł się do Ameryki Południowej, a dziś odbywa się na pustyniach Arabii Saudyjskiej. Nazwa została, choć trasa dawno nie dociera do Dakaru.",category:"geography",year:2020,emoji:"🏜️"},{id:"ge7",text:"Igrzyska w Meksyku 1968 rozgrywano na wysokości 2240 m n.p.m. Rzadsze powietrze pomogło w skokach i sprintach — padły tam legendarne rekordy — ale zaszkodziło biegaczom długodystansowym.",category:"geography",year:1968,emoji:"📈"},{id:"ge8",text:"Zakopane, „zimowa stolica Polski”, gościło mistrzostwa świata w narciarstwie klasycznym już w 1929 i 1962 roku. Wielka Krokiew od dekad jest sercem polskich skoków narciarskich.",category:"geography",year:1929,emoji:"🇵🇱"},{id:"p31",text:"Kryta pływalnia i hale sportowe długo były w Polsce rzadkością, a mimo to Polacy zdobywali medale olimpijskie w kajakarstwie i wioślarstwie — dyscyplinach trenowanych na jeziorach i rzekach niemal przez cały rok.",category:"poland",year:1980,emoji:"🛶"},{id:"we9",text:"Mecz piłkarski w Boliwii czy Ekwadorze potrafi zamienić się w test wytrzymałości — przyjezdne drużyny przylatują tam kilka dni wcześniej, by organizm zdążył przystosować się do rzadkiego powietrza.",category:"weather",year:2010,emoji:"🫁"},{id:"fa1",text:"Ojciec Richard Williams ułożył plan kariery dla Venus i Sereny, zanim jeszcze przyszły na świat. Obie siostry zostały liderkami światowego rankingu i wielokrotnymi mistrzyniami wielkoszlemowymi.",category:"families",year:2002,emoji:"👭"},{id:"fa2",text:"Bracia Klitschko — Witalij i Władimir — przez lata dzierżyli razem pasy mistrzowskie wagi ciężkiej. Obiecali matce, że nigdy ze sobą nie zawalczą, i dotrzymali słowa do końca karier.",category:"families",year:2011,emoji:"🥊"},{id:"fa3",text:"Manningowie to dynastia futbolu amerykańskiego: ojciec Archie grał w NFL, a synowie Peyton i Eli zdobyli łącznie cztery pierścienie Super Bowl. Każdy z braci wygrał po dwa.",category:"families",year:2012,emoji:"🏈"},{id:"fa4",text:"Bracia Bryan — Bob i Mike, bliźniacy jednojajowi — to najbardziej utytułowany debel w historii tenisa. Razem wygrali ponad sto turniejów i wszystkie cztery turnieje wielkoszlemowe.",category:"families",year:2014,emoji:"👯‍♂️"},{id:"fa5",text:"Trzy pokolenia Hillów w Formule 1: Graham Hill zdobył dwa tytuły mistrza świata, a jego syn Damon jeden. To jedyny przypadek w historii F1, gdy mistrzami zostali ojciec i syn.",category:"families",year:1996,emoji:"🏎️"},{id:"fa6",text:"Bracia Schleck, Andy i Fränk, wielokrotnie jechali w tej samej drużynie Tour de France. W 2011 roku obaj stanęli na podium najsłynniejszego wyścigu świata — rzadki rodzinny wyczyn.",category:"families",year:2011,emoji:"🚴"},{id:"fa7",text:"Bracia Gollobowie — Tomasz, Jacek i Krzysztof — przez lata jeździli na żużlu, a Tomasz został indywidualnym mistrzem świata. Rodzina z Bydgoszczy uchodzi za jedną z najbardziej żużlowych w Polsce.",category:"families",year:2010,emoji:"🇵🇱"},{id:"fa8",text:"Siostry Radwańskie — Agnieszka i Urszula — grały razem w deblu, w tym w reprezentacji Polski. Agnieszka doszła do finału Wimbledonu, a Urszula wygrywała juniorski Wimbledon w singlu.",category:"families",year:2007,emoji:"🎾"},{id:"v16",text:"Wysokość siatki w siatkówce mężczyzn to 2,43 m, a kobiet 2,24 m. Najlepsi atakujący sięgają w wyskoku ponad 3,5 metra — czyli wyżej niż standardowy sufit w mieszkaniu.",category:"volleyball",year:2015,emoji:"📏"},{id:"hk11",text:"Krążek hokejowy w najmocniejszych strzałach osiąga ponad 170 km/h. Bramkarze reagują na niego w ułamku sekundy, często nie widząc go wcale zza zasłony zawodników.",category:"hockey",year:2012,emoji:"⚡"},{id:"wr1",text:"W 1944 roku polscy jeńcy w Oflagu II C Woldenberg zorganizowali własne igrzyska olimpijskie. Flagę olimpijską uszyli potajemnie z podszewek koszul — dziś jest jednym z cenniejszych eksponatów polskiego sportu.",category:"war",year:1944,emoji:"🏳️"},{id:"wr2",text:"„Mecz śmierci” w okupowanym Kijowie (1942): drużyna Start złożona z piłkarzy Dynama pokonała zespół niemieckich lotników. Legenda mówi o rozstrzelaniu za zwycięstwo — historycy ustalili, że represje przyszły później i miały złożone tło.",category:"war",year:1942,emoji:"⚽"},{id:"wr3",text:"W październiku 1940 roku niemiecka bomba spadła na kort centralny Wimbledonu, niszcząc ponad tysiąc miejsc na trybunach. Turniej wrócił do gry dopiero w 1946 roku.",category:"war",year:1940,emoji:"💥"},{id:"wr4",text:"W okupowanej Warszawie działały konspiracyjne mistrzostwa piłkarskie. Grano mimo zakazu okupanta i groźby aresztowania — mecze rozgrywano na peryferyjnych boiskach, z czujkami ostrzegającymi przed patrolami.",category:"war",year:1942,emoji:"🇵🇱"},{id:"wr5",text:"Baseballowa legenda Ted Williams stracił blisko pięć sezonów kariery, służąc jako pilot myśliwca w II wojnie światowej i w Korei. Mimo to zakończył karierę wśród najlepszych pałkarzy w historii.",category:"war",year:1953,emoji:"✈️"},{id:"wr6",text:"W czasie I wojny światowej Brytyjczycy utworzyli „Batalion Piłkarzy” — 17. batalion Middlesex Regiment, do którego wstępowali zawodowi footballiści. Wielu z nich nigdy nie wróciło na boiska.",category:"war",year:1914,emoji:"🎖️"},{id:"wr7",text:"Joe Louis, mistrz świata wagi ciężkiej, zaciągnął się do armii USA i stoczył blisko sto walk pokazowych dla żołnierzy. Widziało go na żywo około dwóch milionów wojskowych.",category:"war",year:1942,emoji:"🥊"},{id:"wr8",text:"Turniej Pięciu Narodów w rugby zawieszono na czas obu wojen światowych. Z frontu I wojny nie wróciły dziesiątki reprezentantów — całe pokolenie zawodników zniknęło z boisk.",category:"war",year:1915,emoji:"🏉"},{id:"f36",text:"Pierwszy finał Pucharu Anglii na Wembley (1923) przeszedł do historii jako „finał z białym koniem”. Na stadion wdarło się kilkakrotnie więcej ludzi, niż mógł pomieścić, a boisko oczyszczał policjant na białym koniu Billym.",category:"football",year:1923,emoji:"🐴"},{id:"sd11",text:"Mistrzostwa świata w snookerze rozgrywa się w teatrze Crucible w Sheffield, który mieści zaledwie około 980 widzów. Pierwszy rząd siedzi tak blisko, że zawodnicy słyszą oddech kibiców.",category:"stadiums",year:1977,emoji:"🎭"},{id:"di1",text:"Napój Gatorade powstał w 1965 roku na Uniwersytecie Florydy — naukowcy stworzyli go dla drużyny futbolowej Gators, która słabła w upale. Stąd nazwa i cała późniejsza branża napojów izotonicznych.",category:"diet",year:1965,emoji:"🥤"},{id:"di2",text:"Przed maratonem biegacze stosują „ładowanie węglowodanów” — na kilka dni przed startem jedzą wielkie porcje makaronu i ryżu, by maksymalnie napełnić mięśnie glikogenem.",category:"diet",year:1967,emoji:"🍝"},{id:"di3",text:"Zapaśnicy sumo budują masę na gęstym gulaszu chanko-nabe. Jedzą zwykle dwa ogromne posiłki dziennie i kładą się po nich spać — to sprawdzony przez wieki sposób na przybieranie na wadze.",category:"diet",year:1900,emoji:"🍲"},{id:"di4",text:"Kolarze Tour de France odbierają jedzenie w biegu — w strefie żywieniowej łapią płócienne torby „musette” z batonami i kanapkami, zakładając je przez ramię przy prędkości kilkudziesięciu km/h.",category:"diet",year:1950,emoji:"🎒"},{id:"di5",text:"Banan to nieformalny symbol przerw w tenisie — dostarcza cukrów i potasu, które pomagają zapobiegać skurczom podczas wielogodzinnych meczów w upale.",category:"diet",year:2e3,emoji:"🍌"},{id:"di6",text:"Kofeina figurowała na liście substancji zakazanych aż do 2004 roku — po przekroczeniu limitu w moczu groziła dyskwalifikacja. Dziś jest jedynie monitorowana, a espresso przed startem to norma.",category:"diet",year:2004,emoji:"☕"},{id:"di7",text:"Usain Bolt wspominał, że podczas igrzysk w Pekinie 2008 żywił się głównie nuggetsami z kurczaka — zjadł ich w ciągu kilku dni około tysiąca kawałków, nie ufając nieznanej kuchni.",category:"diet",year:2008,emoji:"🍗"},{id:"di8",text:"W sportach walki popularne jest „zbijanie wagi” — zawodnicy odwadniają organizm przed ważeniem, by zmieścić się w kategorii, a potem w kilkanaście godzin nawadniają się z powrotem. To jedna z najbardziej ryzykownych praktyk w sporcie.",category:"diet",year:2015,emoji:"⚖️"},{id:"sci10",text:"W akademiach sportowych działa „efekt wieku względnego” — dzieci urodzone tuż po granicznej dacie rocznika są starsze i silniejsze od rówieśników, więc częściej trafiają do kadr. Wśród zawodowców widać nadreprezentację urodzonych na początku roku.",category:"science",year:1985,emoji:"📅"},{id:"bd9",text:"Badania nad koszykarzami wykazały, że wydłużenie snu do około 10 godzin na dobę wyraźnie poprawiło ich szybkość i skuteczność rzutów. Sen bywa dziś traktowany jako element treningu na równi z siłownią.",category:"body",year:2011,emoji:"😴"},{id:"ar1",text:"Przez pierwsze dekady futbolu na boisku nie było sędziego — spory rozstrzygali między sobą kapitanowie, a dwaj arbitrzy stali poza liniami. Sędzia wszedł na murawę z gwizdkiem dopiero pod koniec XIX wieku.",category:"referees",year:1891,emoji:"🧍"},{id:"ar2",text:"Zanim upowszechnił się gwizdek, sędziowie przerywali grę, machając białą chusteczką albo po prostu krzycząc. Pierwsze gwizdki pojawiły się na angielskich boiskach w latach 70. XIX wieku.",category:"referees",year:1878,emoji:"📢"},{id:"ar3",text:"Pierluigi Collina, sześciokrotnie wybierany najlepszym sędzią świata, stracił włosy w wieku dwudziestu kilku lat z powodu łysienia plackowatego. Charakterystyczny wygląd i spojrzenie uczyniły go najbardziej rozpoznawalnym arbitrem w historii.",category:"referees",year:2002,emoji:"👀"},{id:"ar4",text:"Sędzia piłkarski przebiega w meczu zwykle 10–12 km — czasem więcej niż niejeden zawodnik. Arbitrzy najwyższych lig muszą regularnie zdawać testy sprawnościowe, by w ogóle dostać wyznaczenie na mecz.",category:"referees",year:2015,emoji:"🏃"},{id:"ar5",text:"Mecz futbolu amerykańskiego obsługuje siedmioosobowa ekipa sędziowska, w której każdy ma osobną funkcję i nazwę — od głównego arbitra po sędziów pilnujących linii i tyłów pola gry.",category:"referees",year:2010,emoji:"🏈"},{id:"ar6",text:"Angielscy sędziowie piłkarscy zostali zawodowcami dopiero w 2001 roku. Wcześniej prowadzili mecze Premier League po godzinach — na co dzień pracując jako nauczyciele, strażacy czy urzędnicy.",category:"referees",year:2001,emoji:"💼"},{id:"ar7",text:"Siatkówka to jedyny popularny sport, w którym sędzia główny stoi na podwyższeniu ponad siatką, patrząc na grę z góry. Drugi arbiter pracuje po przeciwnej stronie, tuż przy słupku.",category:"referees",year:1960,emoji:"🪜"},{id:"ar8",text:"Sędziowie krykieta porozumiewają się z widzami i zawodnikami całym słownikiem gestów — uniesione ręce oznaczają sześć punktów, a wyciągnięty palec wskazujący wyeliminowanie pałkarza. Na boisku spędzają nawet kilka dni jednego meczu.",category:"referees",year:1900,emoji:"☝️"},{id:"f37",text:"Rzut karny wprowadzono do futbolu w 1891 roku i początkowo nazywano go „karą śmierci”. Część zawodników uznała pomysł za obraźliwy — twierdzili, że dżentelmen nigdy nie faulowałby celowo.",category:"football",year:1891,emoji:"⚰️"},{id:"ce10",text:"Podczas ceremonii otwarcia igrzysk przysięgę olimpijską składają nie tylko sportowcy — od 1972 roku dołączyli do nich sędziowie, a później także trenerzy. Każdy ślubuje przestrzegać zasad fair play.",category:"ceremonies",year:1972,emoji:"🤞"},{id:"tg1",text:"W 1949 roku samolot wiozący Grande Torino — mistrzów Włoch i trzon reprezentacji — rozbił się o wzgórze Superga pod Turynem. Klub stracił całą drużynę, a włoski futbol na lata swoją czołówkę.",category:"tragedies",year:1949,emoji:"✈️"},{id:"tg2",text:"Katastrofa monachijska 1958: samolot z młodą drużyną Manchesteru United rozbił się przy starcie. Zginęło 23 osoby, w tym ośmiu piłkarzy. Matt Busby przeżył i dziesięć lat później poprowadził odbudowany zespół po Puchar Europy.",category:"tragedies",year:1958,emoji:"🕯️"},{id:"tg3",text:"Wypadek podczas 24h Le Mans w 1955 roku pochłonął ponad 80 ofiar wśród widzów — to najtragiczniejsze zdarzenie w historii sportów motorowych. Mercedes wycofał się z wyścigów na dekady, a Szwajcaria zakazała wyścigów kołowych na ponad pół wieku.",category:"tragedies",year:1955,emoji:"🏁"},{id:"tg4",text:"Tragedia na Heysel w 1985 roku, przed finałem Pucharu Europy, kosztowała życie 39 osób. Angielskie kluby zostały wykluczone z europejskich pucharów na pięć lat.",category:"tragedies",year:1985,emoji:"🖤"},{id:"tg5",text:"Po katastrofie na Hillsborough (1989) raport Taylora zmienił brytyjski futbol — stadiony najwyższych lig przebudowano wyłącznie na miejsca siedzące, a bezpieczeństwo kibiców stało się priorytetem.",category:"tragedies",year:1989,emoji:"📋"},{id:"tg6",text:"W 2016 roku samolot z piłkarzami Chapecoense rozbił się w Kolumbii w drodze na finał Copa Sudamericana. Rywale z Atlético Nacional poprosili federację, by tytuł przyznano brazylijskiemu klubowi.",category:"tragedies",year:2016,emoji:"🤍"},{id:"tg7",text:"W 2011 roku w katastrofie lotniczej pod Jarosławiem zginęła niemal cała drużyna hokejowa Łokomotiwu. Kluby z całego świata oddawały jej hołd, a liga KHL wstrzymała rozgrywki.",category:"tragedies",year:2011,emoji:"🏒"},{id:"tg8",text:"W 1993 roku w katastrofie lotniczej zginęła prawie cała reprezentacja Zambii. Kraj odbudował drużynę od podstaw i w 2012 roku sięgnął po mistrzostwo Afryki — w finale rozegranym niedaleko miejsca katastrofy.",category:"tragedies",year:2012,emoji:"🇿🇲"},{id:"sd12",text:"Przebudowany Santiago Bernabéu ma murawę dzieloną na segmenty, które chowa się pod stadionem. Boisko „znika” w kilka godzin, robiąc miejsce koncertom i innym imprezom.",category:"stadiums",year:2023,emoji:"🌱"},{id:"ce11",text:"Minutę ciszy coraz częściej zastępuje minuta oklasków. Powód jest praktyczny: gorące brawa trudniej zakłócić pojedynczym okrzykiem z trybun, a hołd pozostaje równie wymowny.",category:"ceremonies",year:2e3,emoji:"👏"},{id:"fp1",text:"Medal Pierre'a de Coubertina to najwyższe olimpijskie wyróżnienie za postawę fair play. Przyznawany jest tak rzadko, że w całej historii otrzymało go mniej osób, niż zdobywa złoto na jednych igrzyskach.",category:"fairplay",year:1964,emoji:"🎖️"},{id:"fp2",text:"Włoch Eugenio Monti na igrzyskach 1964 pożyczył rywalom brakującą śrubę do bobsleja. Brytyjczycy pojechali jego częścią po złoto, a on sam skończył z brązem — i jako pierwszy w historii otrzymał medal Coubertina.",category:"fairplay",year:1964,emoji:"🔩"},{id:"fp3",text:"Kanadyjski żeglarz Lawrence Lemieux prowadził w wyścigu na igrzyskach 1988, gdy zauważył wywróconą łódź rywali. Porzucił rywalizację, by ich uratować — MKOl uhonorował go medalem za fair play.",category:"fairplay",year:1988,emoji:"⛵"},{id:"fp4",text:"Paolo Di Canio miał przed sobą pustą bramkę, ale bramkarz rywali leżał kontuzjowany. Zamiast strzelać, złapał piłkę w ręce i przerwał akcję — za ten gest dostał nagrodę fair play FIFA.",category:"fairplay",year:2e3,emoji:"🙌"},{id:"fp5",text:"Na igrzyskach 2016 Abbey D'Agostino i Nikki Hamblin zderzyły się w biegu na 5000 m. Zamiast walczyć o awans, pomogły sobie wstać i wspólnie dobiegły do mety — obie uhonorowano nagrodą fair play.",category:"fairplay",year:2016,emoji:"🫂"},{id:"fp6",text:"Hiszpan Iván Fernández Anaya mógł łatwo wyprzedzić Kenijczyka, który zatrzymał się przed metą, myśląc, że bieg już skończył. Zamiast tego zwolnił i gestami wskazał rywalowi właściwą linię mety.",category:"fairplay",year:2012,emoji:"👉"},{id:"fp7",text:"Golf to sport, w którym zawodnik sam zgłasza własne przewinienia. Bobby Jones przyznał w 1925 roku, że nieumyślnie poruszył piłkę — kara kosztowała go zwycięstwo w US Open. Skomentował: „Równie dobrze można chwalić kogoś za to, że nie okradł banku”.",category:"fairplay",year:1925,emoji:"⛳"},{id:"fp8",text:"Dick Hoyt przebiegł z synem Rickiem, poruszającym się na wózku, ponad tysiąc zawodów — maratonów i triathlonów Ironman. Ojciec biegł, pchając wózek, płynął, holując ponton, i jechał na rowerze z synem z przodu.",category:"fairplay",year:1989,emoji:"❤️"},{id:"rg13",text:"W rugby z sędzią może rozmawiać wyłącznie kapitan, a zawodnicy zwracają się do arbitra „sir”. Kwestionowanie decyzji karze się natychmiastowym przesunięciem rzutu o 10 metrów.",category:"rugby",year:1990,emoji:"🎩"},{id:"t28",text:"Tenisowa etykieta nakazuje unieść rękę i przeprosić rywala za punkt zdobyty po szczęśliwym odbiciu piłki od taśmy. Nikt tego nie wymaga przepisami — to zwyczaj przekazywany z pokolenia na pokolenie.",category:"tennis",year:1980,emoji:"🙏"},{id:"cg1",text:"„March Madness” — akademicki turniej koszykówki w USA — to narodowa obsesja typowania. Szansa na bezbłędne wytypowanie całej drabinki jest astronomicznie mała, a mimo to wypełniają ją dziesiątki milionów ludzi.",category:"college",year:1939,emoji:"📋"},{id:"cg2",text:"Przez dekady amerykańscy zawodnicy akademiccy nie mogli zarobić ani centa na własnym nazwisku. Dopiero od 2021 roku wolno im czerpać dochody z wizerunku — niektórzy zarabiają dziś więcej niż zawodowcy.",category:"college",year:2021,emoji:"💵"},{id:"cg3",text:"Rose Bowl, rozgrywany od 1902 roku, to najstarszy mecz pucharowy akademickiego futbolu w USA. Nazywany jest „dziadkiem wszystkich bowli”.",category:"college",year:1902,emoji:"🌹"},{id:"cg4",text:"Michigan Stadium, zwany „The Big House”, mieści ponad 107 tysięcy widzów — więcej niż niejeden stadion zawodowy. To zwykły uniwersytecki obiekt, na którym grają studenci.",category:"college",year:1927,emoji:"🏟️"},{id:"cg5",text:"Stypendia sportowe to w USA realna droga na studia — uczelnie przyznają ich rokrocznie dziesiątki tysięcy, często pokrywając całe czesne w zamian za grę w barwach szkoły.",category:"college",year:1950,emoji:"🎓"},{id:"cg6",text:"Uniwersjada, czyli igrzyska studenckie, to jedna z największych multidyscyplinarnych imprez świata — startuje w niej często więcej sportowców niż na zimowych igrzyskach olimpijskich.",category:"college",year:1959,emoji:"🌍"},{id:"cg7",text:"Akademicki Związek Sportowy powstał w Krakowie w 1909 roku i jest jedną z najstarszych działających organizacji studenckich w Polsce. Z jego klubów wyszło wielu polskich olimpijczyków.",category:"college",year:1909,emoji:"🇵🇱"},{id:"cg8",text:"Japońska sztafeta akademicka Hakone Ekiden — dwudniowy bieg na ponad 200 km — przyciąga przed telewizory miliony Japończyków. Dla wielu studentów udział w niej to szczyt sportowych marzeń.",category:"college",year:1920,emoji:"🎌"},{id:"mo9",text:"Prawa telewizyjne do akademickiego turnieju koszykówki w USA warte są miliardy dolarów — mimo że przez większość historii występujący w nim zawodnicy nie dostawali za grę wynagrodzenia.",category:"money",year:2010,emoji:"📺"},{id:"p30",text:"Zakopane dwukrotnie gościło zimową Uniwersjadę — w 1993 i 2001 roku. Dla polskich sportów zimowych były to jedne z największych imprez międzynarodowych organizowanych w kraju.",category:"poland",year:2001,emoji:"🏔️"},{id:"sl1",text:"George Weah, jedyny afrykański zdobywca Złotej Piłki, po zakończeniu kariery wszedł do polityki i został prezydentem Liberii. Wcześniej finansował z własnej kieszeni występy reprezentacji swojego kraju.",category:"secondlife",year:2018,emoji:"🇱🇷"},{id:"sl2",text:"Imran Khan poprowadził Pakistan do mistrzostwa świata w krykiecie w 1992 roku, a ćwierć wieku później został premierem tego kraju. Po drodze zbudował szpital onkologiczny imienia swojej matki.",category:"secondlife",year:2018,emoji:"🏏"},{id:"sl3",text:"Arnold Schwarzenegger siedmiokrotnie wygrał najważniejszy konkurs kulturystyczny świata, potem został gwiazdą Hollywood, a na koniec — gubernatorem Kalifornii. Trzy kariery, każda na szczycie.",category:"secondlife",year:2003,emoji:"💪"},{id:"sl4",text:"Witalij Kliczko, mistrz świata wagi ciężkiej z doktoratem z nauk o sporcie, po karierze bokserskiej został merem Kijowa. W ringu nazywano go „Dr Żelazna Pięść”.",category:"secondlife",year:2014,emoji:"🏛️"},{id:"sl5",text:"Sebastian Coe, dwukrotny mistrz olimpijski w biegu na 1500 m, pokierował organizacją igrzysk w Londynie 2012, a później stanął na czele światowej federacji lekkoatletycznej.",category:"secondlife",year:2012,emoji:"🎽"},{id:"sl6",text:"Shaquille O'Neal po karierze w NBA obronił doktorat z edukacji, pracował jako zastępca szeryfa i występował jako DJ. Sam mówił, że nie chce być pamiętany wyłącznie jako koszykarz.",category:"secondlife",year:2012,emoji:"🎧"},{id:"sl7",text:"Jerzy Kulej, jedyny polski bokser z dwoma złotymi medalami olimpijskimi, po zakończeniu kariery został posłem na Sejm. Do końca życia pozostał też barwnym komentatorem sportowym.",category:"secondlife",year:2001,emoji:"🇵🇱"},{id:"sl8",text:"Eric Cantona, gwiazda Manchesteru United, po zakończeniu kariery zajął się aktorstwem — grał w filmach uznanych reżyserów i występował na scenie teatralnej.",category:"secondlife",year:2009,emoji:"🎬"},{id:"o44",text:"Amerykanin Eddie Eagan to jedyny człowiek w historii ze złotem letnich i zimowych igrzysk w dwóch różnych dyscyplinach — wygrał boks w 1920 roku i bobsleje w 1932.",category:"olympics",year:1932,emoji:"🥇"},{id:"r22",text:"Kanadyjka Clara Hughes zdobywała medale olimpijskie zarówno w kolarstwie na letnich igrzyskach, jak i w łyżwiarstwie szybkim na zimowych. To wyczyn, którego dokonała garstka sportowców w historii.",category:"records",year:2006,emoji:"🔀"},{id:"ma1",text:"Półfinał mundialu 1970 Włochy–RFN (4:3) nazwano „meczem stulecia” — w samej dogrywce padło pięć goli. Na Estadio Azteca do dziś wisi tablica upamiętniająca to spotkanie.",category:"matches",year:1970,emoji:"🇮🇹"},{id:"ma2",text:"Finał Wimbledonu 1980: w tie-breaku czwartego seta John McEnroe obronił kilka piłek meczowych i wygrał go 18:16. Björn Borg i tak sięgnął po tytuł w piątej partii — to wciąż jeden z najsłynniejszych meczów w historii tenisa.",category:"matches",year:1980,emoji:"🎾"},{id:"ma3",text:"Summit Series 1972 — hokejowy pojedynek Kanady z ZSRR w szczycie zimnej wojny. O losach rywalizacji zdecydował gol Paula Hendersona w ostatniej minucie ostatniego meczu.",category:"matches",year:1972,emoji:"🏒"},{id:"ma4",text:"Szósty mecz baseballowej World Series 1975: Carlton Fisk po uderzeniu machał rękami, „prosząc” lecącą piłkę, by nie wyszła na aut. Ujęcie jego gestów zmieniło sposób, w jaki telewizja pokazuje sport.",category:"matches",year:1975,emoji:"⚾"},{id:"ma5",text:"Finał Ligi Mistrzów 1999: Manchester United przegrywał z Bayernem do 90. minuty, po czym strzelił dwa gole w doliczonym czasie. Zdobył potrójną koronę w trzy dramatyczne minuty.",category:"matches",year:1999,emoji:"⏰"},{id:"ma6",text:"„La Remontada” 2017: Barcelona przegrywała z PSG 0:4 z pierwszego meczu, a w rewanżu wygrała 6:1, strzelając trzy gole w ostatnich minutach. To jedyny taki powrót w historii Ligi Mistrzów.",category:"matches",year:2017,emoji:"🔥"},{id:"ma7",text:"Podczas meczu o mistrzostwo świata w szachach 1972 Boris Spasski po przegranej szóstej partii wstał i bił brawo Bobby'emu Fischerowi. Ten gest przeszedł do historii jako symbol sportowego szacunku.",category:"matches",year:1972,emoji:"👏"},{id:"ma8",text:"„Flu Game” 1997: chory i ledwo trzymający się na nogach Michael Jordan zdobył 38 punktów w finałach NBA, a po ostatniej akcji osunął się w ramiona kolegi z drużyny.",category:"matches",year:1997,emoji:"🤒"},{id:"f38",text:"Steaua Bukareszt przeszła 104 ligowe mecze z rzędu bez porażki (1986–1989) — to jedna z najdłuższych takich serii w historii europejskiego futbolu.",category:"football",year:1989,emoji:"🇷🇴"},{id:"b24",text:"Golden State Warriors wygrali w sezonie 2015/16 rekordowe 73 mecze — więcej niż słynne Chicago Bulls Jordana. Mimo to przegrali finał NBA, tracąc prowadzenie 3:1 w serii.",category:"basketball",year:2016,emoji:"📉"},{id:"der1",text:"Słowo „derby” przywędrowało do sportu z Anglii — od słynnej gonitwy konnej The Derby, nazwanej z kolei na cześć lorda Derby. Dziś oznacza mecz odwiecznych rywali z jednego miasta lub regionu.",category:"derbies",year:1780,emoji:"🐎"},{id:"der2",text:"Superclásico Boca Juniors–River Plate uchodzi za najgorętszy mecz klubowy świata. W dniu spotkania życie w Buenos Aires praktycznie zamiera, a atmosfera na trybunach bywa opisywana jako ogłuszająca.",category:"derbies",year:1913,emoji:"🇦🇷"},{id:"der3",text:"Old Firm — derby Celticu i Rangers — rozgrywane są od końca XIX wieku i od zawsze mają podtekst religijny: katolickie korzenie Celticu kontra protestanckie Rangers. To jedne z najstarszych derbów świata.",category:"derbies",year:1888,emoji:"🏴󠁧󠁢󠁳󠁣󠁴󠁿"},{id:"der4",text:"El Clásico Realu z Barceloną to najczęściej oglądany mecz klubowy na świecie — transmisje śledzą setki milionów widzów na wszystkich kontynentach.",category:"derbies",year:1902,emoji:"📺"},{id:"der5",text:"Inter powstał w 1908 roku z rozłamu w Milanie — założyciele chcieli klubu otwartego na obcokrajowców, stąd nazwa „Internazionale”. Od tamtej pory oba kluby dzielą jeden stadion i wieczną rywalizację.",category:"derbies",year:1908,emoji:"🔵"},{id:"der6",text:"Derby Rzymu dzielą miasto na pół: Roma tradycyjnie kojarzona jest z centrum i klasą robotniczą, Lazio z przedmieściami i regionem. Mecz bywa nazywany „derby stolicy” i paraliżuje miasto.",category:"derbies",year:1929,emoji:"🐺"},{id:"der7",text:"Derby Stambułu Galatasaray–Fenerbahçe to jedyne wielkie derby rozgrywane między dwoma kontynentami — jeden klub ma siedzibę po europejskiej, drugi po azjatyckiej stronie Bosforu.",category:"derbies",year:1909,emoji:"🌉"},{id:"der8",text:"Wielkie Derby Śląska — Górnik Zabrze kontra Ruch Chorzów — to spotkanie dwóch najbardziej utytułowanych klubów PRL-u. Oba zdobyły po kilkanaście mistrzostw Polski i przez dekady dzieliły region.",category:"derbies",year:1960,emoji:"🇵🇱"},{id:"hk12",text:"Przez ćwierć wieku (1942–1967) liga NHL składała się z zaledwie sześciu drużyn, zwanych dziś „Original Six”. Dostać się do niej było niemal niemożliwe — miejsc w składach było w całej lidze około stu.",category:"hockey",year:1942,emoji:"6️⃣"},{id:"fn9",text:"„Wieczne derby” Crvenej zvezdy z Partizanem w Belgradzie słyną z gigantycznych opraw — race, transparenty na całą trybunę i dymne kurtyny sprawiają, że mecz bywa przerywany z powodu ograniczonej widoczności.",category:"fans",year:1947,emoji:"🎆"},{id:"nu1",text:"Kultowa „dziesiątka” zawdzięcza status przypadkowi: przed mundialem 1958 Brazylia nie zgłosiła numerów na czas, więc FIFA rozdała je losowo. Numer 10 trafił do młodziutkiego Pelégo — i stał się symbolem gwiazdy zespołu.",category:"numbers",year:1958,emoji:"🔟"},{id:"nu2",text:"Michael Jordan wybrał numer 23, bo była to mniej więcej połowa z 45 — numeru noszonego przez jego starszego brata, którego chciał dorównać. Dziś „23” to jeden z najbardziej rozpoznawalnych numerów w sporcie.",category:"numbers",year:1984,emoji:"🐐"},{id:"nu3",text:"W amerykańskiej koszykówce akademickiej przez dekady nie wolno było używać cyfr od 6 do 9. Powód był praktyczny: sędziowie zgłaszają numer zawodnika, pokazując go na palcach jednej ręki.",category:"numbers",year:1957,emoji:"✋"},{id:"nu4",text:"W rugby numer nie jest kwestią gustu — od 1 do 15 ściśle odpowiada pozycji na boisku. Patrząc na plecy zawodnika, od razu wiadomo, czy jest młynarzem, łącznikiem czy skrzydłowym.",category:"numbers",year:1950,emoji:"🏉"},{id:"nu5",text:"Numer 13 bywa omijany przez zabobonnych sportowców, ale niektórzy zrobili z niego znak firmowy — nosili go m.in. wielki niemiecki snajper Gerd Müller i włoski obrońca Alessandro Nesta.",category:"numbers",year:1970,emoji:"1️⃣"},{id:"nu6",text:"Kolarze uważają numer startowy 13 za pechowy, więc tradycyjnie przypinają go do koszulki... do góry nogami. To jeden z najbardziej widocznych zabobonów w peletonie.",category:"numbers",year:1930,emoji:"🔄"},{id:"nu7",text:"Numer 42 Jackiego Robinsona, który przełamał barierę rasową w baseballu, jest zastrzeżony we wszystkich klubach ligi MLB. Raz w roku, w Dniu Robinsona, wszyscy zawodnicy grają właśnie z „42”.",category:"numbers",year:1997,emoji:"🕊️"},{id:"nu8",text:"Bramkarz niemal zawsze nosi „jedynkę”, bo dawne numery przypisywano według pozycji — zaczynając od tyłu. Zwyczaj przetrwał, choć numeracja pozycyjna dawno odeszła do lamusa.",category:"numbers",year:1939,emoji:"🧤"},{id:"f39",text:"Kluby potrafią zastrzegać numery na cześć legend: Napoli wycofało „dziesiątkę” Maradony, a Milan „szóstkę” Baresiego i „trójkę” Maldiniego — ta ostatnia czeka na ewentualny powrót kogoś z rodziny.",category:"football",year:2e3,emoji:"🚫"},{id:"r23",text:"Edwin van der Sar zachował czyste konto przez 1311 minut ligowych z rzędu — ponad czternaście meczów bez straty gola. To wciąż rekord angielskiej Premier League.",category:"records",year:2009,emoji:"🧱"},{id:"gk1",text:"René Higuita na Wembley w 1995 roku obronił piłkę „skorpionem” — rzucił się do przodu i wybił ją piętami zza pleców. Ta interwencja przeszła do historii jako najbardziej ekstrawagancka parada świata.",category:"goalkeepers",year:1995,emoji:"🦂"},{id:"gk2",text:"Lwa Jaszyna nazywano „Czarną Panterą”, bo zawsze grał w całkowicie czarnym stroju. Był też pionierem nowoczesnego bronienia — wychodził poza pole karne i dyrygował obroną, co wtedy uchodziło za ekscentryzm.",category:"goalkeepers",year:1963,emoji:"🐆"},{id:"gk3",text:"Bramkarze grają najdłużej ze wszystkich piłkarzy — Gianluigi Buffon bronił zawodowo jeszcze po czterdziestce, kończąc karierę po ponad 1000 oficjalnych meczów.",category:"goalkeepers",year:2023,emoji:"⏳"},{id:"gk4",text:"Przy rzucie karnym piłka leci do bramki w około 0,3 sekundy — za krótko, by zdążyć zareagować po strzale. Dlatego bramkarze zwykle wybierają stronę wcześniej, czytając ustawienie ciała strzelca.",category:"goalkeepers",year:2010,emoji:"⚡"},{id:"gk5",text:"Meksykanin Jorge Campos sam projektował swoje jaskrawe stroje, a przy niskim jak na bramkarza wzroście nadrabiał refleksem. Bywało, że w tym samym sezonie grał również jako napastnik i strzelał gole.",category:"goalkeepers",year:1994,emoji:"🎨"},{id:"gk6",text:"Maski hokejowych bramkarzy to osobna dziedzina sztuki — każdy zamawia własny malunek, często z motywem klubu, rodziny albo prywatnych żartów. Dwie identyczne maski praktycznie nie istnieją.",category:"goalkeepers",year:1970,emoji:"🎭"},{id:"gk7",text:"Bramkarze rzadko dostają wielkie indywidualne nagrody, więc w 2019 roku ustanowiono osobne trofeum ich imienia — Nagrodę Lwa Jaszyna dla najlepszego golkipera świata.",category:"goalkeepers",year:2019,emoji:"🏆"},{id:"gk8",text:"Gdy drużyna wyczerpie zmiany, a bramkarz dozna kontuzji, do bramki musi stanąć zawodnik z pola. W najwyższych ligach zdarzało się to wielokrotnie — z reguły kończyło się festiwalem goli.",category:"goalkeepers",year:2e3,emoji:"🙈"},{id:"hk13",text:"Bramkarz hokejowy też może zdobyć gola — jeśli rywale grają bez golkipera, wystarczy celny wyrzut przez całe lodowisko. W historii NHL udało się to zaledwie kilkunastu bramkarzom.",category:"hockey",year:1979,emoji:"🥅"},{id:"hb12",text:"W piłce ręcznej bramkarz bywa też strzelcem — gdy rywale grają bez swojego golkipera, wystarczy rzut przez całe boisko do pustej bramki. Takie gole padają w każdym sezonie.",category:"handball",year:2016,emoji:"🎯"},{id:"su1",text:"Podczas serii zwycięstw wielu sportowców nie zmienia „szczęśliwych” elementów stroju — skarpet, koszulek czy ochraniaczy. Zabobon każe czekać z praniem do pierwszej porażki.",category:"superstitions",year:1990,emoji:"🧦"},{id:"su2",text:"Hokeiści nie golą się przez całą fazę play-off — „playoff beard” to tradycja z lat 80., którą przejęły z czasem inne dyscypliny. Brody rosną aż do zdobycia lub utraty pucharu.",category:"superstitions",year:1980,emoji:"🧔"},{id:"su3",text:"W baseballu obowiązuje żelazne tabu: gdy miotacz jest bliski meczu bez żadnego celnego odbicia rywali, nikt w drużynie ani na ławce nie mówi o tym na głos. Wspomnienie tego miałoby zapeszyć.",category:"superstitions",year:1950,emoji:"🤐"},{id:"su4",text:"Michael Jordan przez całą karierę w NBA nosił pod spodniami szorty ze swojego uniwersytetu. To dlatego jego stroje w Chicago szyto luźniejsze niż standardowe.",category:"superstitions",year:1991,emoji:"🩳"},{id:"su5",text:"Tenisiści mają całe rytuały: określona liczba odbić piłki przed serwisem, unikanie nadeptywania na linie, poprawianie strun w tej samej kolejności. Powtarzalność uspokaja i pomaga w koncentracji.",category:"superstitions",year:2005,emoji:"🎾"},{id:"su6",text:"Piłkarze wchodzą na murawę zawsze tą samą nogą, dotykają trawy albo żegnają się w tunelu. Niektórzy szatnię opuszczają jako ostatni — i tylko po odklepaniu ustalonej sekwencji gestów.",category:"superstitions",year:2e3,emoji:"👞"},{id:"su7",text:"Hokeiści z zasady nie dotykają trofeów za wygranie konferencji — uważają, że jedynym pucharem wartym podniesienia jest ten główny. Kapitanowie omijają je wzrokiem podczas ceremonii.",category:"superstitions",year:1995,emoji:"🙅"},{id:"su8",text:"Björn Borg nie golił się przez cały Wimbledon, a jego pięć kolejnych tytułów sprawiło, że „turniejowa broda” stała się modą wśród tenisistów.",category:"superstitions",year:1980,emoji:"🪒"},{id:"r24",text:"„Klątwa Bambino”: po sprzedaży Babe'a Rutha do rywali Boston Red Sox nie zdobyli mistrzostwa przez 86 lat. Passa skończyła się dopiero w 2004 roku.",category:"records",year:2004,emoji:"😱"},{id:"fn10",text:"Kibice Chicago Cubs przez dekady wierzyli w „klątwę kozła” — rzuconą podobno w 1945 roku przez wyproszonego ze stadionu właściciela zwierzęcia. Klub czekał na mistrzostwo 108 lat.",category:"fans",year:2016,emoji:"🐐"},{id:"as1",text:"Sumo ma ponad tysiącletnią tradycję, a pojedyncza walka trwa zwykle kilka sekund. Znacznie dłużej ciągną się poprzedzające ją ceremonie — tupanie, sól i mierzenie się wzrokiem.",category:"asia",emoji:"🤼"},{id:"as2",text:"Chińscy skoczkowie do wody dominują na igrzyskach tak bardzo, że na wielu z nich zdobywali niemal komplet złotych medali w swojej dyscyplinie.",category:"asia",year:2021,emoji:"🤿"},{id:"as3",text:"Japoński licealny turniej baseballu Koshien elektryzuje cały kraj. Przegrani zabierają z boiska garść ziemi na pamiątkę — to jeden z najbardziej wzruszających rytuałów w sporcie.",category:"asia",year:1915,emoji:"⚾"},{id:"as4",text:"Mongolskie święto Naadam to zawody w trzech „męskich sportach”: zapasach, łucznictwie i wyścigach konnych. Tradycja jest tak stara i ważna, że trafiła na listę dziedzictwa UNESCO.",category:"asia",year:2010,emoji:"🏹"},{id:"as5",text:"Walkę muay thai poprzedza wai khru — taniec, którym zawodnik oddaje hołd nauczycielowi i rodzinie. Bez tej ceremonii pojedynek w Tajlandii w ogóle się nie zaczyna.",category:"asia",year:1900,emoji:"🙏"},{id:"as6",text:"Filipiny oszalały na punkcie koszykówki mimo niskiej średniej wzrostu mieszkańców. Boiska stoją w każdej wiosce, a tamtejsza liga zawodowa jest jedną z najstarszych poza USA.",category:"asia",year:1975,emoji:"🏀"},{id:"as7",text:"Irański zurkhaneh, „dom siły”, to starożytna forma treningu z ciężkimi drewnianymi maczugami, wykonywana w rytm bębna i recytacji. Praktyka figuruje na liście dziedzictwa UNESCO.",category:"asia",year:2010,emoji:"🪘"},{id:"as8",text:"W Indonezji badminton jest sportem narodowym — to właśnie w nim kraj zdobywa większość swoich medali olimpijskich, a finały ogląda cały archipelag.",category:"asia",year:1992,emoji:"🏸"},{id:"sd13",text:"Największy stadion krykieta świata — Narendra Modi Stadium w Ahmedabadzie — mieści około 132 tysięcy widzów. To jeden z największych obiektów sportowych na Ziemi.",category:"stadiums",year:2020,emoji:"🏏"},{id:"o45",text:"Igrzyska Azjatyckie to druga co do wielkości impreza multidyscyplinarna świata po olimpiadzie — startuje w nich kilkanaście tysięcy sportowców z ponad czterdziestu państw.",category:"olympics",year:1951,emoji:"🌏"},{id:"hf1",text:"Koszykarska Galeria Sław nosi imię Jamesa Naismitha — twórcy dyscypliny. Mieści się w Springfield, w mieście, w którym w 1891 roku rozegrano pierwszy mecz koszykówki w historii.",category:"halls",year:1968,emoji:"🏀"},{id:"hf2",text:"Hokejowa Galeria Sław w Toronto przechowuje oryginalny Puchar Stanleya. Kibice mogą go dotknąć i zrobić sobie z nim zdjęcie — inaczej niż zawodnicy, dla których to zabobon nie do pomyślenia przed wygraną.",category:"halls",year:1943,emoji:"🏆"},{id:"hf3",text:"Baseballowa Galeria Sław stoi w Cooperstown, bo według dawnej legendy właśnie tam wymyślono baseball. Historycy dawno obalili tę opowieść, ale muzeum zostało na miejscu.",category:"halls",year:1939,emoji:"⚾"},{id:"hf4",text:"Muzeum FIFA w Zurychu prezentuje koszulki wszystkich reprezentacji świata na jednej ścianie. Obok stoi oryginalny Puchar Świata — pilnowany jak największy skarb futbolu.",category:"halls",year:2016,emoji:"⚽"},{id:"hf5",text:"Muzeum Sportu i Turystyki w Warszawie gromadzi pamiątki polskich olimpijczyków — od medali po sprzęt legend. To największa taka kolekcja w kraju.",category:"halls",year:1952,emoji:"🇵🇱"},{id:"hf6",text:"Muzeum Olimpijskie w Lozannie stoi nad Jeziorem Genewskim, w mieście będącym siedzibą MKOl. W jego ogrodach ustawiono bieżnię i tor, na których każdy może zmierzyć się z wynikami mistrzów.",category:"halls",year:1993,emoji:"🏛️"},{id:"hf7",text:"Tenisowa Galeria Sław w Newport ma własne korty trawiaste, na których do niedawna rozgrywano turniej zawodowy. Zwiedzający mogą pograć w miejscu, gdzie honoruje się legendy dyscypliny.",category:"halls",year:1954,emoji:"🎾"},{id:"hf8",text:"O przyjęciu do galerii sław zwykle decyduje głosowanie dziennikarzy lub kapituły. Bywa, że wybitni zawodnicy czekają na nominację całe dekady — a niektórzy nie doczekali jej za życia.",category:"halls",year:1980,emoji:"🗳️"},{id:"cu11",text:"Dokument „The Last Dance” o ostatnim sezonie Michaela Jordana w Chicago bił rekordy oglądalności w czasie pandemii — dla wielu młodych kibiców był pierwszym spotkaniem z legendą lat 90.",category:"culture",year:2020,emoji:"🎬"},{id:"mo10",text:"Rynek pamiątek sportowych sięga dziś dziesiątek milionów dolarów za pojedynczy przedmiot — najdroższe karty kolekcjonerskie i koszulki gwiazd sprzedawano za kwoty porównywalne z dziełami sztuki.",category:"money",year:2022,emoji:"💎"},{id:"sp1",text:"Piłka golfowa po uderzeniu driverem najlepszych zawodników osiąga prędkość przekraczającą 320 km/h — szybciej niż samochód wyścigowy na prostej.",category:"speed",year:2020,emoji:"⛳"},{id:"sp2",text:"W narciarstwie szybkim zawodnicy zjeżdżają specjalnie przygotowanym stokiem z prędkością przekraczającą 250 km/h. To najszybsza dyscyplina uprawiana bez silnika.",category:"speed",year:2016,emoji:"⛷️"},{id:"sp3",text:"Spadochroniarz w swobodnym spadaniu osiąga około 200 km/h, a w pozycji nurkowej — ponad 300 km/h. Zawodnicy skydivingu rywalizują w formacjach układanych przy takiej właśnie prędkości.",category:"speed",year:2010,emoji:"🪂"},{id:"sp4",text:"Rekord prędkości na rowerze — blisko 300 km/h — ustanowiono za osłoną aerodynamiczną holowanego pojazdu. Amerykanka Denise Mueller-Korenek pedałowała wtedy na specjalnie zbudowanej maszynie.",category:"speed",year:2018,emoji:"🚴"},{id:"sp5",text:"Najszybszy zarejestrowany rzut w baseballu przekroczył 105 mil na godzinę, czyli około 170 km/h. Pałkarz ma wtedy na decyzję mniej niż pół sekundy.",category:"speed",year:2010,emoji:"⚾"},{id:"sp6",text:"Bolidy Formuły 1 osiągają w kwalifikacjach ponad 370 km/h, ale i tak wyprzedzają je dragstery Top Fuel — te rozpędzają się do ponad 500 km/h w mniej niż cztery sekundy.",category:"speed",year:2016,emoji:"🏎️"},{id:"sp7",text:"W zawodowym zjeździe narciarskim najlepsi mkną z prędkością około 130–150 km/h, lądując po skokach na oblodzonym stoku. Kask i ochraniacze to jedyna bariera między nimi a lodem.",category:"speed",year:2013,emoji:"🎿"},{id:"sp8",text:"Rekord prędkości pod żaglami należy do specjalnej łodzi Vestas Sailrocket, która przekroczyła 120 km/h. To najszybciej, jak człowiek poruszał się po wodzie wyłącznie dzięki wiatrowi.",category:"speed",year:2012,emoji:"⛵"},{id:"m22",text:"Rekord prędkości na lądzie należy do pojazdu Thrust SSC, który w 1997 roku przekroczył barierę dźwięku na pustyni — jako pierwszy i jedyny samochód w historii.",category:"motorsport",year:1997,emoji:"💨"},{id:"w25",text:"Zjazd Streif w Kitzbühel uchodzi za najtrudniejszą trasę świata — z nachyleniem dochodzącym do 85% i skokami na kilkadziesiąt metrów. Zwycięstwo tam liczy się bardziej niż niejeden medal.",category:"winter",year:1937,emoji:"😨"},{id:"aa1",text:"Na mundialu 2006 sędzia Graham Poll pokazał jednemu zawodnikowi trzy żółte kartki, zanim zorientował się w pomyłce. Po turnieju sam przyznał, że była to najgorsza chwila jego kariery.",category:"anecdotes",year:2006,emoji:"🟨"},{id:"aa2",text:"Zawodnik NFL Jim Marshall przejął piłkę i pobiegł kilkadziesiąt jardów... w złą stronę, zdobywając punkty dla rywali. Świętował z uniesionymi rękami, zanim ktokolwiek zdążył go zatrzymać.",category:"anecdotes",year:1964,emoji:"🔄"},{id:"aa3",text:"Jean van de Velde przystąpił do ostatniego dołka British Open 1999 z trzema uderzeniami przewagi. Skończył, brodząc boso w strumieniu i przegrywając turniej w dogrywce.",category:"anecdotes",year:1999,emoji:"💦"},{id:"aa4",text:"David Beckham zdobył słynnego gola, uderzając z własnej połowy boiska nad wychodzącym bramkarzem. Trafienie z 1996 roku uczyniło z niego gwiazdę jeszcze przed pierwszym powołaniem do kadry.",category:"anecdotes",year:1996,emoji:"🎯"},{id:"aa5",text:"Kolarze i biegacze regularnie tracą zwycięstwa przez świętowanie za wcześnie — uniesione ręce kilka metrów przed metą wielokrotnie kosztowały wygraną o centymetry.",category:"anecdotes",year:2010,emoji:"🙌"},{id:"aa6",text:"Kolo Touré spóźnił się kiedyś na drugą połowę meczu, bo czekał w szatni na kolegę opatrywanego przez lekarza. Jego drużyna przez chwilę grała w dziesiątkę, nie wiedząc, gdzie się podział obrońca.",category:"anecdotes",year:2009,emoji:"🚪"},{id:"aa7",text:"Angielskiemu bramkarzowi Chicowi Brodiemu karierę przerwał... pies, który wbiegł na boisko i zderzył się z nim przy piłce. Kolano golkipera nie wytrzymało zderzenia.",category:"anecdotes",year:1970,emoji:"🐕"},{id:"aa8",text:"Mecze krykieta i piłki nożnej bywają przerywane przez roje pszczół — zawodnicy i sędziowie padają wtedy na murawę, czekając, aż owady przelecą dalej.",category:"anecdotes",year:2017,emoji:"🐝"},{id:"ru9",text:"Od 2004 roku zdjęcie koszulki po zdobyciu gola oznacza automatyczną żółtą kartkę. Przepis wprowadzono, by ograniczyć przeciąganie celebracji i ukryte przekazy na podkoszulkach.",category:"rules",year:2004,emoji:"👕"},{id:"ar9",text:"Sędziowie noszą przy sobie zapasowy gwizdek, monetę i kartki w osobnych kieszeniach — po to, by w emocjach nie wyciągnąć czerwonej zamiast żółtej. Pomyłki i tak się zdarzają.",category:"referees",year:2010,emoji:"🎽"},{id:"af1",text:"Kenijska miejscowość Iten leży na wysokości ponad 2400 m n.p.m. i nazywana jest „domem mistrzów”. Mieszkają i trenują tam setki biegaczy, w tym medaliści olimpijscy z całego świata.",category:"africa",year:2010,emoji:"🏃"},{id:"af2",text:"Puchar Narodów Afryki rozgrywany jest od 1957 roku i należy do najstarszych turniejów kontynentalnych świata — jest starszy od mistrzostw Europy.",category:"africa",year:1957,emoji:"🏆"},{id:"af3",text:"Egipski Al Ahly to najbardziej utytułowany klub Afryki — zdobył rekordową liczbę kontynentalnych pucharów i przez lata był typowany do grona najlepszych klubów stulecia.",category:"africa",year:2021,emoji:"🔴"},{id:"af4",text:"Maroko w 2022 roku jako pierwsza afrykańska reprezentacja dotarła do półfinału mistrzostw świata, eliminując po drodze Hiszpanię i Portugalię.",category:"africa",year:2022,emoji:"🇲🇦"},{id:"af5",text:"Nigeria sensacyjnie zdobyła olimpijskie złoto w piłce nożnej w 1996 roku, pokonując po drodze Brazylię i Argentynę. To był pierwszy olimpijski triumf drużyny z Afryki w tej dyscyplinie.",category:"africa",year:1996,emoji:"🦅"},{id:"af6",text:"Hakeem Olajuwon, urodzony w Lagos, został jednym z najlepszych środkowych w historii NBA. Dziś jego śladem idą kolejni Afrykanie, a kontynent ma własną zawodową ligę koszykówki.",category:"africa",year:1994,emoji:"🏀"},{id:"af7",text:"Tunezyjka Ons Jabeur jako pierwsza tenisistka z Afryki i świata arabskiego zagrała w finale turnieju wielkoszlemowego. W ojczyźnie nazywają ją „ministrą szczęścia”.",category:"africa",year:2022,emoji:"🎾"},{id:"af8",text:"Comrades Marathon w RPA to bieg na około 90 km, w którym startuje kilkanaście tysięcy osób. Trasa co roku zmienia kierunek — raz „pod górę”, raz „z góry”.",category:"africa",year:1921,emoji:"🇿🇦"},{id:"f40",text:"Puchar Narodów Afryki rozgrywany jest zimą, w środku sezonu europejskiego. Kluby tracą wtedy na tygodnie swoich najlepszych zawodników — to jeden z najczęstszych sporów w światowym futbolu.",category:"football",year:2022,emoji:"🗓️"},{id:"b25",text:"Basketball Africa League, założona przy wsparciu NBA, wystartowała w 2021 roku. To pierwsza zawodowa liga koszykówki obejmująca cały kontynent afrykański.",category:"basketball",year:2021,emoji:"🌍"},{id:"mw1",text:"Czarny pas w judo to dopiero początek drogi — powyżej niego istnieje dziesięć stopni mistrzowskich. Najwyżsi rangą noszą pas czerwony, przyznawany za całokształt, nie za wygrane walki.",category:"martial",year:1900,emoji:"🥋"},{id:"mw2",text:"Karate narodziło się na Okinawie i dotarło do głównej Japonii dopiero w XX wieku. Na igrzyskach zadebiutowało w Tokio 2020 — i od razu wypadło z programu kolejnych.",category:"martial",year:2021,emoji:"👊"},{id:"mw3",text:"W taekwondo punkty liczą dziś elektroniczne kamizelki i skarpety z czujnikami. Najwyżej punktowane są kopnięcia na głowę z obrotem — stąd akrobatyczny wygląd walk.",category:"martial",year:2e3,emoji:"🦵"},{id:"mw4",text:"Capoeirę rozwinęli zniewoleni Afrykanie w Brazylii, maskując walkę jako taniec przy muzyce. Dzięki temu mogli ćwiczyć na oczach właścicieli plantacji.",category:"martial",year:1800,emoji:"🪘"},{id:"mw5",text:"Aikido jako jedyna z wielkich sztuk walki z założenia nie ma zawodów ani mistrzostw. Jego twórca uważał, że rywalizacja niszczy ideę harmonii i przekierowania siły przeciwnika.",category:"martial",year:1940,emoji:"☯️"},{id:"mw6",text:"Klasztor Shaolin łączy buddyzm z kung fu od stuleci. Mnisi nie traktują walki jako sportu, lecz jako formę medytacji w ruchu — pokazy z ich udziałem objechały cały świat.",category:"martial",year:500,emoji:"🛕"},{id:"mw7",text:"W kendo walczy się bambusowym mieczem w pełnej zbroi, a trafienie liczy się tylko wtedy, gdy towarzyszy mu okrzyk kiai i właściwa postawa. Sama celność to za mało.",category:"martial",year:1920,emoji:"⚔️"},{id:"mw8",text:"Na pierwszej gali UFC w 1993 roku nie było kategorii wagowych ani niemal żadnych zasad. Turniej wygrał najlżejszy uczestnik, Royce Gracie, pokazując światu skuteczność brazylijskiego jiu-jitsu.",category:"martial",year:1993,emoji:"🏆"},{id:"c24",text:"Zapasy w stylu klasycznym zabraniają ataków poniżej pasa i użycia nóg do chwytów. Styl wolny dopuszcza jedno i drugie — dlatego walki wyglądają zupełnie inaczej.",category:"combat",year:1904,emoji:"🤼"},{id:"as9",text:"Japońscy wielcy mistrzowie sumo (yokozuna) noszą podczas ceremonii gruby sznur shimenawa ważący nawet kilkanaście kilogramów. Taki sam wiesza się w świątyniach shintō wokół świętych miejsc.",category:"asia",year:1900,emoji:"🪢"},{id:"pa1",text:"Od igrzysk w Seulu 1988 paraolimpiada odbywa się w tym samym mieście i na tych samych obiektach co igrzyska olimpijskie. Dziś to warunek zapisany w umowie z gospodarzem.",category:"para",year:1988,emoji:"🤝"},{id:"pa2",text:"Zawodnicy paraolimpijscy startują w klasach oznaczanych literą i liczbą — litera określa dyscyplinę, a liczba stopień i rodzaj niepełnosprawności. Dzięki temu rywalizacja jest wyrównana.",category:"para",year:1990,emoji:"🔠"},{id:"pa3",text:"Goalball wymyślono dla osób niewidomych, ale grają w
