00 to-teal-700"},{id:"dance",label:"Taniec sportowy",emoji:"🕺",color:"from-pink-500 to-orange-500"},{id:"aviation",label:"Sporty lotnicze",emoji:"🪂",color:"from-sky-500 to-indigo-800"},{id:"nordic",label:"Biegi narciarskie i biathlon",emoji:"🎿",color:"from-cyan-500 to-blue-800"},{id:"trophies",label:"Puchary i trofea",emoji:"🏆",color:"from-yellow-400 to-orange-600"},{id:"officials",label:"Władze i działacze sportu",emoji:"👔",color:"from-slate-600 to-indigo-900"},{id:"transfers",label:"Transfery i kontrakty",emoji:"🧢",color:"from-emerald-600 to-teal-800"},{id:"calendar",label:"Kalendarz i wielkie cykle",emoji:"🗓️",color:"from-violet-500 to-blue-700"},{id:"ice",label:"Sporty lodowe",emoji:"⛸️",color:"from-cyan-400 to-sky-700"},{id:"safety",label:"Bezpieczeństwo w sporcie",emoji:"🛡️",color:"from-red-500 to-slate-700"},{id:"ecology",label:"Sport i ekologia",emoji:"🌱",color:"from-green-500 to-lime-700"},{id:"prl",label:"Sport w PRL",emoji:"🇵🇱",color:"from-red-700 to-stone-800"},{id:"games",label:"Inne wielkie igrzyska",emoji:"🏅",color:"from-amber-500 to-rose-700"}],Pi=[{id:"f1",text:"Pierwsze mistrzostwa świata w piłce nożnej odbyły się w 1930 roku w Urugwaju. Wzięło w nich udział tylko 13 drużyn, a gospodarze pokonali w finale Argentynę 4:2.",category:"football",year:1930,emoji:"🏆"},{id:"f2",text:"Najwyższe zwycięstwo w meczu międzypaństwowym padło w 2001 roku: Australia pokonała Samoa Amerykańskie 31:0, a Archie Thompson strzelił w tym meczu 13 goli.",category:"football",year:2001,emoji:"🥅"},{id:"f3",text:"Pelé jest jedynym piłkarzem w historii, który trzy razy zdobył mistrzostwo świata — w 1958, 1962 i 1970 roku. W 1958 miał zaledwie 17 lat.",category:"football",year:1958,emoji:"👑"},{id:"f4",text:"Najszybszy gol w historii mundiali padł po 10,8 sekundy — strzelił go Turek Hakan Şükür w meczu o 3. miejsce z Koreą Południową w 2002 roku.",category:"football",year:2002,emoji:"⚡"},{id:"f5",text:"Pierwszy oficjalny mecz międzypaństwowy w historii futbolu rozegrano 30 listopada 1872 roku. Szkocja zremisowała z Anglią 0:0 w Glasgow.",category:"football",year:1872,emoji:"📜"},{id:"f6",text:"Żółte i czerwone kartki wprowadzono dopiero na mundialu w 1970 roku. Pomysłodawca, sędzia Ken Aston, wpadł na ten pomysł stojąc na czerwonym świetle na skrzyżowaniu.",category:"football",year:1970,emoji:"🟨"},{id:"f7",text:"Najstarszym klubem piłkarskim świata jest angielski Sheffield FC, założony w 1857 roku — jeszcze zanim powstały jednolite przepisy gry.",category:"football",year:1857,emoji:"🏟️"},{id:"f8",text:"Finał MŚ 1950 Brazylia–Urugwaj na stadionie Maracanã obejrzało według szacunków około 200 tysięcy widzów — to rekord frekwencji w historii futbolu. Sensacyjna porażka gospodarzy 1:2 przeszła do historii jako „Maracanazo”.",category:"football",year:1950,emoji:"😱"},{id:"f9",text:"W 1314 roku król Anglii Edward II zakazał gry w piłkę na ulicach Londynu pod karą więzienia — hałas i zamieszanie przeszkadzały kupcom. Futbol zakazywano w Anglii jeszcze wielokrotnie.",category:"football",year:1314,emoji:"⛔"},{id:"f10",text:"Real Madryt zdobył Puchar Europy / Ligę Mistrzów rekordowe 15 razy, w tym pięć pierwszych edycji z rzędu w latach 1956–1960.",category:"football",year:1956,emoji:"⭐"},{id:"f11",text:"Podczas I wojny światowej, w Boże Narodzenie 1914 roku, żołnierze brytyjscy i niemieccy przerwali walki i rozegrali mecze piłkarskie na ziemi niczyjej między okopami.",category:"football",year:1914,emoji:"🕊️"},{id:"o1",text:"Starożytne igrzyska olimpijskie odbywały się od 776 r. p.n.e. przez ponad tysiąc lat, aż cesarz Teodozjusz I zakazał ich w 393 r. n.e. jako pogańskiego święta.",category:"olympics",emoji:"🏛️"},{id:"o2",text:"Pierwsze nowożytne igrzyska olimpijskie odbyły się w Atenach w 1896 roku. Wystartowało 241 sportowców z 14 państw — wyłącznie mężczyźni.",category:"olympics",year:1896,emoji:"🇬🇷"},{id:"o3",text:"Kobiety po raz pierwszy wystartowały na igrzyskach w Paryżu w 1900 roku — mogły rywalizować m.in. w tenisie, golfie i żeglarstwie.",category:"olympics",year:1900,emoji:"👩"},{id:"o4",text:"Michael Phelps to najbardziej utytułowany olimpijczyk w historii: zdobył 28 medali, w tym 23 złote. Samych złotych medali ma więcej niż większość państw świata.",category:"olympics",year:2016,emoji:"🏊"},{id:"o5",text:"W latach 1912–1948 na igrzyskach olimpijskich przyznawano medale także w konkurencjach artystycznych: literaturze, muzyce, malarstwie, rzeźbie i architekturze.",category:"olympics",year:1912,emoji:"🎨"},{id:"o6",text:"Dystans maratonu — 42 195 m — ustalono na igrzyskach w Londynie w 1908 roku. Trasę wydłużono tak, by start był pod zamkiem Windsor, a meta przed lożą królewską.",category:"olympics",year:1908,emoji:"📏"},{id:"o7",text:"Jesse Owens zdobył 4 złote medale na igrzyskach w Berlinie w 1936 roku, obalając na oczach Hitlera propagandę o wyższości rasowej.",category:"olympics",year:1936,emoji:"✊"},{id:"o8",text:"Sztafeta ognia olimpijskiego nie pochodzi ze starożytności — po raz pierwszy zorganizowano ją na igrzyskach w Berlinie w 1936 roku.",category:"olympics",year:1936,emoji:"🔥"},{id:"o9",text:"Pierwsze zimowe igrzyska olimpijskie odbyły się w 1924 roku w Chamonix we Francji. Początkowo nazywano je „Tygodniem Sportów Zimowych”.",category:"olympics",year:1924,emoji:"❄️"},{id:"o10",text:"Najstarszym medalistą olimpijskim w historii jest szwedzki strzelec Oscar Swahn, który w 1920 roku zdobył srebro w wieku 72 lat.",category:"olympics",year:1920,emoji:"👴"},{id:"o11",text:"Rumuńska gimnastyczka Nadia Comăneci jako pierwsza w historii otrzymała notę 10.0 na igrzyskach (Montreal 1976). Tablica wyników nie była na to gotowa i wyświetliła „1.00”.",category:"olympics",year:1976,emoji:"🤸"},{id:"a1",text:"Usain Bolt ustanowił rekord świata na 100 m — 9,58 s — na MŚ w Berlinie w 2009 roku. Osiągnął wtedy prędkość maksymalną ok. 44,7 km/h.",category:"athletics",year:2009,emoji:"⚡"},{id:"a2",text:"Bob Beamon skoczył w Meksyku w 1968 roku 8,90 m — poprawił rekord świata aż o 55 cm. Jego wynik przetrwał 23 lata, do skoku Mike'a Powella (8,95 m) w 1991 roku.",category:"athletics",year:1968,emoji:"🦘"},{id:"a3",text:"Roger Bannister jako pierwszy człowiek przebiegł milę poniżej 4 minut (3:59,4) — 6 maja 1954 roku w Oksfordzie. Wcześniej uważano, że to fizycznie niemożliwe.",category:"athletics",year:1954,emoji:"⏱️"},{id:"a4",text:"Dick Fosbury zrewolucjonizował skok wzwyż, przechodząc nad poprzeczką plecami. Techniką „flop” zdobył złoto olimpijskie w 1968 roku — dziś skaczą tak wszyscy.",category:"athletics",year:1968,emoji:"🔄"},{id:"a5",text:"Siergiej Bubka pobił rekord świata w skoku o tyczce aż 35 razy — często poprawiał go o centymetr, bo za każdy rekord dostawał premię.",category:"athletics",year:1994,emoji:"🪜"},{id:"a6",text:"Eliud Kipchoge w 2019 roku jako pierwszy człowiek przebiegł maraton poniżej 2 godzin (1:59:40). Wynik nie został uznany za rekord świata, bo osiągnięto go w specjalnie zaaranżowanym biegu.",category:"athletics",year:2019,emoji:"🏃"},{id:"a7",text:"Rekord świata Jarmili Kratochvílovej na 800 m (1:53,28) pochodzi z 1983 roku i jest najdłużej niepobitym rekordem świata w lekkoatletyce.",category:"athletics",year:1983,emoji:"📊"},{id:"a8",text:"Na maratonie olimpijskim w 1904 roku zwycięzca Thomas Hicks biegł wspomagany... strychniną i brandy, a inny zawodnik część trasy przejechał samochodem.",category:"athletics",year:1904,emoji:"🤪"},{id:"t1",text:"Wimbledon to najstarszy turniej tenisowy świata — rozgrywany od 1877 roku. Do dziś obowiązuje na nim niemal całkowicie biały strój zawodników.",category:"tennis",year:1877,emoji:"🌱"},{id:"t2",text:"Najdłuższy mecz w historii tenisa: John Isner pokonał Nicolasa Mahuta na Wimbledonie 2010 po 11 godzinach i 5 minutach gry, wygrywając piątego seta 70:68!",category:"tennis",year:2010,emoji:"⏳"},{id:"t3",text:"Steffi Graf jako jedyna osoba w historii zdobyła „Złotego Szlema” — wygrała wszystkie cztery turnieje wielkoszlemowe i złoto olimpijskie w jednym roku (1988).",category:"tennis",year:1988,emoji:"🥇"},{id:"t4",text:"Żółte piłki tenisowe wprowadzono na Wimbledonie dopiero w 1986 roku — wcześniej grano białymi. Zmianę wymusiła telewizja, bo żółte piłki lepiej widać na ekranie.",category:"tennis",year:1986,emoji:"🎾"},{id:"t5",text:"Najszybszy oficjalnie zmierzony serwis należy do Australijczyka Sama Grotha — 263 km/h podczas challengera w Busan w 2012 roku.",category:"tennis",year:2012,emoji:"🚀"},{id:"t6",text:"Novak Djoković zdobył rekordowe 24 tytuły wielkoszlemowe w grze pojedynczej mężczyzn — tyle samo, ile Margaret Court w całej historii kobiecego tenisa.",category:"tennis",year:2023,emoji:"🐐"},{id:"t7",text:"W 1973 roku odbył się słynny mecz „Bitwa płci”: Billie Jean King pokonała Bobby'ego Riggsa przed 90 milionami telewidzów, przyspieszając walkę o równe nagrody dla kobiet.",category:"tennis",year:1973,emoji:"⚔️"},{id:"b1",text:"Koszykówkę wymyślił w 1891 roku kanadyjski nauczyciel WF James Naismith. Pierwsze kosze to były... kosze na brzoskwinie przybite do balkonu sali gimnastycznej.",category:"basketball",year:1891,emoji:"🍑"},{id:"b2",text:"Wilt Chamberlain zdobył 100 punktów w jednym meczu NBA (1962, Philadelphia Warriors – New York Knicks). Ten rekord pozostaje niepobity do dziś.",category:"basketball",year:1962,emoji:"💯"},{id:"b3",text:"Linia rzutów za 3 punkty pojawiła się w NBA dopiero w sezonie 1979/80 — dziś to fundament gry, a wtedy uważano ją za cyrkową sztuczkę.",category:"basketball",year:1979,emoji:"🎯"},{id:"b4",text:"Przez pierwsze lata koszykówki po każdym celnym rzucie sędzia wchodził po drabinie i wyjmował piłkę z kosza — dopiero później wycięto dno.",category:"basketball",year:1900,emoji:"🪜"},{id:"b5",text:"„Dream Team” z igrzysk w Barcelonie 1992 (z Jordanem, Magiciem i Birdem) wygrywał mecze średnio 44 punktami i nie wziął ani jednej przerwy na żądanie.",category:"basketball",year:1992,emoji:"🌟"},{id:"b6",text:"Michael Jordan w połowie kariery odszedł z NBA, by grać... w baseball. Wrócił w 1995 roku słynnym faksem z dwoma słowami: „I'm back”.",category:"basketball",year:1995,emoji:"⚾"},{id:"v1",text:"Siatkówkę wymyślił w 1895 roku Amerykanin William Morgan jako mniej kontaktową alternatywę dla koszykówki. Pierwotnie nazywała się „mintonette”.",category:"volleyball",year:1895,emoji:"📖"},{id:"v2",text:"Reprezentacja Polski siatkarzy zdobyła mistrzostwo świata w 1974 roku w Meksyku, a potem obroniła tytuł dopiero po 44 latach — wygrywając MŚ 2014 i 2018 z rzędu.",category:"volleyball",year:2018,emoji:"🇵🇱"},{id:"v3",text:"Złoto olimpijskie polskich siatkarzy z Montrealu 1976 pod wodzą Huberta Wagnera, zwanego „Katem”, to efekt legendarnie ciężkich treningów, o których krążą anegdoty do dziś.",category:"volleyball",year:1976,emoji:"🥇"},{id:"v4",text:"Siatkówka plażowa zadebiutowała na igrzyskach w Atlancie w 1996 roku, choć na plażach Kalifornii i Brazylii grano w nią już od lat 20. XX wieku.",category:"volleyball",year:1996,emoji:"🏖️"},{id:"v5",text:"Libero — zawodnik grający w innym kolorze koszulki i tylko w obronie — to stosunkowo nowy wynalazek: wprowadzono go do siatkówki w 1998 roku.",category:"volleyball",year:1998,emoji:"🎽"},{id:"m1",text:"Pierwszy wyścig mistrzostw świata Formuły 1 odbył się 13 maja 1950 roku na torze Silverstone. Wygrał Włoch Giuseppe Farina, który został też pierwszym mistrzem świata.",category:"motorsport",year:1950,emoji:"🏁"},{id:"m2",text:"Robert Kubica jest jedynym Polakiem, który wygrał wyścig Formuły 1 — Grand Prix Kanady 2008. Rok wcześniej na tym samym torze przeżył potworny wypadek przy ok. 230 km/h.",category:"motorsport",year:2008,emoji:"🇵🇱"},{id:"m3",text:"Michael Schumacher i Lewis Hamilton mają po 7 tytułów mistrza świata F1 — nikt w historii nie zdobył więcej.",category:"motorsport",year:2020,emoji:"👑"},{id:"m4",text:"Najbliższy finisz w historii F1: na Monzy w 1971 roku Peter Gethin wygrał z przewagą 0,01 sekundy, a pierwszą piątkę dzieliło 0,61 s.",category:"motorsport",year:1971,emoji:"📸"},{id:"m5",text:"24-godzinny wyścig Le Mans rozgrywany jest od 1923 roku. Zwycięska załoga pokonuje w dobę ponad 5000 km — więcej niż dystans z Lizbony do Moskwy.",category:"motorsport",year:1923,emoji:"🕛"},{id:"m6",text:"Bartosz Zmarzlik to pięciokrotny indywidualny mistrz świata na żużlu (2019, 2020, 2022, 2023, 2024) — jeden z najlepszych żużlowców w historii tej dyscypliny.",category:"motorsport",year:2024,emoji:"🏍️"},{id:"c1",text:"Nowoczesne zasady boksu — w tym obowiązkowe rękawice i 3-minutowe rundy — spisano w 1867 roku jako tzw. przepisy markiza Queensberry.",category:"combat",year:1867,emoji:"📜"},{id:"c2",text:"„Rumble in the Jungle” (1974, Kinszasa): Muhammad Ali znokautował niepokonanego George'a Foremana, stosując taktykę „rope-a-dope” — pozwalał się bić przy linach, aż rywal opadł z sił.",category:"combat",year:1974,emoji:"🌍"},{id:"c3",text:"Rocky Marciano to jedyny mistrz świata wagi ciężkiej, który zakończył karierę niepokonany — bilans 49 zwycięstw, 0 porażek.",category:"combat",year:1956,emoji:"💪"},{id:"c4",text:"Muhammad Ali, cierpiący już na chorobę Parkinsona, zapalił znicz olimpijski w Atlancie w 1996 roku — to jeden z najbardziej wzruszających momentów w historii igrzysk.",category:"combat",year:1996,emoji:"🔥"},{id:"c5",text:"Węgier László Papp jako pierwszy bokser w historii zdobył trzy złote medale olimpijskie z rzędu (1948, 1952, 1956).",category:"combat",year:1956,emoji:"🥇"},{id:"c6",text:"Judo stworzył w 1882 roku Japończyk Jigorō Kanō, łagodząc techniki samurajskiego jujutsu. Na igrzyska trafiło w 1964 roku w Tokio.",category:"combat",year:1882,emoji:"🥋"},{id:"w1",text:"Adam Małysz zdobył 4 medale olimpijskie i 4 tytuły mistrza świata, a Puchar Świata w skokach wygrywał 4 razy — w tym trzy sezony z rzędu (2001–2003).",category:"winter",year:2001,emoji:"🦅"},{id:"w2",text:"Kamil Stoch wygrał oba konkursy indywidualne na igrzyskach w Soczi 2014, a w 2018 roku dołożył trzecie złoto w Pjongczangu — tylko trzej skoczkowie w historii mają 3 złota indywidualne.",category:"winter",year:2014,emoji:"🥇"},{id:"w3",text:"„Cud na lodzie” (1980): amerykańscy studenci pokonali na igrzyskach w Lake Placid radziecką maszynę hokejową, która wygrała wcześniej cztery olimpiady z rzędu.",category:"winter",year:1980,emoji:"🏒"},{id:"w4",text:"Eddie „The Eagle” Edwards, brytyjski skoczek-amator w grubych okularach, zajął ostatnie miejsce na igrzyskach w Calgary 1988 — i został większą gwiazdą niż zwycięzcy.",category:"winter",year:1988,emoji:"🤓"},{id:"w5",text:"Justyna Kowalczyk zdobyła 5 medali olimpijskich, w tym dwa złota (2010, 2014). Złoto w Soczi wywalczyła... biegnąc ze złamaną kością stopy.",category:"winter",year:2014,emoji:"🎿"},{id:"w6",text:"Pierwszy skok narciarski ponad 250 metrów oddał Austriak Stefan Kraft — 253,5 m w Vikersund w 2017 roku. To oficjalny rekord świata w długości lotu.",category:"winter",year:2017,emoji:"📏"},{id:"w7",text:"Reprezentacja Jamajki w bobslejach zadebiutowała na igrzyskach w Calgary w 1988 roku — ich historia zainspirowała film „Reggae na lodzie”.",category:"winter",year:1988,emoji:"🛷"},{id:"s1",text:"Gertrude Ederle w 1926 roku jako pierwsza kobieta przepłynęła kanał La Manche — i pobiła ówczesny rekord mężczyzn o prawie dwie godziny.",category:"water",year:1926,emoji:"🌊"},{id:"s2",text:"Otylia Jędrzejczak zdobyła złoto olimpijskie na 200 m stylem motylkowym w Atenach 2004, a swój medal zlicytowała na rzecz dzieci chorych na białaczkę.",category:"water",year:2004,emoji:"🦋"},{id:"s3",text:"Na pierwszych nowożytnych igrzyskach w 1896 roku zawody pływackie odbywały się w otwartym morzu. Zwycięzca Alfréd Hajós przyznał, że bardziej niż o wygranej myślał o tym, żeby nie utonąć.",category:"water",year:1896,emoji:"🌊"},{id:"s4",text:"Kostiumy poliuretanowe, w których w latach 2008–2009 pobito ponad 130 rekordów świata w pływaniu, zostały zakazane od 2010 roku jako „doping technologiczny”.",category:"water",year:2009,emoji:"🩱"},{id:"s5",text:"Regaty wioślarskie Oxford–Cambridge rozgrywane są na Tamizie od 1829 roku i są jednym z najstarszych cyklicznych wydarzeń sportowych świata.",category:"water",year:1829,emoji:"🚣"},{id:"k1",text:"Tour de France powstał w 1903 roku jako akcja promocyjna gazety L'Auto. Żółta koszulka lidera nawiązuje do koloru papieru, na którym drukowano tę gazetę.",category:"cycling",year:1903,emoji:"💛"},{id:"k2",text:"Ryszard Szurkowski, legenda polskiego kolarstwa, cztery razy wygrał Wyścig Pokoju i dwukrotnie zdobył srebro olimpijskie. Nazywano go „kolarzem stulecia”.",category:"cycling",year:1973,emoji:"🚴"},{id:"k3",text:"Zwycięzca pierwszego Tour de France, Maurice Garin, rok później został zdyskwalifikowany za... przejechanie części trasy pociągiem.",category:"cycling",year:1904,emoji:"🚂"},{id:"k4",text:"Lance Armstrong wygrał Tour de France siedem razy z rzędu (1999–2005), ale wszystkie tytuły odebrano mu w 2012 roku po udowodnieniu systematycznego dopingu.",category:"cycling",year:2012,emoji:"❌"},{id:"k5",text:"Rafał Majka dwukrotnie wygrał klasyfikację górską Tour de France (2014, 2016) i zdobył brązowy medal olimpijski w Rio de Janeiro w 2016 roku.",category:"cycling",year:2016,emoji:"⛰️"},{id:"p1",text:"Pierwszy złoty medal olimpijski dla Polski zdobyła Halina Konopacka — w rzucie dyskiem na igrzyskach w Amsterdamie w 1928 roku, bijąc przy okazji rekord świata.",category:"poland",year:1928,emoji:"🥇"},{id:"p2",text:"Janusz Kusociński zdobył złoto olimpijskie w biegu na 10 000 m w Los Angeles w 1932 roku. Zginął rozstrzelany przez Niemców w Palmirach w 1940 roku.",category:"poland",year:1932,emoji:"🏃"},{id:"p3",text:"„Orły Górskiego” zdobyły złoto olimpijskie w 1972 roku i 3. miejsce na MŚ 1974. Grzegorz Lato został królem strzelców tamtego mundialu z 7 golami.",category:"poland",year:1974,emoji:"🦅"},{id:"p4",text:"Irena Szewińska zdobywała medale olimpijskie na czterech kolejnych igrzyskach (1964–1976) i jako jedyna w historii lekkoatletyka biła rekordy świata na 100, 200 i 400 m.",category:"poland",year:1976,emoji:"👑"},{id:"p5",text:"Polski „Wunderteam” — lekkoatletyczna reprezentacja z lat 1956–1966 — wygrywał mecze międzypaństwowe z potęgami takimi jak USA i ZSRR, a jego gwiazdami byli m.in. Zdzisław Krzyszkowiak i Józef Szmidt.",category:"poland",year:1958,emoji:"💪"},{id:"p6",text:"Iga Świątek jako pierwsza polska tenisistka (i pierwszy polski tenisista w ogóle) została liderką światowego rankingu w grze pojedynczej — w kwietniu 2022 roku.",category:"poland",year:2022,emoji:"🎾"},{id:"p7",text:"Władysław Kozakiewicz po zwycięskim skoku o tyczce na igrzyskach w Moskwie 1980 pokazał gwiżdżącej radzieckiej publiczności słynny gest, znany dziś jako „gest Kozakiewicza”.",category:"poland",year:1980,emoji:"💪"},{id:"p8",text:"Robert Lewandowski w 2015 roku strzelił 5 goli w 9 minut w meczu Bayernu z Wolfsburgiem — to najszybszy hat-trick, 4 i 5 goli w historii Bundesligi, wpisane do Księgi Rekordów Guinnessa.",category:"poland",year:2015,emoji:"⚽"},{id:"an1",text:"Starożytni olimpijczycy startowali nago — słowo „gimnastyka” pochodzi od greckiego „gymnos”, czyli „nagi”.",category:"ancient",emoji:"🏛️"},{id:"an2",text:"Na czas starożytnych igrzysk ogłaszano „ekecheirię” — święty rozejm. Wojny przerywano, by zawodnicy i kibice mogli bezpiecznie dotrzeć do Olimpii.",category:"ancient",emoji:"🕊️"},{id:"an3",text:"Jedyną nagrodą na starożytnych igrzyskach był wieniec z gałązek oliwnych — ale w rodzinnych miastach zwycięzcy dostawali dożywotnie wyżywienie, pieniądze i pomniki.",category:"ancient",emoji:"🫒"},{id:"an4",text:"Wyścigi rydwanów w rzymskim Circus Maximus oglądało nawet 250 tysięcy widzów. Najlepszy woźnica, Gajusz Appulejusz Diokles, zarobił w karierze równowartość miliardów dzisiejszych dolarów.",category:"ancient",emoji:"🏇"},{id:"an5",text:"Starożytny pankration — brutalna mieszanka boksu i zapasów, w której zakazane było tylko gryzienie i wydłubywanie oczu — uważany jest za przodka dzisiejszego MMA.",category:"ancient",emoji:"🥊"},{id:"an6",text:"Kobiety nie mogły nawet oglądać starożytnych igrzysk pod karą śmierci. Miały jednak własne zawody — Heraje, biegi ku czci bogini Hery.",category:"ancient",emoji:"🏺"},{id:"r1",text:"Alan Shepard jest jedynym człowiekiem, który grał w golfa na Księżycu — w 1971 roku podczas misji Apollo 14 uderzył dwie piłki przemyconą główką kija golfowego.",category:"golf",year:1971,emoji:"🌕"},{id:"r2",text:"Najmłodszym medalistą olimpijskim w historii jest grecki gimnastyk Dimitrios Loundras, który w 1896 roku zdobył brąz drużynowo w wieku 10 lat.",category:"records",year:1896,emoji:"👶"},{id:"r3",text:"Najdłuższy zarejestrowany mecz tenisa stołowego o jeden punkt trwał ponad 2 godziny — w 1936 roku na MŚ w Pradze zawodnicy przebijali piłeczkę ponad 12 tysięcy razy.",category:"records",year:1936,emoji:"🏓"},{id:"r4",text:"W 1998 roku rumuński klub Jiul Petroșani sprzedał piłkarza Iona Radu do drużyny niższej ligi za... 500 kilogramów mięsa. To jeden z najdziwniejszych transferów w historii futbolu.",category:"records",year:1998,emoji:"🥩"},{id:"r5",text:"Maraton olimpijski 1912 „ukończył” Japończyk Shizo Kanakuri — po 54 latach! Zasłabł w trakcie biegu i wrócił do domu, a w 1967 roku zaproszono go, by symbolicznie przekroczył metę.",category:"records",year:1912,emoji:"⏰"},{id:"r6",text:"Najdłuższy mecz w historii sportu zawodowego to pojedynek baseballowy Pawtucket–Rochester z 1981 roku: 33 zmiany rozegrane w ciągu ponad 8 godzin.",category:"records",year:1981,emoji:"⚾"},{id:"r7",text:"Przeciąganie liny było oficjalną dyscypliną olimpijską w latach 1900–1920. Złote medale zdobywały m.in. drużyny policjantów z Londynu.",category:"records",year:1920,emoji:"🪢"},{id:"r8",text:"Podczas biegu na 3000 m z przeszkodami na IO 1932 zawodnicy przebiegli o jedno okrążenie za dużo — sędzia pomylił się w liczeniu. Wyniki i tak uznano.",category:"records",year:1932,emoji:"🔢"},{id:"f12",text:"W 1966 roku puchar mistrzostw świata (trofeum Julesa Rimeta) skradziono z wystawy w Londynie tuż przed mundialem. Odnalazł go pod żywopłotem pies o imieniu Pickles.",category:"football",year:1966,emoji:"🐕"},{id:"f13",text:"Najwyższy wynik w historii futbolu: AS Adema pokonała SO l'Emyrne 149:0 (Madagaskar, 2002). Wszystkie gole były samobójcze — przegrani strzelali je w proteście przeciwko sędziemu.",category:"football",year:2002,emoji:"🤯"},{id:"f14",text:"Francuz Just Fontaine strzelił 13 goli na jednym mundialu (Szwecja 1958). Ten rekord pozostaje niepobity od ponad 60 lat.",category:"football",year:1958,emoji:"🎯"},{id:"f15",text:"Mundial w Szwajcarii w 1954 roku był pierwszym transmitowanym w telewizji. Finał Niemcy–Węgry 3:2 przeszedł do historii jako „cud w Bernie”.",category:"football",year:1954,emoji:"📺"},{id:"f16",text:"Kameruńczyk Roger Milla jest najstarszym strzelcem gola na mistrzostwach świata — trafił do siatki na mundialu 1994 w wieku 42 lat.",category:"football",year:1994,emoji:"👴"},{id:"f17",text:"FC Barcelona przez ponad sto lat nie miała sponsora na koszulkach. Pierwszym „sponsorem” w 2006 roku został UNICEF — i to klub płacił organizacji, a nie odwrotnie.",category:"football",year:2006,emoji:"👕"},{id:"o12",text:"Na igrzyskach w Paryżu w 1900 roku jedyny raz w historii strzelano do żywych gołębi. Rozegrano tam też zawody w krokiecie i przeciąganiu liny.",category:"olympics",year:1900,emoji:"🐦"},{id:"o13",text:"Do 1992 roku zimowe i letnie igrzyska odbywały się w tym samym roku. Dopiero od Lillehammer 1994 rozdzielono je dwuletnim odstępem.",category:"olympics",year:1994,emoji:"🗓️"},{id:"o14",text:"Etiopczyk Abebe Bikila wygrał maraton olimpijski w Rzymie w 1960 roku, biegnąc całą trasę boso. Cztery lata później obronił tytuł — już w butach.",category:"olympics",year:1960,emoji:"🦶"},{id:"o15",text:"Igrzyska 1956 odbyły się w... dwóch krajach. Przez kwarantannę koni w Australii konkurencje jeździeckie rozegrano w Sztokholmie, a resztę w Melbourne.",category:"olympics",year:1956,emoji:"🐴"},{id:"o16",text:"Pierre de Coubertin, twórca nowożytnych igrzysk, sam zdobył złoty medal olimpijski — w konkursie literatury w 1912 roku, za „Odę do sportu” zgłoszoną pod pseudonimem.",category:"olympics",year:1912,emoji:"✍️"},{id:"a9",text:"Emil Zátopek dokonał na IO 1952 rzeczy niemożliwej: wygrał 5000 m, 10 000 m i maraton — który biegł pierwszy raz w życiu. Nikt nigdy tego nie powtórzył.",category:"athletics",year:1952,emoji:"🚂"},{id:"a10",text:"Rekordy świata Florence Griffith-Joyner na 100 m (10,49 s) i 200 m (21,34 s) pochodzą z 1988 roku i wciąż pozostają niepobite.",category:"athletics",year:1988,emoji:"💅"},{id:"a11",text:"Rekord świata w biegu na milę — 3:43,13 Marokańczyka Hichama El Guerrouja — pochodzi z 1999 roku i jest jednym z najtrwalszych w lekkoatletyce.",category:"athletics",year:1999,emoji:"⏱️"},{id:"a12",text:"Szwed Armand Duplantis poprawiał rekord świata w skoku o tyczce kilkanaście razy — niemal zawsze o dokładnie 1 centymetr, wzorem Siergieja Bubki.",category:"athletics",year:2025,emoji:"🪜"},{id:"t8",text:"Martina Navratilova wygrała Wimbledon w singlu rekordowe 9 razy, a swój ostatni wielkoszlemowy tytuł (w mikście) zdobyła w wieku 49 lat.",category:"tennis",year:2006,emoji:"🏆"},{id:"t9",text:"Rafael Nadal wygrał Roland Garros 14 razy. Jego bilans meczów na kortach Paryża to 112 zwycięstw i zaledwie 4 porażki.",category:"tennis",year:2022,emoji:"🟠"},{id:"t10",text:"Do 1968 roku w turniejach wielkoszlemowych mogli grać wyłącznie amatorzy. Dopiero „era open” dopuściła zawodowców i nagrody pieniężne.",category:"tennis",year:1968,emoji:"💰"},{id:"b7",text:"Najniższym graczem w historii NBA był Muggsy Bogues — 160 cm wzrostu. Mimo to zablokował w karierze 39 rzutów, w tym rzut 213-centymetrowego Patricka Ewinga.",category:"basketball",year:1993,emoji:"📏"},{id:"b8",text:"Bill Russell zdobył z Boston Celtics 11 mistrzostw NBA w ciągu 13 sezonów — żaden zawodnik w amerykańskich ligach nie ma więcej pierścieni.",category:"basketball",year:1969,emoji:"💍"},{id:"b9",text:"Pierwszy w historii mecz koszykówki (1891) zakończył się wynikiem 1:0. Jedyny celny rzut oddano z odległości ponad 7 metrów.",category:"basketball",year:1891,emoji:"1️⃣"},{id:"v8",text:"Amerykanin Karch Kiraly to jedyny siatkarz w historii ze złotem olimpijskim i w hali (1984, 1988), i na plaży (1996).",category:"volleyball",year:1996,emoji:"🏖️"},{id:"v9",text:"Siatkówka halowa zadebiutowała na igrzyskach w Tokio w 1964 roku. Pierwsze złoto wśród mężczyzn zdobył ZSRR, a wśród kobiet — Japonki.",category:"volleyball",year:1964,emoji:"🇯🇵"},{id:"m7",text:"Sebastian Vettel został najmłodszym mistrzem świata F1 w historii — tytuł z 2010 roku zdobył mając 23 lata i 134 dni.",category:"motorsport",year:2010,emoji:"👶"},{id:"m8",text:"Ayrton Senna na GP Europy 1993 w Donington awansował w deszczu z 5. na 1. miejsce w ciągu jednego okrążenia. To okrążenie uchodzi za najlepsze w historii F1.",category:"motorsport",year:1993,emoji:"🌧️"},{id:"m9",text:"Rajd Dakar przez dekady prowadził z Paryża do stolicy Senegalu. Ze względów bezpieczeństwa przeniesiono go najpierw do Ameryki Południowej (2009), a od 2020 roku odbywa się w Arabii Saudyjskiej.",category:"motorsport",year:2020,emoji:"🏜️"},{id:"c7",text:"Mike Tyson został najmłodszym mistrzem świata wagi ciężkiej w historii — pas WBC zdobył w 1986 roku, mając 20 lat i 4 miesiące.",category:"combat",year:1986,emoji:"🐅"},{id:"c8",text:"W 1976 roku Muhammad Ali stoczył w Tokio pokazową walkę z zapaśnikiem Antonio Inokim. Dziwaczny pojedynek bokser kontra zapaśnik uchodzi dziś za prekursora MMA.",category:"combat",year:1976,emoji:"🤼"},{id:"c9",text:"Chabib Nurmagomiedow zakończył karierę w UFC z bilansem 29 zwycięstw i 0 porażek — jako niepokonany mistrz wagi lekkiej.",category:"combat",year:2020,emoji:"🦅"},{id:"w8",text:"Biathlon wywodzi się bezpośrednio z wojska — z ćwiczeń norweskich patroli narciarskich. Na igrzyskach do 1948 roku istniała nawet konkurencja „patrol wojskowy”.",category:"winter",year:1948,emoji:"🎖️"},{id:"w9",text:"Norweska biegaczka Marit Bjørgen to najbardziej utytułowana zimowa olimpijka w historii: 15 medali, w tym 8 złotych.",category:"winter",year:2018,emoji:"🇳🇴"},{id:"w10",text:"Wojciech Fortuna zdobył w Sapporo 1972 pierwsze zimowe złoto dla Polski — w skokach narciarskich. Do sukcesu Małysza pozostawał jedynym polskim medalistą zimowych igrzysk w skokach.",category:"winter",year:1972,emoji:"🎿"},{id:"s6",text:"Mark Spitz zdobył w Monachium 1972 siedem złotych medali — i w każdym z siedmiu startów pobił rekord świata. Jego wyczyn przebił dopiero Phelps w 2008 roku.",category:"water",year:1972,emoji:"🥇"},{id:"s7",text:"Skoczek do wody Greg Louganis uderzył głową w trampolinę podczas eliminacji na IO 1988. Mimo szwów na głowie następnego dnia zdobył złoty medal.",category:"water",year:1988,emoji:"🤕"},{id:"k6",text:"Eddy Merckx, zwany „Kanibalem”, odniósł około 525 zawodowych zwycięstw — wygrał m.in. po 5 razy Tour de France i Giro d'Italia. Uchodzi za najlepszego kolarza wszech czasów.",category:"cycling",year:1974,emoji:"🍽️"},{id:"k7",text:"Rekord godzinny to najbardziej prestiżowy rekord kolarstwa torowego: ile kilometrów da się przejechać w 60 minut. Merckx wybrał na próbę w 1972 roku miasto Meksyk — dla rzadszego powietrza.",category:"cycling",year:1972,emoji:"⏰"},{id:"p9",text:"Anita Włodarczyk to trzykrotna mistrzyni olimpijska w rzucie młotem i pierwsza kobieta w historii, która rzuciła ponad 80 metrów. Jej rekord świata to 82,98 m.",category:"poland",year:2016,emoji:"🔨"},{id:"p10",text:"Widzew Łódź dotarł w 1983 roku do półfinału Pucharu Europy, eliminując po drodze wielki Liverpool. To jeden z największych sukcesów polskich klubów w Europie.",category:"poland",year:1983,emoji:"⚽"},{id:"p11",text:"Wanda Rutkiewicz jako pierwsza osoba z Polski i trzecia kobieta na świecie stanęła na Mount Everest — 16 października 1978 roku, w dniu wyboru Karola Wojtyły na papieża.",category:"poland",year:1978,emoji:"🏔️"},{id:"p12",text:"Tomasz Gollob po niemal dwóch dekadach ścigania się o tytuł został indywidualnym mistrzem świata na żużlu w 2010 roku, w wieku 39 lat.",category:"poland",year:2010,emoji:"🏍️"},{id:"p13",text:"Aleksandra Mirosław zdobyła złoto olimpijskie w Paryżu 2024 we wspinaczce sportowej na czas. Wielokrotnie biła rekord świata, schodząc poniżej 6,1 sekundy na 15-metrowej ścianie.",category:"poland",year:2024,emoji:"🧗"},{id:"an7",text:"Milon z Krotonu, sześciokrotny mistrz olimpijski w zapasach z VI w. p.n.e., według legendy trenował nosząc na barkach cielaka — codziennie, aż ten wyrósł na byka.",category:"ancient",emoji:"🐂"},{id:"an8",text:"Spartanka Kyniska została pierwszą kobietą „zwyciężczynią” starożytnych igrzysk — jako właścicielka zwycięskiego zaprzęgu konnego. Wieniec przyznawano bowiem właścicielowi, nie woźnicy.",category:"ancient",emoji:"🐎"},{id:"r9",text:"Najdłuższa partia szachowa w historii turniejów: Nikolić–Arsović (Belgrad 1989) trwała 269 posunięć i ponad 20 godzin gry. Zakończyła się remisem.",category:"chess",year:1989,emoji:"♟️"},{id:"r10",text:"Magnus Carlsen osiągnął najwyższy ranking szachowy w historii — 2882 punkty. Mistrzem świata był nieprzerwanie od 2013 do 2023 roku, po czym... sam zrezygnował z obrony tytułu.",category:"chess",year:2013,emoji:"♚"},{id:"r11",text:"Pula nagród turnieju e-sportowego The International w Dota 2 przekroczyła w 2021 roku 40 milionów dolarów — więcej niż w wielu klasycznych turniejach sportowych.",category:"esport",year:2021,emoji:"🎮"},{id:"r12",text:"Japoński zapaśnik sumo Hakuhō wygrał rekordowe 45 wielkich turniejów. Wielcy mistrzowie (yokozuna) nie mogą zostać zdegradowani — mogą tylko odejść z honorem.",category:"records",year:2021,emoji:"🇯🇵"},{id:"r13",text:"Fred Lorz „wygrał” maraton olimpijski 1904, ale wyszło na jaw, że 18 km trasy przejechał samochodem. Dożywotnią dyskwalifikację cofnięto po przeprosinach — rok później uczciwie wygrał maraton bostoński.",category:"records",year:1904,emoji:"🚗"},{id:"f18",text:"Reprezentacja Włoch ustanowiła rekord świata, grając 37 meczów z rzędu bez porażki (2018–2021). Seria objęła m.in. całe zwycięskie Euro 2020.",category:"football",year:2021,emoji:"🇮🇹"},{id:"f19",text:"Brazylijski bramkarz Rogério Ceni strzelił w karierze ponad 130 goli — z rzutów wolnych i karnych. Żaden golkiper w historii nie zbliżył się do tego wyniku.",category:"football",year:2015,emoji:"🧤"},{id:"f20",text:"Estadio Azteca w Meksyku to jedyny stadion, który gościł dwa finały mistrzostw świata (1970 i 1986). Na obu triumfowały drużyny z Ameryki Południowej.",category:"football",year:1986,emoji:"🏟️"},{id:"f21",text:"Pierwszy wielki turniej rozstrzygnięty „złotym golem”: Euro 1996, kiedy Oliver Bierhoff dał Niemcom tytuł w finale z Czechami. Przepis zniesiono w 2004 roku.",category:"football",year:1996,emoji:"🥇"},{id:"f22",text:"Najdroższy transfer w historii futbolu: Neymar przeszedł w 2017 roku z Barcelony do PSG za 222 miliony euro — PSG po prostu wpłaciło pełną klauzulę odstępnego.",category:"football",year:2017,emoji:"💶"},{id:"f23",text:"San Marino, najsłabsza reprezentacja świata, na pierwsze zwycięstwo w meczu o punkty czekało desperacko długo — wygraną 1:0 z Liechtensteinem świętowało dopiero w 2024 roku.",category:"football",year:2024,emoji:"🎉"},{id:"o17",text:"Tylko dwa miasta organizowały letnie igrzyska trzykrotnie: Londyn (1908, 1948, 2012) i Paryż (1900, 1924, 2024). W 2028 roku dołączy do nich Los Angeles.",category:"olympics",year:2024,emoji:"🏙️"},{id:"o18",text:"Igrzyska w Moskwie 1980 zbojkotowało ponad 60 państw w proteście przeciw inwazji ZSRR na Afganistan. Cztery lata później blok wschodni zrewanżował się bojkotem Los Angeles.",category:"olympics",year:1980,emoji:"🚫"},{id:"o19",text:"Eric „Węgorz” Moussambani z Gwinei Równikowej przepłynął na IO 2000 swoje 100 m w 1:52,72 — ponad dwa razy wolniej od rywali. Trenował w hotelowym basenie i nigdy wcześniej nie widział 50-metrowej niecki.",category:"olympics",year:2e3,emoji:"🐍"},{id:"o20",text:"Wszystkie medale igrzysk w Tokio 2020 wykonano z metali odzyskanych z elektroniki — Japończycy oddali na ten cel ponad 6 milionów starych telefonów.",category:"olympics",year:2021,emoji:"♻️"},{id:"o21",text:"Igrzyska olimpijskie odwołano trzykrotnie — w 1916, 1940 i 1944 roku, z powodu wojen światowych. Tokio straciło igrzyska w 1940 i musiało czekać na nie do 1964 roku.",category:"olympics",year:1944,emoji:"⚔️"},{id:"a13",text:"Fin Paavo Nurmi zdobył 9 złotych medali olimpijskich w biegach. Na IO 1924 wygrał finały 1500 m i 5000 m rozegrane... w odstępie niecałej godziny.",category:"athletics",year:1924,emoji:"🇫🇮"},{id:"a14",text:"Kobiety mogły pobiec maraton olimpijski dopiero w 1984 roku w Los Angeles. Wcześniej uważano, że dystans jest dla nich „zbyt niebezpieczny”. Pierwsze złoto zdobyła Joan Benoit.",category:"athletics",year:1984,emoji:"👩"},{id:"a15",text:"Rekord świata w skoku wzwyż — 2,45 m Kubańczyka Javiera Sotomayora — pochodzi z 1993 roku. To najdłużej niepobity rekord w męskich konkurencjach technicznych.",category:"athletics",year:1993,emoji:"📏"},{id:"a16",text:"Większość najlepszych maratończyków świata pochodzi z jednego regionu: Wielkiego Rowu Afrykańskiego w Kenii i Etiopii. Trenują na wysokości ponad 2000 m n.p.m.",category:"athletics",year:2019,emoji:"⛰️"},{id:"a17",text:"Rekord świata w sztafecie 4×100 m — 36,84 s — Jamajczycy z Boltem na ostatniej zmianie ustanowili na IO 2012. Średnia prędkość zespołu przekraczała 39 km/h.",category:"athletics",year:2012,emoji:"🤝"},{id:"t11",text:"Nad Wimbledonem codziennie o świcie patroluje jastrząb Rufus, którego jedynym zadaniem jest odstraszanie gołębi z kortów. Ma własną akredytację i profil w mediach społecznościowych.",category:"tennis",year:2008,emoji:"🦅"},{id:"t12",text:"Maraton Isner–Mahut (70:68 w piątym secie) zmusił Wimbledon do zmiany zasad — od 2019 roku przy stanie 12:12 w decydującym secie gra się tie-breaka.",category:"tennis",year:2019,emoji:"📜"},{id:"t13",text:"Rod Laver jako jedyny tenisista w historii zdobył klasycznego Wielkiego Szlema (wszystkie 4 turnieje w jednym roku) dwukrotnie — w 1962 i 1969 roku.",category:"tennis",year:1969,emoji:"🎖️"},{id:"t14",text:"US Open jako pierwszy turniej wielkoszlemowy wyrównał nagrody kobiet i mężczyzn — już w 1973 roku, po kampanii Billie Jean King. Wimbledon zrobił to dopiero w 2007.",category:"tennis",year:1973,emoji:"⚖️"},{id:"b10",text:"Rekord punktowy Kareema Abdul-Jabbara (38 387 pkt) przetrwał w NBA 39 lat — pobił go dopiero LeBron James w 2023 roku.",category:"basketball",year:2023,emoji:"👑"},{id:"b11",text:"Stephen Curry zrewolucjonizował koszykówkę rzutami z dystansu — w sezonie 2015/16 trafił 402 trójki, bijąc własny rekord NBA o ponad sto rzutów.",category:"basketball",year:2016,emoji:"🌊"},{id:"b12",text:"Marcin Gortat jest jedynym Polakiem, który zagrał w finałach NBA — w 2009 roku z Orlando Magic. W lidze rozegrał łącznie 12 sezonów.",category:"basketball",year:2009,emoji:"🇵🇱"},{id:"v10",text:"Wilfredo León, reprezentant Polski kubańskiego pochodzenia, posyłał serwisy z prędkością ponad 130 km/h — szybciej niż samochody na autostradzie.",category:"volleyball",year:2019,emoji:"🚀"},{id:"v11",text:"Polskie siatkarki zdobyły mistrzostwo Europy dwa razy z rzędu — w 2003 i 2005 roku pod wodzą Andrzeja Niemczyka. Drużynę ochrzczono „Złotkami”.",category:"volleyball",year:2003,emoji:"🥇"},{id:"m10",text:"Niki Lauda wrócił do ścigania zaledwie 42 dni po tym, jak w płonącym bolidzie na Nürburgringu doznał ciężkich poparzeń i otrzymał ostatnie namaszczenie (1976).",category:"motorsport",year:1976,emoji:"🔥"},{id:"m11",text:"Uliczny tor w Monako jest najwolniejszym i zarazem najbardziej prestiżowym w kalendarzu F1. Wyścigi odbywają się tam od 1929 roku na niemal niezmienionej trasie.",category:"motorsport",year:1929,emoji:"🏰"},{id:"m12",text:"Włoszka Lella Lombardi to jedyna kobieta, która zdobyła punkty w wyścigu F1 — pół punktu za GP Hiszpanii 1975, przerwane po wypadku.",category:"motorsport",year:1975,emoji:"👩"},{id:"c10",text:"Najdłuższa walka bokserska w historii: Andy Bowen i Jack Burke bili się w 1893 roku przez 110 rund i 7 godzin 19 minut. Sędziowie ogłosili... brak rozstrzygnięcia.",category:"combat",year:1893,emoji:"⏰"},{id:"c11",text:"Kubański bokser Teófilo Stevenson, 3-krotny mistrz olimpijski, odrzucił milionowe oferty walki z Muhammadem Alim, mówiąc: „Czym jest milion dolarów wobec miłości ośmiu milionów Kubańczyków?”.",category:"combat",year:1976,emoji:"🇨🇺"},{id:"c12",text:"Joanna Jędrzejczyk jako pierwsza osoba z Polski zdobyła mistrzostwo UFC (2015). Pas wagi słomkowej obroniła pięć razy z rzędu.",category:"combat",year:2015,emoji:"🇵🇱"},{id:"w11",text:"Wszystkie kamienie do curlingu na igrzyskach wykonuje się z granitu z jednej maleńkiej szkockiej wyspy Ailsa Craig. Jeden kamień waży prawie 20 kg.",category:"winter",year:2018,emoji:"🥌"},{id:"w12",text:"Norweg Ole Einar Bjørndalen zdobył 13 medali olimpijskich w biathlonie (8 złotych) — ostatnie złoto wywalczył w wieku 40 lat.",category:"winter",year:2014,emoji:"🎯"},{id:"w13",text:"Kamil Stoch wygrał Turniej Czterech Skoczni 2017/18 z kompletem zwycięstw we wszystkich czterech konkursach — wcześniej dokonał tego tylko Sven Hannawald.",category:"winter",year:2018,emoji:"🏆"},{id:"s8",text:"Amerykanka Katie Ledecky potrafiła wygrywać finały na 800 m stylem dowolnym z przewagą kilkunastu sekund — na basenie oznacza to prawie pełną długość niecki.",category:"water",year:2016,emoji:"🏊‍♀️"},{id:"s9",text:"Mateusz Kusznierewicz zdobył w Atlancie 1996 pierwsze polskie złoto olimpijskie w żeglarstwie — w klasie Finn, mając zaledwie 21 lat.",category:"water",year:1996,emoji:"⛵"},{id:"k8",text:"Różowa koszulka lidera Giro d'Italia ma ten sam rodowód co żółta z Touru: to kolor papieru gazety-organizatora, La Gazzetta dello Sport.",category:"cycling",year:1931,emoji:"🩷"},{id:"k9",text:"Katarzyna Niewiadoma wygrała Tour de France Femmes 2024, broniąc na ostatnim podjeździe przewagi... 4 sekund — to najmniejsza różnica w historii wielkich tourów.",category:"cycling",year:2024,emoji:"🇵🇱"},{id:"p14",text:"Stanisław Marusarz, przedwojenny wicemistrz świata w skokach, podczas okupacji był kurierem tatrzańskim. Skazany przez gestapo na śmierć, uciekł z celi... skokiem z okna więzienia.",category:"poland",year:1938,emoji:"🪂"},{id:"p15",text:"Kazimierz Górski, trener „Orłów”, przeszedł do historii także językiem: „Dopóki piłka w grze, wszystko jest możliwe” i „Piłka jest okrągła, a bramki są dwie” cytowane są do dziś.",category:"poland",year:1974,emoji:"💬"},{id:"p16",text:"Hubert Hurkacz w drodze do półfinału Wimbledonu 2021 pokonał Rogera Federera, wygrywając trzeciego seta 6:0. Był to ostatni mecz Szwajcara na Wimbledonie w karierze.",category:"poland",year:2021,emoji:"🎾"},{id:"p17",text:"Jan Kowalczyk na koniu Artemor zdobył w Moskwie 1980 jedyne w historii Polski złoto olimpijskie w jeździectwie — w skokach przez przeszkody.",category:"poland",year:1980,emoji:"🐴"},{id:"an9",text:"Wbrew filmom gladiatorzy rzadko walczyli na śmierć — byli zbyt kosztowni w wyszkoleniu i utrzymaniu. Większość walk kończyła się poddaniem, a gwiazdy areny miały fanów jak dzisiejsi sportowcy.",category:"ancient",emoji:"🗡️"},{id:"an10",text:"Przez pierwsze 13 starożytnych igrzysk rozgrywano tylko jedną konkurencję: bieg na jeden stadion, czyli ok. 192 metry. Od długości tej areny pochodzi dzisiejsze słowo „stadion”.",category:"ancient",emoji:"🏃"},{id:"r14",text:"Indianapolis 500 to największe jednodniowe wydarzenie sportowe świata — wyścig ogląda z trybun ponad 300 tysięcy widzów. Zwycięzca tradycyjnie pije na mecie... mleko.",category:"records",year:1936,emoji:"🥛"},{id:"r15",text:"Najmłodszym arcymistrzem szachowym w historii został w 2021 roku Abhimanyu Mishra — miał 12 lat i 4 miesiące.",category:"chess",year:2021,emoji:"♟️"},{id:"r16",text:"Jeździectwo to jedyna dyscyplina olimpijska, w której kobiety i mężczyźni rywalizują ze sobą bezpośrednio, na równych zasadach i o te same medale.",category:"equestrian",year:1964,emoji:"🐎"},{id:"r17",text:"Fauja Singh w 2011 roku jako pierwszy stulatek w historii ukończył maraton (Toronto, 8 godz. 11 min). Biegać zaczął... po osiemdziesiątce.",category:"records",year:2011,emoji:"💯"},{id:"wc1",text:"Urugwaj 1930: na pierwszy mundial nie było eliminacji — FIFA rozsyłała zaproszenia. Cztery europejskie reprezentacje płynęły do Montevideo tym samym statkiem przez dwa tygodnie, trenując na pokładzie.",category:"worldcup",year:1930,emoji:"🚢"},{id:"wc2",text:"Włochy 1934 i Francja 1938: Włosi jako pierwsi obronili tytuł mistrzów świata. Turnieje rozgrywano w cieniu propagandy Mussoliniego, a selekcjoner Vittorio Pozzo pozostaje jedynym trenerem z dwoma tytułami MŚ.",category:"worldcup",year:1938,emoji:"🇮🇹"},{id:"wc3",text:"Mundiale 1942 i 1946 nigdy się nie odbyły z powodu II wojny światowej. Trofeum Julesa Rimeta przetrwało wojnę ukryte w pudełku po butach pod łóżkiem włoskiego działacza FIFA.",category:"worldcup",year:1942,emoji:"📦"},{id:"wc4",text:"Brazylia 1950: Indie wycofały się z turnieju. Popularna legenda głosi, że przez zakaz gry boso — w rzeczywistości zdecydowały głównie koszty podróży i niska wówczas ranga mundialu w Indiach.",category:"worldcup",year:1950,emoji:"🇮🇳"},{id:"wc5",text:"Szwajcaria 1954 to najbardziej bramkostrzelny mundial w historii: średnio 5,38 gola na mecz. Austria wygrała ze Szwajcarią 7:5, a Węgrzy strzelili w turnieju 27 goli — i i tak przegrali finał.",category:"worldcup",year:1954,emoji:"🎯"},{id:"wc6",text:"Szwecja 1958: jedyny mundial, na którym zagrały wszystkie cztery brytyjskie reprezentacje (Anglia, Szkocja, Walia i Irlandia Płn.) — i debiut 17-letniego Pelégo, który w finale strzelił dwa gole.",category:"worldcup",year:1958,emoji:"🌟"},{id:"wc7",text:"Chile 1962 zapamiętano przez „bitwę o Santiago” — mecz Chile–Włochy z bójkami i interwencjami policji. Angielski sędzia Ken Aston wspominał: „Nie sędziowałem meczu, byłem arbitrem manewrów wojskowych”.",category:"worldcup",year:1962,emoji:"🥊"},{id:"wc8",text:"Anglia 1966: Geoff Hurst strzelił pierwszego (i przez 56 lat jedynego) hat-tricka w finale MŚ, a jego „gol-widmo” z poprzeczki analizowany jest do dziś. Drugi hat-trick w finale zaliczył dopiero Mbappé w 2022.",category:"worldcup",year:1966,emoji:"👻"},{id:"wc9",text:"Meksyk 1970: pierwszy mundial transmitowany w kolorze i uważany za najpiękniejszy w historii. Brazylia po trzecim tytule zatrzymała puchar Rimeta na własność — a ten został później skradziony i nigdy go nie odnaleziono.",category:"worldcup",year:1970,emoji:"🌈"},{id:"wc10",text:"RFN 1974: Holandia Johana Cruyffa olśniła świat „futbolem totalnym”, w którym każdy grał na każdej pozycji — i przegrała finał z gospodarzami, prowadząc 1:0 po golu z karnego w 2. minucie.",category:"worldcup",year:1974,emoji:"🍊"},{id:"wc11",text:"Hiszpania 1982: Paolo Rossi wrócił na boisko prosto z dwuletniego zawieszenia za aferę bukmacherską — i został królem strzelców oraz bohaterem mistrzowskich Włoch, z hat-trickiem przeciwko wielkiej Brazylii.",category:"worldcup",year:1982,emoji:"🎰"},{id:"wc12",text:"Meksyk 1986: turniej miał odbyć się w Kolumbii, która zrezygnowała z powodów finansowych. Meksyk został gospodarzem mimo potężnego trzęsienia ziemi na 8 miesięcy przed startem — i mundial Maradony przeszedł do legendy.",category:"worldcup",year:1986,emoji:"🌋"},{id:"wc13",text:"USA 1994: pierwszy finał MŚ rozstrzygnięty rzutami karnymi. Decydującą jedenastkę przestrzelił Roberto Baggio — najlepszy piłkarz turnieju. Frekwencja z tego mundialu (średnio 69 tys. na mecz) pozostaje rekordem.",category:"worldcup",year:1994,emoji:"😔"},{id:"wc14",text:"Korea i Japonia 2002: pierwszy mundial w Azji i pierwszy z dwoma gospodarzami. Na otwarcie Senegal sensacyjnie pokonał broniącą tytułu Francję, a Korea Południowa dotarła aż do półfinału.",category:"worldcup",year:2002,emoji:"🌏"},{id:"wc15",text:"RPA 2010: pierwszy mundial w Afryce, zapamiętany przez brzęczące wuwuzele. Hiszpania jako pierwsza drużyna w historii zdobyła tytuł mimo porażki w meczu otwarcia (0:1 ze Szwajcarią).",category:"worldcup",year:2010,emoji:"📯"},{id:"wc16",text:"Brazylia 2014: gospodarze przegrali półfinał z Niemcami 1:7 — to „Mineirazo”, największa kompromitacja w historii kraju futbolu. Niemcy strzelili 4 gole w ciągu 6 minut.",category:"worldcup",year:2014,emoji:"😱"},{id:"wc17",text:"Katar 2022: pierwszy mundial zimą i pierwszy w kraju arabskim. Finał Argentyna–Francja (3:3, karne, hat-trick Mbappé i tytuł dla Messiego) powszechnie uznaje się za najlepszy w historii turnieju.",category:"worldcup",year:2022,emoji:"🏜️"},{id:"wc18",text:"Mundial 2026 w USA, Kanadzie i Meksyku będzie pierwszym z trzema gospodarzami i pierwszym z 48 drużynami. Meksyk zostanie pierwszym krajem, który gości mecze MŚ po raz trzeci.",category:"worldcup",year:2026,emoji:"🤝"},{id:"ch1",text:"„Partię stulecia” rozegrał w 1956 roku 13-letni Bobby Fischer, poświęcając hetmana za druzgocący atak. Piętnaście lat później został mistrzem świata, kończąc 24-letnią dominację ZSRR.",category:"chess",year:1956,emoji:"🧒"},{id:"ch2",text:"W 1997 roku komputer Deep Blue firmy IBM pokonał mistrza świata Garriego Kasparowa w pełnym meczu. Kasparow oskarżał maszynę o... korzystanie z ludzkiej pomocy.",category:"chess",year:1997,emoji:"🤖"},{id:"ch3",text:"Mecz Fischer–Spasski w Reykjaviku (1972) nazwano „meczem stulecia” — pojedynek Amerykanina z Rosjaninem w środku zimnej wojny śledził cały świat, a o start Fischera zabiegał osobiście Henry Kissinger.",category:"chess",year:1972,emoji:"🥶"},{id:"ch4",text:"Węgierka Judit Polgár, najlepsza szachistka wszech czasów, pokonała w karierze 11 mistrzów świata — w tym Kasparowa — i weszła do pierwszej dziesiątki rankingu... ogólnego, nie kobiecego.",category:"chess",year:2005,emoji:"👸"},{id:"ch5",text:"Liczba możliwych partii szachowych (tzw. liczba Shannona, ok. 10^120) wielokrotnie przewyższa liczbę atomów w obserwowalnym wszechświecie (ok. 10^80).",category:"chess",emoji:"♾️"},{id:"ch6",text:"Najkrótsza możliwa przegrana w szachach to „głupi mat” — zaledwie dwa posunięcia. W turniejach zdarzały się też porażki przez... spóźnienie lub dzwoniący telefon.",category:"chess",emoji:"⚡"},{id:"e1",text:"Pierwszy turniej gier wideo odbył się w 1972 roku na Uniwersytecie Stanforda — grano w Spacewar!, a nagrodą była roczna prenumerata magazynu Rolling Stone.",category:"esport",year:1972,emoji:"🕹️"},{id:"e2",text:"Koreańczyk Lee „Faker” Sang-hyeok, nazywany „Michaelem Jordanem e-sportu”, zdobył z drużyną T1 pięć tytułów mistrza świata w League of Legends i odrzucał wielomilionowe oferty transferu.",category:"esport",year:2024,emoji:"🐐"},{id:"e3",text:"Finały mistrzostw świata League of Legends oglądają dziesiątki milionów widzów jednocześnie — oglądalność online bywa wyższa niż finałów wielu tradycyjnych lig sportowych.",category:"esport",year:2023,emoji:"📺"},{id:"e4",text:"Katowicki Spodek to jedna z najsłynniejszych aren e-sportu na świecie. Turniej IEM Katowice ściąga od 2013 roku dziesiątki tysięcy fanów Counter-Strike'a i StarCrafta do Polski.",category:"esport",year:2013,emoji:"🛸"},{id:"e5",text:"Na Igrzyskach Azjatyckich 2022 w Hangzhou e-sport po raz pierwszy był pełnoprawną dyscypliną medalową — złoto w League of Legends zdobyła Korea Południowa, a Faker został... zwolniony z wojska.",category:"esport",year:2023,emoji:"🥇"},{id:"f24",text:"Leicester City zostało mistrzem Anglii w 2016 roku, choć bukmacherzy wyceniali szanse na 5000:1 — bardziej prawdopodobne było według nich odnalezienie Elvisa żywego.",category:"football",year:2016,emoji:"🦊"},{id:"o22",text:"Ceremonia otwarcia igrzysk w Paryżu 2024 jako pierwsza w historii odbyła się poza stadionem — sportowcy płynęli barkami po Sekwanie przez środek miasta.",category:"olympics",year:2024,emoji:"🛶"},{id:"a18",text:"Wilma Rudolph w dzieciństwie chorowała na polio i lekarze wątpili, czy będzie chodzić bez aparatu ortopedycznego. W Rzymie 1960 zdobyła trzy złote medale w sprintach.",category:"athletics",year:1960,emoji:"💪"},{id:"t15",text:"Ken Rosewall wygrał Australian Open 1972 w wieku 37 lat i pozostaje najstarszym zwycięzcą turnieju wielkoszlemowego w singlu mężczyzn w erze open.",category:"tennis",year:1972,emoji:"🎂"},{id:"b13",text:"Spud Webb, mierzący zaledwie 170 cm, wygrał w 1986 roku konkurs wsadów NBA — pokonując w finale swojego klubowego kolegę, który był od niego wyższy o 33 cm.",category:"basketball",year:1986,emoji:"🦘"},{id:"w14",text:"Japończyk Yuzuru Hanyu w 2018 roku jako pierwszy łyżwiarz figurowy od 66 lat obronił olimpijskie złoto w konkurencji mężczyzn. Po jego występach fani zasypywali lodowisko pluszowymi Kubusiami Puchatkami.",category:"winter",year:2018,emoji:"⛸️"},{id:"m13",text:"Rajdowa Grupa B — potwory o mocy ponad 500 KM z lat 80. — została zakazana w 1986 roku po serii tragicznych wypadków. Kibice stali wtedy na trasach dosłownie na torze jazdy aut.",category:"motorsport",year:1986,emoji:"🚗"},{id:"c13",text:"Francuski judoka Teddy Riner wygrał 11 mistrzostw świata i przez prawie 10 lat (154 walki) pozostawał niepokonany.",category:"combat",year:2020,emoji:"🥋"},{id:"p18",text:"Tomasz Majewski obronił olimpijskie złoto w pchnięciu kulą (2008, 2012) jako pierwszy kulomiot od 56 lat. Przed Pekinem nie był faworytem nawet własnej federacji.",category:"poland",year:2012,emoji:"🥎"},{id:"s10",text:"Austriak Herbert Nitsch, „najgłębszy człowiek świata”, zanurkował na wstrzymanym oddechu na 214 metrów w formule „no limits”. To głębiej, niż operuje wiele okrętów podwodnych.",category:"water",year:2007,emoji:"🤿"},{id:"rg1",text:"Według legendy rugby narodziło się w 1823 roku, gdy uczeń szkoły w Rugby, William Webb Ellis, złapał piłkę w ręce podczas meczu futbolu. Historia jest niemal na pewno mitem — ale puchar mistrzostw świata i tak nosi jego imię.",category:"rugby",year:1823,emoji:"🏫"},{id:"rg2",text:"Nowozelandzcy All Blacks przed każdym meczem wykonują hakę — maoryski taniec wojenny. Rywale muszą stać i patrzeć; próby jej zakłócenia kończyły się karami dyscyplinarnymi.",category:"rugby",year:1905,emoji:"🇳🇿"},{id:"rg3",text:"All Blacks to statystycznie najskuteczniejsza reprezentacja w historii światowego sportu — od 1903 roku wygrywają ponad trzy czwarte wszystkich swoich meczów.",category:"rugby",year:1903,emoji:"⬛"},{id:"rg4",text:"30 sekund reklamy podczas Super Bowl kosztuje około 7–8 milionów dolarów — to najdroższy czas antenowy świata. Dla wielu widzów reklamy są równie ważne jak sam mecz.",category:"rugby",year:2025,emoji:"💰"},{id:"rg5",text:"Tom Brady zdobył 7 pierścieni Super Bowl — więcej niż jakakolwiek pojedyncza drużyna NFL. Na drafcie w 2000 roku wybrano go dopiero ze 199. numerem.",category:"rugby",year:2021,emoji:"🐐"},{id:"rg6",text:"Rugby wróciło na igrzyska w 2016 roku (w odmianie siódemek) po 92 latach przerwy. Przez cały ten czas „obrońcami” olimpijskiego tytułu w klasycznym rugby byli... Amerykanie, mistrzowie z 1924 roku.",category:"rugby",year:2016,emoji:"🥇"},{id:"st1",text:"Podnoszenie ciężarów było w programie już pierwszych nowożytnych igrzysk (1896). Rozgrywano wtedy także konkurencję podnoszenia sztangi... jedną ręką.",category:"strength",year:1896,emoji:"🏋️"},{id:"st2",text:"Gruzin Lasha Talakhadze dźwignął w dwuboju 492 kg (2021) — najwięcej w historii. W samym rwaniu podniósł 225 kg, czyli mniej więcej tyle, ile waży dorosły lew z pasażerem.",category:"strength",year:2021,emoji:"🦁"},{id:"st3",text:"Mariusz Pudzianowski wygrał World's Strongest Man rekordowe pięć razy (2002–2008). Żaden strongman w historii nie zdobył więcej tytułów.",category:"strength",year:2008,emoji:"🇵🇱"},{id:"st4",text:"Turek Naim Süleymanoğlu, „Kieszonkowy Herkules” (147 cm wzrostu), zdobył 3 złota olimpijskie i jako pierwszy człowiek podniósł nad głowę trzykrotność masy własnego ciała.",category:"strength",year:1988,emoji:"🦸"},{id:"st5",text:"Kamienie Atlasa — kultowa konkurencja strongman — nawiązują do wielowiekowych prób siły z Islandii i Szkocji, gdzie młodzi mężczyźni dźwigali legendarne głazy, by udowodnić dorosłość.",category:"strength",year:1986,emoji:"🪨"},{id:"st6",text:"Kobiety mogły wystartować w olimpijskim podnoszeniu ciężarów dopiero w Sydney 2000 — ponad sto lat po mężczyznach.",category:"strength",year:2e3,emoji:"👩"},{id:"g1",text:"„Pętla Korbut” — element, w którym Olga Korbut stawała na górnym drążku poręczy — została z czasem zakazana jako zbyt niebezpieczna. Dziś nikt nie może legalnie powtórzyć ruchu, który w 1972 roku oczarował świat.",category:"gymnastics",year:1972,emoji:"🚫"},{id:"g2",text:"Słynna „perfekcyjna dziesiątka” już nie istnieje — od 2006 roku gimnastyka używa otwartej punktacji, w której wynik składa się z oceny trudności i wykonania.",category:"gymnastics",year:2006,emoji:"🔟"},{id:"g3",text:"Japończyk Kōhei Uchimura wygrał wielobój na mistrzostwach świata sześć razy z rzędu (2009–2015) i dołożył dwa złota olimpijskie. Przez dekadę uchodził za niepokonanego.",category:"gymnastics",year:2015,emoji:"🇯🇵"},{id:"g4",text:"Shun Fujimoto złamał nogę w trakcie zawodów drużynowych na IO 1976 — i ukrył to przed wszystkimi. Wykonał jeszcze ćwiczenia na kółkach z zeskokiem z wysokości 2,5 metra, by Japonia zdobyła złoto.",category:"gymnastics",year:1976,emoji:"🦵"},{id:"g5",text:"Radziecka gimnastyczka Larisa Latynina zdobyła 18 medali olimpijskich. Jej rekord wszech czasów przetrwał 48 lat — pobił go dopiero Michael Phelps w 2012 roku.",category:"gymnastics",year:1964,emoji:"🥇"},{id:"g6",text:"Po erze wygrywających nastolatek podniesiono minimalny wiek seniorek w gimnastyce do 16 lat. Nadia Comăneci swoje perfekcyjne dziesiątki zdobywała jako 14-latka — dziś nie mogłaby nawet wystartować.",category:"gymnastics",year:1997,emoji:"🎂"},{id:"x1",text:"Alex Honnold w 2017 roku wspiął się bez liny i asekuracji na 900-metrową ścianę El Capitan w Yosemite. Film o tym wyczynie, „Free Solo”, zdobył Oscara.",category:"extreme",year:2017,emoji:"🧗"},{id:"x2",text:"Felix Baumgartner skoczył w 2012 roku ze stratosfery — z wysokości 39 km. W trakcie swobodnego spadania jako pierwszy człowiek bez pojazdu przekroczył barierę dźwięku.",category:"extreme",year:2012,emoji:"🌌"},{id:"x3",text:"Tony Hawk na X-Games 1999 jako pierwszy skater w historii wykonał „900” — dwa i pół obrotu w powietrzu. Udało mu się za jedenastym podejściem, a ostatni raz powtórzył trik mając 48 lat.",category:"extreme",year:1999,emoji:"🛹"},{id:"x4",text:"Niemiec Sebastian Steudtner ujeżdżił w portugalskim Nazaré falę o wysokości ponad 26 metrów — jak ośmiopiętrowy blok. Gigantyczne fale tworzy tam podwodny kanion głęboki na 5 km.",category:"extreme",year:2020,emoji:"🌊"},{id:"x5",text:"Nazwa BASE jumping to akronim czterech obiektów, z których się skacze: Building (budynek), Antenna (maszt), Span (most) i Earth (klif).",category:"extreme",emoji:"🪂"},{id:"x6",text:"Reinhold Messner jako pierwszy zdobył wszystkie 14 ośmiotysięczników — bez tlenu z butli. Drugi w historii dokonał tego Polak Jerzy Kukuczka, w zaledwie 8 lat (Messner potrzebował 16).",category:"extreme",year:1986,emoji:"🏔️"},{id:"eq1",text:"Japoński jeździec Hiroshi Hoketsu startował na igrzyskach w Londynie 2012 w wieku 71 lat — 48 lat po swoim olimpijskim debiucie w Tokio 1964.",category:"equestrian",year:2012,emoji:"👴"},{id:"eq2",text:"Secretariat, najsłynniejszy koń wyścigowy historii, wygrał Belmont Stakes 1973 o 31 długości, zdobywając Potrójną Koronę. Sekcja wykazała, że jego serce było ponad dwukrotnie większe od przeciętnego.",category:"equestrian",year:1973,emoji:"❤️"},{id:"eq3",text:"Wielka Pardubicka, rozgrywana od 1874 roku, uchodzi za najtrudniejszy wyścig przeszkodowy kontynentalnej Europy. Jej najgroźniejsza przeszkoda, Wielki Taxis, przez lata kończyła kariery koni i jeźdźców.",category:"equestrian",year:1874,emoji:"🐎"},{id:"eq4",text:"Konie olimpijskie latają na igrzyska samolotami cargo w specjalnych boksach, pod opieką lotniczych stajennych — i mają własne paszporty z dokładnym opisem umaszczenia.",category:"equestrian",year:2021,emoji:"✈️"},{id:"eq5",text:"W średniowiecznym wyścigu Palio w Sienie zwycięża koń, który pierwszy przekroczy metę — nawet jeśli po drodze... zgubił dżokeja. Dzielnice miasta rywalizują w nim od stuleci.",category:"equestrian",year:1633,emoji:"🏰"},{id:"eq6",text:"Polska hodowla koni arabskich z Janowa Podlaskiego słynie na cały świat. Na aukcji Pride of Poland w 2015 roku klacz Pepita została sprzedana za rekordowe 1,4 miliona euro.",category:"equestrian",year:2015,emoji:"🇵🇱"},{id:"pr1",text:"Maksymalny brejk w snookerze to 147 punktów. Ronnie O'Sullivan ułożył go w 1997 roku w 5 minut i 8 sekund — rekord uznawany za jeden z najbardziej „nie do pobicia” w sporcie.",category:"precision",year:1997,emoji:"🎱"},{id:"pr2",text:"Phil Taylor zdobył 16 tytułów mistrza świata w darcie — żaden zawodnik w żadnym sporcie precyzyjnym nie zdominował swojej dyscypliny bardziej. Okrzyk „One hundred and eighty!” to znak firmowy tej gry.",category:"precision",year:2013,emoji:"🎯"},{id:"pr3",text:"Koreanki wygrywają drużynowy turniej łuczniczy na każdych igrzyskach od Seulu 1988 — to jedna z najdłuższych serii dominacji w historii sportu. Kandydatki selekcjonuje się tam surowiej niż olimpijczyków.",category:"precision",year:1988,emoji:"🏹"},{id:"pr4",text:"Perfekcyjny leg w darcie — zamknięcie 501 punktów dziewięcioma lotkami — po raz pierwszy w telewizji rzucił Paul Lim na MŚ 1990. Do dziś „dziewiątka” elektryzuje halę bardziej niż finał.",category:"precision",year:1990,emoji:"9️⃣"},{id:"pr5",text:"Perfekcyjna gra w bowlingu to 300 punktów — 12 strike'ów z rzędu. Szansa amatora na taki wynik jest szacowana na mniej niż 1 do 11 000.",category:"precision",year:1997,emoji:"🎳"},{id:"pr6",text:"Prawdopodobieństwo trafienia hole-in-one przez golfistę-amatora szacuje się na około 1 do 12 500. Mimo to zdarzały się dnie, w których na jednym turnieju padały dwa asy na tym samym dołku.",category:"precision",year:1971,emoji:"⛳"},{id:"tr1",text:"Zapasy to prawdopodobnie najstarszy sport świata — sceny zapaśnicze widnieją na malowidłach jaskiniowych sprzed około 15 tysięcy lat i na egipskich freskach z Beni Hasan.",category:"traditional",emoji:"🤼"},{id:"tr2",text:"Lacrosse wywodzi się z rytualnych gier rdzennych Amerykanów, zwanych „małym bratem wojny”. W dawnych meczach potrafiło uczestniczyć po kilkuset graczy, a boisko miało kilometry długości.",category:"traditional",emoji:"🥍"},{id:"tr3",text:"Irlandzki hurling ma około 3000 lat i uchodzi za najszybszą grę zespołową na trawie. Co ciekawe, jego gwiazdy to amatorzy — po finale na 80-tysięcznym Croke Park wracają do pracy w biurze czy na farmie.",category:"traditional",emoji:"🇮🇪"},{id:"tr4",text:"Buzkaszi, narodowy sport Azji Środkowej, to gra jeźdźców o... tuszę kozy. Mecze potrafią trwać wiele godzin, a najlepsi zawodnicy (czapandazi) osiągają szczyt formy po czterdziestce.",category:"traditional",emoji:"🐐"},{id:"tr5",text:"Calcio storico, rozgrywane we Florencji od XVI wieku, łączy piłkę nożną, rugby i walki wręcz. Gra się w historycznych strojach, a nagrodą dla zwycięskiej dzielnicy tradycyjnie była... krowa rasy chianina.",category:"traditional",year:1580,emoji:"🐄"},{id:"tr6",text:"W kabaddi zawodnik atakuje, powtarzając bez przerwy „kabaddi, kabaddi” — tradycyjnie na jednym oddechu. Zawodową ligę kabaddi ogląda w Indiach kilkaset milionów widzów.",category:"traditional",emoji:"🫁"},{id:"tr7",text:"W baskijskiej pelocie (jai alai) piłka odbijana wiklinowym koszem osiąga ponad 300 km/h — to najszybciej poruszająca się piłka w jakimkolwiek sporcie świata.",category:"traditional",emoji:"🧺"},{id:"hb1",text:"Piłka ręczna zaczynała jako gra 11-osobowa na boisku trawiastym — właśnie w takiej formie zadebiutowała na igrzyskach w Berlinie 1936. Halowa „siódemka” weszła do programu olimpijskiego dopiero w 1972 roku.",category:"handball",year:1936,emoji:"🌱"},{id:"hb2",text:"Reprezentacja Polski pod wodzą Bogdana Wenty zdobyła srebro MŚ 2007 i brąz MŚ 2009. Mecze „biało-czerwonych” oglądało wtedy po kilka milionów widzów.",category:"handball",year:2007,emoji:"🇵🇱"},{id:"hb3",text:"Karol Bielecki stracił oko po uderzeniu palcem rywala w meczu w 2010 roku. Wrócił na parkiet w specjalnych goglach i grał na najwyższym poziomie jeszcze przez wiele lat, zdobywając z Polską brąz MŚ 2015.",category:"handball",year:2010,emoji:"🥽"},{id:"hb4",text:"Francuscy „Les Experts” jako pierwsza drużyna w historii piłki ręcznej posiadali jednocześnie tytuły mistrzów świata, Europy i igrzysk olimpijskich (2010).",category:"handball",year:2010,emoji:"🇫🇷"},{id:"hb5",text:"Najmocniejsze rzuty w zawodowej piłce ręcznej przekraczają 120 km/h — piłka leci szybciej, niż jedzie samochód na ekspresówce, a bramkarz ma na reakcję ułamek sekundy.",category:"handball",year:2012,emoji:"💨"},{id:"hb6",text:"Duńczycy dokonali rzeczy bezprecedensowej: wygrali cztery mistrzostwa świata z rzędu (2019, 2021, 2023, 2025). Wcześniej nikomu nie udało się nawet trzy razy pod rząd.",category:"handball",year:2025,emoji:"🇩🇰"},{id:"hk1",text:"Puchar Stanleya to jedyne wielkie trofeum, na którym graweruje się nazwiska wszystkich zwycięzców — razem z błędami (np. „TORONTO MAPLE LEAES” z 1963). Każdy mistrz spędza z pucharem jeden dzień, gdzie tylko chce.",category:"hockey",year:1893,emoji:"🏆"},{id:"hk2",text:"Krążki hokejowe przed meczami NHL się zamraża — schłodzona guma mniej odbija się od lodu i krążek pewniej trzyma się tafli. Podczas meczu krążki wymienia się co kilka minut.",category:"hockey",year:1990,emoji:"🧊"},{id:"hk3",text:"Radziecka „Czerwona Maszyna” zdominowała światowy hokej na cztery dekady: między 1954 a 1991 rokiem wygrała zdecydowaną większość mistrzostw świata i 7 z 9 turniejów olimpijskich, w których startowała.",category:"hockey",year:1972,emoji:"🚂"},{id:"hk4",text:"Zdeno Chára (206 cm) był najwyższym zawodnikiem w historii NHL — liga wydała mu specjalne zezwolenie na kij dłuższy, niż dopuszczają przepisy. Jego strzał zmierzono na 175,1 km/h.",category:"hockey",year:2012,emoji:"📏"},{id:"hk5",text:"W hokeju na trawie Indie zdobyły 6 złotych medali olimpijskich z rzędu (1928–1956). Gwiazdą tej ery był Dhyan Chand — „czarodziej”, któremu po jednym z pokazów rozkręcono kij, by sprawdzić, czy nie ma w nim magnesu.",category:"hockey",year:1936,emoji:"🪄"},{id:"hk6",text:"Najdłuższy mecz w historii NHL: Detroit Red Wings – Montreal Maroons (1936) trwał 176 minut i 30 sekund gry — zwycięskiego gola w szóstej dogrywce strzelił debiutant Mud Bruneteau ok. 2:25 w nocy.",category:"hockey",year:1936,emoji:"🌙"},{id:"wg1",text:"Chamonix 1924: pierwsza zimowa olimpiada w ogóle nie była „igrzyskami” — imprezę nazwano Tygodniem Sportów Zimowych, a status pierwszych zimowych IO przyznano jej dopiero wstecznie, dwa lata później.",category:"wintergames",year:1924,emoji:"🏔️"},{id:"wg2",text:"St. Moritz 1928: 15-letnia Norweżka Sonja Henie zdobyła pierwsze z trzech kolejnych złotych medali w łyżwiarstwie figurowym. Później została gwiazdą Hollywood i jedną z najlepiej zarabiających aktorek epoki.",category:"wintergames",year:1928,emoji:"⛸️"},{id:"wg3",text:"Garmisch-Partenkirchen 1936: narciarstwo alpejskie zadebiutowało na igrzyskach — ale instruktorów narciarskich uznano za zawodowców i wykluczono. W proteście zbojkotowali igrzyska najlepsi Austriacy i Szwajcarzy.",category:"wintergames",year:1936,emoji:"⛷️"},{id:"wg4",text:"St. Moritz 1948: pierwsze zimowe igrzyska po 12-letniej wojennej przerwie nazwano „Igrzyskami Odnowy”. Niemiec i Japonii nie zaproszono.",category:"wintergames",year:1948,emoji:"🕊️"},{id:"wg5",text:"Oslo 1952: znicz zapalono nie w Olimpii, lecz w norweskim Morgedal — rodzinnej wiosce ojca narciarstwa Sondre Norheima — a sztafeta z ogniem jechała... na nartach.",category:"wintergames",year:1952,emoji:"🔥"},{id:"wg6",text:"Cortina d'Ampezzo 1956: pierwsze zimowe igrzyska transmitowane w telewizji. Podczas ceremonii otwarcia łyżwiarz wnoszący znicz potknął się... o kabel telewizyjny — ognia jednak nie upuścił.",category:"wintergames",year:1956,emoji:"📺"},{id:"wg7",text:"Squaw Valley 1960: jedyne zimowe igrzyska bez bobslejów — organizatorzy uznali budowę toru za zbyt drogą. Ceremonie otwarcia i zamknięcia reżyserował sam Walt Disney.",category:"wintergames",year:1960,emoji:"🎬"},{id:"wg8",text:"Innsbruck 1964: przed igrzyskami nastała odwilż i zabrakło śniegu. Austriacka armia przywiozła z gór dziesiątki tysięcy ton śniegu i bloków lodu — trasy układano ręcznie.",category:"wintergames",year:1964,emoji:"🪖"},{id:"wg9",text:"Grenoble 1968: Francuz Jean-Claude Killy wygrał u siebie wszystkie trzy konkurencje alpejskie — wyczyn powtórzony do dziś tylko raz. Igrzyska po raz pierwszy transmitowano w kolorze.",category:"wintergames",year:1968,emoji:"🇫🇷"},{id:"wg10",text:"Lake Placid 1980 to nie tylko „cud na lodzie”: Amerykanin Eric Heiden wygrał wszystkie pięć dystansów w łyżwiarstwie szybkim — od sprintu po 10 km. Nikt inny nie dokonał czegoś podobnego.",category:"wintergames",year:1980,emoji:"🥇"},{id:"wg11",text:"Lillehammer 1994: pierwsze zimowe igrzyska rozegrane w nowym, przesuniętym cyklu (2 lata po Albertville). Nagłówki zdominowała afera Tonyi Harding, której współpracownicy napadli na rywalkę Nancy Kerrigan.",category:"wintergames",year:1994,emoji:"📰"},{id:"wg12",text:"Nagano 1998: na igrzyskach zadebiutował snowboard, curling wrócił po 74 latach, a NHL po raz pierwszy przerwała sezon, by wypuścić gwiazdy na turniej olimpijski.",category:"wintergames",year:1998,emoji:"🏂"},{id:"wg13",text:"Salt Lake City 2002: skandal sędziowski w łyżwiarstwie figurowym par zakończył się bezprecedensowo — MKOl przyznał dwa komplety złotych medali, Rosjanom i Kanadyjczykom.",category:"wintergames",year:2002,emoji:"⚖️"},{id:"wg14",text:"Soczi 2014 było najdroższą imprezą sportową w historii — koszty szacowano na około 50 miliardów dolarów, więcej niż wszystkie poprzednie zimowe igrzyska razem wzięte.",category:"wintergames",year:2014,emoji:"💸"},{id:"wg15",text:"Pekin 2022 został pierwszym miastem w historii, które zorganizowało zarówno letnie (2008), jak i zimowe igrzyska. Konkurencje śnieżne rozgrywano niemal w całości na sztucznym śniegu.",category:"wintergames",year:2022,emoji:"🏙️"},{id:"wg16",text:"Mediolan-Cortina 2026: Cortina d'Ampezzo wraca jako gospodarz po 70 latach, a igrzyska po raz pierwszy dzielą dwa miasta oddalone o ponad 400 km.",category:"wintergames",year:2026,emoji:"🇮🇹"},{id:"o23",text:"Antwerpia 1920: na igrzyskach zadebiutowały flaga olimpijska z pięcioma kołami i przysięga sportowców. Na znak pokoju po I wojnie światowej wypuszczono gołębie.",category:"olympics",year:1920,emoji:"🏳️"},{id:"o24",text:"Londyn 1948 przeszedł do historii jako „igrzyska oszczędnościowe”: w zrujnowanym wojną mieście sportowcy mieszkali w koszarach i szkołach, a niektórzy przywozili własne ręczniki i jedzenie.",category:"olympics",year:1948,emoji:"🥫"},{id:"o25",text:"Meksyk 1968: rozrzedzone powietrze na wysokości 2240 m przyniosło deszcz rekordów w sprintach i skokach. Na podium 200 m Tommie Smith i John Carlos unieśli pięści w geście Black Power — i zostali wydaleni z igrzysk.",category:"olympics",year:1968,emoji:"✊"},{id:"o26",text:"Monachium 1972: zamach terrorystyczny na izraelską ekipę kosztował życie 11 sportowców i trenerów. Po dniu żałoby igrzyska dokończono pod hasłem „The Games must go on”.",category:"olympics",year:1972,emoji:"🖤"},{id:"o27",text:"Sydney 2000: Cathy Freeman najpierw zapaliła znicz olimpijski, a potem wygrała bieg na 400 m — jako pierwsza Aborygenka ze złotem indywidualnym. Rundę honorową pobiegła z flagą australijską i aborygeńską.",category:"olympics",year:2e3,emoji:"🇦🇺"},{id:"o28",text:"Londyn 2012: po raz pierwszy w historii kobiety znalazły się w każdej reprezentacji i mogły startować w każdej dyscyplinie — ostatni bastion, boks, otworzył się właśnie wtedy.",category:"olympics",year:2012,emoji:"🥊"},{id:"o29",text:"Rio 2016: pierwsze igrzyska w Ameryce Południowej i debiut Drużyny Uchodźców — dziesięciorga sportowców startujących pod flagą olimpijską, w tym pływaczki, która rok wcześniej wpław ratowała łódź z uchodźcami.",category:"olympics",year:2016,emoji:"🤍"},{id:"rq1",text:"Badminton to najszybszy sport rakietowy świata — w warunkach testowych smecz lotki zmierzono na 565 km/h, a w meczu na ponad 420 km/h. Lotka i tak gwałtownie hamuje: na drugą stronę kortu dolatuje kilkukrotnie wolniej.",category:"racquet",year:2023,emoji:"💨"},{id:"rq2",text:"Badminton wywodzi się z indyjskiej gry „poona”, którą brytyjscy oficerowie przywieźli do Anglii. Nazwa pochodzi od rezydencji księcia Beaufort — Badminton House, gdzie grano w nią od lat 70. XIX wieku.",category:"racquet",year:1873,emoji:"🏰"},{id:"rq3",text:"Chiny zdominowały olimpijski tenis stołowy jak żaden kraj żadną dyscyplinę — od 1988 roku zdobyły zdecydowaną większość wszystkich złotych medali, a chińscy zawodnicy reprezentują też dziesiątki innych państw.",category:"racquet",year:1988,emoji:"🇨🇳"},{id:"rq4",text:"Squash, wielokrotnie uznawany za najzdrowszy sport świata, przez dekady bezskutecznie pukał do drzwi igrzysk. Doczeka się debiutu dopiero w Los Angeles 2028.",category:"racquet",year:2028,emoji:"🚪"},{id:"rq5",text:"„Dyplomacja ping-pongowa”: wizyta amerykańskich tenisistów stołowych w Chinach w 1971 roku przełamała lody między mocarstwami i utorowała drogę wizycie prezydenta Nixona rok później.",category:"racquet",year:1971,emoji:"🕊️"},{id:"rq6",text:"Natalia Partyka, urodzona bez prawej dłoni, startowała w tenisie stołowym zarówno na igrzyskach paraolimpijskich (wiele złotych medali), jak i na czterech zwykłych igrzyskach olimpijskich.",category:"racquet",year:2008,emoji:"🇵🇱"},{id:"gf1",text:"W 1457 roku szkocki król Jakub II zakazał gry w golfa, bo odciągała poddanych od obowiązkowych ćwiczeń z łucznictwa. Zakaz — skrupulatnie ignorowany — zniesiono dopiero pół wieku później.",category:"golf",year:1457,emoji:"🏴󠁧󠁢󠁳󠁣󠁴󠁿"},{id:"gf2",text:"Standard 18 dołków pochodzi z St Andrews: w 1764 roku tamtejsi golfiści połączyli kilka krótkich dołków i wyszło im 18. Reszta świata po prostu skopiowała „Old Course”.",category:"golf",year:1764,emoji:"🔢"},{id:"gf3",text:"Zwycięzca turnieju Masters dostaje słynną zieloną marynarkę — ale może ją zabrać do domu tylko na rok. Potem wraca ona do klubu Augusta National, gdzie czeka na właściciela w szatni mistrzów.",category:"golf",year:1949,emoji:"🧥"},{id:"gf4",text:"The Open Championship, rozgrywany od 1860 roku, to najstarszy turniej golfowy świata. Zwycięzca otrzymuje dzban Claret Jug — a pierwotną nagrodą był... czerwony skórzany pas.",category:"golf",year:1860,emoji:"🏺"},{id:"gf5",text:"Szwedka Annika Sörenstam jest jedyną kobietą, która zagrała rundę 59 uderzeń w zawodowym turnieju (2001). W męskim golfie takich rund było ledwie kilkanaście.",category:"golf",year:2001,emoji:"5️⃣"},{id:"gf6",text:"Adrian Meronk w 2022 roku jako pierwszy Polak wygrał turniej głównego europejskiego cyklu (Irish Open, DP World Tour) — golf nad Wisłą z ciekawostki zaczął zmieniać się w poważny sport.",category:"golf",year:2022,emoji:"🇵🇱"},{id:"eu1",text:"Pierwsze Euro (1960) nazywało się Pucharem Narodów Europy, a w finałach grały tylko 4 drużyny. Wygrał ZSRR z legendarnym Lwem Jaszynem w bramce — jedynym bramkarzem ze Złotą Piłką w historii.",category:"euro",year:1960,emoji:"🥅"},{id:"eu2",text:"Euro 1968: półfinał Włochy–ZSRR po dogrywce wciąż był bezbramkowy, a karnych jeszcze nie wymyślono. O awansie gospodarzy zdecydował... rzut monetą w szatni.",category:"euro",year:1968,emoji:"🪙"},{id:"eu3",text:"Euro 1976: Antonín Panenka rozstrzygnął finał Czechosłowacja–RFN pierwszą słynną „panenką” — lekką podcinką środkiem bramki. Trenował ją latami po treningach, o zakładach z bramkarzem o czekoladę i piwo.",category:"euro",year:1976,emoji:"🍫"},{id:"eu4",text:"Euro 1984: Michel Platini strzelił 9 goli w 5 meczach — w tym dwa hat-tricki — i poprowadził Francję do pierwszego trofeum. Ten rekord jednego turnieju wydaje się nie do pobicia.",category:"euro",year:1984,emoji:"9️⃣"},{id:"eu5",text:"Euro 1988: Marco van Basten trafił w finale wolejem z niemal zerowego kąta — jeden z najpiękniejszych goli wszech czasów dał Holandii jedyne wielkie trofeum w historii.",category:"euro",year:1988,emoji:"🍊"},{id:"eu6",text:"Euro 1992: Dania w ogóle nie awansowała do turnieju — dostała się na dwa tygodnie przed startem za wykluczoną Jugosławię. I sensacyjnie wygrała całe mistrzostwa, ogrywając w finale Niemcy.",category:"euro",year:1992,emoji:"🇩🇰"},{id:"eu7",text:"Euro 2004: Grecja, u bukmacherów 150:1, pokonała gospodarzy Portugalczyków dwukrotnie — w meczu otwarcia i w finale. Całą fazę pucharową Grecy przeszli, wygrywając każdy mecz dokładnie 1:0.",category:"euro",year:2004,emoji:"🏛️"},{id:"eu8",text:"Euro 2016: Portugalia zdobyła tytuł, wychodząc z grupy z trzeciego miejsca po trzech remisach. Kontuzjowany w finale Ronaldo drugą połowę spędził przy linii, dyrygując kolegami jak drugi trener.",category:"euro",year:2016,emoji:"📣"},{id:"eu9",text:"Euro 2020 rozegrano w 2021 roku (pandemia) i po raz pierwszy w 11 państwach naraz. Włosi wygrali finał z Anglią na Wembley po rzutach karnych.",category:"euro",year:2021,emoji:"😷"},{id:"eu10",text:"Najlepszy wynik Polski na Euro to ćwierćfinał z 2016 roku — biało-czerwoni odpadli z późniejszymi mistrzami, Portugalią, dopiero po rzutach karnych, nie przegrywając w turnieju żadnego meczu w regulaminowym czasie.",category:"euro",year:2016,emoji:"🇵🇱"},{id:"eu11",text:"Euro 2024: Hiszpania sięgnęła po rekordowy czwarty tytuł, wygrywając wszystkie 7 meczów. 16-letni Lamine Yamal został najmłodszym strzelcem w historii turnieju — dzień przed finałem świętował 17. urodziny.",category:"euro",year:2024,emoji:"🇪🇸"},{id:"sg1",text:"Ateny 1896: pierwszy maraton nowożytnych igrzysk wygrał grecki nosiwoda Spyridon Louis. Rodacy oszaleli — kupcy oferowali mu dożywotnio darmowe golenie, ubrania i posiłki, a on poprosił podobno tylko o wóz z koniem.",category:"summergames",year:1896,emoji:"🇬🇷"},{id:"sg2",text:"Paryż 1900: igrzyska były jedynie dodatkiem do wystawy światowej i ciągnęły się przez pięć miesięcy. Część zawodników do końca życia nie wiedziała, że w ogóle startowała na olimpiadzie.",category:"summergames",year:1900,emoji:"🎪"},{id:"sg3",text:"St. Louis 1904: przez ocean dotarła garstka Europejczyków, więc Amerykanie zdobyli zdecydowaną większość medali — w niektórych konkurencjach startowali wyłącznie gospodarze.",category:"summergames",year:1904,emoji:"🇺🇸"},{id:"sg4",text:"Londyn 1908: igrzyska miały odbyć się w Rzymie, ale erupcja Wezuwiusza w 1906 roku zmusiła Włochy do rezygnacji — pieniądze poszły na odbudowę Neapolu, a Londyn przejął imprezę w dwa lata.",category:"summergames",year:1908,emoji:"🌋"},{id:"sg5",text:"Sztokholm 1912: Jim Thorpe wygrał pięciobój i dziesięciobój, ale odebrano mu złota, bo wcześniej grał za drobne pieniądze w baseball. MKOl w pełni przywrócił go na listy zwycięzców dopiero... 110 lat później.",category:"summergames",year:1912,emoji:"🪶"},{id:"sg6",text:"Paryż 1924: powstała pierwsza wioska olimpijska (drewniane baraki z bieżącą wodą), a w basenie błyszczał Johnny Weissmuller — przyszły filmowy Tarzan z trzema złotymi medalami.",category:"summergames",year:1924,emoji:"🌴"},{id:"sg7",text:"Amsterdam 1928: po raz pierwszy przez całe igrzyska płonął znicz olimpijski, a kobiety dopuszczono do lekkoatletyki — z czego skorzystała Halina Konopacka, zdobywając pierwsze polskie złoto.",category:"summergames",year:1928,emoji:"🔥"},{id:"sg8",text:"Los Angeles 1932: wynaleziono tam olimpijskie podium — wcześniej medale wręczano bez ceremonii z trzema stopniami. Wioska olimpijska była tylko dla mężczyzn; kobiety zakwaterowano w hotelu.",category:"summergames",year:1932,emoji:"🥇"},{id:"sg9",text:"Berlin 1936: pierwsze igrzyska pokazywane w telewizji — obraz szedł w zamkniętym obiegu do specjalnych sal telewizyjnych rozsianych po Berlinie, gdzie mecze oglądało łącznie ok. 160 tysięcy ludzi.",category:"summergames",year:1936,emoji:"📡"},{id:"sg10",text:"Helsinki 1952: na igrzyskach zadebiutował Związek Radziecki — i z miejsca zaczęła się trwająca cztery dekady zimnowojenna rywalizacja medalowa z USA. Radziecka ekipa mieszkała w osobnej, odgrodzonej wiosce.",category:"summergames",year:1952,emoji:"🥶"},{id:"sg11",text:"Melbourne 1956: kilka tygodni po krwawym stłumieniu powstania węgierskiego doszło do meczu piłki wodnej Węgry–ZSRR, znanego jako „krew w wodzie”. Węgrzy wygrali 4:0 i zdobyli potem złoto.",category:"summergames",year:1956,emoji:"🩸"},{id:"sg12",text:"Rzym 1960: równolegle z igrzyskami odbyły się tam pierwsze igrzyska paraolimpijskie w historii — wystartowało 400 sportowców na wózkach z 23 państw.",category:"summergames",year:1960,emoji:"♿"},{id:"sg13",text:"Tokio 1964: pierwsze igrzyska w Azji i pierwsze transmitowane satelitarnie na cały świat. Znicz zapalił Yoshinori Sakai — chłopak urodzony w Hiroszimie 6 sierpnia 1945 roku, w dniu wybuchu bomby.",category:"summergames",year:1964,emoji:"🕊️"},{id:"sg14",text:"Montreal 1976: igrzyska wygenerowały tak gigantyczny dług, że miasto spłacało go przez 30 lat — do 2006 roku. Stadion Olimpijski do dziś nazywany jest „The Big Owe” („Wielki Dług”).",category:"summergames",year:1976,emoji:"💸"},{id:"sg15",text:"Los Angeles 1984: pierwsze igrzyska sfinansowane niemal w całości prywatnie — i pierwsze od dawna z zyskiem (ponad 200 mln dolarów). Carl Lewis powtórzył wyczyn Owensa: 4 złota w tych samych konkurencjach.",category:"summergames",year:1984,emoji:"💰"},{id:"sg16",text:"Seul 1988: finał 100 m nazwano później „najbrudniejszym biegiem historii”. Zwycięzcy Benowi Johnsonowi odebrano złoto po 3 dniach za doping, a z czasem kłopoty dopingowe miała większość finalistów.",category:"summergames",year:1988,emoji:"💉"},{id:"sg17",text:"Barcelona 1992: znicz olimpijski zapalono strzałą z łuku — wystrzelił ją paraolimpijczyk Antonio Rebollo. Były to też pierwsze od 20 lat igrzyska bez żadnego bojkotu.",category:"summergames",year:1992,emoji:"🏹"},{id:"sg18",text:"Atlanta 1996: igrzyska stulecia nie odbyły się w Atenach, co Grecy uznali za policzek — wygrała kandydatura z pieniędzmi Coca-Coli. Turniej przyćmił zamach bombowy w parku olimpijskim.",category:"summergames",year:1996,emoji:"🥤"},{id:"sg19",text:"Ateny 2004: igrzyska wróciły do ojczyzny, a pchnięcie kulą rozegrano na stadionie w... anty
