cznej Olimpii — pierwsze zawody na tym obiekcie od ponad 1600 lat.",category:"summergames",year:2004,emoji:"🏛️"},{id:"sg20",text:"Pekin 2008: ceremonia otwarcia ruszyła 8.08.2008 o godzinie 20:08 — ósemka to w Chinach liczba szczęścia. Widowisko z 15 tysiącami wykonawców uchodzi za najbardziej spektakularne w historii.",category:"summergames",year:2008,emoji:"8️⃣"},{id:"sg21",text:"Tokio 2020: pierwsze igrzyska w historii przełożone na inny rok (2021) i rozegrane niemal bez widzów. Sportowcy odbierali medale z tacy i sami zakładali je sobie na szyję.",category:"summergames",year:2021,emoji:"😷"},{id:"sg22",text:"Los Angeles 2028: do programu wraca krykiet — po 128 latach przerwy (jedyny raz rozegrano go w 1900 roku). Zadebiutuje też futbol flagowy i squash.",category:"summergames",year:2028,emoji:"🏏"},{id:"pg1",text:"Paryż 1924: olimpijski debiut niepodległej Polski i od razu dwa medale — srebro kolarzy torowych w wyścigu drużynowym i brąz Adama Królikiewicza w jeździeckich skokach przez przeszkody.",category:"polandgames",year:1924,emoji:"🎉"},{id:"pg2",text:"Amsterdam 1928: dzięki złotu Haliny Konopackiej Mazurek Dąbrowskiego po raz pierwszy w historii zabrzmiał na igrzyskach olimpijskich. Konopacka była też poetką — wydawała tomiki wierszy.",category:"polandgames",year:1928,emoji:"🎶"},{id:"pg3",text:"Los Angeles 1932: Stanisława Walasiewicz wygrała bieg na 100 m, wyrównując rekord świata. Obok złota Kusocińskiego na 10 000 m dało to Polsce najlepsze przedwojenne igrzyska lekkoatletyczne.",category:"polandgames",year:1932,emoji:"🏃‍♀️"},{id:"pg4",text:"Berlin 1936: oszczepniczka Maria Kwaśniewska (brąz) po dekoracji zażartowała do Hitlera, że nie jest od niego niższa. Zdjęciem z tego spotkania podczas okupacji wyciągała ludzi z niemieckich łapanek — strażnicy brali ją za znajomą führera.",category:"polandgames",year:1936,emoji:"🗞️"},{id:"pg5",text:"Londyn 1948: wyniszczona wojną Polska zdobyła tylko jeden medal — brązowy. Wywalczył go pięściarz Aleksy Antkiewicz, który cztery lata później dołożył srebro.",category:"polandgames",year:1948,emoji:"🥉"},{id:"pg6",text:"Helsinki 1952: pierwsze powojenne złoto dla Polski zdobył bokser Zygmunt Chychła. W finale pokonał reprezentanta ZSRR — co w czasach stalinowskich miało wymiar szczególny.",category:"polandgames",year:1952,emoji:"🥊"},{id:"pg7",text:"Melbourne 1956: Elżbieta Krzesińska wygrała skok w dal wynikiem 6,35 m, wyrównując własny rekord świata. Do kraju wróciła jako „narzeczona Australii” — tak pokochała ją tamtejsza publiczność.",category:"polandgames",year:1956,emoji:"🦘"},{id:"pg8",text:"Rzym 1960: rekordowe wówczas 21 polskich medali. Złoto wywalczył m.in. trójskoczek Józef Szmidt — pierwszy człowiek w historii, który skoczył ponad 17 metrów.",category:"polandgames",year:1960,emoji:"🇮🇹"},{id:"pg9",text:"Tokio 1964 i Meksyk 1968: Jerzy Kulej jako jedyny polski bokser w historii zdobył dwa złote medale olimpijskie. Słynął z żelaznej szczęki — w całej karierze nigdy nie był na deskach.",category:"polandgames",year:1968,emoji:"🥊"},{id:"pg10",text:"Monachium 1972: najlepsze igrzyska w historii Polski pod względem złota — aż 7 tytułów, w tym legendarny triumf piłkarzy Kazimierza Górskiego po finale z Węgrami na Stadionie Olimpijskim.",category:"polandgames",year:1972,emoji:"⭐"},{id:"pg11",text:"Moskwa 1980: obok gestu Kozakiewicza złoto na 3000 m z przeszkodami zdobył Bronisław Malinowski. Rok później zginął tragicznie w wypadku na moście w Grudziądzu, mając zaledwie 30 lat.",category:"polandgames",year:1980,emoji:"🕯️"},{id:"pg12",text:"Los Angeles 1984: Polska — jak niemal cały blok wschodni — zbojkotowała igrzyska. Sportowców wysłano na zawody „Przyjaźń-84”, a wielu z nich straciło życiową szansę na medal.",category:"polandgames",year:1984,emoji:"🚫"},{id:"pg13",text:"Seul 1988 i Barcelona 1992: judoka Waldemar Legień jako jedyny Polak wygrał dwa razy z rzędu igrzyska w sportach walki — i to w dwóch różnych kategoriach wagowych.",category:"polandgames",year:1992,emoji:"🥋"},{id:"pg14",text:"Atlanta 1996 – Ateny 2004: era Roberta Korzeniowskiego. Chodziarz zdobył 4 złote medale, w tym unikatowy dublet 20 i 50 km w Sydney. Nikt w historii chodu sportowego nie osiągnął więcej.",category:"polandgames",year:2e3,emoji:"🚶"},{id:"pg15",text:"Sydney 2000: 17-letnia Kamila Skolimowska wygrała rzut młotem i została najmłodszą polską mistrzynią olimpijską w historii. Zmarła nagle w 2009 roku — jej pamięci poświęcony jest coroczny memoriał.",category:"polandgames",year:2e3,emoji:"🔨"},{id:"pg16",text:"Tokio 2020: sztafeta mieszana 4×400 m dała Polsce złoto już pierwszego wieczoru lekkoatletycznych finałów, a Dawid Tomala sensacyjnie wygrał chód na 50 km — w swoim drugim starcie na tym dystansie w życiu.",category:"polandgames",year:2021,emoji:"🤝"},{id:"pg17",text:"Paryż 2024: 20-letnia Julia Szeremeta wywalczyła srebro w boksie — pierwszy polski medal olimpijski w tej dyscyplinie od 32 lat — a jedyne złoto dała Polsce wspinaczka Aleksandra Mirosław.",category:"polandgames",year:2024,emoji:"🥈"},{id:"p19",text:"Najstarsze wciąż istniejące polskie kluby piłkarskie to krakowskie Cracovia i Wisła, założone w 1906 roku. Ich mecze, „święta wojna”, to jedne z najstarszych derbów Europy.",category:"poland",year:1906,emoji:"⚔️"},{id:"p20",text:"Tour de Pologne rozgrywany jest od 1928 roku i należy dziś do światowej elity wyścigów kolarskich (UCI World Tour). Zaczynał jako impreza dla amatorów z 71 uczestnikami.",category:"poland",year:1928,emoji:"🚴"},{id:"p21",text:"Polska PlusLiga uchodzi za jedną z najsilniejszych lig siatkarskich świata — grają w niej gwiazdy z całego globu, a mecze regularnie wypełniają hale na kilkanaście tysięcy widzów.",category:"poland",year:2008,emoji:"🏐"},{id:"p22",text:"Ewa Pajor to najskuteczniejsza strzelczyni w historii reprezentacji Polski kobiet i gwiazda FC Barcelony. To ona poprowadziła Polki do pierwszego w historii awansu na wielki turniej — Euro 2025.",category:"poland",year:2025,emoji:"⚽"},{id:"p23",text:"Feliks „Papa” Stamm, twórca polskiej szkoły boksu, wychował medalistów olimpijskich, których liczy się w dziesiątkach. Jego zawodnicy zdobyli na jednych mistrzostwach Europy (1953) aż 5 złotych medali.",category:"poland",year:1953,emoji:"🧤"},{id:"p24",text:"Polscy himalaiści, zwani „Lodowymi Wojownikami”, jako pierwsi w historii zdobyli zimą 10 z 14 ośmiotysięczników — w tym Everest (1980, Wielicki i Cichy). Zimowy himalaizm to praktycznie polska specjalność narodowa.",category:"poland",year:1980,emoji:"🧊"},{id:"p25",text:"Żużlowa PGE Ekstraliga uchodzi za najsilniejszą i najbogatszą ligę żużlową świata — ścigają się w niej wszyscy najlepsi zawodnicy globu, a średnia frekwencja na meczach bije rekordy Europy.",category:"poland",year:2010,emoji:"🏍️"},{id:"pwc1",text:"Francja 1938: w swoim mundialowym debiucie Polska przegrała z Brazylią 5:6 po dogrywce, a Ernest Wilimowski jako pierwszy piłkarz w historii MŚ strzelił w jednym meczu 4 gole — i zszedł z boiska pokonany.",category:"polandwc",year:1938,emoji:"4️⃣"},{id:"pwc2",text:"Wembley 1973: Jan Tomaszewski, nazwany przez Briana Clougha „klaunem”, bronił wszystkiego w meczu z Anglią. Remis 1:1 wyrzucił gospodarzy z mundialu i otworzył Polsce drogę do złotej ery.",category:"polandwc",year:1973,emoji:"🤡"},{id:"pwc3",text:"RFN 1974: trzecie miejsce — najlepszy wynik w historii — i korona króla strzelców dla Grzegorza Laty (7 goli). O finale zdecydował „mecz na wodzie” z RFN, rozegrany na zalanym ulewą boisku we Frankfurcie.",category:"polandwc",year:1974,emoji:"🌧️"},{id:"pwc4",text:"Argentyna 1978: w meczu z gospodarzami Kazimierz Deyna, rozgrywający tego dnia setny mecz w reprezentacji, nie wykorzystał rzutu karnego. Polska odpadła w drugiej fazie grupowej m.in. po starciu z późniejszymi mistrzami.",category:"polandwc",year:1978,emoji:"💔"},{id:"pwc5",text:"Hiszpania 1982: znów 3. miejsce! Zbigniew Boniek strzelił hat-tricka Belgii na Camp Nou, ale za żółte kartki musiał pauzować w półfinale z Włochami — Polacy do dziś wierzą, że z nim byłby finał.",category:"polandwc",year:1982,emoji:"🥉"},{id:"pwc6",text:"Meksyk 1986: porażka 0:4 z Brazylią w 1/8 finału zamknęła złotą erę polskiego futbolu. Na kolejny mundial biało-czerwoni czekali aż 16 lat.",category:"polandwc",year:1986,emoji:"🚪"},{id:"pwc7",text:"Korea/Japonia 2002: powrót po latach zawdzięczaliśmy golom Emmanuela Olisadebe — naturalizowanego Nigeryjczyka, który w eliminacjach strzelił ich 8. Sam turniej przyniósł jednak dwie porażki na starcie.",category:"polandwc",year:2002,emoji:"🛬"},{id:"pwc8",text:"Niemcy 2006: Polacy bronili się przed gospodarzami do 91. minuty, gdy gola strzelił Oliver Neuville. Mecz w Dortmundzie do dziś uchodzi za jeden z najbardziej bolesnych w historii reprezentacji.",category:"polandwc",year:2006,emoji:"⏱️"},{id:"pwc9",text:"Katar 2022: Polska wyszła z grupy po raz pierwszy od 36 lat, a Wojciech Szczęsny obronił rzut karny samego Leo Messiego. W 1/8 finału lepsze okazały się późniejsze wicemistrzynie świata — Francja.",category:"polandwc",year:2022,emoji:"🧤"},{id:"pwc10",text:"Bilans Polski na mundialach: 9 startów i dwa medale za trzecie miejsca (1974, 1982). Tylko garstka reprezentacji na świecie stawała na podium MŚ częściej, nie zdobywając nigdy tytułu.",category:"polandwc",year:1982,emoji:"📊"},{id:"pc1",text:"Górnik Zabrze to jedyny polski klub, który zagrał w finale europejskiego pucharu — w 1970 roku uległ Manchesterowi City 1:2 w finale Pucharu Zdobywców Pucharów w Wiedniu.",category:"polandclubs",year:1970,emoji:"⚒️"},{id:"pc2",text:"Legia Warszawa w sezonie 1995/96 dotarła do ćwierćfinału Ligi Mistrzów — to wciąż najlepszy wynik polskiego klubu w nowożytnym formacie rozgrywek.",category:"polandclubs",year:1996,emoji:"🪖"},{id:"pc3",text:"Ruch Chorzów i Górnik Zabrze dzielą rekord mistrzostw Polski — po 14 tytułów. Śląsk przez dekady był absolutnym sercem polskiego futbolu.",category:"polandclubs",year:1989,emoji:"🏆"},{id:"pc4",text:"Słynna celebracja „grecka” kibiców Lecha — odwrócenie się tyłem do boiska i skakanie ramię w ramię — została skopiowana przez fanów Manchesteru City i jest tam znana po prostu jako „The Poznań”.",category:"polandclubs",year:2010,emoji:"🔄"},{id:"pc5",text:"Piłkarze ręczni Industrii Kielce wygrali Ligę Mistrzów 2016 w meczu-thrillerze wszech czasów: w finale z Veszprém odrobili 9 goli straty i triumfowali po rzutach karnych.",category:"polandclubs",year:2016,emoji:"🤾"},{id:"pc6",text:"Siatkarze ZAKSY Kędzierzyn-Koźle wygrali Ligę Mistrzów trzy razy z rzędu (2021, 2022, 2023) — takiej serii nie miał wcześniej żaden polski klub w żadnym sporcie zespołowym.",category:"polandclubs",year:2023,emoji:"🏐"},{id:"pc7",text:"Stadion Narodowy w Warszawie stoi w miejscu Stadionu Dziesięciolecia, który w latach 90. mieścił „Jarmark Europa” — największe targowisko Europy, gdzie handlowało kilkadziesiąt tysięcy osób dziennie.",category:"polandclubs",year:2012,emoji:"🛍️"},{id:"pc8",text:"Stadion Śląski zyskał przydomek „Kocioł Czarownic” po zwycięstwie 2:0 nad Anglią w 1973 roku. W czasach świetności na trybunach potrafiło zasiąść ponad 100 tysięcy widzów.",category:"polandclubs",year:1973,emoji:"🍲"},{id:"pc9",text:"Wielka Krokiew w Zakopanem nosi imię Stanisława Marusarza, a podczas konkursów Pucharu Świata pod skocznią potrafi kibicować ponad 40 tysięcy ludzi — atmosferę porównuje się do stadionów piłkarskich.",category:"polandclubs",year:2002,emoji:"🎿"},{id:"pc10",text:"Unia Leszno to najbardziej utytułowany klub polskiego żużla — drużynowe mistrzostwo Polski zdobywała kilkanaście razy, a leszczyński stadion im. Alfreda Smoczyka jest jedną ze świątyń tej dyscypliny.",category:"polandclubs",year:2020,emoji:"🏍️"},{id:"pe1",text:"Na debiut w mistrzostwach Europy Polska czekała aż do 2008 roku — wcześniej przegrała kwalifikacje do dwunastu kolejnych turniejów, choć w międzyczasie zdobywała medale mundiali i igrzysk.",category:"polandeuro",year:2008,emoji:"⏳"},{id:"pe2",text:"Euro 2008: w debiutanckim meczu Polskę pokonały Niemcy 2:0, a oba gole strzelił... urodzony w Gliwicach Lukas Podolski. Z szacunku dla kraju urodzenia nie celebrował żadnego z trafień.",category:"polandeuro",year:2008,emoji:"😶"},{id:"pe3",text:"Pierwszy punkt na Euro Polska straciła w dramatycznych okolicznościach: z Austrią było 1:0 do 93. minuty, gdy sędzia Howard Webb podyktował rzut karny. W Polsce Webb z dnia na dzień stał się najbardziej znanym arbitrem świata.",category:"polandeuro",year:2008,emoji:"😤"},{id:"pe4",text:"Euro 2012 Polska współorganizowała z Ukrainą. W meczu otwarcia z Grecją czerwoną kartkę zobaczył Wojciech Szczęsny, a wprowadzony z ławki Przemysław Tytoń pierwszym dotknięciem piłki obronił rzut karny.",category:"polandeuro",year:2012,emoji:"🧤"},{id:"pe5",text:"Wyrównujący gol Jakuba Błaszczykowskiego z Rosją na Stadionie Narodowym (2012) — huknięcie z woleja po rajdzie przez pół boiska — uchodzi za najważniejszą bramkę w polskiej historii Euro.",category:"polandeuro",year:2012,emoji:"🚀"},{id:"pe6",text:"Pierwsze zwycięstwo Polski na Euro padło dopiero w 2016 roku: 1:0 z Irlandią Północną po golu Arkadiusza Milika. Turniej zakończył się historycznym ćwierćfinałem.",category:"polandeuro",year:2016,emoji:"✅"},{id:"pe7",text:"Euro 2020: Wojciech Szczęsny przeszedł do historii jako pierwszy bramkarz, któremu w meczu mistrzostw Europy zapisano gola samobójczego — piłka wpadła do siatki po słupku i jego plecach w meczu ze Słowacją.",category:"polandeuro",year:2021,emoji:"🙈"},{id:"pe8",text:"Euro 2024: Polacy pożegnali się z turniejem najszybciej ze wszystkich, ale na koniec urwali punkt późniejszym finalistom — w meczu z Francją (1:1) karnego pewnie wykorzystał Robert Lewandowski.",category:"polandeuro",year:2024,emoji:"🇫🇷"},{id:"pg18",text:"Cortina d'Ampezzo 1956: Franciszek Gąsienica-Groń zdobył brąz w kombinacji norweskiej — pierwszy polski medal zimowych igrzysk w historii. Na kolejny Polska czekała 16 lat, do złota Fortuny.",category:"polandgames",year:1956,emoji:"🥉"},{id:"pg19",text:"Squaw Valley 1960: łyżwiarki szybkie Elwira Seroczyńska i Helena Pilejczyk zdobyły srebro i brąz na 1500 m tego samego dnia — to wciąż jedyne polskie medale olimpijskie w tej dyscyplinie... do czasu Zbigniewa Bródki.",category:"polandgames",year:1960,emoji:"⛸️"},{id:"pg20",text:"Turyn 2006: srebro biathlonisty Tomasza Sikory i pierwszy medal (brąz) młodziutkiej Justyny Kowalczyk zwiastowały nadejście najlepszej zimowej dekady w historii polskiego sportu.",category:"polandgames",year:2006,emoji:"🎯"},{id:"pg21",text:"Soczi 2014 to najlepsze zimowe igrzyska Polski: 4 złota (dwa Stocha, Kowalczyk ze złamaną stopą i panczenista Zbigniew Bródka, który wygrał o 0,003 sekundy) i 6 medali łącznie.",category:"polandgames",year:2014,emoji:"🌟"},{id:"pf1",text:"Halina Konopacka jeszcze przed olimpijskim złotem, w 1926 roku, jako pierwsza Polka ustanowiła oficjalny rekord świata — w rzucie dyskiem. Był to początek wielkiej ery polskiej lekkoatletyki kobiecej.",category:"polandfirsts",year:1926,emoji:"🥏"},{id:"pf2",text:"Akiba Rubinstein ze Stawisk był na początku XX wieku uznawany za najsilniejszego szachistę świata — ale nigdy nie zagrał meczu o tytuł: plany na 1914 rok zniweczyła I wojna światowa, a później zabrakło funduszy.",category:"polandfirsts",year:1912,emoji:"♟️"},{id:"pf3",text:"Krystyna Chojnowska-Liskiewicz jako pierwsza kobieta na świecie samotnie opłynęła kulę ziemską jachtem (1976–1978). Rejs „Mazurka” trwał 401 dni i wyprzedził słynne wyczyny zachodnich żeglarek.",category:"polandfirsts",year:1978,emoji:"⛵"},{id:"pf4",text:"Leonid Teliga jako pierwszy Polak samotnie opłynął świat (1967–1969) na jachcie „Opty”. Większość rejsu odbył, wiedząc już o swojej chorobie nowotworowej — zmarł niecały rok po powrocie.",category:"polandfirsts",year:1969,emoji:"🌊"},{id:"pf5",text:"Aleksander Doba jako pierwszy człowiek w historii samotnie przepłynął kajakiem Atlantyk z kontynentu na kontynent — i zrobił to trzykrotnie, ostatni raz jako 70-latek. Zmarł w 2021 roku... na szczycie Kilimandżaro.",category:"polandfirsts",year:2017,emoji:"🛶"},{id:"pf6",text:"Marek Kamiński w 1995 roku jako pierwszy człowiek w historii zdobył oba bieguny Ziemi w ciągu jednego roku, bez pomocy z zewnątrz. Na biegun północny szedł 72 dni.",category:"polandfirsts",year:1995,emoji:"🧭"},{id:"pf7",text:"Jerzy Szczakiel w 1973 roku na Stadionie Śląskim sensacyjnie został pierwszym polskim indywidualnym mistrzem świata na żużlu, pokonując w dodatkowym biegu legendarnego Ivana Maugera.",category:"polandfirsts",year:1973,emoji:"🏍️"},{id:"pf8",text:"Łukasz Kubot jako pierwszy Polak wygrał Wimbledon — w grze podwójnej (2017). Wcześniej triumfował w deblu w Australian Open, a jego okrzyk „Lubię to!” stał się znakiem firmowym.",category:"polandfirsts",year:2017,emoji:"👯"},{id:"pf9",text:"Dariusz „Tygrys” Michalczewski przez dekadę władał wagą półciężką, broniąc pasa WBO 23 razy — to jeden z najdłuższych okresów panowania w historii boksu zawodowego.",category:"polandfirsts",year:2003,emoji:"🐯"},{id:"pf10",text:"„Golden Five” — polska drużyna Counter-Strike'a z Filipem „Neo” Kubskim — zdominowała światową scenę przełomu lat 2006–2009, a Neo do dziś wymieniany jest wśród najlepszych graczy w historii e-sportu.",category:"polandfirsts",year:2009,emoji:"🎮"},{id:"f25",text:"Arsenal w sezonie 2003/04 przeszedł całą Premier League bez porażki — 38 meczów. „The Invincibles” otrzymali za to unikatowe, złote trofeum mistrzowskie.",category:"football",year:2004,emoji:"🛡️"},{id:"f26",text:"Paragwajski bramkarz José Luis Chilavert strzelił w karierze ponad 60 goli — z karnych i wolnych — a w 1999 roku jako jedyny golkiper w historii zawodowego futbolu zaliczył hat-tricka.",category:"football",year:1999,emoji:"🧤"},{id:"wc19",text:"Pierwszą maskotką mundialu był lew Willie z Anglii 1966 — wynalazek, który zapoczątkował całą epokę turniejowych maskotek i pamiątkowego przemysłu.",category:"worldcup",year:1966,emoji:"🦁"},{id:"wc20",text:"Lionel Messi jako jedyny piłkarz w historii dwukrotnie otrzymał Złotą Piłkę dla najlepszego zawodnika mundialu — w 2014 i 2022 roku.",category:"worldcup",year:2022,emoji:"⭐"},{id:"eu12",text:"Trofeum mistrzostw Europy nosi imię Henriego Delaunaya — francuskiego działacza, który wymyślił turniej już w latach 20. Zmarł 5 lat przed pierwszą edycją i nigdy nie zobaczył swojego dzieła.",category:"euro",year:1960,emoji:"🏆"},{id:"eu13",text:"Euro 2016: 330-tysięczna Islandia dotarła do ćwierćfinału, ogrywając po drodze Anglię. Wikińska „klaskana” celebracja z kibicami stała się hitem kopiowanym na całym świecie.",category:"euro",year:2016,emoji:"🇮🇸"},{id:"o30",text:"Olimpijskie motto „Citius, Altius, Fortius” (szybciej, wyżej, silniej) po 127 latach doczekało się zmiany — w 2021 roku dodano słowo „Communiter”: „razem”.",category:"olympics",year:2021,emoji:"📜"},{id:"o31",text:"„Złote” medale olimpijskie są w rzeczywistości srebrne — czyste złoto to tylko ok. 6 gramów powłoki. Ostatnie medale z litego złota wręczono w 1912 roku.",category:"olympics",year:1912,emoji:"🥇"},{id:"sg23",text:"Na igrzyskach w Paryżu 1900 rozegrano pływanie z przeszkodami: zawodnicy wspinali się na słup, przełazili przez łodzie i nurkowali pod kolejnymi. Konkurencję rozegrano tylko raz.",category:"summergames",year:1900,emoji:"🚣"},{id:"sg24",text:"Atlanta 1996: Michael Johnson w pozłacanych kolcach pobiegł 200 m w 19,32 s, poprawiając rekord świata o ponad 0,3 sekundy. Wynik przetrwał 12 lat — do czasów Bolta.",category:"summergames",year:1996,emoji:"👟"},{id:"wg17",text:"Zimowe igrzyska 1976 miały odbyć się w Denver, ale mieszkańcy Kolorado w referendum odmówili ich finansowania — to jedyny przypadek w historii, gdy miasto oddało przyznane igrzyska. Imprezę uratował Innsbruck.",category:"wintergames",year:1976,emoji:"🗳️"},{id:"wg18",text:"Nagano 1998: pierwszemu mistrzowi olimpijskiemu w snowboardzie, Rossowi Rebagliatiemu, odebrano złoto za śladowe ilości marihuany — i oddano po 3 dniach, bo substancji nie było na liście zakazanych.",category:"wintergames",year:1998,emoji:"🌿"},{id:"a19",text:"Kenijka Ruth Chepng'etich w Chicago w 2024 roku jako pierwsza kobieta w historii przebiegła maraton poniżej 2:10 (2:09:56) — jeszcze dekadę wcześniej taki czas dawałby medale w męskich mistrzostwach.",category:"athletics",year:2024,emoji:"⏱️"},{id:"a20",text:"Jelena Isinbajewa poprawiała rekord świata w skoku o tyczce 28 razy i jako pierwsza kobieta pokonała granicę 5 metrów (2005).",category:"athletics",year:2005,emoji:"🪜"},{id:"t16",text:"Elektroniczny system Hawk-Eye i „challenge” zadebiutowały w Wielkim Szlemie na US Open 2006. Wcześniej o piłkach na linii decydowało wyłącznie ludzkie oko — i niekończące się awantury.",category:"tennis",year:2006,emoji:"👁️"},{id:"t17",text:"Podczas dwóch tygodni Wimbledonu kibice zjadają około 30 ton truskawek z bitą śmietaną. Owoce zbierane są dzień wcześniej o świcie z pól w hrabstwie Kent.",category:"tennis",year:2019,emoji:"🍓"},{id:"rq7",text:"W 2000 roku tenis stołowy powiększył piłeczkę z 38 do 40 mm — specjalnie po to, by spowolnić grę i uczynić ją bardziej widowiskową w telewizji.",category:"racquet",year:2e3,emoji:"⚪"},{id:"rq8",text:"Profesjonalne lotki do badmintona robi się z 16 gęsich piór — tradycyjnie najlepiej z lewego skrzydła, by wszystkie były zakrzywione w tę samą stronę. Podczas ważnego meczu zużywa się kilkadziesiąt lotek.",category:"racquet",year:1950,emoji:"🪶"},{id:"gf7",text:"Piłka golfowa ma 300–500 wgłębień (dimples) nie dla ozdoby: turbulentna warstwa powietrza zmniejsza opór i sprawia, że piłka leci nawet dwa razy dalej niż gładka.",category:"golf",year:1905,emoji:"🔬"},{id:"gf8",text:"Augusta National, dom turnieju Masters, przyjęła pierwsze kobiety w poczet członków dopiero w 2012 roku — jedną z dwóch pierwszych była Condoleezza Rice.",category:"golf",year:2012,emoji:"🚪"},{id:"b14",text:"Zegar 24 sekund uratował NBA przed nudą — wprowadzono go w 1954 roku, a liczbę wyliczył właściciel klubu z Syracuse, dzieląc 2880 sekund meczu przez średnią liczbę rzutów (120).",category:"basketball",year:1954,emoji:"⏲️"},{id:"b15",text:"Najwyższy wynik meczu NBA: Detroit Pistons pokonali Denver Nuggets 186:184 po trzech dogrywkach (1983). Obie drużyny rzuciły łącznie 370 punktów.",category:"basketball",year:1983,emoji:"🔥"},{id:"v12",text:"Do 1999 roku punkt w siatkówce można było zdobyć tylko przy własnej zagrywce — mecze potrafiły ciągnąć się w nieskończoność. System „każda akcja = punkt” wprowadzono głównie dla telewizji.",category:"volleyball",year:1999,emoji:"🔢"},{id:"v13",text:"Japonki z lat 60., zwane „Czarownicami ze Wschodu”, wygrały ponad 250 meczów z rzędu i złoto olimpijskie 1964. Ich trener słynął z morderczych treningów po 7 godzin dziennie.",category:"volleyball",year:1964,emoji:"🧙‍♀️"},{id:"hb7",text:"Francja to najbardziej utytułowana reprezentacja w historii męskiej piłki ręcznej — sześć tytułów mistrza świata i trzy złota olimpijskie.",category:"handball",year:2017,emoji:"🐓"},{id:"hb8",text:"W piłce ręcznej plażowej efektowność popłaca dosłownie: gol z obrotu (piruetu) lub w locie liczy się za dwa punkty zamiast jednego.",category:"handball",year:2004,emoji:"🏖️"},{id:"hk7",text:"Termin „hat-trick” w hokeju wziął się od torontońskiego kapelusznika, który w latach 40. obiecał darmowy kapelusz każdemu strzelcowi trzech goli. Kibice do dziś rzucają wtedy czapki na lód.",category:"hockey",year:1946,emoji:"🎩"},{id:"hk8",text:"Bramkarze NHL grali bez masek aż do 1959 roku, gdy Jacques Plante po złamaniu nosa wrócił na lód w masce — wbrew własnemu trenerowi. Ostatni bramkarz bez maski grał jeszcze w 1974 roku.",category:"hockey",year:1959,emoji:"🎭"},{id:"m14",text:"Podczas pit stopu w F1 ponad 20 mechaników zmienia cztery koła szybciej, niż mrugniesz — rekord należy do Red Bulla: 1,82 sekundy (2019).",category:"motorsport",year:2019,emoji:"🔧"},{id:"m15",text:"Motocyklowy wyścig Isle of Man TT, rozgrywany na zwykłych drogach od 1907 roku, pochłonął ponad 260 ofiar — a mimo to co roku ustawiają się kolejki chętnych. Średnia prędkość najlepszych przekracza 220 km/h.",category:"motorsport",year:1907,emoji:"🏝️"},{id:"c14",text:"Nikołaj Wałujew, mierzący 213 cm i ważący ponad 140 kg, był najwyższym i najcięższym mistrzem świata wagi ciężkiej w historii boksu. Po karierze został... deputowanym rosyjskiej Dumy.",category:"combat",year:2005,emoji:"🗿"},{id:"c15",text:"Szermierka jako pierwszy sport walki dostała elektroniczny system sędziowania — szpada już w 1936 roku. Trafienia są zbyt szybkie dla ludzkiego oka: czubek szpady to jeden z najszybszych obiektów w sporcie.",category:"combat",year:1936,emoji:"🤺"},{id:"w15",text:"W skeletonie zawodnik pędzi po lodowej rynnie głową do przodu, z twarzą kilka centymetrów nad torem, osiągając ponad 130 km/h. Na igrzyska wrócił po 54 latach przerwy dopiero w 2002 roku.",category:"winter",year:2002,emoji:"💀"},{id:"w16",text:"Amerykanka Mikaela Shiffrin jako pierwsza osoba w historii — wśród kobiet i mężczyzn — wygrała 100 zawodów alpejskiego Pucharu Świata (2025).",category:"winter",year:2025,emoji:"💯"},{id:"s11",text:"W zawodach Red Bull Cliff Diving skacze się z ok. 27 metrów — zawodnik leci 3 sekundy i uderza w wodę z prędkością 85 km/h. Do wody zawsze wchodzi się nogami; wejście głową groziłoby śmiercią.",category:"water",year:2009,emoji:"🪨"},{id:"s12",text:"Duke Kahanamoku, hawajski mistrz olimpijski w pływaniu (1912, 1920), między startami popularyzował na świecie surfing — dziś nazywany jest ojcem tego sportu.",category:"water",year:1920,emoji:"🏄"},{id:"k10",text:"Na górskich etapach Tour de France kolarze spalają po 6000–8000 kalorii dziennie — jedzą więc niemal bez przerwy, także na rowerze, a i tak kończą wyścig lżejsi o kilka kilogramów.",category:"cycling",year:2015,emoji:"🍝"},{id:"k11",text:"Najstarszy wielki klasyk kolarski, Liège–Bastogne–Liège, rozgrywany jest od 1892 roku — nazywany jest po prostu „La Doyenne”, czyli „Najstarsza Dama”.",category:"cycling",year:1892,emoji:"👵"},{id:"p26",text:"Władysław Komar (złoto w kuli, 1972) i Tadeusz Ślusarski (złoto w tyczce, 1976) byli przyjaciółmi z jednej epoki polskiej lekkoatletyki. Zginęli razem, w tym samym wypadku samochodowym w 1998 roku.",category:"poland",year:1998,emoji:"🕯️"},{id:"p27",text:"Mecz otwarcia siatkarskich MŚ 2014 Polska–Serbia rozegrano na Stadionie Narodowym przed 61 tysiącami widzów — to rekord frekwencji w historii światowej siatkówki. Polacy wygrali mecz i cały turniej.",category:"poland",year:2014,emoji:"🏟️"},{id:"pg22",text:"Tokio 2020: Maria Andrejczyk zlicytowała swoje srebro z rzutu oszczepem, by opłacić operację serca 8-miesięcznego Miłoszka. Sieć sklepów, która wygrała aukcję, zapłaciła 200 tys. zł i... oddała jej medal.",category:"polandgames",year:2021,emoji:"💛"},{id:"pg23",text:"Paryż 2024: polscy siatkarze zdobyli srebro — pierwszy olimpijski medal tej drużyny od złota Huberta Wagnera w 1976 roku, po 48 latach oczekiwania.",category:"polandgames",year:2024,emoji:"🥈"},{id:"pwc11",text:"Cichym bohaterem mundialu 1974 był Andrzej Szarmach — strzelił 5 goli i razem z Latą (7) i Gadochą tworzył najgroźniejszy tercet ataku turnieju. Polacy strzelili łącznie 16 bramek — najwięcej ze wszystkich.",category:"polandwc",year:1974,emoji:"⚔️"},{id:"pwc12",text:"Do Kataru 2022 Polska awansowała w barażach bez rozegrania półfinału — Rosję wykluczono po inwazji na Ukrainę. W finale barażu biało-czerwoni pokonali Szwecję 2:0.",category:"polandwc",year:2022,emoji:"🎫"},{id:"pc11",text:"Wisła Kraków w latach 1999–2011 zdobyła 8 z 13 swoich tytułów mistrza Polski i regularnie ogrywała w Europie renomowane firmy — z Schalke, Parmą i Lazio na czele.",category:"polandclubs",year:2005,emoji:"⭐"},{id:"pc12",text:"Cracovia była ukochanym klubem Józefa Piłsudskiego. Marszałek bywał na meczach „Pasów”, a klub do dziś szczyci się mianem najstarszego istniejącego w polskim futbolu.",category:"polandclubs",year:1921,emoji:"🎖️"},{id:"pe9",text:"Wygrana po karnych ze Szwajcarią na Euro 2016 była pierwszym zwycięstwem Polski w fazie pucharowej wielkiego turnieju od MŚ 1982. Wszystkie pięć jedenastek wykorzystali m.in. Lewandowski i Krychowiak.",category:"polandeuro",year:2016,emoji:"🎯"},{id:"pf11",text:"Wanda Rutkiewicz w 1986 roku jako pierwsza kobieta w historii stanęła na szczycie K2 — góry uważanej za trudniejszą i groźniejszą od Everestu. Zginęła sześć lat później na Kanczendzondze.",category:"polandfirsts",year:1986,emoji:"🏔️"},{id:"an11",text:"Oszustów na starożytnych igrzyskach karano grzywnami, z których fundowano... posągi hańby (zanes) ustawiane przy wejściu na stadion — z imieniem i przewiną oszusta, ku przestrodze zawodników.",category:"ancient",emoji:"🗿"},{id:"an12",text:"Legenda o Filippidesie, który przybiegł z Maratonu do Aten, krzyknął „zwyciężyliśmy!” i padł martwy, została spisana dopiero setki lat po bitwie — historycy uważają ją za piękną fikcję.",category:"ancient",emoji:"📖"},{id:"r18",text:"Tour de France to największe cyklicznie wydarzenie sportowe świata pod względem publiczności: wzdłuż tras staje co roku 10–12 milionów widzów — i nikt nie płaci za bilet.",category:"records",year:2019,emoji:"👥"},{id:"r19",text:"Najwyżej rozegrany mecz w historii? Zawody krykieta na Kilimandżaro (5730 m) i futbolowe mecze charytatywne na Evereście — sport potrafi dotrzeć wszędzie tam, gdzie brakuje tlenu.",category:"records",year:2014,emoji:"⛰️"},{id:"ch7",text:"W 1999 roku Garri Kasparow zagrał przez internet przeciwko „reszcie świata” — ponad 58 tysięcy ludzi głosowało nad każdym posunięciem. Kasparow wygrał po 62 ruchach i nazwał tę partię jedną z najtrudniejszych w życiu.",category:"chess",year:1999,emoji:"🌍"},{id:"ch8",text:"Szachy są oficjalnie uznawane przez MKOl za sport, ale nigdy nie trafiły do programu igrzysk. Zawodowi szachiści podczas partii potrafią spalać tyle kalorii, co sportowcy — samym myśleniem i stresem.",category:"chess",emoji:"🧠"},{id:"e6",text:"Michał „Nisha” Jankowski w 2024 roku jako pierwszy Polak wygrał The International — najważniejszy turniej Dota 2. Jego drużyna Team Liquid zgarnęła ponad milion dolarów na gracza.",category:"esport",year:2024,emoji:"🇵🇱"},{id:"e7",text:"W Korei Południowej StarCraft stał się sportem narodowym: już pod koniec lat 90. mecze pokazywały całodobowe kanały telewizyjne, a najlepsi gracze mieli status gwiazd rocka.",category:"esport",year:1999,emoji:"📺"},{id:"rg7",text:"Finał Pucharu Świata w rugby 1995: Nelson Mandela wręczył trofeum kapitanowi RPA ubrany w koszulkę Springboks — symbol znienawidzonego niegdyś apartheidu — jednocząc podzielony kraj. Historię opowiada film „Invictus”.",category:"rugby",year:1995,emoji:"🤝"},{id:"rg8",text:"Trzygodzinna transmisja meczu NFL zawiera średnio... zaledwie około 11 minut faktycznej gry. Resztę wypełniają przerwy, ustawienia i powtórki — idealne środowisko dla reklam.",category:"rugby",year:2010,emoji:"⏸️"},{id:"st7",text:"Islandczyk Hafthor Björnsson — filmowa „Góra” z „Gry o tron” — podniósł w 2020 roku w martwym ciągu 501 kg, najwięcej w historii ludzkości.",category:"strength",year:2020,emoji:"⛰️"},{id:"st8",text:"Kanadyjczyk Louis Cyr, XIX-wieczny „najsilniejszy człowiek świata”, według relacji prasowych utrzymał w miejscu cztery konie ciągnące w przeciwne strony i podniósł plecami platformę z 18 mężczyznami.",category:"strength",year:1891,emoji:"🐴"},{id:"g7",text:"Věra Čáslavská, 7-krotna mistrzyni olimpijska, na igrzyskach 1968 odwróciła głowę podczas hymnu ZSRR w proteście przeciw inwazji na Czechosłowację. Zapłaciła za to latami zawodowego wykluczenia w ojczyźnie.",category:"gymnastics",year:1968,emoji:"✊"},{id:"g8",text:"Skok Produnowej — przerzut i dwa salta kurczone w przód — nazywany jest „skokiem śmierci”. Wykonała go zaledwie garstka gimnastyczek; błąd przy lądowaniu grozi złamaniem karku.",category:"gymnastics",year:1999,emoji:"☠️"},{id:"x7",text:"Szerpa Kami Rita zdobył Mount Everest ponad 30 razy — rekord wszech czasów. Pierwszy raz stanął na szczycie w 1994 roku i wspina się tam niemal co sezon.",category:"extreme",year:2024,emoji:"🔁"},{id:"x8",text:"Parkour narodził się na paryskich przedmieściach — David Belle rozwinął go z wojskowego toru przeszkód, którego uczył go ojciec, strażak i żołnierz z Wietnamu.",category:"extreme",year:1997,emoji:"🏃"},{id:"eq7",text:"Hiszpańska Szkoła Jazdy w Wiedniu od ponad 450 lat szkoli białe lipicany w barokowej sztuce jeździeckiej. Umiejętności koni — skoki i „tańce” — wywodzą się z manewrów bojowych kawalerii.",category:"equestrian",year:1572,emoji:"🤍"},{id:"eq8",text:"Ogier Fusaichi Pegasus, zwycięzca Kentucky Derby 2000, został sprzedany za rekordowe ok. 70 milionów dolarów — głównie z myślą o karierze... reproduktora.",category:"equestrian",year:2e3,emoji:"💰"},{id:"pr7",text:"Ronnie O'Sullivan w 2019 roku jako pierwszy snookerzysta w historii skompletował tysiąc brejków stupunktowych. Okrągły numer wbił — oczywiście — w decydującym frejmie finału, przy pełnej widowni.",category:"precision",year:2019,emoji:"🎱"},{id:"pr8",text:"Koreański łucznik Im Dong-hyun bił rekordy świata, mając poważną wadę wzroku — tarczę widział jako rozmytą plamę. Twierdził, że to bez znaczenia: liczy się powtarzalność ruchu, nie ostrość obrazu.",category:"precision",year:2012,emoji:"👓"},{id:"tr8",text:"Podczas szkockich Highland Games zawodnicy rzucają pniem o długości ok. 6 m (caber toss) — ale nie liczy się odległość, tylko styl: pień ma się obrócić i upaść idealnie „na godzinę 12”.",category:"traditional",year:1848,emoji:"🪵"},{id:"tr9",text:"Sepak takraw, „siatkonoga” z Azji Południowo-Wschodniej, to siatkówka grana wyłącznie nogami, głową i klatką piersiową. Ścinając piłkę, zawodnicy wykonują salta na wysokości siatki.",category:"traditional",emoji:"🦶"},{id:"f27",text:"„Żółta Ściana” Borussii Dortmund to największa trybuna stojąca Europy — na jednym sektorze mieści się blisko 25 tysięcy kibiców. Podczas meczów faluje jak jeden organizm.",category:"football",year:2012,emoji:"🟡"},{id:"wc21",text:"Obecny Puchar Świata FIFA wykonany jest z 6,1 kg 18-karatowego złota. Mistrzowie zatrzymują tylko pozłacaną replikę — oryginał od 1974 roku należy wyłącznie do FIFA.",category:"worldcup",year:1974,emoji:"🏆"},{id:"o32",text:"Na ceremonii w Seulu 1988 gołębie pokoju usiadły na krawędzi znicza tuż przed jego zapaleniem — część ptaków spłonęła na oczach świata. Od tamtej pory żywych gołębi już się nie wypuszcza.",category:"olympics",year:1988,emoji:"🕊️"},{id:"sg25",text:"Koszykówka zadebiutowała na igrzyskach w Berlinie 1936 na... odkrytych kortach ziemnych. Finał USA–Kanada rozegrano w strugach deszczu na błotnistym boisku — stąd wynik 19:8.",category:"summergames",year:1936,emoji:"🌧️"},{id:"a21",text:"Norweg Karsten Warholm w 2021 roku przebiegł 400 m przez płotki w 45,94 s, poprawiając rekord świata aż o 0,76 sekundy — to jeden z największych pojedynczych skoków rekordu w historii lekkoatletyki.",category:"athletics",year:2021,emoji:"🇳🇴"},{id:"t18",text:"Chris Evert wygrała na kortach ziemnych 125 meczów z rzędu (1973–1979) — najdłuższa seria na jednej nawierzchni w historii tenisa. W tym czasie przegrała łącznie... 7 setów.",category:"tennis",year:1979,emoji:"🧱"},{id:"b16",text:"Boston Celtics i Los Angeles Lakers zgarnęli razem ponad połowę wszystkich tytułów w historii NBA (18 i 17). Ich rywalizacja — Bird kontra Magic — uratowała ligę w latach 80.",category:"basketball",year:1984,emoji:"🍀"},{id:"m16",text:"Kierowca F1 traci podczas wyścigu 2–3 kg masy ciała z potu, a jego szyja przy hamowaniu i w zakrętach wytrzymuje przeciążenia do 5G — dlatego kierowcy trenują kark jak kulturyści.",category:"motorsport",year:2021,emoji:"💦"},{id:"c16",text:"Floyd Mayweather zakończył karierę z bilansem 50-0, a za pojedynek z debiutującym w boksie Conorem McGregorem (2017) zarobił według szacunków setki milionów dolarów — za niecałe 30 minut w ringu.",category:"combat",year:2017,emoji:"💵"},{id:"w17",text:"Szwedzki Vasaloppet, rozgrywany od 1922 roku bieg narciarski na 90 km, upamiętnia ucieczkę króla Gustawa Wazy. Startuje w nim ponad 15 tysięcy osób, a elita finiszuje po niecałych 4 godzinach.",category:"winter",year:1922,emoji:"🇸🇪"},{id:"k12",text:"Torowy keirin narodził się w Japonii jako sport bukmacherski — do dziś zawodowi keirinowcy kończą tam specjalną szkołę z internatem, a zakłady na wyścigi obracają miliardami jenów.",category:"cycling",year:1948,emoji:"🎰"},{id:"p28",text:"Ewa Swoboda jako pierwsza Polka w historii przełamała granicę 7 sekund w biegu na 60 m w hali. Sprinterka z Żor słynie z tego, że... nie znosi porannych treningów i mówi o tym otwarcie.",category:"poland",year:2024,emoji:"😴"},{id:"pg24",text:"Tomasz Kucharski i Robert Sycz wywalczyli złoto w wioślarskiej dwójce podwójnej wagi lekkiej na dwóch igrzyskach z rzędu (Sydney 2000, Ateny 2004) — to najskuteczniejsza osada w historii polskiego wioślarstwa.",category:"polandgames",year:2004,emoji:"🚣"},{id:"eq9",text:"Rekord świata w skoku konia przez przeszkodę — 2,47 m — ustanowił chilijski koń Huaso w 1949 roku. To jeden z najstarszych niepobitych rekordów w całym sporcie.",category:"equestrian",year:1949,emoji:"🦄"},{id:"r20",text:"„Timeless Test” z 1939 roku: mecz krykieta RPA–Anglia grano bez limitu czasu... przez 10 dni. Skończył się remisem, bo Anglicy musieli zdążyć na statek do domu.",category:"records",year:1939,emoji:"🚢"},{id:"sc1",text:"Black Sox 1919: ośmiu graczy Chicago White Sox sprzedało za łapówki finał baseballowej World Series. Zawodników uniewinnił sąd, ale komisarz ligi zdyskwalifikował ich dożywotnio — do dziś.",category:"scandals",year:1919,emoji:"🧦"},{id:"sc2",text:"Boris Oniszczenko na igrzyskach 1976 zamontował w szpadzie ukryty przycisk, którym sam zapalał sygnał trafienia. Zdemaskowany, wyleciał z igrzysk, a rodacy ochrzcili go „Boris Disoniszczenko”.",category:"scandals",year:1976,emoji:"🤺"},{id:"sc3",text:"Afera Festina (Tour de France 1998): w samochodzie ekipy znaleziono setki dawek dopingu. Wybuchł największy skandal w historii kolarstwa, a policja przeszukiwała hotele w trakcie wyścigu.",category:"scandals",year:1998,emoji:"💉"},{id:"sc4",text:"Calciopoli (2006): Juventus odebrano dwa tytuły mistrza Włoch i zdegradowano do Serie B za ustawianie składów sędziowskich. Skandal wybuchł tuż przed mundialem, który... Włochy wygrały.",category:"scandals",year:2006,emoji:"☎️"},{id:"sc5",text:"„Spygate” w Formule 1 (2007): McLaren dostał rekordową karę 100 milionów dolarów i stracił punkty konstruktorów za posiadanie tajnych danych technicznych Ferrari.",category:"scandals",year:2007,emoji:"🕵️"},{id:"sc6",text:"„Bloodgate” (2009): rugbysta Harlequins udał krwawiącą ranę, gryząc sztuczną kapsułę z krwią, by wprowadzić lepszego kopacza. Klub ukarano wielką grzywną, a lekarkę zawieszono.",category:"scandals",year:2009,emoji:"🩸"},{id:"sc7",text:"Państwowy doping Rosji: raport McLarena (2016) ujawnił, że podczas igrzysk w Soczi 2014 służby podmieniały próbki moczu przez dziurę w ścianie laboratorium. Rosja od lat startuje pod neutralną flagą.",category:"scandals",year:2016,emoji:"🧪"},{id:"sc8",text:"Maradonę wyrzucono z mundialu 1994 po wykryciu efedryny. Jego dzikie spojrzenie w kamerę po golu z Grecją stało się jednym z symboli końca kariery „Boskiego Diego”.",category:"scandals",year:1994,emoji:"👁️"},{id:"sc9",text:"„Deflategate” (2015): NFL oskarżyła New England Patriots o celowe spuszczanie powietrza z piłek. Tom Brady dostał 4 mecze zawieszenia w aferze, która ciągnęła się przez sądy ponad rok.",category:"scandals",year:2015,emoji:"🏈"},{id:"f28",text:"Sir Alex Ferguson prowadził Manchester United przez 26 lat i zdobył 13 tytułów mistrza Anglii. Słynął z „Fergie time” — doliczonego czasu, w którym jego drużyna zdumiewająco często strzelała zwycięskie gole.",category:"football",year:1999,emoji:"🕐"},{id:"b17",text:"Wsad kończący mecz nazywa się „buzzer beater”, ale najsłynniejszy w historii to rzut Michaela Jordana z 1998 roku — ostatni w koszulce Bulls, dający szósty tytuł. Zawisł w powietrzu na wieczność w milionach powtórek.",category:"basketball",year:1998,emoji:"🎯"},{id:"o33",text:"Znicz olimpijski płonie nieprzerwanie od zapalenia w Olimpii aż po ceremonię zamknięcia. W razie zgaśnięcia zapala się go wyłącznie od zapasowego ognia z tego samego źródła — nigdy zwykłą zapalniczką.",category:"olympics",year:1936,emoji:"🔥"},{id:"t19",text:"Björn Borg wygrał Wimbledon pięć razy z rzędu (1976–1980), po czym w wieku 26 lat nagle zakończył karierę na szczycie. Jego zimny spokój na korcie kontrastował z żywiołowym rywalem Johnem McEnroe.",category:"tennis",year:1980,emoji:"🧊"},{id:"p29",text:"Bartłomiej Bonk, Adrian Zieliński, Szymon Kołecki — polskie podnoszenie ciężarów przez dekady dostarczało olimpijskich medali. Szymon Kołecki po latach odzyskał złoto z Pekinu 2008, gdy zwycięzcę zdyskwalifikowano za doping.",category:"poland",year:2008,emoji:"🏋️"},{id:"wc22",text:"Piłka Telstar z mundialu 1970 — pierwsza czarno-biała, z 32 panelami — miała lepiej kontrastować na czarno-białych telewizorach. Jej wzór do dziś jest w powszechnej wyobraźni „wzorcem” piłki nożnej.",category:"worldcup",year:1970,emoji:"⚽"},{id:"sd1",text:"Największym stadionem świata pod względem pojemności jest Rungrado 1 Maja w Pjongjangu (Korea Płn.) — mieści ok. 114 tysięcy widzów. Odbywają się na nim głównie masowe pokazy propagandowe.",category:"stadiums",year:1989,emoji:"🇰🇵"},{id:"sd2",text:"Indianapolis Motor Speedway to największy obiekt sportowy świata — trybuny mieszczą ponad 250 tysięcy widzów. Wewnątrz owalnego toru zmieściłyby się boiska do baseballu, tenisa i całe Koloseum naraz.",category:"stadiums",year:1909,emoji:"🏎️"},{id:"sd3",text:"Estadio Centenario w Montevideo, zbudowany na pierwszy mundial 1930, to jedyny obiekt na świecie uznany przez FIFA za „historyczny pomnik światowego futbolu”.",category:"stadiums",year:1930,emoji:"🏛️"},{id:"sd4",text:"Camp Nou to największy stadion Europy — przed przebudową mieścił blisko 99 tysięcy kibiców. Jego nazwa znaczy po katalońsku po prostu „Nowe Boisko”.",category:"stadiums",year:1957,emoji:"🔵"},{id:"sd5",text:"Łuk nad stadionem Wembley ma 133 metry wysokości i jest widoczny z wielu punktów Londynu. To najdłuższa na świecie samonośna konstrukcja dachowa tego typu.",category:"stadiums",year:2007,emoji:"🌉"},{id:"sd6",text:"Mediolański San Siro dzielą od 1947 roku dwaj zacięci rywale — AC Milan i Inter. To jeden z niewielu wielkich stadionów świata, na którym „u siebie” gra się w derby.",category:"stadiums",year:1947,emoji:"🔴"},{id:"sd7",text:"Fenway Park w Bostonie (1912) to najstarszy wciąż używany stadion ligi MLB. Jego lewą część zamyka „Zielony Potwór” — mur wysoki na ponad 11 metrów, który połyka mnóstwo potencjalnych home runów.",category:"stadiums",year:1912,emoji:"👹"},{id:"sd8",text:"Lord's w Londynie, „dom krykieta”, ma boisko z wyraźnym nachyleniem — jeden kraniec murawy leży o ok. 2,5 metra niżej niż drugi. Gracze muszą uwzględniać ten spadek w taktyce.",category:"stadiums",year:1814,emoji:"🏏"},{id:"sd9",text:"Madison Square Garden w Nowym Jorku, „najsłynniejsza arena świata”, to już czwarty budynek noszący tę nazwę. Obecny wybudowano... nad czynnym dworcem kolejowym Penn Station.",category:"stadiums",year:1968,emoji:"🗽"},{id:"sd10",text:"Kort centralny Wimbledonu dostał rozsuwany dach dopiero w 2009 roku. Jego zamknięcie i osuszenie powietrza trwa ok. 30–45 minut — od tego czasu deszcz nie przerywa już wielkich finałów.",category:"stadiums",year:2009,emoji:"🌧️"},{id:"hb9",text:"Bramkarz w piłce ręcznej broni zaledwie co trzeci–czwarty rzut, a mimo to bywa najważniejszym zawodnikiem meczu. Seria kilku obron z rzędu potrafi w kilka minut odwrócić losy całego spotkania.",category:"handball",year:2016,emoji:"🧤"},{id:"hk9",text:"Wayne Gretzky ma w NHL tyle rekordów (ponad 60), że gdyby odjąć mu wszystkie gole, wciąż byłby najlepszym punktującym w historii ligi — dzięki samym asystom.",category:"hockey",year:1999,emoji:"🐐"},{id:"g9",text:"Rosyjska gimnastyczka Swietłana Chorkina była tak wysoka jak na gimnastyczkę (165 cm), że musiała wymyślać własne elementy na poręczach — pięć figur nosi dziś jej nazwisko.",category:"gymnastics",year:2003,emoji:"📏"},{id:"e8",text:"W 2019 roku 16-letni Kyle „Bugha” Giersdorf wygrał indywidualne mistrzostwa świata w Fortnite i 3 miliony dolarów — więcej, niż tego roku dostał zwycięzca tenisowego US Open.",category:"esport",year:2019,emoji:"💰"},{id:"an13",text:"Zwycięzców starożytnej Olimpii uwieczniano w odach układanych przez najsłynniejszych poetów, m.in. Pindara. Sportowa sława bywała więc dosłownie „nieśmiertelna” — przetrwała 2500 lat w literaturze.",category:"ancient",emoji:"📜"},{id:"wm1",text:"Charlotte Cooper wygrała turniej tenisowy na igrzyskach 1900 i została pierwszą w historii indywidualną mistrzynią olimpijską. Grała w długiej sukni do kostek i pod krawatem.",category:"women",year:1900,emoji:"👗"},{id:"wm2",text:"Kathrine Switzer w 1967 roku pobiegła w maratonie bostońskim jako pierwsza oficjalnie zgłoszona kobieta. W trakcie biegu organizator próbował siłą zepchnąć ją z trasy — zdjęcia tej szarpaniny obiegły świat.",category:"women",year:1967,emoji:"📸"},{id:"wm3",text:"Fanny Blankers-Koen, „Latająca gospodyni”, zdobyła na igrzyskach 1948 cztery złote medale w biegach — jako 30-letnia matka dwójki dzieci, której mówiono, że jest już za stara na sport.",category:"women",year:1948,emoji:"🏃‍♀️"},{id:"wm4",text:"Junko Tabei w 1975 roku jako pierwsza kobieta w historii stanęła na Mount Evereście. Kilka dni przed szczytem lawina przygniotła jej obóz — wygrzebano ją nieprzytomną spod śniegu.",category:"women",year:1975,emoji:"🏔️"},{id:"wm5",text:"Nawal El Moutawakel wygrała bieg na 400 m przez płotki na igrzyskach 1984 — jako pierwsza kobieta z kraju muzułmańskiego ze złotem olimpijskim. Król Maroka ogłosił, że wszystkie dziewczynki urodzone tego dnia mogą nosić jej imię.",category:"women",year:1984,emoji:"🇲🇦"},{id:"wm6",text:"Amerykańska ustawa Title IX z 1972 roku zakazała dyskryminacji płci w szkołach i uczelniach. Efekt dla sportu był lawinowy: liczba dziewcząt uprawiających sport w USA wzrosła w kolejnych dekadach kilkunastokrotnie.",category:"women",year:1972,emoji:"⚖️"},{id:"wm7",text:"Manon Rhéaume w 1992 roku jako pierwsza kobieta w historii zagrała w meczu jednej z czterech wielkich lig Ameryki Płn. — broniła w bramce hokejowej Tampa Bay Lightning w spotkaniu przedsezonowym.",category:"women",year:1992,emoji:"🥅"},{id:"wm8",text:"Danica Patrick w 2008 roku wygrała wyścig serii IndyCar w Japonii — jako jedyna kobieta w historii tej kategorii. Kilka lat później startowała też w najsłynniejszym wyścigu NASCAR, Daytona 500.",category:"women",year:2008,emoji:"🏎️"},{id:"wm9",text:"Pierwsze mistrzostwa świata w piłce nożnej kobiet rozegrano dopiero w 1991 roku w Chinach — 61 lat po męskich. Wygrały je Amerykanki, które do dziś są potęgą kobiecego futbolu.",category:"women",year:1991,emoji:"🏆"},{id:"wm10",text:"Enriqueta Basilio na igrzyskach w Meksyku 1968 jako pierwsza kobieta w historii zapaliła znicz olimpijski. Wbiegła po schodach na szczyt stadionu na oczach miliardów widzów na całym świecie.",category:"women",year:1968,emoji:"🔥"},{id:"v14",text:"Reprezentacja Brazylii to potęga męskiej siatkówki — trzy złota olimpijskie (1992, 2004, 2016) i lata dominacji w Lidze Światowej. Brazylijczycy rozsławili też efektowny serwis z wyskoku.",category:"volleyball",year:2016,emoji:"🇧🇷"},{id:"c17",text:"Manny Pacquiao to jedyny bokser w historii, który zdobył mistrzowskie pasy w ośmiu różnych kategoriach wagowych. Po karierze w ringu został senatorem Filipin.",category:"combat",year:2009,emoji:"🇵🇭"},{id:"pr9",text:"Fallon Sherrock w 2019 roku jako pierwsza kobieta w historii pokonała mężczyznę w mistrzostwach świata w darcie PDC. Wygrała dwa mecze z rzędu, a hala „Ally Pally” oszalała na jej punkcie.",category:"precision",year:2019,emoji:"🎯"},{id:"k13",text:"Tadej Pogačar w 2024 roku wygrał w jednym sezonie Giro d'Italia, Tour de France i mistrzostwa świata — potrójną koronę, której przed nim dokonał tylko Eddy Merckx w 1974 roku.",category:"cycling",year:2024,emoji:"👑"},{id:"co1",text:"Vince Lombardi w latach 60. wyniósł Green Bay Packers na szczyt NFL i wygrał dwa pierwsze Super Bowl. Na jego cześć trofeum dla mistrza ligi nazwano Vince Lombardi Trophy.",category:"coaches",year:1967,emoji:"🏈"},{id:"co2",text:"Phil Jackson, „Zen Master”, zdobył 11 tytułów mistrza NBA jako trener — więcej niż ktokolwiek w historii. Prowadził gwiazdy pokroju Jordana i O'Neala, sięgając po medytację i buddyjskie przypowieści.",category:"coaches",year:2010,emoji:"🧘"},{id:"co3",text:"John Wooden, „Czarodziej z Westwood”, wygrał z koszykarzami UCLA 10 tytułów akademickich mistrzostw USA w 12 lat, w tym 7 z rzędu, oraz zaliczył serię 88 zwycięstw. To wyniki nie do pobicia.",category:"coaches",year:1973,emoji:"🧙"},{id:"co4",text:"Rinus Michels, twórca „futbolu totalnego”, w 1999 roku został wybrany przez FIFA Trenerem Stulecia. Jego Holandia grała tak, że każdy zawodnik potrafił zagrać na każdej pozycji.",category:"coaches",year:1999,emoji:"🇳🇱"},{id:"co5",text:"Pep Guardiola w pierwszym sezonie jako trener FC Barcelony (2008/09) wygrał komplet sześciu trofeów. Jego styl „tiki-taka” — gra na krótkie podania i dominacja w posiadaniu piłki — zmienił światowy futbol.",category:"coaches",year:2009,emoji:"🎡"},{id:"co6",text:"Herbert Chapman zrewolucjonizował futbol już w latach 20. i 30.: wymyślił nowoczesne ustawienie taktyczne, lobbował za numerami na koszulkach, sztucznym oświetleniem i europejskimi pucharami — dekady przed ich powstaniem.",category:"coaches",year:1930,emoji:"💡"},{id:"co7",text:"Gregg Popovich prowadził San Antonio Spurs przez blisko trzy dekady, zdobył 5 tytułów NBA i zaliczył najwięcej zwycięstw w historii ligi. Słynął z sarkastycznych wywiadów, których szczerze nie znosił.",category:"coaches",year:2014,emoji:"🎖️"},{id:"co8",text:"Walerij Łobanowski w Dynamie Kijów już w latach 70. traktował futbol jak naukę — zatrudniał analityków, liczył statystyki biegowe i podania na długo przed erą komputerów w sporcie.",category:"coaches",year:1975,emoji:"📊"},{id:"co9",text:"Anatolij Tarasow, „ojciec rosyjskiego hokeja”, zbudował radziecką potęgę na lodzie, czerpiąc z... baletu i szachów. Jego drużyny latami nie miały sobie równych na mistrzostwach świata i igrzyskach.",category:"coaches",year:1972,emoji:"🏒"},{id:"za1",text:"Red Rum to jedyny koń w historii, który trzy razy wygrał najsłynniejszą gonitwę świata, Grand National (1973, 1974, 1977). Pochowano go przy linii mety w Aintree.",category:"animals",year:1977,emoji:"🐎"},{id:"za2",text:"Seabiscuit, niepozorny i krzywonogi koń, stał się bohaterem Ameryki czasów wielkiego kryzysu. Jego zwycięstwo w pojedynku z faworytem War Admiralem w 1938 roku śledziło przy radiu 40 milionów ludzi.",category:"animals",year:1938,emoji:"🏇"},{id:"za3",text:"Wyścigowe gołębie pocztowe to prawdziwy sport z milionowym budżetem — belgijski gołąb New Kim został w 2020 roku sprzedany na aukcji za rekordowe 1,6 miliona euro.",category:"animals",year:2020,emoji:"🕊️"},{id:"za4",text:"Iditarod, morderczy wyścig psich zaprzęgów przez Alaskę (ok. 1600 km), upamiętnia dostawę serum do Nome w 1925 roku. Pies-przewodnik Balto z tamtej wyprawy doczekał się pomnika w Nowym Jorku.",category:"animals",year:1973,emoji:"🛷"},{id:"za5",text:"W wyścigach wielbłądów w krajach Zatoki Perskiej dżokejami są dziś... małe roboty sterowane pilotem z jadących obok terenówek. Zastąpiły dzieci, których zatrudnianie zakazano.",category:"animals",year:2005,emoji:"🤖"},{id:"za6",text:"Chart angielski to najszybszy pies świata — na wyścigowym torze rozpędza się do ponad 70 km/h. Sylwetką i sposobem biegu przypomina w miniaturze geparda.",category:"animals",year:1926,emoji:"🐕"},{id:"za7",text:"Ośmiornica Paul z akwarium w Oberhausen bezbłędnie „wytypowała” wyniki wszystkich meczów Niemiec i finału mistrzostw świata 2010. Media na całym świecie relacjonowały jej „przepowiednie” na żywo.",category:"animals",year:2010,emoji:"🐙"},{id:"za8",text:"Polo na słoniach to autentyczny sport — przez lata rozgrywano nawet jego nieoficjalne mistrzostwa świata w Nepalu. Każdym słoniem kierował poganiacz, a gracz próbował trafić piłkę długim kijem.",category:"animals",year:1982,emoji:"🐘"},{id:"sci1",text:"W lekkoatletyce reakcja szybsza niż 0,1 sekundy od strzału startera jest uznawana za falstart — nauka zakłada, że człowiek fizycznie nie potrafi zareagować szybciej.",category:"science",year:2009,emoji:"🔫"},{id:"sci2",text:"Kolarz Miguel Indurain miał tętno spoczynkowe ok. 28 uderzeń na minutę (przeciętny człowiek 60–80) i pojemność płuc bliską 8 litrów. Jego serce pompowało krew wyjątkowo oszczędnie.",category:"science",year:1995,emoji:"❤️"},{id:"sci3",text:"Pułap tlenowy (VO2 max) mówi, ile tlenu potrafi zużyć organizm. U przeciętnej osoby to ok. 40, a u najlepszych kolarzy i biegaczy narciarskich zmierzono astronomiczne wartości bliskie 95.",category:"science",year:2012,emoji:"🫁"},{id:"sci4",text:"Słynny rzut wolny Roberto Carlosa z 1997 roku, który zakręcił w powietrzu w pozornie niemożliwy sposób, doczekał się analizy francuskich fizyków. Wyjaśnia go efekt Magnusa — ta sama siła, która zakrzywia lot piłki.",category:"science",year:1997,emoji:"🌀"},{id:"sci5",text:"Pałkarz w baseballu ma na decyzję o uderzeniu mniej niż pół sekundy — szybciej, niż trwa mrugnięcie okiem. Piłka leci ku niemu z prędkością przekraczającą 150 km/h.",category:"science",year:2015,emoji:"⚾"},{id:"sci6",text:"„Moneyball”: w 2002 roku ubogie Oakland Athletics, opierając skład wyłącznie na statystyce, wygrało 20 meczów baseballu z rzędu — rekord ligi. Ta rewolucja danych zmieniła cały sport zawodowy.",category:"science",year:2002,emoji:"📈"},{id:"sci7",text:"W 2016 roku program AlphaGo pokonał arcymistrza go Lee Sedola. Jego 37. ruch w drugiej partii był tak nieoczywisty, że eksperci uznali go najpierw za błąd — a okazał się genialny.",category:"science",year:2016,emoji:"🤖"},{id:"sci8",text:"Podczas młyna w rugby ośmiu zawodników każdej drużyny napiera na siebie z siłą przekraczającą tonę. To jedno z największych obciążeń, jakie ludzkie ciało generuje w sporcie zespołowym.",category:"science",year:2010,emoji:"💥"},{id:"sci9",text:"Najlepsi maratończycy utrzymują tempo ok. 21 km/h przez ponad dwie godziny — czyli każdy kilometr poniżej 3 minut. Większość amatorów nie potrafi utrzymać takiego tempa nawet przez jeden kilometr.",category:"science",year:2022,emoji:"🏃"},{id:"f29",text:"Od 2008 do 2017 roku Złotą Piłkę dla najlepszego piłkarza świata zdobywali wyłącznie Lionel Messi i Cristiano Ronaldo — dziesięć lat z rzędu tylko oni dwaj.",category:"football",year:2017,emoji:"🏅"},{id:"o34",text:"Pięć kół olimpijskich w kolorach niebieskim, żółtym, czarnym, zielonym i czerwonym na białym tle dobrano tak, by co najmniej jedna z tych barw znalazła się w fladze każdego państwa świata.",category:"olympics",year:1913,emoji:"⭕"},{id:"t20",text:"Tie-break wymyślił w latach 60. Amerykanin Jimmy Van Alen, żeby skrócić ciągnące się w nieskończoność sety. Wprowadzono go w Wielkim Szlemie na US Open w 1970 roku.",category:"tennis",year:1970,emoji:"➗"},{id:"b18",text:"Sylwetka na logo NBA to według twórcy projektu Jerry West — gwiazda Los Angeles Lakers z lat 60. i 70. Liga nigdy oficjalnie tego nie potwierdziła.",category:"basketball",year:1969,emoji:"👤"},{id:"ch9",text:"„Nieśmiertelna partia” z 1851 roku, w której Adolf Anderssen poświęcił hetmana i obie wieże, by dać mata, do dziś jest jedną z najsłynniejszych partii szachowych w historii.",category:"chess",year:1851,emoji:"♟️"},{id:"w18",text:"Maszynę do czyszczenia lodu — zamboni — wynalazł w 1949 roku Frank Zamboni. Jej nazwa stała się tak popularna, że dziś prawie każdą taką maszynę nazywa się właśnie „zamboni”.",category:"winter",year:1949,emoji:"🧊"},{id:"rv1",text:"Muhammad Ali i Joe Frazier stoczyli trzy legendarne walki. Ostatnia, „Thrilla in Manila” (1975) w upale i wilgoci, była tak wyniszczająca, że obaj przyznali później, iż byli blisko śmierci.",category:"rivalries",year:1975,emoji:"🥊"},{id:"rv2",text:"Alain Prost i Ayrton Senna, koledzy z zespołu McLaren, znienawidzili się tak, że dwukrotnie rozstrzygnęli mistrzostwo świata, zderzając się bolidami na tym samym japońskim zakręcie — w 1989 i 1990 roku.",category:"rivalries",year:1990,emoji:"💥"},{id:"rv3",text:"Roger Federer i Rafael Nadal zagrali ze sobą 40 razy. Ich finał Wimbledonu 2008, zakończony po zmroku wynikiem 9:7 w piątym secie, wielu uznaje za najlepszy mecz tenisowy w historii.",category:"rivalries",year:2008,emoji:"🎾"},{id:"rv4",text:"Martina Navratilova i Chris Evert spotkały się na korcie aż 80 razy w ciągu 16 lat — to najdłuższa rywalizacja w historii tenisa. Poza kortem były bliskimi przyjaciółkami.",category:"rivalries",year:1988,emoji:"🤝"},{id:"rv5",text:"Larry Bird i Magic Johnson rywalizowali od finału akademickiego w 1979 roku po całe lata 80. w NBA. To ich pojedynki Celtics–Lakers wyciągnęły ligę z kryzysu i uczyniły globalnym fenomenem.",category:"rivalries",year:1984,emoji:"🏀"},{id:"rv6",text:"Brytyjczycy Sebastian Coe i Steve Ovett byli tak zacięcie skłóceni, że prawie nigdy nie startowali razem. Na igrzyskach 1980 każdy wygrał... koronny dystans rywala: Ovett 800 m, a Coe 1500 m.",category:"rivalries",year:1980,emoji:"🏃"},{id:"rv7",text:"Rywalizacja Jacka Nicklausa z Arnoldem Palmerem w latach 60. wyniosła golf do telewizyjnej wielkości. Palmer miał nawet własną armię kibiców — słynną „Arnie's Army”.",category:"rivalries",year:1962,emoji:"⛳"},{id:"rv8",text:"Na igrzyskach 2008 Michael Phelps pokonał Serba Milorada Čavicia na 100 m motylkiem o zaledwie 0,01 sekundy — ostatnim, krótszym uderzeniem w ścianę. Ta setna sekundy dała mu siódme z ośmiu złotych medali.",category:"rivalries",year:2008,emoji:"🏊"},{id:"a22",text:"Jim Hines na igrzyskach w Meksyku 1968 jako pierwszy człowiek zszedł na 100 m poniżej 10 sekund w oficjalnym, elektronicznym pomiarze — 9,95 s. Rekord przetrwał 15 lat.",category:"athletics",year:1968,emoji:"🔟"},{id:"c18",text:"George Foreman odzyskał mistrzostwo świata wagi ciężkiej w 1994 roku, mając 45 lat — jako najstarszy mistrz w historii. Zrobił to 20 lat po tym, jak przegrał z Alim w „Rumble in the Jungle”.",category:"combat",year:1994,emoji:"👴"},{id:"gf9",text:"Ryder Cup — drużynowy pojedynek golfistów USA i Europy — rozgrywany jest od 1927 roku wyłącznie o honor. Zawodnicy, na co dzień grający o miliony, nie dostają za niego ani centa.",category:"golf",year:1927,emoji:"🇪🇺"},{id:"sg26",text:"Barcelona 1992: w półfinale biegu na 400 m Derek Redmond zerwał mięsień i upadł. Na trasę wbiegł jego ojciec i pomógł mu dokuśtykać do mety — jedna z najbardziej wzruszających scen w historii igrzysk.",category:"summergames",year:1992,emoji:"🤍"},{id:"rg9",text:"Nowozelandczyk Jonah Lomu na mistrzostwach świata 1995 dosłownie przebiegał po rywalach. Ważący 120 kg skrzydłowy stał się pierwszą globalną gwiazdą rugby i zmienił wyobrażenie o tym sporcie.",category:"rugby",year:1995,emoji:"🌪️"},{id:"wm11",text:"Siostry Venus i Serena Williams zagrały ze sobą cztery finały wielkoszlemowe z rzędu (2002–2003). Wszystkie wygrała Serena, kompletując tzw. „Serena Slam” — cztery główne tytuły naraz.",category:"women",year:2003,emoji:"👯"},{id:"mo1",text:"Michael Jordan został w 2014 roku pierwszym sportowcem-miliarderem — nie dzięki grze, lecz marce Air Jordan i udziałom w klubie NBA. Buty sygnowane jego nazwiskiem sprzedają się do dziś za miliardy rocznie.",category:"money",year:2014,emoji:"👟"},{id:"mo2",text:"Tiger Woods jako pierwszy sportowiec w historii przekroczył miliard dolarów zarobków w karierze — głównie z reklam. Uczynił golf sportem, w którym płynęły naprawdę wielkie pieniądze.",category:"money",year:2009,emoji:"🐯"},{id:"mo3",text:"Cristiano Ronaldo po przejściu do saudyjskiego Al-Nassr w 2023 roku zaczął zarabiać około 200 milionów euro rocznie — to jeden z najwyższych kontraktów w historii sportu.",category:"money",year:2023,emoji:"🇸🇦"},{id:"mo4",text:"Przez ponad sto lat medaliści olimpijscy nie dostawali ani grosza nagrody. Dopiero na igrzyska 2024 lekkoatletyka jako pierwsza dyscyplina ogłosiła premie — 50 tysięcy dolarów za złoto.",category:"money",year:2024,emoji:"🥇"},{id:"mo5",text:"Amerykańska telewizja NBC zapłaciła 7,75 miliarda dolarów za prawa do transmisji igrzysk olimpijskich w USA do 2032 roku. To pokazuje, jak ogromną machiną finansową stały się igrzyska.",category:"money",year:2014,emoji:"📺"},{id:"mo6",text:"Indyjska liga krykieta IPL to najbogatsza liga tego sportu na świecie. Zawodników kupuje się na aukcjach za miliony dolarów, a mecze ogląda kilkaset milionów widzów.",category:"money",year:2008,emoji:"🏏"},{id:"mo7",text:"W 1992 roku angielskie kluby oderwały się od ligowej struktury i założyły Premier League, by samodzielnie sprzedawać prawa telewizyjne. Dziś to najbogatsza liga piłkarska świata.",category:"money",year:1992,emoji:"📈"},{id:"mo8",text:"W 2022 roku finansowana z Arabii Saudyjskiej seria LIV Golf zwabiła gwiazdy gigantycznymi, gwarantowanymi kontraktami i podzieliła świat golfa. Podobne miliardy popłynęły później do piłki i innych sportów.",category:"money",year:2022,emoji:"⛳"},{id:"f30",text:"Zasada „50+1” w niemieckiej Bundeslidze wymaga, by większość udziałów klubu należała do jego kibiców-członków. Dzięki temu bilety są tanie, a kluby trudniej przejąć inwestorom.",category:"football",year:1998,emoji:"🇩🇪"},{id:"b19",text:"Ligę NBA (pod pierwotną nazwą BAA) założono w 1946 roku. Pierwszy mecz rozegrano w Toronto, a pierwszy zdobyty w historii ligi kosz padł... z rzutu za dwa punkty Ossiego Schectmana.",category:"basketball",year:1946,emoji:"📜"},{id:"c19",text:"Pierwsza walka bokserska, która przyniosła z biletów ponad milion dolarów, odbyła się w 1921 roku (Dempsey–Carpentier). Zapoczątkowała erę wielkich gal jako dochodowego widowiska.",category:"combat",year:1921,emoji:"💵"},{id:"r21",text:"Najcenniejszą marką sportową świata jest od lat klub futbolu amerykańskiego Dallas Cowboys, wyceniany na ponad 10 miliardów dolarów — więcej niż niejedno duże przedsiębiorstwo giełdowe.",category:"records",year:2024,emoji:"🤠"},{id:"cu1",text:"Film „Rocky” (1976), napisany przez nieznanego wówczas Sylvestra Stallone'a, zdobył Oscara dla najlepszego filmu. Do dziś turyści wbiegają po „schodach Rocky'ego” przed muzeum w Filadelfii, gdzie stoi pomnik boksera.",category:"culture",year:1976,emoji:"🥊"},{id:"cu2",text:"„Rydwany ognia” (1981) o brytyjskich biegaczach z igrzysk 1924 zdobyły Oscara dla najlepszego filmu, a elektroniczny motyw Vangelisa stał się jedną z najbardziej rozpoznawalnych melodii w sporcie.",category:"culture",year:1981,emoji:"🎼"},{id:"cu3",text:"„Pole marzeń” (1989) z kwestią „Jeśli to zbudujesz, on przyjdzie” tak zrosło się z baseballem, że w 2021 roku liga MLB rozegrała prawdziwy mecz na boisku pośród kukurydzy z filmu.",category:"culture",year:1989,emoji:"🌽"},{id:"cu4",text:"W „Kosmicznym meczu” (1996) Michael Jordan zagrał w koszykówkę u boku Królika Bugsa i Zwariowanych Melodii. Film stał się kultowy i pokazał, jak sportowa gwiazda podbija popkulturę.",category:"culture",year:1996,emoji:"🐰"},{id:"cu5",text:"Albumy z naklejkami piłkarskimi Panini to fenomen od mundialu 1970. Kompletowanie kolekcji i wymienianie dubli — „mam, mam, brak” — pochłania kibiców na całym świecie co cztery lata.",category:"culture",year:1970,emoji:"📖"},{id:"cu6",text:"Seria gier FIFA (EA Sports) to najlepiej sprzedająca się seria gier sportowych w historii — rozeszła się w setkach milionów egzemplarzy i dla wielu młodych kibiców jest pierwszym kontaktem z futbolem.",category:"culture",year:2010,emoji:"🎮"},{id:"cu7",text:"„Meksykańska fala” — kibice wstający kolejno, by przez trybuny przebiegła fala — zyskała światową sławę podczas mundialu w Meksyku w 1986 roku i stąd wzięła swoją nazwę.",category:"culture",year:1986,emoji:"🌊"},{id:"cu8",text:"Przez dekady amerykański program „Wide World of Sports” otwierała scena „agonii porażki” — spektakularny upadek skoczka narciarskiego. Był to Słoweniec Vinko Bogataj, który przeżył swój wypadek z 1970 roku.",category:"culture",year:1970,emoji:"💥"},{id:"cu9",text:"„Waka Waka” Shakiry, oficjalny hymn mundialu 2010 w RPA, to jeden z najlepiej sprzedających się utworów w historii mistrzostw świata, a jego teledysk ma miliardy wyświetleń.",category:"culture",year:2010,emoji:"🎵"},{id:"cu10",text:"Film „Podkręć jak Beckham” (2002) o dziewczynie marzącej o wielkim futbolu pomógł rozsławić kobiecą piłkę nożną na całym świecie i stał się jednym z najpopularniejszych filmów sportowych o kobietach.",category:"culture",year:2002,emoji:"⚽"},{id:"o37",text:"Pierwszą oficjalną maskotką igrzysk był jamnik Waldi z Monachium 1972. Od tamtej pory każde igrzyska mają własne maskotki — często dziwaczne i wzbudzające żywe dyskusje.",category:"olympics",year:1972,emoji:"🐕"},{id:"f31",text:"Przez większość historii futbolu numery na koszulkach oznaczały pozycje (1 — bramkarz, 9 — napastnik). Stałe numery i nazwiska zawodników na plecach weszły na dobre dopiero w latach 90.",category:"football",year:1993,emoji:"🔢"},{id:"a23",text:"Zanim w latach 30. XX wieku upowszechniły się bloki startowe, sprinterzy kopali w żużlowej bieżni małe dołki na stopy, by mieć się od czego odbić na starcie.",category:"athletics",year:1930,emoji:"🕳️"},{id:"pol1",text:"W proteście przeciwko apartheidowi RPA była wykluczona z igrzysk olimpijskich przez blisko trzy dekady — od 1964 do 1992 roku. Na igrzyska wróciła dopiero po demontażu segregacji rasowej.",category:"politics",year:1992,emoji:"✊"},{id:"pol2",text:"W 1969 roku napięcia wokół meczów eliminacji mundialu przelały się w krótką „wojnę futbolową” między Salwadorem a Hondurasem. Trwała około stu godzin i pochłonęła tysiące ofiar.",category:"politics",year:1969,emoji:"⚔️"},{id:"pol3",text:"Na zimowych igrzyskach 2018 sportowcy obu Korei przeszli razem pod wspólną flagą, a kobiety wystawiły zjednoczoną drużynę hokejową — rzadki gest pojednania między skłóconymi państwami.",category:"politics",year:2018,emoji:"🕊️"},{id:"pol4",text:"Na igrzyskach 1936 w hitlerowskim Berlinie niemiecki skoczek w dal Luz Long publicznie doradzał i gratulował czarnoskóremu Jesse Owensowi. Ich przyjaźń przeczyła nazistowskiej propagandzie na oczach świata.",category:"politics",year:1936,emoji:"🤝"},{id:"pol5",text:"Hasło FC Barcelony „Més que un club” („Więcej niż klub”) narodziło się z jej roli symbolu katalońskiej tożsamości — zwłaszcza w czasach dyktatury generała Franco.",category:"politics",year:1968,emoji:"🔵"},{id:"pol6",text:"Tajwan z powodów politycznych nie może startować w zawodach pod własną nazwą ani flagą — występuje jako „Chińskie Tajpej”, z osobnym symbolem olimpijskim zamiast flagi narodowej.",category:"politics",year:1981,emoji:"🏳️"},{id:"pol7",text:"W czasach zimnej wojny NRD i RFN wystawiały osobne reprezentacje olimpijskie, zaciekle rywalizując o medale. Zjednoczone Niemcy wróciły jako jedna drużyna dopiero w 1992 roku.",category:"politics",year:1968,emoji:"🧱"},{id:"pol8",text:"Mecze krykieta między Indiami a Pakistanem to nie tylko sport — bywają okazją do „krykietowej dyplomacji”, gdy przywódcy obu skłóconych mocarstw spotykają się na trybunach.",category:"politics",year:2005,emoji:"🏏"},{id:"rg10",text:"Reprezentacja RPA (Springboks) zdobyła rekordowe cztery tytuły mistrza świata w rugby (1995, 2007, 2019, 2023) — więcej niż jakikolwiek inny kraj w historii tego sportu.",category:"rugby",year:2023,emoji:"🏆"},{id:"t22",text:"Puchar Davisa, drużynowe mistrzostwa świata w tenisie mężczyzn, rozgrywany jest od 1900 roku — to jedne z najstarszych międzynarodowych rozgrywek zespołowych w całym sporcie.",category:"tennis",year:1900,emoji:"🏆"},{id:"o38",text:"Igrzyska paraolimpijskie wyrosły z zawodów dla weteranów z urazami rdzenia kręgowego, zorganizowanych w 1948 roku przez doktora Ludwiga Guttmanna w brytyjskim Stoke Mandeville.",category:"olympics",year:1948,emoji:"♿"},{id:"b20",text:"Earl Lloyd w 1950 roku jako pierwszy czarnoskóry koszykarz zagrał w meczu NBA. Dziś zawodnicy o korzeniach afroamerykańskich stanowią zdecydowaną większość ligi.",category:"basketball",year:1950,emoji:"🏀"},{id:"cb1",text:"Ben Hogan w 1949 roku o mało nie zginął w czołowym zderzeniu z autobusem — lekarze wątpili, czy jeszcze będzie chodził. Wrócił do golfa i wygrał sześć z dziewięciu swoich turniejów wielkoszlemowych już po wypadku.",category:"comebacks",year:1950,emoji:"⛳"},{id:"cb2",text:"Monica Seles, liderka światowego tenisa, została w 1993 roku ugodzona nożem podczas meczu przez fanatycznego kibica jej rywalki. Wróciła na korty po ponad dwóch latach i zdobyła jeszcze tytuł wielkoszlemowy.",category:"comebacks",year:1996,emoji:"🔪"},{id:"cb3",text:"Brazylijczyk Ronaldo dwukrotnie zrywał ścięgno w kolanie i groziło mu zakończenie kariery. Wrócił i na mundialu 2002 strzelił 8 goli, został królem strzelców i mistrzem świata — to jeden z największych powrotów w historii futbolu.",category:"comebacks",year:2002,emoji:"🦵"},{id:"cb4",text:"Bethany Hamilton straciła rękę w ataku rekina jako 13-letnia surferka. Zaledwie kilka tygodni później wróciła na deskę, a później została zawodową surferką — jej historię opowiada film „Soul Surfer”.",category:"comebacks",year:2004,emoji:"🦈"},{id:"cb5",text:"Futbolista NFL Alex Smith doznał tak potwornego złamania nogi, że przez zakażenie groziła mu amputacja. Po kilkunastu operacjach wrócił na boisko i został wybrany najlepszym powrotem sezonu 2020.",category:"comebacks",year:2020,emoji:"🏈"},{id:"cb6",text:"Bramkarz Petr Čech doznał w 2006 roku wgniecenia czaszki po zderzeniu z rywalem. Wrócił do gry i przez resztę kariery — kilkanaście lat — występował w charakterystycznym ochronnym kasku na głowie.",category:"comebacks",year:2006,emoji:"🪖"},{id:"cb7",text:"Kerri Strug na igrzyskach 1996 oddała decydujący skok przez konia na kontuzjowanej kostce, by zapewnić Amerykankom drużynowe złoto w gimnastyce. Lądowanie na jednej nodze i grymas bólu obiegły cały świat.",category:"comebacks",year:1996,emoji:"🤸"},{id:"cb8",text:"Peyton Manningowi po serii operacji kręgosłupa mówiono, że może już nigdy nie zagrać. Wrócił, zmienił klub i kilka lat później wygrał Super Bowl — jako jeden z najlepszych rozgrywających w historii NFL.",category:"comebacks",year:2016,emoji:"💪"},{id:"w20",text:"Franz Klammer zjechał po złoto olimpijskie w Innsbrucku 1976 przed własną, austriacką publicznością tak brawurowo, balansując na granicy upadku, że jego przejazd uchodzi za najsłynniejszy zjazd w historii narciarstwa.",category:"winter",year:1976,emoji:"⛷️"},{id:"s13",text:"Australijczyk Ian Thorpe, „Torpeda”, zdobył 5 złotych medali olimpijskich jako nastolatek. Pomagały mu stopy o rozmiarze ponad 50 — działały niemal jak wbudowane płetwy.",category:"water",year:2e3,emoji:"🦶"},{id:"a24",text:"Zwycięzcę dziesięcioboju tradycyjnie nazywa się „najwszechstronniejszym sportowcem świata”. Tytuł ten sięga 1912 roku, gdy król Szwecji tak nazwał triumfatora Jima Thorpe'a.",category:"athletics",year:1912,emoji:"🔟"},{id:"c20",text:"Sugar Ray Robinson jest przez wielu uważany za najlepszego boksera wszech czasów „funt za funt”. To właśnie na jego określenie ukuto ten popularny dziś w sportach walki zwrot.",category:"combat",year:1951,emoji:"🥊"},{id:"gear1",text:"Karbonowe buty do biegania Nike (Vaporfly) od 2017 roku wywołały lawinę rekordów w maratonie. Efekt był tak duży, że władze lekkoatletyki musiały ograniczyć przepisami grubość podeszwy.",category:"gear",year:2019,emoji:"👟"},{id:"gear2",text:"Wprowadzony w 2018 roku system „halo” — tytanowy pałąk nad głową kierowcy F1 — początkowo krytykowano za wygląd. Dziś przypisuje mu się uratowanie życia w kilku spektakularnych wypadkach.",category:"gear",year:2018,emoji:"🛡️"},{id:"gear3",text:"Technologia bramkowa (goal-line technology), która w ułamku sekundy rozstrzyga, czy piłka przekroczyła linię, zadebiutowała na mundialu w 2014 roku. Wcześniej decydowało wyłącznie oko sędziego.",category:"gear",year:2014,emoji:"🥅"},{id:"gear4",text:"W 1986 roku przekonstruowano męski oszczep, przesuwając jego środek ciężkości — po to, by lądował krócej i bliżej ziemi. Rzuty stały się zbyt długie i groziły dolecieniem do bieżni i trybun.",category:"gear",year:1986,emoji:"🎯"},{id:"gear5",text:"Tyczki z włókna szklanego, które zastąpiły bambusowe i metalowe, dosłownie wyniosły skok o tyczce na nowy poziom — sprężysty materiał pozwolił skakać znacznie wyżej niż kiedykolwiek wcześniej.",category:"gear",year:1961,emoji:"🪜"},{id:"gear6",text:"Panczen z odczepianą piętą (tzw. klapskate) zrewolucjonizował łyżwiarstwo szybkie pod koniec lat 90. Na igrzyskach 1998 rekordy świata posypały się jeden za drugim.",category:"gear",year:1998,emoji:"⛸️"},{id:"gear7",text:"Drewniane rakiety tenisowe, używane przez ponad sto lat, w latach 80. ustąpiły miejsca grafitowym i kompozytowym. Lżejszy, mocniejszy sprzęt całkowicie zmienił szybkość i siłę gry.",category:"gear",year:1985,emoji:"🎾"},{id:"gear8",text:"Skok Fosbury'ego — plecami nad poprzeczką — stał się możliwy dopiero, gdy w latach 60. lądowiska w skoku wzwyż wyścielono grubą pianką. Wcześniej, przy piasku i trocinach, lądowanie na plecach groziło urazem.",category:"gear",year:1968,emoji:"🛏️"},{id:"wc23",text:"System powtórek wideo VAR zadebiutował na mistrzostwach świata w 2018 roku. Sędziowie po raz pierwszy mogli obejrzeć kontrowersyjne sytuacje na ekranie przy linii bocznej.",category:"worldcup",year:2018,emoji:"📺"},{id:"o39",text:"Tradycję wspólnego, wymieszanego wejścia sportowców na ceremonię zamknięcia igrzysk zapoczątkowano w 1956 roku. Pomysł podsunął w liście nastoletni chłopak z Melbourne.",category:"olympics",year:1956,emoji:"🤝"},{id:"a25",text:"Mila to jedyny dystans w niemetrycznych jednostkach, dla którego lekkoatletyka wciąż oficjalnie uznaje rekordy świata — hołd dla jej historycznego znaczenia w biegach średnich.",category:"athletics",year:1975,emoji:"📏"},{id:"t23",text:"Tenisowe „love” oznaczające zero pochodzi — według popularnej teorii — od francuskiego „l'œuf”, czyli „jajko”, którego kształt przypomina zero. Podobnie mówi się o „zerze” w krykiecie („duck”).",category:"tennis",year:1890,emoji:"🥚"},{id:"b21",text:"Kobieca liga koszykówki WNBA powstała w 1996 roku pod skrzydłami NBA. Dziś to najsilniejsza kobieca liga koszykówki świata, z gwiazdami rozpoznawalnymi na całym globie.",category:"basketball",year:1996,emoji:"🏀"},{id:"c21",text:"Jack Johnson w 1908 roku został pierwszym czarnoskórym mistrzem świata wagi ciężkiej. Jego panowanie wywołało w rasistowskiej Ameryce histeryczne poszukiwanie „białej nadziei”, która by go pokonała.",category:"combat",year:1908,emoji:"🥊"},{id:"k14",text:"Jazda w peletonie, w cieniu aerodynamicznym innych kolarzy, pozwala zaoszczędzić nawet 30–40% energii. Dlatego samotna ucieczka pod wiatr to jedno z najtrudniejszych zadań w kolarstwie.",category:"cycling",year:2015,emoji:"💨"},{id:"w21",text:"Saneczkarz w konkurencji singla pędzi lodową rynną z prędkością ponad 140 km/h — leżąc na plecach, nogami do przodu, bez hamulców. Torem steruje samymi ruchami łydek i ramion.",category:"winter",year:2010,emoji:"🛷"},{id:"rg11",text:"Piłka do rugby jest owalna, bo pierwsze takie piłki wykonywano z... świńskich pęcherzy, które miały naturalnie wydłużony kształt. Gdy zaczęto używać gumy, owalną formę zachowano celowo.",category:"rugby",year:1870,emoji:"🐷"},{id:"v15",text:"W siatkówce plażowej zawodnicy pokazują sobie za plecami sygnały palcami, ustalając plan bloku — tak, by rywale ich nie zobaczyli. Każdy układ palców to inne zadanie w obronie.",category:"volleyball",year:2004,emoji:"🤟"},{id:"m17",text:"Amerykański NASCAR wyrósł z czasów prohibicji: przemytnicy alkoholu podrasowywali auta, by uciekać policji, a po godzinach ścigali się między sobą. Z tych wyścigów narodził się cały sport.",category:"motorsport",year:1948,emoji:"🥃"},{id:"tr10",text:"Zapaśnicy sumo przed każdą walką rzucają na ring garść soli. To rytuał oczyszczenia wywodzący się z religii shintō — jeden z wielu wielowiekowych ceremoniałów tej dyscypliny.",category:"traditional",emoji:"🧂"},{id:"we1",text:"„Ice Bowl” z 1967 roku — finał konferencji NFL rozegrano przy -26°C, a wiatr dawał odczuwalne -44°C. Metalowy gwizdek sędziego przymarzł mu do warg, więc reszty meczu odgwizdywał już... głosem.",category:"weather",year:1967,emoji:"🥶"},{id:"we2",text:"Badwater Ultramarathon to najgorętszy bieg świata — 217 km przez Dolinę Śmierci w temperaturze dochodzącej do 54°C. Asfalt bywa tak rozgrzany, że zawodnicy biegną białą linią, by nie stopić podeszew.",category:"weather",year:1987,emoji:"🔥"},{id:"we3",text:"Marathon des Sables to sześciodniowy bieg na ok. 250 km przez Saharę. Zawodnicy niosą na plecach cały swój prowiant i śpią w koczowniczych namiotach, walcząc z upałem i burzami piaskowymi.",category:"weather",year:1986,emoji:"🏜️"},{id:"we4",text:"Antarctic Ice Marathon rozgrywa się w pobliżu bieguna południowego, w temperaturze około -20°C, a odczuwalny mróz spotęgowany wiatrem bywa znacznie niższy. To najzimniejszy maraton na Ziemi.",category:"weather",year:2006,emoji:"🧊"},{id:"we5",text:"Tom Simpson zasłabł i zmarł z wycieńczenia w morderczym upale na zboczu Mont Ventoux podczas Tour de France 1967. Na jego cześć przy drodze stoi pomnik, przy którym kolarze zostawiają bidony i czapki.",category:"weather",year:1967,emoji:"⛰️"},{id:"we6",text:"By sprawiedliwie rozstrzygać przerwane deszczem mecze krykieta, wymyślono matematyczną metodę Duckwortha-Lewisa. Skomplikowany wzór przelicza, ile punktów powinna zdobyć drużyna w skróconym czasie gry.",category:"weather",year:1997,emoji:"🌧️"},{id:"we7",text:"Golfista Lee Trevino został w 1975 roku rażony piorunem podczas turnieju i przeżył. Później żartował, że w czasie burzy najlepiej trzymać nad głową kij zwany „driving iron” — „bo nawet Bóg go nie trafi”.",category:"weather",year:1975,emoji:"⚡"},{id:"we8",text:"Regaty Sydney–Hobart w 1998 roku przeszły w tragedię, gdy w jachty uderzył gwałtowny sztorm. Zginęło sześciu żeglarzy, kilka łodzi zatonęło, a marynarkę wojenną i lotnictwo rzucono do jednej z największych akcji ratunkowych w historii żeglarstwa.",category:"weather",year:1998,emoji:"🌊"},{id:"fi1",text:"Pierwszego gola w historii mistrzostw świata strzelił 13 lipca 1930 roku Francuz Lucien Laurent, w meczu z Meksykiem. Grał wtedy jako amator i na co dzień pracował w fabryce.",category:"firsts",year:1930,emoji:"⚽"},{id:"fi2",text:"Pierwszym mistrzem nowożytnych igrzysk został w 1896 roku Amerykanin James Connolly, wygrywając trójskok. Był pierwszym olimpijskim zwycięzcą od ponad 1500 lat — od czasu zakazu antycznych igrzysk.",category:"firsts",year:1896,emoji:"🥇"},{id:"fi3",text:"Za pierwsze międzynarodowe wydarzenie sportowe ery nowożytnej uchodzi mecz krykieta USA–Kanada z 1844 roku. Rozegrano go w Nowym Jorku, dekady przed pierwszym meczem piłkarskim czy igrzyskami.",category:"firsts",year:1844,emoji:"🏏"},{id:"fi4",text:"Pierwszą w historii Złotą Piłkę dla najlepszego piłkarza otrzymał w 1956 roku Anglik Stanley Matthews — w wieku 41 lat. Grał w najwyższej klasie rozgrywkowej aż do pięćdziesiątki.",category:"firsts",year:1956,emoji:"🏅"},{id:"fi5",text:"Stéphanie Frappart w 2022 roku jako pierwsza kobieta poprowadziła mecz mistrzostw świata mężczyzn — spotkanie Kostaryka–Niemcy. Stała też na czele całej trójki sędziowskiej złożonej z kobiet.",category:"firsts",year:2022,emoji:"🚺"},{id:"fi6",text:"Pierwszą bramkę w historii angielskiej Premier League strzelił w 1992 roku Brian Deane z Sheffield United. Nowa liga stała się później najbogatszą i najczęściej oglądaną na świecie.",category:"firsts",year:1992,emoji:"🎯"},{id:"fi7",text:"Pierwszy transfer piłkarza za tysiąc funtów — Alfa Commona w 1905 roku — wywołał w Anglii oburzenie. Komentowano, że to skandaliczne, by człowiek kosztował tak absurdalną fortunę.",category:"firsts",year:1905,emoji:"💷"},{id:"fi8",text:"Pierwszą afrykańską reprezentacją na mistrzostwach świata był Egipt w 1934 roku. Na kolejny występ drużyny z tego kontynentu trzeba było czekać aż do 1970 roku.",category:"firsts",year:1934,emoji:"🌍"},{id:"w22",text:"Kanadyjczyk Kurt Browning w 1988 roku jako pierwszy łyżwiarz w historii wykonał w zawodach poczwórny skok (quad). Dziś
