u — Barcelona podpisała z nim pierwszy kontrakt na serwetce. Mundial w Katarze 2022 domknął jego kolekcję wszystkich najważniejszych trofeów.",emoji:"🐐"},{id:"lewandowski",name:"Robert Lewandowski",flag:"🇵🇱",sport:"football",years:"2005–",tagline:"RL9",achievements:["Zwycięzca Ligi Mistrzów 2020 z Bayernem (potrójna korona)","2× Piłkarz Roku FIFA (2020, 2021)","Rekordzista goli w reprezentacji Polski","5 goli w 9 minut — rekord Guinnessa (2015)"],bio:"Najlepszy polski piłkarz w historii. W sezonie 2020/21 strzelił 41 goli w Bundeslidze, bijąc „wieczny” rekord Gerda Müllera.",emoji:"🎯"},{id:"ali",name:"Muhammad Ali",flag:"🇺🇸",sport:"combat",years:"1960–1981",tagline:"The Greatest",achievements:["3× mistrz świata wagi ciężkiej","Złoto olimpijskie Rzym 1960","Legendarne walki: „Rumble in the Jungle”, „Thrilla in Manila”"],bio:"„Unoś się jak motyl, żądl jak pszczoła”. Za odmowę służby w Wietnamie odebrano mu tytuł i licencję na 3,5 roku w szczycie kariery. Wrócił i odzyskał pas — dwukrotnie.",emoji:"🦋"},{id:"jordan",name:"Michael Jordan",flag:"🇺🇸",sport:"basketball",years:"1984–2003",tagline:"Air Jordan",achievements:["6× mistrz NBA z Chicago Bulls, 6× MVP finałów","5× MVP sezonu, 10× król strzelców","2× złoto olimpijskie (1984, 1992 — Dream Team)"],bio:"W liceum nie dostał się do pierwszej drużyny szkoły. Odpowiedział tak, że dziś jego sylwetka w locie jest logo marki wartej miliardy, a on sam symbolem zwycięskiej mentalności.",emoji:"🏀"},{id:"bolt",name:"Usain Bolt",flag:"🇯🇲",sport:"athletics",years:"2004–2017",tagline:"Lightning Bolt",achievements:["8 złotych medali olimpijskich","Rekordy świata: 100 m (9,58 s) i 200 m (19,19 s)","Potrójny hat-trick sprinterski: złota na 100 m, 200 m i w sztafecie na 3 igrzyskach"],bio:"Najszybszy człowiek w historii. Na mecie w Pekinie 2008 zwalniał i bił się w pierś — i tak pobił rekord świata. Jego poza „błyskawicy” stała się jednym z najbardziej rozpoznawalnych gestów sportu.",emoji:"⚡"},{id:"phelps",name:"Michael Phelps",flag:"🇺🇸",sport:"water",years:"2000–2016",tagline:"Baltimore Bullet",achievements:["28 medali olimpijskich, w tym 23 złote — rekord wszech czasów","8 złotych medali na jednych igrzyskach (Pekin 2008)","39 rekordów świata"],bio:"Rozpiętość jego ramion (201 cm) przewyższa wzrost (193 cm). Trenował 365 dni w roku — także w święta — spalając po 10 000 kalorii dziennie.",emoji:"🏊"},{id:"serena",name:"Serena Williams",flag:"🇺🇸",sport:"tennis",years:"1995–2022",tagline:"Królowa kortów",achievements:["23 tytuły wielkoszlemowe w singlu — rekord ery open","4× złoto olimpijskie","Wygrała Australian Open 2017... będąc w ciąży"],bio:"Razem z siostrą Venus trenowała na publicznych kortach Compton w Los Angeles. Zdominowała kobiecy tenis na ponad dwie dekady, wygrywając Szlemy w trzech różnych dekadach.",emoji:"👸"},{id:"federer",name:"Roger Federer",flag:"🇨🇭",sport:"tennis",years:"1998–2022",tagline:"Maestro",achievements:["20 tytułów wielkoszlemowych, w tym 8 Wimbledonów","310 tygodni jako nr 1 rankingu ATP (237 z rzędu)","13× nagroda fanów ATP z rzędu za sportową postawę"],bio:"Jako junior słynął z wybuchowego temperamentu i rzucania rakietami. Stał się uosobieniem elegancji — jego rywalizacja z Nadalem i Djokoviciem zdefiniowała złotą erę tenisa.",emoji:"🎩"},{id:"swiatek",name:"Iga Świątek",flag:"🇵🇱",sport:"tennis",years:"2016–",tagline:"Iga z Raszyna",achievements:["Wielokrotna mistrzyni wielkoszlemowa (m.in. 4× Roland Garros)","Pierwsza polska liderka rankingu WTA (125 tygodni)","Seria 37 zwycięstw z rzędu (2022) — najdłuższa w XXI wieku"],bio:"Córka olimpijczyka-wioślarza. W 2022 roku wygrała 6 turniejów z rzędu i zdominowała ranking tak, że nad drugą zawodniczką miała ponad dwukrotną przewagę punktów.",emoji:"🎾"},{id:"senna",name:"Ayrton Senna",flag:"🇧🇷",sport:"motorsport",years:"1984–1994",tagline:"Magic",achievements:["3× mistrz świata F1 (1988, 1990, 1991)","65 pole positions — mistrz jednego okrążenia","6 zwycięstw w Monako — „król ulic księstwa”"],bio:"Mistrz jazdy w deszczu i perfekcjonista. Zginął podczas GP San Marino 1994 na torze Imola. W Brazylii ogłoszono trzydniową żałobę narodową, a jego fundacja pomogła milionom dzieci.",emoji:"🌧️"},{id:"schumacher",name:"Michael Schumacher",flag:"🇩🇪",sport:"motorsport",years:"1991–2012",tagline:"Schumi",achievements:["7× mistrz świata F1 (rekord wyrównany przez Hamiltona)","91 zwycięstw w Grand Prix","5 tytułów z rzędu z Ferrari (2000–2004)"],bio:"Wyniósł Ferrari z 21-letniego kryzysu do absolutnej dominacji. Słynął z morderczej pracy nad detalami — potrafił zjechać do boksu i podać inżynierom temperaturę każdej opony z dokładnością do stopnia.",emoji:"🐎"},{id:"kubica",name:"Robert Kubica",flag:"🇵🇱",sport:"motorsport",years:"2006–",tagline:"Pierwszy Polak w F1",achievements:["Zwycięzca GP Kanady 2008 — jedyna polska wygrana w F1","Powrót do F1 po ciężkim wypadku w rajdzie (2019)","Zwycięzca 24h Le Mans w klasie LMP2 (2021) i mistrz WEC"],bio:"Po wypadku rajdowym w 2011 roku z częściowo niesprawną ręką wrócił do ścigania — najpierw w rajdach, potem w F1. Jego historia uchodzi za jeden z największych comebacków w historii motorsportu.",emoji:"💪"},{id:"comaneci",name:"Nadia Comăneci",flag:"🇷🇴",sport:"olympics",years:"1975–1984",tagline:"Perfekcyjna dziesiątka",achievements:["Pierwsza „10.0” w historii igrzysk (Montreal 1976)","5 złotych medali olimpijskich","7 perfekcyjnych not na jednych igrzyskach — w wieku 14 lat"],bio:"Czternastolatka z Rumunii zmieniła gimnastykę na zawsze. W 1989 roku uciekła z komunistycznej Rumunii przez zieloną granicę, na kilka tygodni przed upadkiem reżimu Ceaușescu.",emoji:"🤸"},{id:"gretzky",name:"Wayne Gretzky",flag:"🇨🇦",sport:"winter",years:"1978–1999",tagline:"The Great One",achievements:["Rekordzista NHL: 2857 punktów — o ponad 900 więcej niż drugi w historii","4× Puchar Stanleya z Edmonton Oilers","Miałby rekord punktów NHL nawet nie strzelając ani jednego gola — z samych asyst"],bio:"Numer 99 zastrzeżono w całej lidze NHL — nikt już nigdy w niej nie zagra z tym numerem. „Jedź tam, gdzie krążek będzie, a nie tam, gdzie był” — jego dewiza stała się uniwersalną maksymą sportu.",emoji:"🏒"},{id:"merckx",name:"Eddy Merckx",flag:"🇧🇪",sport:"cycling",years:"1965–1978",tagline:"Kanibal",achievements:["5× Tour de France, 5× Giro d'Italia","Około 525 zawodowych zwycięstw — rekord wszech czasów","Rekord godzinny (1972) uznany za „wyczyn stulecia”"],bio:"Pseudonim „Kanibal” zawdzięcza temu, że chciał wygrywać wszystko — od klasyków po wielkie toury, od prologów po etapy górskie. W sezonie 1971 wygrał 54 wyścigi.",emoji:"🍽️"},{id:"szewinska",name:"Irena Szewińska",flag:"🇵🇱",sport:"athletics",years:"1964–1980",tagline:"Pierwsza dama polskiego sportu",achievements:["7 medali olimpijskich (3 złote) na 4 kolejnych igrzyskach","Rekordy świata na 100 m, 200 m i 400 m — jedyna w historii","Członkini MKOl przez 20 lat"],bio:"Zadebiutowała złotem i dwoma srebrami w Tokio 1964 jako 18-latka. Gdy w połowie kariery urodziła syna, wróciła jeszcze silniejsza — na 400 m nie przegrała ani jednego finału.",emoji:"👑"},{id:"malysz",name:"Adam Małysz",flag:"🇵🇱",sport:"winter",years:"1995–2011",tagline:"Orzeł z Wisły",achievements:["4× zdobywca Pucharu Świata (w tym 3 z rzędu)","4 medale olimpijskie, 4 tytuły mistrza świata","46 zwycięstw w konkursach Pucharu Świata"],bio:"Z zawodu blacharz-dekarz. Zimą 2000/01 wywołał w Polsce „małyszomanię” — transmisje skoków oglądało ponad 10 milionów widzów, a kraj zatrzymywał się na czas jego prób.",emoji:"🦅"},{id:"kowalczyk",name:"Justyna Kowalczyk",flag:"🇵🇱",sport:"winter",years:"2001–2018",tagline:"Królowa nart",achievements:["5 medali olimpijskich, w tym 2 złote (2010, 2014)","4× zdobywczyni Pucharu Świata w biegach narciarskich","2× triumfatorka morderczego Tour de Ski"],bio:"Złoto w Soczi 2014 na 10 km klasykiem zdobyła ze złamaną kością stopy, o czym świat dowiedział się dopiero po biegu. Słynęła z benedyktyńskiej pracy treningowej.",emoji:"🎿"},{id:"djokovic",name:"Novak Djoković",flag:"🇷🇸",sport:"tennis",years:"2003–",tagline:"Nole",achievements:["24 tytuły wielkoszlemowe — rekord wśród mężczyzn","Ponad 400 tygodni jako nr 1 rankingu ATP — najdłużej w historii","Złoto olimpijskie Paryż 2024 — dopełnienie „Złotego Szlema kariery”"],bio:"Dzieciństwo spędził w Belgradzie bombardowanym podczas wojny — trenował na kortach obok krateru po pocisku. Słynie z niemal gumowej elastyczności i żelaznej diety, dzięki którym wygrywał turnieje wielkoszlemowe jeszcze po 36. roku życia.",emoji:"🧘"},{id:"biles",name:"Simone Biles",flag:"🇺🇸",sport:"olympics",years:"2013–",tagline:"GOAT gimnastyki",achievements:["Najbardziej utytułowana gimnastyczka w historii MŚ (ok. 30 medali)","11 medali olimpijskich, w tym 7 złotych (2016–2024)","5 elementów w przepisach nazwanych jej nazwiskiem"],bio:"Wykonuje ewolucje, których nie próbuje nikt inny — sędziowie celowo zaniżali ich wycenę, by zniechęcić naśladowczynie. W Tokio 2020 wycofała się z finałów, mówiąc otwarcie o zdrowiu psychicznym — i wróciła po złoto w Paryżu.",emoji:"🤸‍♀️"},{id:"marta",name:"Marta",flag:"🇧🇷",sport:"football",years:"2002–",tagline:"Pelé w spódnicy",achievements:["6× Piłkarka Roku FIFA — rekord wszech czasów","Pierwsza osoba ze strzelonym golem na pięciu mundialach z rzędu","Rekordzistka goli w historii mistrzostw świata (17 trafień)"],bio:"Marta Vieira da Silva jako dziewczynka w biednym Dois Riachos grała z chłopakami, bo dziewczęcych drużyn nie było. Sam Pelé nazwał ją „Pelé w spódnicy” — a ona przerosła jego mundialowy dorobek strzelecki.",emoji:"⚽"},{id:"zmarzlik",name:"Bartosz Zmarzlik",flag:"🇵🇱",sport:"motorsport",years:"2012–",tagline:"Władca żużla",achievements:["5× indywidualny mistrz świata (2019, 2020, 2022, 2023, 2024)","Najmłodszy zwycięzca turnieju Grand Prix w historii (20 lat)","Wielokrotny drużynowy mistrz świata z Polską"],bio:"Pierwsze zawody wygrywał na mini-żużlu jako kilkulatek pod okiem ojca. Dziś dominuje w cyklu Grand Prix tak, że rywale ścigają się o drugie miejsce — a żużel pozostaje jednym z niewielu sportów, w których Polak jest niekwestionowanym numerem 1 globu.",emoji:"🏍️"},{id:"woods",name:"Tiger Woods",flag:"🇺🇸",sport:"precision",years:"1996–",tagline:"Tiger",achievements:["15 tytułów wielkoszlemowych w golfie (drugi wynik w historii)","82 zwycięstwa w PGA Tour — wyrównany rekord wszech czasów","Masters 1997 wygrał w wieku 21 lat z rekordową przewagą 12 uderzeń"],bio:"Uczynił golf sportem globalnym i pierwszym, w którym zarobił miliard dolarów. Po latach kontuzji i skandali wygrał Masters 2019 — comeback okrzyknięto jednym z największych w historii sportu.",emoji:"🐯"},{id:"cristiano",name:"Cristiano Ronaldo",flag:"🇵🇹",sport:"football",years:"2002–",tagline:"CR7",achievements:["5 Złotych Piłek i 5 triumfów w Lidze Mistrzów","Rekordzista goli w historii reprezentacji narodowych","Mistrz Europy 2016 z Portugalią i najlepszy strzelec w dziejach Ligi Mistrzów"],bio:"Chłopak z Madery, który obsesyjną pracą zbudował ciało maszyny do goli i karierę na trzy dekady. Jego wieczna rywalizacja z Messim podzieliła kibiców na całym świecie na dwa obozy.",emoji:"✈️"},{id:"tyson",name:"Mike Tyson",flag:"🇺🇸",sport:"combat",years:"1985–2005",tagline:"Iron Mike",achievements:["Najmłodszy mistrz świata wagi ciężkiej w historii (20 lat)","Pierwszy niekwestionowany mistrz WBA, WBC i IBF jednocześnie","19 pierwszych walk zawodowych wygranych przez nokaut"],bio:"Z brooklynskiego poprawczaka trafił pod skrzydła legendarnego trenera Cusa D'Amato i sterroryzował całą kategorię ciężką. Kariera pełna upadków i powrotów uczyniła go jedną z najbardziej rozpoznawalnych twarzy sportu XX wieku.",emoji:"🐅"},{id:"korzeniowski",name:"Robert Korzeniowski",flag:"🇵🇱",sport:"athletics",years:"1988–2004",tagline:"Król chodu",achievements:["4 złote medale olimpijskie (1996, 2000×2, 2004) — rekord w chodzie sportowym","Jedyny w historii dublet 20 km i 50 km na jednych igrzyskach (Sydney 2000)","3× mistrz świata na 50 km"],bio:"W Barcelonie 1992 zdyskwalifikowano go na oczach świata tuż przed metą, gdy szedł po medal. Odpowiedział perfekcjonizmem: przez kolejne trzy igrzyska nie dał się wyprzedzić nikomu i uczynił chód polską dyscypliną narodową.",emoji:"🚶"},{id:"radwanska",name:"Agnieszka Radwańska",flag:"🇵🇱",sport:"tennis",years:"2005–2018",tagline:"Ninja",achievements:["Finał Wimbledonu 2012 — pierwszy polski finał wielkoszlemowy w singlu od 73 lat","Triumf w WTA Finals 2015 i nr 2 światowego rankingu","20 tytułów WTA i wielokrotna zwyciężczyni plebiscytu na zagranie roku"],bio:"Nazywano ją „Ninją”, bo braki siłowe nadrabiała magią: lobami, skrótami i zagraniami zza pleców, które regularnie wygrywały plebiscyty na najefektowniejsze uderzenia sezonu. Otworzyła drzwi, którymi później weszła Iga Świątek.",emoji:"🥷"},{id:"deyna",name:"Kazimierz Deyna",flag:"🇵🇱",sport:"football",years:"1966–1984",tagline:"Kaka",achievements:["Kapitan „Orłów Górskiego” — 3. miejsce MŚ 1974","Złoto olimpijskie 1972 i korona króla strzelców turnieju (9 goli)","97 meczów i 41 goli w reprezentacji, legenda Legii Warszawa"],bio:"Mistrz podkręcanych „rogalów” prosto z rzutu rożnego. Zagrał u boku Pelégo i Stallone'a w filmie „Ucieczka do zwycięstwa”. Zginął w wypadku samochodowym w San Diego w 1989 roku — jego numer 10 Legia zastrzegła na zawsze.",emoji:"🎩"},{id:"boniek",name:"Zbigniew Boniek",flag:"🇵🇱",sport:"football",years:"1975–1988",tagline:"Bello di notte",achievements:["3. miejsce MŚ 1982 z pamiętnym hat-trickiem przeciwko Belgii","Puchar Europy 1985 i Puchar Zdobywców Pucharów z Juventusem","Później prezes PZPN i wiceprezydent UEFA"],bio:"Gianni Agnelli ochrzcił go „Bello di notte” — „piękny nocą” — bo w meczach przy jupiterach grał najlepiej. Po karierze wspiął się na sam szczyt futbolowej dyplomacji, jako pierwszy Polak w ścisłych władzach UEFA.",emoji:"🌙"},{id:"gorski",name:"Kazimierz Górski",flag:"🇵🇱",sport:"football",years:"trener, 1966–1976",tagline:"Trener Tysiąclecia",achievements:["Złoto olimpijskie 1972 — pierwszy wielki triumf polskiej piłki","3. miejsce na MŚ 1974 z drużyną „Orłów”","Srebro olimpijskie 1976 w Montrealu"],bio:"Stworzył najlepszą drużynę w historii polskiego futbolu i szkołę myślenia o grze streszczoną w kultowych „górskizmach”: „Piłka jest okrągła, a bramki są dwie”. W plebiscycie PZPN wybrano go Trenerem Tysiąclecia.",emoji:"🎓"},{id:"stoch",name:"Kamil Stoch",flag:"🇵🇱",sport:"winter",years:"2003–",tagline:"Orzeł z Zębu",achievements:["3 indywidualne złota olimpijskie (Soczi 2014 ×2, Pjongczang 2018)","3× zwycięzca Turnieju Czterech Skoczni, w tym z kompletem wygranych (2017/18)","Mistrz świata i dwukrotny zdobywca Kryształowej Kuli"],bio:"Dorastał w Zębie, najwyżej położonej wsi Polski, i jako dziecko skakał na nartach po okolicznych pagórkach. Tylko on, Ahonen i Nykänen mają trzy indywidualne złota olimpijskie w skokach — a Stoch dołożył do nich reputację jednego z najskromniejszych mistrzów sportu.",emoji:"🦅"},{id:"wlodarczyk",name:"Anita Włodarczyk",flag:"🇵🇱",sport:"athletics",years:"2008–",tagline:"Królowa młota",achievements:["3× mistrzyni olimpijska (2012, 2016, 2020) — jedyna lekkoatletka z trzema złotami w jednej konkurencji indywidualnej","Rekord świata 82,98 m i pierwsza kobieta w historii ponad 80 metrów","Wieloletnia seria kilkudziesięciu wygranych zawodów z rzędu"],bio:"Zdominowała rzut młotem tak, że przez lata rywalki walczyły wyłącznie o drugie miejsce. Złoto z Londynu 2012 odebrała dopiero po latach, gdy dopingowiczce odebrano tytuł — swój medal otrzymała na specjalnej ceremonii na Stadionie Narodowym.",emoji:"🔨"},{id:"jedrzejczak",name:"Otylia Jędrzejczak",flag:"🇵🇱",sport:"water",years:"1998–2012",tagline:"Złota rybka",achievements:["Złoto olimpijskie na 200 m motylkiem (Ateny 2004) i dwa srebra na tych samych igrzyskach","Rekordzistka świata na 200 m stylem motylkowym","Pierwsza polska pływaczka ze złotem olimpijskim"],bio:"Swój złoty medal z Aten zlicytowała, a pieniądze przekazała na leczenie dzieci chorych na białaczkę. Po ciężkim wypadku samochodowym w 2005 roku wróciła na basen i jeszcze zdobywała medale mistrzostw świata i Europy.",emoji:"🦋"},{id:"fibak",name:"Wojciech Fibak",flag:"🇵🇱",sport:"tennis",years:"1973–1988",tagline:"Pionier",achievements:["Finał turnieju Masters 1976 — największy sukces polskiego tenisa XX wieku","Nr 10 światowego rankingu ATP w singlu i kilkanaście tytułów","Kilkadziesiąt tytułów deblowych, mentor młodego Ivana Lendla"],bio:"W czasach PRL-u samotnie przecierał polskie szlaki w światowym tenisie — z Poznania trafił na salony Paryża i Nowego Jorku. Po karierze został znanym marszandem; jego kolekcja malarstwa polskiego należała do najcenniejszych prywatnych zbiorów.",emoji:"🎨"},{id:"lato",name:"Grzegorz Lato",flag:"🇵🇱",sport:"football",years:"1971–1984",tagline:"Król strzelców mundialu",achievements:["Król strzelców MŚ 1974 (7 goli) — jedyny Polak z tą koroną","Dwa medale mundialu (1974, 1982) i złoto olimpijskie 1972","100 meczów i 45 goli w reprezentacji Polski"],bio:"Łysiejący skrzydłowy ze Stali Mielec biegał tak szybko, że na mundialu w RFN nie nadążały za nim najlepsze obrony świata. Wszystkie 7 bramek z 1974 roku strzelił... nogami i głową w polu karnym — żadnej z rzutu wolnego czy karnego.",emoji:"👟"},{id:"szurkowski",name:"Ryszard Szurkowski",flag:"🇵🇱",sport:"cycling",years:"1966–1983",tagline:"Kolarz stulecia",achievements:["4× zwycięzca Wyścigu Pokoju — rekord wszech czasów","Mistrz świata amatorów (1973) i dwukrotny wicemistrz olimpijski","Kilkanaście etapowych triumfów w najważniejszym wyścigu bloku wschodniego"],bio:"W czasach, gdy Wyścig Pokoju elektryzował Polskę jak dziś mundiale, Szurkowski był królem szos — spawaczem z Wrocławia, który ogrywał zawodowców. W 2018 roku uległ ciężkiemu wypadkowi na wyścigu weteranów; zmarł w 2021, żegnany jak bohater narodowy.",emoji:"🚴"},{id:"pudzianowski",name:"Mariusz Pudzianowski",flag:"🇵🇱",sport:"strength",years:"1999–",tagline:"Pudzian",achievements:["5× World's Strongest Man (2002–2008) — rekord wszech czasów","Ponad 40 zwycięstw w zawodach strongman","Druga kariera w MMA — główne walki gal KSW przez ponad dekadę"],bio:"Dominował wśród siłaczy jak nikt przed nim ani po nim, a mając 31 lat zaczął od zera karierę w MMA — i wygrywał w klatce z zawodowcami. Jego walki biły rekordy oglądalności polskiej telewizji.",emoji:"💪"},{id:"wagner",name:"Hubert Wagner",flag:"🇵🇱",sport:"volleyball",years:"1960–1996",tagline:"Kat",achievements:["Mistrzostwo świata 1974 jako trener reprezentacji","Złoto olimpijskie w Montrealu 1976","Uznawany za jednego z najwybitniejszych trenerów w historii polskiego sportu"],bio:"Były reprezentant Polski, który jako trener zasłynął z morderczych treningów i bezkompromisowości — stąd przydomek „Kat”. W ciągu trzech lat zbudował drużynę, która wygrała mistrzostwa świata i igrzyska olimpijskie.",emoji:"🏐"},{id:"wilimowski",name:"Ernest Wilimowski",flag:"🇵🇱",sport:"football",years:"1934–1939",tagline:"Ezi",achievements:["4 gole w meczu z Brazylią na mundialu 1938","21 goli w 22 meczach reprezentacji Polski","Gwiazda Ruchu Wielkie Hajduki (dziś Ruch Chorzów)"],bio:"Urodzony w Katowicach napastnik był najskuteczniejszym polskim piłkarzem przedwojnia. Po wybuchu wojny grał w reprezentacji Niemiec, przez co w PRL jego nazwisko przez lata pomijano.",emoji:"⚽"},{id:"lubanski",name:"Włodzimierz Lubański",flag:"🇵🇱",sport:"football",years:"1963–1985",tagline:"Gwiazda Górnika",achievements:["Złoto olimpijskie w Monachium 1972","Finał Pucharu Zdobywców Pucharów 1970 z Górnikiem Zabrze","48 goli w reprezentacji — rekord, który pobił dopiero Robert Lewandowski"],bio:"W reprezentacji zadebiutował jako 16-latek. Ciężka kontuzja w meczu z Anglią w 1973 roku sprawiła, że nie pojechał na mundial 1974, na którym Polska zajęła trzecie miejsce.",emoji:"🎯"},{id:"marusarz",name:"Stanisław Marusarz",flag:"🇵🇱",sport:"skijumping",years:"1930–1957",tagline:"Dziadek polskich skoków",achievements:["Wicemistrz świata w skokach (Lahti 1938)","Wszechstronny narciarz: skoki, biegi i kombinacja norweska","Jego imię nosi Wielka Krokiew w Zakopanem"],bio:"W czasie wojny był kurierem przeprowadzającym ludzi przez Tatry. Aresztowany przez Niemców i skazany na śmierć, uciekł z więzienia.",emoji:"🦅"},{id:"fortuna",name:"Wojciech Fortuna",flag:"🇵🇱",sport:"skijumping",years:"1968–1975",tagline:"Mistrz z Sapporo",achievements:["Złoto olimpijskie w Sapporo 1972 — pierwsze zimowe złoto Polski","Wygrał dzięki skokowi na 111 metrów w pierwszej serii","Przez blisko 30 lat jedyny polski medalista igrzysk w skokach"],bio:"Do Sapporo jechał jako mało znany skoczek z Zakopanego. Rekordowy skok w pierwszej serii dał mu przewagę, którą obronił o zaledwie dziesiątą część punktu.",emoji:"🍀"},{id:"konopacka",name:"Halina Konopacka",flag:"🇵🇱",sport:"athletics",years:"1925–1931",tagline:"Pierwsza złota",achievements:["Pierwsze w historii złoto olimpijskie dla Polski (dysk, 1928)","Pierwszy oficjalny rekord świata ustanowiony przez Polkę (1926)","Poetka i kierowca rajdowy"],bio:"Wszechstronna sportsmenka, która poza rzutem dyskiem uprawiała też tenis. We wrześniu 1939 roku pomagała wywieźć z kraju polskie rezerwy złota.",emoji:"🥏"},{id:"kusocinski",name:"Janusz Kusociński",flag:"🇵🇱",sport:"athletics",years:"1928–1939",tagline:"Kusy",achievements:["Złoto olimpijskie na 10 000 m (Los Angeles 1932)","Rekordy świata na 3000 m i 4 mile","Patron memoriału lekkoatletycznego rozgrywanego od 1954 roku"],bio:"W 1939 roku walczył w obronie Warszawy, a potem działał w konspiracji. Aresztowany przez Niemców, został rozstrzelany w Palmirach w 1940 roku.",emoji:"🏃"},{id:"malinowski",name:"Bronisław Malinowski",flag:"🇵🇱",sport:"athletics",years:"1970–1981",tagline:"Mistrz przeszkód",achievements:["Złoto olimpijskie na 3000 m z przeszkodami (Moskwa 1980)","Srebro olimpijskie w Montrealu 1976","Dwukrotny mistrz Europy (1974, 1978)"],bio:"Słynął z mocnego finiszu, którym w Moskwie wyprzedził faworyta. Zginął w wypadku samochodowym w Grudziądzu w 1981 roku, mając zaledwie 30 lat.",emoji:"🏃‍♂️"},{id:"gollob",name:"Tomasz Gollob",flag:"🇵🇱",sport:"motorsport",years:"1988–2017",tagline:"Wielki mistrz żużla",achievements:["Indywidualny mistrz świata na żużlu (2010)","Wielokrotny drużynowy mistrz świata z reprezentacją Polski","Wielokrotny indywidualny mistrz Polski"],bio:"Przez dwie dekady był najlepszym polskim żużlowcem, a na tytuł mistrza świata czekał aż do 39. roku życia. W 2017 roku podczas treningu motocrossowego doznał urazu kręgosłupa, który przykuł go do wózka.",emoji:"🏍️"},{id:"stamm",name:"Feliks Stamm",flag:"🇵🇱",sport:"combat",years:"1936–1968",tagline:"Papa",achievements:["Trener reprezentacji Polski przez ponad 30 lat","Wychowawca wielu medalistów olimpijskich","Twórca „polskiej szkoły boksu”"],bio:"Zawodnicy mówili o nim „Papa”. Stawiał na technikę, szybkość i myślenie w ringu zamiast siłowej wymiany ciosów — dzięki temu polscy pięściarze przez lata należeli do najlepszych na świecie.",emoji:"🥊"},{id:"kulej",name:"Jerzy Kulej",flag:"🇵🇱",sport:"combat",years:"1960–1972",tagline:"Dwa złota",achievements:["Dwukrotny mistrz olimpijski (Tokio 1964, Meksyk 1968)","Dwukrotny mistrz Europy","Jedyny polski bokser, który obronił złoto olimpijskie"],bio:"Wychowanek „szkoły Stamma” z Częstochowy. Po karierze był komentatorem, wystąpił w filmach, a w latach 2001–2005 zasiadał w Sejmie.",emoji:"🥇"},{id:"michalczewski",name:"Dariusz Michalczewski",flag:"🇵🇱",sport:"combat",years:"1988–2005",tagline:"Tygrys",achievements:["Mistrz świata WBO w wadze półciężkiej (1994–2003)","23 obrony tytułu","48 zawodowych walk bez porażki"],bio:"W 1988 roku pozostał w Niemczech, gdzie zrobił zawodową karierę i stał się jedną z największych gwiazd niemieckiej telewizji. Pierwszą porażkę poniósł dopiero w 49. walce.",emoji:"🐯"},{id:"adamek",name:"Tomasz Adamek",flag:"🇵🇱",sport:"combat",years:"1999–2018",tagline:"Góral",achievements:["Mistrz świata WBC w wadze półciężkiej (2005)","Mistrz świata IBF w wadze junior ciężkiej (2008)","Walka o mistrzostwo wagi ciężkiej z Witalijem Kliczką (2011)"],bio:"Pochodzi z Gilowic na Żywiecczyźnie
