 przemian kolorami. Na pustą kolumnę możesz położyć dowolną kartę."},{heading:"Kilka kart naraz",text:"Kilka kart naraz przeniesiesz, jeśli masz dość wolnych komórek i pustych kolumn."},{heading:"Podwójne dotknięcie",text:"Karta sama idzie na stos docelowy, a jeśli nie pasuje — na kolumnę, a w ostateczności do wolnej komórki. Asy, dwójki i niepotrzebne już karty gra odkłada sama."},{heading:"Wskazówka",text:"Niemal każde rozdanie da się wygrać!"}]},spider:{title:"🕷️ Pasjans Pająk",sections:[{heading:"Cel",text:"Ułóż 8 pełnych sekwencji od króla do asa w jednym kolorze. Każda ułożona sekwencja znika ze stołu."},{heading:"Kolory",text:"Wariant wybierasz w menu: 1 kolor (łatwy), 2 kolory (średni) albo 4 kolory (trudny)."},{heading:"Kolumny",text:"10 kolumn. Kartę kładziesz na dowolną kartę o jeden wyższą, ale razem przeniesiesz tylko malejący ciąg w jednym kolorze."},{heading:"Talia",text:"Przycisk „Rozdaj” dokłada po jednej nowej karcie do każdej kolumny (5 rozdań)."},{heading:"Puste kolumny",text:"Możesz na nie położyć dowolną kartę lub ciąg kart."},{heading:"Podwójne dotknięcie",text:"Karta razem z ciągiem na niej sama przechodzi na kolumnę z kartą o jeden wyższą (albo na pustą)."},{heading:"Wskazówka",text:"Opróżniaj kolumny jak najwcześniej — łatwiej wtedy przestawiać karty."}]},tripeaks:{title:"🏔️ TriPeaks",sections:[{heading:"Cel",text:"Zbierz wszystkie 28 kart z trzech szczytów."},{heading:"Ruch",text:"Dotknij odkrytej karty o jeden wyższej albo niższej od karty na stosie na dole — przejdzie na stos. As i król sąsiadują (K–A–2)."},{heading:"Talia",text:"Gdy nic nie pasuje, dotknij talii: nowa karta trafi na stos. Talii nie da się przejść drugi raz."},{heading:"Seria",text:"Licznik 🔥 pokazuje, ile kart zebrano z rzędu bez sięgania do talii."},{heading:"Wskazówka",text:"Wybieraj karty, które odkryją najwięcej zakrytych — i planuj długie serie."}]},pyramid:{title:"🔺 Piramida",sections:[{heading:"Cel",text:"Rozbierz całą piramidę z 28 kart."},{heading:"Pary",text:"
