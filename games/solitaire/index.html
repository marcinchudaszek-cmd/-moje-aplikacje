",text:"8 kolumn, wszystkie karty odkryte od początku."},{heading:"Ruchy",text:"W kolumnach karty układasz malejąco, na przemian kolorami. Na pustą kolumnę możesz położyć dowolną kartę."},{heading:"Kilka kart naraz",text:"Kilka kart naraz przeniesiesz, jeśli masz dość wolnych komórek i pustych kolumn."},{heading:"Podwójne dotknięcie",text:"Karta sama idzie na stos docelowy, a jeśli nie pasuje — na kolumnę, a w ostateczności do wolnej komórki. Asy, dwójki i niepotrzebne już karty gra odkłada sama."},{heading:"Wskazówka",text:"Niemal każde rozdanie da się wygrać!"}]},spider:{title:"🕷️ Pasjans Pająk",sections:[{heading:"Cel",text:"Ułóż 8 pełnych sekwencji od króla do asa (same piki). Każda ułożona sekwencja znika ze stołu."},{heading:"Kolumny",text:"10 kolumn. Kartę albo malejący ciąg kart kładziesz na kartę o jeden wyższą."},{heading:"Talia",text:"Przycisk „Rozdaj” dokłada po jednej nowej karcie do każdej kolumny (5 rozdań)."},{heading:"Puste kolumny",text:"Możesz na nie położyć dowolną kartę lub ciąg kart."},{heading:"Podwójne dotknięcie",text:"Karta razem z ciągiem na niej sama przechodzi na kolumnę z kartą o jeden wyższą (albo na pustą)."},{heading:"Wskazówka",text:"Opróżniaj kolumny jak najwcześniej — łatwiej wtedy przestawiać karty."}]}},Nf=({game:f,onClose:o})=>{const r=c0[f],s=v=>{v.target===v.currentTarget&&o()};return b.jsx("div",{className:"modal-overlay",onClick:s,children:b.jsxs("div",{className:"modal-box",children:[b.jsx("button",{className:"modal-close",onClick:o,"aria-label":"Zamknij",children:"×"}),b.jsx("h2",{className:"modal-title",children:r.title}),r.sections.map((v,p)=>b.jsxs("div",{className:"modal-section",children:[b.jsx("h3",{children:v.heading}),b.jsx("p",{children:v.text})]},p))]})})},kd=28,i0=({cards:f,x:o,y:r,cardW:s,cardH:v})=>b.jsx("div",{className:"drag-ghost",style:{left:o,top:r,width:s,height:v+(f.length-1)*kd},children:f.map((p,q)=>b.jsx(Bt,{card:p,style:{position:"absolute",top:q*kd,left:0,zIndex:q+1}},p.id))}),Jd=({onDrop:f,classN
