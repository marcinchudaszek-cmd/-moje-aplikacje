<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Tetris — klasyczna gra logiczna z systemem SRS, trzymaniem klocka, cieniem i poziomami trudności. Graj w przeglądarce.">
<title>Tetris — Beagle Apps Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Crect x='10' y='10' width='20' height='20' fill='%2300e5ff'/%3E%3Crect x='34' y='10' width='20' height='20' fill='%23ffd400'/%3E%3Crect x='10' y='34' width='20' height='20' fill='%23c026d3'/%3E%3Crect x='34' y='34' width='20' height='20' fill='%2322c55e'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b1020; --panel:rgba(255,255,255,.055); --border:rgba(255,255,255,.12);
  --text:#e9edf7; --muted:#93a0bd; --accent:#00e5ff; --accent2:#c026d3;
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background:radial-gradient(1200px 700px at 50% -10%,#17203f 0%,var(--bg) 60%);
  color:var(--text);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding:14px; overflow:hidden; touch-action:manipulation;
}
.wrap{display:flex;gap:20px;align-items:flex-start;max-width:100%}
.stage{position:relative}
canvas#board{
  display:block;border-radius:14px;background:rgba(0,0,0,.42);max-width:100%;
  border:1px solid var(--border);box-shadow:0 24px 70px rgba(0,0,0,.55);touch-action:none;
}
.side{display:flex;flex-direction:column;gap:12px;min-width:150px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
.card h2{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.val{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.val.sm{font-size:1.1rem}
.row{display:flex;gap:10px}
.row .card{flex:1}
canvas.mini{display:block;background:rgba(0,0,0,.3);border-radius:8px}
.hint{font-size:.72rem;color:var(--muted);line-height:1.85}
.hint b{color:var(--text);font-weight:600;background:rgba(255,255,255,.09);padding:1px 6px;border-radius:5px;font-size:.7rem}
.brand{font-size:.68rem;color:var(--muted);text-align:center}
.brand a{color:var(--accent);text-decoration:none}
/* overlay */
.overlay{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:rgba(6,10,22,.9);backdrop-filter:blur(6px);border-radius:14px;text-align:center;padding:20px;
}
.overlay.show{display:flex}
.overlay h1{font-size:1.9rem;font-weight:900;letter-spacing:.04em;
  background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.overlay p{color:var(--muted);font-size:.88rem;max-width:270px;line-height:1.6}
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:.95rem;
  padding:13px 30px;border-radius:50px;color:#04121a;
  background:linear-gradient(135deg,var(--accent),#39f0b0);box-shadow:0 10px 26px rgba(0,229,255,.28);
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);box-shadow:none}
.levels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lvl{padding:9px 16px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--muted);
  cursor:pointer;font-family:inherit;font-weight:600;font-size:.82rem}
.lvl.active{background:rgba(0,229,255,.16);border-color:var(--accent);color:var(--text)}
/* dotykowe sterowanie */
.touch{display:none;gap:8px;margin-top:12px}
.touch button{
  flex:1;padding:15px 0;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:1.15rem;font-family:inherit;cursor:pointer;
}
.touch button:active{background:rgba(0,229,255,.18)}
@media (max-width:820px){
  body{justify-content:flex-start;padding:6px;gap:8px}
  .wrap{flex-direction:column;gap:8px;align-items:center;width:100%}
  .side{flex-direction:row;flex-wrap:wrap;min-width:0;width:100%;gap:6px;justify-content:center}
  .side .card{flex:1;min-width:70px;padding:7px 8px}
  .side h2{font-size:.6rem;margin-bottom:3px}
  .val{font-size:1rem}
  .val.sm{font-size:.95rem}
  .hintCard,.brand{display:none}
  .touch{display:flex;width:100%;max-width:430px;margin:0 auto}
  .touch button{padding:16px 0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="board"></canvas>
    <div class="overlay show" id="overlay">
      <h1 id="ovTitle">TETRIS</h1>
      <p id="ovText">Ustaw klocki tak, aby wypełnić cały rząd — zniknie i dostaniesz punkty.</p>
      <div class="levels" id="levels"></div>
      <button class="btn" id="startBtn">Graj</button>
    </div>
  </div>

  <div class="side">
    <div class="card"><h2>Wynik</h2><div class="val" id="score">0</div></div>
    <div class="row">
      <div class="card"><h2>Poziom</h2><div class="val sm" id="level">1</div></div>
      <div class="card"><h2>Linie</h2><div class="val sm" id="lines">0</div></div>
    </div>
    <div class="card"><h2>Rekord</h2><div class="val sm" id="best">0</div></div>
    <div class="card"><h2>Następne</h2><canvas class="mini" id="next" width="120" height="250"></canvas></div>
    <div class="card"><h2>Trzymany</h2><canvas class="mini" id="hold" width="120" height="76"></canvas></div>
    <div class="card hintCard">
      <h2>Sterowanie</h2>
      <div class="hint">
        <b>←</b> <b>→</b> ruch<br>
        <b>↑</b> / <b>X</b> obrót<br>
        <b>↓</b> miękki zrzut<br>
        <b>Spacja</b> twardy zrzut<br>
        <b>C</b> / <b>Shift</b> trzymaj<br>
        <b>P</b> pauza
      </div>
    </div>
    <div class="brand">Beagle Apps Studio · <a href="https://beagleapps.pl">beagleapps.pl</a></div>
  </div>
</div>

<div class="touch" id="touch" style="max-width:420px;width:100%">
  <button id="tLeft" aria-label="w lewo">◀</button>
  <button id="tRight" aria-label="w prawo">▶</button>
  <button id="tRot" aria-label="obróć">⟳</button>
  <button id="tDown" aria-label="w dół">▼</button>
  <button id="tDrop" aria-label="zrzut">⤓</button>
  <button id="tHold" aria-label="trzymaj">⇄</button>
</div>

<script>
(function(){
"use strict";

// ---------- Plansza ----------
var COLS = 10, ROWS = 20, HIDDEN = 2;      // 2 ukryte rzędy na start klocka
var TOTAL_ROWS = ROWS + HIDDEN;

var COLORS = {
  I:'#00e5ff', J:'#3b82f6', L:'#f59e0b', O:'#ffd400',
  S:'#22c55e', T:'#c026d3', Z:'#ef4444'
};

// Kształty w 4 obrotach — indeksy [rotacja][blok] = {x,y}
var SHAPES = {
  I:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
  J:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
  L:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]],
  O:[[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
  S:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
  T:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
  Z:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]]
};

// Kopnięcia ścienne (SRS): [rotacjaZ][kierunek] -> lista przesunięć
var KICKS = {
  normal:{
    '0>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]], '1>0':[[0,0],[1,0],[1,-1],[0,2],[1,2]],
    '1>2':[[0,0],[1,0],[1,-1],[0,2],[1,2]],     '2>1':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '2>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],    '3>2':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '3>0':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],  '0>3':[[0,0],[1,0],[1,1],[0,-2],[1,-2]]
  },
  I:{
    '0>1':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],   '1>0':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],
    '1>2':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]],   '2>1':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
    '2>3':[[0,0],[2,0],[-1,0],[2,1],[-1,-2]],   '3>2':[[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
    '3>0':[[0,0],[1,0],[-2,0],[1,-2],[-2,1]],   '0>3':[[0,0],[-1,0],[2,0],[-1,2],[2,-1]]
  }
};

// ---------- Stan ----------
var board, cur, nextQueue, holdPiece, canHold, bag;
var score, lines, level, startLevel, dropTimer, dropInterval, lastTime;
var running = false, paused = false, over = false, rafId = null;
var lockDelay = 0, LOCK_MS = 500, lockResets;

var boardCv = document.getElementById('board'), bctx = boardCv.getContext('2d');
var nextCv  = document.getElementById('next'),  nctx = nextCv.getContext('2d');
var holdCv  = document.getElementById('hold'),  hctx = holdCv.getContext('2d');
var CELL = 30;

var miniPoziomo = false;

function fitCanvas(){
  var mobile = window.innerWidth < 820;
  miniPoziomo = mobile;

  // na telefonie rezerwujemy miejsce na pasek statystyk, podglądy i przyciski
  var zajete = mobile ? 250 : 40;
  var maxH = Math.min(window.innerHeight - zajete, 640);
  var maxW = mobile ? window.innerWidth - 20 : 380;
  CELL = Math.max(12, Math.floor(Math.min(maxW / COLS, maxH / ROWS)));
  boardCv.width = CELL * COLS;
  boardCv.height = CELL * ROWS;

  if (mobile){
    nextCv.width = 168; nextCv.height = 44;
    holdCv.width = 60;  holdCv.height = 44;
  } else {
    nextCv.width = 120; nextCv.height = 250;
    holdCv.width = 120; holdCv.height = 76;
  }
  drawNext(); drawHold(); draw();
}

function emptyBoard(){
  var b = [];
  for (var y = 0; y < TOTAL_ROWS; y++){ b.push(new Array(COLS).fill(null)); }
  return b;
}

// worek 7 klocków — gwarantuje sprawiedliwe losowanie
function refillBag(){
  var types = ['I','J','L','O','S','T','Z'];
  for (var i = types.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = types[i]; types[i] = types[j]; types[j] = t;
  }
  bag = bag.concat(types);
}
function nextType(){ if (bag.length < 7) refillBag(); return bag.shift(); }

function spawn(type){
  return { type: type, rot: 0, x: type === 'I' ? 3 : 3, y: 0 };
}

function cells(piece, rot, x, y){
  var r = (rot === undefined) ? piece.rot : rot;
  var px = (x === undefined) ? piece.x : x;
  var py = (y === undefined) ? piece.y : y;
  return SHAPES[piece.type][((r % 4) + 4) % 4].map(function(c){
    return { x: px + c[0], y: py + c[1] };
  });
}

function collides(piece, rot, x, y){
  var cs = cells(piece, rot, x, y);
  for (var i = 0; i < cs.length; i++){
    var c = cs[i];
    if (c.x < 0 || c.x >= COLS || c.y >= TOTAL_ROWS) return true;
    if (c.y >= 0 && board[c.y][c.x]) return true;
  }
  return false;
}

function tryRotate(dir){
  if (!cur || cur.type === 'O') return false;
  var from = cur.rot, to = ((cur.rot + dir) % 4 + 4) % 4;
  var table = (cur.type === 'I') ? KICKS.I : KICKS.normal;
  var kicks = table[from + '>' + to] || [[0,0]];
  for (var i = 0; i < kicks.length; i++){
    var dx = kicks[i][0], dy = -kicks[i][1]; // y w SRS rośnie w górę, u nas w dół
    if (!collides(cur, to, cur.x + dx, cur.y + dy)){
      cur.rot = to; cur.x += dx; cur.y += dy;
      resetLock();
      return true;
    }
  }
  return false;
}

function move(dx){
  if (!cur || !running || paused) return;
  if (!collides(cur, cur.rot, cur.x + dx, cur.y)){ cur.x += dx; resetLock(); draw(); }
}

function softDrop(){
  if (!cur || !running || paused) return;
  if (!collides(cur, cur.rot, cur.x, cur.y + 1)){ cur.y++; score += 1; updateHud(); dropTimer = 0; draw(); }
  else { lockNow(); }
}

function hardDrop(){
  if (!cur || !running || paused) return;
  var d = 0;
  while (!collides(cur, cur.rot, cur.x, cur.y + 1)){ cur.y++; d++; }
  score += d * 2;
  updateHud();
  lockNow();
}

function resetLock(){ if (lockResets < 15){ lockDelay = 0; lockResets++; } }

function hold(){
  if (!cur || !running || paused || !canHold) return;
  var t = cur.type;
  if (holdPiece){ cur = spawn(holdPiece); }
  else { cur = spawn(nextQueue.shift()); nextQueue.push(nextType()); }
  holdPiece = t; canHold = false;
  if (collides(cur, cur.rot, cur.x, cur.y)) return gameOver();
  drawHold(); drawNext(); draw();
}

function lockNow(){
  var cs = cells(cur);
  for (var i = 0; i < cs.length; i++){
    var c = cs[i];
    if (c.y >= 0 && c.y < TOTAL_ROWS) board[c.y][c.x] = cur.type;
  }
  clearLines();
  cur = spawn(nextQueue.shift());
  nextQueue.push(nextType());
  canHold = true; lockDelay = 0; lockResets = 0;
  if (collides(cur, cur.rot, cur.x, cur.y)) return gameOver();
  drawNext(); draw();
}

function clearLines(){
  var cleared = 0;
  for (var y = TOTAL_ROWS - 1; y >= 0; y--){
    var full = true;
    for (var x = 0; x < COLS; x++){ if (!board[y][x]){ full = false; break; } }
    if (full){
      board.splice(y, 1);
      board.unshift(new Array(COLS).fill(null));
      cleared++; y++;
    }
  }
  if (cleared){
    var pts = [0, 100, 300, 500, 800][cleared] * level;
    score += pts; lines += cleared;
    var newLevel = Math.floor(lines / 10) + startLevel;
    if (newLevel > level){ level = newLevel; dropInterval = speedFor(level); }
    updateHud();
  }
}

function speedFor(l){ return Math.max(60, Math.round(1000 * Math.pow(0.8, l - 1))); }

// ---------- Rysowanie ----------
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function block(ctx, x, y, size, color, alpha, ghost){
  var pad = Math.max(1, Math.floor(size * 0.07));
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  if (ghost){
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, size * 0.09);
    roundRect(ctx, x + pad, y + pad, size - pad * 2, size - pad * 2, size * 0.18);
    ctx.stroke();
  } else {
    var g = ctx.createLinearGradient(x, y, x + size, y + size);
    g.addColorStop(0, color);
    g.addColorStop(1, shade(color, -28));
    ctx.fillStyle = g;
    roundRect(ctx, x + pad, y + pad, size - pad * 2, size - pad * 2, size * 0.18);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    roundRect(ctx, x + pad * 2, y + pad * 2, size - pad * 4, Math.max(2, size * 0.18), size * 0.1);
    ctx.fill();
  }
  ctx.restore();
}

function shade(hex, amt){
  var n = parseInt(hex.slice(1), 16);
  var r = Math.max(0, Math.min(255, (n >> 16) + amt));
  var g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + amt));
  var b = Math.max(0, Math.min(255, (n & 0xff) + amt));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function draw(){
  if (!board) return;
  var w = boardCv.width, h = boardCv.height;
  bctx.clearRect(0, 0, w, h);

  // siatka
  bctx.strokeStyle = 'rgba(255,255,255,.05)';
  bctx.lineWidth = 1;
  for (var x = 1; x < COLS; x++){
    bctx.beginPath(); bctx.moveTo(x * CELL + .5, 0); bctx.lineTo(x * CELL + .5, h); bctx.stroke();
  }
  for (var y = 1; y < ROWS; y++){
    bctx.beginPath(); bctx.moveTo(0, y * CELL + .5); bctx.lineTo(w, y * CELL + .5); bctx.stroke();
  }

  // ułożone klocki
  for (var by = HIDDEN; by < TOTAL_ROWS; by++){
    for (var bx = 0; bx < COLS; bx++){
      var t = board[by][bx];
      if (t) block(bctx, bx * CELL, (by - HIDDEN) * CELL, CELL, COLORS[t]);
    }
  }

  if (cur && running){
    // cień (podpowiedź, gdzie spadnie)
    var gy = cur.y;
    while (!collides(cur, cur.rot, cur.x, gy + 1)) gy++;
    if (gy !== cur.y){
      cells(cur, cur.rot, cur.x, gy).forEach(function(c){
        if (c.y >= HIDDEN) block(bctx, c.x * CELL, (c.y - HIDDEN) * CELL, CELL, COLORS[cur.type], .55, true);
      });
    }
    // aktywny klocek
    cells(cur).forEach(function(c){
      if (c.y >= HIDDEN) block(bctx, c.x * CELL, (c.y - HIDDEN) * CELL, CELL, COLORS[cur.type]);
    });
  }
}

function drawMini(ctx, cv, types){
  ctx.clearRect(0, 0, cv.width, cv.height);
  var n = Math.max(1, types.length);
  var s = miniPoziomo ? 9 : 18;                       // rozmiar bloczka
  var slot = miniPoziomo ? (cv.width / n) : 60;       // miejsce na jeden klocek

  types.forEach(function(type, i){
    if (!type) return;
    var cs = SHAPES[type][0];
    var xs = cs.map(function(c){ return c[0]; }), ys = cs.map(function(c){ return c[1]; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var wBlocks = maxX - minX + 1, hBlocks = maxY - minY + 1;
    var ox, oy;
    if (miniPoziomo){
      ox = i * slot + (slot - wBlocks * s) / 2 - minX * s;
      oy = (cv.height - hBlocks * s) / 2 - minY * s;
    } else {
      ox = (cv.width - wBlocks * s) / 2 - minX * s;
      oy = i * slot + (slot - hBlocks * s) / 2 - minY * s;
    }
    cs.forEach(function(c){ block(ctx, ox + c[0] * s, oy + c[1] * s, s, COLORS[type]); });
  });
}
function drawNext(){ drawMini(nctx, nextCv, nextQueue.slice(0, miniPoziomo ? 3 : 4)); }
function drawHold(){ drawMini(hctx, holdCv, [holdPiece]); }

// ---------- HUD ----------
function updateHud(){
  document.getElementById('score').textContent = score.toLocaleString('pl-PL');
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
}
function loadBest(){
  var b = 0;
  try { b = parseInt(localStorage.getItem('tetris_best') || '0', 10) || 0; } catch(e){}
  document.getElementById('best').textContent = b.toLocaleString('pl-PL');
  return b;
}
function saveBest(){
  try {
    var b = parseInt(localStorage.getItem('tetris_best') || '0', 10) || 0;
    if (score > b){ localStorage.setItem('tetris_best', String(score)); }
  } catch(e){}
  loadBest();
}

// ---------- Pętla ----------
function loop(ts){
  rafId = requestAnimationFrame(loop);
  if (!running || paused) { lastTime = ts; return; }
  if (!lastTime) lastTime = ts;
  // ograniczamy skok czasu (np. po powrocie z tła telefonu), żeby klocek
  // nie spadł ani nie zablokował się natychmiast
  var dt = Math.min(ts - lastTime, 100); lastTime = ts;

  if (collides(cur, cur.rot, cur.x, cur.y + 1)){
    lockDelay += dt;
    if (lockDelay >= LOCK_MS) lockNow();
  } else {
    lockDelay = 0;
    dropTimer += dt;
    if (dropTimer >= dropInterval){ dropTimer = 0; cur.y++; draw(); }
  }
}

// ---------- Sterowanie grą ----------
function startGame(){
  board = emptyBoard(); bag = []; refillBag();
  nextQueue = [nextType(), nextType(), nextType(), nextType()];
  holdPiece = null; canHold = true;
  score = 0; lines = 0; level = startLevel;
  dropInterval = speedFor(level); dropTimer = 0; lastTime = 0;
  lockDelay = 0; lockResets = 0;
  cur = spawn(nextQueue.shift()); nextQueue.push(nextType());
  running = true; paused = false; over = false;
  document.getElementById('overlay').classList.remove('show');
  updateHud(); drawNext(); drawHold(); fitCanvas(); draw();
  if (!rafId) rafId = requestAnimationFrame(loop);
}

function gameOver(){
  running = false; over = true;
  saveBest();
  showOverlay('Koniec gry', 'Wynik: ' + score.toLocaleString('pl-PL') + ' · linie: ' + lines + ' · poziom: ' + level, 'Zagraj ponownie');
}

function togglePause(){
  if (!running && !paused) return;
  if (over) return;
  paused = !paused;
  if (paused) showOverlay('Pauza', 'Gra wstrzymana.', 'Wróć do gry');
  else document.getElementById('overlay').classList.remove('show');
}

function showOverlay(title, text, btnLabel){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').textContent = text;
  document.getElementById('startBtn').textContent = btnLabel;
  document.getElementById('levels').style.display = over || !running ? 'flex' : 'none';
  document.getElementById('overlay').classList.add('show');
}

// wybór poziomu startowego
startLevel = 1;
(function buildLevels(){
  var wrap = document.getElementById('levels');
  [1,3,5,7,10].forEach(function(l){
    var b = document.createElement('button');
    b.className = 'lvl' + (l === 1 ? ' active' : '');
    b.textContent = 'Poziom ' + l;
    b.addEventListener('click', function(){
      startLevel = l;
      [].slice.call(wrap.children).forEach(function(c){ c.classList.remove('active'); });
      b.classList.add('active');
    });
    wrap.appendChild(b);
  });
})();

document.getElementById('startBtn').addEventListener('click', function(){
  if (paused && !over){ paused = false; document.getElementById('overlay').classList.remove('show'); return; }
  startGame();
});

// klawiatura
document.addEventListener('keydown', function(e){
  var k = e.key;
  if ([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(k) !== -1) e.preventDefault();
  if (!running){
    if (k === 'Enter' || k === ' ') { startGame(); }
    return;
  }
  if (k === 'p' || k === 'P'){ togglePause(); return; }
  if (paused) return;
  if (k === 'ArrowLeft') move(-1);
  else if (k === 'ArrowRight') move(1);
  else if (k === 'ArrowDown') softDrop();
  else if (k === 'ArrowUp' || k === 'x' || k === 'X'){ if (tryRotate(1)) draw(); }
  else if (k === 'z' || k === 'Z'){ if (tryRotate(-1)) draw(); }
  else if (k === ' ') hardDrop();
  else if (k === 'c' || k === 'C' || k === 'Shift') hold();
});

// dotyk: przyciski
function bindHold(id, fn){
  var el = document.getElementById(id), t = null;
  var start = function(e){ e.preventDefault(); fn(); t = setInterval(fn, 110); };
  var stop = function(){ if (t){ clearInterval(t); t = null; } };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend', stop);
  el.addEventListener('touchcancel', stop);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', stop);
  el.addEventListener('mouseleave', stop);
}
bindHold('tLeft', function(){ move(-1); });
bindHold('tRight', function(){ move(1); });
bindHold('tDown', softDrop);
document.getElementById('tRot').addEventListener('click', function(){ if (tryRotate(1)) draw(); });
document.getElementById('tDrop').addEventListener('click', hardDrop);
document.getElementById('tHold').addEventListener('click', hold);

// dotyk: gesty na planszy
(function(){
  var sx = 0, sy = 0, st = 0, moved = false;
  boardCv.addEventListener('touchstart', function(e){
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); moved = false;
  }, {passive:true});
  boardCv.addEventListener('touchmove', function(e){
    if (!running || paused) return;
    var t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)){
      move(dx > 0 ? 1 : -1); sx = t.clientX; moved = true;
    } else if (dy > 26){
      softDrop(); sy = t.clientY; moved = true;
    }
  }, {passive:true});
  boardCv.addEventListener('touchend', function(e){
    if (!running || paused) return;
    var dy = (e.changedTouches[0].clientY - sy);
    if (!moved && Date.now() - st < 250){ if (tryRotate(1)) draw(); }
    else if (dy > 90) hardDrop();
  }, {passive:true});
})();

window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', function(){ setTimeout(fitCanvas, 200); });

// telefon: wyjście z aplikacji / zablokowanie ekranu wstrzymuje grę zamiast ją psuć
document.addEventListener('visibilitychange', function(){
  if (document.hidden && running && !paused && !over){
    paused = true;
    showOverlay('Pauza', 'Gra wstrzymana.', 'Wróć do gry');
  }
  lastTime = 0;
});

// start
board = emptyBoard();
bag = []; refillBag();
nextQueue = [nextType(), nextType(), nextType(), nextType()];
holdPiece = null; score = 0; lines = 0; level = 1;
loadBest(); updateHud(); fitCanvas(); drawNext(); drawHold();
})();
</script>
