  </head>
  <body>
    <div class="stage">
      <div class="game">
        <canvas
          id="game-canvas"
          role="img"
          aria-label="Gra Asteroids. Sterowanie: strzałki obracają i dodają ciągu, spacja strzela, Shift to hiperskok, P pauzuje, M wycisza dźwięk."
        ></canvas>

        <div class="touch touch-left">
          <button type="button" class="btn btn-lg" data-hold="ArrowLeft" aria-label="Obrót w lewo">◀</button>
          <button type="button" class="btn btn-lg" data-hold="ArrowRight" aria-label="Obrót w prawo">▶</button>
          <button type="button" class="btn btn-hyper" data-tap="Shift" aria-label="Hiperskok">HYPER</button>
        </div>

        <div class="touch touch-right">
          <button type="button" class="btn btn-sm" data-hold="ArrowUp" aria-label="Ciąg">THRUST</button>
          <button type="button" class="btn btn-fire" data-hold=" " aria-label="Ogień">FIRE</button>
        </div>

        <form class="name-entry" id="name-entry" hidden>
          <label for="name-input">Wpisz imię do tabeli rekordów</label>
          <div class="name-row">
            <input
              id="name-input"
              type="text"
              maxlength="12"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              placeholder="GRACZ"
            />
            <button type="submit">ZAPISZ</button>
          </div>
        </form>

        <div class="hint" aria-hidden="true">
          <div>← → OBRÓT</div>
          <div>↑ CIĄG</div>
          <div>SPACJA OGIEŃ</div>
          <div>SHIFT HIPERSKOK</div>
          <div>P PAUZA · M DŹWIĘK</div>
        </div>
      </div>
    </div>
  </body>
</html>
